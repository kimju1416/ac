<meta charset="utf-8">
<title>OG</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Space+Grotesk:wght@600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{
  background:#0c0c0c;
  font-family:'Noto Sans KR',sans-serif;
  color:#f0f0ee;
  display:flex;
  position:relative;
}
/* 라임 글로우 (사이트 포인트색) */
body::before{
  content:'';position:absolute;left:-120px;top:-160px;width:620px;height:620px;
  background:radial-gradient(circle,rgba(184,240,60,.13) 0%,transparent 66%);
}
body::after{
  content:'';position:absolute;right:-80px;bottom:-180px;width:520px;height:520px;
  background:radial-gradient(circle,rgba(184,240,60,.07) 0%,transparent 68%);
}

.left{
  flex:1;padding:64px 0 60px 72px;display:flex;flex-direction:column;
  justify-content:center;position:relative;z-index:2;min-width:0;
}
.brand{
  font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;
  letter-spacing:-.03em;margin-bottom:30px;
}
.brand i{font-style:normal;color:#b8f03c;}

.title{
  font-size:82px;font-weight:700;line-height:1.08;letter-spacing:-.045em;
  margin-bottom:26px;word-break:keep-all;
}
.title em{font-style:normal;color:#b8f03c;}

.desc{
  font-size:23px;line-height:1.55;color:#a8a8a4;letter-spacing:-.015em;
  margin-bottom:28px;word-break:keep-all;
}
.desc b{color:#e4e4e0;font-weight:500;}

.tags{
  font-family:'DM Mono',monospace;font-size:16px;color:#6f6f6c;letter-spacing:.04em;
  display:flex;gap:18px;
}
.tags span{color:#b8f03c;opacity:.75;}

.right{
  width:430px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  padding-right:64px;position:relative;z-index:2;
}
.char{
  width:340px;height:340px;border-radius:22px;overflow:hidden;
  border:1px solid rgba(184,240,60,.28);
  box-shadow:0 26px 70px rgba(0,0,0,.6), 0 0 0 10px rgba(184,240,60,.045);
}
.char img{width:100%;height:100%;object-fit:cover;object-position:center top;display:block;}

/* 하단 도메인 바 */
.foot{
  position:absolute;left:72px;bottom:44px;z-index:3;
  font-family:'DM Mono',monospace;font-size:17px;letter-spacing:.1em;
  color:#b8f03c;display:flex;align-items:center;gap:11px;
}
.foot::before{content:'';width:26px;height:1px;background:rgba(184,240,60,.5);}
</style>

<div class="left">
  <div class="brand">kimju<i>.zip</i></div>
  <div class="title">선생님을 위한<br><em>바이브 코딩</em></div>
  <div class="desc">구글 앱스 스크립트로 만든 교육용 웹앱 <b id="cnt">44</b>개<br>수업·생활지도·행정 업무 자동화부터 AI 프롬프트까지</div>
  <div class="tags"><span>#</span>바이브코딩 <span>#</span>체육교사 <span>#</span>GAS <span>#</span>무료</div>
</div>
<div class="right">
  <div class="char"><img src="../30020.webp" alt=""></div>
</div>
<div class="foot">KIMJU.KR</div>
