<html lang="ko">
<head>
<meta charset="utf-8">

<meta property="og:title" content="교원 복무·인사 길잡이">

<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="교원 복무·인사 길잡이 — 휴가·휴직·출장·겸직·인사 15가지 항목의 신청 흐름">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="교원 복무·인사 길잡이">
<meta name="twitter:description" content="연가·병가·육아휴직·출장·겸직·전보·성과급까지. 무엇을, 언제, 누구에게 내는지 복무규정·예규 원문 기준 흐름도.">

<meta name="theme-color" content="#F6F8FB">
<link rel="icon" type="image/png" href="logo-64.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --pt:#2456A6; --pt-h:#1C4487; --pt-soft:#EAF0F9; --pt-line:#C8D6EC;
  --bg:#F6F8FB; --card:#FFFFFF; --line:#E3E9F2; --line2:#EEF2F7; --head:#FAFBFD;
  --tx:#1B2A41; --tx2:#334155; --sub:#64748B;
  --ok:#1D7A4D; --ok-bg:#E7F3EC; --warn:#B26B0F; --warn-bg:#FBF0DE; --err:#C0392B; --err-bg:#F9E8E6;
  --r1:8px; --r2:12px;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Pretendard Variable",Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere}
a{color:var(--pt)}
button,select,input{font:inherit;color:inherit}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.num{font-variant-numeric:tabular-nums}

/* 앱바 */
.bar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:14px;height:64px}
.brand{display:flex;align-items:center;gap:11px;text-decoration:none;color:var(--tx);min-width:0}
.brand svg,.brand .logo{flex:none}
.brand .logo{width:38px;height:38px;border-radius:9px}
.brand b{display:block;font-size:18px;font-weight:800;letter-spacing:-.03em;line-height:1.2;white-space:nowrap}
.brand b em{font-style:normal;color:var(--pt)}
.brand small{display:block;font-size:12.5px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:2px;margin-left:auto}
.nav a{padding:8px 13px;border-radius:var(--r1);text-decoration:none;color:var(--tx2);font-size:14px;font-weight:600;white-space:nowrap}
.nav a:hover{background:var(--line2)}
.nav a.on{color:var(--pt);background:var(--pt-soft)}

/* 긴급 띠 */
.sos{background:var(--err-bg);border-bottom:1px solid #F0D2CE}
.sos .wrap{display:flex;align-items:center;gap:6px 16px;padding-top:8px;padding-bottom:8px;font-size:13.5px;overflow-x:auto;scrollbar-width:none;white-space:nowrap}
.sos .wrap::-webkit-scrollbar{display:none}
.sos b{color:var(--err);font-weight:700}
.sos a{color:var(--err);font-weight:700;text-decoration:none}
.sos a span{font-weight:500;opacity:.85;margin-left:3px}

/* 홈 상단 */
.top{background:var(--card);border-bottom:1px solid var(--line)}
.top .wrap{padding-top:18px;padding-bottom:16px}
.srow{display:flex;gap:20px;align-items:center}
.search{position:relative;flex:1;min-width:0}
.search input{width:100%;height:52px;border:1px solid var(--line);border-radius:var(--r2);background:var(--bg);padding:0 46px 0 88px;font-size:16px;color:var(--tx);outline:none;-webkit-appearance:none}
.search input:focus{border-color:var(--pt);background:#fff;box-shadow:0 0 0 3px rgba(36,86,166,.12)}
.search label{position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:13px;font-weight:700;color:var(--sub);padding-right:14px;border-right:1px solid var(--line)}
.search .clr{position:absolute;right:5px;top:50%;transform:translateY(-50%);width:42px;height:42px;border:0;background:none;color:var(--sub);cursor:pointer;display:none;font-size:22px;line-height:1}
.stats{display:flex;gap:26px;flex:none}
.stat b{display:block;font-size:24px;font-weight:800;letter-spacing:-.02em;line-height:1.1}
.stat span{font-size:12.5px;color:var(--sub)}
.stat.u b{color:var(--err)}
.quick{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px;align-items:center}
.quick .ql{font-size:13px;font-weight:700;color:var(--sub);margin-right:4px}
.quick button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-size:13.5px;cursor:pointer;min-height:34px}
.quick button:hover{border-color:var(--pt);color:var(--pt);background:var(--pt-soft)}

/* 첫 화면 머리 그림 */
.hero{position:relative;overflow:hidden;background:#EFF3FB;border-bottom:1px solid var(--line)}
.hero-img{position:absolute;right:max(-60px, calc((100vw - 1240px) / 2 - 140px));top:50%;transform:translateY(-50%);height:118%;width:auto;max-width:none;pointer-events:none;user-select:none}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#EFF3FB 0%,#EFF3FB 34%,rgba(239,243,251,.85) 46%,rgba(239,243,251,0) 62%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;padding-top:44px;padding-bottom:40px}
.hero-t{max-width:560px}
.eyebrow{margin:0 0 10px;font-size:13px;font-weight:700;color:var(--pt);letter-spacing:.01em}
.hero h1{margin:0 0 12px;font-size:40px;line-height:1.22;letter-spacing:-.035em;font-weight:800}
.lead2{margin:0 0 22px;color:var(--tx2);font-size:15.5px;max-width:520px}
.hero .search{flex:none}
.hero .search input{background:#fff;box-shadow:0 1px 3px rgba(15,23,42,.06)}
.hero .stats{margin-top:18px;gap:30px}
.quickbar{background:var(--card);border-bottom:1px solid var(--line)}
.quickbar .quick{margin:0;padding:12px 0}
@media (max-width:1080px){
  .hero::after{background:linear-gradient(90deg,#EFF3FB 0%,#EFF3FB 45%,rgba(239,243,251,.8) 60%,rgba(239,243,251,.2) 80%)}
}
@media (max-width:860px){
  .hero-img{position:static;transform:none;display:block;width:100%;height:auto;margin:0 auto;object-fit:cover;object-position:70% 50%;aspect-ratio:16/8}
  .hero::after{display:none}
  .hero .wrap{padding-top:18px;padding-bottom:22px}
  .hero h1{font-size:28px}
  .lead2{font-size:15px;margin-bottom:16px}
  .hero .stats{justify-content:space-between;gap:10px}
}

/* 홈 본문 */
.layout{display:grid;grid-template-columns:232px 1fr;gap:0;min-height:60vh}
.side{border-right:1px solid var(--line);padding:18px 16px 40px 0;background:transparent}
.side h3{font-size:12.5px;font-weight:700;color:var(--sub);letter-spacing:.02em;margin:0 0 6px;padding-left:10px}
.side .grp{margin-bottom:20px}
.side button{display:flex;justify-content:space-between;align-items:center;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:var(--r1);cursor:pointer;font-size:14.5px;min-height:38px;position:relative}
.side button:hover{background:var(--line2)}
.side button.on{background:var(--card);box-shadow:inset 3px 0 0 var(--pt);color:var(--pt);font-weight:700;border-radius:0 var(--r1) var(--r1) 0}
.side button .n{color:var(--sub);font-size:13px;font-weight:500}
.side button.on .n{color:var(--pt)}
.side button[disabled]{opacity:.38;cursor:default}
.side button[disabled]:hover{background:none}
.side .reset{display:block;width:auto;margin:0 0 0 10px;padding:6px 0;min-height:36px;border:0;background:none;color:var(--pt);font-size:13.5px;font-weight:700;cursor:pointer;box-shadow:none}
.side .reset:hover{background:none;text-decoration:underline}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.d-즉시{background:var(--err)} .d-당일{background:var(--warn)} .d-며칠{background:#94A3B8}

.main{padding:16px 0 60px 24px;min-width:0}
.listhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;gap:10px}
.listhead h2{font-size:15px;margin:0;font-weight:700}
.listhead h2 span{color:var(--sub);font-weight:500;margin-left:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;background:var(--card)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;cursor:pointer;font-weight:600;color:var(--sub);min-height:34px}
.seg button.on{background:var(--tx);color:#fff}

.tbl{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden}
.tbl th{font-size:12.5px;font-weight:700;color:var(--sub);text-align:left;padding:10px 12px;background:var(--head);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:13px 12px;border-bottom:1px solid var(--line2);vertical-align:top;font-size:14px}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:#FAFCFF}
.tbl .no{color:var(--sub);font-size:13px;width:56px;padding-left:16px;white-space:nowrap}
.tbl .ti a{font-size:15.5px;font-weight:700;color:var(--tx);text-decoration:none}
.tbl .ti p{margin:2px 0 0;color:var(--sub);font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tbl .ti .hit{color:var(--pt);font-size:13px;margin-top:3px}
.tbl .fst{color:var(--tx2);font-size:13.5px;width:230px;min-width:200px}
.tbl .dl{font-size:13px;font-weight:700;color:var(--err);width:170px;min-width:150px}
.tbl .dl small{display:block;font-weight:500;color:var(--sub)}
.tbl .sc{color:var(--sub);font-size:13px;white-space:nowrap}
.empty{padding:34px 16px;color:var(--sub);text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r2)}

.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:6px;line-height:1.5;white-space:nowrap}
.u-즉시{background:var(--err-bg);color:var(--err)}
.u-당일{background:var(--warn-bg);color:var(--warn)}
.u-며칠{background:var(--line2);color:var(--sub)}
.u-미리{background:var(--pt-soft);color:var(--pt)}
.u-사후{background:var(--line2);color:var(--sub)}
.sos .sosn{font-size:13px;color:var(--tx2)}
.tag{display:inline-block;font-size:12px;font-weight:600;padding:2px 8px;border-radius:6px;border:1px solid var(--line);color:var(--tx2);background:var(--card);white-space:nowrap}

/* 상세 */
.dbar{background:var(--card);border-bottom:1px solid var(--line)}
.dbar .wrap{display:flex;align-items:center;gap:10px;height:52px}
.dbar .lb{font-size:12.5px;font-weight:700;color:var(--sub);white-space:nowrap}
.dbar select{height:36px;border:1px solid var(--line);border-radius:var(--r1);padding:0 10px;background:var(--card);min-width:0;max-width:320px;font-size:14px}
.dbar .pn{display:flex;gap:6px;margin-left:auto;align-items:center}
.dbar .pos{font-size:13px;color:var(--sub);margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 13px;border:1px solid var(--line);border-radius:var(--r1);background:var(--card);cursor:pointer;font-size:13.5px;font-weight:600;text-decoration:none;color:var(--tx);white-space:nowrap}
.btn:hover{border-color:#C3CEDF}
.btn.dark{background:var(--tx);border-color:var(--tx);color:#fff}
.btn[disabled]{opacity:.4;cursor:default}

.dhead{padding:26px 0 18px;display:flex;gap:24px;align-items:flex-start}
.dhead .l{flex:1;min-width:0}
.dhead .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.dhead .no{font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:.04em;margin-right:4px}
.dhead h1{font-size:30px;margin:0 0 8px;letter-spacing:-.025em;line-height:1.3;font-weight:800}
.dhead .sum{font-size:16px;margin:0;color:var(--tx2);max-width:820px}
.dhead .acts{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.kpis{display:flex;flex-wrap:wrap;gap:0;background:var(--card);border:1px solid var(--line);border-radius:var(--r2);margin-bottom:22px;overflow:hidden}
.kpi{padding:12px 20px;border-right:1px solid var(--line2);min-width:110px}
.kpi:last-child{border-right:0}
.kpi b{display:block;font-size:22px;font-weight:800;line-height:1.2}
.kpi span{font-size:12.5px;color:var(--sub)}
.kpi.w b{color:var(--warn)}

.nowbox{background:var(--card);border:1px solid #F0D2CE;border-radius:var(--r2);display:grid;grid-template-columns:150px 1fr;overflow:hidden;margin-bottom:26px}
.nowbox .h{background:var(--err-bg);padding:16px 18px;color:var(--err);font-weight:800;font-size:15px;line-height:1.4}
.nowbox .h small{display:block;font-weight:500;font-size:12.5px;margin-top:4px;color:#9A3A2E}
.nowbox ol{margin:0;padding:12px 18px 12px 18px;list-style:none;counter-reset:n;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:4px 22px}
.nowbox li{counter-increment:n;padding:6px 0 6px 30px;position:relative;font-weight:600;font-size:15px;line-height:1.5}
.nowbox li::before{content:counter(n);position:absolute;left:0;top:6px;width:21px;height:21px;border-radius:50%;background:var(--err);color:#fff;font-size:12px;font-weight:800;display:flex;align-items:center;justify-content:center}

.sec{margin:0 0 30px}
.sech{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.sec h2{font-size:20px;font-weight:800;margin:0;letter-spacing:-.02em}
.sec h2 + p,.sech p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.legend{display:flex;gap:12px;font-size:12.5px;color:var(--sub);align-items:center;flex-wrap:wrap}
.legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:2px solid}
.lg-done{border-color:var(--ok)!important;background:var(--ok-bg)}
.lg-now{border-color:var(--pt)!important;background:var(--pt-soft)}
.lg-wait{border-color:#CBD5E1!important;background:#fff}

/* 업무 흐름도 */
.flowbox{background:var(--card);border:1px solid var(--line);border-radius:var(--r2);overflow:clip}
.flowscroll{overflow-x:auto;position:relative}
.flowscroll.fit{overflow:visible}
.flowscroll.fit .ch,.flowscroll.fit .corner{position:sticky;top:64px;z-index:5}
.flow{position:relative;display:grid}
.flow .ch{background:var(--head);border-bottom:1px solid var(--line);padding:10px 14px;font-size:12.5px;font-weight:700;color:var(--sub)}
.flow .ch b{display:block;color:var(--tx);font-size:14px}
.flow .lh{border-right:1px solid var(--line);border-bottom:1px solid var(--line2);padding:12px;font-size:13px;font-weight:700;color:var(--tx2);background:var(--head);display:flex;align-items:center}
.flow .cell{border-bottom:1px solid var(--line2);border-right:1px dashed var(--line2);padding:12px 12px 12px 20px;display:flex;flex-direction:column;gap:10px;justify-content:center;min-height:76px}
.flow .cell.last{border-right:0}
.flow .corner{background:var(--head);border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 14px;font-size:12px;color:var(--sub);font-weight:700}
.node{display:block;position:relative;z-index:2;background:#fff;border:1.5px solid #CBD5E1;border-radius:var(--r1);padding:7px 10px 8px;cursor:pointer;text-align:left;width:100%;font-size:13.5px;line-height:1.4;font-weight:600;color:var(--tx)}
.node:hover{border-color:var(--pt)}
.node .nh{display:flex;justify-content:space-between;font-size:11px;font-weight:800;color:var(--sub);margin-bottom:2px;letter-spacing:.03em}
.node .nt{display:block}
.node .nx{display:block;margin-top:4px;font-size:11.5px;font-weight:600;color:var(--sub)}
.node.done{border-color:var(--ok);background:var(--ok-bg)}
.node.done .nh span{color:var(--ok)}
.node.now{border-color:var(--pt);border-width:2px;background:var(--pt-soft);box-shadow:0 0 0 3px rgba(36,86,166,.12)}
.node.now .nh span{color:var(--pt)}
.node.sel{outline:2px solid var(--tx);outline-offset:2px}
.flow svg.arrows{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:visible}
.ndetail{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 260px;gap:0}
.ndetail .nd-l{padding:16px 20px}
.ndetail .nd-r{padding:16px 20px;border-left:1px solid var(--line2);background:var(--head);font-size:13.5px}
.ndetail .k{font-size:12px;font-weight:800;color:var(--sub);letter-spacing:.03em}
.ndetail h3{margin:3px 0 6px;font-size:17px;line-height:1.45}
.ndetail .det{color:var(--tx2);font-size:14.5px;margin:0}
.ndetail .nd-r dl{margin:0;display:grid;grid-template-columns:52px 1fr;gap:6px 8px}
.ndetail .nd-r dt{color:var(--sub);font-weight:600}
.ndetail .nd-r dd{margin:0}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;font-weight:600;cursor:pointer;width:max-content;min-height:36px}
.chk input{width:20px;height:20px;accent-color:var(--pt)}

.deep details{border-top:1px solid var(--line2)}
.deep details:first-child{border-top:0}
.deep summary{cursor:pointer;list-style:none;padding:14px 44px 14px 18px;font-weight:700;font-size:15.5px;position:relative;display:flex;gap:10px;align-items:baseline}
.deep summary::-webkit-details-marker{display:none}
.deep summary::after{content:"";position:absolute;right:20px;top:21px;width:7px;height:7px;border-right:2px solid var(--sub);border-bottom:2px solid var(--sub);transform:rotate(45deg)}
.deep details[open] summary::after{transform:rotate(-135deg);top:24px}
.deep .dn{font-size:12px;font-weight:800;color:var(--pt);font-variant-numeric:tabular-nums}
.deep .db{padding:0 22px 16px 44px;color:var(--tx2);font-size:15px}
.deep .db p{margin:0 0 10px}
.deep .db p.bs{font-size:12.5px;color:var(--sub);margin:0}
.xt{margin-bottom:14px;overflow:hidden}
.xth{padding:12px 16px;font-weight:700;border-bottom:1px solid var(--line)}
.xtw{overflow-x:auto}
.xt table.t{min-width:560px}
.xt table.t td{font-size:14px}
.xt table.t td.k0{font-weight:700;white-space:nowrap}
.xtn{padding:10px 16px;font-size:12.5px;color:var(--sub);border-top:1px solid var(--line2);background:var(--head)}

.how{margin:8px 0 0;padding:0;list-style:none;counter-reset:h}
.how li{counter-increment:h;position:relative;padding:3px 0 3px 26px;font-size:14.5px;color:var(--tx2)}

<script>
const DATA = {"updated":"2026-09-29","cases":[{"id":"leave-annual","title":"연가·반일연가·조퇴·외출·지각 — 수업일 연가 사유와 학교장 승인","aka":["연가","연가 쓰려면","반일연가","조퇴","외출","지각","지참","개인용무","수업일 연가","연가 사유","제9호","연가 일수","연가 가산","연가 미리 사용","연가보상비","연가 저축","방학 중 연가","애 아파서 조퇴","공무외 국외여행","퇴직 전 연가"],"category":"휴가","urgency":"미리 신청","roles":["교사 본인","복무 담당(교무부)","교감","학교장","보결·수업 대체 교사"],"summary":"연가는 쉬거나 개인 일을 보려고 쓰는 휴가로, 재직기간에 따라 연 11~21일이다. 교원은 「교원휴가에 관한 예규」에 따라 특별한 사유가 없으면 수업일을 피해 쓰고, 수업일에 쓰려면 나이스에 예규 제5조제1항 제1~9호 중 해당 호를 적어 학교장 승인을 받는다. 지각·조퇴·외출과 반일연가는 시간을 모두 합쳐 8시간을 연가 1일로 빼며, 2026년 2월 예규 개정으로 교육활동에 지장이 없다고 학교장이 인정하는 지각·조퇴·외출은 사유를 적지 않는다. 교원에게는 연가보상비와 연가 저축 제도가 적용되지 않으므로 남은 연가는 그해로 소멸한다. 근무상황은 나이스로 관리하고(예규 제4조제4항), 신청 화면과 세부 운영은 소속 시·도교육청 안내로 확인한다.","first":["쓰려는 날이 수업일인지 휴업일(방학·재량휴업일)인지부터 본다. 휴업일 연가는 사유를 적지 않고, 수업일 연가는 예규 제5조제1항의 해당 호를 적어야 한다","나이스 [나의메뉴]-[복무]-[개인근무상황신청]에서 남은 연가 일수를 확인한다. 가용 연가가 0이나 빈칸이면 복무 담당에게 연가 생성을 요청한다","사유가 생기면 미리 신청해 사유 발생 전까지 승인을 받는다. 갑자기 생긴 일로 미리 못 받았으면 늦어도 당일 정오까지 교감·학교장에게 알리고 절차를 밟는다(다른 사람이 대신 신청 가능)","내 수업·담당 업무를 누가 맡을지(보결, 수업 교체, 업무대행자) 교무부·교감과 먼저 정한다 — 예규는 학교장에게 수업 결손 방지 조치를 요구한다","아파서 쉬는 것이면 연가가 아니라 병가(병조퇴)로 신청한다. 연가 사유를 일부러 병가로 처리하는 것은 금지다","사유가 민감하면 학교장에게 말로 전하고 나이스에는 '개인용무' 등으로 적어도 된다"],"steps":[{"stage":"미리 확인","when":"연가를 생각하는 즉시","who":"교사 본인","what":"연가 일수와 날짜 성격 확인","detail":"재직기간별 연가 일수(1년 미만 11일, 1~3년 15일, 3~4년 16일, 4~5년 17일, 5~6년 20일, 6년 이상 21일)와 이미 쓴 일수를 나이스에서 확인한다. 재직기간은 연가 사용 직전일 기준이며, 휴직·정직·직위해제 기간은 빼고 육아휴직·법정의무수행 휴직·공무상 질병휴직은 넣는다. 연도 중 임용·휴직·복직했다면 그해 실제 근무 개월 수 비율로 연가가 줄어든다(15일 이상은 1개월로 계산).","basis":"국가공무원 복무규정 제15조·제17조제2항; 인사혁신처 예규 제8장 4-가(1)"},{"stage":"미리 확인","when":"수업일에 쓰려 할 때","who":"교사 본인","what":"수업일 연가 사유(1~9호) 해당 여부 확인","detail":"연가는 특별한 사유가 없으면 수업일을 빼고 쓴다. 수업일 연가가 인정되는 사유는 ① 본인·배우자 직계존속 생일 ② 배우자, 본인·배우자 직계존속 기일 ③ 배우자, 본인·배우자 직계존비속 또는 형제자매의 질병·부상으로 일시적 간호·위로가 필요할 때 ④ 병가를 다 쓴 뒤에도 요양이 필요할 때 ⑤ 방송통신대 출석수업·일반대학원 시험 ⑥ 본인·배우자 부모의 형제자매 장례식 ⑦ 본인·배우자 형제자매의 배우자 장례식 ⑧ 본인 자녀 입영일 ⑨ 그 밖에 학교장이 상당한 이유가 있다고 인정하는 경우다. 1~8호에 해당하면 학교장은 승인한다.","basis":"교원휴가에 관한 예규 제4조제1항·제5조제1항"},{"stage":"신청·보고","when":"사유 발생 전(가능하면 며칠 전)","who":"교사 본인","what":"나이스 개인근무상황 신청","detail":"나이스 [나의메뉴]-[복무]-[개인근무상황신청]에서 연가(또는 반일연가·조퇴·외출·지각)를 고르고 기간·시간을 입력한 뒤 결재선을 지정해 상신한다. 수업일이면 사유란에 '제1호'처럼 해당 호를 적고, 제9호는 사유를 간단히 적는다. 휴업일 연가는 사유를 적지 않는다. 방학 중 연가로 국외여행을 가면 사유 '휴업일'을 고르고 비고에 '공무외 국외여행'과 방문 국가를 적어 비상연락이 되게 한다.","basis":"교원휴가에 관한 예규 제4조제4항·제5조제3항; 교원 휴가 질의·답변 자료집 질의4·5"},{"stage":"신청·보고","when":"갑자기 사유가 생긴 날","who":"교사 본인(또는 대신 연락한 교직원)","what":"당일 정오까지 절차","detail":"불가피하게 미리 승인을 받지 못했다면 늦어도 당일 정오까지 필요한 절차를 취해야 하며, 다른 공무원이 대신할 수 있다. 우선 교감에게 전화로 알리고 수업 보결을 부탁한 뒤 나이스 신청을 한다. 복무 담당은 [복무]-[근무상황관리]에서 대리신청을 할 수 있다.","basis":"국가공무원 복무·징계 관련 예규 제8장 3-나(1); 교원휴가에 관한 예규 제11조"},{"stage":"결재·승인","when":"신청 직후","who":"교감·학교장","what":"수업 결손 대책 확인 후 승인","detail":"학교장은 교원이 원하는 시기에 법정 휴가일수를 쓸 수 있게 보장하되 수업 결손이 없도록 보결·수업 교체·업무대행자를 정한다. 수업일 제9호 사유는 학교 업무·교육과정 운영에 지장이 없는지 보고 판단한다. 승인이 끝나면 기결함에서 '완결'을 확인한다.","basis":"교원휴가에 관한 예규 제4조; 교원 휴가 질의·답변 자료집 질의2"},{"stage":"사용·이행","when":"반일연가를 쓸 때","who":"교사 본인","what":"반일연가 시간 기준","detail":"반일연가는 13:00를 기준으로 오전·오후로 나눈다(탄력근무시간제 학교는 근무시간 4시간 기준으로 학교장이 달리 정할 수 있다). 반일연가 2회가 연가 1일이다. 일반 국가공무원의 기준(14:00)과 다르다.","basis":"교원휴가에 관한 예규 제5조제2항; 국가공무원 복무규정 제16조제3항; 인사혁신처 예규 제8장 3-다"},{"stage":"사용·이행","when":"조퇴·외출·지각을 할 때","who":"교사 본인","what":"시간 단위 신청","detail":"지각·조퇴·외출은 근무를 전제로 한 날의 근무상황이라 연가 자체는 아니지만, 질병·부상 외의 사유면 누계 8시간을 연가 1일로 뺀다. 나이스에 사유를 적어 학교장 승인을 받되, 수업 등 교육활동에 지장이 없다고 학교장이 인정하면 사유를 적지 않는다(2026.2.27. 개정). 본인이 아파서 병원에 가거나 집에서 쉬는 것은 병조퇴로 구분한다.","basis":"국가공무원 복무규정 제17조제4항·제18조제1항; 교원휴가에 관한 예규 제5조제4항"},{"stage":"사용·이행","when":"휴가 중","who":"교사 본인","what":"연락 체계 유지","detail":"휴가 중에도 긴급 시 연락이 되게 하고, 수업과 담당 사무는 학교장이 정한 사람에게 미리 넘긴다.","basis":"국가공무원 복무·징계 관련 예규 제8장 3-라(1)·(2)"},{"stage":"복귀·정산","when":"연말","who":"복무 담당(교무부)","what":"연가 가산 확인","detail":"그해 결근·휴직(공무상 질병휴직 제외)·정직·강등·직위해제가 없는 교원이 ① 병가 1일 미만(공무상 병가만 쓴 경우 포함) ② 연가 실시 3일 미만 중 하나에 해당하면 각각 1일(최대 2일)을 연가에 더한다. 가산 사실은 근무상황부 첫째란에 적고 승인권자 확인을 받는다. 교원은 일반 공무원의 '연가보상비를 못 받은 연가' 기준이 아니라 예규 기준을 쓴다.","basis":"교원휴가에 관한 예규 제5조제5항; 인사혁신처 예규 제8장 4-가(2)"},{"stage":"복귀·정산","when":"연가를 다 썼는데 휴가 사유가 생길 때","who":"교사 본인·복무 담당","what":"다음 해 연가 미리 사용","detail":"연가가 없거나 남은 연가보다 긴 휴가 사유가 생기면 다음 재직기간 연가를 미리 쓸 수 있다. 연도 중 휴직·퇴직 예정자는 제외다. 별도 사전 결재를 받고 나이스로 신청·승인하며, 남은 연가를 먼저 다 쓴 뒤 다음 해 연가를 신청한다. 사전 결재 없이 초과해 쓰면 결근으로 처리된다.","basis":"교원휴가에 관한 예규 제5조제6항; 교원 휴가 질의·답변 자료집 질의9; 인사혁신처 예규 제8장 4-가(4)"},{"stage":"사후 관리","when":"연도 중 휴직·퇴직할 때","who":"복무 담당(교무부)·교사 본인","what":"초과 사용 연가 정산","detail":"휴직·퇴직으로 실제 근무기간이 줄면 연가 일수가 비례해 줄고, 그보다 많이 쓴 연가는 결근으로 본다. 초과분이 8시간 미만이면 다음 해(휴직자는 복직한 해) 연가에서 뺀다. 휴직 전에 연가 잔여일수를 꼭 다시 계산한다.","basis":"국가공무원 복무규정 제17조제2항·제3항; 교원 휴가 질의·답변 자료집 질의46"},{"stage":"사후 관리","when":"복무 점검 때","who":"교감·학교장","what":"근무상황부 점검","detail":"복무 관리자는 연가 사유의 고의적 병가 처리, 연가 사실 미기록, 지각·조퇴·외출 묵인, 진단서 없이 연 6일을 넘긴 병가의 연가 미공제를 수시로 점검한다. 수업일 제6·7호 연가는 증빙이 필수는 아니지만 점검 때 학교장이 서류를 요구할 수 있고, 허위 사용은 징계 요구 대상이다.","basis":"국가공무원 복무·징계 관련 예규 제8장 3-라(3); 교원 휴가 질의·답변 자료집 질의6"}],"deadlines":[{"what":"연가 신청·승인","limit":"사유 발생 전까지 승인. 불가피하면 늦어도 당일 정오까지 절차(대행 가능)","basis":"인사혁신처 예규 제8장 3-나(1); 교원휴가에 관한 예규 제11조"},{"what":"연가 일수(재직기간별)","limit":"1개월~1년 미만 11일, 1~3년 15일, 3~4년 16일, 4~5년 17일, 5~6년 20일, 6년 이상 21일","basis":"국가공무원 복무규정 제15조제1항"},{"what":"연가 계산 단위 기간","limit":"1월 1일~12월 31일. 남은 연가는 다음 해로 이월하지 않는다","basis":"교원휴가에 관한 예규 제10조(연가 저축 규정 미적용); 인사혁신처 예규 제8장 4-가 연가 발생 사례"},{"what":"지각·조퇴·외출·반일연가 환산","limit":"누계 8시간 = 연가 1일, 반일연가 2회 = 연가 1일","basis":"국가공무원 복무규정 제16조제3항·제17조제4항"},{"what":"연가 가산","limit":"병가 1일 미만 +1일, 연가 실시 3일 미만 +1일(최대 2일)","basis":"교원휴가에 관한 예규 제5조제5항"},{"what":"퇴직 준비 연가(정년·명예퇴직 예정)","limit":"퇴직예정일이 속한 학기 중에만 제9호 사유로 허가 가능","basis":"교원 휴가 질의·답변 자료집 질의10"}],"dont":["수업일에 사유 호를 적지 않고 연가를 올리지 않는다 — 예규 제5조제3항이 수업일 연가는 해당 호를 적어 승인받게 했다","연가 사유를 병가로 돌려 처리하지 않는다 — 복무 점검 항목('연가 사유의 고의적 병가처리')이고 허위 사용은 징계 요구 대상이다","승인 전에 먼저 퇴근·외출하지 않는다 — 정당한 절차 없는 근무지 이탈은 국가공무원법 제58조(직장 이탈 금지) 위반이다","방학이라고 아무 신청 없이 출근을 빼먹지 않는다 — 휴업일은 교원의 휴무일이 아니므로 연가나 교육공무원법 제41조 연수 승인을 받아야 한다","남은 연가를 돈으로 받거나 다음 해로 저축할 수 있다고 기대하지 않는다 — 교원에게는 연가보상비·저축연가 규정이 적용되지 않는다","민감한 개인 사정을 나이스 사유란에 자세히 쓰지 않는다 — 학교장에게 말로 전하고 '개인용무'로 적어도 된다","휴직 직전에 연가를 몰아 쓰지 않는다 — 근무 개월 비율로 줄어든 연가를 넘긴 일수는 결근이 된다"],"contacts":[{"name":"교육부 교원정책과(교원휴가에 관한 예규 소관)","tel":"044-203-6497","note":"국가법령정보센터 예규 제104호에 표시된 담당 번호"},{"name":"소속 시·도교육청·교육지원청 교원 복무 담당","tel":"소속 교육청","note":"교육청마다 담당 부서와 번호가 다르다. 학교장의 휴가는 직근 상급기관장의 허가 사항(예규 제4조제3항)"}],"forms":["나이스 개인근무상황 신청(연가·반일연가·조퇴·외출·지각) — 교원 근무상황부는 나이스로 관리(교원휴가에 관한 예규 제4조제4항)","근무상황부(국가공무원 복무규칙 별지 제1호서식)·근무상황카드(별지 제2호서식) — 나이스를 쓰지 않을 때의 종이 서식","공무외 국외여행 신청 서식 — 인정범위·절차를 교육감이 정하므로 소속 시·도교육청 서식(예규 제4조제5항)","연가 미리 사용 사전 결재(내부결재 문서)","퇴직 준비 연가 신청 시 퇴직 예정 사실 확인 자료(정년·명예퇴직)"],"law":[{"name":"교원휴가에 관한 예규(교육부예규 제104호)","article":"제4조·제5조","point":"연가는 특별한 사유가 없으면 수업일 제외. 수업일 연가 사유 1~9호, 반일연가 13:00 기준, 수업일 연가는 나이스에 호 기재, 교육활동 지장 없는 지각·조퇴·외출은 사유 생략, 연가 가산 최대 2일, 미리 사용"},{"name":"교원휴가에 관한 예규","article":"제10조·제11조","point":"복무규정 제16조제1·4·5항(연가 승인 의무·연가보상비), 제16조의2~4(권장·저축·10일 연속 보장), 제19조는 교원에게 적용하지 않음. 그 밖은 인사혁신처 예규 제8장 준용"},{"name":"국가공무원 복무규정","article":"제15조·제16조제3항·제16조제6항·제17조","point":"재직기간별 연가 일수, 반일연가 2회=1일, 연도 중 임용·휴직 시 비례 산정, 지각·조퇴·외출 8시간=연가 1일, 진단서 없는 6일 초과 병가는 연가에서 공제"},{"name":"국가공무원 복무규정","article":"제24조·제24조의2","point":"휴가일수를 넘긴 휴가는 결근. 교원 휴가는 교육부장관이 학사일정을 고려해 따로 정할 수 있음"},{"name":"교육공무원법","article":"제41조","point":"교원은 수업에 지장이 없는 범위에서 학교장 승인을 받아 근무장소 외 연수 가능(방학 중 연가와 구분)"}],"deep":[{"title":"수업일 연가, 어디까지 되나","body":["예규 제5조제1항 1~8호는 학교장이 '승인한다'로 되어 있어 해당하면 승인하는 것이 원칙이다. 9호(기타 상당한 이유)는 학교장이 학교 업무와 교육과정 운영에 지장이 없는지 보고 판단한다. 교육부 자료집은 1~8호에 없는 사유라도 필요성이 있고 수업에 지장이 없으면 승인할 수 있다고 답했다.","이모·고모·삼촌·형수·제부 장례처럼 특별휴가(경조사)가 없는 장례는 6·7호로 장례 기간 중 1일을 수업일 연가로 쓸 수 있고, 하루를 넘기면 추가분은 9호로 신청한다. 정년·명예퇴직 예정 교원의 퇴직 준비 연가도 퇴직예정일이 속한 학기에 한해 9호로 허가할 수 있다."],"basis":"교원휴가에 관한 예규 제5조제1항; 교원 휴가 질의·답변 자료집 질의2·6·10"},{"title":"교원 연가가 일반 공무원과 다른 점","body":["예규 제10조는 복무규정 제16조제1·4·5항, 제16조의2·3·4, 제19조를 교원에게 적용하지 않는다고 정했다. 그래서 일반 공무원의 '공무에 지장이 없으면 연가를 승인해야 한다', 연가보상비, 권장 연가, 연가 저축, 3개월 전 신청한 10일 이상 연속 연가 보장이 교원에게는 없다. 교육부 자료집도 교원은 연가보상비와 저축연가가 적용되지 않는다고 답했다.","대신 교원은 방학 등 휴업일에 사유 기재 없이 연가를 쓸 수 있고, 반일연가 기준 시각이 13:00이며, 연가 가산은 '병가 1일 미만'과 '연가 3일 미만'을 기준으로 한다. 공가 사유도 복무규정 제19조 대신 예규 제7조를 따른다."],"basis":"교원휴가에 관한 예규 제5조·제10조; 교원 휴가 질의·답변 자료집 질의45"},{"title":"아파서 쉬는데 연가로 처리되는 경우","body":["병가는 연 6일까지는 진단서 없이 쓸 수 있지만, 7일 이상 연속이거나 연간 누계가 6일을 넘으면 진단서가 필요하다. 진단서를 내지 못한 병가 일수는 연가에서 빼고 병가 일수에는 넣지 않는다. 갑자기 아파 당일 진단서가 없으면 우선 연가로 처리했다가 진단서를 받은 뒤 병가로 소급할 수 있다.","일반병가 60일을 다 쓴 뒤에도 요양이 필요하면 연가(수업일 4호 사유)를 쓸 수 있고, 그래도 부족하면 질병휴직을 검토한다('병가' 항목 참고)."],"basis":"국가공무원 복무규정 제17조제5항·제18조; 교원 휴가 질의·답변 자료집 질의11·15; 교원휴가에 관한 예규 제5조제1항제4호"},{"title":"방학 중 근무와 연가, 41조 연수","body":["방학(휴업일)은 학생 수업이 없는 날일 뿐 교원의 근무가 면제되는 날이 아니다. 개인 일을 보려면 연가(조퇴·반일연가 포함)를 쓰고, 교재 연구·자료 수집은 교육공무원법 제41조 연수를 학교장에게 미리 승인받는다. 연가나 41조 연수 승인 없이 근무지를 벗어나면 국가공무원법 제58조(직장 이탈 금지) 위반이 될 수 있다.","교원휴가에 관한 예규 제4조제5항은 교육공무원법 제41조에 따른 공무외 국외여행을 복무규정상 휴가와 별도로 실시할 수 있게 하고, 인정범위와 절차는 교육감이 정하게 했다. 그래서 연가로 가는지, 41조 국외여행으로 가는지, 어떤 서식을 내는지는 시·도교육청마다 다르다. 어느 쪽이든 학교교육에 지장이 없는 휴업일에 가는 것이 기본이고, 여행 중에도 연락되는 번호를 미리 알린다(인사혁신처 예규 제8장 7-가)."],"basis":"교원휴가에 관한 예규 제4조제5항; 교육공무원법 제41조; 국가공무원법 제58조; 인사혁신처 예규 제8장 7"}],"tables":[{"title":"재직기간별 연가 일수","head":["재직기간","연가 일수","재직기간","연가 일수"],"rows":[["1개월 이상 1년 미만","11일","4년 이상 5년 미만","17일"],["1년 이상 3년 미만","15일","5년 이상 6년 미만","20일"],["3년 이상 4년 미만","16일","6년 이상","21일"]],"note":"재직기간은 공무원연금법 재직기간을 연월일수로 계산하고 연가 사용 직전일 기준. 휴직(육아·법정의무·공무상 질병휴직 제외)·정직·직위해제 기간은 빼고, 조건을 채우면 예규 제5조제5항 가산(최대 2일). 출처: 국가공무원 복무규정 제15조, 인사혁신처 예규 제8장 4-가."},{"title":"수업일 연가 사유(교원휴가에 관한 예규 제5조제1항)","head":["호","사유","나이스 사유란"],"rows":[["1호","본인 및 배우자 직계존속의 생일","제1호"],["2호","배우자, 본인 및 배우자 직계존속의 기일","제2호"],["3호","배우자, 본인·배우자 직계존비속 또는 형제자매의 질병·부상으로 일시적 간호·위로가 필요할 때","제3호"],["4호","병가를 모두 쓴 뒤에도 직무 수행이 어렵거나 계속 요양이 필요할 때","제4호"],["5호","한국방송통신대 출석수업, 일반대학원 시험","제5호"],["6호","본인 및 배우자 부모의 형제자매 장례식","제6호"],["7호","본인 및 배우자 형제자매의 배우자 장례식","제7호"],["8호","본인 자녀의 입영일","제8호"],["9호","기타 상당한 이유가 있다고 학교장이 인정하는 경우","제9호 + 간단한 사유(민감하면 '개인용무')"]],"note":"휴업일 연가는 사유를 적지 않는다. 출처: 교원휴가에 관한 예규(2026.2.27.) 제5조제1·3항, 교육부 질의·답변 자료집 질의4."}],"faq":[{"q":"수업이 없는 시간에 잠깐 은행 가려고 외출해도 사유를 써야 하나요?","a":"2026.2.27. 개정된 예규 제5조제4항은 수업 등 교육활동에 지장이 없다고 학교장이 인정하는 지각·조퇴·외출은 사유를 적지 않게 했다. 승인 자체는 여전히 받아야 하고, 질병·부상 외 사유라면 누계 8시간마다 연가 1일이 빠진다."},{"q":"남은 연가는 연가보상비로 받거나 내년으로 넘길 수 있나요?","a":"안 된다. 예규 제10조가 복무규정의 연가보상비(제16조제5항)와 연가 저축(제16조의3)을 교원에게 적용하지 않고, 연가는 1월 1일~12월 31일 단위로 계산해 다음 해로 이월하지 않는다."},{"q":"아이가 아파서 병원에 데려가야 해요. 수업일에도 연가를 쓸 수 있나요?","a":"자녀(직계비속)의 질병으로 일시적 간호가 필요하면 예규 제5조제1항제3호에 해당해 수업일에도 연가를 승인받을 수 있다. 미성년 자녀 병원 동행은 특별휴가인 가족돌봄휴가 사유이기도 하니 남은 가족돌봄휴가 일수도 함께 확인한다."},{"q":"반일연가는 몇 시부터 몇 시인가요?","a":"교원은 13:00를 기준으로 오전·오후로 나눈다. 탄력근무시간제를 하는 학교는 근무시간 4시간 기준으로 학교장이 달리 정할 수 있다. 일반 국가공무원은 14:00 기준이라 다르다."},{"q":"갑자기 집안일이 생겨 아침에 출근을 못 했어요. 사후 신청해도 되나요?","a":"미리 승인받는 것이 원칙이지만, 불가피하면 늦어도 당일 정오까지 필요한 절차를 취해야 하고 다른 사람이 대신 신청할 수 있다. 먼저 교감에게 연락해 수업 보결을 부탁하고 나이스 신청을 마친다."},{"q":"연가를 다 썼는데 휴가가 더 필요해요.","a":"다음 재직기간 연가를 미리 쓸 수 있다(연도 중 휴직·퇴직 예정자 제외). 별도 사전 결재와 나이스 신청·승인을 받고, 미리 쓴 일수는 다음 해 연가에서 뺀다. 절차 없이 초과하면 결근이다."}],"record":"연가·반일연가·지각·조퇴·외출은 나이스 [나의메뉴]-[복무]-[개인근무상황신청]에서 본인이 신청하고 결재선을 지정해 상신한다. 복무 담당은 [복무]-[근무상황관리]에서 대리 신청할 수 있다. 수업일 연가는 사유란에 '제1호'~'제9호'를 적고, 9호는 짧은 사유(또는 '개인용무')를 덧붙인다. 휴업일 연가는 사유를 비우고, 공무외 국외여행이면 사유 '휴업일'·비고에 '공무외 국외여행, 방문국'을 적는다. 취소·변경은 상신함에서 기결문서를 취소해 결재를 다시 받은 뒤 삭제하고 새로 신청한다. 가용 연가가 0이나 빈칸이면 복무 담당이 [복무]-[연가관리]-[개인연가관리]에서 가용연가를 생성한다. 연가 가산은 근무상황부 첫째란에 기재하고 승인권자 확인을 받는다.","sources":[{"title":"교원휴가에 관한 예규(교육부예규 제104호, 시행 2026.2.27.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원휴가에관한예규"},{"title":"국가공무원 복무규정(대통령령 제36442호, 시행 2026.6.23.)","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규정"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 시행 2026.6.23.) 제8장 휴가","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/국가공무원복무·징계관련예규"},{"title":"교육공무원법(시행 2026.2.15.) 제41조·제44조·제45조","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"국가공무원 복무규칙(총리령 제2086호, 시행 2026.1.1.) 제7조·제8조, 별지 제1호서식 근무상황부·제2호서식 근무상황카드","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규칙"},{"title":"국가공무원법 제58조(직장 이탈 금지)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원법"}],"verified":"2026-09-29","uncertain":["교원 연가 미리 사용 한도표(예규 제5조제6항)는 현행 예규 원문에서 표가 이미지로 되어 있어 수치를 확인하지 못했다. 2022년 교육부 자료집은 6월 미만 3일·6월~1년 4일·1~2년 6일·2~3년 7일·3~4년 8일·4년 이상 10일로, 복무규정 일반 기준(1년 미만 5일)과 다르다","교육부 질의·답변 자료집은 2022년 7월판(제1-1판)이다. 이후 예규 개정(2023~2026)으로 달라진 부분은 현행 예규 원문을 우선했다","교육공무직원·기간제교원의 연가(연차) 기준은 이 항목에서 다루지 않았다. 기간제교원은 계약 내용과 소속 시·도교육청 계약제교원 운영 지침을 확인해야 한다","사립학교 교원은 예규 적용 대상(국·공립)이 아니므로 학교 정관·복무규정을 확인해야 한다","공무외 국외여행을 연가로 처리할지 교육공무원법 제41조 국외여행으로 처리할지, 신청 서식은 무엇인지는 교육감이 정하므로(예규 제4조제5항) 시·도교육청마다 다르다. 이번에 다른 교육청 지침은 확인하지 않았다"],"related":["leave-sick","leave-special","childcare-time","vacation-duty","business-trip"]},{"id":"leave-sick","title":"병가(일반병가 60일·공무상 병가 180일·병조퇴) — 진단서 기준과 질병휴직으로 넘어갈 때","aka":["병가","병조퇴","병지참","병외출","아파서 조퇴","진단서","진단서 몇 일","6일 넘으면","병가 60일","공무상 병가","공상","공무상 요양","입원","수술","코로나 병가","감염병 출근","질병휴직","병가 다 썼을 때"],"category":"휴가","urgency":"당일","roles":["교사 본인","복무 담당(교무부)","교감","학교장","공무원연금공단","교육지원청(휴직 발령)"],"summary":"병가는 질병·부상으로 직무를 수행할 수 없거나 감염병으로 다른 교직원·학생의 건강에 영향을 줄 우려가 있을 때 쓰는 휴가로, 일반병가는 연 60일, 공무상 병가는 연 180일까지다. 연간 누계 6일까지는 진단서 없이 쓸 수 있지만, 7일 이상 연속되거나 연간 누계가 6일을 넘으면 의사 진단서를 내야 하고, 내지 못한 일수는 연가에서 빠진다. 아파서 하는 지각·조퇴·외출은 누계 8시간을 병가 1일로 계산한다. 병가를 다 쓰면 연가를, 그래도 장기요양이 필요하면 질병휴직(교육공무원법 제44조제1항제1호)을 검토한다. 교원의 병가는 「교원휴가에 관한 예규」 제6조에 따라 국가공무원 복무규정과 인사혁신처 「국가공무원 복무·징계 관련 예규」를 그대로 따르므로 전국이 같은 기준이다.","first":["아침에 아파 출근이 어려우면 교감에게 바로 연락해 수업 보결을 부탁하고, 늦어도 당일 정오까지 병가 절차를 밟는다(가족이 대신 연락 가능)","올해 쓴 병가 누계를 나이스에서 확인한다. 이번 병가로 연간 누계가 6일을 넘거나 7일 이상 연속이면 진단서가 필요하다","병원에 가면 진단서(「의료법」 제17조에 따른 것)를 받아 둔다. 당일 못 냈으면 우선 연가로 처리했다가 진단서를 낸 뒤 병가로 소급할 수 있다","학교 일(수업·체육활동·생활지도 등)을 하다 다쳤거나 병이 났다면 일반병가가 아니라 공무상 병가 대상일 수 있으니, 사고 경위와 목격자, 진료 기록을 먼저 남긴다","입원·수술로 길어질 것 같으면 병가 60일 → 연가 → 질병휴직 순서와 날짜를 복무 담당과 미리 계산한다"],"steps":[{"stage":"미리 확인","when":"아프거나 다쳐서 근무가 어렵다고 느낄 때","who":"교사 본인","what":"병가 요건과 종류 확인","detail":"일반병가는 ① 질병·부상으로 직무를 수행할 수 없을 때 ② 감염병에 걸려 출근이 다른 교직원·학생 건강에 영향을 줄 우려가 있을 때 연 60일 범위에서 승인한다. 공무상 질병·부상이면 연 180일 범위의 공무상 병가다. 둘은 따로 운영되므로 같은 질병이라도 요건을 채우면 각각 쓸 수 있다.","basis":"국가공무원 복무규정 제18조제1·2항; 교원휴가에 관한 예규 제3조제2호·제6조; 인사혁신처 예규 제8장 4-나"},{"stage":"신청·보고","when":"병가 당일 아침(가능하면 전날)","who":"교사 본인 → 교감","what":"연락과 나이스 신청","detail":"미리 승인받지 못했으면 늦어도 당일 정오까지 절차를 취한다. 본인이 의식이 없는 등 의사표시를 못 하면 가족이 연락해 신청을 대행할 수 있다. 나이스 [나의메뉴]-[복무]-[개인근무상황신청]에서 병가(시간 단위면 병지참·병조퇴·병외출)를 골라 상신하고, 복무 담당은 [복무]-[근무상황관리]에서 대리 신청할 수 있다. 병가는 연가처럼 수업일 사용 제한 규정이 없다.","basis":"인사혁신처 예규 제8장 3-나(1)·4-나(4) 붙임 설명; 교원휴가에 관한 예규 제4조·제4조제4항"},{"stage":"신청·보고","when":"연간 누계 6일 초과 또는 7일 이상 연속일 때","who":"교사 본인","what":"진단서 제출","detail":"연간 누계 6일까지는 진단서 없이 쓸 수 있으나(병지참·병조퇴 등 시간 단위 포함), 7일 이상 연속이거나 누계가 6일을 넘으면 「의료법」 제17조에 따른 진단서를 내야 한다. 같은 사유의 병가는 처음 낸 진단서로 갈음할 수 있고, 같은 사유인지는 학교장이 진단서 내용을 보고 정한다. 진단서를 낸 병가는 '진단서 없는 6일'에 들어가지 않는다.","basis":"국가공무원 복무규정 제18조제3항; 인사혁신처 예규 제8장 4-나(3); 교원 휴가 질의·답변 자료집 질의11"},{"stage":"결재·승인","when":"신청 직후","who":"교감·학교장","what":"직무 수행 가능 여부 판단과 기간 결정","detail":"학교장은 진단서, 본인 진술, 치료 자료와 필요하면 전문가 소견을 참고해 직무 수행이 불가능한지 판단하고 병가 승인 여부와 기간을 정한다. 진단서에 치료기간이 없어도 병가를 허가할 수 있고, 필요하면 병가 기간과 관계없이 추가 진단서를 요구할 수 있다. 수업 결손이 없도록 보결·강사 배치를 한다.","basis":"인사혁신처 예규 제8장 4-나(3)(다); 교원 휴가 질의·답변 자료집 질의14"},{"stage":"사용·이행","when":"진료 때문에 몇 시간만 빠질 때","who":"교사 본인","what":"병지참·병조퇴·병외출","detail":"질병·부상으로 인한 지각·조퇴·외출은 종류 구분 없이 누계 8시간을 병가 1일로 계산하고, 8시간 미만의 남은 시간은 계산하지 않는다. 본인이 아파 병원에 가거나 집에서 쉬는 것은 일반 조퇴가 아니라 병조퇴로 구분해 신청한다.","basis":"국가공무원 복무규정 제18조제1항"},{"stage":"사용·이행","when":"진단서를 못 냈을 때","who":"복무 담당(교무부)","what":"연가 공제","detail":"진단서를 내야 하는데 내지 못한 병가 일수는 연가에서 빼고 병가 일수에는 넣지 않는다. 갑자기 아파 당일 진단서를 못 붙였으면 우선 연가로 처리하고, 진단서를 받은 뒤 병가로 소급 처리할 수 있다.","basis":"국가공무원 복무규정 제17조제5항·제18조제1항; 교원 휴가 질의·답변 자료집 질의11"},{"stage":"사용·이행","when":"병가가 길어질 때","who":"복무 담당(교무부)","what":"토요일·공휴일 산입 계산","detail":"휴가 중 토요일·공휴일은 원칙적으로 빼지만, 같은 연도에 일반병가(또는 공무상 병가) 기간을 합해 30일 이상이면 토요일·공휴일도 병가 일수에 넣는다. 사이에 하루 출근했거나 병명이 달라도 각 병가 기간(시작~종료, 토·공휴일 포함)을 합해 30일 이상이면 산입한다. 두 해에 걸치면 연도별로 따로 따진다.","basis":"국가공무원 복무규정 제22조; 인사혁신처 예규 제8장 3-다·4-나(3) 사례; 교원 휴가 질의·답변 자료집 질의16"},{"stage":"신청·보고","when":"공무 중 다쳤거나 병이 났을 때","who":"교사 본인 → 행정실·공무원연금공단","what":"공무상 요양 승인 신청","detail":"공무상 병가를 쓸지는 「공무원 재해보상법」에 따른 공무상 요양 승인 결정을 따른다. 다만 6일 이내 단순 안정만 필요한 가벼운 질병·부상은 학교장이 공무상 여부를 판단해 공무상 병가를 승인할 수 있다. 가해자 손해배상 등으로 요양비가 나오지 않는 경우에도 요양 승인은 받아야 한다.","basis":"인사혁신처 예규 제8장 4-나(4)(가)(나)"},{"stage":"복귀·정산","when":"요양 승인 심의 중","who":"복무 담당(교무부)·교사 본인","what":"일반병가·연가로 쓰고 나중에 소급","detail":"공무상 요양 승인을 신청해 심의 중이면 결정 통보 때까지 일반병가·연가를 쓸 수 있고, 공무상으로 결정되면 쓴 일반병가·연가를 공무상 병가로 소급 처리할 수 있다(본인이 원하면 소급하지 않거나 일부만 소급 가능). 일반병가·연가를 다 쓰고 질병휴직 중에 공무상으로 결정되면 당초 병가·연가·휴직을 취소하고 공무상 병가로 처리할 수 있다.","basis":"인사혁신처 예규 제8장 4-나(4)(라)(마); 교원 휴가 질의·답변 자료집 질의19"},{"stage":"복귀·정산","when":"일반병가 60일을 다 썼을 때","who":"교사 본인·복무 담당","what":"연가 사용","detail":"일반병가가 끝났는데도 요양이 필요하면 본인 연가 일수 범위에서 연가를 쓴다. 수업일이면 예규 제5조제1항제4호(병가를 모두 사용한 후에도 요양 필요) 사유로 신청한다.","basis":"교원휴가에 관한 예규 제5조제1항제4호; 교원 휴가 질의·답변 자료집 질의15"},{"stage":"사후 관리","when":"병가·연가로도 부족할 때","who":"교사 본인 → 학교장 → 임용권자(교육지원청 등)","what":"질병휴직 신청","detail":"신체·정신상 장애로 장기요양이 필요하면 질병휴직(교육공무원법 제44조제1항제1호)을 신청한다. 기간은 1년 이내이고 부득이하면 1년 연장할 수 있으며, 공무상 질병·부상은 3년 이내에 2년 연장이 가능하다. 인사혁신처 예규는 공무상 병가·일반병가·연가·질병휴직을 각각 요건을 채우면 승인(휴직은 임용권자 명령)을 거쳐 쓸 수 있다고 적는다. 병가·연가를 다 쓴 뒤에 휴직하게 하는지 등 실제 순서는 소속 시·도교육청(교육지원청) 휴직 담당의 기준으로 확인한다. 휴직 기간은 연가 산정에서 빠지므로 휴직 전 연가 초과 사용이 없는지 확인한다('휴직' 항목 참고).","basis":"교육공무원법 제44조제1항제1호·제45조제1항제1호; 인사혁신처 예규 제8장 4-나(3)(나); 국가공무원 복무규정 제17조제2·3항"},{"stage":"사후 관리","when":"질병휴직에서 복직한 뒤","who":"학교장","what":"같은 질병 재발 시 병가 제한","detail":"질병휴직은 완쾌 등으로 휴직 사유가 없어져야 복직하므로, 휴직 기간이 끝났다고 같은 사유로 바로 일반병가를 이어 쓸 수 없다. 복직 후 정상 근무가 상당 기간 이어진 뒤 같은 질병이 재발했을 때만 일반병가를 승인할 수 있다.","basis":"교원 휴가 질의·답변 자료집 질의13; 교육공무원법 제45조"}],"deadlines":[{"what":"일반병가 한도","limit":"연 60일(1월 1일~12월 31일, 다음 해 다시 60일)","basis":"국가공무원 복무규정 제18조제1항; 교원 휴가 질의·답변 자료집 질의12"},{"what":"공무상 병가 한도","limit":"연 180일. 같은 사유면 연도 구분 없이 180일 범위","basis":"국가공무원 복무규정 제18조제2항; 인사혁신처 예규 제8장 4-나(1)(나)"},{"what":"진단서 없이 쓸 수 있는 병가","limit":"연간 누계 6일까지. 7일 이상 연속 또는 누계 6일 초과 시 진단서","basis":"국가공무원 복무규정 제18조제3항; 인사혁신처 예규 제8장 4-나(3)"},{"what":"병지참·병조퇴·병외출 환산","limit":"누계 8시간 = 병가 1일(8시간 미만 잔여는 계산 안 함)","basis":"국가공무원 복무규정 제18조제1항"},{"what":"토요일·공휴일 산입","limit":"같은 연도 병가 기간 합계 30일 이상이면 산입","basis":"국가공무원 복무규정 제22조"},{"what":"병가 신청","limit":"사유 발생 전 원칙, 불가피하면 당일 정오까지(대행 가능)","basis":"인사혁신처 예규 제8장 3-나(1)"},{"what":"질병휴직 기간","limit":"1년 이내(부득이 1년 연장). 공무상 질병·부상은 3년 이내(2년 연장 가능)","basis":"교육공무원법 제45조제1항제1호"}],"dont":["연가로 쓸 일을 병가로 올리지 않는다 — '연가 사유의 고의적 병가 처리'는 복무 점검 대상이다","진단서 없이 연 6일을 넘겨 병가로 두지 않는다 — 초과분은 연가에서 공제해야 하고, 미공제는 점검 지적 사항이다","본인이 아파 병원 가는 날을 일반 조퇴로 올리지 않는다 — 병조퇴로 구분해야 연가가 아니라 병가에서 계산된다","공무 중 다쳤는데 사고 기록 없이 일반병가만 쓰지 않는다 — 공무상 요양 승인을 받아야 공무상 병가 180일과 재해보상 절차를 쓸 수 있다","질병휴직 만료 직후 같은 병으로 바로 병가를 이어 붙이지 않는다 — 복직 후 정상 근무가 상당 기간 지속된 경우에만 병가 승인이 가능하다","진단서에 적힌 병명을 교무실 단체방이나 결재 제목에 드러내지 않는다 — 건강 정보는 민감정보이므로 복무 담당·결재권자만 보게 한다","병가·연가를 모두 넘긴 날을 그냥 두지 않는다 — 법정 휴가일수를 넘긴 휴가는 결근이다"],"contacts":[{"name":"공무원연금공단","tel":"1588-4321","note":"공무상 요양(재해보상) 신청 안내. 공단 누리집(geps.or.kr) 표기 대표번호"},{"name":"소속 시·도교육청·교육지원청 교원 인사 담당","tel":"소속 교육청","note":"질병휴직 발령·복직 절차. 교육청마다 담당 부서가 다르다"}],"forms":["나이스 개인근무상황 신청(병가·병지참·병조퇴·병외출) — 교원 근무상황부는 나이스로 관리(교원휴가에 관한 예규 제4조제4항)","근무상황부(국가공무원 복무규칙 별지 제1호서식) — 나이스를 쓰지 않을 때의 종이 서식","의사 진단서(「의료법」 제17조) — 연간 누계 6일 초과 또는 7일 이상 연속 병가 시","공무상 요양 승인 신청 서류(공무원 재해보상법, 공무원연금공단 안내에 따름)와 사고 경위 확인 자료","질병휴직원과 진단서(휴직 시) — 소속 시·도교육청 휴·복직 서식"],"law":[{"name":"국가공무원 복무규정","article":"제18조(병가)","point":"일반병가 연 60일, 공무상 병가 연 180일, 질병·부상 지각·조퇴·외출 8시간=병가 1일, 연간 6일 초과 시 진단서"},{"name":"국가공무원 복무규정","article":"제17조제5항·제22조·제24조","point":"진단서 없는 6일 초과 병가는 연가에서 공제, 같은 연도 병가 합계 30일 이상이면 토·공휴일 산입, 한도 초과 휴가는 결근"},{"name":"교원휴가에 관한 예규(교육부예규 제104호)","article":"제3조제2호·제6조·제5조제1항제4호","point":"교원 병가는 복무규정과 인사혁신처 예규를 따름. 병가를 다 쓴 뒤 요양이 필요하면 수업일에도 연가 승인 사유"},{"name":"국가공무원 복무·징계 관련 예규","article":"제8장 4-나(병가)","point":"진단서 운영, 동일 사유 판단, 공무상 병가 승인 기준·소급 처리, 질병휴직과의 관계"},{"name":"교육공무원법","article":"제44조제1항제1호·제45조제1항제1호","point":"장기요양이 필요하면 질병휴직(1년+1년, 공무상 3년+2년)"}],"deep":[{"title":"진단서 '6일' 규칙을 정확히","body":["기준은 '연간 누계'다. 1월 1일부터 쓴 병가(병지참·병조퇴 등 시간 단위를 8시간=1일로 환산한 것 포함)를 모두 더해 6일까지는 진단서 없이 쓸 수 있고, 그 뒤부터는 진단서가 필요하다. 한 번에 7일 이상 연속으로 쉬면 누계와 관계없이 진단서가 필요하다.","진단서를 낸 병가는 '진단서 없는 6일'에 포함되지 않는다. 같은 병으로 이어서 쓰는 병가는 처음 낸 진단서로 갈음할 수 있고, 연도가 바뀌어도 진단서에 적힌 향후 치료기간 안이면 전년도 진단서로 갈음할 수 있다. 같은 사유인지는 학교장이 판단한다."],"basis":"국가공무원 복무규정 제17조제5항·제18조제3항; 인사혁신처 예규 제8장 4-나(3); 교원 휴가 질의·답변 자료집 질의11·12"},{"title":"공무상 병가 — 학교에서 다쳤을 때","body":["공무상 질병·부상 여부와 병가 기간은 「공무원 재해보상법」의 요양 승인 결정 범위 안에서 학교장이 진단서와 직무 수행 가능 여부를 보고 정한다. 요양 승인 기간 중이라도 공무상 병가 180일이 끝나면 같은 사유로 다시 공무상 병가를 줄 수 없고, 그 뒤에도 요양이 필요하면 일반병가를 승인할 수 있다.","6일 이내 단순 안정만 필요한 가벼운 부상은 학교장이 판단해 공무상 병가를 줄 수 있다. 인사혁신처 예규는 민원인 폭언 등으로 신체·정신적 피해를 입어 안정이 필요한 경우를 예로 든다. 교육활동 침해로 피해를 입었다면 별도로 교권침해 특별휴가(5일, 상해·폭행·성폭력 범죄면 5일 추가)도 있다('특별휴가' 항목 참고).","공무상 병가만 쓴 해는 연가 가산(병가 1일 미만)에서 병가를 쓴 것으로 보지 않는다."],"basis":"인사혁신처 예규 제8장 4-나(4); 교원휴가에 관한 예규 제5조제5항제1호·제8조제1항"},{"title":"병가 → 연가 → 질병휴직, 어떻게 이어지나","body":["2026년 인사혁신처 예규는 공무상 병가·일반병가·연가·질병휴직을 각각 요건을 채우면 승인(휴직은 임용권자 명령)을 거쳐 쓸 수 있다고 적고 있어, '병가 → 연가 → 휴직' 순서를 반드시 강제하지는 않는다. 다만 교육청 안내 중에는 병가·연가를 모두 쓴 뒤 휴직하게 하는 곳도 있으므로 실제 처리는 소속 교육청(교육지원청) 휴직 담당과 협의한다. 일반병가가 끝났는데도 요양이 필요하면 수업일이라도 예규 제5조제1항제4호로 연가를 쓸 수 있다.","질병휴직은 1년 이내(부득이하면 1년 연장), 공무상 질병·부상이면 3년 이내(2년 연장)다. 휴직 기간은 연가 산정에서 빠지므로, 휴직 들어가기 전 쓴 연가가 줄어든 연가 일수를 넘으면 결근 처리될 수 있다."],"basis":"인사혁신처 예규 제8장 4-나(3)(나); 교원휴가에 관한 예규 제5조제1항제4호; 교육공무원법 제45조; 국가공무원 복무규정 제17조제2·3항"},{"title":"감염병에 걸렸을 때","body":["감염병에 걸려 출근하면 다른 교직원·학생의 건강에 영향을 줄 우려가 있을 때도 일반병가 사유다(교원 예규는 '다른 교직원, 학생 등'으로 적었다). 병가는 연가와 달리 수업일 사용 제한 규정이 없다.","제1급 감염병 예방접종이나 행정기관 명령에 따른 감염 여부 검사는 병가가 아니라 공가 사유다('특별휴가' 항목의 공가 표 참고)."],"basis":"교원휴가에 관한 예규 제3조제2호·제7조제14호; 국가공무원 복무규정 제18조제1항제2호"}],"tables":[{"title":"병가 한눈에 보기","head":["구분","일반병가","공무상 병가"],"rows":[["요건","질병·부상으로 직무 수행 불가, 감염병으로 타인 건강 우려","공무상 질병·부상으로 직무 수행 불가 또는 요양 필요"],["한도","연 60일(매년 1월 1일 새로)","연 180일(같은 사유는 연도 구분 없이 180일)"],["판단","학교장(진단서·직무 수행 가능 여부)","공무원 재해보상법 요양 승인 결정 범위. 6일 이내 경미한 경우 학교장 판단 가능"],["진단서","연간 누계 6일 초과 또는 7일 이상 연속 시","요양 승인 서류·진단서"],["시간 단위","병지참·병조퇴·병외출 누계 8시간 = 1일","같음"],["다 쓴 뒤","연가(수업일 4호) → 질병휴직","일반병가 승인 가능 → 연가 → 휴직"]],"note":"출처: 국가공무원 복무규정 제18조, 인사혁신처 예규 제8장 4-나, 교원휴가에 관한 예규 제6조."}],"faq":[{"q":"감기로 이틀 쉬는데 진단서가 필요한가요?","a":"그해 병가 누계(시간 단위 포함)가 이번 이틀을 더해도 6일 이하이면 진단서 없이 쓸 수 있다. 누계가 6일을 넘는 날부터는 진단서가 필요하고, 못 내면 그 일수는 연가에서 빠진다."},{"q":"아침에 갑자기 아파서 병원부터 갔어요. 진단서는 나중에 내도 되나요?","a":"당일 진단서를 붙이지 못했으면 우선 연가로 처리하고, 진단서를 발급받은 뒤 병가로 소급 처리할 수 있다. 출근 전에 교감에게 연락해 수업 보결을 먼저 부탁한다."},{"q":"병원 진료 때문에 2시간 조퇴했어요. 병가인가요 연가인가요?","a":"본인 질병 진료면 병조퇴로 신청한다. 질병·부상으로 인한 지각·조퇴·외출은 누계 8시간이 병가 1일이다. 개인 용무 조퇴는 연가에서 빠지므로 구분해서 올린다."},{"q":"12월에 병가 60일을 다 썼는데 1월에도 계속 아파요.","a":"일반병가는 1월 1일~12월 31일 단위라 다음 해 1월부터 다시 60일을 쓸 수 있다. 같은 사유이고 진단서의 향후 치료기간 안이면 전년도 진단서로 갈음할 수 있다."},{"q":"체육 수업 시범을 보이다 다쳤어요. 일반병가를 써야 하나요?","a":"공무 중 부상이면 공무상 요양 승인을 받아 공무상 병가(연 180일)를 쓸 수 있다. 승인 심의 중에는 일반병가·연가를 쓰고, 공무상으로 결정되면 공무상 병가로 소급 처리할 수 있다. 6일 이내 단순 안정이면 학교장이 판단해 바로 공무상 병가를 줄 수 있다."},{"q":"질병휴직이 끝났는데 아직 다 안 나았어요. 병가로 이어 쉴 수 있나요?","a":"안 된다. 질병휴직은 완쾌해야 복직하는 구조라 휴직 만료 시 같은 사유로 연속해 일반병가를 승인할 수 없다. 휴직 연장(부득이한 경우 1년) 가능 여부를 교육지원청과 협의한다."}],"record":"병가는 나이스 [나의메뉴]-[복무]-[개인근무상황신청]에서 병가·병지참·병조퇴·병외출 중 골라 신청하고, 복무 담당은 [복무]-[근무상황관리]에서 대리 신청할 수 있다. 진단서는 결재 때 첨부하거나 복무 담당에게 따로 제출해 학교가 보관하며, 병명은 사유란에 자세히 쓰지 않는다. 진단서 없이 연 6일을 넘긴 병가는 연가로 바꿔 처리하고, 진단서를 늦게 낸 경우 연가로 올린 건을 취소하고 병가로 다시 올린다(취소는 상신함에서 기결문서 취소 후 재신청). 공무상 병가는 요양 승인 결정 문서를 근거로 종별을 공무상 병가로 처리하고, 소급하면 기존 일반병가·연가 건을 정정한다.","sources":[{"title":"교원휴가에 관한 예규(교육부예규 제104호, 시행 2026.2.27.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원휴가에관한예규"},{"title":"국가공무원 복무규정(대통령령 제36442호, 시행 2026.6.23.)","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규정"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 시행 2026.6.23.) 제8장 휴가","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/국가공무원복무·징계관련예규"},{"title":"교육공무원법(시행 2026.2.15.) 제41조·제44조·제45조","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"국가공무원 복무규칙(총리령 제2086호, 시행 2026.1.1.) 제7조·제8조, 별지 제1호서식 근무상황부","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규칙"}],"verified":"2026-09-29","uncertain":["공무상 요양 승인 신청 서식·제출처(공무원연금공단 경유 여부, 온라인 신청 경로)는 이번에 공식 문서 원문으로 확인하지 못했다. 공무원연금공단 안내를 따로 확인해야 한다('공무 중 부상' 관련 항목 참고)","진단서 대신 소견서·진료확인서를 인정하는지는 공식 문서에서 확인하지 못했다(예규는 「의료법」 제17조에 따른 진단서로 적음)","나이스에서 진단서를 첨부하는 정확한 화면 위치는 확인하지 못했다","교육공무직원·기간제교원의 병가 기준은 다루지 않았다","다른 시·도교육청의 병가·질병휴직 연계 기준은 이번에 확인하지 않았다"],"related":["leave-annual","leave-special","leave-of-absence","maternity"]},{"id":"leave-special","title":"특별휴가(경조사·포상·재해구호·장기재직·교권침해)와 공가 구분 — 수업일 사용","aka":["특별휴가","경조사휴가","경조사","상 당했을 때","부친상","모친상","조부모상","결혼 휴가","자녀 결혼","배우자 출산휴가","공가","건강검진 공가","예비군 공가","투표 공가","포상휴가","재해구호휴가","장기재직휴가","교권침해 특별휴가","형제 장례","장인상"],"category":"휴가","urgency":"당일","roles":["교사 본인","복무 담당(교무부)","교감","학교장","교육지원청"],"summary":"특별휴가는 경조사처럼 사회통념상 특별한 사유가 있을 때 받는 휴가이고, 공가는 병역·투표·건강검진처럼 국민으로서 의무를 이행하거나 국가기관 업무에 협조할 때 받는 휴가로 서로 다르다. 경조사휴가는 본인 결혼 5일, 부모·배우자 사망 5일, 조부모·형제자매·자녀 사망 3일, 배우자 출산 20일(다태아 25일) 등 복무규정 별표 2 일수를 주어야 하며, 연가와 달리 수업일 사용 제한이 없다. 포상휴가(10일 이내)·재해구호휴가(5일, 대규모 재난 피해 10일)는 학교장이 판단해 주는 휴가이고, 교육활동 침해 피해 교원은 5일(상해·폭행·성폭력 범죄면 5일 추가) 특별휴가를 받을 수 있다. 장기재직휴가는 2026.6.23. 개정으로 5~10년 3일, 10~20년 5일, 20년 이상 7일이며, 수업일 사용은 학교장이 학사일정을 보고 승인하고 세부 지침은 교육감이 정하므로(교원휴가에 관한 예규 제8조제4항) 소속 시·도교육청 지침을 확인한다. 대부분 일 단위로만 쓰고, 공가·특별휴가는 연가 일수에서 빠지지 않는다.","first":["상을 당했으면 먼저 교감에게 연락해 수업 보결을 부탁하고, 누구의 상인지(부모·조부모·형제자매 등)로 일수를 확인한다. 휴가는 사망일(또는 장례일)이나 그 다음 날부터 연속으로 쓴다","나이스 근무상황 종별을 정확히 고른다 — 경조사는 특별휴가, 건강검진·예비군·투표는 공가, 장기재직휴가는 '장기재직휴가' 종별로 신청한다","수업일이라도 경조사휴가·공가는 쓸 수 있다. 다만 수업 결손 대책(보결·교체)은 학교가 정하므로 가능한 한 빨리 알린다","경조사휴가에 없는 장례(이모·고모·삼촌·형수·제부 등)는 특별휴가가 아니라 수업일 연가 6·7호로 1일을 쓴다('연가' 항목)","증빙(청첩장·부고·가족관계증명서·검진 안내문·훈련 통지서 등)은 학교가 요구할 수 있으니 챙겨 둔다","장기재직휴가는 소속 시·도교육청 지침과 학교 계획에서 신청 기한·학년 초 수요 조사 여부를 확인하고 희망일을 미리 낸다"],"steps":[{"stage":"미리 확인","when":"사유가 생기면 바로","who":"교사 본인","what":"특별휴가인지 공가인지 연가인지 구분","detail":"경조사·출산·포상·재해구호·장기재직·교권침해 피해는 특별휴가, 병역판정검사·예비군 훈련·국가기관 소환·투표·승진시험·원격지 전보 부임·법정 건강검진·헌혈·외국어시험·국가적 행사 참가·천재지변으로 출근 불가 등은 공가다. 공가는 '직접 필요한 기간 또는 시간'만 주고 당일 왕복 소요 시간을 더할 수 있다. 어디에도 해당하지 않는 개인 일은 연가다.","basis":"교원휴가에 관한 예규 제3조·제7조; 인사혁신처 예규 제8장 2-나·4-다"},{"stage":"미리 확인","when":"경조사가 생겼을 때","who":"교사 본인","what":"경조사휴가 일수 확인","detail":"결혼(본인 5일, 자녀 1일), 배우자 출산 20일(한 번에 둘 이상 25일), 입양 20일, 사망(배우자·본인 및 배우자의 부모 5일, 본인 및 배우자의 조부모·외조부모 3일, 자녀와 그 배우자 3일, 본인 및 배우자의 형제자매 3일)이다. 입양 외 경조사는 원격지(가장 빠른 교통수단으로 왕복 8시간 이상)면 2일 범위에서 왕복 일수를 더할 수 있다.","basis":"국가공무원 복무규정 제20조제1항·별표 2; 인사혁신처 예규 제8장 4-라(1)"},{"stage":"신청·보고","when":"경조사 당일(부고를 받은 즉시)","who":"교사 본인(또는 대신 연락한 교직원)","what":"연락과 나이스 신청","detail":"휴가는 미리 신청해 승인받는 것이 원칙이지만, 상사처럼 미리 못 받은 경우 늦어도 당일 정오까지 절차를 취하고 다른 사람이 대신할 수 있다. 나이스 [나의메뉴]-[복무]-[개인근무상황신청]에서 특별휴가(경조사)를 고르고 기간과 대상(예: 조모 사망)을 적어 상신한다. 복무 담당은 대리 신청할 수 있다.","basis":"인사혁신처 예규 제8장 3-나(1); 교원휴가에 관한 예규 제4조제4항·제11조"},{"stage":"결재·승인","when":"신청 직후","who":"교감·학교장","what":"승인과 수업 대책","detail":"경조사휴가는 복무규정이 '신청에 따라 주어야 한다'로 정해 학교장 재량이 아니다. 연가와 달리 예규의 '수업일 제외' 원칙은 연가에만 적용되므로 수업일에도 승인한다. 학교장은 보결·수업 교체·업무대행자 지정으로 수업 결손을 막는다.","basis":"국가공무원 복무규정 제20조제1항; 교원휴가에 관한 예규 제4조"},{"stage":"사용·이행","when":"경조사휴가를 쓰는 동안","who":"교사 본인","what":"연속 사용과 분할 예외","detail":"경조사휴가는 사유 발생일을 포함해 전후로 연속해 쓰고, 토요일·공휴일로 나뉘는 경우 외에는 나눠 쓸 수 없다. 예외: 본인 결혼은 결혼식일 또는 혼인신고일부터 30일 이내(업무상 불가피하면 90일 이내), 배우자 출산은 출산예정일 30일 전부터 출산 후 120일 이내에 3회까지 나눠 사용(다태아는 150일 이내 5회), 사망은 사망일·장례일 또는 사망일 다음 날부터 사용한다. 일 단위로만 쓴다.","basis":"인사혁신처 예규 제8장 4-라(1)(라)(마)"},{"stage":"신청·보고","when":"건강검진·예비군·투표 등 공가 사유일 때","who":"교사 본인","what":"공가 신청과 증빙","detail":"공가는 학교장이 '승인하여야' 하는 휴가다. 건강검진은 「국민건강보험법」 제52조 검진 등 법정 검진만 해당하고 재검·확진검사는 공가가 아니다(산업안전보건법상 의무 확진검사는 제외). 예비군 훈련은 통지서나 훈련 확인서를 낸다. 제1급 감염병 예방접종은 공가지만 일반 독감 예방접종은 아니다. 승진시험 준비 기간은 공가가 아니다.","basis":"교원휴가에 관한 예규 제7조; 인사혁신처 예규 제8장 4-다(2)"},{"stage":"결재·승인","when":"공적이 있을 때","who":"복무 담당 → 학교장","what":"포상휴가 부여","detail":"국가나 기관의 주요 업무를 성공적으로 수행해 탁월한 성과와 공로가 인정되면 10일 이내 포상휴가를 줄 수 있다. 판단 기준 예: 훈장·포장, 국무총리 이상 표창, 모범공무원 선발, 중앙행정기관장 표창 등. 포상휴가 공적조서로 확인 후 기관장이 최종 승인한다. 같은 사유는 1회, 사유 발생일부터 6개월 이내에 쓰고 나눠 쓸 수 없으며 일 단위로만 쓴다. 선거 투·개표 사무에 공로가 있으면 기관장 판단으로 1일 범위 포상휴가를 줄 수 있다.","basis":"국가공무원 복무규정 제20조제13항; 인사혁신처 예규 제8장 4-라(9); 교원 휴가 질의·답변 자료집 질의39"},{"stage":"결재·승인","when":"재난 피해를 입었거나 재난 지역 봉사를 하려 할 때","who":"교사 본인 → 학교장","what":"재해구호휴가","detail":"「재난 및 안전관리 기본법」상 재난으로 본인·배우자·본인 및 배우자의 부모·자녀가 상당한 피해를 입었거나, 재난 발생 지역에서 자원봉사를 하려면 5일 이내 재해구호휴가를 받을 수 있다. 대규모 재난 피해로 장기 수습이 필요하다고 학교장이 인정하면 10일 이내다(봉사 목적은 최대 5일). 학교장은 재난 규모·피해 정도·봉사 필요성을 따져 신중히 승인하고 남용되지 않게 하며, 일 단위로만 쓴다. 대규모 재난 지역이라도 자원봉사 목적은 최대 5일이다.","basis":"국가공무원 복무규정 제20조제9항; 인사혁신처 예규 제8장 4-라(8)"},{"stage":"결재·승인","when":"교육활동 침해 피해를 입었을 때","who":"학교장","what":"교권침해 피해교원 특별휴가","detail":"「교원지위법」 제19조의 교육활동 침해행위로 피해를 입은 교원에게 학교장은 회복 지원을 위해 5일 범위의 특별휴가를 줄 수 있다. 침해행위가 상해·폭행 등(형법 제257조~제265조)이나 성폭력범죄에 해당하면 5일을 더 줄 수 있다(2026.2.27. 신설). 연간 한도는 따로 없으나 학교 자체 증빙자료를 붙인 내부 결재 등 근거가 필요하다.","basis":"교원휴가에 관한 예규 제8조제1항; 교원 휴가 질의·답변 자료집 질의23"},{"stage":"미리 확인","when":"학년 초(교육청 지침·학교 계획에 따라)","who":"학교장·교감 → 교사 본인","what":"장기재직휴가 수요 조사","detail":"장기재직휴가는 재직 5~10년 3일, 10~20년 5일, 20년 이상 7일을 각 재직구간에 1회 준다. 수업일에 쓰는 것은 학교장이 학사일정과 인력운영 상황을 보고 승인하고, 교육감이 관련 지침을 세우고 수업 결손 대책을 마련한다. 그래서 학년 초 수요 조사, 희망일이 겹칠 때의 우선 승인 기준, 대체인력 확보 방법은 소속 시·도교육청 지침과 학교 계획을 따른다.","basis":"국가공무원 복무규정 제20조제18항; 교원휴가에 관한 예규 제8조제4항"},{"stage":"신청·보고","when":"사용 희망일 전(교육청 지침·학교 계획의 기한까지)","who":"교사 본인","what":"장기재직휴가 나이스 신청","detail":"나이스 개인근무상황으로 장기재직휴가를 신청한다(종별 이름은 교육청 안내로 확인). 연속 사용이 원칙이고 필요하면 1회만 나눠 쓸 수 있으며, 일 단위로만 쓰고 해당일에 유연근무를 하지 않도록 미리 조치한다. 주요 학사일정 등 사용을 제한하는 시기는 교육청 지침과 학교 계획으로 정한다.","basis":"인사혁신처 예규 제8장 4-라(14); 교원휴가에 관한 예규 제8조제4항"},{"stage":"사후 관리","when":"휴가 사용 뒤","who":"복무 담당(교무부)","what":"기록 정리","detail":"포상휴가 공적조서, 재해구호휴가 피해 확인 자료, 교권침해 특별휴가 내부 결재 문서는 복무 점검에 대비해 보관한다. 장기재직휴가 사용 현황을 인사기록 등에 어떻게 남기는지는 교육청 안내를 따른다.","basis":"인사혁신처 예규 제8장 4-라(9); 교원휴가에 관한 예규 제8조제1항"}],"deadlines":[{"what":"본인 결혼 경조사휴가(5일)","limit":"결혼식일 또는 혼인신고일부터 30일 이내(업무상 불가피하면 90일 이내). 마지막 날이 기간 안","basis":"인사혁신처 예규 제8장 4-라(1)(라)"},{"what":"배우자 출산 경조사휴가(20일, 다태아 25일)","limit":"출산예정일 30일 전~출산 후 120일(다태아 150일) 이내, 3회(다태아 5회)까지 분할","basis":"국가공무원 복무규정 별표 2; 인사혁신처 예규 제8장 4-라(1)(라)"},{"what":"사망 경조사휴가","limit":"사망일·장례일 또는 사망일 다음 날부터 연속 사용(토·공휴일로 나뉘는 것 외 분할 불가)","basis":"인사혁신처 예규 제8장 4-라(1)(라)"},{"what":"포상휴가(10일 이내)","limit":"사유 발생일부터 6개월 이내, 1회, 분할 불가","basis":"인사혁신처 예규 제8장 4-라(9)"},{"what":"재해구호휴가","limit":"5일 이내(대규모 재난 피해 10일 이내, 봉사 목적 최대 5일)","basis":"국가공무원 복무규정 제20조제9항"},{"what":"교권침해 피해교원 특별휴가","limit":"5일 범위 + 상해·폭행·성폭력범죄면 5일 추가","basis":"교원휴가에 관한 예규 제8조제1항"},{"what":"장기재직휴가","limit":"5~10년 3일, 10~20년 5일, 20년 이상 7일. 해당 구간 안에만 사용(미사용분 소멸). 2026.6.23. 당시 재직 8~10년 미만은 2028.6.23.까지, 2025.7.22. 당시 18~20년 미만은 2027.7.22.까지 특례","basis":"국가공무원 복무규정 제20조제18항·부칙(2025.7.22., 2026.6.23.)"},{"what":"장기재직휴가 신청 기한·수요 조사","limit":"교육감 지침과 학교 계획으로 정한다(시·도교육청마다 다르다)","basis":"교원휴가에 관한 예규 제8조제4항"}],"dont":["경조사휴가를 장례 뒤로 미뤄 나눠 쓰지 않는다 — 결혼·배우자 출산 외에는 사유 발생일 전후 연속 사용이 원칙이다","경조사 대상이 아닌 친척 장례를 특별휴가로 올리지 않는다 — 이모·고모·삼촌·형수·제부 장례는 수업일 연가 6·7호 사유다","건강검진 재검·확진검사를 공가로 올리지 않는다 — 수검 의무가 없는 검사는 공가 대상이 아니다","일반 독감 예방접종에 공가를 쓰지 않는다 — 공가는 제1급 감염병 예방접종과 해외 공무출장 전 검역감염병 접종만 해당한다","장기재직휴가를 반일·시간 단위로 쪼개거나 유연근무일에 쓰지 않는다 — 일 단위로만 쓰고 해당일 유연근무를 하지 않도록 미리 조치해야 한다(인사혁신처 예규 제8장 4-라(14))","사실혼 배우자의 부모 상에 경조사휴가를 신청하지 않는다 — 가족관계로 등록된 경우만 대상이다(사실혼 배우자 출산은 자녀 가족관계로 가능)","재난 지역 자원봉사를 개인적으로 가면서 출장 처리를 기대하지 않는다 — 복무규정은 이를 재해구호휴가(5일 이내) 사유로 정했다. 학교 계획에 따른 봉사의 출장 처리 여부는 교육청 안내로 확인한다"],"contacts":[{"name":"교육부 교원정책과(교원휴가에 관한 예규 소관)","tel":"044-203-6497","note":"국가법령정보센터 예규 제104호 표시 담당 번호"},{"name":"소속 시·도교육청 교원 복무 담당","tel":"소속 교육청","note":"장기재직휴가 지침·교권침해 특별휴가 운영은 교육청마다 다르다"}],"forms":["나이스 개인근무상황 신청(특별휴가·공가·장기재직휴가) — 교원 근무상황부는 나이스로 관리(교원휴가에 관한 예규 제4조제4항)","근무상황부(국가공무원 복무규칙 별지 제1호서식) — 나이스를 쓰지 않을 때의 종이 서식","경조사 증빙(청첩장·부고·가족관계증명서 등) — 학교장이 요구할 때","포상휴가 공적조서(인사혁신처 예규 제8장 붙임 1)","교원 장기재직휴가 사용 신청서 — 시·도교육청 지침·학교 계획의 서식","공가 증빙: 예비군 훈련 통지서·확인서, 법원·검찰 출석요구서, 건강검진 안내 등","교권침해 특별휴가 내부 결재(학교 자체 증빙자료 첨부)"],"law":[{"name":"국가공무원 복무규정","article":"제20조제1항·별표 2","point":"경조사휴가는 신청에 따라 주어야 함. 결혼 본인 5·자녀 1, 배우자 출산 20(다태아 25), 입양 20, 부모·배우자 사망 5, 조부모·자녀·형제자매 사망 3"},{"name":"국가공무원 복무규정","article":"제20조제9항·제13항·제18항","point":"재해구호휴가 5일(대규모 재난 10일), 포상휴가 10일 이내, 장기재직휴가 5~10년 3일·10~20년 5일·20년 이상 7일(2026.6.23. 개정)"},{"name":"교원휴가에 관한 예규(교육부예규 제104호)","article":"제7조(공가)","point":"학교장은 병역·소환·투표·승진시험·원격지 전보·법정 건강검진·마약류 중독 검사·헌혈·외국어시험·국가 행사·출근 불가·교섭 참석·검역/제1급 감염병 접종 등에 직접 필요한 기간·시간 공가를 승인"},{"name":"교원휴가에 관한 예규","article":"제8조(특별휴가)","point":"교육활동 침해 피해 5일(+범죄 해당 시 5일), 수업일 장기재직휴가는 학교장이 학사일정 고려해 승인·교육감 지침, 그 밖은 복무규정·인사혁신처 예규"},{"name":"국가공무원 복무규정","article":"제22조","point":"동일 사유 공가·특별휴가 합계 30일 이상이면 토·공휴일 산입"}],"deep":[{"title":"경조사 일수, 옛 표를 보면 틀린다","body":["현행 복무규정 별표 2는 본인·배우자 형제자매 사망 3일, 배우자 출산 20일(다태아 25일)이다. 형제자매 사망은 2024.7.2. 개정 전 1일이었고, 배우자 출산은 2025.2.11. 개정 전 10일이었다.","학교·교육청 자료실에 올라 있는 복무 표 중에는 배우자 출산 10일·형제자매 1일처럼 개정 전 일수나, 지방공무원(행정실 직원) 복무 기준이 그대로 남아 있는 경우가 있다. 교원은 국가공무원이므로 현행 국가공무원 복무규정 별표 2로 확인한다."],"basis":"국가공무원 복무규정 별표 2(2026.6.23.)·개정 연혁"},{"title":"공가와 특별휴가, 연가의 경계","body":["공가는 '국민의 의무 이행'이나 '국가기관 협조'가 기준이다. 민사소송 당사자로 출석하면 연가지만, 정당한 공무수행과 관련해 제기된 소송의 당사자이거나 참고인·증인으로 출석하면 공가다. 징계·소청 당사자·참고인 출석도 공가이고, 업무 담당자의 출석은 출장이다.","원격지 전보 부임 공가는 이사 등 최소 일수를 포함해 부임일 다음 정상근무일까지 쓸 수 있다. 행사 참가 공가는 선수·심판 등 공가가 불가피하다고 인정되는 경우에 한한다. 교원 노조·단체 대의원회 참석 공가는 연 1회다."],"basis":"인사혁신처 예규 제8장 4-다(2)·(3) 사례; 교원휴가에 관한 예규 제7조"},{"title":"수업일에 쓸 수 있나","body":["예규 제4조의 '수업일 제외' 원칙은 연가에만 걸린다. 경조사휴가는 신청하면 주어야 하는 휴가이고, 공가는 학교장이 승인해야 하는 휴가이므로 수업일에도 쓴다. 포상휴가·재해구호휴가는 학교장 판단으로 부여하므로 학사일정을 고려해 날짜를 조정할 수 있다.","장기재직휴가는 예규 제8조제4항이 '학교장은 학사일정과 인력운영을 고려해 수업일 중 장기재직휴가를 승인할 수 있다'고 정하고, 교육감이 지침과 수업 결손 대책을 마련하게 했다. 구체적인 수요 조사·우선 승인 기준·대체인력 확보 방법은 소속 시·도교육청 지침으로 확인한다."],"basis":"교원휴가에 관한 예규 제4조·제7조·제8조제4항; 국가공무원 복무규정 제20조제1항"},{"title":"장기재직휴가 계산","body":["재직기간은 복무규정 제15조제2항(연가 재직기간)과 같고, 휴가 사용 직전일 기준으로 공무원연금법 재직기간을 연월일수로 센다. 육아휴직·법정의무 휴직·공무상 질병휴직은 넣고, 그 밖의 휴직·정직·직위해제 기간은 뺀다.","5~10년 3일과 10~20년 5일은 그 구간 안에만 쓸 수 있고 남으면 소멸한다. 이전에 지방공무원 등으로 자기계발휴가·학습휴가 같은 유사 휴가를 쓴 적이 있으면 같은 구간 사용일수를 빼고 준다. 2026.6.23. 시행 당시 재직 8~10년 미만이면 3일을 2028.6.23.까지 쓸 수 있다."],"basis":"국가공무원 복무규정 제15조제2항·제20조제18항·부칙; 인사혁신처 예규 제8장 4-라(14)"}],"tables":[{"title":"경조사별 휴가 일수(교원·국가공무원)","head":["구분","대상","일수"],"rows":[["결혼","본인","5일"],["결혼","자녀","1일"],["출산","배우자(한 번에 둘 이상 출산)","20일(25일)"],["입양","본인","20일"],["사망","배우자, 본인 및 배우자의 부모","5일"],["사망","본인 및 배우자의 조부모·외조부모","3일"],["사망","자녀와 그 자녀의 배우자","3일"],["사망","본인 및 배우자의 형제자매","3일"]],"note":"입양 외 경조사는 원격지(왕복 8시간 이상)면 2일 범위에서 왕복 일수 가산. 토·공휴일로 나뉘는 경우 외 분할 불가, 일 단위만. 출처: 국가공무원 복무규정 별표 2(2026.6.23.), 인사혁신처 예규 제8장 4-라(1)."},{"title":"공가·특별휴가 종류별 한눈에","head":["종류","일수","누가 정하나","수업일"],"rows":[["공가(검진·예비군·투표 등)","직접 필요한 기간·시간(왕복 가산 가능)","학교장이 승인해야 함","사용 가능"],["경조사휴가","별표 2 일수","신청하면 주어야 함","사용 가능"],["포상휴가","10일 이내(6개월 안, 1회)","학교장 판단(공적조서)","학교장이 날짜 조정 가능"],["재해구호휴가","5일(대규모 재난 피해 10일)","학교장 판단","학교장이 필요성 판단"],["교권침해 피해교원 특별휴가","5일(+범죄 해당 5일)","학교장 판단(내부 결재)","사용 가능"],["장기재직휴가","5~10년 3일, 10~20년 5일, 20년 이상 7일","학교장 승인(교육감 지침)","학사일정 고려해 승인 가능"]],"note":"출산휴가·임신검진·모성보호시간·육아시간·가족돌봄휴가는 '출산·모성보호'·'육아시간' 항목에서 다룬다. 출처: 국가공무원 복무규정 제20조, 교원휴가에 관한 예규 제7·8조, 인사혁신처 예규 제8장."}],"faq":[{"q":"금요일 저녁에 할머니가 돌아가셨어요. 휴가는 언제부터 며칠인가요?","a":"조부모(외조부모 포함) 사망은 3일이다. 사망일, 장례일 또는 사망일 다음 날부터 쓸 수 있고 토·일요일로 나뉘는 것은 괜찮으므로 월~수요일을 쓰면 된다. 원격지(왕복 8시간 이상)면 2일 범위에서 왕복 일수를 더할 수 있다."},{"q":"형이나 누나가 돌아가시면 며칠인가요? 학교 표에는 1일로 나와 있던데요.","a":"현행 국가공무원 복무규정 별표 2는 본인 및 배우자의 형제자매 사망 3일이다. 1일은 옛 기준이나 지방공무원(행정실) 조례 표다. 형제자매의 배우자(형수·제부 등) 장례는 경조사휴가가 없어 수업일 연가 7호로 1일을 쓴다."},{"q":"건강검진 받는 날은 공가인가요? 재검은요?","a":"「국민건강보험법」 제52조 건강검진 등 법정 검진은 공가로, 검진에 직접 필요한 시간(왕복 포함)만 받는다. 재검·2차검진·확진검사처럼 수검 의무가 없는 검사는 공가가 아니므로 병가나 연가를 쓴다."},{"q":"수업일에 경조사휴가를 써도 되나요?","a":"된다. 수업일을 피하라는 원칙(예규 제4조)은 연가에만 적용되고, 경조사휴가는 신청하면 주어야 하는 휴가다. 다만 보결 편성을 위해 가능한 한 빨리 교감에게 알린다."},{"q":"교육감 표창을 받았는데 포상휴가를 받을 수 있나요?","a":"포상휴가는 탁월한 성과와 공로가 인정될 때 학교장이 10일 이내로 줄 수 있는 휴가다. 인사혁신처 예규는 훈장·포장, 국무총리 이상 표창, 모범공무원, 중앙행정기관장 표창 등을 예로 들고 그 밖은 기관장이 구체적 사실에 근거해 인정하게 했다. 공적조서로 확인받고, 사유 발생일부터 6개월 안에 한 번에 써야 한다."},{"q":"장기재직휴가를 방학 말고 학기 중에 써도 되나요?","a":"예규 제8조제4항에 따라 학교장이 학사일정과 인력 상황을 보고 수업일에도 승인할 수 있다. 학년 초 수요 조사, 겹칠 때의 우선 승인 기준, 제한 시기, 신청 기한은 소속 시·도교육청 지침과 학교 계획을 따른다."}],"record":"특별휴가는 나이스 [나의메뉴]-[복무]-[개인근무상황신청]에서 종별을 특별휴가로 골라 세부 종류(경조사·포상·재해구호 등)와 대상(예: 조모 사망)을 적어 신청한다. 공가는 종별 '공가'로 사유(건강검진, 예비군 훈련 등)를 적고, 필요한 시간만 시간 단위로 올린다. 장기재직휴가는 나이스에 별도 종별이 있으면 그 종별로 신청하고(사유 예: 장기재직휴가(재직기간 ○○년)), 사용 현황이 인사기록에 어떻게 반영되는지는 소속 교육청 안내로 복무 담당이 확인한다. 포상휴가 공적조서, 교권침해 특별휴가 내부 결재, 재해 피해 확인 자료는 학교에 보관한다.","sources":[{"title":"교원휴가에 관한 예규(교육부예규 제104호, 시행 2026.2.27.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원휴가에관한예규"},{"title":"국가공무원 복무규정(대통령령 제36442호, 시행 2026.6.23.)","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규정"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 시행 2026.6.23.) 제8장 휴가","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/국가공무원복무·징계관련예규"},{"title":"국가공무원 복무규칙(총리령 제2086호, 시행 2026.1.1.) 제7조·제8조, 별지 제1호서식 근무상황부","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규칙"}],"verified":"2026-09-29","uncertain":["교권침해 특별휴가의 나이스 종별 이름과 필요한 증빙 범위는 공식 문서에서 확인하지 못했다","교육부 질의·답변 자료집(2022.7.)의 경조사 표는 개정 전 기준이라 쓰지 않고 현행 복무규정 별표 2를 따랐다","심리안정휴가(복무규정 제20조, 인명피해 사건·사고 경험 시 4일)가 교원에게 어떻게 적용되는지는 교육부 안내를 찾지 못했다","다른 시·도교육청의 수업일 장기재직휴가 지침(신청 기한·우선 승인 기준)은 이번에 확인하지 않았다"],"related":["leave-annual","leave-sick","maternity","childcare-time","transfer"]},{"id":"maternity","title":"임신·출산 — 모성보호시간·임신검진휴가·출산휴가·유산사산휴가·난임치료시술휴가·배우자 출산휴가","aka":["출산휴가","산전후휴가","출산휴가 90일","쌍둥이 출산휴가","출산휴가 분할","모성보호시간","임신 2시간","임신검진휴가","임신검진 동행휴가","유산휴가","사산휴가","난임휴가","시험관 휴가","배우자 출산휴가","아내 출산","남편 출산휴가 20일","임신 중 육아휴직","산전 육아휴직","임신했어요","미숙아 출산휴가"],"category":"모성·육아","urgency":"미리 신청","roles":["교사 본인","복무 담당(교무부)","교감","학교장","행정실(급여)","교육지원청(휴직 발령)"],"summary":"교원의 휴가는 「교원휴가에 관한 예규」가 특례로 정한 것 말고는 「국가공무원 복무규정」과 인사혁신처 「국가공무원 복무·징계 관련 예규」를 그대로 따르므로, 임신·출산 관련 특별휴가는 일반 공무원과 같다. 임신 중에는 1일 2시간 모성보호시간과 10일의 임신검진휴가를 쓸 수 있고, 출산하면 90일(다태아 120일, 미숙아 100일) 출산휴가를 쓰되 출산 후 45일(다태아 60일) 이상이 남도록 배치한다. 유산·사산하면 임신 주수에 따라 10~90일, 난임 시술은 시술 종류별 2~4일의 특별휴가가 있다. 남성 교원은 배우자 출산휴가 20일(다태아 25일), 임신검진 동행휴가 10일, 배우자 유산·사산휴가 3일을 쓸 수 있다. 여성 교원은 임신 사유만으로도 육아휴직(교육공무원법 제44조제1항제7호)을 할 수 있다. 휴직 중에는 출산휴가를 쓸 수 없으므로, 휴직 중 출산하면 실제 출산일에 맞춰 복직한 뒤 출산휴가를 쓰고 필요하면 다시 육아휴직한다.","first":["임신을 확인하면 임신확인서(또는 진단서·산모수첩)를 준비해 복무 담당에게 알린다. 모성보호시간·임신검진휴가는 최초 신청 때 한 번만 이 서류로 대상 여부를 확인한다","임신 12주 이내이거나 32주 이후라면 모성보호시간(1일 2시간)을 신청하면 학교장이 승인해야 한다. 그 사이 기간도 수업·업무에 지장이 없는 범위에서 보장된다","출산예정일이 적힌 진단서로 출산휴가 90일을 어떻게 배치할지 정한다. 출산 후 45일(다태아 60일)이 반드시 남아야 한다","유산·사산 경험이 있거나 만 40세 이상이거나 유산·조산 위험 진단서가 있으면, 출산 전에 최장 44일(다태아 59일)을 나누어 먼저 쓸 수 있다","지금 육아휴직 등 휴직 중이면 출산휴가를 쓸 수 없다. 실제 출산일에 맞춰 복직한 뒤 출산휴가를 신청해야 날짜를 잃지 않는다","배우자가 출산하는 남성 교원은 출산예정일 30일 전부터 출산 후 120일(다태아 150일) 안에 20일(25일)을 써야 한다. 기한을 넘기면 사라진다"],"steps":[{"stage":"미리 확인","when":"임신을 확인했을 때","who":"교사 본인","what":"쓸 수 있는 휴가·시간 파악","detail":"임신 중 쓸 수 있는 것은 모성보호시간(1일 2시간), 임신검진휴가(임신기간 10일), 출산 전 분할 출산휴가(요건 해당 시), 입덧 등으로 안정이 필요할 때의 일반 병가다. 교원휴가 예규는 이 특별휴가들에 대해 따로 정하지 않았으므로 국가공무원 복무규정과 인사혁신처 복무 예규를 그대로 적용한다(교원휴가에 관한 예규 제8조제5항·제11조). 학교장은 임신 중인 교원의 장거리·장기간 출장을 제한할 수 있고(본인 신청 시 가능), 임신 중이거나 출산 후 1년이 안 된 교원에게 오후 9시~오전 8시와 토요일·공휴일 근무를 명할 수 없다(본인 신청·동의 시 예외).","basis":"국가공무원 복무규정 제6조제5항·제11조제3항·제20조; 교원휴가에 관한 예규 제8조제5항·제11조"},{"stage":"신청·보고","when":"임신 기간 중 필요한 날","who":"교사 본인 → 교감·학교장","what":"모성보호시간 신청","detail":"1일 2시간 범위에서 늦게 출근, 일찍 퇴근, 근무 중간 어느 때든 쓸 수 있다. 임신 12주 이내 또는 32주 이후에 신청하면 승인해야 하고, 13~31주는 공무수행에 지장이 없는 범위에서 보장한다. 모성보호시간을 쓰고도 그날 실제 근무가 4시간 이상이어야 하며 모자라면 연가로 처리된다(예: 모성보호시간 2시간+연가 3시간 → 연가 5시간). 같은 날 육아시간과 겹쳐 쓸 수 없고, 모성보호시간을 쓰는 날에는 시간외근무를 명할 수 없다.","basis":"국가공무원 복무규정 제20조제4항; 국가공무원 복무·징계 관련 예규(2026.6.23.) 제8장 특별휴가 (5) 모성보호시간"},{"stage":"신청·보고","when":"산전 검진 날","who":"교사 본인(남성은 배우자 검진 동행)","what":"임신검진휴가·임신검진 동행휴가 신청","detail":"여성 교원은 임신기간 동안 10일, 남성 교원은 배우자 임신검진 동행을 위해 10일을 쓸 수 있다. 반일 또는 하루 단위로 신청하고 검진을 확인할 수 있는 자료(진료내역서 등)로 증빙한다. 최초 신청 때 임신확인서(남성은 가족관계증명서와 배우자 임신확인서)를 낸다. 예정일보다 일찍 출산하면 남은 일수가 있어도 실제 출산일부터는 쓸 수 없다.","basis":"국가공무원 복무규정 제20조제16항·제19항; 국가공무원 복무·징계 관련 예규 제8장 (11)·(12)"},{"stage":"신청·보고","when":"출산휴가 시작 전(출산예정일 진단서 발급 후)","who":"교사 본인","what":"출산휴가 신청과 기간 배치","detail":"출산 전후를 통틀어 90일(한 번에 둘 이상 임신 120일)을 쓰되 출산 후 45일(다태아 60일) 이상이 되게 배치한다. 배치는 의료기관 진단서의 출산예정일이 기준이다. 유산·사산 경험, 신청 당시 만 40세 이상, 유산·사산·조산 위험 진단서 중 하나에 해당하면 출산 전 어느 때라도 최장 44일(다태아 59일)을 나누어 쓸 수 있다. 출산휴가는 일 단위로만 쓰고, 30일 이상 이어지는 특별휴가라 토요일·공휴일도 일수에 들어간다.","basis":"국가공무원 복무규정 제20조제2항·제22조제4호; 국가공무원 복무·징계 관련 예규 제8장 (2) 출산휴가"},{"stage":"결재·승인","when":"신청 즉시","who":"학교장(위임전결 시 교감)","what":"승인과 수업 결손 대비","detail":"출산휴가·유산사산휴가·배우자 출산휴가 등은 요건만 맞으면 주어야 하는 휴가다. 학교장은 휴가로 수업 결손이 생기지 않게 보강·업무대행자 지정 등 조치를 해야 한다. 휴가로 1개월 이상 직무에 종사할 수 없으면 기간제교원을 임용할 수 있으므로, 출산휴가 90일은 대체 기간제 채용 사유가 된다.","basis":"교원휴가에 관한 예규 제4조제1항·제2항; 교육공무원 임용령 제13조제1항제1호"},{"stage":"사용·이행","when":"출산 직후","who":"교사 본인 → 복무 담당","what":"실제 출산일에 맞춰 기간 확정","detail":"휴직 중이 아닌 교원이 출산일에 출근해 그날을 휴가로 쓰지 못했다면 출산일 다음 날부터 90일을 쓸 수 있다. 미숙아(임신 37주 미만 또는 출생 체중 2.5kg 미만)를 낳아 생후 1일 이내에 신생아중환자실에 입원했다면 100일이 되는데, 추가 10일을 받으려면 90일 기준 휴가 종료예정일 7일 전까지 출생증명서 등과 신생아중환자실 입원 기록(진료비 세부내역서·진단서 등)을 내야 한다.","basis":"국가공무원 복무규정 제20조제2항; 국가공무원 복무·징계 관련 예규 제8장 (2)(가)"},{"stage":"사용·이행","when":"유산·사산했을 때","who":"교사 본인(배우자인 남성 교원 포함)","what":"유산·사산휴가 신청","detail":"임신 15주 이내 10일, 16~21주 30일, 22~27주 60일, 28주 이상 90일이다(30·60·90일은 토요일·공휴일 포함). 기간은 유산·사산한 날부터 세므로 늦게 신청하면 그만큼 줄어든다(그날 출근했다면 다음 날부터 기산). 「모자보건법」 제14조제1항에 해당하지 않는 인공임신중절은 대상이 아니다. 배우자가 유산·사산한 남성 교원은 위 기간 안에서 3일을 쓰고 1회 나누어 쓸 수 있다. 임신 중 심한 입덧 등으로 안정이 필요할 때는 이 휴가가 아니라 일반 병가를 쓴다.","basis":"국가공무원 복무규정 제20조제10항·제11항; 국가공무원 복무·징계 관련 예규 제8장 (2)(다)~(마)"},{"stage":"사용·이행","when":"난임 시술을 받을 때","who":"교사 본인","what":"난임치료시술휴가 신청","detail":"여성 교원은 시술마다 인공수정 2일, 동결배아 이식 체외수정 3일, 난자 채취 체외수정 4일을 쓴다. 시술일 당일(난자 채취 시 채취일 당일 포함)은 반드시 포함하고, 나머지는 전날·시술 후 2일 이내·시술에 반드시 따르는 병원진료일 중에서 고른다. 의사와 단순 상담만 하는 날은 안 된다. 남성 교원은 정자 채취일 당일 1일이다. 일 단위로만 쓴다. 장기간 치료가 필요하면 불임·난임휴직(교육공무원법 제44조제1항제7호의3, 1년+1년 연장)을 검토한다.","basis":"국가공무원 복무규정 제20조제12항; 국가공무원 복무·징계 관련 예규 제8장 (3); 교육공무원법 제45조제1항제1호"},{"stage":"사용·이행","when":"배우자 출산예정일 30일 전부터","who":"남성 교원 본인","what":"배우자 출산휴가 사용","detail":"20일(한 번에 둘 이상 출산 시 25일)이다. 출산예정일 30일 전부터 출산 후 120일(다태아 150일) 이내에 쓰고, 마지막 사용일도 이 기간 안에 있어야 한다. 3회 나누어(4개 구간) 쓸 수 있고 다태아는 5회(6개 구간)까지 나눌 수 있다. 경조사휴가이므로 일 단위로 쓴다.","basis":"국가공무원 복무규정 제20조제1항 별표 2; 국가공무원 복무·징계 관련 예규 제8장 (1)(라)"},{"stage":"신청·보고","when":"임신 중 휴직이 필요할 때","who":"여성 교원 본인 → 학교 → 교육지원청","what":"임신 사유 육아휴직 신청","detail":"교육공무원법은 '여성 교육공무원이 임신 또는 출산하게 된 경우'도 육아휴직 사유로 정하고 있어, 본인이 원하면 임용권자는 휴직을 명해야 한다. 휴직원과 함께 임신 사실을 입증하는 진단서 등을 낸다. 휴직원·확인서 양식, 제출 기한, 학기 단위 권장 여부는 소속 시·도교육청 지침으로 확인한다. 신청 서류·절차는 '육아휴직' 항목을 본다.","basis":"교육공무원법 제44조제1항제7호; 교육공무원 임용령 제19조의2"},{"stage":"복귀·정산","when":"휴직 중 출산이 다가올 때","who":"교사 본인 → 학교 → 교육지원청","what":"복직 → 출산휴가 → 다시 육아휴직","detail":"휴직 중에는 출산휴가를 쓸 수 없다. 인사혁신처 예규는 출산일 전에 육아휴직 등 휴직 중이면 실제 출산일에 맞추어 복직한 뒤 출산휴가를 신청하라고 한다. 예규 사례처럼 출산예정일에 맞춰 복직을 신청해 두었는데 더 일찍 출산하면, 출산휴가는 실제 출산일부터 90일이므로 그만큼 휴가일수를 잃는다(사례: 83일만 사용). 조기 출산 시 복직일 변경을 바로 요청한다. 출산휴가가 끝난 뒤 다시 육아휴직하는 순서와 복직일 처리 방식은 소속 시·도교육청 지침으로 확인한다.","basis":"국가공무원 복무·징계 관련 예규(2026.6.23.) 제8장 (2)(가) 및 사례"},{"stage":"사후 관리","when":"휴가가 끝난 뒤","who":"복무 담당·교사 본인","what":"근무상황 기록 확인과 이어지는 제도 연결","detail":"나이스 근무상황에 휴가 종류(특별휴가 중 출산휴가·임신검진휴가 등)와 기간이 정확히 들어갔는지 확인한다. 출산 뒤에는 육아휴직, 육아시간(8세 이하 또는 초2 이하 자녀, 36개월), 가족돌봄휴가로 이어진다. 출산 후 1년이 지나지 않았으면 야간·휴일 근무는 본인 동의가 있어야 명할 수 있다.","basis":"교원휴가에 관한 예규 제4조제4항; 국가공무원 복무규정 제11조제3항·제20조제5항"}],"deadlines":[{"what":"모성보호시간","limit":"임신 기간 중 1일 2시간 이내. 12주 이내·32주 이후 신청은 반드시 승인. 사용 후 그날 실근무 4시간 이상","basis":"국가공무원 복무규정 제20조제4항; 인사혁신처 복무 예규 제8장 (5)"},{"what":"임신검진휴가 / 임신검진 동행휴가(남성)","limit":"임신기간 중 각 10일, 반일·1일 단위. 실제 출산일부터는 사용 불가","basis":"국가공무원 복무규정 제20조제16항·제19항"},{"what":"출산휴가","limit":"90일(다태아 120일, 미숙아 신생아중환자실 입원 100일). 출산 후 45일(다태아 60일) 이상. 출산 전 분할은 최장 44일(다태아 59일)","basis":"국가공무원 복무규정 제20조제2항"},{"what":"미숙아 추가 10일 서류 제출","limit":"90일 기준 출산휴가 종료예정일 7일 전까지","basis":"인사혁신처 복무 예규 제8장 (2)(가)"},{"what":"유산·사산휴가","limit":"유산·사산한 날부터 15주 이내 10일, 16~21주 30일, 22~27주 60일, 28주 이상 90일. 배우자(남성)는 그 기간 안에서 3일","basis":"국가공무원 복무규정 제20조제10항·제11항"},{"what":"난임치료시술휴가","limit":"시술마다 인공수정 2일, 동결배아 체외수정 3일, 난자채취 체외수정 4일, 남성 정자채취일 1일. 연간 횟수 제한 없음","basis":"국가공무원 복무규정 제20조제12항; 교육부 교원 휴가 질의·답변 사례집 질의30"},{"what":"배우자 출산휴가","limit":"20일(다태아 25일). 출산예정일 30일 전 ~ 출산 후 120일(다태아 150일) 이내, 3회(다태아 5회)까지 분할","basis":"국가공무원 복무규정 별표 2; 인사혁신처 복무 예규 제8장 (1)(라)"}],"dont":["휴직 중에 출산휴가를 신청하지 않는다 — 휴직 중에는 출산휴가를 쓸 수 없으므로 실제 출산일에 맞추어 먼저 복직해야 한다(인사혁신처 예규)","출산예정일로 잡아 둔 복직일을 조기 출산 뒤에도 그대로 두지 않는다 — 출산휴가는 실제 출산일부터 세므로 늦게 복직하면 휴가일수를 잃는다(예규 사례: 83일만 사용)","출산휴가를 출산 전에 몰아 쓰지 않는다 — 출산 후 45일(다태아 60일)이 남아야 하고, 출산 전 분할은 요건(유산·사산 경험, 만 40세 이상, 위험 진단서)이 있을 때만 가능하다","모성보호시간과 육아시간을 같은 날 겹쳐 쓰지 않는다 — 둘 다 출근을 전제로 한 특별휴가라 중복 사용이 금지된다","모성보호시간 쓰는 날 시간외근무를 시키거나 신청하지 않는다 — 예규가 금지한다","배우자 출산휴가를 출산 후 120일(다태아 150일) 지나서 쓰려 하지 않는다 — 기한이 지나면 남은 일수도 소멸한다","임신검진휴가를 검진이 아닌 용도로 쓰지 않는다 — 검진 확인 자료로 증빙해야 하고, 기관장은 본래 목적대로 쓰이도록 관리해야 한다"],"contacts":[{"name":"소속 시·도교육청·교육지원청 교원 복무·휴직 담당","tel":"소속 교육청","note":"휴가 운영 세부와 임신 사유 육아휴직·복직 처리는 교육청마다 담당 부서가 다르다"},{"name":"교육부 교원정책과(「교원휴가에 관한 예규」 소관)","tel":"044-203-6497","note":"국가법령정보센터 행정규칙 담당자 정보"},{"name":"인사혁신처 복무과(「국가공무원 복무·징계 관련 예규」 소관)","tel":"044-201-8445","note":"국가법령정보센터 행정규칙 담당자 정보"}],"forms":["나이스 근무상황 신청(특별휴가 종류 선택) — 별도 종이 서식 없음","임신확인서·진단서·산모수첩(모성보호시간·임신검진휴가 최초 1회, 출산휴가 배치 기준)","검진 확인 자료(진료내역서 등) — 임신검진휴가·임신검진 동행휴가 사용 시","가족관계증명서·배우자 임신확인서 — 임신검진 동행휴가 최초 신청 시","출생증명서(출생보고서), 신생아중환자실 입원기록 확인 서류 — 미숙아 출산휴가 100일","유산·사산 사실과 임신 주수를 확인할 진단서 — 유산·사산휴가","휴직원·휴직교원 유의사항 확인서 등(양식은 시·도교육청마다 다름)·임신 입증 진단서 — 임신 사유 육아휴직('parental-leave' 항목)"],"law":[{"name":"국가공무원 복무규정","article":"제20조제1항(별표 2)·제2항·제4항·제10항·제11항·제12항·제16항·제19항","point":"배우자 출산휴가 20일(다태아 25일), 출산휴가 90일(다태아 120일, 미숙아 100일)·출산 후 45일(60일) 이상, 모성보호시간 1일 2시간(12주 이내·32주 이후 승인 의무), 유산·사산휴가, 배우자 유산·사산휴가 3일, 난임치료시술휴가, 임신검진휴가 10일, 임신검진 동행휴가 10일"},{"name":"국가공무원 복무규정","article":"제6조제5항·제11조제3항·제22조","point":"임신 중 장거리·장기간 출장 제한, 임신 중·출산 후 1년 미만 야간·휴일근무 제한(신청·동의 시 예외), 30일 이상 계속되는 특별휴가는 토요일·공휴일 산입"},{"name":"교원휴가에 관한 예규(교육부예규 제104호, 2026.2.27.)","article":"제4조·제8조제5항·제11조","point":"원하는 시기에 법정휴가일수 사용 보장, 수업 결손 방지 조치, 예규에 없는 특별휴가는 국가공무원 복무규정·인사혁신처 복무 예규를 따름"},{"name":"국가공무원 복무·징계 관련 예규(인사혁신처예규, 2026.6.23.)","article":"제8장 휴가 — 특별휴가 (1)~(5)·(11)·(12)","point":"출산휴가 배치·미숙아 서류 기한, 유산·사산휴가 기산, 난임 시술별 선택일, 모성보호시간 운영(4시간 최소근무·중복 금지), 배우자 출산휴가 분할 횟수"},{"name":"교육공무원법","article":"제44조제1항제7호·제7호의3, 제45조제1항제1호·제6호","point":"여성 교육공무원이 임신·출산하게 된 경우 육아휴직 사유, 불임·난임 장기치료 휴직 1년(1년 연장)"},{"name":"교육공무원 임용령","article":"제13조제1항제1호","point":"휴가로 1개월 이상 직무에 종사할 수 없어 후임 보충이 불가피하면 기간제교원 임용 가능"}],"deep":[{"title":"모성보호시간은 '쓸 수 있다'가 아니라 시기에 따라 '승인해야 한다'","body":["현행 복무규정은 임신 12주 이내 또는 32주 이후인 교원이 모성보호시간을 신청하면 학교장은 승인해야 한다. 13~31주는 인력 상황과 공무수행을 고려해 승인하지만, 지장이 없는 범위에서 사용을 보장해야 한다.","교원 근무일 8시간 기준으로 모성보호시간을 빼고도 4시간 이상 실제 근무해야 한다. 같은 날 연가·병가를 섞어 4시간이 안 되면 모성보호시간 부분은 연가로 바뀐다. 유연근무 중이라면 그날 총 근무시간에서 모성보호시간을 뺀 시간이 4시간 이상일 때만 쓸 수 있다.","승인 대상 확인은 진단서·임신확인서·산모수첩으로 최초 한 번만 한다. 매번 증빙을 요구할 근거는 없다."],"basis":"국가공무원 복무규정 제20조제4항(2025.2.11.·2025.7.22. 개정); 국가공무원 복무·징계 관련 예규 제8장 (5)"},{"title":"출산휴가 날짜 계산에서 자주 틀리는 것","body":["배치 기준은 진단서상 출산예정일이다. 출산 후 45일(다태아 60일)만 지키면 출산 전·후 배분은 본인이 정한다. 예정일보다 늦게 낳아 출산 전에 쓴 날이 길어져도 출산 후 45일은 확보되어야 한다.","90일은 토요일·공휴일을 포함한 달력 일수다(30일 이상 이어지는 특별휴가). 방학과 겹쳐도 일수는 그대로 흐른다.","휴직 중이 아닌 교원이 출산 당일 출근했다면 다음 날부터 90일을 새로 센다. 반대로 휴직 중에 출산하면 복직일부터 쓸 수 있을 뿐 출산일부터 90일이 끝나는 날은 바뀌지 않는다."],"basis":"국가공무원 복무규정 제20조제2항·제22조; 국가공무원 복무·징계 관련 예규 제8장 (2)"},{"title":"임신 중 육아휴직 — 여성 교원만, 휴직 중 출산하면 복직부터","body":["교육공무원법 제44조제1항제7호는 자녀 양육뿐 아니라 '여성 교육공무원이 임신 또는 출산하게 된 경우'를 육아휴직 사유로 둔다. 따라서 여성 교원은 출산 전에도 육아휴직을 할 수 있고, 본인이 원하면 임용권자는 휴직을 명해야 한다. 남성 교원은 배우자 임신만으로는 이 사유에 해당하지 않는다.","휴직 중에는 출산휴가를 쓸 수 없다. 인사혁신처 예규는 출산일 전에 휴직 중이면 실제 출산일에 맞추어 복직한 뒤 출산휴가를 신청하라고 하고, 출산휴가가 끝나면 다시 육아휴직을 할 수 있다. 복직일을 정확히 어느 날로 잡는지, 출산휴가 뒤 재휴직 서류를 언제 내는지는 소속 시·도교육청 지침으로 확인한다.","교육공무원 임용령은 출산휴가와 이어지는 육아휴직, 또는 육아휴직과 이어지는 출산휴가를 합쳐 6개월 이상이면 정원이 따로 있는 것으로 보고 결원을 보충할 수 있게 했다. 휴가로 1개월 이상 직무에 종사할 수 없을 때도 기간제교원을 임용할 수 있다. 대체 기간제교원을 같은 사람으로 이어서 연장계약할 수 있는지는 시·도교육청 계약제교원 지침으로 확인한다."],"basis":"교육공무원법 제44조제1항제7호; 교육공무원 임용령 제7조의4제2항·제13조제1항제1호; 국가공무원 복무·징계 관련 예규 제8장 (2)(가)"},{"title":"남성 교원이 챙길 것 — 동행휴가, 배우자 출산휴가, 배우자 유산·사산휴가","body":["임신검진 동행휴가(2025.7.22. 신설)는 배우자 임신기간 중 10일, 반일 단위도 된다. 최초 신청 때 가족관계증명서와 배우자 임신확인서, 매 검진 때 진료내역서 등을 낸다.","배우자 출산휴가는 2025.2.11. 개정으로 20일(다태아 25일)이 되었고, 출산예정일 30일 전부터 출산 후 120일(다태아 150일) 안에 3회(다태아 5회)까지 나누어 쓸 수 있다. 2026.6.23. 예규 개정으로 3회 분할은 4개 구간, 5회 분할은 6개 구간이라는 점이 명확해졌다.","배우자가 유산·사산하면 남성 교원은 해당 주수의 유산·사산휴가 기간 안에서 3일을 쓰고 1회 나눌 수 있다."],"basis":"국가공무원 복무규정 제20조제11항·제19항·별표 2; 국가공무원 복무·징계 관련 예규(2026.6.23.) 제8장 (1)(라)·(2)(라)·(12)"}],"tables":[{"title":"임신·출산 특별휴가 한눈에","head":["휴가","대상","일수·시간","사용 단위·기한","증빙"],"rows":[["모성보호시간","임신 중 여성","1일 2시간","시간 단위. 12주 이내·32주 이후는 승인 의무","임신확인서 등(최초 1회)"],["임신검진휴가","임신 중 여성","10일","반일·1일. 실제 출산일 전까지","임신확인서(최초), 검진 확인 자료"],["임신검진 동행휴가","배우자가 임신한 남성","10일","반일·1일. 배우자 실제 출산일 전까지","가족관계증명서·배우자 임신확인서, 진료내역서"],["출산휴가","출산하는 여성","90일(다태아 120일, 미숙아 100일)","일 단위. 출산 후 45일(60일) 이상","출산예정일 진단서, 미숙아는 입원기록"],["유산·사산휴가","유산·사산한 여성","10·30·60·90일(15주 이내·16~21주·22~27주·28주 이상)","유산·사산한 날부터 기산","진단서"],["배우자 유산·사산휴가","배우자가 유산·사산한 남성","3일","위 기간 안에서, 1회 분할","진단서 등"],["난임치료시술휴가","시술받는 교원","여성 2~4일(시술별), 남성 1일","일 단위, 시술마다","시술 확인 자료"],["배우자 출산휴가","배우자가 출산한 교원","20일(다태아 25일)","예정일 30일 전~출산 후 120일(150일), 3회(5회) 분할","출생 관련 증빙"]],"note":"모두 유급 특별휴가(여성보건휴가만 무급). 출처: 국가공무원 복무규정(2026.6.23. 시행) 제20조·별표 2, 국가공무원 복무·징계 관련 예규(2026.6.23.) 제8장. 교원은 「교원휴가에 관한 예규」 제8조제5항에 따라 그대로 적용."}],"faq":[{"q":"육아휴직 중인데 둘째를 임신했어요. 출산휴가는 어떻게 쓰나요?","a":"휴직 중에는 출산휴가를 쓸 수 없다. 인사혁신처 예규대로 실제 출산일에 맞추어 복직한 뒤 출산휴가를 쓰고, 끝나면 둘째에 대한 육아휴직을 새로 신청한다. 첫째 휴직을 이어 늘리는 것이 아니라 복직과 새 휴직으로 처리해야 둘째에 대한 육아휴직수당·경력 산입을 받는다. 예정일보다 일찍 낳으면 복직일을 바로 앞당겨 달라고 해야 출산휴가 일수를 잃지 않는다. 복직일·재휴직 서류 기한은 소속 시·도교육청 지침을 따른다."},{"q":"출산휴가 90일에 방학이 끼어 있으면 방학만큼 늘어나나요?","a":"늘어나지 않는다. 출산휴가는 30일 이상 이어지는 특별휴가라 토요일·공휴일까지 포함해 달력 일수로 센다(복무규정 제22조). 방학은 휴가일수에서 빼 주는 토요일·공휴일이 아니므로 출산휴가 기간이 방학과 겹쳐도 그대로 소진된다."},{"q":"임신 20주인데 교감 선생님이 모성보호시간을 안 된다고 합니다.","a":"12주 이내·32주 이후는 신청하면 반드시 승인해야 하고, 13~31주는 학교 인력 상황과 공무수행을 고려해 승인하되 지장이 없는 범위에서 사용을 보장해야 한다(복무 예규). 수업이 없는 시간대로 조정해 다시 신청해 보고, 그래도 어렵다면 모성보호시간 대신 임신검진휴가(10일)나 입덧·부작용 시 일반 병가를 쓸 수 있다."},{"q":"남편도 교사인데 배우자 출산휴가를 방학 때 몰아서 써도 되나요?","a":"기한 안이면 된다. 출산예정일 30일 전부터 출산 후 120일(다태아 150일) 안에, 마지막 사용일도 그 기간 안에 들어오게 쓰면 되고 3회(4개 구간)까지 나눌 수 있다. 다만 120일이 지나면 남은 일수는 사라진다. 방학 중이라도 휴가일수에는 공휴일·토요일만 빠진다."},{"q":"만 41세 초산입니다. 출산 전에 미리 출산휴가를 조금 쓸 수 있나요?","a":"된다. 출산휴가 신청 당시 만 40세 이상이면 출산 전 어느 때라도 최장 44일(다태아 59일)을 나누어 쓸 수 있다. 출산 후 45일(다태아 60일) 이상은 남아 있어야 한다."},{"q":"시험관 시술 날짜가 수업일과 겹쳐요. 연가를 써야 하나요?","a":"난임치료시술휴가를 쓰면 된다. 인공수정 2일, 동결배아 이식 3일, 난자 채취 체외수정 4일을 시술할 때마다 쓸 수 있고 연간 횟수 제한은 없다. 시술 당일은 반드시 포함되고, 나머지 날은 전날·시술 후 2일 이내·시술에 따르는 병원진료일(과배란 유도·초음파 등) 중에 고른다. 단순 상담일은 안 된다."}],"record":"모든 임신·출산 특별휴가는 나이스 근무상황에서 특별휴가 종류(출산휴가, 모성보호시간, 임신검진휴가, 유산·사산휴가, 난임치료시술휴가, 경조사(배우자 출산) 등)를 골라 신청하고 학교장(위임전결 시 교감) 결재를 받는다. 근무상황부는 나이스로 개인별 관리한다(교원휴가에 관한 예규 제4조제4항). 모성보호시간은 시간 단위, 출산·유산사산·난임·경조사 휴가는 일 단위로만 입력한다. 최초 신청 때 낸 임신확인서·진단서는 학교에서 보관하고, 임신 사유 육아휴직은 휴직 발령(나이스 교원인사-임용발령-휴직)으로 따로 처리한다.","sources":[{"title":"국가공무원 복무규정(대통령령, 시행 2026.6.23.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규정"},{"title":"교원휴가에 관한 예규(교육부예규 제104호, 2026.2.27.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원휴가에관한예규"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규, 2026.6.23.) PDF","publisher":"인사혁신처(국가법령정보센터 첨부)","year":2026,"url":"http://law.go.kr/flDownload.do?flSeq=166347779"},{"title":"교육공무원법(시행 2026.2.15.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"교육공무원 임용령(시행 2025.9.16.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원임용령"}],"verified":"2026-09-29","uncertain":["임신 사유로 출산 전에 쓴 육아휴직 기간이 출산 후 그 자녀에 대한 육아휴직 3년에 합산되는지, 이 기간에 육아휴직수당이 나오는지는 공식 문서에서 명확한 문구를 찾지 못했다","나이스에서 근무상황을 신청하는 정확한 메뉴 경로는 공식 문서로 확인하지 못해 적지 않았다","임신·출산 특별휴가에는 전국 공통 별지 서식이 없다(나이스 근무상황 신청으로 처리). 국가공무원 복무규칙 별지 제1호서식 근무상황부는 학교가 나이스 전자 근무상황부로 대신하므로 내려받기 목록에 넣지 않았다"],"related":["parental-leave","childcare-time","leave-special","leave-sick","leave-of-absence"]},{"id":"childcare-time","title":"육아시간·가족돌봄휴가(자녀 돌봄) — 대상 자녀 나이, 36개월·연 10일 한도, 사용 단위, 자녀 학교 행사","aka":["육아시간","육아 2시간","육아시간 36개월","육아시간 몇 살까지","자녀돌봄휴가","가족돌봄휴가","유급 가족돌봄","애 아파서","아이 병원","예방접종 동행","자녀 학교 행사","입학식 휴가","학부모 상담 휴가","참관수업","재량휴업일 돌봄","방학 돌봄","부모님 간병 휴가","한부모 가족돌봄","조기 퇴근 육아","육아기 근무시간 단축"],"category":"모성·육아","urgency":"당일","roles":["교사 본인","교감(위임전결 시)","학교장","복무 담당(교무부)","시·도교육청(육아시간 자체기준)"],"summary":"8세 이하 또는 초등학교 2학년 이하 자녀가 있는 교원은 36개월 범위에서 하루 최대 2시간의 육아시간을 쓸 수 있고, 자녀가 만 9세가 되거나 초등학교 3학년이 되는 날 남은 시간은 없어진다. 가족돌봄휴가는 유·무급을 합쳐 연 10일이며, 자녀의 학교 휴업·공식 행사·교사 상담·병원 진료 동행, 입학 전 공백기, 가족 간병 때 쓴다. 자녀 돌봄용은 '자녀 수+1일'까지 유급이고(장애 자녀나 한부모면 1일 더), 유급은 시간 단위로, 무급은 일 단위로만 쓴다. 예전의 '자녀돌봄휴가'는 지금 복무규정에 따로 없고, 가족돌봄휴가 안의 유급 일수로 운영된다. 교원은 「교원휴가에 관한 예규」가 따로 정하지 않았으므로 국가공무원 복무규정·인사혁신처 예규를 따르되, 육아시간은 교육감이 자체 기준을 만들 수 있고 학교장이 수업·교육활동을 고려해 승인한다.","first":["자녀가 만 9세 생일 전날 또는 초등학교 3학년이 되는 해 3월 1일 전날 중 늦은 날까지인지 확인한다. 둘 중 하나만 맞아도 육아시간을 쓸 수 있다","처음 쓸 때 출생증명서나 주민등록등본(학년 기준이면 재학증명서)을 복무 담당에게 한 번 낸다","육아시간을 쓰고도 그날 실제 근무가 4시간 이상이어야 한다. 모자라면 육아시간이 연가로 바뀐다","자녀가 아파 갑자기 병원에 가야 하면 유급 가족돌봄휴가를 시간 단위로 신청하고, 진료확인서·영수증·처방전 등을 나중에라도 낸다","자녀 학교 입학식·운동회·학부모 상담처럼 공식 요청이 있는 행사는 가족돌봄휴가 사유다. 가정통신문·알림장을 증빙으로 챙긴다","우리 학교가 육아시간 운영 기준(사용 시간대, 수업 시간 조정 등)을 정해 두었는지 교무부에 확인한다"],"steps":[{"stage":"미리 확인","when":"자녀 출생 후, 사용 전","who":"교사 본인","what":"육아시간 대상과 남은 개월 수 확인","detail":"대상은 8세 이하 또는 초등학교 2학년 이하 자녀다. '만 9세가 되는 날(생일)의 전날'과 '초등학교 3학년이 되는 날(해당 학년 3월 1일)의 전날' 중 하나만 충족해도 된다(예: 만 10세인데 초등 2학년이면 가능). 전체 36개월 범위이고, 자녀가 둘 이상이면 자녀마다 각각 쓸 수 있지만 같은 날 겹쳐 쓸 수 없다. 전에 다른 학교·기관에서 쓴 기간이 있으면 빼고 남은 개월을 계산한다.","basis":"국가공무원 복무규정 제20조제5항; 국가공무원 복무·징계 관련 예규(2026.6.23.) 제8장 (6)"},{"stage":"미리 확인","when":"학기 초","who":"학교장·복무 담당, 교원 의견 수렴","what":"학교 육아시간 운영 기준 확인","detail":"교원휴가 예규는 교육감이 교육활동·인력운영 상황을 고려하고 교원 의견을 들어 육아시간 활용 자체기준을 만들 수 있게 했다. 교육부 사례집은 단위학교도 법규 범위 안에서 사용일·시간대, 수업·행사·협의회와의 관계, 대행자 지정·시간표 조정 등을 민주적으로 협의해 정할 수 있다고 한다. 교육감 자체기준이 있는지, 내용이 무엇인지는 소속 시·도교육청 지침으로 확인한다.","basis":"교원휴가에 관한 예규 제8조제2항; 교육부 교원 휴가 질의·답변 사례집 질의43"},{"stage":"신청·보고","when":"쓰려는 날(사전 신청)","who":"교사 본인 → 교감·학교장","what":"육아시간 신청","detail":"늦게 출근, 일찍 퇴근, 근무시간 중 어느 때든 1일 최대 2시간을 신청한다. 대상 확인 서류(출생증명서·주민등록등본, 학년 기준이면 재학증명서)는 최초 1회만 낸다. 학교장은 인력운영·공무수행에 지장이 없는 범위에서 사용을 보장해야 한다. 수업이 있는 시간과 겹치면 시간표 조정이나 보강 계획을 함께 협의한다.","basis":"국가공무원 복무규정 제20조제5항; 국가공무원 복무·징계 관련 예규 제8장 (6)(가)·(나)"},{"stage":"사용·이행","when":"사용하는 날","who":"교사 본인","what":"하루 4시간 이상 근무 지키기","detail":"육아시간을 쓰고도 그날 실제 근무가 4시간 이상이어야 한다. 부족하면 육아시간은 연가로 처리된다(예: 육아시간 2시간+연가 3시간 → 연가 5시간, 육아시간 2시간+병가 4시간 → 연가 2시간+병가 4시간). 모성보호시간과 같은 날 함께 쓸 수 없다. 인사혁신처 예규가 시간외근무를 금지한 것은 모성보호시간 사용일이며, 육아시간 사용일에 대해서는 같은 금지 문구가 없다. 시간외근무 운영은 소속 시·도교육청 지침으로 확인한다.","basis":"국가공무원 복무·징계 관련 예규 제8장 (6)(가)"},{"stage":"사후 관리","when":"매달·학기 말","who":"교사 본인·복무 담당","what":"36개월 차감 확인","detail":"한 달 이상 연속으로 쓰면 그 개월 수를 쓴 것으로 본다(최초 사용일부터 다음 달 같은 날의 전날까지가 1개월, 2월처럼 30일이 안 되는 달도 1개월). 연속하지 않으면 사용한 날을 합산해 20일마다 1개월로 센다. 2시간보다 적게 써도 그날은 1일 사용이다. 자녀가 만 9세 또는 초등 3학년이 되는 날 남은 육아시간은 소멸한다.","basis":"국가공무원 복무·징계 관련 예규 제8장 (6)(가)"},{"stage":"미리 확인","when":"가족돌봄이 필요한 일이 생겼을 때","who":"교사 본인","what":"가족돌봄휴가 사유 해당 여부","detail":"사유는 다섯 가지다. ① 어린이집·유치원·학교의 휴업·휴원·휴교나 이에 준하는 사유(방학·재량휴업, 감염병·재난으로 인한 개학 연기·온라인수업 등)로 자녀·손자녀를 돌볼 때 ② 자녀·손자녀가 다니는 기관의 공식 행사나 교사 상담에 참여할 때 ③ 어린이집·유치원·학교를 졸업한 뒤 다음 학교 입학 전까지 돌볼 때(2026.6.23. 신설) ④ 미성년 또는 장애인 자녀·손자녀의 병원 진료(건강검진·예방접종 포함)에 동행할 때 ⑤ 질병·사고·노령으로 조부모·외조부모·부모(배우자 부모 포함)·배우자·자녀·손자녀를 돌볼 때.","basis":"국가공무원 복무규정 제20조제14항(2026.6.23. 개정); 국가공무원 복무·징계 관련 예규 제8장 (10)(가)"},{"stage":"신청·보고","when":"사용 전(급한 경우 당일)","who":"교사 본인 → 교감·학교장","what":"유급·무급 구분해 신청","detail":"연간 유·무급 합쳐 10일이다. 자녀 돌봄용은 '자녀 수+1일'까지 유급이며(자녀는 어린이집등 재학 중이거나 미성년이거나 장애인인 자녀), 장애인 자녀가 있거나 한부모 공무원이면 1일(8시간)을 더한다. ④ 병원 동행과 ⑤ 간병은 미성년·장애인 자녀일 때만 유급이다. 유급은 시간 단위로 나눠 쓸 수 있고, 무급은 일 단위로만 쓴다. 유급이 남아 있어도 원하면 무급을 먼저 쓸 수 있다. 성년 자녀·부모·배우자 등 다른 가족 돌봄은 무급이다.","basis":"국가공무원 복무규정 제20조제15항; 국가공무원 복무·징계 관련 예규 제8장 (10)(나)·(다)"},{"stage":"결재·승인","when":"신청 즉시","who":"학교장(위임전결 시 교감)","what":"증빙 확인 후 필요한 시간만큼 승인","detail":"유급 가족돌봄휴가는 증빙을 확인해야 한다. 휴업·온라인수업 증빙(가정통신문·학부모 알림장), 졸업증서·졸업증명서, 진료 증빙(진단서·진료확인서·진료비 영수증·처방전·약국 영수증·예방접종증명서·영유아건강검진결과통보서), 장애인등록증·가족관계증명서 등이다. 승인권자는 증빙, 교통상황, 왕복 소요시간, 본인 진술을 고려해 '필요한 기간(시간)'을 승인한다. 무급은 가족관계증명서 등 관계 증명을 확인한다.","basis":"국가공무원 복무·징계 관련 예규 제8장 (10)(나)·(다)"},{"stage":"사용·이행","when":"자녀 학교 행사·상담 날","who":"교사 본인","what":"학교 행사 참여에 가족돌봄휴가 쓰기","detail":"공식 요청이나 공문 등으로 기관이 주최하는 행사여야 한다. 교육부 사례집의 예: 입학식, 졸업식, 운동회, 부모 참여수업, 시험감독, 학부모 자격으로 참여하는 학교운영위원회, 예비소집일. 학교의 공식 요청이 있으면 전화 상담도 필요한 시간만큼 쓸 수 있다. 반면 전학 수속, 수능 응시·예비소집·대입 실기·면접 동행, 입대 배웅은 해당하지 않는다(자녀 입영일은 교원휴가 예규상 수업일 연가 사유다).","basis":"국가공무원 복무규정 제20조제14항제2호; 교육부 교원 휴가 질의·답변 사례집 질의33~35·37; 교원휴가에 관한 예규 제5조제1항제8호"},{"stage":"사후 관리","when":"연말","who":"복무 담당·교사 본인","what":"연간 일수 관리","detail":"가족돌봄휴가는 1월 1일~12월 31일 연 단위다. 연가와 달리 연도 중 휴직했다 복직했어도 사용 가능 일수가 줄지 않는다(연 10일). 유급 일수를 다 쓰면 나머지는 무급으로 쓴다. 휴직·전보로 학교를 옮기면 이전 사용 실적을 확인해 이어서 관리한다.","basis":"국가공무원 복무규정 제20조제14항·제15항; 교육부 교원 휴가 질의·답변 사례집 질의31"},{"stage":"사후 관리","when":"육아시간이 끝나거나 더 긴 단축이 필요할 때","who":"교사 본인 → 학교 → 교육청","what":"시간선택제 전환·육아휴직 검토","detail":"초등학교 3~6학년(또는 9~12세) 자녀 양육, 또는 육아휴직을 대신하려면 시간선택제 전환을 검토할 수 있다. 교원은 매 학년도 3월 1일(필요 시 9월 1일) 배치, 3년 이내, 학년·학기 단위이며 하루 최소 3시간 이상 근무한다. 전환 기간에는 육아기 근무시간 단축수당이 나온다. 장기간 돌봄이 필요하면 육아휴직을 본다('육아휴직' 항목).","basis":"공무원수당 등에 관한 규정 제11조의3제5항; 교육공무원 인사관리규정 제37조"}],"deadlines":[{"what":"육아시간 대상 자녀","limit":"만 9세 생일 전날 또는 초등 3학년이 되는 해 3월 1일 전날까지(둘 중 하나)","basis":"국가공무원 복무규정 제20조제5항; 인사혁신처 복무 예규 제8장 (6)"},{"what":"육아시간 한도","limit":"36개월 범위, 1일 최대 2시간. 연속 1개월 이상은 월 단위, 아니면 20일=1개월로 차감","basis":"국가공무원 복무규정 제20조제5항; 인사혁신처 복무 예규 제8장 (6)"},{"what":"육아시간·모성보호시간 사용일 최소 근무","limit":"그날 실근무 4시간 이상(미달 시 연가 처리)","basis":"인사혁신처 복무 예규 제8장 (5)·(6)"},{"what":"가족돌봄휴가 전체","limit":"유·무급 합쳐 연 10일(1.1.~12.31.)","basis":"국가공무원 복무규정 제20조제14항"},{"what":"가족돌봄휴가 유급 일수","limit":"자녀 수+1일(장애인 자녀 또는 한부모면 1일 추가), 연 10일 안에서. 유급은 시간 단위, 무급은 일 단위","basis":"국가공무원 복무규정 제20조제15항; 인사혁신처 복무 예규 제8장 (10)"}],"dont":["육아시간을 쓴 날 연가·병가를 겹쳐 실근무를 4시간 밑으로 만들지 않는다 — 육아시간 부분이 연가로 바뀌어 연가가 깎인다","모성보호시간과 육아시간을 같은 날 쓰지 않는다 — 둘 다 출근을 전제로 한 특별휴가라 중복이 금지된다","자녀 둘의 육아시간을 같은 날 합쳐 4시간 쓰지 않는다 — 자녀별로 각각 쓸 수 있지만 같은 날 중복 사용은 안 된다","수능 동행·입대 배웅·전학 수속에 가족돌봄휴가를 신청하지 않는다 — 교육부 사례집이 사유로 보기 어렵다고 했다. 자녀 입영일은 연가를 쓴다","성년 자녀나 부모 간병에 유급 가족돌봄휴가를 쓰지 않는다 — 유급은 자녀(재학 중·미성년·장애인) 돌봄만 해당하고, 나머지는 무급이다","유급 가족돌봄휴가를 증빙 없이 승인하거나 받지 않는다 — 예규가 승인 때 증빙 확인을 의무로 정했다","학교 자체기준으로 육아시간 자체를 막지 않는다 — 자체기준은 복무규정 범위 안에서 운영 방법을 정하는 것이고, 학교장은 지장이 없는 범위에서 사용을 보장해야 한다"],"contacts":[{"name":"소속 시·도교육청 교원 복무 담당","tel":"소속 교육청","note":"육아시간 자체기준, 기간제교원 휴가 적용은 교육청마다 다르다"},{"name":"교육부 교원정책과(「교원휴가에 관한 예규」 소관)","tel":"044-203-6497","note":"국가법령정보센터 행정규칙 담당자 정보"},{"name":"인사혁신처 복무과(「국가공무원 복무·징계 관련 예규」 소관)","tel":"044-201-8445","note":"국가법령정보센터 행정규칙 담당자 정보"}],"forms":["나이스 근무상황 신청(특별휴가 중 육아시간·가족돌봄휴가 선택) — 별도 종이 서식 없음","출생증명서 또는 주민등록등본(육아시간 최초 1회), 학년 기준 사용 시 자녀 재학증명서","유급 가족돌봄휴가 증빙: 가정통신문·학부모 알림장(휴업·행사), 졸업증명서(입학 전 공백기), 진료확인서·진료비 영수증·처방전·예방접종증명서(병원 동행)","장애인등록증·가족관계증명서(유급 가산·무급 가족돌봄휴가의 관계 증명)","한부모가족 증명서류(유급 1일 가산 대상 확인)"],"law":[{"name":"국가공무원 복무규정","article":"제20조제5항","point":"8세 이하 또는 초등 2학년 이하 자녀가 있는 공무원은 36개월 범위에서 1일 최대 2시간 육아시간"},{"name":"국가공무원 복무규정","article":"제20조제14항·제15항(2026.6.23. 개정)","point":"가족돌봄휴가 연 10일, 사유 5가지(학적 공백기 신설), 무급 원칙이나 자녀 돌봄은 자녀 수+1일 유급, 장애인 자녀·한부모는 1일 추가"},{"name":"교원휴가에 관한 예규(교육부예규 제104호, 2026.2.27.)","article":"제8조제2항·제5항, 제5조제1항제8호","point":"교육감은 의견 수렴을 거쳐 육아시간 활용 자체기준을 만들 수 있음. 그 밖의 특별휴가는 복무규정·인사혁신처 예규를 따름. 자녀 입영일은 수업일 연가 사유"},{"name":"국가공무원 복무·징계 관련 예규(인사혁신처예규, 2026.6.23.)","article":"제8장 휴가 — 특별휴가 (6) 육아시간, (10) 가족돌봄휴가","point":"육아시간 4시간 최소근무·36개월 산정법·자녀별 사용·모성보호시간과 중복 금지, 가족돌봄휴가 증빙·시간 단위(유급)·일 단위(무급)"},{"name":"공무원수당 등에 관한 규정","article":"제11조의3제5항","point":"육아휴직 대신 또는 9~12세(초3~6) 자녀 양육을 위해 시간선택제로 전환하면 육아기 근무시간 단축수당 지급"}],"deep":[{"title":"육아시간 36개월은 이렇게 줄어든다","body":["한 달 이상 연속으로 쓰면 달 단위로 센다. 처음 쓴 날부터 다음 달 같은 날의 전날까지가 1개월이다(예: 4.15.~6.14. 연속 사용은 2개월). 2월처럼 30일이 안 되는 달도 1개월이다.","띄엄띄엄 쓰면 사용한 날을 합해 20일마다 1개월로 센다(예: 4월에 14일, 5월에 6일 → 20일 → 1개월). 30분만 써도 그날은 1일이다.","자녀가 여럿이면 자녀마다 36개월이지만 같은 날 두 자녀 몫을 겹쳐 쓰지 못한다. 자녀가 만 9세 또는 초등 3학년이 되는 날 남은 기간은 사라지므로, 남은 개월이 많으면 그 전에 계획적으로 쓴다."],"basis":"국가공무원 복무·징계 관련 예규(2026.6.23.) 제8장 (6)"},{"title":"교원의 육아시간과 수업 — 자체기준이 있다","body":["교원휴가 예규 제8조제2항은 교육감이 교육활동·인력운영 상황을 고려하고 교원 의견을 들어 육아시간 활용 자체기준을 만들 수 있게 했다. 따라서 육아시간을 수업·학사 일정과 어떻게 맞출지는 시·도교육청마다 다를 수 있고, 학교장은 인력운영·공무수행에 지장이 없는 범위에서 사용을 보장해야 한다.","교육부 사례집은 학교가 정할 내용으로 사용일·시간대(행사·연수·협의회·위원회·학생·학부모 상담 고려), 대상자 배려(업무분장·담임배정·대행자·시간표 조정)를 든다. 이 기준은 복무규정 범위 안이어야 하므로 육아시간 자체를 금지할 수는 없다."],"basis":"교원휴가에 관한 예규 제8조제2항; 교육부 교원 휴가 질의·답변 사례집 질의43"},{"title":"자녀돌봄휴가는 어디로 갔나 — 가족돌봄휴가 속 유급 일수","body":["현행 국가공무원 복무규정에는 '자녀돌봄휴가'라는 이름의 휴가가 따로 없다. 자녀 돌봄은 가족돌봄휴가(제20조제14항) 사유로 쓰고, 그중 자녀 돌봄분만 유급으로 인정한다(제15항).","현행 규정상 유급 일수는 '자녀 수+1일'이다(자녀 1명 2일, 2명 3일, 3명 4일 …, 연 10일 한도). 장애인 자녀가 있거나 한부모면 1일을 더한다(예: 미성년 자녀 2명 한부모 → 유급 4일). 2026.6.23. 개정으로 졸업 후 상급학교 입학 전 '학적 공백기' 돌봄도 사유에 들어갔다.","유급은 시간 단위로 쪼개 쓸 수 있어 병원 진료 2시간, 상담 1시간처럼 필요한 만큼만 쓴다. 무급은 하루 단위로만 쓰고, 그날은 유연근무를 하지 않도록 미리 조정한다."],"basis":"국가공무원 복무규정 제20조제14항·제15항(2026.6.23.); 국가공무원 복무·징계 관련 예규 제8장 (10); 인사혁신처예규 개정이유(2026.6.23.)"},{"title":"기간제교원은","body":["기간제교원에게 육아시간·가족돌봄휴가 등 특별휴가를 어떻게 적용하는지는 교육공무원 법령에 따로 정하지 않았고, 시·도교육청 계약제교원 운영 지침으로 정한다. 적용 범위, 이전 학교 사용 실적 확인, 계약기간 비례 계산 방법은 소속 시·도교육청 지침으로 확인한다."],"basis":"교육공무원법 제32조; 시·도교육청 계약제교원 운영 지침"}],"tables":[{"title":"육아시간과 가족돌봄휴가 비교","head":["구분","육아시간","가족돌봄휴가"],"rows":[["대상","8세 이하 또는 초등 2학년 이하 자녀가 있는 교원","자녀·손자녀 돌봄(휴업·행사·상담·입학 전 공백·병원 동행), 가족 간병"],["한도","자녀별 36개월, 1일 최대 2시간","유·무급 합쳐 연 10일"],["유급 여부","유급","자녀 돌봄분 자녀 수+1일 유급(장애 자녀·한부모 +1일), 나머지 무급"],["사용 단위","시간(2시간 미만이어도 1일 사용으로 차감)","유급은 시간 단위, 무급은 일 단위
