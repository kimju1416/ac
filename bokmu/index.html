"],["증빙","출생증명서·주민등록등본(최초 1회), 학년 기준은 재학증명서","가정통신문·알림장·진료확인서·영수증·졸업증명서 등 매번"],["제한","실근무 4시간 이상, 모성보호시간과 같은 날 불가","수능·입대 배웅·전학은 사유 아님"]],"note":"출처: 국가공무원 복무규정(2026.6.23. 시행) 제20조제5항·제14항·제15항, 국가공무원 복무·징계 관련 예규(2026.6.23.) 제8장 (6)·(10), 교육부 교원 휴가 질의·답변 사례집(2022). 교원은 「교원휴가에 관한 예규」 제8조에 따라 적용."},{"title":"자녀 수별 유급 가족돌봄휴가 일수","head":["자녀 수","기본 유급","장애인 자녀가 있거나 한부모"],"rows":[["1명","2일","3일"],["2명","3일","4일"],["3명","4일","5일"],["4명","5일","6일"]],"note":"자녀는 어린이집·유치원·학교에 재학 중이거나 미성년이거나 장애인인 자녀. 유·무급 합계는 연 10일을 넘을 수 없다. 출처: 국가공무원 복무규정 제20조제15항(시행 2026.6.23.), 인사혁신처 복무 예규 제8장 (10)(나)."}],"faq":[{"q":"아이가 3월생인데 초등 3학년 3월 1일이 되기 전에 만 9세가 됩니다. 언제까지 쓰나요?","a":"두 기준 중 늦은 쪽까지 쓸 수 있다. 만 9세 생일 전날 또는 초등 3학년이 되는 해 3월 1일의 전날 중 하나만 충족하면 되므로, 초등 2학년인 동안은 만 9세가 지나도 2월 말일까지 가능하다. 학년 기준으로 쓸 때는 재학증명서를 낸다."},{"q":"우리 반 수업이 6교시까지 있는데 육아시간 때문에 5교시 후 퇴근해도 되나요?","a":"학교장 승인 사항이다. 학교장은 공무수행에 지장이 없는 범위에서 사용을 보장해야 하므로, 시간표 조정이나 보강 계획을 함께 내면 승인받기 쉽다. 교육감·학교가 정한 육아시간 운영 기준이 있으면 그에 따른다."},{"q":"초등학생 자녀 학교의 학부모 공개수업에 가려고 합니다. 연가를 써야 하나요?","a":"가족돌봄휴가를 쓰면 된다. 자녀가 다니는 학교의 공식 행사나 교사 상담 참여는 사유이고, 자녀 돌봄이므로 유급 일수(자녀 수+1일) 안에서 시간 단위로 쓸 수 있다. 가정통신문이나 알림장을 증빙으로 낸다."},{"q":"고3 자녀가 수능을 봅니다. 가족돌봄휴가가 되나요?","a":"안 된다. 교육부 사례집은 수능은 학교 주최 공식 행사가 아니고 시험 중에는 돌봄도 할 수 없어 사유로 보기 어렵다고 했다. 예비소집일·대입 실기·면접 동행도 같다. 연가를 쓴다."},{"q":"아버지가 입원하셔서 간병해야 합니다. 가족돌봄휴가가 유급인가요?","a":"무급이다. 부모·배우자·성년 자녀 등 간병은 가족돌봄휴가 제5호 사유라 쓸 수는 있지만, 유급은 미성년·장애인 자녀 돌봄에만 인정된다. 무급은 일 단위로만 쓰고 가족관계증명서 등을 낸다. 수업일 중이라도 가족의 질병·부상 간호는 교원휴가 예규상 연가 승인 사유이기도 하다."},{"q":"9월에 육아휴직에서 복직했습니다. 가족돌봄휴가가 줄어드나요?","a":"줄지 않는다. 사실상 직무에 종사하지 않은 기간을 빼는 계산은 연가에만 적용되므로, 요건에 맞으면 그해에도 연 10일 범위에서 쓸 수 있다(교육부 사례집 질의31)."}],"record":"육아시간과 가족돌봄휴가는 나이스 근무상황에서 특별휴가 종류를 골라 시간(육아시간·유급 가족돌봄휴가) 또는 일(무급 가족돌봄휴가) 단위로 신청하고 학교장(위임전결 시 교감) 결재를 받는다. 근무상황부는 나이스로 개인별 관리한다(교원휴가에 관한 예규 제4조제4항). 육아시간 대상 확인 서류는 최초 1회 제출해 학교가 보관하고, 36개월 차감(월 단위 또는 20일=1개월)과 자녀별 사용 실적은 복무 담당이 확인한다. 전보·휴직 뒤에는 이전 사용 실적을 확인해 이어서 관리한다.","sources":[{"title":"국가공무원 복무규정(대통령령, 시행 2026.6.23.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규정"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규, 2026.6.23.) PDF","publisher":"인사혁신처(국가법령정보센터 첨부)","year":2026,"url":"http://law.go.kr/flDownload.do?flSeq=166347779"},{"title":"교원휴가에 관한 예규(교육부예규 제104호, 2026.2.27.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원휴가에관한예규"},{"title":"공무원수당 등에 관한 규정(시행 2026.1.2.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/공무원수당등에관한규정"},{"title":"교육공무원 인사관리규정(교육부훈령, 2024.12.10.)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육공무원인사관리규정"}],"verified":"2026-09-29","uncertain":["교육부 질의·답변 사례집은 2022년 판이라 육아시간 24개월·가족돌봄 유급 2~3일 등 개정 전 수치가 들어 있다. 여기서는 사유 판단 사례(행사·수능·입대 등)만 인용했다","나이스에서 근무상황을 신청하는 정확한 메뉴 경로는 공식 문서로 확인하지 못해 적지 않았다","시·도교육청별 육아시간 자체기준(교원휴가 예규 제8조제2항)이 실제로 어떤 내용인지 전국 단위로 모은 자료는 찾지 못했다","육아시간·가족돌봄휴가에는 전국 공통 별지 서식이 없다(나이스 근무상황 신청으로 처리). 국가공무원 복무규칙 별지 제1호서식 근무상황부는 학교가 나이스 전자 근무상황부로 대신하므로 내려받기 목록에 넣지 않았다"],"related":["maternity","parental-leave","leave-annual","leave-special","leave-of-absence"]},{"id":"parental-leave","title":"육아휴직(교원) — 신청 기한·기간과 분할, 육아휴직수당, 호봉·경력, 복직·연장, 대체 기간제","aka":["육아휴직","육휴","육아휴직 신청","육아휴직 언제 내","육아휴직 30일 전","육아휴직 분할","육아휴직 연장","육아휴직 복직","조기 복직","방학 중 복직","육아휴직수당","육아휴직 월급","아빠의 달","부부 육아휴직","육아휴직 호봉","육아휴직 경력","둘째 육아휴직","휴직원","복직원","대체 기간제"],"category":"휴직","urgency":"미리 신청","roles":["교사 본인","교감·학교장","교무부(휴·복직 담당)","행정실(급여)","교육지원청(임용권자)","대체 기간제교원"],"summary":"만 8세 이하 또는 초등학교 2학년 이하 자녀를 키우거나 여성 교원이 임신·출산하면, 본인이 원할 때 임용권자는 육아휴직을 명해야 한다(교육공무원법 제44조제1항제7호). 기간은 자녀 1명당 3년 이내이고 원하면 나누어 쓸 수 있지만, 서류 제출 기한과 학기 단위 권장 여부는 시·도교육청 지침으로 정한다. 휴직 중에는 봉급 대신 육아휴직수당(처음 6개월 월봉급액 100%, 이후 80%, 상한 있음)이 최대 1년(부모 모두 3개월 이상 등은 18개월) 나오고, 호봉 승급에는 자녀 1명당 최초 1년(또는 1년 6개월, 셋째 이후는 전 기간)이 들어간다. 같은 사유로 기간을 늘리려면 만료 15일 전까지 연장을 신청하고(교육공무원 인사관리규정 제25조), 다른 자녀로 이어 쉬려면 복직과 새 휴직으로 처리한다. 휴직으로 후임 보충이 불가피하면 대체 기간제교원을 채용할 수 있고, 출산휴가와 이어 합산 6개월 이상이면 별도정원으로 결원을 보충할 수 있다(교육공무원 임용령 제7조의4).","first":["자녀가 대상인지 본다: 만 9세 생일 전날 또는 초등 3학년이 되는 해 3월 1일 전날까지(둘 중 하나만 맞으면 된다). 그 날짜를 지나 학기 말까지 이어 쉴 수 있는지는 소속 시·도교육청 지침으로 확인한다","이 자녀로 이미 쓴 육아휴직 기간을 합산해 3년 안에 드는지 확인한다(분할 사용분 포함)","휴직 시작일을 학기 시작(3월 1일·9월 1일)에 맞출지 먼저 정한다. 교원 법령에는 제출 기한이 없으므로 소속 시·도교육청이 정한 기한 안에, 한 달 이상 여유를 두고 휴직원·확인서·주민등록등본 또는 가족관계증명서를 학교에 낸다","휴직을 신청할 때 대상 자녀가 몇째인지, 같은 자녀로 배우자가 먼저 휴직했는지(두 번째 휴직 부모), 부부가 각각 3개월 이상 휴직하는지를 밝힌다. 육아휴직수당 상한과 지급기간이 여기서 갈린다","배우자도 같은 자녀로 육아휴직을 했거나 할 예정이면 배우자의 휴직 발령 공문 등 증빙을 준비한다","정기승급일 직후 휴직이라면 급여 담당과 승급·휴직 처리 순서를 먼저 확인한다"],"steps":[{"stage":"미리 확인","when":"휴직을 결심했을 때","who":"교사 본인","what":"요건·남은 기간·자녀 범위 확인","detail":"사유는 만 8세 이하 또는 초등 2학년 이하 자녀 양육, 여성 교원의 임신·출산이다. 두 연령 기준 중 하나만 맞으면 된다(예: 만 8세인 초3, 만 9세인 초2 모두 가능). 자녀에는 양자가 포함되고, 이혼했으면 양육권이 있는 자녀, 재혼했으면 배우자에게 양육권이 있는 자녀도 포함된다. 기간은 자녀 1명당 3년 이내이고 횟수 제한 없이 나눌 수 있다. 부부 교원은 같은 자녀에 대해 각각 쓸 수 있다.","basis":"교육공무원법 제44조제1항제7호·제45조제1항제6호; 교육공무원 임용령 제19조의2; 서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"stage":"미리 확인","when":"휴직 기간을 정할 때","who":"교사 본인·교감","what":"학기 단위로 기간 설계","detail":"육아휴직은 본인이 원하면 나누어 명할 수 있다(교육공무원 임용령 제19조의2). 다만 학생 학습권과 대체 기간제교원 채용 때문에 학기 단위 휴직을 권장하거나 방학 중 복직 뒤 재휴직을 지도하는 교육청이 있으므로, 기간은 소속 시·도교육청 지침을 확인하고 교감과 먼저 협의한다. 휴직 기간은 원칙적으로 승급기간에 들지 않으므로(육아휴직은 자녀당 최초 1년 등 예외), 정기승급일 무렵에 휴직을 시작하면 급여 담당과 승급·휴직 처리 순서를 먼저 확인한다.","basis":"교육공무원 임용령 제19조의2; 공무원보수규정 제15조; 서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"stage":"신청·보고","when":"휴직 예정일 전(시·도교육청이 정한 기한)","who":"교사 본인 → 학교(교무부)","what":"휴직원과 증빙 제출","detail":"제출 서류는 휴직원·휴직교원 유의사항 확인서 등 교육청 양식과 휴직 사유 입증 서류다. 입증 서류는 가족관계증명서·주민등록등본·입양관계증명서 중 해당 서류, 이혼했으면 양육권 입증 서류, 임신·출산 사유면 의사 진단서 또는 출산확인서다. 양식과 제출 기한은 시·도교육청마다 다르다(예: 서울특별시교육청 매뉴얼은 학기 중 휴·복직일 최소 15일 전 제출). 휴직원에는 대상 자녀와 두 번째 휴직 부모 해당 여부를 분명히 적는다.","basis":"교육공무원법 제44조제1항제7호; 공무원수당 등에 관한 규정 제11조의3제2항; 서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"stage":"결재·승인","when":"서류 접수 뒤","who":"학교장 → 교육지원청(임용권자)","what":"휴직 발령","detail":"육아휴직은 본인이 원하면 임용권자가 명해야 하는 휴직이다. 휴직 발령을 학교장이 하는지 교육지원청이 하는지는 시·도교육청 행정권한 위임 규칙에 따라 다르다(예: 서울특별시교육청은 학교장을 제외한 소속 교육공무원의 6개월 미만 휴·복직을 학교장에게 위임). 학교는 나이스 교원인사→임용발령→휴직에서 기안하며 '아빠의 달 육아휴직 유무'(두 번째 휴직 부모), 한부모 여부를 입력한다(수당과 연결). 휴·복직 발령 공문은 급여 담당과 공유한다.","basis":"교육공무원법 제44조제1항 단서; 서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"stage":"결재·승인","when":"휴직 발령과 함께","who":"학교장·교감","what":"대체 기간제교원 채용","detail":"교원이 휴직해 후임 보충이 불가피하면 기간제교원을 임용할 수 있다. 출산휴가와 이어지는 육아휴직(또는 육아휴직과 이어지는 출산휴가)을 합쳐 6개월 이상이면 정원이 따로 있는 것으로 보고 결원을 보충할 수 있다. 기간제 계약서에는 휴직 교사의 조기 복직 등 임용 사유가 사라지면 계약이 끝난다는 조건을 적어 둔다. 몇 개월 이상 휴직부터 대체 기간제를 채용하는지, 같은 교사의 휴직이 이어질 때 같은 기간제교원과 연장계약할 수 있는지는 소속 시·도교육청 계약제교원 지침으로 확인한다.","basis":"교육공무원법 제32조제1항제1호; 교육공무원 임용령 제7조의4제2항·제13조제3항"},{"stage":"사용·이행","when":"휴직 기간 중 매달","who":"행정실(급여)·교사 본인","what":"육아휴직수당 받기","detail":"30일 이상 휴직하면 육아휴직수당이 나온다. 시작일 기준 월봉급액의 1~6개월째 100%, 7개월째부터 80%이며 월 상한은 1~3개월 250만원, 4~6개월 200만원, 7개월 이후 160만원, 하한 70만원이다. 같은 자녀로 부모가 모두 휴직한 경우 두 번째로 휴직한 공무원은 6개월째까지 월봉급액 100%에 상한 250·250·300·350·400·450만원, 한부모는 3개월째까지 상한 300만원이다. 지급기간은 최초 1년, 부모 모두 3개월 이상·한부모·장애 자녀 부모는 18개월이다. 휴직한 달의 봉급은 발령일을 기준으로 일할 계산한다.","basis":"공무원수당 등에 관한 규정 제11조의3제1항·제2항·제6항·제7항; 공무원보수규정 제22조"},{"stage":"사용·이행","when":"휴직 기간 중","who":"교사 본인","what":"휴직자 의무 지키기","detail":"휴직 중에도 공무원 신분이 유지되므로 품위유지·영리업무 금지·겸직허가 규정이 그대로 적용된다. 매 반기(6월 30일, 12월 31일) 휴직자 실태 보고서(교육공무원 인사관리규정 별지 제1호서식)로 소재지·연락처·휴직 사유 계속 여부를 학교장에게 보고한다(휴직 시작 1개월 이내면 생략). 휴직 목적에 어긋나는 활동은 하지 않는다. 목적에 현저히 어긋나 복직명령을 받으면 그 휴직기간은 승급기간에 산입되지 않는다. 육아휴직 중 대학원 수강 등이 허용되는지는 소속 시·도교육청에 먼저 묻는다.","basis":"국가공무원법 제73조제1항; 교육공무원 인사관리규정 제26조·별지 제1호서식; 공무원보수규정 제15조 단서"},{"stage":"신청·보고","when":"휴직 기간 만료 15일 전까지","who":"교사 본인 → 학교 → 교육지원청","what":"같은 자녀로 기간 연장","detail":"법정 휴직기간(자녀 1명 3년) 안에서 같은 사유로 연장하려면 만료 15일 전까지 휴직 연장원(교육청 양식)과 증빙을 낸다. 연장 허가 때는 이미 쓴 기간을 자녀별로 합산해 3년을 넘는지 확인한다. 대상 자녀를 바꾸는 것(첫째→둘째)은 같은 사유가 아니므로 연장이 아니다.","basis":"교육공무원 인사관리규정 제25조; 서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"stage":"신청·보고","when":"다른 자녀로 이어서 쉴 때","who":"교사 본인 → 학교 → 교육지원청","what":"복직과 새 휴직을 동시에","detail":"첫째 육아휴직에 이어 둘째 육아휴직을 하는 것은 연장이 아니라 새 휴직이다. 당초 휴직에 대해 복직을 신청하면서 동시에 다른 자녀에 대해 휴직을 신청해 각각 허가받는다. 복직된 날과 같은 날짜로 새 휴직을 명할 수 있다. 서울특별시교육청 매뉴얼은 교육부 '교육공무원 인사실무'와 공무원보수 업무지침도 같은 방식으로 안내한다고 적고, 이렇게 하지 않으면 둘째에 대한 육아휴직수당·근속 혜택을 받지 못한다고 한다. 서류 기한은 시·도교육청 지침을 따른다. 휴직 중 출산이 다가오면 먼저 복직해 출산휴가를 쓴 뒤 다시 휴직한다('임신·출산' 항목).","basis":"서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼(교육부 교육공무원 인사실무·공무원보수 업무지침 인용)"},{"stage":"복귀·정산","when":"휴직 만료 또는 사유 소멸","who":"교사 본인 → 학교 → 교육지원청","what":"복직 신청","detail":"휴직기간이 끝나 30일 이내에 복귀 신고를 하면 당연히 복직되고, 복직일까지는 휴직기간으로 본다. 기간 중 사유가 사라지면(자녀 사망, 유산 등) 30일 이내에 신고해야 하고 임용권자는 지체 없이 복직을 명한다. 복직원(교육청 양식)과 증빙을 교육청이 정한 기한 안에 내고, 조기 복직이면 대체 기간제교원 해고 예고 기간(30일)을 고려해 한 달 이상 여유 있게 낸다. 복직 발령은 원칙적으로 소급할 수 없으니 제때 처리한다. 2년 이상 육아휴직한 교원은 복직하려면 연수를 받아야 한다. 원래 학교로 복직되는지는 시·도교육청 인사관리기준에 따른다.","basis":"국가공무원법 제73조제2항·제3항; 교육공무원법 제45조제3항; 서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"stage":"복귀·정산","when":"복직 발령 때","who":"교무부·행정실","what":"호봉 재획정과 경력 반영","detail":"복직할 때 호봉을 다시 획정한다. 육아휴직 기간은 자녀 1명당 최초 1년(부모 모두 3개월 이상·한부모·장애 자녀 부모는 1년 6개월)까지 승급기간에 들어가고, 셋째 이후 자녀는 전 기간이 들어간다. 승진 경력평정에서는 육아휴직 기간 전부를 재직기간으로 보고, 근속기간에도 포함된다. 나이스 호봉 처리는 복직일 기준 호봉획정일·차기승급일·잔여월수를 입력한다.","basis":"공무원보수규정 제15조제6호; 교육공무원 승진규정 제11조제1항제1호나목; 교육공무원법 제44조제4항"},{"stage":"사후 관리","when":"복직일을 정할 때(특히 방학 전후)","who":"교사 본인·학교장","what":"방학 복직·조기 복직과 대체 기간제","detail":"복직일은 본인이 정할 수 있지만, 방학 중 복직했다가 개학 뒤 다시 휴직하는 운영은 교육청이 지도하는 경우가 있다. 서울특별시교육청 휴·복직 매뉴얼(2024)은 육아휴직 복직 때 휴직 사유 소멸 여부를 확인해 방학 중 복직했다 개학 후 다시 휴직하는 일이 없도록 지도하라고 한다. 소속 시·도교육청 지침을 먼저 확인한다. 조기 복직으로 대체 기간제교원의 계약을 해지해야 하면, 학교는 근로기준법의 해고 예고(30일 전 예고, 어기면 30일분 이상 통상임금)를 지켜야 한다.","basis":"서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼; 근로기준법 제26조"}],"deadlines":[{"what":"휴직원·복직원 제출","limit":"교원 법령에 기한 없음 — 시·도교육청 지침(예: 서울특별시교육청 학기 중 최소 15일 전, 조기 복직은 1개월 이상 여유)","basis":"서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"what":"같은 사유 휴직기간 연장 신청","limit":"휴직기간 만료 15일 전까지","basis":"교육공무원 인사관리규정 제25조"},{"what":"다른 사유(다른 자녀)로 계속 휴직","limit":"당초 휴직 복직과 새 휴직을 함께 신청, 같은 날 발령 가능. 서류 기한은 시·도교육청 지침","basis":"서울특별시교육청 2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼"},{"what":"휴직 사유 소멸 신고 / 만료 후 복귀 신고","limit":"각 30일 이내(만료 후 30일 안에 신고하면 당연 복직)","basis":"국가공무원법 제73조제2항·제3항"},{"what":"육아휴직 기간","limit":"자녀 1명당 3년 이내, 분할 가능(횟수 제한 없음)","basis":"교육공무원법 제45조제1항제6호; 교육공무원 임용령 제19조의2"},{"what":"육아휴직수당 지급기간","limit":"최초 1년(부모 모두 각 3개월 이상·한부모·장애 자녀 부모는 18개월)","basis":"공무원수당 등에 관한 규정 제11조의3제6항·제7항"},{"what":"휴직자 실태 보고","limit":"매 반기(6월 30일, 12월 31일). 휴직 시작 후 1개월 이내면 생략","basis":"교육공무원 인사관리규정 제26조"},{"what":"대체 기간제 계약 해지 예고(조기 복직 시)","limit":"해지 30일 전 예고(예고하지 않으면 30일분 이상 통상임금)","basis":"근로기준법 제26조"},{"what":"기간제교원 본인의 육아휴직 신청","limit":"휴직개시예정일 30일 전까지(유산·조산 위험, 예정일 전 출생 등은 7일 전). 사용자는 14일(7일 전 신청은 3일) 안에 허용 사실을 알려야 함","basis":"남녀고용평등과 일·가정 양립 지원에 관한 법률 시행령 제11조"}],"dont":["첫째 육아휴직을 둘째 사유로 그냥 '연장'하지 않는다 — 연장으로 처리되면 둘째에 대한 육아휴직수당과 근속 산입을 받지 못한다. 복직과 새 휴직을 함께 신청한다","휴직 중 출산휴가를 신청하지 않는다 — 휴직 중엔 출산휴가를 쓸 수 없으므로 먼저 복직한다","방학 직전 복직했다가 개학 후 다시 휴직하는 식으로 계획하지 않는다 — 교육청 지도 대상이 될 수 있고 대체 기간제 계약에도 영향을 준다. 계획 전에 소속 교육청 지침을 확인한다","휴직원에 자녀 순서와 '아빠의 달'·'3개월 이상' 여부를 빠뜨리지 않는다 — 육아휴직수당 상한과 지급기간이 여기서 정해진다","휴직 사유가 사라졌는데 30일 넘게 신고하지 않고 있지 않는다 — 직권면직 사유가 될 수 있고 복직 발령은 소급되지 않는다","휴직 중 대학원 수강·영리활동 등 휴직 목적에 어긋나는 일을 하지 않는다 — 복직명령을 받으면 그 휴직기간은 승급기간에 산입되지 않는다","정기승급일에 승급 처리하고 같은 날 휴직 발령하지 않는다 — 휴직 기간은 원칙적으로 승급기간에 들지 않아 처리 순서가 꼬이면 호봉을 다시 정정해야 한다. 급여 담당과 순서를 먼저 맞춘다","대체 기간제 계약서에 조기 복직 시 해지 조건을 빼지 않는다 — 명시하지 않으면 조기 복직 때 계약 해지가 분쟁이 된다"],"contacts":[{"name":"소속 교육지원청·시·도교육청 교원인사 담당","tel":"소속 교육청","note":"휴직 발령·연장·복직 처리, 서류 기한, 대체 기간제 채용 기준"}],"forms":["휴직원·휴직 연장원·복직원·휴직교원 유의사항 확인서 — 시·도교육청 양식","주민등록등본 또는 가족관계증명서, 양육권 입증 서류(이혼·재혼 시), 임신·출산 사유면 진단서·출산확인서","배우자 육아휴직 증빙(인사발령 통지서 등, 육아휴직 기간·대상 자녀 기재) — 두 번째 휴직 부모('아빠의 달') 수당 신청 시","호봉획정표 — 복직 시","휴직자 실태 보고서 — 교육공무원 인사관리규정 별지 제1호서식(반기 보고)","기간제교원 본인 육아휴직: 출산전후휴가(배우자 출산전후휴가)·육아휴직 통합 신청서 — 남녀고용평등법 시행규칙 별지 제7호의2서식(출산휴가와 함께 신청할 때)"],"law":[{"name":"교육공무원법","article":"제44조제1항제7호·제4항, 제45조제1항제6호·제3항","point":"만 8세 이하 또는 초2 이하 자녀 양육·여성 교원 임신·출산 시 본인이 원하면 휴직을 명해야 함. 자녀 1명당 3년 이내 분할 가능. 불리한 처우 금지·근속기간 포함. 2년 이상 휴직 후 복직 시 연수"},{"name":"교육공무원 임용령","article":"제19조의2","point":"육아휴직 명령은 본인이 원하면 분할할 수 있음"},{"name":"국가공무원법","article":"제73조","point":"휴직 중 신분 보유·직무 종사 불가, 사유 소멸 30일 이내 신고, 만료 후 30일 이내 복귀 신고 시 당연 복직"},{"name":"공무원수당 등에 관한 규정","article":"제11조의3","point":"30일 이상 휴직 시 육아휴직수당: 1~6개월 월봉급액 100%(상한 250·200만원), 7개월 이후 80%(상한 160만원), 하한 70만원. 두 번째 휴직 부모·한부모 특례. 지급기간 1년(요건 시 18개월)"},{"name":"공무원보수규정","article":"제15조제6호","point":"육아휴직 기간은 자녀 1명당 최초 1년(요건 시 1년 6개월)을 승급기간에 산입, 셋째 이후 자녀는 전 기간 산입"},{"name":"교육공무원 승진규정","article":"제11조제1항제1호나목","point":"교육공무원법 제44조제1항제7호 휴직기간은 전부 경력평정 기간에 포함"},{"name":"교육공무원 인사관리규정(교육부훈령)","article":"제25조·제26조","point":"휴직기간 연장은 만료 15일 전까지 신청, 휴직자는 반기별(6.30., 12.31.) 실태 보고"},{"name":"교육공무원법","article":"제32조제1항제1호","point":"휴직으로 후임 보충이 불가피하면 기간제교원 임용 가능"},{"name":"교육공무원 임용령","article":"제7조의4제2항","point":"출산휴가와 연속되는 육아휴직(또는 육아휴직과 연속되는 출산휴가)이 합산 6개월 이상이면 정원이 따로 있는 것으로 보고 결원 보충 가능"},{"name":"남녀고용평등과 일·가정 양립 지원에 관한 법률","article":"제19조; 시행령 제10조·제11조; 시행규칙 별지 제7호의2서식","point":"기간제교원 등 근로자의 육아휴직: 1년 이내(요건 시 6개월 추가), 30일 전 신청(예외 7일 전), 계속근로 6개월 미만은 허용하지 않을 수 있음, 휴직 중 해고 금지"}],"deep":[{"title":"대상 자녀 기준과 '언제까지 쉴 수 있나'","body":["법은 '만 8세 이하 또는 초등학교 2학년 이하'다. 만 8세 이하는 만 9세 생일 전날까지, 초등 2학년 이하는 3학년이 되는 해 3월 1일 전날까지이며 둘 중 하나만 충족하면 된다.","법령은 대상 연령만 정하고 있어, 자녀가 기준 나이·학년을 넘은 뒤에도 그 학기 말(또는 학년 말)까지 휴직을 이어 갈 수 있는지는 시·도교육청 지침으로 확인한다. 두 요건 중 유리한 쪽을 골라 신청하되 자녀당 3년 범위는 지켜야 한다.","참고로 일반직에 적용되는 국가공무원법은 2026.6.2. 개정으로 육아휴직 대상을 12세 이하 또는 초등학교 6학년 이하로 넓혔지만, 교원에게 적용되는 교육공무원법 제44조제1항제7호는 2026년 11월 시행 예정 개정본까지도 '만 8세 이하 또는 초등학교 2학년 이하' 그대로다."],"basis":"교육공무원법 제44조제1항제7호(시행 2026.2.15. 및 2026.10.2.·2026.11.20. 시행예정본); 국가공무원법 제71조제2항제4호(2026.6.2. 개정)"},{"title":"육아휴직수당 계산 예","body":["기준은 휴직 시작일의 월봉급액이다. 일반적인 경우 1~3개월째는 월봉급액(상한 250만원), 4~6개월째는 월봉급액(상한 200만원), 7개월째부터는 월봉급액의 80%(상한 160만원)이고, 계산액이 70만원보다 적으면 70만원을 준다.","같은 자녀로 배우자가 먼저 육아휴직을 했고 내가 두 번째라면('아빠의 달' 육아휴직), 6개월째까지 월봉급액 100%에 상한이 1·2개월 250만원, 3개월 300만원, 4개월 350만원, 5개월 400만원, 6개월 450만원으로 올라간다. 7개월째부터는 일반 기준이다. 배우자 휴직 사실은 기간·대상 자녀가 적힌 인사발령 통지서 등으로 증빙한다.","지급기간은 휴직일부터 최초 1년이다. 부모가 같은 자녀로 각각 3개월 이상 휴직했거나 한부모, 인사혁신처장이 정하는 장애 자녀의 부모면 18개월까지 늘어난다. 나누어 쉬었다면 각 휴직 기간을 합산해 한도를 본다."],"basis":"공무원수당 등에 관한 규정 제11조의3(2025.1.3. 개정); 서울특별시교육청 2024 휴·복직 매뉴얼 3-48"},{"title":"호봉·승진경력·근속 — 무엇이 얼마나 인정되나","body":["호봉(승급기간): 자녀 1명에 대한 총 휴직기간 중 최초 1년만 들어간다. 부모 모두 3개월 이상·한부모·장애 자녀 부모는 1년 6개월, 셋째 이후 자녀는 휴직 전 기간이 들어간다. 복직할 때 이를 반영해 호봉을 재획정한다.","승진 경력평정: 교육공무원 승진규정은 육아휴직 기간 전부를 재직기간으로 보아 평정기간에 넣는다.","근속: 교육공무원법 제44조제4항은 육아휴직을 이유로 인사상 불리한 처우를 금지하고 휴직기간을 근속기간에 포함한다. 다만 휴직 중 정기승급은 없으므로 복직 때 한꺼번에 반영된다."],"basis":"공무원보수규정 제15조제6호; 교육공무원 승진규정 제11조제1항; 교육공무원법 제44조제4항"},{"title":"대체 기간제교원과의 관계","body":["휴직으로 후임 보충이 불가피하면 기간제교원을 임용할 수 있다(교육공무원법 제32조제1항제1호). 출산휴가와 육아휴직을 이어 합산 6개월 이상이면 정원이 따로 있는 것으로 보고 결원을 보충할 수 있다(교육공무원 임용령 제7조의4제2항). 기간제교원 임용기간은 1년 이내이고 필요하면 3년 범위에서 연장할 수 있다(같은 영 제13조제3항).","몇 개월 이상 휴직부터 대체 기간제를 뽑는지, 같은 교사의 산전 육아휴직→출산휴가→육아휴직이나 첫째→둘째 육아휴직처럼 사유가 이어질 때 같은 기간제교원과 연장계약할 수 있는지는 시·도교육청 계약제교원 지침으로 정한다.","휴직 교사가 조기 복직하면 기간제 계약을 끝내야 할 수 있다. 계약서에 해지 조건이 있어야 하고, 학교는 30일 전 해고 예고 등 근로기준법 절차를 지켜야 하므로 복직일은 늦어도 한 달 전에는 학교와 공유하는 것이 좋다."],"basis":"교육공무원법 제32조제1항제1호; 교육공무원 임용령 제7조의4제2항·제13조제3항; 근로기준법 제26조"},{"title":"기간제교원 본인의 육아휴직은 다른 법","body":["기간제교원은 교육공무원법의 휴직 조항을 적용받지 않고(교육공무원법 제32조제3항), 「남녀고용평등과 일·가정 양립 지원에 관한 법률」 제19조에 따라 육아휴직을 한다. 기간은 1년 이내이고, 부모가 같은 자녀로 각각 3개월 이상 쓴 경우·한부모·장애아동 부모는 6개월을 더 쓸 수 있다.","휴직개시예정일 30일 전까지 신청서를 내야 하고(유산·조산 위험, 예정일 전 출생, 배우자 사정 등은 7일 전), 휴직개시 전날까지 계속 근로한 기간이 6개월 미만이면 허용하지 않을 수 있다. 출산휴가를 청구하면서 육아휴직을 함께 신청할 때는 시행규칙 별지 제7호의2서식(통합 신청서)을 쓴다.","육아휴직 기간에는 해고할 수 없고, 이 기간은 기간제법상 사용기간에서 빠진다. 계약기간 만료와 육아휴직의 관계, 급여 신청은 소속 시·도교육청 계약제교원 지침으로 확인한다."],"basis":"교육공무원법 제32조제3항; 남녀고용평등과 일·가정 양립 지원에 관한 법률 제19조, 같은 법 시행령 제10조·제11조, 같은 법 시행규칙 별지 제7호의2서식(2026.8.19. 개정)"}],"tables":[{"title":"육아휴직수당 월 상한(공무원수당 등에 관한 규정 제11조의3)","head":["휴직 개월","일반","같은 자녀 두 번째 휴직 부모","한부모"],"rows":[["1~2개월째","월봉급액 100%, 250만원","100%, 250만원","100%, 300만원"],["3개월째","100%, 250만원","100%, 300만원","100%, 300만원"],["4개월째","100%, 200만원","100%, 350만원","일반과 같음"],["5개월째","100%, 200만원","100%, 400만원","일반과 같음"],["6개월째","100%, 200만원","100%, 450만원","일반과 같음"],["7개월째 이후","80%, 160만원","일반과 같음","일반과 같음"]],"note":"하한 월 70만원. 지급기간 최초 1년, 부모 모두 각 3개월 이상·한부모·장애 자녀 부모는 18개월. 30일 이상 휴직해야 지급. 출처: 공무원수당 등에 관한 규정(시행 2026.1.2.) 제11조의3."},{"title":"육아휴직 기간의 인정 범위","head":["구분","인정","근거"],"rows":[["호봉 승급기간","자녀 1명당 최초 1년(요건 시 1년 6개월), 셋째 이후 자녀 전 기간","공무원보수규정 제15조제6호"],["승진 경력평정","휴직기간 전부","교육공무원 승진규정 제11조제1항제1호나목"],["근속기간","포함(불리한 처우 금지)","교육공무원법 제44조제4항"],["봉급","지급 안 함(휴직한 달은 발령일 기준 일할 계산)","공무원보수규정 제22조"],["결원보충","출산휴가와 이어 합산 6개월 이상이면 별도정원 보충. 대체 기간제 채용 기준은 시·도교육청 지침","교육공무원 임용령 제7조의4제2항; 교육공무원법 제32조제1항제1호"]],"note":"일부 시·도교육청 안내 자료는 경력평정을 '최초 1년 산입'으로 적었으나, 교육공무원 승진규정(2026.6.16. 시행) 제11조는 제7호 휴직기간 전부를 포함한다고 정한다. 법령을 기준으로 적었다."}],"faq":[{"q":"육아휴직은 몇 달 전에 신청해야 하나요?","a":"교원에게 법령상 정해진 신청 기한은 없고 시·도교육청 지침을 따른다. 예를 들어 서울특별시교육청 매뉴얼은 학기 중 휴·복직일 최소 15일 전 제출을 요구한다. 대체 기간제 채용과 업무 배정을 위해 학기 시작 휴직이라면 한 달 이상 여유를 두고 알리는 것이 좋다."},{"q":"육아휴직을 3개월만 쓰고 방학 때 복직해도 되나요?","a":"법적으로 분할과 기간 선택은 본인 희망이 원칙이지만(교육공무원 임용령 제19조의2), 교육청이 학기 단위 휴직을 권장하거나 방학 복직 후 개학 뒤 재휴직을 지도할 수 있다. 국가인권위원회도 교육청의 학기 단위 허가 기준을 차별로 보지 않은 결정(08진차765)이 있다(서울특별시교육청 매뉴얼 인용). 계획 단계에서 교감·교육지원청과 먼저 협의한다."},{"q":"첫째 육아휴직이 끝나는 날 바로 둘째 육아휴직을 이어서 할 수 있나요?","a":"할 수 있다. 다만 연장이 아니라 첫째에 대한 복직과 둘째에 대한 새 휴직으로 처리해야 하고, 같은 날 발령할 수 있다. 서류 기한은 교육청 지침을 따른다. 연장으로 처리되면 둘째에 대한 육아휴직수당과 근속 혜택을 못 받는다."},{"q":"아내가 먼저 육아휴직을 했고 저는 두 번째입니다. 수당이 더 나오나요?","a":"같은 자녀로 두 번째로 휴직하는 공무원은 6개월째까지 월봉급액 100%에 상한이 250만원(1·2개월)에서 450만원(6개월)까지 올라간다. 휴직원에 '아빠의 달 육아휴직'을 적고, 배우자의 휴직 기간과 대상 자녀가 적힌 인사발령 통지서 등을 낸다. 부부가 각각 3개월 이상 휴직하면 수당 지급기간도 18개월로 늘어난다."},{"q":"육아휴직 3년을 다 쓰면 호봉은 3년 다 오르나요?","a":"첫째·둘째 자녀는 자녀당 최초 1년(부부 모두 3개월 이상 휴직 등은 1년 6개월)만 승급기간에 들어간다. 셋째 이후 자녀는 휴직 전 기간이 들어간다. 승진 경력평정에는 기간 전부가 들어간다."},{"q":"복직하면 원래 학교로 돌아가나요?","a":"보장되지 않는다. 복직할 학교는 시·도교육청 인사관리기준에 따르고, 원래 학교가 아닌 곳으로 복직될 수 있다. 휴직 중 정기전보 대상이 되는 경우의 처리도 소속 교육청 전보 지침으로 확인한다."}],"record":"휴직은 근무상황이 아니라 인사발령으로 처리한다. 학교는 나이스 교원인사→임용발령→휴직에서 임용기안을 만들고 임용구분 '육아휴직', 아빠의 달 육아휴직 유무(Y/N, Y이면 자녀 출생일 입력), 한부모 여부, 임용근거(공문번호), 휴직기간을 입력해 상신·승인 후 시행하면 인사기록 경력란에 반영된다. 연장은 임용기안문작성(휴복직)→휴직연장, 복직은 임용발령→복직 메뉴에서 같은 방식으로 처리하고, 복직 때 호봉획정일·차기승급일·잔여월수를 입력한다. 인사기록카드에는 양육 자녀명과 생년월일을 함께 적고, 휴·복직 발령 공문은 급여 담당에게 공람한다. 다른 자녀로 계속 휴직하면 이전 휴직을 복직 처리한 뒤 호봉획정 없이 새 휴직 발령을 한다.","sources":[{"title":"교육공무원법(시행 2026.2.15.; 2026.10.2.·2026.11.20. 시행예정본 대조)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"교육공무원 임용령(시행 2025.9.16.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원임용령"},{"title":"국가공무원법(시행 2026.6.2.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원법"},{"title":"공무원수당 등에 관한 규정(시행 2026.1.2.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/공무원수당등에관한규정"},{"title":"공무원보수규정(시행 2026.8.1.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/공무원보수규정"},{"title":"교육공무원 승진규정(시행 2026.6.16.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원승진규정"},{"title":"교육공무원 인사관리규정(교육부훈령, 2024.12.10.)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육공무원인사관리규정"},{"title":"2024(중등) 교육공무원 휴·복직 업무 처리 매뉴얼","publisher":"서울특별시교육청","year":2024,"url":"https://buseo.sen.go.kr/component/file/ND_fileDownload.do?q_fileSn=2124077&q_fileId=c7dc272a-6ed1-4f14-93c6-e005afc6c6c0"},{"title":"남녀고용평등과 일·가정 양립 지원에 관한 법률·시행령(시행 2026.9.18.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/남녀고용평등과일ㆍ가정양립지원에관한법률시행령"},{"title":"남녀고용평등과 일·가정 양립 지원에 관한 법률 시행규칙 [별지 제7호의2서식] 출산전후휴가(배우자 출산전후휴가)·육아휴직 통합 신청서(2026.8.19. 개정)","publisher":"고용노동부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/LSW/flDownload.do?flSeq=168822019"},{"title":"교육공무원 인사관리규정 [별지 제1호서식] 휴직자 실태 보고서","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/LSW/flDownload.do?flSeq=146379185"}],"verified":"2026-09-29","uncertain":["국가공무원법은 2026.6.2. 개정으로 일반직 육아휴직 대상을 12세 이하·초등 6학년 이하로 넓혔으나 교육공무원법은 8세·초2 그대로다. 교원에게도 확대 적용하는 교육부 지침이나 교육공무원법 개정 계획이 있는지는 확인하지 못했다","휴직자 실태 보고서(교육공무원 인사관리규정 별지 제1호서식)와 기간제교원용 남녀고용평등법 시행규칙 별지 제7호의2서식을 전국 서식으로 내려받기 목록에 넣었다. 교육공무원(정규 교원)의 휴직원·복직원은 전국 공통 법정 서식이 없어 시·도교육청 양식을 쓴다","교육공무원 휴직 발령권의 위임 범위(학교장이 몇 개월 미만까지 발령하는지)는 시·도교육청 규칙마다 달라 전국 기준으로 정리하지 못했다. 서울특별시교육청 예(6개월 미만 학교장 위임)만 확인했다","기간제교원 육아휴직급여(고용보험) 신청 절차는 이 항목에서 확인하지 못했다"],"related":["maternity","childcare-time","leave-of-absence","salary-step","transfer","side-job"]},{"id":"leave-of-absence","title":"휴직(육아휴직 외) — 질병·공무상 질병·가족돌봄·동반·자율연수·유학·연수휴직의 신청·보수·복직","aka":["질병휴직","병휴직","공무상 질병휴직","공상 휴직","난임휴직","간병휴직","가사휴직","가족돌봄휴직","부모님 간병","동반휴직","배우자 해외 근무","자율연수휴직","안식년","유학휴직","연수휴직","휴직 연장","복직원","휴직원","휴직 중 월급","휴직자 실태보고"],"category":"휴직","urgency":"미리 신청","roles":["교사 본인","교감·교무부(복무 담당)","학교장","행정실(급여 담당)","교육지원청(인사 담당)","시·도교육청(임용권자)"],"summary":"휴직은 신분은 유지하되 직무에 종사하지 않는 제도로, 교육공무원법 제44조가 사유를, 제45조가 기간을 정한다. 질병·병역·법정의무·노조전임은 요건이 되면 반드시 휴직을 명하는 직권휴직이고, 유학·고용·연수·가족돌봄·동반·자율연수 휴직은 임용권자가 교육과정 운영·교원 수급·예산·휴직 목적 등을 보고 허가 여부를 정하는 청원휴직이다(교육공무원 인사관리규정 제24조). 휴직원을 언제 어떤 서식으로 내는지, 학기 단위로 맞추는지, 누가 발령하는지는 법령에 정한 것이 없어 소속 시·도교육청 지침으로 확인한다. 봉급은 질병·난임휴직이 1년까지 70%, 1년 초과 50%, 공무상 질병휴직이 전액이고 나머지는 대부분 무급이다. 휴직 사유가 없어지면 30일 이내에 신고해 복직하고, 기간이 끝나면 30일 이내에 복귀 신고를 해야 하며, 복귀하지 않으면 직권면직될 수 있다.","first":["내 사유가 교육공무원법 제44조 제1항 몇 호에 해당하는지, 기간 한도(질병 1년+1년, 가족돌봄 1년·재직 중 총 3년, 자율연수 재직 중 1회 등)와 이미 쓴 기간을 먼저 확인한다","질병이면 병가(연 60일)와 연가가 얼마 남았는지 본다. 교원휴가에 관한 예규는 연도 중 휴직 예정자를 연가 미리쓰기 대상에서 빼므로, 휴직을 앞두고 연가를 당겨 쓰지 않는다. 공무상이면 공무원연금공단의 공무상 요양 승인을 받아야 공무상 질병휴직이 된다","교감·교무부에 휴직 희망 시기를 알리고 시작일을 협의한다 — 기간제교사 채용과 업무 배정이 걸려 있고, 학기 단위 운영 여부는 시·도교육청 지침을 따른다","휴직원과 사유 증빙(진단서, 가족관계증명서, 입학허가서, 배우자 재직·파견 증명 등)을 준비한다. 휴직원 서식과 제출 기한은 소속 시·도교육청이 정한 것을 교무부·교육지원청에서 받아 확인한다","유학·고용·연수휴직처럼 허가가 필요한 휴직은 신청 전에 교육지원청(임용권자)에 허가 가능성부터 문의한다. 학교장이 허가를 약속할 수 있는 사안이 아니다","휴직 중 월급·수당이 어떻게 되는지, 복직 때 승급기간에 들어가는지 행정실 급여 담당에게 확인한다"],"steps":[{"stage":"미리 확인","when":"휴직을 생각하기 시작할 때","who":"교사 본인","what":"휴직 종류·요건·기간 확인","detail":"교육공무원법 제44조 제1항: 1호 질병(신체·정신상 장애로 장기요양), 5호 유학(학위취득 목적 해외유학 또는 외국에서 1년 이상 연구·연수), 6호 고용, 7의3호 불임·난임, 8호 연수(교육부장관·교육감 지정 연구·교육기관), 9호 가족돌봄(조부모·부모·배우자의 부모·배우자·자녀·손자녀 부양·돌봄), 10호 동반(배우자 국외 근무·유학), 12호 자율연수(공무원연금법상 재직기간 10년 이상 교원의 자기개발 학습·연구). 조부모·손자녀 돌봄은 본인 외에 돌볼 직계비속·직계존속이 없거나 그들이 질병·고령·장애·미성년으로 돌볼 수 없을 때만 된다. 육아휴직(7호)·입양휴직(7의2호)은 '육아휴직' 항목을 본다.","basis":"교육공무원법 제44조 제1항; 교육공무원임용령 제19조의4"},{"stage":"미리 확인","when":"질병·난임으로 휴직할 때","who":"교사 본인 → 교감","what":"병가 소진 여부와 질병휴직 연결 확인","detail":"병가(연 60일)로 치료가 끝나지 않고 직무를 할 수 없으면 질병휴직(1호)을 검토한다. 교원휴가에 관한 예규는 연가 미리쓰기 대상에서 연도 중 휴직·퇴직 예정자를 뺀다. 임용권자는 질병·난임휴직 여부를 정하려고 질병휴직위원회에 자문할 수 있다. 공무상 질병휴직은 공무원 재해보상법에 따른 공무상 요양(재요양) 승인을 받은 경우로 한정되고, 승인 기간이 끝난 뒤에는 같은 사유로 새로 휴직하거나 연장할 수 없다. 병가와 이어진 질병휴직이 합쳐 6개월 이상이면 결원을 보충(기간제교사 채용)할 수 있다.","basis":"교원휴가에 관한 예규 제4조 제6항; 교육공무원임용령 제19조 제1항~제4항·제7조의4 제2항 제1호"},{"stage":"신청·보고","when":"휴직 시작 전(기한은 시·도교육청 지침)","who":"교사 본인 → 학교(교무부)","what":"휴직원과 사유 증빙 제출","detail":"휴직원에는 소속·직위·성명·생년월일·휴직기간·사유를 적고 근거('교육공무원법 제44조 제1항 제○호')를 밝힌다. 청원휴직 신청 기한을 정한 법령 조문은 없으므로 제출 시기, 서식, 학기 단위 운영 여부는 소속 시·도교육청 지침을 따른다. 학교는 업무 배정과 기간제교사 채용을 준비해야 하므로 날짜가 정해지는 대로 알린다. 임용일자는 소급할 수 없어 발령일 전에 서류가 들어가야 한다.","basis":"교육공무원법 제44조 제1항; 교육공무원임용령 제5조 제1항; 소속 시·도교육청 휴·복직 지침"},{"stage":"신청·보고","when":"휴직원과 함께","who":"교사 본인, 학교장","what":"휴직 종류별 증빙 서류","detail":"휴직 사유를 입증할 서류를 붙인다. 질병휴직은 진단서(공무상이면 공무상 요양 승인 서류), 난임휴직은 진단서, 가족돌봄휴직은 가족관계 증명과 돌봄이 필요함을 보여 주는 서류(조부모·손자녀면 다른 가족이 돌볼 수 없다는 증빙), 동반휴직은 배우자 국외 근무·유학 증빙, 유학휴직은 입학허가서 등 유학 증빙, 연수휴직은 교육부장관·교육감이 지정한 연구·교육기관의 연수 증빙, 자율연수휴직은 재직기간 10년 이상 확인과 연수계획을 낸다. 학교장 의견서·서약서·학교인사자문위원회 회의록 같은 추가 서류는 시·도교육청마다 다르다.","basis":"교육공무원법 제44조 제1항; 교육공무원임용령 제19조·제19조의4; 소속 시·도교육청 지침"},{"stage":"결재·승인","when":"서류 접수 뒤","who":"임용권자(교육감, 위임 시 교육장·학교장)","what":"휴직 발령","detail":"휴직은 임용권자가 발령한다. 교육감의 임용권 중 어느 부분을 교육장·학교장에게 넘기는지는 시·도교육청 규칙으로 정하므로, 휴직 기간·종류에 따라 학교장이 발령하는지 교육지원청이 발령하는지는 교육청마다 다르다. 청원휴직(5~10호)을 허가할 때 임용권자는 교육과정 운영, 교원 수급, 소요 예산, 휴직 목적의 적합성, 복직 후 교육발전 기여 가능성 등을 종합한 자체 심사기준으로 결정할 수 있다. 직권휴직은 사유에 해당하면 반드시 휴직을 명한다.","basis":"교육공무원법 제33조·제44조 제1항 단서; 교육공무원임용령 제3조; 교육공무원 인사관리규정 제24조"},{"stage":"결재·승인","when":"발령 처리 때","who":"교무부·행정실(급여 담당)","what":"발령일·승급·급여 확인","detail":"교육공무원은 임용장이나 임용통지서에 적힌 날짜에 임용된 것으로 보며 임용일자를 소급할 수 없다. 휴직 기간은 원칙적으로 승급기간에 넣지 않으므로 정기승급일과 휴직일이 겹치면 승급 처리가 맞는지 확인한다. 휴·복직 발령 내용은 급여 담당에게 바로 알려 봉급·수당이 휴직 사유에 맞게 지급되거나 정지되게 한다.","basis":"교육공무원임용령 제5조 제1항; 공무원보수규정 제14조·제28조"},{"stage":"사용·이행","when":"휴직 기간 중","who":"교사 본인","what":"휴직자 복무 — 목적대로 쓰고 신분상 의무 지키기","detail":"휴직자는 직무에 종사하지 않을 뿐 공무원 신분은 그대로여서 영리업무 금지와 겸직허가 규정이 적용된다. 휴직 목적과 달리 거짓이나 부정한 방법으로 봉급을 받으면 그 금액을 징수당한다. 휴직 사유가 없어지면(예: 돌봄 대상 가족의 회복, 유학 중단) 30일 이내에 신고해 복직해야 하고, 이를 어기면 직권면직이나 징계로 이어질 수 있다.","basis":"국가공무원법 제64조·제73조 제1항·제2항; 공무원보수규정 제28조 제3항; 공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026) 휴직기간 중 봉급감액"},{"stage":"사용·이행","when":"매년 6월 30일·12월 31일","who":"교사 본인 → 학교장","what":"휴직자 실태 보고","detail":"휴직자는 반기마다 소재지·연락처·휴직사유 계속 여부를 휴직자 실태 보고서(교육공무원 인사관리규정 별지 제1호서식)로 소속 기관장에게 보고한다. 보고 시점이 휴직 시작 후 1개월 이내면 생략한다. 학교장은 휴직자의 실태를 파악하고 보고서를 관리한다.","basis":"교육공무원 인사관리규정 제26조·별지 제1호서식"},{"stage":"사용·이행","when":"휴직기간 만료 15일 전까지","who":"교사 본인","what":"휴직 연장 또는 다른 사유로 전환","detail":"같은 사유로 법정 기간 안에서 연장하려면 만료 15일 전까지 신청한다(연장 신청서와 연장 사유 증빙). 다른 사유로 이어서 휴직하는 것은 연장이 아니라 새 휴직이므로, 당초 휴직의 복직 처리와 새 휴직 발령을 함께 진행한다. 이때 서류 제출 기한과 발령 방법은 시·도교육청 지침으로 확인한다. 허가 전에 이전 휴직 기간을 합산해 법정 한도를 넘는지 확인한다.","basis":"교육공무원 인사관리규정 제25조; 교육공무원법 제45조"},{"stage":"복귀·정산","when":"휴직 사유가 없어졌을 때 / 기간이 끝났을 때","who":"교사 본인 → 학교 → 교육지원청","what":"복직 신고","detail":"휴직 중 사유가 없어지면 30일 이내에 임용권자(임용제청권자)에게 신고하고 임용권자는 지체 없이 복직을 명한다. 기간이 끝난 뒤 30일 이내에 복귀 신고를 하면 당연히 복직된다. 복직원과 복직 사유 증빙을 내며, 임용일자는 소급할 수 없으므로 복직 희망일 전에 낸다. 사유 소멸 예: 연수·유학휴직 학업 중단·학위 조기 취득, 가족돌봄휴직 대상 가족 사망·치유, 동반휴직 배우자 귀국.","basis":"국가공무원법 제73조 제2항·제3항; 교육공무원임용령 제5조 제1항"},{"stage":"복귀·정산","when":"복직일","who":"행정실·교무부","what":"호봉 재획정과 승급기간 산입","detail":"휴직했던 사람은 복직일에 호봉을 재획정한다. 휴직 기간은 원칙적으로 승급기간에 넣지 않지만, 공무상 질병휴직은 승급 제한 대상이 아니고, 고용휴직(비상근은 50%)·유학휴직·노조전임·병역 등 법정의무 휴직은 산입한다. 가족돌봄휴직은 최초 90일을 산입하며 2026년 1월 1일 이후 최초로 휴직하는 사람부터 적용한다. 휴직 전 정기승급일을 확인해 호봉 오류를 막는다.","basis":"공무원보수규정 제9조 제2항·제14조 제1항 제1호·제15조 제1호·제4호·제5호·제6호의2, 부칙(대통령령 제36013호) 제3조"},{"stage":"복귀·정산","when":"동반휴직 2년 이상 뒤 복직할 때","who":"교사 본인","what":"복직 연수","detail":"동반휴직(10호) 또는 육아휴직(7호)으로 2년 이상 휴직한 교원은 복직하려면 연수를 받아야 한다. 교원 등의 연수에 관한 규정은 이를 복직하려는 교원 대상 직무연수로 정한다. 복직할 때 원래 학교로 돌아가는 것은 보장되지 않으며, 복직 학교는 시·도교육청 인사관리기준을 따른다.","basis":"교육공무원법 제45조 제3항; 교원 등의 연수에 관한 규정(복직 교원 직무연수); 소속 시·도교육청 인사관리기준"},{"stage":"이의·구제","when":"휴직이나 복직 관련 처분에 불복할 때","who":"교사 본인","what":"직권면직 주의와 소청심사","detail":"휴직기간이 끝나거나 사유가 소멸한 뒤에도 복귀하지 않거나 직무를 감당할 수 없으면 만료일(소멸일)로 소급해 직권면직될 수 있다. 본인 의사에 반하는 휴직·직권면직 같은 불리한 처분은 처분이 있음을 안 날부터 30일 이내에 교원소청심사위원회에 소청심사를 청구할 수 있다('징계·불리한 처분 불복' 항목 참고).","basis":"국가공무원법 제70조 제1항 제4호; 교육공무원임용령 제6조 제2호; 교원의 지위 향상 및 교육활동 보호를 위한 특별법 제9조 제1항; 교원소청심사위원회 '청구대상'"},{"stage":"사후 관리","when":"상시·감사 대비","who":"교감·교무부","what":"휴직자 관리와 점검 항목","detail":"학교는 휴·복직 서류가 사유에 맞게 갖춰졌는지(진단서 등), 복직 때 호봉 재획정을 했는지, 휴직 중 승급·봉급·수당이 잘못 처리되지 않았는지, 반기 실태 보고를 받았는지를 점검한다. 휴직 교원이 전보 대상이 되면 복직 처리와 전보의 순서, 전보내신 서류는 시·도교육청 인사관리기준을 따른다.","basis":"교육공무원 인사관리규정 제26조; 공무원보수규정 제9조·제14조·제28조; 소속 시·도교육청 인사관리기준"}],"deadlines":[{"what":"휴직원·복직원 제출","limit":"법령상 기한 없음 — 시·도교육청 지침(발령일 전, 임용일자 소급 불가)","basis":"교육공무원임용령 제5조 제1항; 소속 시·도교육청 지침"},{"what":"휴직기간 연장 신청","limit":"휴직기간 만료 15일 전까지","basis":"교육공무원 인사관리규정 제25조"},{"what":"휴직 사유 소멸 신고","limit":"사유가 없어진 날부터 30일 이내","basis":"국가공무원법 제73조 제2항"},{"what":"휴직기간 만료 후 복귀 신고","limit":"만료 후 30일 이내(신고하면 당연복직)","basis":"국가공무원법 제73조 제3항"},{"what":"휴직자 실태 보고","limit":"매 반기(6월 30일, 12월 31일). 휴직 시작 1개월 이내면 생략","basis":"교육공무원 인사관리규정 제26조"},{"what":"질병·난임휴직 기간","limit":"1년 이내, 부득이하면 1년 범위 연장(공무상 질병·부상은 3년 이내, 2년 범위 연장)","basis":"교육공무원법 제45조 제1항 제1호"},{"what":"가족돌봄휴직 기간","limit":"1년 이내, 재직기간 중 총 3년 초과 불가","basis":"교육공무원법 제45조 제1항 제8호"},{"what":"자율연수휴직 기간","limit":"1년 이내, 재직기간 중 한 차례(재직기간 10년 이상)","basis":"교육공무원법 제44조 제1항 제12호·제45조 제1항 제11호"}],"dont":["휴직 목적과 다르게 쓰지 않는다 — 부정한 방법으로 받은 봉급은 징수당하고 복직 명령·징계 사유가 될 수 있다(공무원보수규정 제28조 제3항)","휴직 중이라고 겸직허가 없이 영리업무를 하지 않는다 — 휴직자도 공무원 신분이라 영리업무 금지·겸직허가 규정이 똑같이 적용된다","사유가 끝났는데 30일 넘게 신고를 미루지 않는다 — 복귀하지 않으면 만료일·소멸일로 소급해 직권면직될 수 있다","다른 사유로 이어 휴직하면서 '연장'으로 처리하지 않는다 — 연장은 같은 사유의 기간을 늘리는 것이고, 다른 사유는 새 휴직이다","유학·고용·연수휴직을 학교 안에서만 약속하고 준비하지 않는다 — 임용권자가 교원 수급 등을 보고 허가하지 않을 수 있으므로 교육지원청에 먼저 문의한다","휴직을 앞두고 연가를 미리 당겨 쓰지 않는다 — 교원휴가에 관한 예규는 연도 중 휴직 예정자를 연가 미리쓰기 대상에서 뺀다","반기 실태 보고(6월 30일, 12월 31일)를 빠뜨리지 않는다 — 교육공무원 인사관리규정상 보고 의무다"],"contacts":[{"name":"소속 교육지원청 인사 담당","tel":"소속 교육지원청","note":"휴직원 서식·제출 기한, 발령 주체, 유학·고용·연수휴직 허가 가능 여부 문의"},{"name":"공무원연금공단","tel":"1588-4321","note":"공무상 요양 승인(공무상 질병휴직의 전제). 번호는 공단 대표번호"}],"forms":["휴직원·휴직 연장원·복직원 — 서식은 소속 시·도교육청이 정한 것을 쓴다","휴직자 실태 보고서 — 교육공무원 인사관리규정 별지 제1호서식","휴직 사유 증빙: 진단서(공무상이면 공무상 요양 승인 서류), 가족관계증명서·돌봄 필요 입증서류, 입학허가서, 고용계약서, 배우자 국외 근무·유학 증빙","자율연수휴직 연수계획서·결과보고서, 학교장 의견서·서약서 등 — 요구 여부와 서식은 시·도교육청마다 다르다","호봉획정 관련 서류(복직 때 행정실)"],"law":[{"name":"교육공무원법","article":"제44조(휴직)","point":"휴직 사유 12가지. 1~4호·11호는 직권휴직(반드시 명함), 7호·7의2·7의3호는 본인이 원하면 명해야 함, 나머지는 임용권자 판단"},{"name":"교육공무원법","article":"제45조(휴직기간 등)","point":"질병·난임 1년+1년, 공무상 3년+2년, 유학 3년(학위 3년 연장), 연수 3년, 가족돌봄 1년·재직 중 3년, 동반 3년+3년, 자율연수 1년·재직 중 1회. 육아·동반 2년 이상 휴직자는 복직 연수"},{"name":"국가공무원법","article":"제73조(휴직의 효력)","point":"신분은 보유하나 직무에 종사 못함. 사유 소멸 시 30일 이내 신고, 만료 후 30일 이내 복귀 신고하면 당연복직"},{"name":"공무원보수규정","article":"제28조, 제14조, 제15조","point":"질병·난임휴직 봉급 1년 이하 70%·1년 초과 50%, 공무상 전액, 유학·1년 이상 국외연수 50% 지급 가능, 그 밖의 휴직은 무급. 휴직 중 승급 제한과 승급기간 산입 예외(가족돌봄 최초 90일 등)"},{"name":"교육공무원임용령","article":"제5조, 제7조의4, 제19조, 제19조의4, 제6조","point":"임용일자 소급 금지, 병가+질병휴직 6개월 이상 결원보충, 질병휴직위원회 자문, 공무상 질병휴직은 공무상 요양 승인 받은 경우로 한정, 조부모·손자녀 돌봄 요건, 미복귀 직권면직 시 만료일·소멸일로 임용"},{"name":"교육공무원 인사관리규정(교육부훈령 제500호)","article":"제24조~제26조, 별지 제1호서식","point":"청원휴직 허가 심사기준, 연장은 만료 15일 전 신청, 반기별 휴직자 실태 보고"},{"name":"교원휴가에 관한 예규(교육부예규 제104호)","article":"제4조 제6항","point":"연가 미리쓰기 대상에서 연도 중 휴직·퇴직 예정자 제외"}],"deep":[{"title":"직권휴직과 청원휴직 — 허가가 '당연'인지부터 다르다","body":["질병(1호)·병역(2호)·생사불명(3호)·법정의무 수행(4호)·노조전임(11호)은 요건이 되면 본인 의사와 관계없이 휴직을 명해야 한다. 육아(7호)·입양(7의2호)·난임(7의3호)은 본인이 원하면 명해야 한다.","나머지(유학·고용·연수·가족돌봄·동반·자율연수)는 임용권자가 교육과정 운영, 교원 수급, 소요 예산, 휴직 목적 적합성, 복직 후 교육발전 기여 가능성 등을 종합한 자체 심사기준으로 허가 여부를 정할 수 있다. 그래서 특히 유학·고용·연수휴직은 시·도교육청마다 허가 폭이 다르므로 준비 전에 교육지원청에 가능 여부를 묻는다."],"basis":"교육공무원법 제44조 제1항; 교육공무원 인사관리규정 제24조"},{"title":"휴직 중 돈 — 봉급과 수당","body":["질병휴직과 난임휴직은 휴직 기간 1년 이하 봉급 70%, 1년 초과 2년 이하 50%를 받는다. 공무상 질병·부상 휴직은 전액이다. 외국 유학이나 1년 이상 국외연수 휴직은 봉급 50%를 지급할 수 있는데, 지급 기간을 2년으로 제한하는 규정은 교육공무원에게는 적용하지 않는다. 그 밖의 휴직(가족돌봄·동반·자율연수·연수·고용 등)은 봉급이 없다.","수당은 공무원수당 등에 관한 규정과 공무원보수 등의 업무지침에서 수당마다 휴직 중 지급 여부와 비율을 따로 정한다. 휴직 목적과 달리 부정한 방법으로 받은 봉급은 징수당하므로, 휴·복직 발령이 나면 급여 담당에게 바로 알려 지급을 바로잡는다."],"basis":"공무원보수규정 제28조; 공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026) 휴직기간 중 봉급감액"},{"title":"가족돌봄휴직과 가족돌봄휴가는 다르다","body":["가족돌봄휴가는 국가공무원 복무규정의 특별휴가로, 자녀 행사·병원 동행이나 가족 질병·사고 때 일·시간 단위로 쓰는 짧은 휴가다. 가족돌봄휴직(예전 '간병휴직', 지방공무원 자료의 '가사휴직')은 교육공무원법 제44조 제1항 제9호의 휴직으로 1년 이내, 재직 중 총 3년까지이며 무급이다.","조부모·손자녀를 돌보는 휴직은 본인 외에 돌볼 가족이 없거나 다른 가족이 질병·고령·장애·미성년으로 돌볼 수 없을 때만 가능하다. 승급기간은 2026년 1월 1일 이후 최초로 휴직한 사람부터 최초 90일을 산입한다. 신청서 양식(돌봄 계획 기재 등)은 시·도교육청마다 다르다."],"basis":"교육공무원법 제44조 제1항 제9호·제45조 제1항 제8호; 교육공무원임용령 제19조의4; 공무원보수규정 제15조 제6호의2·부칙 제3조"},{"title":"자율연수휴직 — 10년 이상 재직, 평생 한 번","body":["공무원연금법상 재직기간 10년 이상인 교원이 자기개발 학습·연구를 위해 1년 이내로 쓰며 재직 중 한 차례만 가능하다. 무급이고 승급기간에도 들어가지 않는다.","연수계획서, 학교 의견 절차, 결과보고서 제출, 복직 학교 배정 같은 운영 방식은 시·도교육청 지침으로 정하므로 신청 전에 확인한다. 해외에서 학습·연구하려면 휴직 목적에 맞는지와 소재·연락 보고 방법을 미리 확인해 둔다."],"basis":"교육공무원법 제44조 제1항 제12호·제45조 제1항 제11호; 공무원보수규정 제14조"}],"tables":[{"title":"휴직 종류별 기간·봉급·승급(육아휴직 제외)","head":["종류(교육공무원법 제44조 제1항)","구분","기간","봉급","승급기간 산입"],"rows":[["질병휴직(1호)","직권","1년 이내, 부득이하면 1년 연장","1년 이하 70%, 1년 초과 50%","미산입"],["공무상 질병휴직(1호, 공무상 요양 승인)","직권","3년 이내, 의학적 소견 등으로 2년 연장","전액","승급 제한 대상 아님"],["난임휴직(7의3호)","본인 원하면 명함","1년 이내, 부득이하면 1년 연장","1년 이하 70%, 1년 초과 50%","미산입"],["유학휴직(5호)","청원","3년 이내, 학위취득 시 3년 연장","50% 지급 가능(교육공무원은 2년 제한 미적용)","산입"],["고용휴직(6호)","청원","고용기간","없음","산입(비상근은 50%)"],["연수휴직(8호)","청원","3년 이내","없음","미산입"],["가족돌봄휴직(9호)","청원","1년 이내, 재직 중 총 3년","없음","최초 90일 산입(2026.1.1. 이후 최초 휴직자부터)"],["동반휴직(10호)","청원","3년 이내, 3년 연장(배우자 국외 기간 초과 불가)","없음","미산입"],["자율연수휴직(12호)","청원(재직 10년 이상)","1년 이내, 재직 중 1회","없음","미산입"],["병역(2호)·법정의무(4호)·노조전임(11호)","직권","복무·전임 기간","없음","산입"]],"note":"기간은 교육공무원법 제45조, 봉급은 공무원보수규정 제28조, 승급은 같은 규정 제14조·제15조. 육아·입양휴직은 '육아휴직' 항목 참고."}],"faq":[{"q":"병가를 다 썼는데 아직 치료가 더 필요해요. 바로 질병휴직인가요?","a":"병가(연 60일)로 치료가 끝나지 않아 직무를 할 수 없으면 질병휴직(교육공무원법 제44조 제1항 제1호)을 신청한다. 휴직 예정자는 연가 미리쓰기 대상에서 빠지므로(교원휴가에 관한 예규 제4조 제6항) 연가를 당겨 쓰는 대신 휴직 시기를 학교와 정한다. 병가와 이어지는 질병휴직이 합쳐 6개월 이상이면 결원 보충(기간제교사 채용)이 가능하다(교육공무원임용령 제7조의4)."},{"q":"학습연구년도 휴직으로 신청하나요?","a":"아니다. 흔히 학습연구년이라 부르는 것은 교육공무원법 제40조의 특별연수로, 제44조의 휴직과 다른 제도다. 휴직원을 내는 대상이 아니므로 시·도교육청 선발 공고를 따로 확인한다. 반대로 자율연수휴직(12호)은 무급 휴직이다."},{"q":"휴직이 끝나면 원래 학교로 돌아가나요?","a":"보장되지 않는다. 복직 학교는 시·도교육청 인사관리기준에 따라 정해지고, 휴직 기간이나 종류에 따라 다른 학교로 복직하는 경우가 있다. 휴직 전에 소속 교육청 기준을 확인한다."},{"q":"가족돌봄휴직 중에 잠깐 해외여행을 가도 되나요?","a":"가족돌봄휴직은 가족을 돌보라고 허가한 휴직이다. 돌봄 대상자를 두고 휴직자만 출국하는 등 돌봄을 하지 않으면 휴직 사유가 없어진 것으로 보아 복직해야 할 수 있고, 목적 외 사용은 봉급 징수·징계로 이어질 수 있다(국가공무원법 제73조, 공무원보수규정 제28조 제3항). 출국 전에 학교·교육지원청에 문의한다."},{"q":"연수휴직이나 휴직 중에 강의·과외를 해도 되나요?","a":"휴직자도 공무원 신분이라 영리업무 금지와 겸직허가 규정이 똑같이 적용되고, 교원의 과외는 재직·휴직 중 모두 금지다. 겸직은 휴직 목적에 지장이 없는 범위에서 소속 기관장이 허가할 수 있으니 겸직 내용·기간·수익을 적어 미리 허가를 받는다('겸직' 항목 참고)."},{"q":"휴직 기간을 늘리고 싶어요. 언제까지 말해야 하나요?","a":"같은 사유로 법정 기간 안에서 연장하려면 만료 15일 전까지 신청한다(교육공무원 인사관리규정 제25조). 다른 사유로 이어서 휴직하려면 새 휴직이라 시·도교육청이 정한 기한에 맞춰 서류를 내야 한다. 학교 업무 배정 때문에 실제로는 더 일찍 알리는 것이 좋다."}],"record":"휴·복직은 인사발령 사항이라 개인 근무상황 신청이 아니라 임용권자(또는 위임받은 교육장·학교장)의 발령과 보고 공문으로 처리하고, 나이스 교원인사에서 발령을 등록한다. 발령일은 소급할 수 없으므로 해당일에 시행하는 것이 원칙이다. 발령 내용은 급여 담당에게 바로 알려 봉급·수당이 맞게 지급되게 한다. 같은 사유로 기간을 늘리면 휴직연장으로, 다른 사유로 이어서 휴직하면 이전 휴직을 복직 처리한 뒤 새 휴직으로 발령하는 것이 기본이며, 나이스 처리 요령은 시·도교육청 안내를 따른다.","sources":[{"title":"교육공무원법(시행 2026.2.15.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"교육공무원임용령(시행 2025.9.19.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원임용령"},{"title":"국가공무원법(시행 2026.6.2.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원법"},{"title":"공무원보수규정(시행 2026.8.1.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/공무원보수규정"},{"title":"교육공무원 인사관리규정(교육부훈령 제500호, 시행 2024.12.10.)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육공무원인사관리규정"},{"title":"교원소청심사위원회 — 청구대상(휴직·직권면직 포함)","publisher":"교원소청심사위원회","year":2026,"url":"https://www.ace.go.kr/act/o_request_object.do"},{"title":"교육공무원 인사관리규정 별지 제1호서식 휴직자 실태 보고서","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/LSW/flDownload.do?flSeq=146379185"},{"title":"교원휴가에 관한 예규(교육부예규 제104호, 시행 2026.2.27.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원휴가에관한예규"},{"title":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026.8.1. 시행)","publisher":"인사혁신처","year":2026,"url":"https://www.law.go.kr/행정규칙/공무원보수등의업무지침"}],"verified":"2026-09-29","uncertain":["교육부 「교원 휴직 업무 처리 안내」(매뉴얼) 원문은 찾지 못해 법령·교육부훈령과 인사혁신처 보수지침으로 전국 기준을 썼다","질병휴직 중 수당별 지급 비율은 공무원수당 등에 관한 규정과 보수업무지침 원문을 수당마다 대조하지 못했다","다른 시·도교육청의 휴직원 제출 기한·학기 단위 운영 기준은 확인하지 않았다(교육청마다 다르다고만 적음)"],"related":["parental-leave","leave-sick","salary-step","transfer","side-job","discipline-appeal"]},{"id":"vacation-duty","title":"방학 중 복무 — 교육공무원법 제41조 연수, 근무 편성, 연가, 공무외 국외여행·국외자율연수","aka":["41조 연수","41조","근무지외 연수","근무지 외 연수","방학 중 근무","방학 근무조","방학 출근","방학 중 복무","방학 해외여행","공무외 국외여행","국외자율연수","해외 자율연수","방학 연가","방학 중 방과후 끝나고 퇴근","여름방학 복무","겨울방학 복무","방학 중 대학원","자율연수 계획서","41조 결과보고서"],"category":"출장·근무","urgency":"미리 신청","roles":["교사 본인","교무부(방학 계획·근무 편성)","교감(복무 결재)","학교장(41조 연수 승인권자)","행정실(수당 담당)"],"summary":"방학은 학생의 수업과 등교가 멈추는 휴업일일 뿐 교원의 휴가가 아니므로, 출근하지 않으려면 교육공무원법 제41조에 따른 근무지 외 연수 승인이나 연가 등 정당한 복무 처리가 있어야 한다. 제41조 연수는 수업에 지장이 없는 범위에서 소속 학교장의 승인을 받아 연수기관이나 근무장소 밖에서 하는 연수이며, 교육부는 이 연수를 단축근무나 조기퇴근의 방편으로 쓰면 안 된다고 회신했다. 해외에 나갈 때 견문·가족여행 같은 개인 여행은 휴가일수 범위의 연가로 하고, 제41조에 따른 공무외 국외여행(국외자율연수)은 휴가와 별도로 할 수 있되 인정범위와 절차는 교육감이 정한다(교원휴가에 관한 예규 제4조 제5항). 학교는 방학 계획을 세우면서 공문 처리와 학생 지도 등 근무를 편성하고, 학교장의 근무명령으로 출근한 날은 정규 근무일로 본다.","first":["우리 학교 방학 계획(방학 중 교육활동 계획, 근무 편성표, 방과후·보충수업 일정)에서 내가 출근해야 하는 날을 먼저 확인한다","출근하지 않는 날마다 무엇으로 처리할지 정한다 — 교재연구·자료수집·연수는 제41조 연수, 사적인 일은 연가·조퇴","제41조 연수는 연수 목적·장소가 드러나게 계획을 세워 나이스로 미리 상신하고 학교장 승인을 받는다. 상신 단위(주·월)는 학교장이 안내한 방법을 따른다","해외에 나가면 목적부터 가른다: 견문·취미·가족여행은 연가(비고란에 '공무외 국외여행'과 방문 국가), 연수·학습자료 수집은 국외자율연수로 소속 시·도교육청이 정한 계획서·절차를 따른다","방학 중 방과후 수업을 하는 날 수업만 하고 일찍 가려면 남은 시간을 조퇴·반일연가 등으로 처리한다. 제41조 연수를 조기퇴근 수단으로 쓰지 않는다","방학 중에도 비상연락이 되게 연락처를 교무부에 남긴다"],"steps":[{"stage":"미리 확인","when":"방학 전","who":"교사 본인","what":"방학의 법적 의미 확인","detail":"하계·동계·학기말 방학 같은 휴업일은 학생의 수업과 등교가 멈추는 날이지 국가공무원 복무규정상 휴가가 아니다. 그래서 방학에 출근하지 않으려면 제41조 연수 승인이나 연가 같은 복무 처리가 있어야 한다. 학교 휴업일은 학교장이 학교운영위원회 심의를 거쳐 정한다. 휴업일 연가는 사유를 적지 않는 등 교원휴가에 관한 예규가 휴업일을 따로 다룬다.","basis":"초·중등교육법 시행령 제47조; 국가공무원 복무규정 제9조; 교원휴가에 관한 예규 제5조 제3항; 교육공무원법 제41조"},{"stage":"미리 확인","when":"방학식 전","who":"교무부 → 교사","what":"방학 계획과 근무 편성 확인","detail":"법령에 방학 중 출근 일수를 정한 조문은 없고, 학교가 방학 계획을 세우면서 공문 처리·학생 지도·교내 안전 등 근무를 편성한다. 교사는 방학 교육활동 계획, 방과후·보충수업 일정, 비상연락망, 근무 편성표를 확인하고, 해외에 나갈 계획이 있으면 학교가 안내하는 공무외 국외여행 절차를 챙긴다.","basis":"교육공무원법 제41조; 공무원보수 등의 업무지침(2026) 시간외근무수당 정액분(방학 중 근무명령 출근)"},{"stage":"신청·보고","when":"연수 시작 전","who":"교사 본인","what":"제41조 연수 계획과 나이스 상신","detail":"교재연구, 학습자료 수집, 교원 능력개발 등은 제41조 연수를 활용한다. 연수의 장소와 목적이 드러나게 적어 나이스 복무로 미리 신청하고 학교장 승인(결재)을 받는다. 교육부 회신에 따르면 시간 단위 사용 여부는 법 취지에 반하지 않는 범위에서 학교 여건을 고려해 학교장이 판단할 사항이지만, 단축근무·조기퇴근의 방편으로는 쓸 수 없다.","basis":"교육공무원법 제41조; 교육부 교원양성연수과 '교육공무원법 제41조 사용 관련 질의 회신'(2022)"},{"stage":"결재·승인","when":"상신 뒤","who":"학교장(위임전결 시 교감)","what":"승인 판단","detail":"제41조 연수의 승인권자는 소속 기관의 장인 학교장이다. 법은 '수업에 지장을 주지 아니하는 범위'를 조건으로 두므로 학기 중 수업일이 아니라 사실상 휴업일에 쓰는 제도다. 학교장은 연수 목적과 계획이 연수로서 타당한지 보고 승인하며, 세부 승인 기준은 시·도교육청 복무 지침을 따른다.","basis":"교육공무원법 제41조; 소속 시·도교육청 교원 복무 지침"},{"stage":"신청·보고","when":"방학 중 휴가를 쓸 때","who":"교사 본인","what":"연가 신청(휴업일)","detail":"휴업일 중 연가(반일연가 포함)는 나이스에 사유를 적지 않고 신청한다. 연가로 해외에 나가는 경우는 비고란에 '공무외 국외여행'과 방문 국가명 등을 적어 긴급 시 소재 파악과 비상연락이 되게 한다. 공무외 국외여행도 휴가일수 범위 안에서 하며, 본인 해외 신혼여행은 특별휴가(결혼) 기간을 쓴다. 행정기관의 장은 공무외 국외여행에 불필요한 규제를 할 수 없고, 여행자는 여행 중 연락 가능한 전화번호를 미리 공유한다.","basis":"교원휴가에 관한 예규 제5조 제3항; 교육부 '교원 휴가 관련 질의·답변 자료집(제1-1판, 2022.7.)' 질의5; 국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 2026) 제8장 7. 공무외의 국외여행"},{"stage":"신청·보고","when":"국외자율연수 출국 전","who":"교사 본인 → 학교장","what":"국외자율연수(제41조 공무외 국외여행) 신청","detail":"제41조에 따른 공무외 국외여행(국외자율연수)은 국가공무원 복무규정의 휴가와 별도로 할 수 있고, 인정범위와 절차는 교육감이 정한다. 그래서 어떤 여행을 국외자율연수로 인정하는지, 계획서 서식, 증빙(초청장·연수 일정표 등), 신청 방법(서면·나이스), 결과보고서 제출 여부는 소속 시·도교육청 지침을 확인한다. 허가 절차를 마친 뒤 출국하는 것이 기본이다.","basis":"교원휴가에 관한 예규 제4조 제5항; 교육공무원법 제41조; 소속 시·도교육청 공무외 국외여행 업무처리 지침"},{"stage":"사용·이행","when":"방학 중 방과후·보충수업이 있는 날","who":"교사 본인","what":"수업 뒤 퇴근 처리","detail":"방학 중 수업 등으로 출근한 날 근무시간 전에 퇴근하려면 조퇴·반일연가 등 복무 처리를 한다. 교육부는 제41조 연수를 단축근무·조기퇴근의 방편으로 쓰면 안 된다고 회신했고, 허가 없이 근무지를 떠나면 직장 이탈 금지 위반이 된다. 제41조 연수 시간과 방과후 수업 시간이 겹치게 신청하지 않는다.","basis":"국가공무원법 제58조(직장 이탈 금지); 교육부 제41조 질의 회신(2022)"},{"stage":"사용·이행","when":"방학 중 학생을 지도할 때","who":"교사 본인 → 학교장","what":"학생 지도는 학교 계획·학교장 승인으로","detail":"방학 중 방과후학교·동아리·보충수업 같은 학생 지도는 학교 교육계획과 학교장 승인에 따라 한다. 방과후·동아리 지도를 마친 뒤의 복무는 학교장이 정한 방법을 따르고, 학교 밖에서 공무로 학생을 지도하면 출장 처리 여부를 미리 확인한다('출장' 항목 참고).","basis":"교육공무원법 제41조; 소속 시·도교육청 교원 복무 지침"},{"stage":"사용·이행","when":"근무 편성일","who":"교사 본인","what":"근무일 출근","detail":"방학 중 학교장의 근무명령에 따라 특별히 출근해 복무규정상 근무시간 이상 근무한 날은 정규 근무일로 본다. 근무일에 개인 일이 생기면 연가·조퇴 등으로 처리하고, 근무를 바꾸려면 교무부와 미리 조정한다.","basis":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026) 시간외근무수당 정액분"},{"stage":"복귀·정산","when":"국외자율연수·국외여행 뒤","who":"교사 본인","what":"결과 보고와 기록","detail":"국내 제41조 연수의 결과 보고는 법령에 정한 서식이 없으므로 학교장이 정한 방식을 따르고, 국외자율연수 보고서 제출 여부는 시·도교육청 지침을 따른다. 일정이 바뀌어 기간을 늘려야 하면 늘어난 기간을 휴가일수 범위의 연가(공무외 국외여행)로 따로 신청한다.","basis":"교원휴가에 관한 예규 제4조 제5항; 소속 시·도교육청 공무외 국외여행 업무처리 지침"},{"stage":"복귀·정산","when":"방학이 낀 달의 급여","who":"행정실(수당 담당)","what":"시간외근무수당 정액분 확인","detail":"시간외근무수당 정액분은 정규 근무일 기준으로 월간 출근(또는 출장) 근무일수가 15일 이상이면 월 10시간분을 주고, 15일에 못 미치면 모자라는 하루마다 15분의 1씩 줄인다. 방학·연가 등으로 근무하지 않은 날은 출근일수에서 빠지지만, 방학 중 학교장 근무명령으로 출근해 근무시간을 채운 날은 출근일로 넣는다. 인사혁신처 지침은 12월 18일에 방학한 학교 교원의 12월 출근일이 13일이면 10시간분에서 15분의 2를 줄인다는 예시를 든다.","basis":"공무원수당 등에 관한 규정 제15조 제6항; 공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026) 시간외근무수당 정액분"},{"stage":"사후 관리","when":"공무로 해외에 갈 때","who":"교사 본인·주관 부서","what":"공무국외출장과 구분","detail":"공무 수행·직무 관련으로 국외에 가는 것은 제41조 연수가 아니라 공무국외출장이다. 공무국외출장은 계획서를 내 허가를 받고 귀국 뒤 결과보고서를 내며, 허가권자와 제출 기한은 시·도교육청 공무국외출장 규정을 따른다('출장' 항목 참고).","basis":"국가공무원 복무·징계 관련 예규(2026) 제7장 공무국외출장; 소속 시·도교육청 공무국외출장 규정"}],"deadlines":[{"what":"제41조 연수 승인","limit":"연수 시작 전 나이스 상신·학교장 승인","basis":"교육공무원법 제41조"},{"what":"국외자율연수 신청","limit":"출국 전 시·도교육청이 정한 절차로 신청·허가","basis":"교원휴가에 관한 예규 제4조 제5항; 소속 시·도교육청 지침"},{"what":"공무외 국외여행(연가) 기간","limit":"국가공무원 복무규정상 휴가일수 범위 안","basis":"교원휴가에 관한 예규 제4조 제5항; 국가공무원 복무·징계 관련 예규 제8장"},{"what":"시간외근무수당 정액분 기준","limit":"월 출근(출장) 근무일 15일 이상이면 월 10시간분, 미달 1일마다 15분의 1 감액(방학은 출근일에서 제외, 근무명령 출근일은 포함)","basis":"공무원보수 등의 업무지침(2026)"}],"dont":["제41조 연수를 단축근무·조기퇴근의 방편으로 쓰지 않는다 — 교육부가 회신으로 명시했다","방학이라고 아무 신청 없이 출근하지 않는 날을 만들지 않는다 — 방학은 교원의 휴가가 아니어서 무단결근·직장이탈이 된다","방학 중 방과후 수업만 하고 조퇴·연가 처리 없이 바로 퇴근하지 않는다 — 허가 없는 직장 이탈이 된다(국가공무원법 제58조)","제41조 연수 시간과 방과후 수업 시간을 겹쳐 신청하지 않는다","견문·취미·가족여행을 국외자율연수로 신청하지 않는다 — 개인 여행은 휴가일수 범위 안의 공무외 국외여행(연가)이다","국외자율연수 허가가 나기 전에 출국하지 않는다 — 인정범위와 절차는 교육감이 정하므로 시·도교육청 절차를 마친 뒤 떠난다","수업일(학기 중)에 제41조 연수를 끼워 쓰지 않는다 — 수업에 지장이 없는 범위의 연수여서 사실상 휴업일에 쓰는 제도다"],"contacts":[],"forms":["국외자율연수(제41조 공무외 국외여행) 계획서 — 서식은 소속 시·도교육청 지침을 따른다","방학 중 교육활동 계획·근무 편성표 — 학교 방학 계획","초청장·연수 일정표 등 국외자율연수 증빙"],"law":[{"name":"교육공무원법","article":"제41조(연수기관 및 근무장소 외에서의 연수)","point":"교원은 수업에 지장을 주지 아니하는 범위에서 소속 기관의 장의 승인을 받아 연수기관이나 근무장소 외의 시설 또는 장소에서 연수를 받을 수 있다"},{"name":"교원휴가에 관한 예규(교육부예규 제104호)","article":"제4조 제5항, 제5조 제3항","point":"제41조에 따른 공무외 국외여행은 휴가와 별도로 할 수 있고 인정범위·절차는 교육감이 정함. 휴업일 연가는 사유를 적지 않음"},{"name":"국가공무원법","article":"제58조(직장 이탈 금지)","point":"소속 상관의 허가나 정당한 사유 없이 직장을 이탈하지 못함 — 신청 없는 방학 중 불출근·조기퇴근의 문제"},{"name":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호)","article":"제8장 7. 공무외의 국외여행","point":"행정기관의 장은 공무외 국외여행에 불필요한 규제를 할 수 없음, 여행 중 연락 가능한 번호를 사전에 공유"},{"name":"공무원보수 등의 업무지침(인사혁신처예규 제220호)","article":"시간외근무수당 정액분","point":"방학은 월간 출근일수에서 제외, 방학 중 학교장 근무명령으로 근무시간 이상 근무한 날은 정규 근무일로 간주"}],"deep":[{"title":"제41조 연수는 '쉬는 날'을 만드는 조항이 아니다","body":["제41조는 교원이 연수기관이나 근무장소 밖에서 연수를 받을 수 있게 한 조항이다. 방학이라는 이유만으로 출근 의무가 사라지지 않고, 학교장이 승인한 연수를 할 때만 근무장소 밖에 있을 수 있다.","그래서 연수 목적이 분명해야 한다. 사적인 일처리는 조퇴·연가를, 교재연구·학습자료 수집·교원능력개발은 제41조 연수를 쓴다. 교육부는 시간 단위 사용은 학교장 판단에 맡기되 단축근무·조기퇴근 방편으로 쓰면 안 된다고 회신했다."],"basis":"교육공무원법 제41조; 교육부 제41조 질의 회신(2022)"},{"title":"해외에 나갈 때 — 연가냐 국외자율연수냐","body":["본인·친인척 경조사, 질병 치료, 친지 방문, 견문, 취미, 가족 여행은 휴가일수 범위 안의 공무외 국외여행이다. 연가(또는 해당 특별휴가)로 나이스 결재를 받고 비고란에 '공무외 국외여행'과 방문 국가를 적는다.","제41조에 따른 공무외 국외여행(국외자율연수)은 휴가와 별도로 할 수 있지만, 무엇을 인정하고 어떤 절차를 밟는지는 교육감이 정한다(교원휴가에 관한 예규 제4조 제5항). 보통 연수 목적이 드러나는 계획서와 증빙을 내고 학교장 허가를 받는 방식이지만 서식·보고서 여부는 교육청마다 다르다.","행정기관의 장은 공무외 국외여행에 불필요한 규제를 할 수 없고, 여행자는 출입국·통관 관련 법령을 지키며 여행 중 연락 가능한 번호를 미리 공유한다(국가공무원 복무·징계 관련 예규)."],"basis":"교원휴가에 관한 예규 제4조 제5항·제5조 제3항; 국가공무원 복무·징계 관련 예규(2026) 제8장 7; 교육부 휴가 질의·답변 자료집(2022) 질의5"},{"title":"방학 중 근무 편성과 수당","body":["법령에 방학 중 출근 일수를 정한 조문은 없다. 학교가 방학 계획을 세우면서 공문 처리·학생 지도·교내 안전 근무를 편성한다.","학교장의 근무명령으로 방학 중 특별히 출근해 근무시간 이상 근무한 날은 정규 근무일로 보아 시간외근무수당 정액분 출근일수에 넣는다. 방학·연가처럼 근무하지 않은 날은 출근일수에서 빠지므로 방학이 낀 달은 정액분이 줄어들 수 있다."],"basis":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026) 시간외근무수당 정액분"}],"tables":[{"title":"방학 중 하루를 어떻게 처리할까","head":["상황","처리","승인","주의"],"rows":[["근무 편성일·학교장 근무명령","출근(정규 근무일로 봄)","—","개인 일은 조퇴·연가로"],["교재연구·자료수집·연수(국내)","교육공무원법 제41조 연수","학교장 사전 승인(나이스)","단축근무·조기퇴근 방편 금지"],["방과후 수업 뒤 일찍 퇴근","조퇴·반일연가 등","학교장","제41조 연수와 수업 시간 겹치지 않게"],["개인 용무·국내 여행","연가(휴업일은 사유 미기재)","학교장","연가일수 범위"],["해외 견문·취미·가족여행","연가 + 비고란 '공무외 국외여행'","학교장","방문 국가·비상연락처 기록"],["교직단체 국외연수·해외 초청 연수·자료수집","국외자율연수(제41조 공무외 국외여행)","시·도교육청 지침에 따른 신청·허가","허가 뒤 출국, 보고서 여부는 교육청마다 다름"],["공무로 해외 파견·출장","공무국외출장","시·도교육청 규정의 허가권자","귀국 후 결과보고서"]],"note":"출처: 교육공무원법 제41조, 교원휴가에 관한 예규 제4조·제5조, 교육부 제41조 질의 회신(2022), 국가공무원 복무·징계 관련 예규(2026), 공무원보수 등의 업무지침(2026)."}],"faq":[{"q":"방학인데 꼭 학교에 나와야 하나요?","a":"근무 편성일이나 학교장 근무명령이 있는 날은 출근한다. 그 밖의 날도 방학은 교원의 휴가가 아니므로 제41조 연수 승인이나 연가 같은 복무 처리가 있어야 출근하지 않을 수 있다. 아무 처리 없이 나오지 않으면 무단결근이 된다."},{"q":"제41조 연수를 몇 시간 단위로 쓸 수 있나요?","a":"교육부 회신(2022)은 시간 단위 사용 여부를 법 취지에 반하지 않는 범위에서 학교 여건을 고려해 학교장이 판단할 사항이라고 했다. 다만 단축근무나 조기퇴근의 방편으로 쓰면 안 된다."},{"q":"방학 때 가족과 해외여행을 가요. 41조로 신청해도 되나요?","a":"안 된다. 견문·취미·가족 여행은 휴가일수 범위 안의 공무외 국외여행이므로 연가로 신청하고 비고란에 '공무외 국외여행'과 방문 국가를 적는다. 제41조 국외자율연수는 연수 목적이 있어야 하고 인정범위는 교육감이 정한다."},{"q":"방학 중 연가를 쓸 때 사유를 적어야 하나요?","a":"휴업일 연가는 나이스에 사유를 적지 않는다(교원휴가에 관한 예규 제5조 제3항). 다만 해외에 나가면 긴급 시 소재 파악을 위해 비고란에 '공무외 국외여행'과 방문 국가명을 적는다(교육부 휴가 질의·답변 자료집)."},{"q":"방학이 낀 달에 시간외근무수당이 줄었어요. 왜 그런가요?","a":"시간외근무수당 정액분은 그 달 정규 근무일 기준 출근일이 15일 이상이어야 10시간분을 다 받고, 모자라는 하루마다 15분의 1씩 줄어든다. 방학·연가 날은 출근일에서 빠지고, 학교장 근무명령으로 출근해 근무시간을 채운 날은 들어간다(공무원보수 등의 업무지침)."},{"q":"국외자율연수 다녀와서 보고서를 내야 하나요?","a":"제41조 공무외 국외여행의 절차는 교육감이 정하므로 보고서 제출 여부는 시·도교육청마다 다르다. 국내 제41조 연수 결과 보고는 학교장이 정한 방식을 따른다."}],"record":"나이스 복무에서 개인근무상황을 신청한다. 제41조 연수는 근무상황 종별을 '교육공무원법 제41조 연수'로 해 연수 장소·목적을 적고 사전에 학교장(위임전결 시 교감) 결재를 받는다. 국외자율연수도 같은 종별로 결재받되 시·도교육청이 정한 계획서를 따로 낸다. 휴업일 연가는 사유를 적지 않고, 해외여행이면 비고란에 '공무외 국외여행'·방문 국가를 적는다.","sources":[{"title":"「교육공무원법」 제41조 사용 관련 질의에 대한 회신(교육부 교원양성연수과)","publisher":"경상남도교육청 중등교육과 게시","year":2022,"url":"https://www.gne.go.kr/user/bbs/BD_selectBbs.do?q_bbsSn=1464&q_bbsDocNo=1450020"},{"title":"교원휴가에 관한 예규(교육부예규 제104호, 시행 2026.2.27.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원휴가에관한예규"},{"title":"교육공무원법(시행 2026.2.15.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 2026.6.23.) 제8장 7. 공무외의 국외여행","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/국가공무원복무·징계관련예규"},{"title":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026.8.1. 시행) 시간외근무수당 정액분","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/공무원보수등의업무지침"}],"verified":"2026-09-29","uncertain":["다른 시·도교육청의 국외자율연수(제41조 공무외 국외여행) 지침은 확인하지 않았다 — 인정범위·서식·보고서 여부가 교육청마다 다를 수 있다","제41조 연수를 나이스에 주 단위·월 단위 중 어떻게 상신할지는 공식 기준을 찾지 못했다(학교장이 정한 방법)","나이스 복무 메뉴의 정확한 경로와 근무상황 종별 명칭은 화면으로 확인하지 못했다"],"related":["leave-annual","business-trip","leave-special","side-job","leave-of-absence"]},{"id":"business-trip","title":"출장(관내·관외)과 여비 정산 — 신청·결재부터 자가용·체험학습 인솔까지","aka":["출장","관내출장","관외출장","근무지내 출장","근무지외 출장","출장비","여비","여비 정산","출장 4시간","4시간 미만 출장","자가용 출장","자차 출장","주유비","연수 출장","체험학습 인솔","수학여행 인솔 출장","나이스 출장","출장 신청","출장 복명","숙박비 한도"],"category":"출장·근무","urgency":"미리 신청","roles":["교사 본인","복무 담당(교무부)","교감","학교장(출장명령권자)","행정실(여비 지급·정산)"],"summary":"출장은 상사의 명을 받아 정규 근무지 밖에서 공무를 수행하는 것이고, 공무와 무관한 일은 출장으로 처리할 수 없다. 출발 전에 나이스 [복무]-[개인출장관리]에서 신청해 학교장(출장명령권자) 결재를 받는다. 같은 시·군 안이거나 왕복 12km 미만이면 근무지내 출장으로 4시간 미만 1만원, 4시간 이상 2만원을 정액으로 받고(하루 합계 2만원 한도), 그 밖은 근무지외 출장으로 운임·일비·식비·숙박비를 받는다. 근무지외 출장의 운임과 숙박비는 여행을 마친 다음 날부터 2주일 안에 증빙을 갖춰 정산을 신청한다. 자가용은 원칙적으로 대중교통 운임만 받고, 공무상 부득이한 경우에만 연료비·통행료를 받는다.","first":["먼저 이 일이 공무인지 확인한다. 교원단체 체육대회 선수 참가, 개인적인 경조사·이취임식 참석, 대학원 강의 수강은 출장이 아니다(예규 사례)","출발 전에 나이스 [복무]-[개인출장관리]-[신청]에서 출장을 올리고 학교장 결재가 완결됐는지 확인한다. 결재 없이 나가면 근무지 이탈이 된다","근무지내인지 근무지외인지 가른다. 같은 시·군 안이면 12km가 넘어도 근무지내이고, 다른 시·군이라도 왕복 12km 미만이면 근무지내다","자가용을 쓸 생각이면 '공무상 부득이한 사유'에 해당하는지 미리 따진다. 해당하지 않으면 대중교통 요금만 나온다. 통행 영수증·출장지 주유 영수증·주차 영수증을 챙긴다","근무지외 출장은 숙박비·운임을 신용카드(정부구매카드)로 결제하고 영수증을 모은다. 돌아온 다음 날부터 2주일 안에 행정실에 정산을 신청한다","돌아오면 지체 없이 학교장에게 결과를 보고한다(경미하면 말로 가능)"],"steps":[{"stage":"미리 확인","when":"출장을 생각할 때","who":"교사 본인","what":"공무 관련성 확인","detail":"출장은 상사의 명에 의해 정규 근무지 밖에서 공무를 수행하는 것이다. 출장명령권자인 학교장이 업무 관련성과 출장 목적을 보고 판단한다. 예규 사례상 교원단체 주최 체육행사 선수 참가, 친분에 따른 이취임식·경조사 개인 참석, 대학원 수강, 개인 자원봉사는 출장이 안 된다. 반대로 같은 학교 직원 경조사에 기관 대표로 가는 소수, 학교 계획에 따른 봉사활동, 주관기관이 참석 범위를 지정해 요청한 행사는 출장 처리할 수 있다.","basis":"국가공무원 복무·징계 관련 예규 제6장 1-가"},{"stage":"미리 확인","when":"신청 전","who":"교사 본인","what":"근무지내·근무지외 구분","detail":"근무지내 출장은 같은 시(특별시·광역시·특별자치시 포함)·군·섬 안의 출장 또는 여행거리(왕복 기준) 12km 미만 출장이다. 같은 시·군 안이면 12km를 넘어도 근무지내다. 섬은 같은 시·군이라도 근무지외로 보되, 육로·교량으로 이어진 섬은 근무지내다. 목적지가 같은 시·군이어도 다른 시·군을 거치는 것이 일반 경로이고 12km 이상이면 학교장 판단으로 근무지외로 처리할 수 있다. 예를 들어 같은 시 안의 학교끼리 오가는 출장은 거리와 관계없이 근무지내다.","basis":"공무원 여비 규정 제18조제2항; 공무원보수 등의 업무지침 제9장 Ⅲ-1"},{"stage":"신청·보고","when":"출발 전","who":"교사 본인(또는 복무 담당 대리신청)","what":"나이스 출장 신청","detail":"나이스 [복무]-[개인출장관리]-[신청]에서 출장종류·일시·장소·목적을 입력하고 결재를 올린다. 복무 담당이 [복무]-[출장관리]에서 대리신청할 수도 있다. 출장 기간과 인원은 목적 달성에 필요한 최소한으로 정한다. 공문으로 요청된 출장이면 근거 공문을 붙인다. 승인자·협조자 지정 방식 같은 세부 결재 절차는 소속 시·도교육청 안내와 학교 위임전결 규정으로 확인한다.","basis":"국가공무원 복무규정 제6조; 국가공무원 복무·징계 관련 예규 제6장"},{"stage":"결재·승인","when":"출발 전","who":"학교장(위임전결 규정상 전결권자)","what":"출장명령(사전 허가)","detail":"공무원이 출장하려면 사전에 소속 기관(부서)장의 허가를 받아야 한다. 출장명령은 여비 지급의 근거가 되지만 명령이 있다고 반드시 여비를 주는 것은 아니다. 학교장은 임신 중인 교원의 장거리·장기간 출장을 제한할 수 있고(임신 12주 이내·36주 이상, 의사 소견 등), 본인이 신청하면 명할 수 있다.","basis":"국가공무원 복무규정 제6조제5항; 국가공무원 복무·징계 관련 예규 제6장 2-바·4-가"},{"stage":"사용·이행","when":"출장 중","who":"교사 본인","what":"공무 전념과 일정 변경 보고","detail":"출장 중에는 공무에 전력을 다하고 사적인 일에 시간을 쓰지 않는다. 정해진 기간 안에 끝내지 못할 사유가 생기면 지체 없이 전화 등으로 학교장에게 보고하고 지시를 받는다. 긴급하면 사후 보고할 수 있다. 출장 기간 중 초과근무는 원칙적으로 인정되지 않는다. 다만 목적상 시간외근무가 필연적으로 예상되어 근무명령을 받고 실제로 근무한 객관적 증빙이 있으면 시간외근무수당을 받을 수 있다.","basis":"국가공무원 복무규정 제6조제1항·제2항; 국가공무원 복무·징계 관련 예규 제6장 3"},{"stage":"사용·이행","when":"자가용으로 갈 때","who":"교사 본인","what":"자가용 이용 기준 지키기","detail":"자가용으로 공무 여행을 하면 운임은 그 구간의 철도·버스 요금(통상 대중교통 요금)으로 준다. 고속도로 통행영수증, 출장지 주유소 카드전표, 주차영수증 등 자가용으로 간 사실을 보여 주는 증빙이 필요하고, 어렵다면 출장자·차량·출장지가 함께 찍힌 현장 사진으로 갈음할 수 있다. 대중교통이 없는 산간·도서, 경로가 복잡한 경우, 부득이한 심야·긴급 이동, 자가용이 더 싼 경우, 무거운 짐, 장애인 공무원 등 '공무상 부득이한 사유'가 있으면 대중교통 요금 대신 연료비(여행거리×유가÷연비)와 통행료·주차료를 받는다. 동승자에게는 운임을 주지 않고, 같은 목적 2인 이상은 차 1대가 원칙이다.","basis":"공무원 여비 규정 별표 2 비고 4; 공무원보수 등의 업무지침 제9장 Ⅳ-2-라"},{"stage":"사용·이행","when":"체험학습 인솔·행사·연수 출장일 때","who":"교사 본인·행정실","what":"제공받은 숙식·차량만큼 여비 조정","detail":"주최 측이 숙박을 제공하거나, 교사가 학생 야영을 지도하며 함께 야영하는 경우처럼 지출이 필요 없거나 정액보다 적게 드는 것이 분명하면 학교장은 여비를 줄이거나 주지 않을 수 있다. 다른 기관에서 여비를 받았으면 그만큼 빼고 준다. 공무용 차량이나 임차 차량으로 이동한 날은 운임을 주지 않고 일비를 절반만 준다(주차비·통행료는 지급). 근무지내 출장에서 공용차량을 쓰면 1만원을 감액한다. 대학원 야간·계절제 수업 수강을 근무상황에 어떻게 기록하고 여비를 주는지는 시·도교육청마다 다르므로 소속 교육청 복무 지침으로 확인한다.","basis":"공무원 여비 규정 제15조·제16조제3항·제18조제1항·제28조; 공무원보수 등의 업무지침 제9장 Ⅷ-1(예시)"},{"stage":"복귀·정산","when":"돌아온 즉시","who":"교사 본인 → 학교장","what":"출장 결과 보고","detail":"출장 용무를 마치고 돌아오면 지체 없이 학교장에게 결과 보고서를 낸다. 경미한 사항은 말로 보고할 수 있다.","basis":"국가공무원 복무규정 제6조제3항"},{"stage":"복귀·정산","when":"근무지내 출장 뒤","who":"행정실","what":"근무지내 여비(정액) 지급","detail":"출장 여행시간 4시간 미만 1만원, 4시간 이상 2만원을 정액으로 주고 운임·일비·식비·숙박비는 따로 주지 않는다. 점심시간은 출장시간에서 빼지 않는다(예: 10시~14시 출장은 4시간). 하루에 여러 번 가도 합계 2만원을 넘지 못한다. 공용차량을 쓰면 1만원 감액한다. 왕복 2km 이내 근거리 출장은 실비(4시간 미만 운임, 4시간 이상 운임과 식비 1/3, 상한 1만원·2만원)로 주며 증빙이 필요하다. 섬 연결 유료도로처럼 불가피한 통행료는 따로 줄 수 있다.","basis":"공무원 여비 규정 제18조제1항; 공무원보수 등의 업무지침 제9장 Ⅲ-2"},{"stage":"복귀·정산","when":"여행을 마친 다음 날부터 2주일 안","who":"교사 본인 → 행정실(회계 관계 공무원)","what":"근무지외 출장 운임·숙박비 정산 신청","detail":"운임과 숙박비는 정부구매카드나 신용카드로 결제하는 것이 원칙이고, 세부 사용내용을 확인할 수 있는 증거서류(카드 매출전표, 현금영수증, 승차권, 고속도로 통행영수증 등)를 갖춰 정산을 신청한다. 수기로 낼 때는 공무원보수 등의 업무지침 제9장 별지 제3호 '국내여비 정산 신청서'를 쓴다(전산시스템으로 신청하면 수기 작성 생략). 숙박비는 실비로 1박 상한이 서울 10만원, 광역시 8만원, 그 밖 7만원이고, 2박 이상이면 전체 상한 총액 안에서 실비를 준다. 친지 집에 묵으면 1박 2만원, 2명 이상 함께 묵어 일부가 숙박비를 쓰지 않았으면 쓰지 않은 인원당 1박 2만원을 공동 숙박조에 추가로 줄 수 있다. 일비와 식비는 하루 각 2만5천원 정액이다.","basis":"공무원 여비 규정 제8조의2제1항·제2항, 제16조, 별표 2; 공무원보수 등의 업무지침 제9장 별지 제3호 서식"},{"stage":"복귀·정산","when":"숙박비 상한을 넘겨 쓴 경우, 여행을 마친 다음 날부터 1주일 안","who":"교사 본인 → 행정실","what":"숙박비 초과분 추가 정산","detail":"상한 안의 숙소가 없거나, 학술행사 지정 숙소가 상한을 넘는 등 공무상 부득이하게 상한을 넘겼으면 상한액의 10분의 3 범위에서 추가로 받을 수 있다. 카드 매출전표 등 세부 사용내용이 적힌 증빙을 갖춰 국내여비 정산 신청서(보수지침 별지 제3호)의 '초과지출 사유' 칸에 적어 신청한다.","basis":"공무원 여비 규정 제16조제1항 단서·제2항; 공무원보수 등의 업무지침 제9장 Ⅳ-3"},{"stage":"복귀·정산","when":"출장이 취소·변경되어 예약 취소 비용이 생긴 경우","who":"교사 본인 → 행정실","what":"취소수수료 청구","detail":"출장 일정이 바뀌거나 취소되어 숙박·철도·버스·항공 예약 취소수수료를 물었다면 예약취소내역서를 붙여 취소수수료 지급신청서(보수지침 제9장 별지 제4호)로 청구한다. 취소 사유가 공무상 사유인지 행정실과 먼저 확인한다.","basis":"공무원보수 등의 업무지침 제9장 별지 제4호 서식(취소수수료 지급신청서)"},{"stage":"사후 관리","when":"상시","who":"교사 본인·행정실·학교장","what":"부정 수령 방지","detail":"거짓이나 부정한 방법으로 여비를 받으면 부정 수령액의 5배를 더해 징수한다. 공무원 행동강령은 여비 등 공무 예산을 목적 외로 써서 기관에 손해를 끼치는 것을 금지한다(시·도교육청 행동강령에도 같은 취지의 조항이 있다). 출장 처리해 놓고 사적 용무를 보거나, 동승하고도 각자 운임을 청구하거나, 실제보다 긴 시간을 적는 일이 대표적 위험이다.","basis":"공무원 여비 규정 제31조; 국가공무원법 제48조; 공무원 행동강령 제7조"}],"deadlines":[{"what":"출장 허가","limit":"출발 전 사전 허가(나이스 결재 완결)","basis":"국가공무원 복무·징계 관련 예규 제6장; 국가공무원 복무규정 제6조"},{"what":"출장 기간 변경 보고","limit":"사유 발생 즉시(긴급하면 사후 보고 가능)","basis":"국가공무원 복무규정 제6조제2항"},{"what":"출장 결과 보고","limit":"복귀 후 지체 없이(경미하면 구두)","basis":"국가공무원 복무규정 제6조제3항"},{"what":"근무지외 출장 운임·숙박비 정산 신청","limit":"여행을 마친 날의 다음 날부터 2주일 이내","basis":"공무원 여비 규정 제8조의2제2항"},{"what":"숙박비 상한 초과분 추가 지급 정산","limit":"여행을 마친 날의 다음 날부터 1주일 이내(상한액의 3/10 범위)","basis":"공무원 여비 규정 제16조제1항·제2항"},{"what":"근무지내 출장 여비 한도","limit":"1일 합계 2만원(공용차량 매번 이용 시 1만원)","basis":"공무원보수 등의 업무지침 제9장 Ⅲ-2-나"}],"dont":["결재 완결 전에 출발하지 않는다 — 출장은 사전 허가가 원칙이고, 허가 없이 근무지를 떠나면 직장이탈이 된다","공무와 무관한 일(교원단체 체육대회 선수 참가, 개인적 경조사, 대학원 수강, 개인 봉사)을 출장으로 올리지 않는다 — 예규가 출장 불가 사례로 명시했다","출장 중 사적인 일을 보지 않는다 — 복무규정 제6조 위반이고, 여비를 받았다면 부정 수령 문제가 된다","동승한 교사가 따로 운임을 청구하지 않는다 — 자가용 동승자에게는 운임·연료비를 주지 않는다","근무지내 출장을 하루에 여러 번 쪼개 2만원 넘게 청구하지 않는다 — 1일 합산 2만원이 한도다","영수증을 버리지 않는다 — 운임·숙박비는 증빙으로 실비 정산하고, 자가용은 이용 사실 증빙이 없으면 운임이 나오지 않는다","허위·과다 청구를 하지 않는다 — 부정 수령액의 5배를 가산 징수하고 징계 대상이 된다"],"contacts":[{"name":"인사혁신처 급여정책과","tel":"044-201-8396","note":"공무원보수 등의 업무지침(여비 처리기준 포함) 소관 부서(국가법령정보센터 기재 번호). 실무 문의는 먼저 학교 행정실과 소속 교육지원청"}],"forms":["나이스 출장 신청(개인출장관리) — 별도 종이 서식 없이 전자결재","출장 요청 공문(행사·연수·회의 주관기관)","출장 결과 보고서(경미하면 구두 보고)","국내여비 정산 신청서 — 공무원보수 등의 업무지침 제9장 별지 제3호 서식(전산 신청 시 생략)","취소수수료 지급신청서 — 공무원보수 등의 업무지침 제9장 별지 제4호 서식","시·도교육청 자체 여비 정산 신청서가 있으면 그 서식(학교 행정실 확인)","증빙: 카드 매출전표·현금영수증·승차권·고속도로 통행영수증·주차영수증·숙박 영수증, 자가용 출장지 현장 사진"],"law":[{"name":"공무원 여비 규정","article":"제18조(근무지 내 국내 출장 시의 여비)","point":"같은 시·군·섬 안 또는 여행거리 12km 미만 출장은 4시간 이상 2만원, 4시간 미만 1만원. 공무용 차량 이용 등은 1만원 감액"},{"name":"공무원 여비 규정","article":"제8조의2, 제16조, 별표 2","point":"운임·숙박비는 카드 결제·2주 내 증빙 정산. 일비·식비 1일 각 25,000원, 숙박비 실비 상한 서울 10만원·광역시 8만원·그 밖 7만원. 자가용은 철도·버스 운임이 원칙(비고 4). 2026.7.1. 시행"},{"name":"공무원 여비 규정","article":"제28조(여비의 조정)·제31조(가산징수)","point":"지출이 불필요하거나 적게 드는 것이 명백하면 감액·부지급. 부정 수령 시 5배 가산 징수"},{"name":"국가공무원 복무규정","article":"제6조(출장공무원)","point":"공무 전념, 기간 변경 시 보고·지시, 복귀 후 결과 보고, 임신 공무원 장거리·장기 출장 제한"},{"name":"공무원보수 등의 업무지침(인사혁신처 예규 제220호)","article":"제9장 공무원여비업무 처리기준 Ⅲ·Ⅳ·Ⅷ","point":"근무지내 세부 기준(점심시간 포함, 1일 2만원 한도, 2km 이내 실비), 자가용 부득이한 사유와 연료비 산식, 여비 조정 예시"}],"deep":[{"title":"근무지내·근무지외를 가르는 기준","body":["기준은 '같은 시·군·섬 안인가'와 '여행거리가 12km 미만인가' 두 가지다. 둘 중 하나라도 해당하면 근무지내 출장이다. 거리는 왕복을 기준으로 한다.","그래서 같은 시 안이면 멀어도 근무지내다. 반대로 다른 시·군이라도 왕복 12km 미만이면 근무지내다. 목적지는 같은 시·군인데 다른 시·군을 거치는 게 일반 경로이고 12km 이상이면 학교장 판단으로 근무지외로, 다른 시·군이지만 교통여건상 가까우면 학교장 판단으로 근무지내로 처리할 수 있다.","근무지내는 정액(1만원·2만원)만, 근무지외는 운임·일비·식비·숙박비를 받는다."],"basis":"공무원 여비 규정 제18조제2항; 공무원보수 등의 업무지침 제9장 Ⅲ-1"},{"title":"자가용 출장 — 원칙은 대중교통 요금","body":["자가용으로 가도 운임은 그 구간 철도·버스 요금으로 계산하는 것이 원칙이다. 이것도 자가용 이용 사실을 보여 주는 증빙(통행영수증, 출장지 주유 카드전표, 주차영수증, 또는 출장자·차량·출장지가 함께 나온 사진)이 있어야 한다.","공무상 부득이한 사유가 있으면 연료비를 받는다. 산식은 여행거리(km) × 출장 시작일 유가(오피넷 고시) ÷ 연비다. 연비는 휘발유 11.97, 경유 12.52, LPG 8.83, 하이브리드 15.37km/L, 전기 5.22km/kWh 등으로 정해져 있다. 통행료·주차료는 영수증 금액대로 준다.","여러 명이 같은 목적으로 가면 차 1대가 원칙이고 연료비는 차 주인에게만 준다. 동승자는 운임이 없다."],"basis":"공무원 여비 규정 별표 2 비고 4; 공무원보수 등의 업무지침 제9장 Ⅳ-2-라"},{"title":"체험학습 인솔·연수 출장에서 여비가 줄어드는 경우","body":["여비는 실제로 드는 비용을 보전하는 돈이다. 그래서 행사 주최 측이 숙박을 제공하거나, 교사가 학생 야영을 지도하며 함께 야영하는 경우처럼 숙박비 지출이 필요 없으면 학교장이 감액하거나 주지 않을 수 있다. 다수가 버스를 빌려 운임이 규정보다 적게 들면 차액은 주지 않는다.","공무용 차량이나 임차 차량으로 이동한 날은 운임이 없고 일비가 절반이다. 연수기관이 여비가 포함된 강사료나 여비를 따로 주면 그만큼 빼거나 여비 없이 출장 처리한다.","구체적인 감액 범위는 학교(행정실)가 예산 사정과 제공 내역을 보고 정하므로, 인솔 계획을 세울 때 숙식 제공 여부를 행정실과 먼저 맞춘다. 시·도교육청이 체험학습 인솔 여비 기준을 따로 두는 경우도 있으니 소속 교육청 현장체험학습 운영 안내를 확인한다."],"basis":"공무원 여비 규정 제16조제3항·제28조; 공무원보수 등의 업무지침 제9장 Ⅷ-1(예시); 예규 제6장 4-가"}],"tables":[{"title":"국내 출장 여비 한눈에(2026.7.1. 시행)","head":["구분","지급 항목","금액","비고"],"rows":[["근무지내, 4시간 미만","정액","1만원","공용차량 이용 시 1만원 감액(=0원)"],["근무지내, 4시간 이상","정액","2만원","공용차량 이용 시 1만원. 1일 합계 2만원 한도"],["근무지내, 왕복 2km 이내","실비(운임, 4시간 이상은 식비 1/3 포함)","상한 1만원·2만원","증빙 필요"],["근무지외","일비","1일 25,000원","공무용·임차 차량 이용일은 1/2"],["근무지외","식비","1일 25,000원","정액"],["근무지외","숙박비","1박 실비, 상한 서울 10만원·광역시 8만원·그 밖 7만원","부득이하면 상한의 3/10까지 추가"],["근무지외","운임","철도(일반실)·버스 실비","자가용은 대중교통 요금, 부득이하면 연료비+통행료+주차료"]],"note":"교원(공무원 여비 규정 별표 1 제2호 해당자) 기준. 출처: 공무원 여비 규정 제18조·별표 2(2026.6.30. 개정), 공무원보수 등의 업무지침 제9장."}],"faq":[{"q":"같은 시 안인데 20km 떨어진 학교로 가요. 근무지외 아닌가요?","a":"같은 시·군 안의 출장은 12km를 넘어도 근무지내 출장이다. 여행시간에 따라 1만원 또는 2만원을 받는다. 다만 목적지는 같은 시·군이어도 다른 시·군을 거쳐 가는 것이 일반 경로이고 12km 이상이면 학교장 판단으로 근무지외로 처리할 수 있다."},{"q":"오전 10시부터 오후 2시까지 출장인데 점심시간은 빼나요?","a":"빼지 않는다. 출장시간에 점심시간이 들어 있어도 그대로 계산해 4시간으로 보고 2만원을 받는다."},{"q":"자가용으로 갔는데 기름값을 받을 수 있나요?","a":"원칙은 그 구간 철도·버스 요금만 받는다. 대중교통이 없거나 경로가 복잡하거나 자가용이 더 싸거나 무거운 짐이 있는 등 공무상 부득이한 사유가 있을 때만 여행거리×유가÷연비로 계산한 연료비와 통행료·주차료를 받는다. 어느 경우든 자가용 이용 증빙이 있어야 하고, 같이 탄 사람은 운임이 없다."},{"q":"하루에 근무지내 출장을 두 번 갔어요. 4만원인가요?","a":"아니다. 1일 합산 2만원을 넘지 못한다(매번 공용차량을 쓰면 1만원)."},{"q":"방학 중 대학원 수업 들으러 가는 것도 출장인가요?","a":"공무 수행이 아니므로 여비가 나오는 출장이 아니다. 예규도 대학원 수강을 출장 불가 사례로 든다. 야간·계절제 대학원 수강을 근무상황에 '출장(연수)' 등으로 적을지, 연가로 처리할지는 시·도교육청마다 기준이 다르니 소속 교육청 복무 지침을 확인한다."}],"record":"나이스 [복무]-[개인출장관리]-[신청]에서 출장종류·일시·장소·목적을 입력해 결재를 올리고, 결재가 완결됐는지 확인한다. 복무 담당은 [복무]-[출장관리]에서 대리신청할 수 있다. 출장 결과는 학교장에게 보고하고, 근무지외 출장의 운임·숙박비는 국내여비 정산 신청서(또는 소속 교육청 서식)와 증빙을 행정실에 내서 정산한다. 여비를 주지 않는 출장(요청기관이 여비 지급, 공용차량 이용 등)은 여비 부지급으로 처리한다.","sources":[{"title":"공무원 여비 규정(대통령령 제36492호, 시행 2026.7.1.)","publisher":"국가법령정보센터(인사혁신처)","year":2026,"url":"https://www.law.go.kr/법령/공무원여비규정"},{"title":"국가공무원 복무규정(시행 2026.6.23.)","publisher":"국가법령정보센터(인사혁신처)","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규정"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 2026.6.23.) 제6장 출장","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/국가공무원복무·징계관련예규"},{"title":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 시행 2026.8.1.) 제9장 공무원여비업무 처리기준","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/공무원보수등의업무지침"},{"title":"공무원보수 등의 업무지침(인사혁신처예규 제220호) 첨부 PDF — 제9장 별지 제3호 국내여비 정산 신청서·제4호 취소수수료 지급신청서","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/LSW/flDownload.do?flSeq=167746521"},{"title":"공무원 행동강령(대통령령 제32661호) 제7조","publisher":"국가법령정보센터(국민권익위원회)","year":2022,"url":"https://www.law.go.kr/법령/공무원행동강령"}],"verified":"2026-09-29","uncertain":["교육청·연수원 주관 직무연수 참가 시 여비(교육훈련여비) 지급 기준을 공식 문서에서 확인하지 못했다. 보수지침은 공무원인재개발법상 교육대상자 국내여비를 「공무원 인재개발 업무처리지침」으로 정한다고만 적었다","수학여행·수련활동 인솔교사 여비 감액 범위에 대한 시·도교육청 지침은 찾지 못했다. 여기 적은 것은 여비 규정·보수지침의 일반 원칙이다","나이스에서 여비 정산을 신청하는 메뉴 경로는 확인하지 못했다(학교마다 에듀파인·행정실 처리 방식이 다를 수 있다)","출장 종료 후 학교로 복귀해야 하는지(근무시간이 남았을 때)에 대한 교원 대상 명시 기준은 공식 문서에서 찾지 못했다","대학원 야간·계절제 수강의 근무상황 처리(출장(연수) 기록 여부)에 대한 전국 공통 기준은 찾지 못했다"],"related":["leave-annual","vacation-duty","side-job","anti-graft"]},{"id":"side-job","title":"겸직 허가와 외부강의 신고 — 유튜브·저술·강사 활동, 사례금 상한과 초과 반환","aka":["겸직","겸직허가","겸직 신청","영리업무","투잡","유튜브","블로그 수익","개인방송","책 출판","인세","저술","대학 시간강사","외부강의","외부강의 신고","강사료","강의료 상한","사례금","초과사례금","학원 강의","문제집 출제"],"category":"겸직·청렴","urgency":"미리 신청","roles":["교사 본인","복무 담당(교무부)","교감(행동강령책임관·겸직심사위원)","겸직심사위원회","학교장(겸직 허가권자)"],"summary":"교원은 영리업무를 할 수 없고, 금지 요건에 걸리지 않는 계속성 있는 영리·비영리 업무는 소속 기관의 장(학교장)의 사전 겸직 허가를 받아야 한다. 한 번으로 끝나는 강의·저술은 겸직 허가 대상이 아니지만, 대학 시간강사처럼 위촉되거나 1개월을 넘겨 계속 출강하면 겸직 허가를 받는다. 교육부 가이드라인에 따라 교원 겸직 허가 기간은 최대 1년이고, 학원(학교교과교습학원) 관련 겸직은 원칙적으로 금지된다. 유튜브는 수익창출 요건(구독자 1,000명·연간 시청 4,000시간)을 채운 뒤 계속하려면 채널별로 허가를 받는다. 외부강의는 요청기관 공문에 근거해 학교장 사전 결재를 받고, 사례금을 받으면 마친 날부터 10일 안에 신고한다. 교원 사례금 상한은 1시간당 100만원이고, 넘게 받으면 안 날부터 2일 안에 신고하고 초과분을 돌려준다.","first":["하려는 활동이 계속성이 있는지부터 본다. 매주·매월처럼 주기적이거나 계속할 의지가 있으면 겸직 허가 대상이다. 명백히 한 번뿐인 일이 아니면 신청하는 것이 안전하다(예규)","학원(학교교과교습학원) 강의·문항 출제·교재 집필·컨설팅은 원칙적으로 불가다. 학원법상 교원의 과외교습도 금지다","겸직은 활동 시작 전에 허가받는다. 신청 기한(며칠 전)은 소속 시·도교육청 안내를 따르고, 유튜브는 수익창출 요건을 채운 뒤 새 콘텐츠를 올리기 전에 신청한다","외부강의 요청은 반드시 요청기관 공문으로 받고, 출강 전에 학교장 결재를 받는다. 사례금을 받는 강의는 소속 교육청이 정한 방식(나이스 등록 또는 외부강의등 신고서)으로 신고한다","사례금이 1시간 100만원을 넘거나 요청기관이 지나치게 많이 줬으면, 안 날부터 2일 안에 서면 신고하고 초과분을 돌려준다","근무시간 중 강의·겸직 활동은 원칙적으로 안 된다. 직무 관련이면 출장, 아니면 연가·외출·조퇴로 처리한다"],"steps":[{"stage":"미리 확인","when":"활동을 시작하기 전","who":"교사 본인","what":"영리업무 금지 요건 확인","detail":"영리업무는 계속적으로 재산상 이득을 얻는 행위다. 상업·공업·금융업을 스스로 경영하는 것, 영리 사기업체의 이사·감사·임원이 되는 것(사외이사·고문도 대가를 받으면 포함), 직무와 관련된 타인 기업 투자, 그 밖에 계속 재산상 이득을 목적으로 하는 업무가 해당한다. 이런 업무가 직무 능률 저하, 공무에 부당한 영향, 국가 이익과 상반, 정부 불명예 가운데 하나라도 우려되면 할 수 없다. 근무시간과 겸직시간을 합쳐 주 52시간·하루 12시간을 넘거나 자정 이후 심야업종이면 직무 능률 저하로 본다. 야간 대리운전·다단계 판매, 수익사업을 하는 친목단체 임원, 대규모 공동주택 입주자대표회의 임원은 겸직 불가로 안내되어 있다.","basis":"국가공무원법 제64조; 국가공무원 복무규정 제25조; 국가공무원 복무·징계 관련 예규 제9장 2·겸직허가 심사시 참고사례"},{"stage":"미리 확인","when":"사교육 관련 제안을 받았을 때","who":"교사 본인","what":"사교육업체 관련 여부 확인","detail":"학원법상 학교교과교습학원과 관련된 강의·문항 출제·출판·컨설팅은 계속성이 있으면 겸직이 원칙적으로 금지되고, 계속성이 없어도 청렴·품위유지 의무에 따라 원칙적으로 금지된다. 학원으로 등록하지 않은 출판사·온라인 업체라도 학원 교재 제작이나 유상 강의 영상 제작처럼 교습행위면 포함된다. 다만 에듀테크 정부사업 컨설팅, 디지털교과서·교원연수자료 개발처럼 공익 목적이고 대중을 위한 결과물이면 겸직심사위원회 심의를 거쳐 예외적으로 허가할 수 있다. 교육과정평가원·EBS·대학·일반 출판사 등 학원과 무관한 곳의 강의·집필은 계속성이 있으면 허가 후 가능하다. 이 기준은 기간제교원을 포함한 유·초·중등 교원에게 적용되고, 시·도교육감이 취지 안에서 세부 기준을 따로 둘 수 있다.","basis":"교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.) 4; 학원의 설립·운영 및 과외교습에 관한 법률 제3조"},{"stage":"신청·보고","when":"겸직 시작 전(구체적 기한은 소속 시·도교육청 안내)","who":"교사 본인 → 복무 담당","what":"겸직허가 신청서 제출","detail":"교원 겸직허가 신청서(교육부 가이드라인 붙임 2)에 겸직기관, 직위·직무, 겸직기간(1년 이내), 겸직유형, 업무 내용, 수익 형태와 연간 예상 총수익, 사교육업체 관련 여부, 최근 3년 겸직 내역, 담당직무와의 관련성, 근무시간 내 활동 여부를 적는다. 겸직기관 요청서 등 증빙(학원이면 학원설립운영등록증명서)을 반드시 붙이고, 법인 이사면 정관·임원선출 회의록 등, 대학 시간강사면 출강계약서 등을 낸다. 임용 전부터 하던 일을 계속하려면 임용된 날부터 1개월 안에 신청한다. 학교에 따라 신청 기한을 '겸직 예정일 며칠 전'으로 정해 두니 미리 확인한다.","basis":"교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.) 붙임 2; 국가공무원 복무·징계 관련 예규 제9장 3-라"},{"stage":"결재·승인","when":"신청 뒤","who":"복무 담당 → 겸직심사위원회 → 학교장","what":"심사와 허가 결정","detail":"복무 담당은 체크리스트로 허가 대상·요건을 검토해 학교장에게 보고한다. 인터넷 개인방송, 부동산 임대업, 과도한 겸직수익, 직무 관련 지식·정보를 쓰는 활동(학교 기출문제 활용 포함), 정치적 중립에 주의가 필요한 활동, 사교육업체 관련 활동은 겸직심사위원회(교감 포함 내부위원 3인 이상, 재적 과반 출석·출석 과반 찬성)를 반드시 거친다. 학교장은 결과를 공문으로 통보하고 허가 기간과 준수사항을 알린다. 반려되면 이유를 보고 보완해 다시 신청할 수 있다.","basis":"국가공무원 복무·징계 관련 예규 제9장 3-라; 교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.) 4(겸직 허가 절차)"},{"stage":"사용·이행","when":"유튜브·블로그 수익이 생길 때","who":"교사 본인","what":"인터넷 개인 미디어 겸직","detail":"직무와 무관한 취미·자기계발 방송은 원칙적으로 규제 대상이 아니다. 수익창출 요건이 있는 플랫폼은 요건(유튜브 구독자 1,000명·연간 누적 재생 4,000시간)을 채우고 계속하려 할 때, 요건이 없는 플랫폼은 수익이 처음 생기고 계속하려 할 때 채널별로 겸직허가를 신청한다. 새 콘텐츠를 올리기 전에 신청한다. 허가 기간은 최대 1년이고 연장은 종료 1개월 전까지 신청한다. 직무 관련 방송은 사전 보고 후 가능하다. 수업용으로 공개 범위를 제한해 올리는 영상은 개인 미디어 활동에 들어가지 않는다.","basis":"국가공무원 복무·징계 관련 예규 제9장 「공무원의 인터넷 개인방송 활동 지침」"},{"stage":"사용·이행","when":"허가받은 뒤 활동 중","who":"교사 본인","what":"준수사항 지키기","detail":"허가받은 범위 안에서만 활동한다. 직무상 비밀·미공개 정보를 공개하지 않고(브이로그 주의), 품위를 지키며(비속어·허위사실·선정적 콘텐츠 금지), 정당·선거 관련 활동을 하지 않는다. 학생·동료가 나오는 콘텐츠는 초상권 동의를 받는다. 업체 협찬으로 특정 상품을 홍보해 금전·물품을 얻는 행위는 금지다. 근무시간 중에는 직무에 전념하고, 문항개발·문제집 제작처럼 고유 업무와 구분이 모호한 겸직은 근무시간 안에 하지 않는다. 담당 직무가 바뀌면 1개월 안에 재심사를, 주요 사항이 바뀌면 다시 신청한다. 전보로 학교가 바뀌면 새 학교에 재신청한다.","basis":"국가공무원 복무·징계 관련 예규 제9장 '공무원의 겸직 활동 준수사항'·참고사례; 교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.) 붙임 2·5"},{"stage":"미리 확인","when":"외부강의 요청을 받았을 때","who":"교사 본인","what":"겸직 허가 대상인지, 신고 대상인지 구분","detail":"대학 시간강사·겸임교수로 위촉되거나, 대가·월 횟수와 관계없이 1개월을 넘겨 계속 출강하면 겸직 허가를 받는다(방송·사이버 강의 촬영도 같다). 그 밖의 1회성 외부강의는 겸직 허가 대상이 아니지만, 직무 관련이거나 교사 지위 때문에 요청받아 사례금을 받는 강의·강연·기고는 신고 대상이다. 요청자가 국가·지방자치단체(교육청과 그 소속기관 포함)면 신고하지 않는다. 공무원 행동강령은 기관마다 대가 있는 외부강의 횟수 상한을 정하게 하고, 넘기려면 미리 기관장 승인을 받게 한다. 교육부 공무원 행동강령은 월 3회 또는 월 6시간(국가·지자체 요청, 겸직허가 강의 제외)을 상한으로 두었다. 교원은 소속 시·도교육청 행동강령의 횟수 상한을 확인한다.","basis":"국가공무원 복무·징계 관련 예규 제10장 3; 청탁금지법 제10조제2항; 공무원 행동강령 제15조제7항·제8항; 교육부 공무원 행동강령 제17조"},{"stage":"결재·승인","when":"출강 전","who":"교사 본인 → 학교장","what":"외부강의 사전 결재와 복무 처리","detail":"모든 외부강의는 요청기관 공문에 근거해 학교장의 사전 결재를 받는다(겸직 허가를 받은 경우 제외). 개인 전화·이메일 요청만으로 나가지 않는다. 근무시간 중 강의는 담당 직무와 관련 있거나 기관 기능·국가정책 수행상 필요하거나 학교장이 인정할 때만 허용되고, 이때는 출장 처리한다. 요청기관이 교통편·여비를 주면 여비 부지급 출장이다. 그 밖의 강의는 연가·외출·조퇴로 처리한다.","basis":"국가공무원 복무·징계 관련 예규 제10장 3-다~자"},{"stage":"신청·보고","when":"마친 날부터 10일 안(소속 교육청이 사전 신고를 원칙으로 두기도 한다)","who":"교사 본인 → 학교장","what":"외부강의 신고","detail":"사례금을 받는 외부강의는 신고자 인적사항, 일시·강의시간·장소, 주제, 사례금 총액과 상세 명세, 요청기관·담당자·연락처를 적어 학교장에게 서면(전자문서 포함) 신고한다. 법정 기한은 마친 날부터 10일 이내다. 신고 방식은 기관 행동강령이 정한다. 교육부 공무원 행동강령은 전자인사관리시스템이나 별지 제5호 '외부강의등 신고서'로 신고하게 하고, 시·도교육청은 나이스 외부강의 등록이나 자체 신고서를 쓰게 하는 경우가 많으니 소속 교육청 방식을 확인한다. 사례금 액수를 미리 모르면 나머지를 먼저 신고하고 안 날부터 5일 안에 보완한다. 학교장은 공정한 직무수행을 해친다고 보면 외부강의를 제한할 수 있다.","basis":"청탁금지법 제10조제2항·제4항, 시행령 제26조; 공무원 행동강령 제15조제2항·제4항; 교육부 공무원 행동강령 제16조제2항·제4항, 별지 제5호"},{"stage":"복귀·정산","when":"사례금을 받은 뒤","who":"교사 본인","what":"사례금 상한 확인","detail":"각급 학교 교직원(국공립 교원 포함)의 외부강의 사례금 상한은 1시간당 100만원, 기고는 1건당 100만원이다. 강의료·원고료·출연료 등 명목과 관계없이 모두 합친다. 다만 학교에서 여비를 받지 않았을 때 여비 규정 범위 안의 실비 교통비·숙박비·식비는 사례금에 넣지 않는다. 국제기구·외국대학 등 외국기관이 주면 그 기관 지급기준을 따른다.","basis":"청탁금지법 시행령 제25조·별표 2; 국민권익위원회 청탁금지법 질의응답(공립 초등교사 외부강의 사례금, 2022.11.21. 답변)"},{"stage":"이의·구제","when":"상한을 넘겨 받은 사실을 안 날부터 2일 안","who":"교사 본인 → 학교장","what":"초과사례금 신고와 반환","detail":"초과사례금을 받으면 안 날부터 2일 안에 신고사항과 초과 액수·반환 여부를 적어 학교장에게 서면 신고하고(교육부 행동강령 별지 제13호 '초과사례금 신고서' 등), 제공자에게 초과분을 지체 없이 돌려준다. 돌려주지 않았으면 학교장이 7일 안에 반환할 액수를 산정해 통지하고, 교사는 지체 없이 반환한 뒤 알린다. 반환에 든 비용은 증명자료를 붙여 학교장에게 청구할 수 있다(별지 제8호 '반환비용 청구 신청서' 등). 신고·반환을 하지 않으면 500만원 이하 과태료 대상이다.","basis":"청탁금지법 제10조제5항·제23조제4항, 시행령 제27조·제28조; 공무원 행동강령 제15조제5항·제6항; 교육부 공무원 행동강령 제16조제6항·제7항"},{"stage":"사후 관리","when":"매년 1월·7월","who":"복무 담당·교사 본인","what":"겸직 실태조사와 허가 취소","detail":"학교는 매년 1월(전년 12월 말 기준)과 7월(6월 말 기준)에 겸직 허가자의 실제 활동이 허가 내용과 같은지 조사하고, 교사는 필요한 자료를 낸다. 신청서의 예상 수익을 넘은 실제 수익은 이때 반드시 보고해 재심사 여부를 검토받는다. 허위·부실 신청, 허가와 다른 활동, 중대한 사정 변경이 있으면 허가를 취소한다. 허가 없이 겸직하면 징계 대상이고, 사교육업체 관련 위반은 고의·중과실 여부를 엄격히 따진다.","basis":"국가공무원 복무·징계 관련 예규 제9장 3-마; 교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.) 4(실태조사·위반 시 처분), 붙임 2"}],"deadlines":[{"what":"겸직허가 신청","limit":"겸직 시작 전(며칠 전인지는 소속 시·도교육청 안내). 임용 전부터 하던 일은 임용일부터 1개월 이내","basis":"국가공무원 복무·징계 관련 예규 제9장 3-라"},{"what":"겸직 허가 기간","limit":"교원은 최대 1년(연장은 종료 1개월 전 신청, 전보 시 새 학교에 재신청). 인터넷 개인방송도 최대 1년. 예규 일반 원칙은 2년 이내","basis":"교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.) 4; 예규 제9장 3-라·인터넷 개인방송 활동 지침"},{"what":"담당 직무 변경 시 겸직 재심사","limit":"직무가 바뀐 날부터 1개월 이내","basis":"예규 제9장 3-라"},{"what":"사례금 받는 외부강의 신고","limit":"마친 날부터 10일 이내. 사례금 등 미확정 사항은 안 날부터 5일 이내 보완","basis":"청탁금지법 제10조제2항, 시행령 제26조; 공무원 행동강령 제15조제2항"},{"what":"대가 있는 외부강의 횟수","limit":"기관 행동강령이 정한 상한(교육부 행동강령은 월 3회 또는 월 6시간) 초과 시 미리 기관장 승인","basis":"공무원 행동강령 제15조제7항·제8항; 교육부 공무원 행동강령 제17조"},{"what":"초과사례금 신고","limit":"초과 사실을 안 날부터 2일 이내 서면 신고, 초과분 지체 없이 반환","basis":"청탁금지법 시행령 제27조제1항"}],"dont":["허가 없이 계속성 있는 부업을 시작하지 않는다 — 겸직허가 의무 위반은 징계 사유이고 사후 허가로 되돌릴 수 없다","학원 강의, 학원용 문항·교재 제작, 과외를 하지 않는다 — 교원의 과외교습은 학원법으로 금지되고, 사교육업체 관련 겸직은 원칙적으로 불허된다","학교 기출문제나 수업 중 알게 된 학생·학교 정보를 겸직 콘텐츠에 쓰지 않는다 — 직무상 비밀 누설이자 겸직심사위원회 필수 심사 대상이다","학생이나 동료가 나오는 영상을 동의 없이 올리지 않는다 — 초상권 침해 금지가 준수사항이다","업체 협찬 광고로 금품을 받지 않는다 — 예규가 블로그 등의 직·간접 광고 행위를 금지한다","개인 전화·메신저로 온 강의 요청에 공문 없이 나가지 않는다 — 외부강의는 요청기관 공문과 학교장 사전 결재가 있어야 한다","근무시간에 결재 없이 강의나 겸직 활동을 하지 않는다 — 직무 관련이면 출장, 아니면 연가·외출·조퇴로 처리해야 한다","상한을 넘은 사례금을 그대로 두지 않는다 — 2일 안에 신고하고 반환하지 않으면 과태료(500만원 이하) 대상이다"],"contacts":[{"name":"인사혁신처 복무과","tel":"044-201-8445","note":"국가공무원 복무·징계 관련 예규(겸직·외부강의) 소관 부서"},{"name":"교육부 반부패청렴담당관","tel":"044-203-6074","note":"교육부 공무원 행동강령 소관 부서(국가법령정보센터 기재 번호)"},{"name":"학교 행동강령책임관(교감)","tel":"소속 학교","note":"공립학교는 대개 교감이 행동강령책임관(소속 시·도교육청 행동강령으로 확인). 외부강의 횟수 초과 검토·위반 여부 상담"}],"forms":["교원 겸직허가 신청서, 교원 겸직 심사 주요 체크리스트 — 교육부 사교육 관련 교원 겸직 허가 가이드라인(2023) 붙임 2·3","겸직허가 신청서, 공무원 겸직심사 주요 체크리스트, 인터넷 개인방송 활동 겸직심사 체크리스트, 겸직허가 신청서(외부강의 신청용) — 국가공무원 복무·징계 관련 예규 제9장·제10장 붙임","겸직 첨부서류: 겸직기관 요청서, (법인 이사) 정관 사본·임원선출 회의록 등, (시간강사) 출강계약서 등, (학원 관련 여부) 학원설립운영등록증명서","외부강의 요청기관 공문","외부강의등 신고서, 월 3회 또는 6시간 초과 외부강의등 승인 신청서 — 교육부 공무원 행동강령 별지 제5호·제5호의2(시·도교육청은 자체 행동강령 별지나 나이스 등록)","초과사례금 신고서, 반환비용 청구 신청서 — 교육부 공무원 행동강령 별지 제13호·제8호","소속 시·도교육청 교원 겸직 서식이 따로 있으면 그 서식"],"law":[{"name":"국가공무원법","article":"제64조(영리 업무 및 겸직 금지)","point":"공무원은 공무 외에 영리 목적 업무에 종사하지 못하며 소속 기관장의 허가 없이 다른 직무를 겸할 수 없다"},{"name":"국가공무원 복무규정","article":"제25조(영리 업무의 금지)·제26조(겸직 허가)","point":"직무 능률 저하·공무에 부당한 영향·국가 이익 상반·정부 불명예 우려가 있는 영리업무 금지. 그 밖의 다른 직무는 소속 기관장 사전 허가, 담당 직무 수행에 지장이 없을 때만 허가"},{"name":"부정청탁 및 금품등 수수의 금지에 관한 법률","article":"제10조(외부강의등의 사례금 수수 제한)","point":"상한 초과 사례금 금지, 사례금 받는 외부강의는 마친 날부터 10일 안에 서면 신고(국가·지자체 요청은 제외), 초과분은 신고 후 지체 없이 반환"},{"name":"부정청탁 및 금품등 수수의 금지에 관한 법률 시행령","article":"제25조~제28조, 별표 2(2026.6.30. 개정)","point":"각급 학교 교직원 1시간당(기고 1건당) 100만원, 공무원·공직유관단체 40만원(총액 60만원). 초과사례금은 안 날부터 2일 안에 신고"},{"name":"공무원 행동강령","article":"제15조(외부강의등의 사례금 수수 제한)","point":"사례금 받는 외부강의는 마친 날부터 10일 안에 서면 신고(국가·지자체 요청 제외), 초과사례금은 신고·반환, 기관별 횟수 상한을 넘기려면 사전 승인"},{"name":"교육부 공무원 행동강령(교육부훈령)","article":"제16조·제17조, 별지 제5호·제5호의2·제8호·제13호","point":"외부강의 신고서·초과사례금 신고서 서식, 대가 있는 외부강의 월 3회 또는 월 6시간 상한. 시·도교육청 행동강령도 같은 구조"},{"name":"학원의 설립·운영 및 과외교습에 관한 법률","article":"제3조(교원의 과외교습 제한)","point":"교원은 과외교습을 할 수 없다(교육부 교원 겸직 가이드라인 체크리스트가 인용)"},{"name":"교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.)","article":"4. 사교육업체 관련 겸직 허가 가이드라인","point":"학교교과교습학원 관련 강의·문항출제·출판·컨설팅 원칙 금지, 교원 겸직 허가 기간 최대 1년, 사교육 관련 겸직심사위원회 필수, 매년 1·7월 실태조사"}],"deep":[{"title":"'계속성'이 겸직 허가의 갈림길","body":["예규는 계속성을 ①매일·매주·매월처럼 주기적인 것, ②계절적인 것, ③주기는 없어도 계속 행해지는 것, ④계속할 의지와 가능성이 있는 것으로 본다. 여기에 해당하면 영리든 비영리든 겸직 허가 대상이다.","그래서 1회 원고 청탁이나 단발 강연은 허가 대상이 아니지만, 주기적 업데이트나 '연 00회'처럼 기간을 정한 저술은 허가를 받는다. 학습지·문제집을 주기적으로 써서 원고료를 받거나 직접 책을 출판·판매하면 영리업무다.","예규는 누가 봐도 명백히 계속성이 없는 행위가 아니면 반드시 신청하라고 한다. 애매하면 신청하는 쪽이 안전하다."],"basis":"국가공무원 복무·징계 관련 예규 제9장 2-가, 겸직허가 심사시 참고사례(기타)"},{"title":"유튜브·블로그 — 언제 신청하나","body":["취미·자기계발 채널은 원칙적으로 자유다. 겸직 신청 시점은 수익이다. 유튜브는 구독자 1,000명과 연간 누적 재생 4,000시간이라는 수익창출 요건을 채운 뒤 계속하려는 때, 구독료처럼 요건 없이 바로 수익이 나는 플랫폼은 첫 수익이 생긴 때다. 채널마다 따로 신청하고, 신청은 새 콘텐츠를 올리기 전에 한다.","인터넷 개인방송은 겸직심사위원회가 반드시 심사한다. 허가는 최대 1년이라 매년 연장 신청(종료 1개월 전)이 필요하다. 블로그도 계속 운영해 수익을 얻으면 허가 대상이고, 협찬 광고는 금지다.","허가를 받아도 비밀 엄수, 품위 유지, 정치적 중립, 초상권 준수는 그대로 적용된다. 위반하면 학교장이 불허·콘텐츠 삭제 요청·활동 금지·징계 요구를 할 수 있다."],"basis":"국가공무원 복무·징계 관련 예규 제9장 「공무원의 인터넷 개인방송 활동 지침」"},{"title":"외부강의 사례금 상한 — 교원은 100만원","body":["청탁금지법 시행령 별표 2는 공무원·공직유관단체 임직원을 1시간당 40만원(1시간을 넘어도 총액 60만원)으로 하되, 각급 학교 교직원에도 해당하는 사람은 여기서 뺀다. 각급 학교 교직원은 1시간당 100만원이고 총액 제한 조항이 없다. 국민권익위원회도 공립학교 교직원은 1시간당 100만원 기준을 적용받는다고 답변했다.","공무원 행동강령은 상한을 각 기관(중앙행정기관의 장등)이 정하게 한다. 교육부 공무원 행동강령은 소속 공무원 상한을 40만원으로 따로 정했으므로 교육부 본부 등에 파견·전직한 경우에는 다를 수 있다. 학교 교원은 소속 시·도교육청 행동강령이 시행령 별표 2를 따르는지 확인한다.","상한은 강의료·원고료·출연료를 모두 합친 금액이다. 학교에서 여비를 받지 않았다면 여비 규정 범위 안의 실비 교통·숙박·식비는 빼고 계산한다."],"basis":"청탁금지법 시행령 별표 2; 국민권익위원회 청탁금지법 질의응답(2022.11.21.)·'한눈에 보는 청탁금지법-외부강의등'; 공무원 행동강령 제15조제1항; 교육부 공무원 행동강령 별표 2"},{"title":"외부강의 — 결재는 사전, 신고는 사후 10일","body":["청탁금지법은 2019년 개정으로 외부강의 신고를 '마친 날부터 10일 이내' 사후 신고로 바꾸었다. 국가·지방자치단체(교육청·국공립학교 포함)가 요청한 강의, 사례금을 받지 않는 강의는 신고 대상이 아니다.","신고와 별개로 모든 외부강의는 요청기관 공문에 근거해 학교장 사전 결재를 받는다(예규 제10장). 근무시간 중이면 직무 관련 강의는 출장, 그 밖은 연가·외출·조퇴로 복무를 처리한다.","시·도교육청 가운데는 나이스 외부강의 등록으로 미리 신고하게 하는 곳도 있다. 따라서 강의 전에 결재와 소속 교육청 방식의 신고를 하고, 사례금이 확정되면 5일 안에 보완하는 방식이 안전하다."],"basis":"청탁금지법 제10조제2항(2019.11.26. 개정); 국가공무원 복무·징계 관련 예규 제10장 3-다·라·자; 공무원 행동강령 제15조제2항"},{"title":"학원 관련 겸직 — 원칙은 금지, 공익 목적만 예외","body":["교육부 가이드라인은 학원법상 학교교과교습학원과 관련된 강의·문항 출제·출판·컨설팅 일체를 교원에게 원칙적으로 금지한다. 학원·학원강사·출판사 등 계약 상대방과 관계없이 학원 교재를 만드는 활동, 학원으로 등록하지 않은 업체의 유상 강의영상·원격 컨설팅도 포함된다. 계속성이 없는 1회 특강도 청렴·품위유지 의무에 따라 금지다.","예외는 공익성이다. 에듀테크 업체의 정부사업 컨설팅, 디지털교과서·교원연수자료 개발, 검인정 교과서 출판사의 참고서·문제집 저작처럼 특정 학원생이 아닌 대중을 위한 결과물은 겸직심사위원회 심사를 거쳐 허가될 수 있다.","평생직업교육학원(직업기술·성인 어학 등)은 심사 후 허가될 수 있지만 대입 실기학원·편입학원 출강은 금지다. 교육과정평가원·EBS·대학·일반 출판사처럼 학원과 무관한 곳은 계속성이 있으면 허가 후 가능하다."],"basis":"교육부 「사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인」(2023.12.) 4, 참고"}],"tables":[{"title":"활동별 겸직 허가·신고 판단","head":["활동","겸직 허가","외부강의 신고","비고"],"rows":[["1회성 외부강의(사례금 있음, 민간 요청)","불필요","필요(마친 날부터 10일)","학교장 사전 결재·공문 필수"],["교육청·국공립학교 요청 강의","불필요","불필요","1개월 넘게 계속 출강하면 겸직 허가"],["대학 시간강사·겸임교수, 1개월 넘는 계속 출강","필요","겸직 허가로 갈음","출강계약서 첨부. 근무시간 중이면 연가 등 복무 처리"],["유튜브(수익창출 요건 충족 후 계속)","필요(채널별, 최대 1년)","해당 없음","겸직심사위원회 필수"],["1회 저술·번역","불필요","기고 사례금이면 신고 대상","주기적 저술·학습지 집필은 허가 필요"],["비영리법인 이사·감사","필요","해당 없음","정관·회의록·취임승낙서 첨부"],["학원 강의·학원용 교재·문항 제작","원칙 불가","-","공익 목적 예외만 위원회 심의"],["주택·상가 임대(지속적 관리)","필요","해당 없음","단순 임대는 허가 대상 아님"]],"note":"출처: 국가공무원 복무·징계 관련 예규 제9장·제10장(2026.6.23.), 교육부 사교육 관련 교원 겸직 허가 가이드라인(2023.12.), 청탁금지법 제10조."},{"title":"외부강의등 사례금 상한(청탁금지법 시행령 별표 2)","head":["대상","1시간당(기고 1건당)","1시간 초과 시"],"rows":[["각급 학교 장·교직원(국공립 교원 포함), 학교법인·언론사 임직원","100만원","총액 제한 규정 없음"],["공무원·공직유관단체 임직원(학교 교직원 제외)","40만원","총액 60만원(150%)"],["외국기관 지급","지급기관 기준","-"]],"note":"강의료·원고료·출연료 등 명목 불문 합산. 소속기관에서 여비를 받지 않은 경우 여비 규정 범위의 실비 교통·숙박·식비는 제외. 2026.6.30. 개정 시행령 기준."}],"faq":[{"q":"책 한 권을 냈는데 인세가 계속 들어와요. 겸직 허가를 받아야 하나요?","a":"1회적인 저술은 겸직 허가 대상이 아니다. 다만 주기적으로 개정판을 내거나 연·월 단위로 집필 계약을 맺는 등 계속성이 있으면 허가를 받아야 하고, 직접 출판·판매하거나 학습지·문제집을 주기적으로 써서 원고료를 받으면 영리업무에 해당한다. 학원용 교재라면 원칙적으로 불가다."},{"q":"유튜브 채널이 있는데 아직 수익이 없어요. 신청해야 하나요?","a":"수익창출 요건(구독자 1,000명·연간 시청 4,000시간)을 채우기 전이면 신청 대상이 아니다. 요건을 채운 뒤에도 계속 운영하려면 새 영상을 올리기 전에 채널별로 신청한다. 직무와 관련된 내용을 다루는 채널이면 수익과 관계없이 학교장에게 사전 보고해야 한다."},{"q":"교육지원청이 부른 연수 강의도 신고하나요?","a":"하지 않는다. 요청자가 국가나 지방자치단체(교육청과 그 소속기관 포함)면 신고 대상이 아니다. 다만 학교장 사전 결재와 복무 처리(출장 등)는 해야 하고, 1개월 넘게 계속 출강하면 겸직 허가를 받는다."},{"q":"민간 연수에서 2시간 강의하고 150만원을 받았어요. 괜찮나요?","a":"교원은 1시간당 100만원이 상한이고 총액 제한 규정이 없으므로 2시간 150만원은 상한 안이다. 사례금을 받았으니 마친 날부터 10일 안에 소속 교육청 방식으로 신고한다. 만약 1시간 강의에 150만원을 받았다면 50만원이 초과분이므로 안 날부터 2일 안에 신고하고 돌려준다."},{"q":"겸직 허가를 한 번 받으면 계속 유효한가요?","a":"아니다. 교육부 가이드라인에 따라 교원 겸직 허가 기간은 최대 1년이고, 인터넷 개인방송도 최대 1년이다. 계속하려면 종료 1개월 전까지 연장을 신청하고, 전보로 학교가 바뀌면 새 학교에 다시 신청한다."}],"record":"겸직은 학교장의 허가 공문(허가 기간·준수사항 포함)으로 남기고 학교는 겸직허가 대장을 둔다. 겸직 활동이나 외부강의로 근무시간 중 자리를 비우면 직무 관련 강의는 출장, 그 밖은 연가·외출·조퇴로 근무상황을 기록한다(요청기관이 교통편·여비를 주면 여비 부지급 출장). 사례금 받는 외부강의 신고는 소속 교육청이 정한 방식(나이스 외부강의 등록 또는 외부강의등 신고서 결재)으로 한다.","sources":[{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 2026.6.23.) 제9장 영리업무 금지 및 겸직허가, 제10장 외부강의","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/국가공무원복무·징계관련예규"},{"title":"국가공무원 복무규정(시행 2026.6.23.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원복무규정"},{"title":"부정청탁 및 금품등 수수의 금지에 관한 법률(시행 2025.1.21.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/부정청탁및금품등수수의금지에관한법률"},{"title":"부정청탁 및 금품등 수수의 금지에 관한 법률 시행령(대통령령 제36485호, 시행 2026.6.30.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/부정청탁및금품등수수의금지에관한법률시행령"},{"title":"한눈에 보는 청탁금지법 — 외부강의등","publisher":"국민권익위원회","year":2026,"url":"https://www.acrc.go.kr/menu.es?mid=a10101060400"},{"title":"청탁금지법 질의응답 — 초등교사 외부강의 사례금 및 강의신고 관련 문의(2022.11.21. 답변)","publisher":"국민권익위원회","year":2022,"url":"https://acrc.go.kr/board.es?act=view&bid=130&list_no=42544&mid=a10502120000&nPage=1"},{"title":"교육부 공무원 행동강령(교육부훈령, 시행 2023.11.2.)","publisher":"국가법령정보센터","year":2023,"url":"https://www.law.go.kr/행정규칙/교육부공무원행동강령"},{"title":"사교육 카르텔 근절을 위한 교원 겸직 허가 가이드라인(2023.12.)","publisher":"교육부","year":2023,"url":"https://www.moe.go.kr/boardCnts/fileDown.do?m=020402&s=moe&fileSeq=c98a151b972691a3ead200aa2e3dce05"},{"title":"교원의 사교육업체 관련 겸직허가 지침(가이드라인) 마련(보도자료)","publisher":"교육부(대한민국 정책브리핑)","year":2023,"url":"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156608375"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호) 첨부 PDF","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/LSW/flDownload.do?flSeq=166347779"},{"title":"공무원 행동강령(대통령령 제32661호) 제15조","publisher":"국가법령정보센터(국민권익위원회)","year":2022,"url":"https://www.law.go.kr/법령/공무원행동강령"},{"title":"교육부 공무원 행동강령(교육부훈령 제459호, 2023.11.2.) 별지 제5호·제5호의2·제8호·제13호","publisher":"교육부(국가법령정보센터)","year":2023,"url":"https://www.law.go.kr/행정규칙/교육부공무원행동강령"}],"verified":"2026-09-29","uncertain":["겸직 허가 기간: 인사혁신처 예규는 일반 겸직을 '2년 이내 원칙'으로, 교육부 교원 겸직 가이드라인(2023)은 교원을 '최대 1년'으로 정했다. 여기서는 교원 기준(1년)을 적었다","교원 사례금 상한 100만원은 청탁금지법 시행령 별표 2 문언과 국민권익위원회 2022년 답변에 근거했다. 시·도교육청이 행동강령으로 교원에게 더 낮은 상한을 두는지는 교육청마다 확인하지 못했다","사립학교 교원은 겸직 허가권자가 학교법인(이사장) 쪽이고 복무 기준은 사립학교법·정관을 따르므로 여기 절차와 다를 수 있다","교육부 가이드라인 PDF 표지는 '(안)'으로 표기되어 있으나 교육부 보도자료(2023.12.28.)는 확정·시행으로 발표했다","외부강의 신고 방식(나이스 등록 여부)과 횟수 상한은 시·도교육청 행동강령마다 다를 수 있어 전국 공통으로 확인하지 못했다"],"related":["anti-graft","business-trip","leave-annual","discipline-appeal"]},{"id":"anti-graft","title":"청탁금지법과 선물 — 학부모·학생 선물, 스승의 날, 부정청탁·금품 신고와 반환","aka":["청탁금지법","김영란법","스승의 날","카네이션","학부모 선물","학생 선물","기프티콘","커피 쿠폰","음료수","상담 때 선물","졸업생 선물","작년 담임 선물","금품 반환","선물 돌려주기","부정청탁","성적 청탁","청탁 신고","행동강령","경조사 알림","촌지"],"category":"겸직·청렴","urgency":"당일","roles":["교사 본인","행동강령책임관","청탁방지담당관","학교장(소속기관장)","학부모·학생(제공자)"],"summary":"교원은 청탁금지법의 공직자등(각급 학교의 장과 교직원)이어서 직무 관련이 있으면 금액과 관계없이 금품을 받을 수 없다. 국민권익위원회는 담임·교과교사와 학생·학부모 사이 선물은 5만원 이하라도 허용되지 않는다고 본다. 예외는 학생이 직접 쓴 손편지, 학생대표가 공개적으로 드리는 카네이션·꽃, 성적평가가 끝난 뒤 가액 기준 안의 선물, 졸업 후 1회 100만원 이하 선물 정도다. 금품을 받았으면 지체 없이 돌려주거나 거절하고 학교장에게 서면 신고하며, 돌려주기 어려우면 학교장에게 인도한다. 부정청탁은 거절 의사를 분명히 밝히고, 같은 청탁을 다시 받으면 서면으로 신고한다. 헷갈리면 행동강령책임관과 먼저 상담한다.","first":["받은 물건·쿠폰이 있으면 쓰지 말고 바로 제공자에게 돌려준다. 돌려준 방법(택배 송장, 문자, 계좌 반환 내역)을 남긴다","지체 없이 학교 행동강령책임관에게 알리고 학교장에게 서면으로 신고한다. 신고서는 소속 시·도교육청 행동강령 별지 서식을 쓴다(교육부 공무원 행동강령은 별지 제14호 '수수 금지 금품등 신고서')","음식처럼 상하는 물건, 누가 보냈는지 모르는 물건, 돌려주기 어려운 물건은 학교장에게 인도한다. 학교는 사진을 찍고 인도확인서로 관리한다","성적·수행평가·생활기록부·학급 배정 등에 대한 부탁을 받으면 그 자리에서 부정청탁이라 알리고 거절한다. 같은 부탁이 또 오면 서면 신고한다","헷갈리면 혼자 판단하지 말고 행동강령책임관과 먼저 상담한다. 상담 내용은 기록된다","학부모에게 본인 경조사를 알리지 않는다(행동강령 경조사 통지 제한)"],"steps":[{"stage":"미리 확인","when":"학기 초·선물 시즌 전","who":"교사 본인","what":"적용 대상과 직무관련성 확인","detail":"청탁금지법의 공직자등에는 각급 학교의 장과 교직원이 들어간다. 교직원 배우자는 직접 대상은 아니지만, 배우자가 직무 관련 수수 금지 금품을 받은 사실을 알고도 신고하지 않으면 교직원이 제재받는다. 기간제교원·강사 등 세부 적용 범위는 소속 교육청 청렴 안내로 확인한다. 권익위는 학생 평가·지도를 상시 담당하는 담임·교과교사와 학생·학부모, 학부모회·학교운영위원회와 교장·교감 사이에는 밀접한 직무관련성이 있어 가액 기준 안의 선물도 허용되기 어렵다고 본다.","basis":"청탁금지법 제2조제2호다목·제8조·제9조제1항제2호·제22조제1항제2호; 국민권익위원회 '스승의 날 알아야 할 청탁금지법 Q&A'(2024)"},{"stage":"미리 확인","when":"선물을 받기 전 판단할 때","who":"교사 본인","what":"허용되는 경우와 안 되는 경우 구분","detail":"허용: 학생이 직접 쓴 손편지·감사카드, 스승의 날 학생대표 등이 공개적으로 드리는 카네이션·꽃, 학년이 끝나 성적평가 업무가 끝난 전 담임에게 사교·의례 목적의 5만원 이하 선물(농수산물·농수산가공품 15만원), 졸업 뒤 직무관련성이 없는 은사에게 1회 100만원·연 300만원 이하 선물. 불허: 학생 개인이 주는 카네이션, 학생들이 돈을 모아 산 5만원 이하 선물, 상담 때 학부모가 건네는 음료, 학부모회의 교장·교감 선물. 백화점·문화·지역사랑상품권 같은 금액상품권은 선물 가액 예외에도 들지 않는다.","basis":"국민권익위원회 '스승의 날 알아야 할 청탁금지법 Q&A'(2024), '스승의 날 청탁금지법 카드뉴스'(2023); 청탁금지법 제8조제3항제2호·제8호, 시행령 별표 1"},{"stage":"사용·이행","when":"부정청탁을 받은 즉시","who":"교사 본인","what":"부정청탁임을 알리고 거절","detail":"각급 학교의 입학·성적·수행평가 등을 법령에 어긋나게 처리·조작해 달라는 요구는 법이 정한 부정청탁 유형이다(제5조제1항제10호). 받았으면 청탁한 사람에게 부정청탁임을 알리고 거절 의사를 명확히 밝힌다. 부정청탁을 받고 그대로 직무를 수행하면 2년 이하 징역 또는 2천만원 이하 벌금이다. 법령상 절차에 따른 이의신청, 공개적인 요구, 처리 기한·진행상황 문의, 제도 설명 요청은 부정청탁이 아니다.","basis":"청탁금지법 제5조·제6조·제7조제1항·제22조제2항제1호"},{"stage":"신청·보고","when":"같은 청탁을 다시 받았을 때","who":"교사 본인 → 학교장","what":"부정청탁 서면 신고","detail":"거절했는데도 같은 부정청탁을 다시 받으면 학교장에게 서면(전자문서 포함)으로 신고한다. 감독기관(교육청)·감사원·수사기관·국민권익위원회에 신고할 수도 있다. 공공기관은 청탁방지담당관을 지정해 부정청탁 신고·상담을 받게 되어 있으니 학교(또는 교육청)에서 누가 맡는지 확인한다.","basis":"청탁금지법 제7조제2항·제6항·제20조"},{"stage":"결재·승인","when":"신고를 받은 뒤","who":"학교장(청탁방지담당관)","what":"확인과 조치","detail":"학교장은 신고의 경위·내용·증거를 조사해 부정청탁인지 신속히 확인한다. 수사가 필요하면 수사기관에 통보하고, 과태료 대상이면 법원에 위반 사실을 통보한다. 직무 수행에 지장이 있으면 해당 교사의 직무 참여 일시중지, 직무 대리자 지정, 전보 등을 할 수 있고, 대체가 매우 어렵거나 영향이 작으면 계속 수행하게 하되 공정성을 주기적으로 점검한다. 부정청탁 내용과 조치는 기록·관리하고 홈페이지 등에 공개할 수 있다.","basis":"청탁금지법 제7조제3항~제5항·제7항"},{"stage":"사용·이행","when":"금품을 받았거나 제공 의사를 들었을 때","who":"교사 본인","what":"지체 없이 반환·거부","detail":"받은 금품은 제공자에게 지체 없이 돌려주거나 거부 의사를 밝힌다. 배우자가 받은 사실을 알게 된 경우도 같다. 공무원 행동강령은 배우자뿐 아니라 직계 존속·비속이 직무 관련 금품을 받지 않도록 할 의무까지 둔다. 반환에 든 비용(택배비 등)은 증명자료를 붙여 학교장에게 청구할 수 있다(교육부 행동강령 별지 제8호 '반환비용 청구 신청서' 등).","basis":"청탁금지법 제9조제2항, 시행령 제28조; 공무원 행동강령 제14조제5항·제21조제2항·제3항"},{"stage":"신청·보고","when":"지체 없이","who":"교사 본인 → 학교장","what":"수수 금지 금품 서면 신고","detail":"직접 받았거나 제공 약속·의사표시를 받은 경우, 배우자(공무원 행동강령은 직계 존속·비속 포함)가 받은 사실을 안 경우 학교장에게 지체 없이 서면으로 신고한다. 서식은 소속 시·도교육청 행동강령 별지를 쓴다(교육부 공무원 행동강령은 별지 제14호 '수수 금지 금품등 신고서'). 신고와 반환·거부를 했으면 형사처벌·과태료 대상에서 빠진다. 헷갈리면 먼저 행동강령책임관과 상담한다.","basis":"청탁금지법 제9조제1항·제22조제1항제1호 단서·제23조제5항제1호 단서; 공무원 행동강령 제21조제1항; 교육부 공무원 행동강령 제23조제1항·별지 제14호"},{"stage":"신청·보고","when":"돌려주기 어려울 때","who":"교사 본인 → 학교장","what":"학교장에게 인도","detail":"멸실·부패·변질 우려가 있는 것(음식, 꽃 등), 제공자나 주소를 알 수 없는 것, 그 밖에 반환이 어려운 것은 학교장에게 인도한다. 익명으로 교무실 책상에 놓고 간 선물이 대표적이다. 학교는 인도받은 물건을 사진·영상으로
