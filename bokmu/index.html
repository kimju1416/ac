 남기고 인도확인서로 관리한다(교육부 행동강령 별지 제15호 '금품등 인도확인서').","basis":"청탁금지법 제9조제2항 단서; 공무원 행동강령 제21조제4항; 교육부 공무원 행동강령 제23조제4항·제5항"},{"stage":"결재·승인","when":"신고·인도를 받은 뒤","who":"학교장·행동강령책임관","what":"반환·처리와 기록","detail":"학교장은 수수 금지 금품이면 반환·인도하게 하거나 거부 의사를 표시하게 하고, 수사가 필요하면 수사기관에 통보한다. 인도받은 금품은 제공자를 확인해 신고 사실을 알리고 돌려주는 것이 원칙이다. 돌려줄 수 없으면 교육부 공무원 행동강령 기준으로는 경제적 가치가 없어진 것은 인도한 교사의 동의(별지 제16호 '금품등 폐기처분 동의확인서')를 받아 폐기, 상할 우려가 있는 것은 사회복지시설·공익단체에 기증, 그 밖에 금전적 가치가 있는 것은 국고에 귀속한다(10만원 미만 물품은 기증 가능). 시·도교육청 소속 학교는 소속 교육청 행동강령의 귀속 기준(교육비특별회계·학교회계 등)을 따른다. 처리 내용은 금품등 접수·처리 대장에 기록한다.","basis":"청탁금지법 제9조제3항·제4항; 교육부 공무원 행동강령 제23조제5항·제6항, 별지 제9호·제15호·제16호"},{"stage":"사후 관리","when":"평소","who":"교사 본인","what":"경조사 통지·사적 접촉 관리","detail":"공무원 행동강령은 직무관련자(학생·학부모 등)나 직무관련공무원에게 경조사를 알리는 것을 금지한다. 친족, 현재·과거 근무 기관 직원, 소속 종교·친목단체 회원에게 알리거나 신문·방송, 직원만 보는 내부망에 올리는 것은 된다. 직무관련자에게 사적 노무를 요구해서도 안 된다. 직무관련자와 골프·여행 등 사적 접촉을 할 때 신고하게 하는 조항은 시·도교육청 행동강령마다 있으니 확인한다.","basis":"공무원 행동강령 제13조의2·제17조"},{"stage":"이의·구제","when":"위반이 드러났을 때","who":"학교장·교육청·법원","what":"제재의 범위 알기","detail":"동일인에게 1회 100만원 또는 회계연도 300만원을 넘게 받으면 직무관련성과 관계없이 3년 이하 징역 또는 3천만원 이하 벌금이다. 직무와 관련해 그 이하를 받으면 받은 가액의 2배 이상 5배 이하 과태료다. 신고하고 반환·인도·거부했으면 둘 다 면제된다. 제공한 학부모도 같은 기준으로 형사처벌 또는 과태료 대상이다. 과태료는 법원(비송사건절차법)이 부과하고, 징계부가금이 의결되면 과태료를 부과하지 않는다.","basis":"청탁금지법 제22조제1항·제23조제5항·제6항·제7항; 국민권익위원회 '스승의 날 알아야 할 청탁금지법 Q&A'(2024)"},{"stage":"사후 관리","when":"매년","who":"학교장·청탁방지담당관·교사","what":"교육과 서약","detail":"공무원 행동강령은 기관장이 행동강령 준수 교육계획을 세워 매년 1회 이상 교육하고, 신규 임용 때도 교육하게 한다. 청탁금지법도 공공기관이 부정청탁·금품 수수 금지 교육을 하고 필요하면 서약서를 받게 한다. 학기 초 가정통신문으로 학부모에게 선물 금지 원칙을 미리 알리면 반환 부담이 줄어든다.","basis":"공무원 행동강령 제22조; 청탁금지법 제19조"}],"deadlines":[{"what":"수수 금지 금품 반환·거부","limit":"지체 없이","basis":"청탁금지법 제9조제2항"},{"what":"수수 금지 금품 신고","limit":"지체 없이 서면(소속 교육청 행동강령 별지, 교육부는 별지 제14호)","basis":"청탁금지법 제9조제1항; 공무원 행동강령 제21조제1항"},{"what":"부정청탁 신고","limit":"거절 후 같은 청탁을 다시 받았을 때 서면","basis":"청탁금지법 제7조제2항"},{"what":"선물 가액 범위(직무관련성이 없거나 끝난 경우)","limit":"음식물 5만원, 경조사비 5만원(화환·조화 10만원), 선물 5만원(농수산물·가공품 15만원, 설·추석 전 24일~후 5일 30만원)","basis":"청탁금지법 시행령 제17조·별표 1(2024.8.27. 개정)"},{"what":"직무관련성과 무관한 수수 한도","limit":"동일인 1회 100만원, 회계연도 300만원 초과 금지","basis":"청탁금지법 제8조제1항"}],"dont":["'5만원 이하니까 괜찮다'고 받지 않는다 — 담임·교과교사와 학생·학부모 사이는 가액 기준 안이어도 원활한 직무수행·사교 목적 예외가 인정되지 않는다(권익위)","학생 개인이 주는 카네이션·꽃을 받지 않는다 — 허용되는 것은 학생대표 등이 공개적으로 드리는 카네이션·꽃이다","상담 때 학부모가 가져온 음료·간식도 받지 않는다 — 권익위가 불허 사례로 명시했다","받은 기프티콘·상품권을 쓰지 않는다 — 쓰면 반환이 불가능해지고 신고·반환에 따른 면책을 받기 어렵다","몰래 두고 간 선물을 그냥 두거나 나눠 먹지 않는다 — 제공자를 모르면 학교장에게 인도하는 것이 절차다","성적·평가 관련 부탁을 '알아보겠다'며 애매하게 넘기지 않는다 — 부정청탁임을 알리고 거절 의사를 명확히 밝혀야 한다","학급 단체방이나 알림장에 본인 경조사를 알리지 않는다 — 직무관련자에 대한 경조사 통지 제한 위반이다","배우자·가족이 받은 사실을 알고 덮지 않는다 — 알고도 신고하지 않으면 교원 본인이 처벌·과태료 대상이다"],"contacts":[{"name":"학교 행동강령책임관","tel":"소속 학교","note":"위반 여부 상담, 금품 신고 접수·처리. 학교별 지정은 소속 시·도교육청 행동강령으로 확인"},{"name":"교육부 반부패청렴담당관","tel":"044-203-6074","note":"교육부 공무원 행동강령 소관 부서(국가법령정보센터 기재 번호)"},{"name":"국민권익위원회 부패·공익신고 상담","tel":"1398","note":"부패·공익침해 신고 상담(권익위 '한눈에 보는 청탁금지법' 안내 번호). 정부민원안내콜센터 110도 안내됨"}],"forms":["수수 금지 금품등 신고서 — 교육부 공무원 행동강령 별지 제14호(시·도교육청 소속은 자체 행동강령 별지)","금품등 인도확인서 — 교육부 공무원 행동강령 별지 제15호(학교가 관리)","금품등 폐기처분 동의확인서 — 교육부 공무원 행동강령 별지 제16호","반환비용 청구 신청서 — 교육부 공무원 행동강령 별지 제8호","부정청탁 신고서(서면·전자문서) — 신고자 인적사항, 청탁자, 청탁 일시·장소·내용 기재","위반 여부 상담 기록 — 상담기록관리부(교육부 행동강령 별지 제10호, 책임관 관리)","반환 증빙: 택배 송장, 반환 안내 문자, 계좌 반환 내역"],"law":[{"name":"부정청탁 및 금품등 수수의 금지에 관한 법률","article":"제5조·제7조","point":"성적·수행평가 등을 법령 위반으로 처리하게 하는 요구는 부정청탁. 받으면 거절 의사를 명확히 하고, 다시 받으면 소속기관장에게 서면 신고"},{"name":"부정청탁 및 금품등 수수의 금지에 관한 법률","article":"제8조·제9조","point":"1회 100만원·연 300만원 초과 금지, 직무 관련이면 그 이하도 금지(가액 범위 내 사교·의례 선물 등 예외). 받으면 지체 없이 서면 신고하고 반환·거부, 반환 곤란 시 인도"},{"name":"부정청탁 및 금품등 수수의 금지에 관한 법률","article":"제22조·제23조","point":"100만원 초과 수수 3년 이하 징역·3천만원 이하 벌금, 직무 관련 100만원 이하 수수는 2~5배 과태료. 신고·반환하면 제외. 제공자도 처벌"},{"name":"부정청탁 및 금품등 수수의 금지에 관한 법률 시행령","article":"제17조·별표 1","point":"음식물 5만원, 경조사비 5만원(화환 10만원), 선물 5만원(농수산물 15만원, 명절 기간 30만원). 물품·용역상품권은 선물, 금액상품권은 제외"},{"name":"공무원 행동강령","article":"제13조의2·제14조·제17조·제18조·제21조","point":"사적 노무 요구 금지, 배우자·직계존비속 수수 방지 의무, 직무관련자 경조사 통지 금지, 위반 여부 상담, 수수 금지 금품 서면 신고·반환·인도. 각 기관은 이를 바탕으로 기관별 행동강령을 둔다(제24조)"},{"name":"교육부 공무원 행동강령(교육부훈령 제459호)","article":"제23조, 별지 제8호·제14호·제15호·제16호","point":"수수 금지 금품 신고서·인도확인서·폐기처분 동의확인서·반환비용 청구 신청서 서식과 인도 금품 처리 기준(폐기·기증·국고 귀속)"}],"deep":[{"title":"왜 5만원 이하 선물도 안 되나","body":["청탁금지법은 직무와 관련 있으면 대가성과 관계없이 금품을 받지 못하게 하고, 예외로 '원활한 직무수행 또는 사교·의례·부조 목적'의 가액 범위 안 음식물·선물 등을 허용한다.","권익위는 학생 평가·지도를 상시 담당하는 교사와 학생·학부모 사이 선물은 이 목적을 벗어난다고 본다. 그래서 가액과 관계없이 예외가 적용되지 않는다. 학부모회·학교운영위원회가 교장·교감에게 주는 선물도 같은 이유로 어렵다.","반대로 학년이 끝나 성적평가가 끝나면 직무관련성이 약해져 가액 범위(5만원, 농수산물 15만원) 안의 사교·의례 선물이 가능하고, 졸업하면 직무관련성이 없어져 1회 100만원 이하가 가능하다."],"basis":"청탁금지법 제8조제2항·제3항제2호; 국민권익위원회 '스승의 날 알아야 할 청탁금지법 Q&A'(2024)"},{"title":"기프티콘은 선물인가","body":["2023년 8월 30일 시행령 개정 뒤로 특정 물품·용역의 수량이 적힌 물품상품권·용역상품권(예: 음료 1잔 교환 모바일 쿠폰)은 선물에 들어간다. 백화점·온누리·지역사랑·문화상품권처럼 금액이 적힌 금액상품권은 선물 예외에 해당하지 않는다.","다만 이것은 가액 범위 예외가 적용되는 관계에서의 이야기다. 현재 담임·교과교사와 학생·학부모 사이는 선물 자체가 허용되지 않으므로 기프티콘도 받을 수 없다. 받았으면 사용하지 말고 반환(취소·반송)하고 신고한다.","권익위 2023년 5월 카드뉴스는 진급 후 기프티콘을 불가로 안내했는데, 이는 상품권 개정 시행(2023.8.30.) 전에 나온 안내다. 현행 별표 1은 물품상품권을 선물로 본다."],"basis":"청탁금지법 시행령 별표 1 제3호·비고 다목; 국민권익위원회 청탁금지법 질의응답(모바일 상품권)"},{"title":"받고 나서의 처리 순서","body":["① 반환 또는 거부(지체 없이) → ② 학교장에게 서면 신고(지체 없이, 소속 교육청 행동강령 별지 신고서) → ③ 반환이 어려우면 학교장에게 인도(학교가 사진·인도확인서로 관리) → ④ 학교장이 반환·기증·폐기·귀속 처리하고 대장에 기록 → ⑤ 반환 비용 청구.","이 절차를 밟은 교원은 형사처벌과 과태료에서 제외된다. 반대로 받은 뒤 쓰거나 숨기면 가액에 따라 형사처벌(100만원 초과) 또는 2~5배 과태료(직무 관련 100만원 이하)와 징계를 함께 받을 수 있다.","제공한 학부모는 교사가 신고·반환해도 처벌 대상이다. 학기 초에 선물 금지 원칙을 안내해 두는 것이 학부모를 보호하는 길이다."],"basis":"청탁금지법 제9조·제22조·제23조; 공무원 행동강령 제21조; 교육부 공무원 행동강령 제23조; 국민권익위원회 카드뉴스(2023) Q8"}],"tables":[{"title":"스승의 날·선물 상황별 허용 여부","head":["상황","허용","근거·비고"],"rows":[["학생이 직접 쓴 손편지·감사카드","가능","금품에 해당하지 않음"],["학생대표 등이 공개적으로 드리는 카네이션·꽃","가능","사회상규(제8조제3항제8호)"],["학생 개인이 담임·교과교사에게 주는 카네이션","불가","직무관련성"],["학생들이 모금한 5만원 이하 선물","불가","가액 기준 안이어도 예외 불인정"],["상담 때 학부모가 주는 음료","불가","학부모-담임 간 선물"],["학부모회·학교운영위원회가 교장·교감에게 주는 선물","불가","밀접한 직무관련성"],["학년이 끝나 성적평가가 끝난 전 담임에게 주는 선물","5만원 이하(농수산물 15만원) 가능","사교·의례 목적. 금액상품권 제외"],["졸업 후 은사에게 주는 선물","1회 100만원·연 300만원 이하 가능","직무관련성 없음"]],"note":"출처: 국민권익위원회 '스승의 날 알아야 할 청탁금지법 Q&A'(2024, 정책브리핑), '스승의 날 청탁금지법 카드뉴스'(2023). 교사가 신고·반환해도 제공자는 제재 대상."},{"title":"가액 범위(직무관련성이 없거나 끝난 경우의 예외 한도)","head":["구분","한도"],"rows":[["음식물(함께 하는 식사·다과·주류·음료)","5만원"],["경조사비(축의금·조의금)","5만원(대신하는 화환·조화 10만원, 함께 받으면 합산 10만원)"],["선물(물품·물품상품권·용역상품권)","5만원"],["농수산물·농수산가공품(원료 50% 초과) 선물","15만원(설·추석 전 24일~후 5일 30만원)"]],"note":"금전, 금액상품권 등 유가증권은 선물이 아니다. 2가지 이상을 함께 받으면 합산하되 가장 높은 한도를 넘지 못한다. 출처: 청탁금지법 시행령 제17조·별표 1(2024.8.27. 개정)."}],"faq":[{"q":"스승의 날에 반 아이들이 카네이션을 달아 주려고 해요. 받아도 되나요?","a":"학생대표 등이 스승의 날에 공개적으로 드리는 카네이션·꽃은 사회상규상 허용될 수 있다. 학생 한 명 한 명이 개인적으로 주는 카네이션은 안 된다. 손편지·감사카드는 괜찮다."},{"q":"작년 담임이었던 학생이 커피 쿠폰을 보냈어요.","a":"학년이 끝나 성적평가 업무가 끝났다면 사교·의례 목적의 5만원 이하 선물은 가능하다. 음료 1잔처럼 물품이 적힌 모바일 교환권은 선물로 본다(2023.8.30. 시행령 개정). 다만 올해도 그 학생을 가르치거나 평가하면 직무관련성이 있어 받을 수 없다. 금액이 적힌 상품권은 안 된다."},{"q":"택배로 온 선물을 이미 받았어요. 어떻게 하나요?","a":"뜯었더라도 쓰지 말고 제공자에게 지체 없이 돌려보내고, 학교장에게 서면으로 신고한다(소속 교육청 행동강령 별지 신고서). 음식처럼 상하거나 보낸 사람을 모르면 학교장에게 인도한다. 반송비는 증빙을 붙여 청구할 수 있다. 이렇게 처리하면 교사는 제재 대상에서 빠진다."},{"q":"학부모가 '수행평가 점수 좀 잘 봐 달라'고 해요.","a":"성적·수행평가를 법령에 어긋나게 처리해 달라는 부정청탁이다. 부정청탁임을 알리고 거절 의사를 분명히 밝힌다. 같은 청탁을 다시 받으면 학교장에게 서면 신고한다. 부정청탁을 한 학부모는 과태료 대상이고, 청탁대로 처리한 교사는 형사처벌 대상이다. 정식 이의신청 절차로 문의하는 것은 부정청탁이 아니다."},{"q":"제 결혼 소식을 학급 학부모 단체방에 알려도 되나요?","a":"안 된다. 공무원 행동강령은 학생·학부모 같은 직무관련자에게 본인 경조사를 알리는 것을 금지한다. 친족, 현재·과거 근무 학교 교직원, 소속 종교·친목단체 회원에게 알리거나 교직원만 보는 내부망에 올리는 것은 된다."}],"record":"나이스 복무 기록 대상은 아니다. 금품을 신고하면 학교장(행동강령책임관)이 금품등 접수·처리 대장에 제공받은 자, 금품 내용, 제공자, 제공 일시, 처리 경위를 기록한다(교육부 행동강령 별지 제9호 같은 대장). 인도받은 금품은 사진·영상과 인도확인서로 관리한다. 부정청탁 신고는 청탁방지담당관이 기록·관리하고, 위반 여부 상담은 상담기록관리부에 남는다. 교사는 반환 증빙(송장·문자·이체 내역)과 신고서 사본을 보관한다.","sources":[{"title":"부정청탁 및 금품등 수수의 금지에 관한 법률(시행 2025.1.21.)","publisher":"국가법령정보센터(국민권익위원회)","year":2025,"url":"https://www.law.go.kr/법령/부정청탁및금품등수수의금지에관한법률"},{"title":"부정청탁 및 금품등 수수의 금지에 관한 법률 시행령(시행 2026.6.30.)","publisher":"국가법령정보센터(국민권익위원회)","year":2026,"url":"https://www.law.go.kr/법령/부정청탁및금품등수수의금지에관한법률시행령"},{"title":"공무원 행동강령(대통령령 제32661호) 제13조의2·제14조·제17조·제21조·제22조","publisher":"국가법령정보센터(국민권익위원회)","year":2022,"url":"https://www.law.go.kr/법령/공무원행동강령"},{"title":"스승의 날 알아야 할 청탁금지법 Q&A","publisher":"국민권익위원회(대한민국 정책브리핑)","year":2024,"url":"https://www.korea.kr/multi/visualNewsView.do?newsId=148928724"},{"title":"[카드뉴스·영상] 스승의 날 알아야 할 청탁금지법","publisher":"국민권익위원회","year":2023,"url":"https://www.acrc.go.kr/board.es?mid=a10106020000&bid=128&act=view&list_no=45168&tag=&nPage=1"},{"title":"한눈에 보는 청탁금지법 — 금품등 수수 금지","publisher":"국민권익위원회","year":2026,"url":"https://www.acrc.go.kr/menu.es?mid=a10101060300"},{"title":"교육부 공무원 행동강령(교육부훈령 제459호, 2023.11.2.) 제23조, 별지 제8호·제14호·제15호·제16호","publisher":"교육부(국가법령정보센터)","year":2023,"url":"https://www.law.go.kr/행정규칙/교육부공무원행동강령"}],"verified":"2026-09-29","uncertain":["교육부가 발간한 교육분야 청탁금지법 해설집·Q&A 최신판(2024~2026)은 찾지 못해 국민권익위원회 스승의 날 Q&A(2024)와 카드뉴스(2023)로 대신했다","'성적평가가 끝난 전 담임' 판단 시점(학년 말 성적 확정, 생활기록부 마감 등)을 권익위 공식 자료에서 구체적으로 정한 것은 찾지 못했다","사립학교 교원은 청탁금지법은 같이 적용되지만 시·도교육청 공무원 행동강령(교육감 소속 공무원 대상)은 적용되지 않으므로 법인 규정을 따로 확인해야 한다","청탁금지법 신고서 서식은 법령 별지로 정해져 있지 않다. 여기 넣은 서식은 교육부 공무원 행동강령(교육부 소속 공무원 대상) 별지라서, 시·도교육청 소속 교원은 소속 교육청 행동강령 별지(번호가 다르다)를 쓰는 것이 원칙이다","학교 행동강령책임관을 교감으로 지정하는지는 시·도교육청 행동강령마다 정한다. 전국 공통 규정은 확인하지 못했다","직무관련자와의 사적 접촉(골프·여행 등) 신고 조항은 대통령령 공무원 행동강령에서 삭제되었고(2022), 시·도교육청 행동강령마다 다를 수 있어 전국 기준으로 확인하지 못했다"],"related":["side-job","discipline-appeal","business-trip"]},{"id":"transfer","title":"전보(정기전보·비정기전보·초빙교사·시·도간 교류)","aka":["전보","정기전보","전보내신","내신서","학교 옮기기","학교 이동","만기","현임교 만기","시군 만기","전보점","전보 유예","전보 특례","비정기전보","하처","초빙교사","타시도 교류","타시도 전출","시도간 교환","부부별거","전과"],"category":"인사·보수","urgency":"미리 신청","roles":["교사 본인","학교 인사 담당(교무부)","교감","학교장(전보 내신·전보 유예·전입 요청)","교육지원청 인사 담당","시·도교육청(임용권자)","교육공무원인사위원회"],"summary":"공립 교원의 전보는 같은 직위·자격으로 근무 학교를 바꾸는 임용이고, 임용권자인 시·도교육감(또는 권한을 위임받은 교육장)이 해마다 세우는 전보계획에 따라 이뤄진다. 교육부 「교육공무원 인사관리규정」은 인사구역과 구역별 근무기간 같은 전보기준을 발령 6개월 전(불가피하면 3개월 전)까지 공개하도록 하고, 정기전보는 임용권자가 정한 기간 동안 같은 직위에 근속한 교원을 대상으로 한다. 그래서 현임교 만기 연수, 지역 만기, 전보점 계산, 특례·유예 사유, 내신서 서식과 제출 기한은 모두 소속 시·도교육청 인사관리기준(지침)으로 확인해야 한다. 학교장의 요청에 따른 비정기전보, 학교운영위원회 심의를 거치는 초빙교사, 다른 시·도로 옮기는 시·도간 교류는 정기전보와 절차가 따로 있다. 임용된 지 1년이 안 된 교원은 법이 정한 예외가 아니면 근무지를 바꿀 수 없다.","first":["소속 시·도교육청이 공개한 올해 교원 인사관리기준(전보 지침)을 찾아 현임교 근무 연수 상한, 지역(인사구역) 근무 연수 상한, 기준일을 확인한다 — 전보기준은 발령 6개월 전(불가피하면 3개월 전)까지 공개된다","나이스 인사기록카드에서 현재 학교·지역 근무 기간을 확인하고, 지침의 기준일 기준으로 만기에 해당하는지 셈한다","지침에 있는 전보 특례·유예 사유(부부교원, 노부모·장애 가족 부양, 다자녀, 장애교원, 출산 등)에 해당하는지 보고, 해당되면 증빙 서류를 미리 발급한다","학교 인사 담당·교감에게 교내 전보내신서 제출일을 묻는다 — 교육청 제출일보다 앞서고, 서식과 나이스 입력 방법은 교육청 공문에 붙어 온다","초빙교사나 다른 시·도 교류를 원하면 정기전보 내신과 별도 공고·공문(초빙은 학교별 공고, 시·도간 교류는 교육청 공문)을 따로 챙긴다","근무 예정 지역을 정해 채용된 교사(지역 제한 채용)는 임용 후 8년 동안 다른 지역 전보가 제한되니 본인 채용 조건부터 확인한다"],"steps":[{"stage":"미리 확인","when":"전보 발령 6개월 전까지(불가피하면 3개월 전)","who":"시·도교육청 → 교사 본인","what":"전보기준 공개와 확인","detail":"임용권자는 거리·교통 등 지리적 요건과 문화시설 보급 등을 고려해 인사구역을 정하고, 인사구역별 근무기간 등을 담은 전보기준을 전보발령 6개월 이전에 공개해야 한다. 인사운영상 불가피하면 3개월 이전에 공개할 수 있다. 교사는 이 기준(시·도교육청 인사관리기준·전보 지침)을 내려받아 자신이 올해 전보 대상인지부터 확인한다.","basis":"교육공무원 인사관리규정 제18조제1항, 제19조"},{"stage":"미리 확인","when":"내신 전","who":"교사 본인","what":"정기전보 대상인지 판단","detail":"교원의 학교 간 전보는 임용권자가 정하는 기간 동안 같은 직위에 근속한 사람을 대상으로 정기적으로 실시한다. 현임교·같은 지역에서 몇 년이면 옮겨야 하는지(만기)는 전국 공통 숫자가 없고 시·도교육청 기준으로 정한다. 다만 학교장이 교원의 동의를 받아 전보 유예를 요청하면 정기전보에서 빠질 수 있다.","basis":"교육공무원 인사관리규정 제20조제1항; 교육공무원임용령 제13조의3제5항"},{"stage":"미리 확인","when":"내신 전","who":"교사 본인","what":"전보 제한 사유 확인","detail":"교육공무원은 그 직위에 임용된 날부터 1년 안에는 기구 개편·정원 변경, 승진·강임, 대통령령이 정한 특별한 사유(징계, 배우자·직계존속 거주 지역으로의 전보, 임신 중이거나 출산 후 1년이 안 된 교원의 모성보호·육아 등)가 아니면 근무지를 바꿀 수 없다. 근무 예정 지역을 정해 채용된 교사는 임용일부터 8년 동안 다른 지역·기관으로 전보되지 않는다(기구 개편·정원 초과, 모성보호·육아 등 교육감이 정한 사유는 예외).","basis":"교육공무원법 제11조제2항, 제21조제1항; 교육공무원임용령 제13조의2제1항, 제13조의3제9항"},{"stage":"미리 확인","when":"내신 전","who":"교사 본인","what":"특례·우선 배치 대상인지 확인","detail":"임용권자는 장애교원, 다자녀를 양육하는 교원, 장애자녀를 양육하는 교원을 희망 근무지에 우선 배치하도록 노력해야 한다. 같은 시·도 안의 부부교원, 노부모·특수교육대상자 부양 교원 등에 대한 전보 특례는 전보권자가 정할 수 있으므로, 구체적인 요건(나이·동거 기간·증빙)은 소속 시·도교육청 기준으로 확인한다. 도서·벽지에서 3년 이상 계속 근무했다면 본인 희망을 참작해 도서·벽지 밖으로 전보해야 한다.","basis":"교육공무원 인사관리규정 제18조제5항, 제23조제3항; 교육공무원임용령 제13조의3제2항"},{"stage":"신청·보고","when":"시·도교육청이 정한 내신 기간","who":"교사 본인 → 학교 인사 담당","what":"전보내신서 작성·제출","detail":"전보 희망자와 만기자는 시·도교육청이 정한 서식으로 전보내신서를 내고, 희망 지역·특례·유예 사유와 증빙을 붙인다. 희망지를 적는 단위(시·군, 학교 등), 희망지로 못 갈 때의 선택지, 가산점 증빙 범위, 나이스 입력 여부는 교육청마다 다르므로 해당 연도 작성 요령을 그대로 따른다.","basis":"교육공무원 인사관리규정 제18조; 소속 시·도교육청 인사관리기준"},{"stage":"결재·승인","when":"내신 기간","who":"학교장","what":"학교 내신과 전보 유예·전입 요청","detail":"학교장은 교육과정 운영과 학교 발전을 위해 필요한 자격·능력을 갖춘 교원의 전입을 임용권자에게 요청하거나, 근무 중인 교원의 동의를 받아 전보 유예를 요청할 수 있다. 임용권자는 학교장 전입요청의 대상 교원 범위와 요청 방법을 전보계획에 넣어야 하고, 요청 내용을 인사교류에 반영하도록 노력해야 한다.","basis":"교육공무원임용령 제13조의3제5항·제7항·제8항; 교육공무원 인사관리규정 제18조제4항"},{"stage":"결재·승인","when":"발령 전","who":"시·도교육청(임용권자)","what":"전보 결정","detail":"임용권자는 교원의 생활근거지 근무나 희망 근무지 배치를 최대한 보장하고 전보의 공정성을 확보하도록 노력해야 한다. 전보 순위 산정 방식(전보점, 동점자 처리)과 배치 원칙은 시·도교육청 기준에 따르고, 승진·전직·전보 등 인사에 관한 기본계획은 교육공무원인사위원회 심의 사항이다.","basis":"교육공무원 인사관리규정 제18조제2항, 제31조제1항제2호"},{"stage":"사용·이행","when":"전보계획에서 정한 발령일","who":"교사 본인·전·후임 학교","what":"발령과 부임","detail":"정기전보 발령일은 시·도교육청 전보계획에서 정한다. 발령이 나면 맡던 업무를 인계하고 새 학교에 부임한다. 발령 뒤 인사기록카드 근무사항이 갱신되니 새 학교 인사 담당과 함께 확인한다.","basis":"교육공무원법 제2조제9항(전보의 뜻); 소속 시·도교육청 전보계획"},{"stage":"신청·보고","when":"학교별 초빙 공고 기간","who":"교사 본인","what":"초빙교사 응모(원할 때)","detail":"고등학교 이하 학교의 장은 교사자격증을 가진 사람 중 학교에 특별히 필요한 사람을 초빙교사로 임용해 달라고 임용권자에게 요청할 수 있고, 이때 학교운영위원회(유치원운영위원회) 심의를 거쳐야 한다. 초빙 대상 자리, 응모 자격, 초빙 기간, 제출 서류 등 세부 사항은 임용권자(시·도교육감)가 정하므로 학교별 공고와 교육청 계획을 확인한다. 초빙교원 임용은 교육공무원인사위원회 심의 사항이다.","basis":"교육공무원법 제31조제2항·제3항; 교육공무원임용령 제12조의7; 교육공무원 인사관리규정 제31조제1항제6호"},{"stage":"신청·보고","when":"시·도교육청 공문 기간","who":"교사 본인","what":"시·도간 교류 희망 신청(원할 때)","detail":"다른 시·도로 옮기려면 정기전보 내신과 별도로 소속 교육청이 안내하는 시·도간 교류 희망 신청을 한다. 신청 자격(근속 연수), 우선순위(부부 별거 등), 제한 사유, 상대 시·도의 전입 조건은 교육청마다 달라 해당 연도 계획을 두 교육청 모두 확인해야 한다. 교류는 두 시·도교육청 사이의 협의로 이뤄지므로 신청한다고 모두 성사되지 않는다.","basis":"교육공무원임용령 제13조의3제1항(인사교류 계획); 소속 시·도교육청 시·도간 교류 계획"},{"stage":"사후 관리","when":"재직 중 수시","who":"학교장 → 시·도교육청","what":"비정기전보","detail":"임용권자는 학교장의 전보 요청 등으로 교육상 전보가 불가피하다고 인정하면 정기전보 기간 이내라도 전보할 수 있다. 학교장은 직무수행능력이 부족하거나 근무성적이 저조한 교원(요청 전에 능력개발 직무연수 부과), 징계처분을 받은 교원, 교육공무원법 제10조의3제1항 사유 관련 주의·경고를 받은 교원, 그 학교 재직 중 3회 이상 주의·경고를 받은 교원 등에 대해 전보를 요청할 수 있고, 임용권자는 교원 운용에 지장이 없으면 특별한 사유가 없는 한 응해야 한다.","basis":"교육공무원 인사관리규정 제21조"},{"stage":"사후 관리","when":"전보 뒤","who":"교사 본인","what":"전보 후 확인할 것","detail":"전보로 학교가 바뀌면 성과상여금은 지급기준일 현재 학교에서 받고, 옮긴 지 2개월이 안 됐으면 새 학교가 이전 학교에 평가 자료를 요청할 수 있다. 이전 학교 실적 증빙을 챙겨 두고, 인사기록카드 근무사항이 제대로 갱신됐는지 확인한다.","basis":"2025년 교육공무원 성과상여금 지급 지침(교육부 교원양성연수과-1270 반영)"}],"deadlines":[{"what":"전보기준(인사구역·근무기간) 공개","limit":"전보발령 6개월 이전(인사운영상 불가피하면 3개월 이전)","basis":"교육공무원 인사관리규정 제19조"},{"what":"임용 후 전보 제한","limit":"그 직위에 임용된 날부터 1년 이내 근무지 변경 금지(법정 예외 제외)","basis":"교육공무원법 제21조제1항"},{"what":"지역 제한 채용 교사의 전보 제한","limit":"임용된 날부터 8년(기구 개편·정원 초과, 모성보호·육아 등 교육감이 정한 사유는 예외)","basis":"교육공무원임용령 제13조의3제9항"},{"what":"도서·벽지 계속 근무자","limit":"3년 이상 계속 근무하면 본인 희망을 참작해 도서·벽지 밖으로 전보(본인이 원하지 않으면 예외)","basis":"교육공무원임용령 제13조의3제2항"},{"what":"현임교·지역 만기 연수, 내신서 제출 기한","limit":"전국 공통 기준 없음 — 소속 시·도교육청 인사관리기준으로 확인","basis":"교육공무원 인사관리규정 제19조·제20조"}],"dont":["다른 시·도나 인터넷에서 본 만기 연수를 그대로 믿지 않는다 — 현임교·지역 근무 상한은 시·도교육청마다 다르고 해마다 바뀔 수 있다","만기인데 내신 기간을 놓치지 않는다 — 교내 제출일이 교육청 제출일보다 앞서고, 만기자는 희망과 관계없이 전보 대상이 될 수 있다","특례·유예 증빙을 발령 직전에 모으려 하지 않는다 — 대부분 기준일 현재 동거·부양 기간 같은 요건이 있어 서류가 맞지 않으면 인정되지 않는다","교류나 특례를 노리고 주민등록만 옮기지 않는다 — 실제 거주·부양이 아니면 인정되지 않고, 위장 전입이 드러나면 교류 무효 등 불이익을 받는다","개인 사정을 교감·교장에게 말로만 전하고 끝내지 않는다 — 전보 유예·특례는 정해진 서식과 증빙을 내야 심의에 반영된다","임용 1년 안에 학교를 옮길 수 있다고 기대하지 않는다 — 법에서 정한 예외(모성보호·육아, 배우자·직계존속 거주지 전보 등)가 아니면 근무지 변경이 제한된다"],"contacts":[{"name":"소속 시·도교육청·교육지원청 교원인사 담당","tel":"소속 교육청","note":"전보기준·내신 일정·초빙·시·도간 교류 문의. 먼저 학교 교감·인사 담당에게 확인한다"}],"forms":["전보내신서(전과내신서) — 소속 시·도교육청 서식","전보 유예 신청서와 학교장 전보 유예 요청 서류 — 시·도교육청 서식","전보 특례 증빙(가족관계증명서, 주민등록등본, 건강보험 자격 확인, 배우자 재직증명서, 장애인 증명서 등 교육청이 정한 것)","학교장 전입 요청서 — 시·도교육청 서식","초빙교사 응모 서류(지원서, 실적·교육활동 계획서 등) — 학교 공고·교육청 서식","시·도간 교류 희망 신청서와 증빙 — 교육청 공문 서식"],"law":[{"name":"교육공무원법","article":"제2조제9항, 제11조제2항, 제21조, 제31조","point":"전보의 뜻, 지역 제한 채용 교사의 전보 제한 근거, 임용 후 1년 이내 근무지 변경 금지, 학교장의 초빙교사 임용 요청"},{"name":"교육공무원임용령(2025. 9. 16. 시행)","article":"제12조의7, 제13조의2, 제13조의3","point":"초빙교사 요청 시 학교운영위원회 심의, 1년 이내 전보 예외 사유, 인사교류 계획·도서벽지 3년·학교장 전입 요청과 전보 유예 요청, 지역 제한 채용 교사 8년 전보 제한"},{"name":"교육공무원 인사관리규정(교육부훈령 제500호, 2024. 12. 10.)","article":"제17조, 제18조~제23조, 제31조","point":"매년 전보계획 수립, 희망지 배치 노력, 장애·다자녀·장애자녀 양육 교원 우선 배치, 전보기준 6개월 전 공개, 정기전보·비정기전보, 전보 특례, 인사위원회 심의 사항"}],"deep":[{"title":"전국 공통으로 정해진 것과 교육청이 정하는 것","body":["법령과 교육부 훈령이 전국 공통으로 정한 것은 큰 틀이다. 임용권자는 해마다 전보계획을 세워야 하고, 전보기준을 발령 6개월 전(불가피하면 3개월 전)까지 공개해야 하며, 정기전보는 임용권자가 정한 기간 동안 같은 직위에 근속한 사람이 대상이다. 임용 후 1년 이내 전보 금지, 도서·벽지 3년 근무자 전보, 지역 제한 채용 교사 8년 전보 제한, 비정기전보 요청 사유도 전국 공통이다.","반대로 인사구역을 어떻게 나누는지, 현임교·지역 근무 상한이 몇 년인지, 전보점을 어떻게 매기는지, 특례·유예의 세부 요건, 내신서 서식과 제출 날짜, 초빙교사 기간은 모두 시·도교육청 인사관리기준에서 정한다. 같은 사유라도 교육청마다 결과가 다를 수 있으니 반드시 올해 소속 교육청 기준 원문을 확인한다."],"basis":"교육공무원 인사관리규정 제18조~제23조; 교육공무원임용령 제13조의3"},{"title":"비정기전보는 어떤 경우에 되나","body":["비정기전보는 정기전보 기간이 차지 않았어도 교육상 불가피하면 하는 전보다. 교육부 훈령은 학교장이 요청할 수 있는 사유로 직무수행능력 부족·근무성적 저조(요청 전 직무연수 부과), 징계처분, 교육공무원법 제10조의3제1항 관련 주의·경고, 그 학교에서 3회 이상 주의·경고, 그 밖에 임용권자가 정하는 사유를 든다.","또 직위해제 후 복직, 감사결과 인사조치 지시, 직무수행능력이 부족하거나 근무성적이 극히 불량하거나 근무태도가 심히 불성실한 경우, 신체·정신상 장애로 장기요양이 필요한 경우는 계속 근무가 교육상 부적당한 경우로 보아 임용 1년 이내라도 전보할 수 있다. 같은 학교에 가족이 근무하거나 자녀가 재학하는 경우 등은 시·도교육청 기준이 따로 정하는 경우가 많다."],"basis":"교육공무원 인사관리규정 제17조, 제21조; 교육공무원임용령 제13조의2제1항제7호"},{"title":"임신·출산·육아 중인 교원의 전보","body":["임신 중이거나 출산 후 1년이 지나지 않은 교원의 모성보호·육아를 위해 필요하면 임용 후 1년이 안 됐어도 전보할 수 있다. 지역 제한 채용 교사도 모성보호·육아 등 교육감이 정한 사유가 있으면 8년 제한과 관계없이 전보될 수 있다.","교육부 훈령은 다자녀·장애자녀를 양육하는 교원을 희망 근무지에 우선 배치하도록 노력할 의무를 임용권자에게 지운다. 출산 예정 교원의 전보 유예, 자녀 양육에 따른 지역 만기 유예 같은 구체적 혜택은 교육청 기준에 있으니 해당 조항과 증빙을 확인한다."],"basis":"교육공무원임용령 제13조의2제1항제6호, 제13조의3제9항; 교육공무원 인사관리규정 제18조제5항"},{"title":"초빙교사와 시·도간 교류는 별도 절차다","body":["초빙교사는 학교장이 학교운영위원회 심의를 거쳐 임용권자에게 요청하고, 임용권자가 요청된 사람 중에서 임용하는 제도다. 초빙 자리, 응모 자격, 초빙 기간과 그동안의 전보 제한 등 세부 사항은 임용권자가 정한다.","시·도간 교류는 소속 교육청과 상대 교육청이 협의해 교원을 주고받는 인사교류라 정기전보와 신청 시기·서식이 다르다. 신청 자격, 우선순위, 제한 사유는 두 교육청 계획을 모두 확인해야 한다."],"basis":"교육공무원법 제31조; 교육공무원임용령 제12조의7, 제13조의3제1항"}],"tables":[{"title":"전보 관련 전국 공통 규정 한눈에","head":["구분","내용","근거"],"rows":[["전보계획","임용권자가 매년 수립, 학교장 전입요청 방법 포함","인사관리규정 제18조"],["전보기준 공개","인사구역·구역별 근무기간 등, 발령 6개월 전(불가피 시 3개월 전)","인사관리규정 제19조"],["정기전보","임용권자가 정한 기간 동안 같은 직위 근속자 대상, 학교장 전보 유예 요청 시 예외","인사관리규정 제20조"],["비정기전보","학교장 요청 등 교육상 불가피할 때, 정기전보 기간 이내라도 가능","인사관리규정 제21조"],["우선 배치 노력","장애교원, 다자녀·장애자녀 양육 교원","인사관리규정 제18조제5항"],["1년 이내 전보 금지","법정 예외(모성보호·육아, 배우자·직계존속 거주지 등) 제외","교육공무원법 제21조, 임용령 제13조의2"],["지역 제한 채용 교사","임용 후 8년간 다른 지역 전보 제한","임용령 제13조의3제9항"],["초빙교사","학교장이 학교운영위원회 심의 후 요청, 세부 사항은 임용권자","교육공무원법 제31조, 임용령 제12조의7"]],"note":"현임교·지역 만기 연수, 전보점, 특례·유예 세부 요건, 제출 기한은 시·도교육청 인사관리기준에서 정한다."}],"faq":[{"q":"현임교 몇 년이면 꼭 옮겨야 하나요?","a":"전국 공통 숫자는 없다. 교육부 훈령은 임용권자가 정한 기간 동안 근속한 사람을 정기전보 대상으로 한다고만 정하고, 실제 상한(현임교 몇 년, 지역 몇 년)은 소속 시·도교육청 인사관리기준에서 정한다. 이 기준은 발령 6개월 전(불가피하면 3개월 전)까지 공개된다."},{"q":"휴직 중인데 전보내신을 낼 수 있나요?","a":"휴직자의 전보내신 허용 여부와 예외는 시·도교육청 기준에서 정한다. 발령일 전에 복직할 사람만 예외로 받는 교육청이 있으니, 복직 예정일과 함께 교육청 지침 조항을 확인한다."},{"q":"임신 중인데 발령 1년이 안 됐어요. 집 가까운 곳으로 옮길 수 있나요?","a":"임신 중이거나 출산 후 1년이 지나지 않은 교원의 모성보호·육아를 위해 필요한 경우는 임용 후 1년 이내 전보 금지의 예외다. 다만 실제 전보 여부와 시기는 임용권자가 정하므로 학교를 통해 교육청에 요청하는 방법을 확인한다."},{"q":"우리 학교 교장선생님이 저를 붙잡을 수 있나요?","a":"학교장은 교육과정 운영에 필요한 경우 교원 본인의 동의를 받아 전보 유예를 임용권자에게 요청할 수 있다. 본인 동의가 필요하고, 유예 기간·요건은 교육청 기준에 따른다."},{"q":"초빙교사로 가면 그 기간에 다른 곳으로 전보할 수 있나요?","a":"초빙교사의 초빙 기간과 그 기간 중 전보·교류 제한은 임용권자가 정한다. 응모 전에 공고문과 교육청 초빙 계획의 제한 조항을 확인한다."}],"record":"전보는 나이스 교원인사 영역에서 처리되고, 발령 뒤 인사기록카드 근무사항에 반영된다. 전보내신서를 나이스에 입력해 출력하는 교육청이 많지만 메뉴와 입력 항목은 시·도교육청 작성 요령에 따른다. 교사는 내신 전에 인사기록카드의 학교별 근무 기간, 휴직·파견 기간, 가산점 관련 실적이 정확한지 확인하고, 틀린 부분은 학교 인사 담당에게 정정을 요청한다.","sources":[{"title":"교육공무원 인사관리규정(교육부훈령 제500호)","publisher":"국가법령정보센터","year":2024,"url":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000250466"},{"title":"교육공무원임용령(대통령령 제35744호, 2025. 9. 19. 시행)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원임용령"},{"title":"교육공무원법(2026. 2. 15. 시행)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"2025년 교육공무원 성과상여금 지급 지침(교육부 교원양성연수과-1270 반영, 전북특별자치도교육청 교원인사과)","publisher":"전북특별자치도교육청","year":2025,"url":"https://school.jbedu.kr/_cmm/fileDownload/jbdonghwa/M010301/1a2d17f9c04a1a63f875491eefd6f8e4"}],"verified":"2026-09-29","uncertain":["학교 내부 전보내신 마감일, 교육지원청별 관내 전보 기준은 학교·교육지원청마다 다르다","교육공무원 인사관리규정은 국가법령정보센터 현행본(교육부훈령 제500호, 2024. 12. 10.)으로 확인했다(2026. 9. 29. 조회 기준 현행)","시·도간 교류의 전국 공통 운영 원칙을 정한 교육부 문서는 공개 원문을 찾지 못해, 전국 본문에는 법령상 인사교류 계획 근거와 교육청 계획 확인만 적었다","정기전보 발령일은 법령에 정해진 날짜가 아니라 시·도교육청 전보계획에서 정한다","사립학교 교원의 전보(법인 내 전보)와 기간제교원은 이 절차의 대상이 아니다"],"related":["leave-of-absence","parental-leave","salary-step","performance-pay","discipline-appeal"]},{"id":"performance-pay","title":"교원 성과상여금(성과급) — 다면평가 반영, 등급 통보, 이의신청","aka":["성과급","성과상여금","교원 성과급","S등급","A등급","B등급","성과급 등급","성과급 이의신청","성과급 이의제기","다면평가","정량평가","정성평가","다면평가관리위원회","성과급 심사위원회","차등지급률","성과급 언제 나와","휴직자 성과급","기간제 성과급","성과급 제외"],"category":"인사·보수","urgency":"사후","roles":["교사 본인","다면평가관리위원회(학교 보수성과심의위원회 역할)","다면평가자","교감","학교장(차등지급률 결정·결과 통보)","행정실(지급)","시·도교육청(지침 시행·실태 점검)"],"summary":"교원 성과상여금은 3월 1일부터 다음 해 2월 말까지 1년의 근무 성과를 평가해 S·A·B 3등급으로 나눠 주는 개인성과급이다. 지급 기준일은 2월 말일이고, 평가대상기간 중 실제로 근무한 기간이 2개월 이상이어야 받으며 근무기간에 비례해 일할 계산된다. 학교는 별도 심사위원회 대신 다면평가관리위원회와 다면평가자가 평가를 맡고, 교육부 지침에 따라 다면평가 결과(정량·정성)를 쓰되 정성평가 반영 비율(0~20%)은 학교가 정하며 평가기준은 학교 홈페이지에 공개한다. 등급은 본인에게만 알리고, 학교장은 지급 전에 7일 이상 이의제기 기간을 둬야 하므로 통보를 받으면 정량 실적이 맞게 들어갔는지 바로 확인한다. 등급별 인원 비율과 지급 시기는 해마다 교육부 지침과 시·도교육청 안내로 정해진다(2025년 교육부 지침은 S 30%, A 50%, B 20% 한시 적용).","first":["학교 홈페이지에 공개된 우리 학교 '성과(다면) 평가기준'과 정량평가 항목, 정성평가 반영 비율을 확인한다","평가 시기에 정량평가 실적(수업 시수, 담임·업무 부담, 연수 이수 등) 증빙을 빠짐없이 내고, 위원회가 확인한 정량 점수를 본인 확인한다","지난 1년(3. 1.~2월 말) 동안 휴직·파견·장기 휴가 등으로 실제 근무가 2개월 미만인지, 휴·복직 월이 있어 일할 계산되는지 따져 본다","등급 통보를 받으면 학교가 정한 이의제기 기간(7일 이상)을 확인하고, 이의가 있으면 기간 안에 이의신청서와 증빙을 낸다","평가대상기간 중 징계처분이 확정됐다면 원칙적으로 지급 제외 대상인지 확인한다"],"steps":[{"stage":"미리 확인","when":"학년 초~평가 전","who":"다면평가관리위원회·학교장","what":"평가기준 마련과 공개","detail":"학교는 보수성과심의위원회를 따로 만들지 않고 '다면평가관리위원회'와 '다면평가자'가 그 역할을 한다. 다면평가 지표는 전체 교원 의견 수렴을 거쳐 위원회가 심의하고, 학교 '성과(다면) 평가기준'은 학교 홈페이지에 공개해야 한다. 정량평가 내용은 학교가 수정·추가·삭제할 수 있고, 비교과교사가 불리하지 않도록 업무 특성을 반영한 기준을 마련한다(위원회에 비교과교사 1명 이상 참여 권장). 육아휴직자를 감점하거나 육아휴직 기간을 비근무 감점 대상에 넣으면 안 된다.","basis":"2025년 교육공무원 성과상여금 지급 지침(교육부 교원양성연수과-1270 반영) Ⅱ-1·2"},{"stage":"신청·보고","when":"평가 시기(학년도 말)","who":"교사 본인","what":"정량평가 실적 제출과 본인 확인","detail":"교사 다면평가는 학년도 종료일 기준으로 근무성적평정과 함께 실시하고, 그 결과가 성과상여금 평가에 쓰인다. 다면평가 결과는 성과상여금과 승진후보자 명부에 함께 연동되므로, 위원회는 평가 전에 정량 실적을 정확히 확인하고 본인 확인 절차를 거치도록 되어 있다.","basis":"교육공무원 승진규정(교사 다면평가); 2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2"},{"stage":"결재·승인","when":"평가 시기","who":"다면평가자·다면평가관리위원회","what":"정성·정량 평가와 등급 결정","detail":"교사 성과상여금은 다면평가 결과(정량평가, 정성평가)를 활용하고, 정성평가 반영 비율은 0~20%에서 학교가 정한다. 등급은 S·A·B 3등급이고 인원 배정 비율은 해마다 교육부 지침으로 정한다(2025년: S 30%, A 50%, B 20% 한시 적용, 종전 30:40:30). 지급제외자는 비율 계산에서 빼고, 인원 합계가 맞지 않으면 소수점 이하가 큰 순서대로 올린다. S등급을 주려면 결정 근거를 적은 '성과급 최상위등급 심사(심의) 의결서'를 반드시 작성해 의결한다.","basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2; 공무원보수 등의 업무지침 제8장 별지 제1호의2"},{"stage":"결재·승인","when":"등급 결정 뒤","who":"학교장","what":"차등지급률 결정과 지급대상자 확정","detail":"개인성과급 차등지급률은 50~100% 중에서 단위기관(학교)의 장이 고른다. 지급 기준일 현재 소속 교원과 평가기간 중 퇴직한 교원이 대상이고, 지급 기준일 현재 파견 중이거나 휴직(군 입대 휴직 포함) 중인 사람도 포함한다. 실제 근무 2개월 미만 퇴직자는 현원에는 넣되 최하위 등급에 배치하고 지급하지 않으며, 그 밖의 지급제외자는 현원에 넣지 않는다.","basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-1"},{"stage":"결재·승인","when":"지급 전","who":"다면평가관리위원회 → 학교장 → 교사","what":"등급 개별 통보","detail":"위원회는 등급 결정 결과를 학교장에게 통보하고, 학교장은 즉시 교원에게 해당 등급을 알려야 하며 최하위 등급으로 평가된 사람에게는 그 사유를 설명해야 한다. 등급은 본인 외에는 공개하지 않는다. 최상위(S) 등급자는 전체 직원에게 공개하는 것이 원칙이나 직원 의견 수렴을 거쳐 공개하지 않을 수 있다.","basis":"공무원보수 등의 업무지침(인사혁신처예규 제220호) 제8장; 2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2"},{"stage":"이의·구제","when":"통보 후 지급 전(7일 이상)","who":"교사 본인","what":"이의신청서 제출","detail":"등급에 이의가 있으면 이의신청서(소속·직급·성명, 지급등급, 이의신청 사유를 구체적으로 쓰고 증빙 첨부)를 소속 학교장에게 낸다. 학교장은 결과 통보 후 성과상여금 지급 전에 7일 이상 이의제기 기간을 운영해야 한다. 정확한 기간은 학교가 공지한다.","basis":"공무원보수 등의 업무지침 제8장 이의제기, 별지 제2호 서식; 2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2"},{"stage":"이의·구제","when":"이의신청 후","who":"학교장·다면평가관리위원회","what":"재심의","detail":"학교장이나 인사 담당은 이의가 타당하다고 판단하면 위원회에 재심의를 요구하고, 위원회는 지급순위와 등급을 다시 조정할 수 있다. 이의를 제기하지 않은 사람의 등급은 가급적 바꾸지 않고 이의를 낸 사람의 순위·등급을 조정하며, 재심의를 이유로 상위 등급 비율이 높아지지 않게 한다. 재심의 결과는 재심의 의결서로 남긴다.","basis":"공무원보수 등의 업무지침 제8장, 별지 제2호의2 서식; 2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2"},{"stage":"복귀·정산","when":"지급 시기(시·도교육청 안내, 대개 3월 말 전후)","who":"행정실","what":"지급액 계산과 지급","detail":"지급액은 '해당 등급 지급액 × (정상 근무 월수/12) + 해당 등급 1개월 지급액 × (휴·복직 월의 근무일수/해당 월의 일수)'로 일할 계산한다. 휴직일은 근무일에서 빼고 복직일은 넣으며, 직위해제·교육훈련파견(교육공무원임용령 제7조의3제1항제4호·제7호) 기간도 뺀다. 2개월 실근무 판단 때는 휴가를 빼지만 금액 계산 때는 휴가 기간을 근무일수에 넣는다. 시간선택제 교사는 근무시간에 비례해 준다. 2026년 교사 지급기준액은 4,117,800원이다.","basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-1-마; 공무원보수 등의 업무지침 제8장 [별표] 지급기준액(2026년 적용)"},{"stage":"사후 관리","when":"지급 이후","who":"시·도교육청(실태 점검반)","what":"지급 실태 점검","detail":"시·도교육청은 실태 점검반을 운영해 각급 학교의 5% 안팎을 골라 성과와 관계없는 균등분배·순환등급, 담합·몰아주기, 지급 뒤 재분배, 2개월 실근무 여부, 퇴직 후 재채용 사실을 숨긴 중복 수령 등을 점검하고 결과를 교육부에 낸다.","basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-1(단위기관의 책무성 강화)"},{"stage":"사후 관리","when":"부정 수령 적발 시","who":"임용권자","what":"부당 수령 환수와 징계","detail":"거짓이나 부정한 방법으로 성과상여금을 받으면 받은 금액을 징수하고, 적발 시점부터 1년 범위에서 성과상여금을 주지 않는다. 성과와 관계없이 나눠 갖기, 담합·몰아주기, 순환 등급, 받은 뒤 협의해 재분배하는 행위는 징계 사유가 된다.","basis":"공무원수당 등에 관한 규정 제7조의2; 2025년 교육공무원 성과상여금 지급 지침"}],"deadlines":[{"what":"평가대상기간","limit":"3월 1일 ~ 다음 해 2월 말일(1년). 2026년 지급분은 2025. 3. 1.~2026. 2. 28.","basis":"2025년 교육공무원 성과상여금 지급 지침; 서울특별시동부교육지원청 2026년 성과상여금 지급 안내"},{"what":"지급 기준일","limit":"2월 말일(2026년은 2026. 2. 28.)","basis":"서울특별시동부교육지원청 2026년 성과상여금 지급 안내"},{"what":"지급 대상 최소 근무","limit":"평가대상기간 중 실제 근무 2개월 이상(휴가 등 근무상황이 있으면 실근무 60일 이상)","basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-1-마"},{"what":"이의제기 기간","limit":"결과 통보 후 지급 전 7일 이상(학교장이 정함)","basis":"공무원보수 등의 업무지침 제8장"},{"what":"차등지급률","limit":"50~100% 중 학교장 선택","basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2"},{"what":"등급별 인원 비율","limit":"해마다 교육부 지침으로 정함(2025년 S 30%·A 50%·B 20% 한시, 등급별 지급률 S 70%·A 50%·B 35%)","basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2"},{"what":"부정 수령 시 지급 중지","limit":"적발 시점부터 1년 범위","basis":"공무원수당 등에 관한 규정 제7조의2"}],"dont":["받은 성과급을 동료와 나누거나 순번을 정해 등급을 돌리지 않는다 — 부정 수령으로 징수되고 1년까지 지급이 중지되며 징계 대상이다","정량평가 실적 확인 단계를 대충 넘기지 않는다 — 다면평가 결과는 성과급과 승진후보자 명부에 함께 쓰여 한 번 확정되면 되돌리기 어렵다","이의신청 기간이 지난 뒤 말로 항의하지 않는다 — 이의는 정해진 기간 안에 이의신청서와 증빙을 내야 재심의로 이어진다","다른 교사의 등급을 묻거나 알리지 않는다 — 등급은 본인 외에는 공개하지 않게 되어 있다(S등급 공개만 예외)","위원회가 육아휴직자에게 감점을 주는 기준을 만들지 않는다 — 교육부 지침이 명시적으로 금지한 사항이다","퇴직 후 같은 평가기간 안에 다시 교원으로 채용됐는데 알리지 않고 두 기관에서 받지 않는다 — 재채용 사실은 퇴직·재채용 기관 모두에 알려야 한다","징계 처분자를 최하위 등급으로라도 지급하지 않는다 — 평가기간 중 징계처분이 확정되면 원칙적으로 지급 제외다"],"contacts":[{"name":"소속 시·도교육청·교육지원청 성과상여금 담당","tel":"소속 교육청","note":"지급 지침·등급 비율·지급 일정 문의. 학교 안의 평가·이의 절차는 교감·교무부에 먼저 확인한다"}],"forms":["이의신청서(성과상여금) — 공무원보수 등의 업무지침 제8장 별지 제2호 서식(시·도교육청이 따로 양식을 안내하기도 한다)","성과급 최상위등급 심의 의결서 — 업무지침 제8장 별지 제1호의2 서식","성과급 재심의 의결서 — 업무지침 제8장 별지 제2호의2 서식","교사 자기실적평가서, 다면평가(정성·정량) 기준표 — 시·도교육청·학교 서식","학교 성과(다면) 평가기준 — 학교 홈페이지 공개"],"law":[{"name":"공무원수당 등에 관한 규정","article":"제7조의2(성과상여금)","point":"근무성적·업무실적이 우수한 공무원에게 예산 범위에서 성과상여금을 준다. 거짓·부정한 방법으로 받으면 징수하고 1년 범위에서 지급하지 않는다"},{"name":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026. 7. 31.)","article":"제8장 성과상여금업무 처리기준, [별표] 지급기준액, 별지 제1호~제2호의2","point":"교육공무원 포함 적용, 실근무 2개월 기준, 등급 본인 통보·최하위등급 사유 설명, 지급 전 7일 이상 이의제기 기간, 재심의 방법. 2026년 교사 지급기준액 4,117,800원"},{"name":"2025년 교육공무원 성과상여금 지급 지침(교육부 교원양성연수과-1270, 2025. 2. 28.)","article":"Ⅱ. 지급 개요 및 세부 시행 지침","point":"개인성과급 일원화, 다면평가 결과 활용·정성평가 반영 비율 0~20% 학교 자율, 차등지급률 50~100%, S·A·B 3등급, 평가기준 홈페이지 공개, 실태 점검"},{"name":"교육공무원 승진규정","article":"교사 다면평가 조항","point":"교사는 학년도 종료일 기준으로 근무성적평정과 다면평가를 실시하며, 다면평가 결과가 성과상여금 평가에 활용된다"}],"deep":[{"title":"'실제로 근무한 기간 2개월'을 세는 법","body":["실제로 근무한 기간은 휴가(연가·병가·공가·특별휴가), 휴직, 직위해제, 교육훈련 파견 등으로 실제 직무에 종사하지 않은 기간을 뺀 기간이다. 근무상황이 없으면 역(曆)에 따라 2개월을 세고, 휴가 등 근무상황이 있으면 실근무 일수가 60일 이상이어야 한다.","교육부 지침 예시로, 3월 1일부터 5월 8일까지 근무하다 출산휴가와 육아휴직에 들어간 교사는 그 사이 휴가 등을 뺀 실근무가 2개월 이상인지 먼저 보고, 대상이면 '해당 등급 지급액 × 5/12 + 1개월 지급액 × (휴직 전 근무일수/해당 월 일수)' 식으로 계산한다.","두 단계가 다르다는 점을 기억한다. 2개월을 넘는지 판단할 때는 휴가를 빼지만, 일단 대상이 되면 금액은 휴가 기간을 근무일수에 넣어 계산한다."],"basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-1-마"},{"title":"휴직·파견·전보·퇴직한 교사의 성과급","body":["지급 기준일 현재 휴직 중이거나 파견 중이어도 평가기간 중 2개월 이상 근무했다면 지급 대상이며, 근무한 기간만큼 일할 계산된다. 파견공무원은 원 소속기관에서 받는 것이 원칙이고, 파견 받은 기관과 협의해 달리 정할 수 있다.","군 입대 휴직은 하사 이상이면 입대 첫해 원 소속기관과 국방부가 50%씩 주고(입대 후 2개월 미만이면 원 소속기관 100%), 두 번째 해부터는 국방부, 전역하는 해는 원 소속기관이 준다. 일반 사병은 원 소속기관 지급대상에 포함된다.","전보로 학교가 바뀌면 지급기준일 현재 학교에서 주고, 옮긴 지 2개월이 안 됐으면 이전 학교에 자료를 요청할 수 있다. 평가기간 중 퇴직한 교원도 재직자와 같이 평가해 근무기간에 비례해 주므로, 퇴직 때 연락처·계좌 정보를 학교에 남겨 둔다. 같은 평가기간 안에 재채용되면 재채용 기관이 두 기관 실근무를 합산해 평가하고 지급한다."],"basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-1"},{"title":"징계·직위해제와 성과급","body":["평가대상기간 중 징계처분이 확정된 사람은 원칙적으로 지급하지 않는다. 금품·향응 수수, 성적 조작, 성 관련 비위, 학생에 대한 상습적이고 심각한 신체 폭력 관련 사유로 직위해제된 사람도 지급 제외다.","징계를 이유로 못 받았거나 면직·파면·해임으로 평가를 받지 못한 교원의 처분이 나중에 무효·취소되면, 처분이 있었던 해 지급기준액에 표준평균지급률을 곱한 금액을 소급해 받을 수 있다. 징계의결요구에 따른 것이 아닌 직위해제가 무효·취소된 경우도 차액을 소급해 받을 수 있다."],"basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-1-다·라"},{"title":"정성평가 비율과 비교과교사","body":["교육부 지침은 교사 성과상여금 평가에 다면평가 결과를 쓰되 정성평가 반영 비율을 0~20%에서 학교가 정하게 한다. 그래서 같은 교육청 안에서도 학교마다 정량·정성 비율이 다를 수 있고, 정확한 비율은 학교 홈페이지에 공개된 평가기준으로 확인한다. 교육청에 따라 비율을 일률적으로 정해 안내하기도 한다.","보건·영양·사서·전문상담 교사는 학교 단위에서 교과 교사와 함께 평가하되, 불이익이 없도록 업무 특성을 반영한 기준을 마련해야 한다. 정성평가 지표 중 학습지도 지표는 학교가 수정·추가·삭제할 수 있다."],"basis":"2025년 교육공무원 성과상여금 지급 지침 Ⅱ-2"}],"tables":[{"title":"교사 성과상여금 등급과 지급 구조","head":["등급","인원 비율(2025 교육부 지침, 한시)","등급별 지급률","비고"],"rows":[["S","30%","70%","최상위등급 심의 의결서 작성, 전체 직원 공개 원칙"],["A","50%","50%","본인에게만 통보"],["B","20%","35%","본인에게만 통보, 최하위등급 사유 설명"]],"note":"개인성과급 100%, 차등지급률 50~100%에서 학교장이 선택(나머지는 균등 지급). 종전 비율은 S 30%, A 40%, B 30%. 2026년 교사·장학사·교육연구사 지급기준액 4,117,800원. 해마다 교육부 지침으로 비율이 바뀔 수 있다. 출처: 2025년 교육공무원 성과상여금 지급 지침, 공무원보수 등의 업무지침(인사혁신처예규 제220호) 제8장 [별표]."}],"faq":[{"q":"작년에 6개월 육아휴직을 했는데 성과급이 줄어드나요?","a":"평가기간 중 실제 근무가 2개월 이상이면 지급 대상이고, 휴직 기간을 뺀 근무 월수만큼 일할 계산돼 금액은 줄어든다. 다만 평가 등급 자체에서 육아휴직을 이유로 감점해서는 안 된다고 교육부 지침이 밝히고 있다."},{"q":"이의신청하면 다른 선생님 등급이 내려가나요?","a":"원칙적으로 아니다. 재심의 때 이의를 제기하지 않은 사람의 등급은 가급적 바꾸지 않고 이의를 낸 사람의 순위·등급을 조정하며, 재심의 때문에 상위 등급 비율이 높아지지 않도록 한다."},{"q":"호봉이 높으면 성과급도 더 많나요?","a":"아니다. 성과상여금은 직급별 지급기준액(2026년 교사 4,117,800원)에 등급별 지급률을 곱하는 구조라 같은 학교·같은 등급이면 호봉과 관계없이 같다. 학교마다 차등지급률(50~100%)이 달라 등급 간 금액 차이는 학교별로 다르다."},{"q":"3월 1일에 발령받은 신규교사도 받나요?","a":"평가대상기간(전년 3. 1.~2월 말) 중 실제 근무 2개월 이상이어야 한다. 3월 1일 신규 발령자는 그해 3월 지급분에는 평가기간 근무가 없어 대상이 아니다. 같은 평가기간 안에 다른 기관에서 근무하다 옮겨 왔다면 실근무를 합산해 판단한다."},{"q":"등급 결과를 교무실에 게시해도 되나요?","a":"안 된다. 등급은 본인 외에는 공개하지 않는다. S등급자만 전체 직원에게 공개하는 것이 원칙이고, 그마저도 직원 의견 수렴을 거쳐 공개하지 않을 수 있다."},{"q":"기간제교사도 성과상여금을 받나요?","a":"받을 수 있지만 교육공무원과 별도 기준이다. 평가기간 중 2개월 이상 근무한 기간제교사가 대상이고, 지급기준액과 평가 방법은 시·도교육청 안내로 정해진다."}],"record":"성과상여금은 근무상황부 기록 대상이 아니다. 학교는 다면평가 결과와 등급을 내부결재(성과상여금 지급 계획, 최상위등급 심의 의결서, 이의신청·재심의 결과)로 남기고, 최종 명부와 지급 신청 자료를 교육청에 보고한다. 지급액 계산의 근거가 되는 휴직·파견·휴가 기간은 나이스 인사기록과 근무상황 기록으로 확인하므로, 교사는 휴·복직일과 장기 휴가가 인사기록에 정확히 반영됐는지 확인한다.","sources":[{"title":"공무원보수 등의 업무지침(2026. 1. 22.) — 제8장 성과상여금업무 처리기준","publisher":"인사혁신처(공공데이터포털 원문)","year":2026,"url":"https://www.data.go.kr/data/15099914/fileData.do"},{"title":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026. 7. 31.) — 제8장 성과상여금업무 처리기준·별지 서식","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000283466"},{"title":"2025년 교육공무원 성과상여금 지급 지침(교육부 교원양성연수과-1270 반영, 전북특별자치도교육청 교원인사과)","publisher":"전북특별자치도교육청","year":2025,"url":"https://school.jbedu.kr/_cmm/fileDownload/jbdonghwa/M010301/1a2d17f9c04a1a63f875491eefd6f8e4"},{"title":"2026년 교육공무원 및 기간제교사 성과상여금 지급 관련 안내","publisher":"서울특별시동부교육지원청","year":2026,"url":"https://dbedu.sen.go.kr/CMS/school/school04/school0402/school040201/1354500_2852.html"}],"verified":"2026-09-29","uncertain":["교육부 「2026년 교육공무원 성과상여금 지급 지침」 원문은 찾지 못했다. 전국 기준은 교육부 2025년 지침(교원양성연수과-1270)을 전북특별자치도교육청이 시행하며 옮긴 문서, 인사혁신처 보수 업무지침(예규 제220호), 서울특별시동부교육지원청 2026년 안내로 확인했다","2026년 전국 등급 비율이 2025년과 같은 S 30%·A 50%·B 20%인지 교육부 원문으로 확인하지 못했다. 2027년 지급분 비율도 미정이다","학교별 이의신청 기간의 구체적 날짜와 등급 통보 방식은 학교가 정한다. 다면평가 결과를 나이스에서 입력·조회하는 메뉴 경로는 확인하지 못했다","기간제교사 지급기준액·평가 방법의 전국 공통 기준(교육부 기간제교원 성과상여금 지침)은 원문을 확인하지 못했다","사립학교 교원의 성과급은 공립학교 평가방법을 준용하도록 지도하지만 세부 절차는 법인·교육청 기준이 따로 있을 수 있다"],"related":["salary-step","leave-of-absence","parental-leave","discipline-appeal","transfer"]},{"id":"salary-step","title":"호봉 획정·재획정·정기승급·호봉 정정(교육공무원)","aka":["호봉","호봉 획정","초임호봉","호봉 재획정","재획정","호봉 정정","승급","정기승급","승급일","1급 정교사 호봉","1정 따면 호봉","경력 합산","경력합산신청서","군경력 호봉","기간제 경력 호봉","사립 경력 호봉","경력환산율","사범대 가산","잔여기간","승급 제한"],"category":"인사·보수","urgency":"사후","roles":["교사 본인","학교 인사 담당(교무부)·행정실(급여)","호봉획정·승급 시행권자(학교장 등)","호봉경력 평가 심의회","교육지원청·시·도교육청 인사 담당"],"summary":"교원의 첫 호봉(초임호봉)은 신규채용일에 자격별 기산호봉(1급 정교사 9호봉, 2급 정교사 8호봉)에 학력(총수학연수)과 사범계 가산연수, 환산한 경력을 더해 정한다. 임용 뒤 빠진 경력을 내거나 임용 과목의 1급 정교사 자격을 따는 등 사유가 생기면 '호봉 재획정'을 신청하며, 경력 합산을 신청한 날이 속한 달의 다음 달 1일자로 호봉이 다시 정해진다. 경력 인정 비율은 교육부 「교육공무원 호봉획정 시 경력환산율표의 적용 등에 관한 예규」로 정해져 국·공립 교원(기간제 포함)과 현역 군 복무는 10할, 사립학교 교원 경력은 관할청 임면 보고 여부에 따라 10할 또는 5할, 학원·회사 경력은 일부만 인정된다. 호봉은 1년마다 매월 1일자로 오르고, 휴직·징계·직위해제 기간에는 승급이 제한된다. 획정이 처음부터 잘못됐다면 재획정이 아니라 잘못된 발령일로 소급하는 '호봉 정정'을 요청한다.","first":["나이스 인사기록카드에서 현재 호봉, 잔여기간(월·일), 차기 승급일을 확인한다","초임호봉 때 빠진 경력(군 복무, 기간제·강사, 사립학교, 대학원 학위, 회사 등)이 있는지 따져 보고, 경력증명서(군은 병적증명서)를 발급받는다","임용된 과목의 1급 정교사 자격증이 나왔으면 자격증 사본을 첨부해 학교에 호봉 재획정을 바로 신청한다 — 신청한 달의 다음 달 1일에 반영되므로 늦게 내면 그만큼 손해다","학교 인사 담당에게 '호봉획정을 위한 경력기간 합산신청서'(공무원보수 등의 업무지침 제1장 별지 제1호 서식)를 받아 경력마다 기간·기관·직급·주당 근무시간을 적어 낸다","호봉이 처음부터 잘못 계산된 것 같으면 재획정이 아니라 호봉 정정을 요청한다 — 잘못된 발령일로 소급해 급여를 정산한다"],"steps":[{"stage":"미리 확인","when":"신규 임용 직후","who":"학교 인사 담당 → 교사 본인","what":"경력기간 합산신청서 배부와 제출","detail":"호봉획정권자는 초임호봉을 정하기 전에 '호봉획정을 위한 경력기간 합산신청서'(별지 제1호 서식)를 나눠 주고 합산할 경력이 있으면 신청하게 한다. 공무원·군 복무·유사경력을 구분해 적고 경력증명서(병적증명서)를 붙인다. 이 신청서는 나중에 호봉 정정 등의 증빙이 되므로 본인도 사본을 보관한다.","basis":"공무원보수 등의 업무지침(인사혁신처예규 제220호) 제1장, 별지 제1호 서식; 교육부 예규 제97호"},{"stage":"결재·승인","when":"임용일부터 3개월 이내(원칙)","who":"호봉획정 시행권자","what":"전력조회","detail":"강사·회사 등 유사경력(외국 경력 포함)은 반드시 전력조회를 해 경력을 확인하고, 조회 확인은 임용일부터 3개월 안에 끝내는 것이 원칙이다. 공무원 경력은 증명서 내용이 불확실한 경우 등에만, 군 경력은 병적사항이 불명확한 경우 등에만 조회한다. 조회는 '호봉획정을 위한 전력조회 요청서'(별지 제2호 서식)로 담당업무, 기간, 직급, 정규직 여부, 근무시간을 확인한다.","basis":"공무원보수규정 제10조; 공무원보수 등의 업무지침 제1장, 별지 제2호 서식"},{"stage":"결재·승인","when":"초임호봉·재획정 전","who":"호봉경력 평가 심의회","what":"경력 인정 여부 심의","detail":"호봉 획정 시행권자는 유사경력을 호봉에 넣기 전과 재직자 호봉을 재획정하기 전에 '호봉경력 평가 심의회'를 거쳐 동일분야 여부, 상당계급, 경력 환산율 등을 심의해야 한다. 심의회는 5인 이상으로 구성하고, 환산율만 올리는 등 단순·경미한 사항은 서면심의로 대신할 수 있다.","basis":"공무원보수규정 제10조; 공무원보수 등의 업무지침 제1장 Ⅱ-3-다, Ⅳ-5"},{"stage":"사용·이행","when":"신규채용일","who":"호봉획정 시행권자","what":"초임호봉 획정","detail":"초·중등 교원은 경력환산율표(영 별표 22)로 환산한 경력연수에 총수학연수 가감(영 별표 23)을 한 뒤 자격별 기산호봉(영 별표 25)에 더해 초임호봉을 정한다. 가감은 '(총수학연수 - 16) + 가산연수'로, 4년제 대학 졸업이면 0이고 사범계 학교(대학의 교육과 포함) 졸업자는 가산연수를 받는다. 기산호봉은 1급 정교사 9호봉, 2급 정교사 8호봉, 준교사·실기교사 5호봉이다. 1년이 안 되는 기간은 잔여기간으로 넘어가 다음 승급에 더해진다.","basis":"공무원보수규정 제8조, 별표 22·23·25; 교육부 예규 제97호"},{"stage":"신청·보고","when":"재획정 사유가 생겼을 때","who":"교사 본인","what":"호봉 재획정 신청","detail":"재획정 사유는 ① 새로운 경력을 합산해야 할 때(교육공무원은 자격·학력 변동 포함), ② 초임호봉 때 반영되지 않은 경력을 입증할 자료를 나중에 낼 때, ③ 징계 등으로 제한된 승급기간을 다시 산입할 때, ④ 호봉획정 방법이 바뀔 때다. 자격 변동이란 임용된 교과목의 상위 자격(예: 1급 정교사)을 취득한 경우를 말한다. 경력은 경력기간 합산신청서와 경력증명서, 자격 변동은 자격증 사본, 학력 변동은 학위증·졸업증명서를 학교에 낸다.","basis":"공무원보수규정 제9조제1항; 공무원보수 등의 업무지침 제1장 Ⅳ"},{"stage":"결재·승인","when":"신청한 달의 다음 달 1일","who":"호봉획정 시행권자","what":"재획정 발령","detail":"경력 합산(나중 제출 자료 포함)은 경력합산을 신청한 날이 속하는 달의 다음 달 1일에, 제출된 경력의 전력조회를 마친 뒤 재획정한다. 그날 휴직(공무상 질병·부상 휴직 제외)·정직·강등·직위해제 중이면 복직일에 재획정한다. 재획정 때 특별승급이나 승급제한 사유가 있으면 가감하고, 반영되지 않은 잔여기간은 다음 승급기간에 넣는다.","basis":"공무원보수규정 제9조제2항~제5항; 공무원보수 등의 업무지침 제1장 Ⅳ"},{"stage":"사용·이행","when":"매월 1일","who":"승급 시행권자","what":"정기승급","detail":"호봉 간 승급기간은 1년이고 정기승급일은 매월 1일이다. 정기승급일 현재 승급 제한 중이 아니고 승급기간이 1년 이상이어야 한다. 휴직하는 날이 승급일과 겹치면 그 정기승급은 되지 않는다.","basis":"공무원보수규정 제13조, 제14조"},{"stage":"복귀·정산","when":"복직 시","who":"학교(승급 시행권자)","what":"휴직 후 복직과 승급기간","detail":"휴직 중에는 승급할 수 없지만 법에서 정한 휴직 기간은 승급기간에 넣는다. 육아휴직은 자녀 1명당 최초 1년(「공무원수당 등에 관한 규정」 제11조의3제7항에 해당하면 최초 1년 6개월)을 넣고 셋째 이후 자녀는 전 기간을 넣는다. 가족돌봄휴직은 최초 90일, 병역 휴직과 노동조합 전임자 휴직은 그 기간, 국제기구·연구기관 등 근무나 외국유학을 위한 휴직도 그 기간(비상근은 50%)을 넣는다.","basis":"공무원보수규정 제15조"},{"stage":"사후 관리","when":"징계처분 뒤","who":"승급 시행권자","what":"징계에 따른 승급 제한과 재산입","detail":"징계처분 기간, 직위해제 기간, 휴직 기간(공무상 질병·부상 휴직 제외)에는 승급할 수 없다. 징계 집행이 끝난 날부터 강등·정직 18개월, 감봉 12개월, 견책 6개월 동안 승급이 제한되고, 금품 관련 비위(국가공무원법 제78조의2제1항)·소극행정·음주운전·성폭력·성희롱·성매매 징계는 6개월을 더한다. 근무성적평정이 최하등급이면 최초 정기승급 예정일부터 6개월 제한된다. 징계 집행이 끝난 날부터 강등 9년, 정직 7년, 감봉 5년, 견책 3년이 지나면 그 달의 다음 달 1일에 처분기간을 뺀 승급제한기간을 승급기간에 다시 넣어 재획정한다.","basis":"공무원보수규정 제14조·제15조; 공무원보수 등의 업무지침 제1장"},{"stage":"이의·구제","when":"호봉이 잘못된 것을 알았을 때","who":"교사 본인 → 호봉 획정·승급 시행권자","what":"호봉 정정 요청","detail":"호봉 획정이나 승급이 잘못됐다면 현재의 호봉획정·승급 시행권자가 잘못된 호봉발령일로 소급해 정정하고 급여도 그날로 소급 정산한다. 정정 사유와 근거를 명확히 해야 하고, 필요하면 종전 시행권자에게 사실을 확인한다. 정정에 따른 보수는 보수지급일 현재 소속기관에서 정산한다. 정정 발령을 누가 하는지(학교장, 교육장 등)는 시·도교육청 위임 체계에 따른다.","basis":"공무원보수규정 제18조; 공무원보수 등의 업무지침 제1장 호봉 정정"}],"deadlines":[{"what":"초임호봉 획정일","limit":"신규채용일","basis":"공무원보수규정 제8조"},{"what":"유사경력 전력조회","limit":"임용일부터 3개월 이내 완료 원칙","basis":"공무원보수 등의 업무지침 제1장"},{"what":"경력 합산·자격 변동에 따른 재획정일","limit":"경력합산을 신청한 날이 속하는 달의 다음 달 1일(휴직·정직·강등·직위해제 중이면 복직일)","basis":"공무원보수규정 제9조제2항"},{"what":"정기승급","limit":"승급기간 1년, 매월 1일자","basis":"공무원보수규정 제13조"},{"what":"징계 후 승급 제한","limit":"집행 종료 후 강등·정직 18개월, 감봉 12개월, 견책 6개월(특정 비위 +6개월)","basis":"공무원보수규정 제14조"},{"what":"승급제한기간 재산입","limit":"집행 종료 후 강등 9년·정직 7년·감봉 5년·견책 3년이 지난 날이 속하는 달의 다음 달 1일","basis":"공무원보수규정 제9조제2항, 제15조제2호"}],"dont":["1급 정교사 자격증을 받고 신청을 미루지 않는다 — 재획정은 신청한 달의 다음 달 1일부터라 늦게 낸 만큼 소급받지 못한다","경력증명서 없이 말로 경력을 주장하지 않는다 — 경력은 증명서와 전력조회로 확인하고, 증명이 어려우면 건강보험·소득 자료 같은 객관적 자료가 있어야 한다","같은 기간의 학력과 경력을 둘 다 넣으려 하지 않는다 — 기간이 겹치면 유리한 1개만 인정된다","대학원을 수료만 하고 경력으로 넣으려 하지 않는다 — 대학원 수학 기간은 학위를 받아야 인정되고, 재직 중 학위를 받으면 그때 재획정을 신청한다","호봉이 처음부터 틀렸는데 재획정으로 처리하지 않는다 — 잘못 획정된 것은 호봉 정정으로 소급 정산해야 한다","교원 자격 없이 한 강사·기간제 경력을 교원 경력(10할)으로 기대하지 않는다 — 교원 경력 10할은 해당 자격을 갖추고 근무한 경우에 인정된다"],"contacts":[{"name":"소속 교육지원청·시·도교육청 교원인사(호봉) 담당","tel":"소속 교육청","note":"호봉 정정 발령, 경력 인정 문의. 먼저 학교 인사 담당·행정실에 확인한다"}],"forms":["호봉획정을 위한 경력기간 합산신청서 — 공무원보수 등의 업무지침 제1장 별지 제1호 서식","호봉획정을 위한 전력조회 요청서 — 업무지침 제1장 별지 제2호 서식(학교가 경력 기관에 보냄)","경력증명서(군 경력은 병적증명서), 증명이 어려우면 건강보험 자격득실확인서·근로소득 원천징수영수증 등 객관적 자료","1급 정교사 자격증 사본(자격 변동 재획정)","학위증·졸업증명서·성적증명서(학위 경력, 학력 변동)","호봉 재획정·정정 기안(호봉재획정표, 호봉정정 사유서 등) — 시·도교육청 서식"],"law":[{"name":"공무원보수규정(대통령령 제36547호, 2026. 8. 1. 시행)","article":"제8조·제9조·제10조·제13조·제14조·제15조·제18조, 별표 22·23·25","point":"초임호봉 획정, 호봉 재획정 사유와 시기, 전력조회와 호봉경력 평가 심의회, 정기승급(매월 1일, 1년), 승급 제한·승급기간 특례, 호봉 정정. 교원 경력환산율·총수학연수 가감·기산호봉 표"},{"name":"교육공무원 호봉획정 시 경력환산율표의 적용 등에 관한 예규(교육부예규 제97호, 2025. 4. 23.)","article":"별표 1~3","point":"교원·공무원·유사경력별 환산율 세부 기준, 사립 교원 임면 보고 여부에 따른 환산율, 강사·학위·학원·회사 경력 인정 범위"},{"name":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026. 7. 31.)","article":"제1장 공무원 봉급업무 처리기준, 별지 제1호·제2호","point":"경력 증명·전력조회(유사경력 3개월 이내), 호봉경력 평가 심의회, 재획정 절차와 시기, 승급 제한 계산, 호봉 정정"}],"deep":[{"title":"초임호봉 계산 방법","body":["초·중등 교원의 초임호봉 = 기산호봉 + (총수학연수 - 16) + 가산연수 + 환산 경력연수다. 기산호봉은 1급 정교사 9, 2급 정교사 8, 준교사·실기교사 5호봉이고 전문상담·사서·보건·영양교사도 1급 9, 2급 8호봉이다. 총수학연수는 초 6 + 중 3 + 고 3 + 대학 법정 수학연한으로 셈해 4년제 졸업이면 16년이다.","가산연수는 사범계 학교(대학에 설치한 교육과 포함) 졸업자 등에게 주고, 특수학교·특수학급 담당 교원 등은 따로 가산을 받는다. 공무원 등으로 근무한 기간 중의 대학 졸업(통학 가능한 야간대학 제외)은 학력으로 인정하지 않는다. 세부 인정 범위는 영 별표 23과 교육부 예규로 확인한다.","환산한 경력은 12개월을 1년, 30일을 1개월로 묶고, 1년 미만은 잔여기간으로 남아 다음 승급일 계산에 들어간다. 예를 들어 사범대를 졸업하고 2급 정교사로 임용되면 8 + 0 + 1 = 9호봉에서 시작하고, 여기에 인정된 경력이 더해진다."],"basis":"공무원보수규정 별표 23·25; 교육부 예규 제97호"},{"title":"경력별 인정 비율 핵심","body":["교원 경력: 국·공립학교 교원(기간제 포함)으로 자격을 갖추고 근무한 경력은 10할이다. 소지 자격증과 근무 학교가 맞지 않는 기간제교원(예: 중등 자격으로 초등학교 근무)은 8할이다. 사립학교 교원(기간제 포함)은 사립학교법에 따라 관할청에 임면이 보고된 경우 10할, 보고되지 않은 경우 5할이다.","공무원·군 경력: 국가·지방공무원 경력과 현역 군 복무는 10할이다. 병역법에 따른 예술·체육요원, 산업기능요원, 전문연구요원, 승선근무예비역 복무 경력도 10할로 인정하되 의무복무기간이 3년을 넘으면 3년까지다.","강사·학위: 교원 자격을 갖춘 전일제(1일 8시간 이상) 강사는 10할, 시간제 강사는 주당 근무시간에 비례해 계산하되 주당 실근무시간이 불명확하거나 12시간 이하면 3할이다. 대학원 학위취득 경력은 10할이다.","그 밖에 학교회계직·국가기관 임시직 등 5할 이내(업무 분야와 같은 교원자격증 취득 후는 8할 이내), 교육감에게 등록된 학원 강사 5할 이내(미등록 학원은 객관적 증빙이 있을 때 3할 이내), 회사 4할 이내(점원·외판원 제외), 그 밖의 직업 3할 이내다. 개별 인정은 호봉경력 평가 심의회에서 정한다."],"basis":"교육부 예규 제97호 별표 1"},{"title":"재획정과 정정은 다르다","body":["재획정은 호봉 계산이 원래는 맞았는데 새로운 사유(새 경력 제출, 자격·학력 변동, 승급제한기간 재산입, 획정 방법 변경)가 생겨 다시 정하는 것이다. 효력은 신청한 달의 다음 달 1일부터라 그 전으로 소급되지 않는다.","정정은 호봉 획정이나 승급 자체가 잘못된 경우(환산율 착오, 제출한 경력 누락 처리, 승급 누락 등)로, 잘못된 호봉발령일로 거슬러 올라가 바로잡고 급여를 소급 정산한다. 초임 때 합산신청서를 냈는데 학교가 경력을 빠뜨렸다면 정정 사유가 될 수 있으니, 제출했던 합산신청서 사본을 보관해 둔다."],"basis":"공무원보수규정 제9조·제18조; 공무원보수 등의 업무지침 제1장"},{"title":"1급 정교사 자격을 따면","body":["임용된 교과목의 상위 자격(1급 정교사)을 받으면 자격 변동으로 재획정 사유가 된다. 기산호봉이 2급 8호봉에서 1급 9호봉으로 바뀌므로 호봉이 1호봉 오르는 효과가 있다. 신청한 날이 속하는 달의 다음 달 1일에 재획정하므로 자격증을 받는 대로 바로 낸다.","임용되지 않은 다른 과목의 상위 자격을 받은 것은 재획정 사유가 아니다. 기간제교원의 자격 변동에 따른 봉급 재산정은 교육부 「기간제교원의 봉급 지급에 관한 예규」로 따로 처리한다."],"basis":"공무원보수 등의 업무지침 제1장 Ⅳ(자격의 변동); 기간제교원의 봉급 지급에 관한 예규(교육부예규 제69호)"}],"tables":[{"title":"교원 호봉 경력환산율(주요 경력)","head":["경력","환산율","비고"],"rows":[["국·공립학교 교원(기간제 포함, 자격 소지)","10할","자격증과 근무 학교급 불일치 기간제는 8할"],["사립학교 교원(기간제 포함, 자격 소지)","10할 또는 5할","관할청 임면 보고 10할, 미보고 5할"],["국가·지방공무원, 현역 군 복무","10할","예술체육요원·산업기능요원·전문연구요원·승선근무예비역도 10할(의무복무 3년 한도)"],["전일제 강사(1일 8시간 이상, 자격 소지)","10할","시간제는 주당 근무시간 비례, 불명확하거나 주 12시간 이하면 3할"],["대학원 학위취득 경력","10할","학위를 받아야 인정"],["국가·지자체 임시직, 학교회계직 등","5할 이내","업무 분야와 같은 교원자격증 취득 후 8할 이내"],["등록 학원 강사·신고 교습소 교습자","5할 이내","미등록 학원은 객관적 증빙 시 3할 이내"],["회사(점원·외판원 제외)","4할 이내",""],["그 밖의 직업","3할 이내","교육부장관이 인사혁신처장과 협의해 정한 경력"]],"note":"출처: 교육부 「교육공무원 호봉획정 시 경력환산율표의 적용 등에 관한 예규」(제97호, 2025. 4. 23.) 별표 1. 개별 인정은 호봉경력 평가 심의회에서 결정한다."},{"title":"승급 제한 기간","head":["사유","승급 제한","승급기간 재산입 시기"],"rows":[["강등·정직","처분기간 + 18개월","집행 종료 후 강등 9년·정직 7년 지난 달의 다음 달 1일"],["감봉","처분기간 + 12개월","집행 종료 후 5년 지난 달의 다음 달 1일"],["견책","6개월","집행 종료 후 3년 지난 달의 다음 달 1일"],["근무성적평정 최하등급","최초 정기승급 예정일부터 6개월","제한 종료 후 2년 지난 달의 다음 달 1일"],["휴직·직위해제","그 기간","공무상 질병·부상 휴직은 제한 없음, 법정 산입 휴직은 승급기간에 산입"]],"note":"금품 관련 비위, 소극행정, 음주운전(측정 거부 포함), 성폭력·성희롱·성매매 징계는 처분별 제한기간에 6개월을 더한다. 출처: 공무원보수규정 제9조·제14조·제15조, 공무원보수 등의 업무지침 제1장(2026)."}],"faq":[{"q":"군 복무를 1년 9개월 했는데 호봉에 어떻게 들어가나요?","a":"현역 군 복무는 10할 인정이라 1년 9개월이 그대로 들어간다. 1년은 1호봉으로 올라가고 남은 9개월은 잔여기간으로 넘어가 다음 승급일이 그만큼 당겨진다. 초임 때 병적증명서를 합산신청서와 함께 내야 하고, 빠졌다면 재획정을 신청한다."},{"q":"임용 전에 사립학교에서 기간제로 일한 경력은 몇 할인가요?","a":"자격을 갖추고 사립학교 교원(기간제 포함)으로 근무했다면, 사립학교법에 따라 관할청에 임면이 보고된 경우 10할, 보고되지 않은 경우 5할이다. 자격증 종류와 근무 학교가 맞지 않는 기간제는 8할 이내다. 경력증명서와 전력조회로 임면 보고 여부를 확인한다."},{"q":"석사 학위를 재직 중에 받았어요. 호봉이 오르나요?","a":"재직 중 학위를 받았다면 학력·경력 변동으로 재획정을 신청할 수 있다. 다만 같은 기간 교원으로 근무한 경력과 겹치면 유리한 1개만 인정하므로, 재직하며 다닌 기간은 사실상 추가되지 않는 경우가 많다. 인정되면 신청한 달의 다음 달 1일에 재획정된다."},{"q":"육아휴직 1년 하고 복직하면 호봉이 밀리나요?","a":"육아휴직은 자녀 1명당 최초 1년이 승급기간에 산입되므로 1년 휴직이면 승급이 밀리지 않는다. 셋째 이후 자녀는 전 기간을 산입하고, 「공무원수당 등에 관한 규정」 제11조의3제7항에 해당하면 최초 1년 6개월까지 넣는다."},{"q":"호봉 승급일에 맞춰 휴직하면요?","a":"휴직 기간에는 승급할 수 없으므로 승급일과 같은 날 휴직하면 그 정기승급은 되지 않는다. 휴직 기간이 승급기간에 산입되는 휴직이라면 그 기간은 다음 승급에 반영된다."}],"record":"호봉 획정·재획정·정기승급·정정은 나이스 교원인사의 호봉 관련 메뉴에서 처리되고 인사기록카드 근무사항·승급 기록에 반영된다. 교사는 인사기록카드에서 현재 호봉, 차기 승급일과 잔여기간을 확인할 수 있다. 정기승급은 해당 월 급여에 반영되도록 학교가 승급일 전후로 처리한다. 경력합산신청서는 호봉 정정의 증빙이 되므로 학교가 보존하고, 교사도 사본을 보관한다.","sources":[{"title":"공무원보수 등의 업무지침(2026. 1. 22.) — 제1장 공무원 봉급업무 처리기준","publisher":"인사혁신처(공공데이터포털 원문)","year":2026,"url":"https://www.data.go.kr/data/15099914/fileData.do"},{"title":"공무원보수규정","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/공무원보수규정"},{"title":"공무원보수 등의 업무지침(인사혁신처예규 제220호, 2026. 7. 31.) — 제1장 봉급업무 처리기준·별지 서식","publisher":"인사혁신처(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000283466"},{"title":"교육공무원 호봉획정시 경력환산율표의 적용 등에 관한 예규(교육부예규 제97호, 2025. 4. 23.)","publisher":"교육부(국가법령정보센터)","year":2025,"url":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000258052"},{"title":"기간제교원의 봉급 지급에 관한 예규(교육부예규 제69호)","publisher":"교육부(국가법령정보센터)","year":2022,"url":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000212329"}],"verified":"2026-09-29","uncertain":["기간제교원의 호봉(봉급) 산정과 자격 취득 반영 절차는 「기간제교원의 봉급 지급에 관한 예규」를 따르며, 이 항목에서는 자세히 확인하지 못했다(국가법령정보센터 본문 파일은 개정안 형태만 확인)","나이스에서 교사 본인이 호봉 재획정을 직접 신청하는 메뉴가 있는지는 확인하지 못했다","호봉 획정·승급·정정 발령권자(학교장·교육장·교육감)는 시·도교육청 임용권 위임 규정에 따라 다르다","사범계 가산연수의 세부 인정 범위(교육대학원, 부전공·복수전공 등)는 영 별표 23 비고와 교육부 예규로 개별 확인이 필요하다","사립학교 교원의 호봉 획정 시행권자와 절차는 학교법인 규정에 따라 다를 수 있다"],"related":["performance-pay","parental-leave","leave-of-absence","discipline-appeal","transfer"]},{"id":"discipline-appeal","title":"징계·불리한 처분을 받았을 때 — 징계위원회 진술, 징계 종류, 교원소청심사(30일), 행정소송, 불문경고·경고·주의 구분","aka":["징계","징계위원회","징계위 출석","출석통지서","징계 의견서","견책","감봉","정직","해임","파면","불문경고","경고장","주의 처분","소청","소청심사","교원소청심사위원회","행정소송","직위해제","징계 기록 말소","처분사유설명서"],"category":"인사·보수","urgency":"사후","roles":["교사 본인(징계등 혐의자)","학교장(징계의결 요구 신청·출석 통지 전달)","교육지원청 일반징계위원회(경징계)","시·도교육청 일반징계위원회(중징계)","교육감·교육장(징계 처분권자)","교원소청심사위원회","법원(행정소송)"],"summary":"국공립 교원의 징계는 파면·해임·강등·정직(중징계)과 감봉·견책(경징계)이며, 징계위원회 의결을 거쳐 처분권자가 처분한다. 혐의자는 출석통지서를 받고 징계위원회에 나가 구술이나 의견서로 진술하고 증거를 내며 증인 심문과 위원 기피를 신청할 수 있고, 진술 기회 없이 한 의결은 무효다. 징계와 직위해제, 휴직·직권면직 같은 불리한 처분, 징계위원회 의결로 받은 불문경고는 처분이 있음을 안 날부터 30일 이내에 교원소청심사위원회에 소청심사를 청구할 수 있고, 위원회는 원처분보다 불리한 결정을 할 수 없다. 반면 학교장·교육청이 주는 경고·주의는 처분성이 없어 소청 대상이 아니므로 고충심사로 다루며, 인사혁신처 예규상 처분 뒤 1년 동안 근무성적평정·성과상여금·포상 등에 불이익이 있다. 국공립 교원이 소청 결정에도 불복하면 원처분권자를 피고로 행정소송을 내며, 공무원은 소청을 거치지 않으면 행정소송을 할 수 없다.","first":["받은 문서가 무엇인지부터 확인한다 — 징계의결 요구서 사본, 출석통지서, 징계처분 사유설명서, 불문경고, 학교장 경고·주의장, 직위해제 통지는 대응이 모두 다르다","출석통지서를 받으면 수령을 거부하지 말고 날짜를 확인한다. 수령 거부는 진술권 포기로 본다","혐의 내용에 대한 반박·정상(공적, 표창, 성실한 업무 중 과실 등) 자료와 의견서를 준비하고, 필요하면 증인 심문과 위원 기피를 서면으로 신청한다","처분사유설명서를 받은 날(처분을 안 날)을 적어 두고 30일 기한을 달력에 표시한다 — 소청심사청구서는 이 기간 안에 위원회에 도달해야 한다","소청심사청구서 2부(원본·부본)에 처분사유설명서 사본과 증거를 붙여 교원소청심사위원회에 방문·우편·팩스·온라인(행정심판 온라인시스템)으로 낸다. 청구서 서식은 위원회 누리집 관련서식에서 받는다. 비용은 없고 변호사 선임은 선택이다","사건 관계인·피해자에게 연락해 진술을 바꾸게 하거나 신상을 알리지 않는다 — 별도 비위가 된다"],"steps":[{"stage":"미리 확인","when":"비위 조사·감사·수사가 시작될 때","who":"교사 본인","what":"징계 사유와 절차 이해","detail":"징계 사유는 국가공무원법과 그 명령 위반, 직무상 의무 위반·직무 태만, 직무 안팎을 가리지 않는 체면·위신 손상이다. 징계의결 요구권자는 사유가 있으면 반드시 징계의결을 요구해야 한다. 감사원 조사 중에는 징계 절차를 진행하지 못하고, 수사기관 수사 중에는 진행하지 않을 수 있다. 징계 시효는 사유 발생일부터 일반 3년, 금품·향응 등은 5년, 성폭력·성희롱 등 성 비위는 10년이다.","basis":"국가공무원법 제78조·제83조·제83조의2"},{"stage":"신청·보고","when":"징계의결이 요구되었을 때","who":"학교장·교육지원청 → 교사 본인","what":"징계의결 요구서 사본 받기","detail":"공립 중학교 교사의 경징계(감봉·견책) 사건은 교육지원청 일반징계위원회가, 중징계(파면·해임·강등·정직) 사건은 시·도교육청 일반징계위원회가 심의·의결한다. 학교장은 충분히 조사한 뒤 관계 자료를 붙여 상급기관에 징계의결 요구를 신청하고, 요구권자는 요구와 동시에 요구서 사본을 혐의자에게 보낸다. 중징계 의결이 요구되면 직위해제될 수 있다.","basis":"교육공무원 징계령 제2조 제4항·제6조 제1항·제7항; 교육공무원법 제44조의2 제1항 제2호"},{"stage":"신청·보고","when":"징계위원회 개최 3일 전까지","who":"징계위원회 → 교사 본인","what":"출석통지서 수령과 진술 준비","detail":"출석통지서는 개최일 3일 전까지 도달해야 한다. 혐의자는 의견서(교육공무원 징계령 별지 제3호의2서식)나 구술로 자기에게 이익이 되는 사실을 진술하고 증거를 낼 수 있으며, 증인 심문을 신청할 수 있다. 위원이 혐의자의 직근 상급자이거나 사유와 관계가 있으면 제척되고, 불공정 우려가 있으면 서면으로 기피를 신청한다. 혐의를 모두 인정하면 우선심사를 신청할 수 있다. 출석을 원하지 않으면 출석통지서(별지 제3호서식) 아래쪽의 진술권 포기서를 낸다.","basis":"교육공무원 징계령 제8조 제1항·제3항, 제9조, 제9조의3 제3항, 제13조"},{"stage":"결재·승인","when":"요구서 접수일부터 60일 이내","who":"일반징계위원회","what":"심의·의결","detail":"징계위원회는 요구서를 접수한 날부터 60일(성 관련 비위만이면 30일) 안에 의결하고, 부득이하면 30일 연장한다. 일반징계위원회는 위원장 포함 5명 이상 출석, 출석 과반수 찬성으로 의결한다. 혐의 당시 직급, 비위가 공직 안팎에 미치는 영향, 평소 행실, 공적, 뉘우치는 정도를 고려하고, 교육공무원 징계기준(비위 정도와 고의·과실)에 따라 양정한다. 2회 이상 출석통지에도 정당한 사유 없이 나오지 않거나 통지서 수령을 거부하면 서면심사로 의결할 수 있다. 진술 기회를 주지 않은 의결은 무효다.","basis":"교육공무원 징계령 제7조·제8조 제4항·제7항·제10조·제15조; 교육공무원법 제50조 제3항; 교육공무원 징계양정 등에 관한 규칙 제2조·별표"},{"stage":"결재·승인","when":"의결 때","who":"징계위원회","what":"감경·불문경고 판단","detail":"훈장·포장, 국무총리 이상 표창(교사는 교육감·차관급 청장 이상 표창), 모범공무원 공적이 있거나 성실하고 능동적인 업무 중 과실이면 감경할 수 있다. 견책에 해당하는 비위를 불문으로 감경하면서 경고가 필요하면 '불문으로 의결한다. 다만, 경고할 것을 권고한다'고 의결한다(불문경고). 금품·향응, 성 비위, 음주운전, 학생 폭력, 학생 성적·학교생활기록부 비위, 학교폭력 은폐, 인사 비위, 부정청탁 등은 감경할 수 없다.","basis":"교육공무원 징계양정 등에 관한 규칙 제4조·제5조; 공무원 징계령 시행규칙 제6조 제2항"},{"stage":"사용·이행","when":"의결서를 받은 날부터 15일 이내","who":"처분권자(교육감·교육장)","what":"징계 처분과 사유설명서 교부","detail":"처분권자는 의결서를 받은 날부터 15일 이내에 처분하고, 처분사유설명서에 의결서 사본을 붙여 대상자에게 준다. 이 설명서를 받은 날이 보통 소청 청구기간의 기준인 '처분이 있었음을 안 날'이 된다. 정직·감봉 등은 휴직 기간 중에는 집행이 정지된다.","basis":"교육공무원 징계령 제17조 제1항·제2항; 국가공무원법 제80조 제6항; 교원소청심사위원회 '청구서 작성요령'"},{"stage":"이의·구제","when":"처분이 있음을 안 날부터 30일 이내","who":"교사 본인","what":"교원소청심사 청구","detail":"대상: 파면·해임·강등·정직·감봉·견책, 징계위원회 의결에 따른 불문경고, 그 밖의 불리한 처분(직위해제, 직권면직, 휴직, 강임 등). 소청심사청구서에 청구인·피청구인(처분권자)·처분 내용·처분을 안 날·청구 취지·이유와 입증방법을 적고 2부(원본·부본)를 낸다. 처분사유설명서나 인사발령통지서 사본을 반드시 붙인다. 우편은 소인 날짜와 관계없이 30일 안에 도달해야 하고, 팩스는 도달을 전화로 확인한다. 온라인은 행정심판 온라인시스템(simpan.go.kr)으로 한다. 비용은 없고 변호사 대리인은 선택이다.","basis":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 제7조·제9조 제1항; 교원소청에 관한 규정 제2조; 교원소청심사위원회 '청구안내'·'청구대상'·'자주묻는 질문답변'"},{"stage":"이의·구제","when":"청구 뒤 결정까지","who":"교사 본인, 교원소청심사위원회","what":"소청 심사 진행","detail":"위원회는 청구서에 흠이 있으면 접수 7일 이내에 보정을 요구하고, 기간 안에 보정하지 않으면 취하한 것으로 본다. 처분권자의 답변서 부본이 오면 보충서면·증거로 반박할 수 있다(횟수 제한 없음, 60일 안 결정을 위해 40일 전후까지 권장). 심사기일은 5일 전에 통지되고, 출석이 어려우면 서면으로 진술하거나 연기신청서를 낸다. 결정은 접수일부터 60일 이내(30일 연장 가능)이며, 원처분보다 불리한 결정은 할 수 없다. 결정서는 결정일부터 15일 이내에 보낸다.","basis":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 제10조 제1항; 교원소청에 관한 규정 제6조·제16조 제4항; 교원소청심사위원회 '처리절차'·'자주묻는 질문답변'"},{"stage":"이의·구제","when":"결정서를 받은 뒤","who":"처분권자 / 교사 본인","what":"결정의 효력과 구제조치","detail":"결정은 각하·기각·취소·변경·무효확인·의무이행 등이며 처분권자를 기속한다. 처분권자는 결정서를 송달받은 날부터 30일 이내에 결정 취지대로 구제조치를 하고 결과를 위원회에 낸다. 이행하지 않으면 교육감 등이 구제명령을 내리고 이행강제금을 부과한다. 징계·직위해제가 취소되면 원래 정기승급일 기준 보수 차액을 소급 지급받고 기록이 말소된다.","basis":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 제10조 제2항·제3항, 제10조의2~제10조의4; 공무원보수규정 제30조; 공무원 인사기록·통계 및 인사사무 처리 규정 제9조 제1항 제2호"},{"stage":"이의·구제","when":"소청 결정에도 불복할 때","who":"교사 본인","what":"행정소송","detail":"공무원의 징계·불리한 처분에 관한 행정소송은 소청심사를 거쳐야 제기할 수 있다. 교원소청심사위원회는 국·공립 교원은 원처분권자(교육감 등)를 피고로 행정소송을 제기해야 한다고 안내한다. 행정심판을 거친 취소소송의 제소기간은 재결서(결정서) 정본을 송달받은 날부터 90일이다. 교원지위법 제10조 제4항의 '결정서 송달일부터 30일'은 위원회가 사립학교 교원·학교법인 등의 소송으로 설명하는 기간이다.","basis":"국가공무원법 제16조 제1항; 행정소송법 제20조 제1항; 교원의 지위 향상 및 교육활동 보호를 위한 특별법 제10조 제4항; 교원소청심사위원회 '자주묻는 질문답변'(소청결정에 불복하는 방법)"},{"stage":"사후 관리","when":"처분 확정 뒤","who":"교사 본인, 인사 담당","what":"승급·승진 제한과 기록 말소","detail":"징계처분 집행이 끝난 날부터 강등·정직 18개월, 감봉 12개월, 견책 6개월 동안 승급·승진임용이 제한되고, 금품·소극행정·음주운전·성 비위(승진은 학생성적 관련 비위 등 포함)는 각각 6개월이 더해진다. 기록은 집행이 끝난 날부터 강등 9년, 정직 7년, 감봉 5년, 견책 3년이 지나면 말소된다. 말소권자는 사유가 생긴 날부터 14일 이내에 말소하고 말소통지서를 보내야 하며, 그러지 않으면 본인이 징계등처분기록말소신청서를 낸다. 파면은 5년, 해임은 3년 동안 공무원이 될 수 없다. 징계를 받으면 정부포상 추천도 제한될 수 있으니 정부포상 업무지침을 확인한다.","basis":"공무원보수규정 제14조 제1항 제2호; 교육공무원임용령 제16조; 공무원 인사기록·통계 및 인사사무 처리 규정 제9조; 국가공무원법 제33조 제7호·제8호; 국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 2026) 제12장 Ⅱ 말소 기한·<붙임 2>"},{"stage":"사후 관리","when":"학교장·교육청의 경고·주의를 받았을 때","who":"교사 본인","what":"경고·주의는 소청이 아니라 고충심사","detail":"경고·주의는 징계책임을 물을 정도에 이르지 않는 비위에 대해 지휘·감독권자가 하는 조치로 처분성이 없어 교원소청심사위원회 심사 대상이 아니다. 인사혁신처 예규에 따르면 경고는 주의보다 무겁거나 시효가 지났거나 1년 안에 다시 주의에 해당하는 비위를 한 경우, 주의는 비위가 경미한 경우이며, 경고·주의장을 교부하고 처분대장에 1년간 기록한다. 경고는 처분 후 1년 이내 근무성적평정·성과상여금 등급 조정·포상 추천·해외연수 선발에, 주의는 포상 추천·해외연수 선발에 불이익이 있고, 1년이 지나면 기록을 말소한다. 부당하다고 생각되면 인사상담이나 고충심사를 청구할 수 있다.","basis":"교원소청심사위원회 '자주묻는 질문답변'(경고·주의); 국가공무원 복무·징계 관련 예규(2026) 제12장 Ⅻ 공무원의 경고·주의 등 처분 지침; 교육공무원법 제49조"}],"deadlines":[{"what":"징계위원회 출석통지서 도달","limit":"개최일 3일 전까지","basis":"교육공무원 징계령 제8조 제1항"},{"what":"징계위원회 의결","limit":"요구서 접수일부터 60일(성 관련 비위만이면 30일), 30일 범위 연장 가능","basis":"교육공무원 징계령 제7조 제1항"},{"what":"징계 처분","limit":"처분권자가 의결서를 받은 날부터 15일 이내","basis":"교육공무원 징계령 제17조 제1항"},{"what":"교원소청심사 청구","limit":"처분이 있었던 것을 안 날부터 30일 이내(위원회 도달 기준)","basis":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 제9조 제1항; 교원소청심사위원회 FAQ"},{"what":"청구서 보정","limit":"위원회가 접수 7일 이내 보정 요구, 정한 기간 안 미보정 시 취하 간주","basis":"교원소청에 관한 규정 제6조"},{"what":"소청 결정","limit":"청구 접수일부터 60일 이내, 30일 연장 가능. 결정서는 결정일부터 15일 이내 송부","basis":"교원지위법 제10조 제1항; 교원소청심사위원회 '처리절차'"},{"what":"처분권자의 구제조치","limit":"결정서 송달일부터 30일 이내","basis":"교원지위법 제10조 제3항"},{"what":"행정소송(국공립 교원)","limit":"소청 결정서 정본 송달일부터 90일 이내, 원처분권자 피고","basis":"행정소송법 제20조 제1항; 국가공무원법 제16조; 교원소청심사위원회 FAQ"},{"what":"징계 시효","limit":"사유 발생일부터 일반 3년, 금품·향응 등 5년, 성 비위 10년","basis":"국가공무원법 제83조의2 제1항"}],"dont":["출석통지서 수령을 거부하지 않는다 — 진술권을 포기한 것으로 본다(교육공무원 징계령 제8조 제7항)","소청 기한을 우편 소인 날짜로 계산하지 않는다 — 30일 안에 위원회에 도달해야 하고, 지나면 각하된다","소청 청구를 가볍게 취하하지 않는다 — 취하는 철회할 수 없고 다시 청구해도 30일 기간이 지났으면 심사 대상에서 빠진다","소청을 거치지 않고 곧바로 행정소송을 내지 않는다 — 공무원의 징계·불리한 처분 소송은 소청 전치다(국가공무원법 제16조)","징계위원회 회의장에 녹음기·휴대전화로 녹음·촬영하지 않는다 — 회의 참석자 준수사항 위반이다","피해자·신고자에게 연락해 합의를 강요하거나 신상을 퍼뜨리지 않는다 — 2차 피해·신고자 불이익은 그 자체로 파면~견책 징계기준이 있다","소청 입증자료의 주민등록번호 등 개인정보를 가리지 않은 채 내지 않는다 — 부본은 처분권자에게 그대로 송달된다","학교장 경고·주의를 소청으로 다투지 않는다 — 처분성이 없어 각하되므로 고충심사를 이용한다"],"contacts":[{"name":"교원소청심사위원회","tel":"044-203-7402","note":"소청 청구 문의(044-203-7435도 안내됨). 팩스 044-868-8125, 온라인 소청 문의 044-203-7442. 세종특별자치시 한누리대로 492 청암빌딩 6층"},{"name":"소속 교육지원청 교육지원과","tel":"소속 교육지원청","note":"경징계 사건 관할 일반징계위원회, 보통고충심사 문의"}],"forms":["교육공무원 징계 의결 또는 징계부가금 부과 의결 요구(신청)서 사본 — 요구권자가 혐의자에게 보냄(교육공무원 징계령 별지 제1호서식)","출석통지서와 진술권 포기서(교육공무원 징계령 별지 제3호서식)","징계등 혐의자 의견서(별지 제3호의2서식)·증거자료·증인 심문 신청","위원 기피 신청서(서면), 우선심사 신청서(별지 제3호의3서식)","징계처분 사유설명서(별지 제5호서식)와 의결서 사본","소청심사청구서(원본·부본 2부) — 교원소청심사위원회 관련서식","대리인 위임장, 취하서, 심사기일 연기신청서, 증인신청서, 심사위원 기피신청서 — 교원소청심사위원회 관련서식","중앙고충심사청구서(보통고충심사 결과에 불복할 때) — 교원소청심사위원회 관련서식","징계등처분기록말소신청서, 경고(주의)장 — 국가공무원 복무·징계 관련 예규 붙임·별지 제5호서식"],"law":[{"name":"교육공무원법","article":"제50조 제3항, 제51조, 제53조 제1항","point":"진술 기회를 주지 않은 징계 의결은 무효. 기관장은 징계사유가 있으면 지체 없이 의결 요구. 교원에게는 소청심사위원회를 교원소청심사위원회로 봄"},{"name":"교육공무원 징계령","article":"제2조, 제7조~제10조, 제13조, 제17조","point":"경징계는 교육지원청·중징계는 시도교육청 일반징계위원회, 60일 의결, 3일 전 출석통지, 진술·증거·증인·기피, 15일 내 처분과 사유설명서 교부"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제7조, 제9조, 제10조~제10조의4","point":"징계·불리한 처분은 안 날부터 30일 이내 소청, 60일(+30일) 결정, 결정은 처분권자 기속·30일 내 구제조치, 불이행 시 구제명령·이행강제금"},{"name":"국가공무원법","article":"제16조, 제79조, 제80조, 제83조의2","point":"소청 전치, 징계 6종과 효력(정직 1~3개월 보수 전액 감, 감봉 1~3개월 1/3 감), 징계 시효"},{"name":"교육공무원 징계양정 등에 관한 규칙","article":"제2조·별표, 제4조, 제5조","point":"비위 유형·정도·고의 과실별 징계기준, 표창 공적 등 감경과 감경 불가 비위, 공무원 징계령 시행규칙(불문경고 의결 방식) 준용"},{"name":"행정소송법","article":"제20조","point":"행정심판(소청)을 거친 취소소송은 재결서 정본 송달일부터 90일 이내"},{"name":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호)","article":"제12장 Ⅱ(처분 기록 말소)·Ⅺ(우선심사)·Ⅻ(경고·주의 처분 지침)","point":"말소권자는 사유 발생 14일 이내 말소·통지(안 하면 본인이 말소신청), 경고·주의의 요건·1년간 인사상 불이익·1년 뒤 말소"}],"deep":[{"title":"징계위원회에서 할 수 있는 것","body":["진술 기회는 법이 보장한다. 진술 기회를 주지 않은 징계 의결은 무효다. 혐의자는 출석해 구술로 말하거나 의견서를 내고, 자기에게 유리한 증거를 제출하며, 증인 심문을 신청할 수 있다(채택 여부는 위원회가 결정).","위원 가운데 혐의자의 직근 상급자(사유 발생 기간 포함)나 사건 관계인이 있으면 제척되고, 불공정한 의결 우려가 있으면 서면으로 기피를 신청할 수 있다. 위원회는 심의 전에 기피 여부를 의결한다.","해외 체재·구속 등으로 요구서 접수일부터 50일 안에 출석할 수 없으면 서면으로 진술하게 하고, 진술하지 않으면 진술 없이 의결할 수 있다. 원격영상회의로도 심의할 수 있다."],"basis":"교육공무원법 제50조 제3항; 교육공무원 징계령 제8조~제10조의2, 제13조"},{"title":"불문경고·경고·주의는 서로 다르다","body":["불문경고는 징계위원회가 견책에 해당하는 비위를 불문으로 감경하거나 불문으로 의결하면서 경고를 권고한 것이다. 징계는 아니지만 인사기록에 등재되고 말소 대상이며, 교원소청심사위원회는 불문경고를 소청 청구 대상으로 안내한다. 공무원보수 등의 업무지침은 징계처분 취소 뒤 보수 지급에서 '징계하지 아니하기로 의결한 경우'에 불문경고를 포함한다.","학교장·교육청이 징계위원회를 거치지 않고 주는 경고·주의는 소청 대상이 아니다. 인사혁신처 예규는 경고를 '징계에 이르지 않지만 주의보다 무겁거나, 시효가 지났거나, 주의 뒤 1년 안에 다시 주의에 해당하는 비위를 한 경우', 주의를 '비위가 경미한 경우'로 나누고, 처분 뒤 1년 동안 경고는 근무성적평정·성과상여금·포상·해외연수, 주의는 포상·해외연수에서 불이익을 준다. 1년이 지나면 처분 기록을 말소한다."],"basis":"공무원 징계령 시행규칙 제6조 제2항; 국가공무원 복무·징계 관련 예규(2026) 제12장 Ⅻ; 공무원보수 등의 업무지침(2026) 제1장 5; 교원소청심사위원회 '청구안내'·FAQ"},{"title":"소청심사청구서 쓰는 법","body":["사건명은 받은 처분 뒤에 원하는 결정을 붙인다(예: 감봉처분취소청구). 피청구인은 처분을 한 사람의 직위(예: ○○도교육감, ○○교육지원청 교육장)를 적는다. '처분이 있었던 것을 안 날'은 사유설명서를 받은 날짜 등으로 적는다.","청구 취지에는 원하는 결정을, 청구 이유에는 처분 사유별로 반박을 항목화하고 절차상 문제(진술 기회, 출석통지 기한, 위원 제척 등)는 따로 적는다. 증거에는 번호를 붙이고, 청구서와 증거는 2부를 낸다. 청구인이 낸 자료는 부본이 처분권자에게 가므로 개인정보는 가린다. 청구서 서식(소청심사청구서)과 위임장·취하서·연기신청서·증인신청서·기피신청서는 위원회 누리집 관련서식에서 받는다."],"basis":"교원소청심사위원회 '청구서 작성요령'; 교원소청에 관한 규정 제2조"},{"title":"직위해제는 징계가 아니지만 불리한 처분이다","body":["직무수행 능력 부족·근무성적 극히 불량, 파면·해임·강등·정직 의결 요구 중, 형사사건 기소(약식명령 제외), 금품·성범죄 등 중대 비위로 조사·수사 중인 경우 직위를 주지 않을 수 있다. 사유가 없어지면 지체 없이 직위를 다시 준다.","직위해제 중 봉급은 능력 부족 사유 80%, 중징계 요구·기소·중대 비위 수사 사유 50%(3개월이 지나도 직위를 못 받으면 30%)다. 직위해제도 교원소청심사 청구 대상이다."],"basis":"교육공무원법 제44조의2; 공무원보수규정 제29조; 교원소청심사위원회 '청구대상'"}],"tables":[{"title":"징계·경고의 종류와 효과","head":["구분","효력","승급 제한(집행 종료 후)","기록 말소","소청 대상"],"rows":[["파면(중징계)","공무원 관계 배제, 5년간 공무원 임용 결격","—","—","대상"],["해임(중징계)","공무원 관계 배제, 3년간 공무원 임용 결격","—","—","대상"],["강등(중징계)","동종 직무 하위 직위 임명, 3개월 직무 정지·보수 전액 감","18개월","9년","대상"],["정직(중징계)","1~3개월 직무 정지, 보수 전액 감","18개월","7년","대상"],["감봉(경징계)","1~3개월 보수 3분의 1 감","12개월","5년","대상"],["견책(경징계)","잘못을 훈계하고 회개하게 함","6개월","3년","대상"],["불문경고(징계위원회 의결)","징계 아님. 인사기록 등재","—","말소 대상","대상"],["경고·주의(학교장·교육청)","징계 아님. 1년 이내 경고는 근평·성과상여금·포상·해외연수, 주의는 포상·해외연수 불이익","—","처분일부터 1년 뒤 말소","대상 아님(고충심사)"]],"note":"금품·향응, 소극행정, 음주운전, 성 비위로 인한 징계는 승급 제한 기간에 6개월을 더한다(승진 제한은 학생성적 관련 비위 등도 가산). 근거: 국가공무원법 제33조·제80조, 공무원보수규정 제14조, 교육공무원임용령 제16조, 공무원 인사기록·통계 및 인사사무 처리 규정 제9조, 국가공무원 복무·징계 관련 예규(2026) 제12장, 교원소청심사위원회 청구안내·FAQ."}],"faq":[{"q":"소청을 하면 오히려 징계가 더 무거워질 수 있나요?","a":"아니다. 교원소청에 관한 규정 제16조 제4항에 따라 위원회는 청구 대상 처분보다 청구인에게 불리한 결정을 하지 못한다. 결과는 원처분과 같거나 유리하다."},{"q":"불문경고도 소청할 수 있나요? 교장선생님이 준 경고장은요?","a":"징계위원회 의결에 따른 불문경고는 교원소청심사위원회가 청구 대상으로 안내한다. 학교장·교육청이 징계위원회를 거치지 않고 준 경고·주의는 처분성이 없어 심사 대상이 아니므로 고충심사(교육공무원법 제49조)를 이용한다. 경고·주의라도 1년 동안 근평·성과상여금·포상 등에 불이익이 있으니(인사혁신처 예규) 사실관계가 다르면 고충심사로 다툰다."},{"q":"변호사를 꼭 써야 하나요? 비용은요?","a":"변호사 선임은 선택이고 위원회가 받는 비용은 없다. 대리인을 선임해도 청구인 혼자, 대리인 혼자, 함께 심사에 참석할 수 있다."},{"q":"기간제교사도 소청심사를 청구할 수 있나요?","a":"교원소청심사위원회 안내에 따르면 초·중등학교 기간제교원은 교원지위법상 소청을 청구할 수 있는 '교원'에 포함되지 않는다. 계약 관련 분쟁은 다른 구제 절차를 알아봐야 한다."},{"q":"징계 기록은 영원히 남나요?","a":"집행이 끝난 날부터 강등 9년, 정직 7년, 감봉 5년, 견책 3년이 지나면 말소한다(그 사이 다른 징계가 있으면 기간을 합산). 소청이나 법원에서 무효·취소가 확정되거나 일반사면이 있어도 말소한다. 말소권자는 사유가 생긴 날부터 14일 이내에 말소하고 통지해야 하며, 통지가 없으면 본인이 징계등처분기록말소신청서를 낸다(국가공무원 복무·징계 관련 예규)."},{"q":"정직 중에 휴직하면 어떻게 되나요?","a":"강등(직무 정지·보수 감액 부분), 정직, 감봉 처분은 휴직 기간 중에는 집행이 정지된다(국가공무원법 제80조 제6항). 복직하면 남은 기간을 집행한다."}],"record":"징계는 교사 개인의 근무상황 신청이 아니라 처분권자(시·도교육청·교육지원청)가 나이스 교원인사의 임용발령(징계)으로 발령하고 인사기록에 반영한다. 불문경고는 징계가 아니지만 인사기록에 등재되고 말소 대상이다. 말소는 기록을 지우는 것이 아니라 말소 사실을 등록해 관리하는 방식이며, 세부 나이스 입력 방법은 시·도교육청 안내를 따른다. 학교장·교육청의 경고·주의는 경고·주의장(국가공무원 복무·징계 관련 예규 별지 제5호서식)을 교부하고 경고·주의 처분대장(별지 제6호서식)에 1년간 기록한 뒤 말소한다.","sources":[{"title":"교원소청심사위원회 — 청구안내","publisher":"교원소청심사위원회","year":2026,"url":"https://www.ace.go.kr/act/o_request_guide.do"},{"title":"교원소청심사위원회 — 청구대상","publisher":"교원소청심사위원회","year":2026,"url":"https://www.ace.go.kr/act/o_request_object.do"},{"title":"교원소청심사위원회 — 처리절차","publisher":"교원소청심사위원회","year":2026,"url":"https://www.ace.go.kr/act/o_request_process.do"},{"title":"교원소청심사위원회 — 청구서 작성요령","publisher":"교원소청심사위원회","year":2026,"url":"https://www.ace.go.kr/act/o_request_writingguide.do"},{"title":"교원소청심사위원회 — 자주묻는 질문답변","publisher":"교원소청심사위원회","year":2026,"url":"https://www.ace.go.kr/act/o_participate_reqeust.do"},{"title":"교육공무원 징계령(시행 2025.12.23.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원징계령"},{"title":"교육공무원 징계양정 등에 관한 규칙(시행 2025.12.23.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원징계양정등에관한규칙"},{"title":"공무원 징계령 시행규칙(시행 2025.12.30.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/공무원징계령시행규칙"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법(시행 2026.2.19.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"교원소청에 관한 규정","publisher":"국가법령정보센터","year":2021,"url":"https://www.law.go.kr/법령/교원소청에관한규정"},{"title":"국가공무원법(시행 2026.6.2.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원법"},{"title":"행정소송법","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/행정소송법"},{"title":"공무원 인사기록·통계 및 인사사무 처리 규정","publisher":"국가법령정보센터","year":2024,"url":"https://www.law.go.kr/법령/공무원인사기록·통계및인사사무처리규정"},{"title":"교원소청심사위원회 — 관련서식(소청심사청구서, 대리인 위임장, 취하서, 심사기일 연기신청서, 증인신청서, 심사위원 기피신청서, 중앙고충심사청구서)","publisher":"교원소청심사위원회","year":2026,"url":"https://www.ace.go.kr/act/o_bbs_doc.do"},{"title":"교육공무원 징계령 별지 제1호·제3호·제3호의2·제3호의3·제5호서식","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교육공무원징계령"},{"title":"국가공무원 복무·징계 관련 예규(인사혁신처예규 제213호, 2026.6.23.) 제12장 징계",   { k: '사후 관리', sub: '기록·반환·관리', re: /사후|기록|관리|반환|보관/ }
];
PHASES.forEach(p => { p.name = p.k; });
function phaseOf(s, prev){
  const want = String(s.stage || '').replace(/\s/g, '');
  let idx = PHASES.findIndex(p => p.k.replace(/\s/g, '') === want);
  if (idx < 0){
    const t = (s.what || '') + ' ' + (s.when || '');
    idx = PHASES.findIndex(p => p.re.test(t));
    if (idx < 0 || idx < prev) idx = prev;   // 모르면 앞 단계를 이어 간다
  }
  return idx;
}
function layoutSteps(c){
  let prev = 0;
  return (c.steps || []).map((s, i) => {
    const p = phaseOf(s, prev);
    prev = p;
    return { i, s, lane: s.lane || laneOf(s.who), phase: p };
  });
}

/* ---------- 검색 ---------- */
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function prep(c){
  if (c._txt) return;
  const parts = [c.summary, (c.first||[]).join(' '), (c.steps||[]).map(s => [s.what, s.detail, s.who].join(' ')).join(' '),
    (c.dont||[]).join(' '), (c.faq||[]).map(f => f.q + ' ' + f.a).join(' '), (c.law||[]).map(l => l.name + l.article).join(' '), c.record];
  c._txt = norm(parts.join(' '));
  c._t = norm(c.title); c._aka = (c.aka||[]).map(norm);
}
function score(c, q){
  const words = q.split(/\s+/).filter(Boolean).map(norm);
  if (!words.length) return 1;
  prep(c);
  let s = 0;
  for (const w of words){
    if (c._t.includes(w)) s += 12;
    else if (c._aka.some(a => a.includes(w) || (a.length >= 2 && w.includes(a)))) s += 9;
    else if (c._txt.includes(w)) s += 3;
    else if (w.length >= 3 && (c._t + c._aka.join('')).includes(w.slice(0, 2))) s += 1;
    else return 0;
  }
  return s;
}
function snippet(c, q){
  const w = norm(q.split(/\s+/)[0] || '');
  if (!w || c._t.includes(w) || c._aka.some(a => a.includes(w))) return '';
  const pool = [...(c.first||[]), ...(c.steps||[]).map(s => s.what + (s.detail ? ' — ' + s.detail : '')), ...(c.faq||[]).map(f => 'Q. ' + f.q), ...(c.dont||[])];
  const hit = pool.find(t => norm(t).includes(w));
  return hit ? (hit.length > 80 ? hit.slice(0, 80) + '…' : hit) : '';
}

/* ---------- 기한 계산 ---------- */
function parseLimit(t){
  const s = String(t || '');
  let m;
  if ((m = s.match(/(\d+)\s*시간/))) return { h: +m[1] };
  if ((m = s.match(/(\d+)\s*(영업일|근무일|평일)/))) return { bd: +m[1] };
  if ((m = s.match(/(\d+)\s*일\s*(이내|안|까지|내|전)/))) return { d: +m[1] };
  if ((m = s.match(/(\d+)\s*주\s*(이내|안|까지|내)/))) return { d: +m[1] * 7 };
  if (/즉시|지체 ?없이|바로|당장/.test(s)) return { now: true };
  if (/당일/.test(s)) return { today: true };
  return null;
}
const DOW = '일월화수목금토';
function fmt(d, withTime){
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]})` + (withTime ? ` ${p(d.getHours())}:${p(d.getMinutes())}` : '');
}
function dueText(lim, base){
  const L = parseLimit(lim);
  if (!L || !base) return '';
  if (L.now) return '<span style="color:var(--err)">바로</span>';
  if (L.today) return fmt(base) + ' 안';
  if (L.h) return fmt(new Date(base.getTime() + L.h * 3600e3), true) + '까지';
  if (L.d){ const d = new Date(base); d.setDate(d.getDate() + L.d); return fmt(d) + '까지<small>달력일 기준 · 첫날 셈법은 원문 확인</small>'; }
  if (L.bd){ const d = new Date(base); let n = L.bd; while (n > 0){ d.setDate(d.getDate() + 1); if (d.getDay() % 6) n--; } return fmt(d) + '까지<small>주말 뺌 · 공휴일은 따로 빼세요</small>'; }
  return '';
}

// 마우스 말풍선(마우스가 있는 기기만)
const canHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
function showTip(el, s, i){
  if (!canHover) return;
  const t = document.getElementById('tip');
  const how = (s.how || []).slice(0, 4);
  t.innerHTML = `<b>S${String(i + 1).padStart(2, '0')} ${esc(s.what)}</b><div class="tw">${esc([s.when, s.who].filter(Boolean).join(' · '))}</div>${s.detail ? esc(s.detail) : ''}${how.length ? `<ol>${how.map(h => `<li>${esc(h)}</li>`).join('')}</ol>` : ''}<div class="more">눌러서 자세히 보기</div>`;
  const r = el.getBoundingClientRect();
  t.classList.add('on');
  const tw = t.offsetWidth, th = t.offsetHeight;
  let x = r.right + 10, y = r.top;
  if (x + tw > innerWidth - 8) x = r.left - tw - 10;
  if (x < 8) x = Math.min(innerWidth - tw - 8, Math.max(8, r.left));
  if (y + th > innerHeight - 8) y = Math.max(8, innerHeight - th - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip(){ const t = document.getElementById('tip'); if (t) t.classList.remove('on'); }
window.addEventListener('scroll', hideTip, { passive: true });
// 흐름도 화살표: 단계 번호 순서대로 잇는다
function drawArrows(){
  const flow = document.getElementById('flow'), svg = document.getElementById('arrows');
  if (!flow || !svg || !flowState || flow.offsetParent === null) return;
  const sc = document.getElementById('flowscroll');
  // 화면에 다 들어오면 머리 줄을 붙여 둔다(내려도 단계 이름이 보이게)
  sc.classList.remove('fit'); if (flow.scrollWidth <= sc.clientWidth + 1) sc.classList.add('fit');
  const fr = flow.getBoundingClientRect();
  const R = i => { const n = flow.querySelector(`.node[data-n="${i}"]`); if (!n) return null; const r = n.getBoundingClientRect(); return { l: r.left - fr.left, r: r.right - fr.left, t: r.top - fr.top, b: r.bottom - fr.top, cx: (r.left + r.right) / 2 - fr.left, cy: (r.top + r.bottom) / 2 - fr.top }; };
  svg.setAttribute('width', fr.width); svg.setAttribute('height', fr.height);
  svg.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
  let d = '';
  const n = flowState.L.length;
  const cellL = i => { const nd = flow.querySelector(`.node[data-n="${i}"]`); return nd.parentElement.getBoundingClientRect().left - fr.left; };
  for (let i = 0; i < n - 1; i++){
    const a = R(i), b = R(i + 1); if (!a || !b) continue;
    const gx = cellL(i + 1) + 8;           // 다음 단계 칸의 왼쪽 여백
    if (cellL(i + 1) > cellL(i) + 2){      // 다음 칸(오른쪽)으로
      d += `M${a.r} ${a.cy} H${gx} V${b.cy} H${b.l - 5}`;
    } else {                               // 같은 열: 왼쪽 여백을 타고 위아래
      d += `M${a.l} ${a.cy} H${gx} V${b.cy} H${b.l - 5}`;
    }
  }
  svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L8 5 L0 9z" fill="#8FA3BF"/></marker></defs>` +
    d.split('M').filter(Boolean).map(p => `<path d="M${p}" fill="none" stroke="#A9B8CC" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah)"/>`).join('');
}
const redraw = () => { clearTimeout(drawArrows._t); drawArrows._t = setTimeout(drawArrows, 60); };
window.addEventListener('resize', redraw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
const flowRO = window.ResizeObserver ? new ResizeObserver(redraw) : null;

function gbNote(c){
  return `<div class="rgnote nat"><b>전국 공통 기준입니다</b><span>법령과 교육부·인사혁신처 예규를 바탕으로 썼습니다. 신청 기한·서식처럼 교육청마다 다른 부분은 소속 시·도교육청 지침을 확인하세요.</span></div>`;
}
function stepExtra(s, lbl){
  let h = '';
  if (s.how && s.how.length) h += `${lbl ? '<div class="lbl2">하는 법</div>' : ''}<ol class="how">${s.how.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
  if (s.check && s.check.length) h += `<div class="xrow ck"><b>놓치기 쉬움</b><span>${s.check.map(esc).join(' · ')}</span></div>`;
  if (s.form) h += `<div class="xrow"><b>서식</b><div class="fwrap"><span>${esc(s.form)}</span>${formDl(s.form)}</div></div>`;
  if (s.neis) h += `<div class="xrow"><b>나이스</b><span>${esc(s.neis)}</span></div>`;
  return h;

    return `<span class="fd">${one ? '' : `<em>양식 ${id}</em>`}<a href="forms/${id}.pdf" download="${esc(nm)}.pdf" title="${esc(nm)} PDF 내려받기">PDF</a><a href="forms/${id}.hwp" download="${esc(nm)}.hwp" title="${esc(nm)} 한글 파일 내려받기">HWP</a></span>`;
  }).join('')}</div>`;
}
function memoTemplate(){
  return '종류:\n기간(일·시간):\n사유:\n증빙 서류:\n결재 올린 날:\n나이스 입력:\n확인할 것:';
}
function ctRow(x){
  const tel = x.tel || '';
  const note = [x.for, x.hours, x.note].filter(Boolean).join(' · ');
  return `<div class="ct"><div><div class="nm">${escR(x.name)}</div>${note ? `<div class="nt">${escR(note)}</div>` : ''}</div>${isDialable(tel) ? `<a class="tel num" href="${telHref(tel)}">${esc(tel)}</a>` : (tel ? `<span class="nt">${esc(tel)}</span>` : '')}</div>`;
}
function copy(text, msg){
  const done = () => toast(msg);
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e){} t.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

/* ---------- 길 ---------- */
function route(){
  const h = location.hash || '#/';
  hideTip(); document.getElementById('drawer').classList.remove('on'); document.getElementById('drawerbg').classList.remove('on');
  let nav = 'home';
  if (h.startsWith('#/c/')) { renderCase(decodeURIComponent(h.slice(4))); nav = ''; }
  else if (h === '#/contacts') { renderContacts(); nav = 'contacts'; }
  else if (h === '#/about') { renderAbout(); nav = 'about'; }
  else if (h === '#' || h.startsWith('#/')) { renderHome(); }
  else return; // #s-… 본문 안 이동
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  const c = h.startsWith('#/c/') && BYID[decodeURIComponent(h.slice(4))];
  document.title = c ? c.title + ' · 교원 복무·인사 길잡이' : '교원 복무·인사 길잡이';
}
