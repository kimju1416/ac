<meta property="og:description" content="방 번호 4자리로 친구와 바로 한 판. 연쇄로 방해뿌요를 보내 상대 판을 덮어라. 폰·PC 모두.">

<meta name="twitter:image" content="https://kimju.kr/bbu/og.jpg?v=2">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --pt:#E05A1E; --pt-d:#C24A15; --bg:#FBF6F1; --card:#fff; --line:#EFE2D6; --tx:#2E2418; --sub:#8A796A;
  --ok:#1D7A4D; --err:#C0392B; --r1:10px; --r2:14px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
@supports (height:100dvh){html,body{height:100dvh}}
body{-webkit-touch-callout:none}
canvas{touch-action:none}
body{font-family:"Pretendard Variable",Pretendard,sans-serif;color:var(--tx);background:#3F8FE6;word-break:keep-all;user-select:none;-webkit-user-select:none;touch-action:manipulation}
/* 경기장 배경(코드로 그림) — 하늘·빛줄기·관중석·잔디 */
#bgArt{position:fixed;inset:0;z-index:-1;overflow:hidden;background:linear-gradient(#5DB3F7 0%,#3F8FE6 26%,#2F6FC9 27%,#2A5FB2 58%,#3BAA4F 58.5%,#2E9443 100%)}
#bgArt .rays{position:absolute;left:50%;top:-20%;width:160vmax;height:160vmax;transform:translateX(-50%);background:repeating-conic-gradient(from 0deg at 50% 50%,rgba(255,255,255,.10) 0 6deg,transparent 6deg 18deg);-webkit-mask:radial-gradient(circle at 50% 50%,#000 0,transparent 55%);mask:radial-gradient(circle at 50% 50%,#000 0,transparent 55%)}
#bgArt .crowd{position:absolute;left:0;right:0;top:27%;height:31%;opacity:.38;filter:blur(1.5px);
  background:
   radial-gradient(circle at 50% 60%,#E8413A 0 38%,transparent 40%) 0 0/46px 34px,
   radial-gradient(circle at 50% 60%,#F0BE2A 0 38%,transparent 40%) 23px 17px/46px 34px,
   radial-gradient(circle at 50% 60%,#35B84A 0 36%,transparent 38%) 11px 8px/58px 42px,
   radial-gradient(circle at 50% 60%,#9A52D4 0 36%,transparent 38%) 40px 30px/62px 40px;
  -webkit-mask:linear-gradient(#000,rgba(0,0,0,.55));mask:linear-gradient(#000,rgba(0,0,0,.55))}
#bgArt .rail{position:absolute;left:0;right:0;top:57%;height:1.6%;background:#F4F1E8;box-shadow:0 3px 0 rgba(0,0,0,.15)}
#bgArt .img{position:absolute;inset:0;background:center/cover no-repeat}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,select{font:inherit;color:inherit}
.hide{display:none!important}

/* ---------- 로비·대기실 ---------- */
.screen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px;background:rgba(20,30,60,.35);overflow-y:auto}
.panel{width:100%;max-width:440px;background:var(--bg);border:1px solid var(--line);border-radius:var(--r2);padding:20px;box-shadow:0 12px 40px rgba(0,0,0,.25);max-height:100%;overflow-y:auto}
.brand{display:flex;align-items:baseline;gap:8px;margin-bottom:16px}
.brand h1{font-size:24px;font-weight:800;letter-spacing:-.02em}
.brand span{font-size:13px;color:var(--sub)}
.lbl{display:block;font-size:13px;font-weight:600;color:var(--sub);letter-spacing:.02em;margin:14px 0 6px}
.inp{width:100%;height:48px;border:1px solid var(--line);border-radius:var(--r1);background:#fff;padding:0 14px;font-size:16px;outline:none}
.inp:focus{border-color:var(--pt);box-shadow:0 0 0 3px rgba(224,90,30,.12)}
.row{display:flex;gap:8px}
.row>.inp{flex:1;min-width:0}
.btn{height:48px;border-radius:var(--r1);padding:0 18px;font-size:15px;font-weight:600;white-space:nowrap}
.btn.pri{background:var(--pt);color:#fff}
.btn.pri:hover{background:var(--pt-d)}
.btn.sec{background:#fff;border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}
.btn.full{width:100%}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r1);overflow:hidden;background:#fff}
.seg button{flex:1;height:44px;font-size:15px;font-weight:600;color:var(--sub);border-left:1px solid var(--line)}
.seg button:first-child{border-left:0}
.seg button.on{background:var(--pt);color:#fff}
.rooms{margin-top:6px;border:1px solid var(--line);border-radius:var(--r1);background:#fff;overflow:hidden}
.room{display:flex;align-items:center;gap:10px;min-height:56px;padding:8px 14px;border-top:1px solid var(--line)}
.room:first-child{border-top:0}
.room .nm{flex:1;min-width:0}
.room .nm b{display:block;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.room .nm small{font-size:13px;color:var(--sub)}
.room .btn{height:40px;padding:0 14px}
.empty{padding:18px 14px;font-size:14px;color:var(--sub);text-align:center}
.tabs{display:flex;gap:4px;margin:18px 0 0}
.tabs button{flex:1;height:40px;border-radius:var(--r1);font-size:14px;font-weight:600;color:var(--sub)}
.tabs button.on{background:#fff;border:1px solid var(--line);color:var(--tx)}
.help{margin-top:16px;font-size:13px;color:var(--sub);line-height:1.7}
.help kbd{display:inline-block;min-width:22px;padding:0 5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:#fff;font:600 12px/18px inherit;text-align:center;color:var(--tx)}
.status{font-size:13px;color:var(--sub);margin-top:10px;min-height:18px}
.status.err{color:var(--err)}
.code{font-size:32px;font-weight:800;letter-spacing:.12em;color:var(--pt)}
.slots{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.slot{border:1px solid var(--line);border-radius:var(--r1);background:#fff;padding:14px;min-height:92px}
.slot b{display:block;font-size:17px;margin-bottom:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.slot small{font-size:13px;color:var(--sub)}
.slot.rd small{color:var(--ok);font-weight:700}
.slot.me{border-color:var(--pt)}
.slot.wait b{color:var(--sub);font-weight:500}

/* ---------- 경기 화면 ---------- */
#game{position:fixed;inset:0;display:flex;flex-direction:column}
.arena{flex:1;display:flex;align-items:center;justify-content:center;gap:var(--gap,14px);min-height:0;padding:10px 10px 0}
.side{display:flex;flex-direction:column;align-items:center}
.tray{display:block}
.bwrap{position:relative;border-radius:10px;padding:5px;background:linear-gradient(#2F7BE5,#2361C4)}
.opp .bwrap{background:linear-gradient(#E8593F,#C8402C)}
.bwrap canvas{display:block;border-radius:6px}
.scorebox{margin-top:6px;font:800 var(--sfs,26px)/1 "Pretendard Variable",sans-serif;color:#fff;letter-spacing:.06em;font-variant-numeric:tabular-nums;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.3)}
.mid{display:flex;flex-direction:column;align-items:center;gap:10px}
.nexts{display:flex;gap:8px;align-items:flex-start}
.nx{border-radius:8px;padding:4px;background:linear-gradient(#2F7BE5,#2361C4)}
.nx.o{background:linear-gradient(#E8593F,#C8402C)}
.nx canvas{display:block}
.midinfo{background:rgba(20,28,50,.72);color:#fff;border-radius:8px;padding:8px 12px;text-align:center;font-size:13px;line-height:1.5;min-width:110px}
.midinfo b{display:block;font-size:22px;font-variant-numeric:tabular-nums}
.bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 12px calc(8px + env(safe-area-inset-bottom));}
.bar .pn{flex:1;max-width:360px;height:40px;display:flex;align-items:center;padding:0 14px;border-radius:8px;font-weight:700;font-size:16px;color:#fff;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.bar .pn.me{background:#2361C4}
.bar .pn.op{background:#C8402C;justify-content:flex-end}
.bar .sc{height:40px;min-width:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#1C2340;color:#fff;border-radius:8px;padding:0 14px}
.bar .sc b{font-size:15px;line-height:1;font-weight:800;letter-spacing:.02em;white-space:nowrap}
.bar .sc b .st{color:#FFD23F;letter-spacing:0}
.bar .sc small{font-size:11px;color:#AFC0E6;margin-top:2px}
.bar .xbtn{height:40px;padding:0 12px;border-radius:8px;background:rgba(20,28,50,.72);color:#fff;font-size:13px;font-weight:600}
.chainpop{position:absolute;left:50%;transform:translate(-50%,0);font-weight:900;color:#fff;white-space:nowrap;pointer-events:none;
  text-shadow:0 3px 0 #C2410C,0 0 10px rgba(0,0,0,.4);animation:cp .9s ease-out forwards}
@keyframes cp{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}15%{opacity:1;transform:translate(-50%,0) scale(1.15)}30%{transform:translate(-50%,0) scale(1)}100%{opacity:0;transform:translate(-50%,-30px)}}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(10,16,34,.55);color:#fff;text-align:center;z-index:5}
.ov .big{font-size:clamp(40px,9vw,88px);font-weight:900;line-height:1;text-shadow:0 4px 0 rgba(0,0,0,.35)}
.ov .msg{font-size:17px;font-weight:600}
.ov .btns{display:flex;gap:8px}
.ov .btn.sec{color:var(--tx)}
.note{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(20,20,20,.9);color:#fff;font-size:14px;padding:8px 14px;border-radius:8px;z-index:6;white-space:nowrap}
#fx{position:fixed;inset:0;pointer-events:none;z-index:4}
.shake{animation:shk .34s linear}
@keyframes shk{0%,100%{transform:translate(0,0)}15%{transform:translate(-5px,3px)}30%{transform:translate(5px,-2px)}45%{transform:translate(-4px,2px)}60%{transform:translate(3px,-1px)}80%{transform:translate(-2px,1px)}}
.chainpop.ac{color:#FFE45C;text-shadow:0 3px 0 #B8430B,0 0 14px rgba(255,200,0,.6);animation-duration:1.6s}

/* 터치 조작 */
.pad{display:none;gap:8px;padding:6px 10px calc(10px + env(safe-area-inset-bottom));justify-content:space-between}
.pad .grp{display:flex;gap:8px}
.pad button{width:var(--bs,clamp(56px,17vw,78px));height:var(--bs,clamp(56px,17vw,78px));border-radius:50%;background:rgba(255,255,255,.92);color:#1C2340;display:flex;align-items:center;justify-content:center;box-shadow:0 3px 0 rgba(0,0,0,.25);touch-action:none}
.pad button.rot{background:#1C2340;color:#fff}
.pad button:active,.pad button.on{transform:translateY(2px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
.pad svg{width:46%;height:46%;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round}
body.touch .pad{display:flex}
body.touch.land .pad{position:fixed;left:0;right:0;bottom:0;pointer-events:none;padding-bottom:calc(58px + env(safe-area-inset-bottom))}
body.touch.land .pad button{pointer-events:auto;opacity:.9;width:52px;height:52px}
body.touch.land .pad .grp{width:172px}
body.touch.land .pad .grp:last-child{justify-content:flex-end}

/* 세로 폰: 내 판 크게, 오른쪽에 NEXT·상대 판 작게 */
body.port .arena{justify-content:center;align-items:flex-start;padding-top:8px}
body.port .mid{order:2}
body.port .opp{display:none}
body.port .bar .pn{font-size:14px;padding:0 10px}
body.port .bar .sc{min-width:90px}
.mini{display:none;flex-direction:column;align-items:center;gap:4px}
body.port .mini{display:flex}
body.port.solo .mini{display:none}
body.port .midinfo{min-width:0;width:100%;padding:6px 8px;font-size:12px}
body.port .midinfo b{font-size:18px}
body.port .mid{flex:1;min-width:0;align-items:stretch}
body.port .mid>*{align-self:center}
.mini .bwrap{padding:3px}
.mini .scorebox{font-size:13px}
/* 세로 폰: 내 점수는 오른쪽 칸(파란 띠), 상대 점수는 작은 판 아래(빨간 띠) — 판 아래 줄을 없애 내 판을 키운다 */
.pscore{display:none}
body.port .pscore{display:block;width:100%;text-align:center;border-radius:6px;padding:4px 2px;color:#fff;font:800 14px/1.1 "Pretendard Variable",sans-serif;letter-spacing:.03em;font-variant-numeric:tabular-nums}
body.port .pscore.me{background:#2361C4}
body.port .me>.scorebox{display:none}
body.port .mini .scorebox{background:#C8402C;border-radius:6px;padding:4px 6px;font-size:13px;text-shadow:none;margin-top:0}
body.port .bar{padding-top:4px;padding-bottom:calc(6px + env(safe-area-inset-bottom))}
body.port .bar .pn,body.port .bar .sc,body.port .bar .xbtn{height:38px}
body.port .bar .sc b{font-size:12px}
</style>
</head>
<body>
<div id="bgArt"><div class="rays"></div><div class="crowd"></div><div class="rail"></div><div class="img" id="bgImg"></div></div>

<!-- 로비 -->
<section id="lobby" class="screen">
  <div class="panel">
    <div class="brand"><h1>말랑 대전</h1><span>1:1 연쇄 퍼즐 대결</span></div>
    <label class="lbl" for="nick">닉네임</label>
    <input id="nick" class="inp" maxlength="10" placeholder="10자 이내" autocomplete="off">
    <div class="tabs"><button id="tabList" class="on">방 목록</button><button id="tabMake">방 만들기</button></div>

    <div id="paneList">
      <div class="rooms" id="roomList"><div class="empty">서버에 연결하는 중…</div></div>
      <label class="lbl" for="codeIn">코드로 들어가기</label>
      <div class="row"><input id="codeIn" class="inp" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="방 번호 4자리" autocomplete="off"><input id="pwIn" class="inp" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="비번(있으면)" autocomplete="off"><button id="btnJoin" class="btn sec">입장</button></div>
    </div>

    <div id="paneMake" class="hide">
      <label class="lbl" for="roomName">방 이름</label>
      <input id="roomName" class="inp" maxlength="16" placeholder="한 판 붙자" autocomplete="off">
      <label class="lbl" for="roomPw">비밀번호 (숫자 4자리, 비우면 공개방)</label>
      <input id="roomPw" class="inp" maxlength="4" inputmode="numeric" pattern="[0-9]*" placeholder="예: 1234" autocomplete="off">
      <label class="lbl">선승 (먼저 이기면 끝)</label>
      <div class="seg" id="ftSeg"></div>
      <button id="btnMake" class="btn pri full" style="margin-top:16px">방 만들기</button>
    </div>

    <div class="status" id="lobbyStatus"></div>
    <button id="btnSolo" class="btn sec full" style="margin-top:8px">혼자 연습하기</button>
    <p class="help">
      <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>↓</kbd> 빠르게 내리기 · <kbd>Z</kbd> 왼쪽 회전 · <kbd>X</kbd> 오른쪽 회전 · <kbd>↑</kbd> 한 번에 떨구기(방에서 켰을 때)<br>
      같은 색 4개를 이으면 터집니다. 연쇄가 길수록 상대 판에 방해뿌요가 많이 떨어집니다. 가운데 줄 맨 위(✕)까지 쌓이면 집니다.
    </p>
  </div>
</section>

<!-- 대기실 -->
<section id="waitRoom" class="screen hide">
  <div class="panel">
    <div class="brand"><h1 id="wrName">방</h1></div>
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
      <div><div style="font-size:13px;color:var(--sub);font-weight:600">방 번호<span id="wrPwL"></span></div><div class="code" id="wrCode">----</div></div>
      <button id="btnCopy" class="btn sec">주소 복사</button>
    </div>
    <div class="slots" id="slots"></div>
    <label class="lbl">선승</label>
    <div class="seg" id="ftSeg2"></div>
    <label class="lbl">한 번에 떨구기 (↑ 키 · 원작 설정의 Quick Drop)</label>
    <div class="seg" id="qdSeg"></div>
    <div class="status" id="wrStatus"></div>
    <div class="row" style="margin-top:10px">
      <button id="btnLeave" class="btn sec">나가기</button>
      <button id="btnReady" class="btn pri" style="flex:1">준비</button>
    </div>
  </div>
</section>

<!-- 경기 -->
<section id="game" class="hide">
  <div class="arena" id="arena">
    <div class="side me" id="sideMe">
      <canvas class="tray" id="trayMe"></canvas>
      <div class="bwrap" id="wrapMe"><canvas class="board" id="bdMe"></canvas></div>
      <div class="scorebox" id="scMe">00000000</div>
    </div>
    <div class="mid" id="mid">
      <div class="nexts">
        <div class="nx" id="nxMeW"><canvas id="nxMe"></canvas></div>
        <div class="nx o" id="nxOpW"><canvas id="nxOp"></canvas></div>
      </div>
      <div class="pscore me" id="scMeP">00000000</div>
      <div class="mini" id="mini">
        <canvas class="tray" id="trayMini"></canvas>
        <div class="bwrap" style="background:linear-gradient(#E8593F,#C8402C)"><canvas class="board" id="bdMini"></canvas></div>
        <div class="scorebox" id="scMini">00000000</div>
      </div>
      <div class="midinfo" id="midinfo"><span id="miLabel">연쇄</span><b id="miVal">0</b></div>
    </div>
    <div class="side opp" id="sideOp">
      <canvas class="tray" id="trayOp"></canvas>
      <div class="bwrap" id="wrapOp"><canvas class="board" id="bdOp"></canvas></div>
      <div class="scorebox" id="scOp">00000000</div>
    </div>
  </div>
  <div class="pad" id="pad">
    <div class="grp">
      <button data-k="qd" class="qd hide" aria-label="한 번에 떨구기"><svg viewBox="0 0 24 24"><path d="M6 5l6 6 6-6"/><path d="M6 12l6 6 6-6"/><path d="M5 21h14"/></svg></button>
      <button data-k="left" aria-label="왼쪽"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button data-k="down" aria-label="아래"><svg viewBox="0 0 24 24"><path d="M5 9l7 7 7-7"/></svg></button>
      <button data-k="right" aria-label="오른쪽"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div class="grp">

<script>

}

// ================= 그리기 =================
const spriteCache = new Map();

    x.strokeStyle = 'rgba(80,90,110,.45)'; x.lineWidth = s*0.05; x.stroke();

    } else {
      drawBoard($('bdOp'), oppS, ov); drawTray($('trayOp'), oppS, oppPend, false);
      $('scOp').textContent = oppSnap && oppSnap.k ? oppSnap.k[0] + ' × ' + oppSnap.k[1] : pad8(oppSnap ? oppSnap.sc : 0);
    }
    drawNext($('nxOp'), Math.round(cellS * (port ? 0.6 : 0.9)), oppSnap ? oppSnap.n : null);
    if (!g.chain){ $('miLabel').textContent = '보낼 방해'; $('miVal').textContent = Math.floor(g.leftover / g.targetPoint()); }
    else { $('miLabel').textContent = '연쇄'; $('miVal').textContent = g.chain; }
  } else {
    $('miLabel').textContent = g.chain ? '연쇄' : '최대 연쇄'; $('miVal').textContent = g.chain || g.maxChain;
  }
}
// 경기장 배경 그림(코덱스 생성). 세로 화면은 bg-tall, 없으면 bg-wide. 뜨기 전·실패 시엔 코드로 그린 경기장.
function loadBg(){
  const want = innerHeight > innerWidth ? 'bg-tall.jpg' : 'bg-wide.jpg';
  if (loadBg.cur === want) return; loadBg.cur = want;
  const im = new Image();
  im.onload = () => { $('bgImg').style.backgroundImage = `url(${im.src})`; };
  im.onerror = () => { if (im.src.indexOf('bg-wide') < 0) im.src = 'bg-wide.jpg'; };
  im.src = want;
}
loadBg(); addEventListener('resize', loadBg);
requestAnimationFrame(frame);
connect();
</script>
