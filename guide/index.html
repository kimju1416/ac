며 지정기관 이용 비용을 1년 범위에서 부담(연장 가능).","basis":"학교보건법 제9조의2 제2항; 같은 법 시행규칙 제10조; 학교안전법 제10조의3; 같은 법 시행령 제10조의4"}],"deadlines":[{"what":"교육청 보고(학교장·인솔교사)","limit":"안전조치 후 즉시","basis":"학교안전법 제10조 제4항"},{"what":"학교안전공제회 사고발생 통지(학교장)","limit":"지체 없이","basis":"학교안전법 제44조 제2항"},{"what":"공제급여 지급 여부 결정","limit":"청구받은 날부터 14일(1회 14일 연장 가능)","basis":"학교안전법 제41조 제2항"},{"what":"공제급여 청구권 소멸시효","limit":"3년","basis":"학교안전법 제65조 제1항"},{"what":"심사청구","limit":"결정이 있음을 안 날부터 90일","basis":"학교안전법 제57조 제2항"},{"what":"심사 결정","limit":"청구받은 날부터 60일(1회 1개월 연장)","basis":"학교안전법 제59조 제1항"},{"what":"재심사청구","limit":"심사 결정서 정본 송달된 날부터 90일","basis":"학교안전법 제61조 제2항"},{"what":"재결 후 소송","limit":"재결서 정본 송달일부터 60일 안에 소송 미제기·취하 시 재결과 같은 합의 성립 간주","basis":"학교안전법 제64조"}],"dont":["쓰러진 학생을 ‘괜찮아지겠지’ 하고 팔다리만 주무르며 시간을 끌지 않는다 — 체육교사가 5분가량 지체한 과실로 배상 책임이 인정된 대법원 판례(2008다5417)가 있다","머리·목을 다친 학생을 억지로 일으키거나 부축해 보건실로 걸려 보내지 않는다","변형된 팔다리를 맞추려 하지 않는다(변형된 상태 그대로 고정)","사고 기록·목격자 확인을 미루지 않는다 — 공제 통지와 이후 분쟁의 근거가 된다","보호자에게 ‘학교가 다 책임진다’, ‘선생님이 물어주겠다’처럼 책임·배상을 먼저 약속하지 않는다 — 공제 절차를 안내한다","사고통지를 보호자 요청이 있을 때까지 미루지 않는다 — 통지는 학교장의 의무다"],"contacts":[{"name":"구급·화재","tel":"119","note":"심장정지·응급증상이면 먼저 신고, 전화 도움 심폐소생술 지시 따르기"},{"name":"해당 시·도 학교안전공제회","tel":"","note":"시·도마다 번호가 다르다 — schoolsafe.or.kr ‘시·도 공제회 연락처’에서 확인. 학교안전공제중앙회 학교안전콜센터 1688-4900"},{"name":"학교안전사고보상지원시스템","tel":"","note":"www.schoolsafe.or.kr — 학교는 사고통지, 보호자는 휴대폰 인증으로 청구"}],"forms":["학교안전사고 발생 신고서(학교안전법 시행규칙 별지 제2호서식) — 시스템에서 작성","공제급여청구서(같은 시행규칙 별지 제1호서식) + 청구이유 증명자료(진료비 영수증 등)","간병료 청구 시: 입원확인서 등 의무기록 + 의료인 소견서(시행규칙 제3조 제2항)","보전비용청구서(별지 제1호서식, 공제가입자 거쳐 제출 — 시행규칙 제7조)","해당 시·도 학교안전공제회 참고 서식(예: 사고경위서, 목격자확인서 등 — 공제회마다 다름)","보건교사 기록: 응급환자 기록지/보건일지, 응급환자 이송 및 사고 기록지"],"law":[{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제2조 제4호·제6호","point":"교육활동(수업·특별활동·수학여행 등 체험활동·등하교 등) 중 학생·교직원·교육활동참여자의 생명·신체에 피해를 준 사고가 학교안전사고"},{"name":"학교안전사고 예방 및 보상에 관한 법률 시행령","article":"제2조, 제3조","point":"등하교, 휴식시간, 교육활동 전후 통상 체류, 기숙사 생활 시간 등도 포함. 급식·가스 중독, 일사병, 이물질 섭취 질병 등도 포함"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제10조 제4항·제5항","point":"학교장·인솔교사는 즉시 안전조치 후 즉시 보고. 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다하면 민사상·형사상 책임을 지지 않음(민사 면책은 2025.12.2. 이후 사고부터 적용, 부칙 제2조)"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제34조~제40조의2","point":"공제급여: 요양·장해·간병·유족급여, 장례비(평균임금 100일분), 원인 모를 사망 위로금"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제41조, 제41조의2, 제44조 제2항","point":"청구·14일 결정, 학교장의 공제 안내 의무, 학교장의 지체 없는 사고 통지 의무"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제43조, 제44조 제1항, 제45조","point":"급여 제한(자해·자살·요양지시 불이행은 전부·일부 부지급 가능, 자동차손해배상 보장법에 따른 손해배상을 받았으면 부지급), 피공제자 고의·중과실 사고 시 공제회 구상, 공제급여 범위 안 배상책임 면제"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제57조~제64조, 제65조","point":"심사청구 90일, 재심사청구 90일, 재결서 정본 송달일부터 60일 내 소송 미제기·취하 시 재결과 같은 합의 간주, 청구권 시효 3년"},{"name":"국가배상법","article":"제2조 제2항","point":"공무원(국공립 교원)에게 고의 또는 중대한 과실이 있으면 국가·지자체가 그 공무원에게 구상할 수 있음"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제22조","point":"교원보호공제: 교육활동으로 생긴 손해배상금·구상권 행사 지원(고의·중과실 제외), 민·형사 소송비용 지원. 학교안전공제회에 위탁 가능"},{"name":"응급의료에 관한 법률","article":"제5조의2","point":"생명이 위급한 응급환자에게 한 응급처치로 생긴 손해·사상에 고의·중과실이 없으면 민사책임과 상해 형사책임을 지지 않고 사망 형사책임은 감면"}],"faq":[{"q":"공제 청구는 학교가 하나요, 보호자가 하나요?","a":"사고 통지는 학교장(공제가입자)의 의무이고, 요양급여 등 공제급여는 피공제자 또는 보호자가 청구한다(제36조 제1항, 제41조). 학교는 청구 방법을 안내할 의무가 있고(제41조의2), 청구서를 학교가 받았으면 지체 없이 공제회로 보낸다(시행규칙 제3조 제3항)."},{"q":"언제까지 청구할 수 있나요?","a":"공제급여를 받을 권리는 3년간 행사하지 않으면 소멸시효가 완성된다(제65조). 졸업·퇴학 등 신분이 바뀌어도 권리는 없어지지 않는다(제47조 제1항)."},{"q":"비급여 치료비도 다 나오나요?","a":"요양급여는 국민건강보험법에 따라 본인이 부담한 금액이 원칙이다(제36조 제2항). 비급여는 시행규칙 별표(요양급여의 세부지급기준)에 정한 항목 — MRI(의사 소견에 따라 1회, 장해 확인·악화·수술 후 확인 등은 추가 가능), 무통주사제, 화상 치료재료, 치아보철(항목별 한도) 등 — 위주로 지급하고, 그 밖의 진료항목도 공제회가 필요하다고 판단하면 의사 소견서 등을 참고해 인정할 수 있다(별표 비고 2). 세부 인정 여부는 해당 시·도 공제회에 확인한다."},{"q":"학생 본인 잘못으로 다쳤으면 못 받나요?","a":"법이 과실상계를 허용하는 것은 장해·간병·유족급여뿐이고 요양급여는 그 대상에 들어 있지 않다. 장해·간병·유족급여를 산정할 때 피공제자 과실을 상계할 수 있고 한도는 각 급여의 50%이며, 유치원생·미성년 초등학생, 심신상실·미약으로 인한 사고는 상계하지 않는다(제43조 제3항, 시행령 제20조의4). 자해·자살은 지급하지 않을 수 있으나 학교안전사고가 원인이면 전부 지급한다."},{"q":"교사가 개인적으로 배상 책임을 지나요?","a":"안전사고관리 지침에 따라 안전조치의무를 다했다면 민사·형사 책임을 지지 않는다(제10조 제5항, 민사 면책은 2025.12.2. 이후 사고부터). 공제급여가 지급되면 그 범위에서 교직원의 배상 책임도 면제된다(제45조). 다만 교직원 포함 피공제자의 고의·중대한 과실로 사고가 났다면 공제회가 그 사람에게 구상할 수 있고(제44조 제1항), 국공립 교원은 국가배상법 제2조 제2항에 따라 고의·중과실 시 구상될 수 있다."},{"q":"보호자가 공제회 결정이 너무 적다고 합니다.","a":"결정이 있음을 안 날부터 90일 안에 공제회 학교안전공제보상심사위원회에 심사청구하고, 그 결정서 정본 송달일부터 90일 안에 공제중앙회 재심사위원회에 재심사청구할 수 있다(제57조·제61조). 제64조는 재결서 정본 송달일부터 60일 안에 공제급여 관련 소송을 제기하지 않거나 그 소송을 취하하면 재결 내용과 같은 합의가 성립한다고 정한다. 이를 일반적인 제소기간으로 단정하지 않는다."},{"q":"보건교사가 없는데 교사가 응급처치를 해도 되나요?","a":"교육부 가이드라인은 자격·면허와 관계없이 생명이 위급한 환자에게 한 응급처치는 응급의료법 제5조의2(선의의 응급처치 면책) 적용을 받을 수 있다고 안내한다. 판례는 오히려 즉시 응급조치를 하지 않고 지체한 교사의 책임을 인정했다(대법원 2008다5417)."}],"deep":[{"title":"119를 부를지 말지, 이렇게 가른다","body":["교육부 가이드라인의 3C(Check-Call-Care)를 따른다. 반응이 없거나 헐떡이는 호흡이면 망설이지 말고 119와 가슴압박이다.","의식이 흐리거나 횡설수설, 혼자 서거나 걷지 못할 정도의 어지러움, 머리 손상과 구토·심한 통증, 경련, 개방성·다발성 골절, 절단, 지혈 안 되는 출혈은 119 대상이다. 여기에 해당하지 않으면 보건교사 처치 후 보호자 연락·병원 진료를 안내한다.","대법원은 체육 시간 팔굽혀펴기 중 쓰러진 학생을 5분가량 주무르기만 하다 늦게 보건실로 옮긴 사안에서 체육교사의 과실을 인정했다(2008다5417). 즉각적인 판단과 신고가 교사를 지킨다."],"basis":"학교 응급상황 대응 가이드라인(2025) 제1장·제2장, 부록 판례"},{"title":"사고 통지 — 공제 절차의 출발점","body":["공제 절차의 출발점은 학교장의 사고발생 통지다. 학교안전사고보상지원시스템에 학교 ID로 들어가 사고 내용을 입력하고, 학교장 승인(온라인 승인 또는 학교에서 오프라인 승인)을 받은 뒤 통보 버튼을 눌러 공제회로 보낸다.","학교 사용자 매뉴얼은 공제회 담당자가 확인해 ‘접수’한 사고(‘접수가능’ 상태)에 대해 공제급여 청구서를 작성하도록 안내한다. ‘보완’·‘대상아님’이면 사유 버튼을 눌러 확인하고 조치한다.","통지를 하지 않거나 거짓으로 하면 50만원 이하 과태료 대상이다(제72조 제2항 제2호). 경미해 보여도 병원 진료가 있으면 통지해 두는 것이 안전하다."],"basis":"학교안전법 제44조 제2항·제72조; 시행규칙 제5조의2; 학교안전사고보상지원시스템 학교 사용자 매뉴얼·학교장 매뉴얼(2025.3.)"},{"title":"공제급여 종류와 받는 사람","body":["요양급여: 치료비 중 건강보험 본인부담금(진찰·검사·약제·처치·수술·재활·입원·간호·호송). 인공팔다리·안경·보청기 등 보조기구, 의학적으로 필요한 간병료도 요양급여로 본다.","장해급여: 요양 종료 후 장해가 남으면 국가배상법 기준 금액과 위자료. 간병급여: 치료 후에도 상시·수시 간병이 필요할 때. 유족급여: 사망 시 상속인(사실혼 배우자 포함)에게 국가배상법 기준 금액과 위자료. 장례비: 평균임금 100일분을 장례를 치른 사람에게.","위로금: 학생이 교육활동 중 학교안전사고 외의 원인을 알 수 없는 사유로 사망하면 상속인에게 4천만원(시행령). 비용보전: 교직원 등이 사고와 관련해 쓴 긴급조치 비용, 민·형사 소송비용 등을 보전받을 수 있다(보전비용청구서를 학교를 거쳐 제출)."],"basis":"학교안전법 제34조~제40조의2, 제48조; 시행령 제20조의2 관련 조항; 시행규칙 제7조"},{"title":"결정에 불복하는 길 — 90일, 90일, 60일","body":["1단계 심사청구: 결정이 있음을 안 날부터 90일 안에 해당 시·도 공제회의 학교안전공제보상심사위원회(9~15명, 변호사·전문의·교원 등)에 낸다. 60일 안에 결정하고 한 번 1개월 연장할 수 있다.","2단계 재심사청구: 심사 결정서 정본이 송달된 날부터 90일 안에 학교안전공제중앙회의 재심사위원회에 낸다. 이 기간을 넘기면 심사 결정 내용대로 합의가 성립한 것으로 본다.","3단계: 학교안전법 제64조는 재결서 정본 송달일부터 60일 안에 공제급여 관련 소송을 제기하지 않거나 취하하면 재결 내용과 같은 합의가 성립한 것으로 본다고 정한다. 이를 모든 사건에 적용되는 일반적인 소송 제소기간으로 단정하지 않는다. 불복 절차의 당사자는 공제급여 결정에 불복하는 자이고, 학교는 절차 안내와 자료 협조를 한다."],"basis":"학교안전법 제57조~제64조"},{"title":"교사 개인 책임은 어디까지인가","body":["현행 학교안전법 제10조 제5항은 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다하면 민사·형사 책임을 지지 않는다고 정한다. 민사 면책은 2025.12.2. 개정법 시행 이후 사고부터 적용된다.","공제급여가 지급되면 그 금액 범위 안에서 교직원의 배상 책임은 면한다(제45조). 다만 피공제자(교직원도 피공제자)의 고의·중대한 과실로 사고가 나면 공제회가 지급액을 그 사람에게 청구할 수 있고(제44조 제1항), 국공립 교원은 고의·중과실 시 국가·지자체의 구상 대상이 될 수 있다(국가배상법 제2조 제2항).","교육부는 2026.5.28. ‘고의·중과실이 아니면 면책’으로 넓히는 개정(제10조의5 신설안)을 국회와 협의해 추진한다고 발표했으나, 2026.9.24. 현재 법령정보센터의 현행법은 위 제10조 제5항이다.","보호자가 민원·소송을 걸어오면 학교장에게 보고하고 교육청 법률지원·교원보호공제(손해배상금·구상권 행사 지원 — 고의·중과실이면 제외, 정당한 교육활동 관련 민·형사 소송비용 지원)를 이용한다. 교육감은 교원보호공제사업을 학교안전공제회 등에 위탁할 수 있으므로(교원지위법 제22조 제3항) 운영 기관은 소속 시·도교육청에서 확인한다."],"basis":"학교안전법 제10조 제5항·부칙(법률 제21149호) 제2조, 제44조, 제45조; 국가배상법 제2조; 교원지위법 제22조; 교육부 보도자료(2026.5.28.)"}],"tables":[{"title":"공제급여 종류 한눈에","head":["급여","언제","얼마·무엇","누구에게","근거"],"rows":[["요양급여","부상·질병 치료","건강보험 본인부담금(진찰~호송), 보조기구, 간병료","피공제자 또는 보호자","제36조"],["장해급여","요양 종료 후 장해","국가배상법 제3조 제2항 제3호 금액 + 위자료","피공제자 또는 보호자","제37조"],["간병급여","치료 후에도 상시·수시 간병 필요","대통령령 기준","실제 간병받는 피공제자 또는 보호자","제38조"],["유족급여","사고로 사망","국가배상법 제3조 제1항 제1호 금액 + 위자료","상속인(사실혼 포함)","제39조"],["장례비","사고로 사망","평균임금 100일분","장례를 행하는 자","제40조"],["위로금","원인 모를 사유로 교육활동 중 학생 사망","4천만원","상속인","제40조의2, 시행령"]],"note":"학교안전사고 예방 및 보상에 관한 법률(시행 2025.12.2.)·시행령(시행 2026.9.15.) 원문 확인. 과실상계는 장해·간병·유족급여만, 50% 한도."},{"title":"불복 절차","head":["단계","청구처","기간","결정 기간","기간 넘기면"],"rows":[["심사청구","시·도 학교안전공제회 학교안전공제보상심사위원회","결정 있음을 안 날부터 90일","60일(+1개월 1회)","—"],["재심사청구","학교안전공제중앙회 학교안전공제보상재심사위원회","심사 결정서 송달일부터 90일","60일(+1개월 1회)","심사 결정대로 합의 성립 간주"],["소송","법원(공제급여 관련 소송)","재결서 송달일부터 60일 안에 소송 미제기·취하 시 합의 간주","—","재결대로 합의 성립 간주"]],"note":"학교안전법 제57조~제64조. 청구인은 공제급여 결정에 불복하는 자. 집행정지 규정 없음."},{"title":"요양급여 비급여 지급 기준(시행규칙 별표 요약)","head":["항목","지급 기준"],"rows":[["MRI","의사 소견에 따라 1회(장해 확인, 호전 없음·악화·진료방향 결정, 수술 후 확인 필요 시 추가 가능)"],["치아보철","상부보철 치아 1대당 2회·회당 50만원, 캐스트코어·포스트·레진 1대당 각 1회·회당 15만원, 임플란트 1대당 1회·200만원(의사 소견) 범위 실비"],["진단서","본인부담 진료비 50만원 초과 시 제출, 발급 수수료 실비"],["안경·보청기","사고 전 미착용자가 사고로 착용하게 된 경우 1회"],["물리치료","건강보험 요양급여 대상인 경우만(비급여 물리치료는 원칙적으로 제외)"]],"note":"학교안전사고 예방 및 보상에 관한 법률 시행규칙 [별표] 요양급여의 세부지급기준(2026.9.24. 법령정보센터 원문 확인). 이 밖의 항목도 공제회가 진료에 필요하다고 판단하면 의사 소견서를 참고해 인정할 수 있다(비고 2). 상급병실료·식대·교통비 등 개별 항목의 인정 여부는 해당 시·도 공제회 안내를 확인."}],"record":"보건교사는 응급환자 기록지·보건일지와 이송·사고 기록지를 남긴다. 학교장은 교육청에 즉시 보고(제10조 제4항)하고 학교안전사고보상지원시스템으로 공제회에 사고발생 통지(시행규칙 별지 제2호서식)를 한다. 생활기록부 기재 사항은 없다.","sources":[{"title":"학교안전사고 예방 및 보상에 관한 법률(법률 제21149호)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률"},{"title":"학교안전사고 예방 및 보상에 관한 법률 시행령(대통령령 제36672호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률시행령"},{"title":"학교안전사고 예방 및 보상에 관한 법률 시행규칙(교육부령 제363호)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률시행규칙"},{"title":"학교안전사고 예방 및 보상에 관한 법률 시행규칙 [별표] 요양급여의 세부지급기준","publisher":"국가법령정보센터","year":2022,"url":"https://www.law.go.kr/법령별표서식/(학교안전사고 예방 및 보상에 관한 법률 시행규칙,20250722,별표0)"},{"title":"학교안전사고보상지원시스템","publisher":"학교안전공제중앙회","year":2026,"url":"https://www.schoolsafe.or.kr"},{"title":"학교안전사고보상지원시스템 학교 사용자 매뉴얼·학교장 매뉴얼·학부모 사용자 매뉴얼","publisher":"학교안전공제중앙회(학교안전사고보상지원시스템)","year":2025,"url":"https://www.schoolsafe.or.kr"},{"title":"학교 응급상황 대응 가이드라인","publisher":"교육부","year":2025,"url":"https://www.gne.go.kr/user/bbs/BD_selectBbs.do?q_bbsSn=1464&q_bbsDocNo=20250428094553090"},{"title":"국가배상법","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/국가배상법"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"현장체험학습 지원 방안(보도자료)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=106303&lev=0&searchType=null&statusYN=W&page=1&s=moe&m=020402&opType=N"}],"verified":"2026-09-24","uncertain":["2024.12.20. 개정(2025.6.21. 시행)으로 들어온 제10조 제5항의 최초 문구(형사 면책만이었는지)는 현행 조문과 부칙으로만 추정 — 현행은 민사·형사 모두, 민사는 2025.12.2. 이후 사고부터","교육부 2026.5.28. 발표 ‘고의·중과실이 아니면 면책(제10조의5 신설)’ 개정안의 국회 발의·통과·시행 여부는 원문 확인 필요 — 2026.9.24. 현행법은 제10조 제5항이다. (참고: 의안 제2218752호는 제10조의5가 아니라 제10조 제6항~제9항 신설(체험학습 위탁 기관 안전기준, 보호자·학생 공동책무) 안이며, 2026.9.16. 교육위원회에 상정된 단계다)","안전사고의 교육청 보고 기준(즉시 보고 대상, 양식)과 담당 부서는 시·도마다 다르다 — 소속 교육청 공문 확인 필요","‘공제급여와 관련된 소송’이 민사소송인지 행정소송인지, 심사청구를 거치지 않고 바로 소송할 수 있는지는 법문에 명시 없음","보호자 청구 시 공제회가 요구하는 급여 종류별 제출서류는 공제회 안내(schoolsafe.or.kr ‘청구서류’)로 확인 필요","학교안전사고 사고통지의 구체 기한(일수)은 법에 ‘지체 없이’로만 되어 있음","학교안전사고 치료가 끝났을 때 공제회가 치료비 보상을 어떻게 종결 처리하는지는 해당 시·도 공제회 안내 확인 필요"],"related":["emergency-medical","field-trip-accident"]},{"id":"runaway-missing","title":"학생 가출·실종·무단이탈","aka":["가출","실종","연락 두절","집에 안 들어왔대요","수업 중 사라짐","학교 무단이탈","체험학습 중 이탈","수학여행 중 없어짐","182","실종신고","가출신고","가정 밖 청소년","행방불명"],"category":"학생 보호·위기","urgency":"즉시","roles":["담임","수업·인솔 교사","교감","교장","생활교육부장","미인정결석 업무담당자","보호자"],"summary":"18세 미만 학생이 가출하거나 길을 잃거나 사고·유인 등으로 보호자에게서 떨어지면 법률상 '실종아동등'이다. 행방을 모르면 기다리지 말고 112 또는 182로 신고한다. 경찰은 신고를 받으면 즉시 현장 탐문·수색을 하고 위치 확인도 요청할 수 있다. 학교는 보호자에게 연락하고, 인상착의·사진·최종 목격 장소와 시각을 경찰에 넘기고, 시간 순서대로 기록한다. 발견 후에는 가출의 원인(학대·학교폭력·자살위험 등)을 살피고 미인정결석 관리를 이어 간다.","first":["마지막으로 본 시각·장소·옷차림을 바로 적는다","보호자에게 연락해 집·연락처로 소재를 확인한다","행방이 확인되지 않으면 112 또는 182에 신고한다 — 교내를 오래 찾느라 신고를 미루지 않는다","최근 사진, 인상착의, 휴대전화 번호, 자주 가는 곳·친한 친구를 경찰에 준다","교감·교장에게 보고하고, 체험학습 중이면 나머지 학생 인원부터 확인한다"],"steps":[{"stage":"알게 됨·신고","when":"학생이 보이지 않는 걸 안 순간","who":"담임·수업·인솔 교사","what":"상황 파악과 기록 시작","detail":"마지막으로 본 시각·장소, 옷차림, 소지품, 함께 있던 학생을 적는다. 경찰은 실종 전 최종 목격 장소(또는 추정 장소)를 '발생지'로 삼아 관할을 정하므로 이 정보가 중요하다.","basis":"실종아동등 및 가출인 업무처리 규칙 제2조제7호"},{"stage":"알게 됨·신고","when":"즉시","who":"담임","what":"보호자·학생 연락","detail":"학생 휴대전화로 연락하고 보호자에게 알려 귀가 여부를 확인한다. 등교를 안 한 경우라면 결석 1~2일 차 절차(학생 본인과 직접 통화해 소재·안전 확인)를 따른다(충북교육청 2026 매뉴얼 예).","basis":"충북교육청 2026 미인정결석 학생 관리 매뉴얼 4-1"},{"stage":"알게 됨·신고","when":"행방이 확인되지 않으면 곧바로","who":"담임·교감(또는 보호자)","what":"112·182 신고","detail":"실종 당시 18세 미만 아동과 지적·자폐성·정신장애인, 치매환자가 '아동등'이고, 약취·유인·유기·사고·가출·길 잃음 등으로 보호자에게서 떨어지면 '실종아동등'이다. 가출도 포함된다. 실종·가출 신고 특수번호 182(경찰청 실종아동찾기센터) 또는 112로 신고한다. 직무 중 실종아동등임을 알게 된 '업무·고용 등으로 사실상 아동등을 보호·감독하는 사람' 등은 지체 없이 신고해야 하고, 신고하지 않으면 200만원 이하 과태료다.","basis":"실종아동등의 보호 및 지원에 관한 법률 제2조·제6조제1항·제19조제2항; 경찰청 규칙 제4조"},{"stage":"초기 대응","when":"신고와 함께","who":"담임","what":"경찰에 정보 제공","detail":"가장 최근의 선명한 사진을 신속히 내고, 학생에 관한 정보는 사소한 것이라도 자세히 알린다(예: 인상착의·옷차림, 휴대전화 번호, 최종 목격 장소·시각, 자주 가는 곳, 친한 친구).","basis":"정부24 실종아동찾기센터 신고 서비스(경찰청)"},{"stage":"초기 대응","when":"즉시","who":"담임·생활교육부장","what":"관리자 보고","detail":"교감·교장에게 보고하고, 체험학습 중이면 인솔 책임자에게 알려 나머지 학생의 인원·안전부터 확인한다. 교육(지원)청 보고 여부와 방식은 교육청 지침과 사안의 중대성에 따른다."},{"stage":"조사·확인","when":"신고 접수 뒤","who":"경찰","what":"경찰의 수색·수사","detail":"경찰은 실종아동등 신고를 접수하면 지체 없이 수색·수사 실시 여부를 정한다. 발생지 관할 경찰서장은 즉시 현장출동 경찰관을 지정해 탐문·수색하고, 신고자·목격자 조사, 최종 목격지·주거지 수색, 위치추적 등 통신수사, 정보시스템 조회로 추적한다. 범죄로 인한 경우가 아니면 조속한 발견을 위해 통신사 등에 개인위치정보 제공을 요청할 수 있다. 범죄가 의심되면 신속히 수사에 들어간다.","basis":"실종아동법 제9조; 실종아동등 및 가출인 업무처리 규칙 제18조·제19조"},{"stage":"조사·확인","when":"경찰 조사 중","who":"담임·교사","what":"경찰 협조와 학생 주변 정보","detail":"경찰이 목격 학생·친구의 진술을 원하면 학생과 보호자 동의 등 학교 절차에 따라 협조한다. 학교가 아는 최근 변화(교우 갈등, 학대 징후, 자살 암시 등)를 알려 수색 판단을 돕는다."},{"stage":"조치·이행","when":"당일","who":"담임","what":"출결 처리","detail":"가출로 인한 결석은 '태만, 가출, 출석 거부 등 고의로 결석한 경우'로 미인정 결석이다. 나이스 출결에 입력한다.","basis":"학교생활기록 작성 및 관리지침 별표 8(충북교육청 2026 매뉴얼 인용)"},{"stage":"조치·이행","when":"보호자가 신고하지 않을 때","who":"담임·교장","what":"보호자 가출신고 안내","detail":"학생이 가출하면 보호자가 직접 가출신고를 하도록 안내하고, 협조하지 않으면 학교가 학생 주소지 관할 경찰서에 가출신고를 할 수 있다(충북교육청 2026 매뉴얼). 보호자가 신고했으면 나이스 미인정결석 보고 때 '보호자에 의한 가출신고'로 등록하고 비고에 적는다.","basis":"충북교육청 2026 매뉴얼 4-2·Q7"},{"stage":"조치·이행","when":"결석이 이어지면","who":"담임·업무담당자","what":"미인정결석 관리로 이어 가기","detail":"초·중은 정당한 사유 없이 계속 2일 이상 결석하면 보호자에게 출석 독촉·경고(시행령 제25조), 고는 학생·보호자에게 결석 사유 확인(제92조의2). 나이스 미인정결석 보고 시작 기준은 교육청마다 다르다(충북 2026: 초·중 연속 10일·고 연속 7일, 인천 2026: 연속 7일 이상·연속 3일 이상 3회·연간 누적 30일 초과). 보고 때 경찰 수사 의뢰 여부를 입력하고, 수사 의뢰한 학생이 발견되면 즉시 교육(지원)청에 먼저 알리고 나이스에 즉시 등록·보고한다(충북·인천 2026 매뉴얼 — 세부는 소속 교육청 매뉴얼 확인).","basis":"초·중등교육법 시행령 제25조·제92조의2; 충북교육청 2026 매뉴얼 Q8; 인천광역시교육청 2026학년도 미취(입)학·미인정결석 아동(학생) 관리 매뉴얼"},{"stage":"조치·이행","when":"학대·범죄가 의심될 때","who":"교직원","what":"아동학대 신고·수사 의뢰","detail":"가정 내 학대를 피해 나갔거나 학대 징후가 있으면 교직원은 아동학대 신고의무자로서 112에 신고한다. 충북교육청 2026 매뉴얼은 소재·안전 확인 불가나 아동학대 징후가 있으면 즉시 112 신고·수사 의뢰하도록 한다(소속 교육청 기준 확인).","basis":"아동학대범죄의 처벌 등에 관한 특례법 제10조; 충북교육청 2026 매뉴얼 기본방침"},{"stage":"조사·확인","when":"48시간이 지나도 못 찾으면","who":"경찰","what":"장기실종 관리","detail":"보호자 신고 접수 후 48시간이 지나도 발견되지 않은 찾는실종아동등은 '장기실종아동등'으로 분류되고 장기실종자 추적팀이 전담할 수 있다. 경찰은 수색 결과를 즉시 보호자에게 알리고, 이후 등록일부터 1개월까지는 15일에 1회, 그 뒤로는 분기별 1회 추적 진행을 통보한다.","basis":"실종아동등 및 가출인 업무처리 규칙 제2조제5호·제5조·제11조제5항"},{"stage":"종결·사후","when":"발견되면","who":"경찰·보호자·담임","what":"인계와 복귀","detail":"경찰은 찾는실종아동등을 발견하면 즉시 보호자에게 인계하고 정보시스템 등록을 해제한다. 학교는 등교 확인 후 미인정결석 관리 중이었다면 복귀일 3일 이내 복귀 보고를 한다.","basis":"실종아동등 및 가출인 업무처리 규칙 제11조제1항·제6항; 충북교육청 2026 매뉴얼"},{"stage":"종결·사후","when":"복귀 후","who":"담임·전문상담(교)사","what":"원인 살피기와 상담 연계","detail":"가출의 원인(가정 문제·학대, 학교폭력, 교우 관계, 자살 생각 등)을 비난 없이 듣고, 필요한 절차로 연결한다: 학대 의심은 신고, 학교폭력은 학교폭력 사안 처리, 자살 암시는 자살위기 대응, 그 밖에는 Wee클래스·Wee센터 상담. 청소년전화 1388(24시간)도 안내한다.","basis":"보건복지상담센터 109 안내(1388 24시간); 충북교육청 2026 매뉴얼 5"},{"stage":"종결·사후","when":"가출이 반복되면","who":"교장·담임","what":"집중관리","detail":"가출 이력, 학대 우려, 소재 불분명·연락 두절이 있으면 학교장이 집중관리대상 지정을 검토하고, 개인별 관리카드에 소재·안전 확인 사항을 누가기록해 월 1회 보고한다(충북·인천교육청 2026 매뉴얼 기준 — 소속 교육청 매뉴얼 확인).","basis":"충북교육청 2026 매뉴얼 용어정의 6·4-2(장기 미인정 결석 보고)"}],"deadlines":[{"what":"실종아동등 신고(직무상 알게 된 신고의무자)","limit":"지체 없이","basis":"실종아동법 제6조제1항"},{"what":"경찰의 수색·수사 여부 결정","limit":"신고 접수 후 지체 없이","basis":"실종아동법 제9조제1항"},{"what":"발생지 관할 경찰서 현장 탐문·수색","limit":"즉시","basis":"실종아동등 및 가출인 업무처리 규칙 제18조"},{"what":"장기실종아동등 분류","limit":"신고 접수 후 48시간 경과해도 미발견","basis":"같은 규칙 제2조제5호"},{"what":"경찰의 보호자 추적 진행 통보","limit":"탐문 후 즉시, 1개월까지 15일에 1회, 이후 분기별 1회","basis":"같은 규칙 제11조제5항"},{"what":"학교 복귀 보고(미인정결석 관리 중인 경우)","limit":"복귀 3일 이내","basis":"충북교육청 2026 매뉴얼"}],"dont":["학생 소재·안전을 확인하기 전에 기다리거나 교내에서만 찾으며 신고를 늦추기","18세 미만 가출을 '본인 선택'으로 보고 신고하지 않기 — 법률상 실종아동등이다","학생을 찾아 교사가 혼자 위험한 장소로 가기","보호자에게만 맡기고 학교 기록·결석 관리를 하지 않기","돌아온 학생을 공개적으로 꾸짖거나 원인을 묻지 않고 넘기기","가출한 학생을 신고 없이 재워 주거나 숨겨 두기(누구든지 정당한 사유 없이 신고하지 않고 보호할 수 없음)"],"contacts":[{"name":"경찰(긴급)","tel":"112","note":"행방불명·범죄 의심·학대 의심"},{"name":"실종·가출 신고(경찰청 실종아동찾기센터)","tel":"182","note":"실종·가출 신고용 특수번호, 누리집 '안전Dream' 온라인 신고"},{"name":"응급","tel":"119","note":"다친 채 발견·사고"},{"name":"청소년전화","tel":"1388","note":"24시간 청소년 전화 상담·사이버 상담"},{"name":"자살예방상담전화","tel":"109","note":"자살 암시를 남기고 사라졌다면 112 신고와 함께"}],"forms":["시간대별 경과 기록(최종 목격 시각·장소, 연락·신고 시각, 경찰 접수 번호)","학생 신상 정보(최근 사진, 인상착의, 연락처) — 경찰 제공용","나이스 출결(미인정 결석) 및 [학적]-[미인정결석학생관리](보호자 가출신고·경찰수사의뢰 여부)","보호자 가출신고 안내·확인 기록","현장체험학습 인원 점검표(학교 자체)"],"law":[{"name":"실종아동등의 보호 및 지원에 관한 법률","article":"제2조(정의)","point":"아동등=실종 당시 18세 미만 아동, 지적·자폐성·정신장애인, 치매환자. 실종아동등=약취·유인·유기·사고·가출·길 잃음 등으로 보호자로부터 이탈된 아동등"},{"name":"실종아동등의 보호 및 지원에 관한 법률","article":"제6조(신고의무 등)","point":"보호시설 종사자, 아동복지·사회복지 전담공무원, 의료인, 업무·고용 등으로 사실상 아동등을 보호·감독하는 사람 등은 직무 중 실종아동등임을 알면 경찰신고체계로 지체 없이 신고. 미신고 시 200만원 이하 과태료(제19조제2항)"},{"name":"실종아동등의 보호 및 지원에 관한 법률","article":"제7조(미신고 보호행위의 금지)","point":"누구든지 정당한 사유 없이 실종아동등을 경찰에 신고하지 않고 보호할 수 없다(위반 시 제17조, 5년 이하 징역 또는 5천만원 이하 벌금)"},{"name":"실종아동등의 보호 및 지원에 관한 법률","article":"제9조(수색 또는 수사의 실시 등)","point":"경찰은 신고 접수 시 지체 없이 수색·수사 여부 결정, 범죄로 인한 경우가 아니면 개인위치정보 등 제공 요청 가능(요청받은 자는 정당한 사유가 없으면 따라야 함)"},{"name":"실종아동등 및 가출인 업무처리 규칙(경찰청예규 제631호)","article":"제2조·제4조·제11조·제18조","point":"가출인=18세 이상, 장기실종=48시간 경과, 182 운영, 즉시 현장 탐문·수색, 보호자 통보 주기"},{"name":"초·중등교육법 시행령","article":"제25조·제92조의2","point":"정당한 사유 없이 계속 2일 이상 결석 시 초·중 독촉·경고, 고 사유 확인(가출 결석 관리의 근거)"}],"faq":[{"q":"고3 학생(만 18세)이 가출했어요. 실종아동인가요?","a":"실종아동법의 아동은 실종 당시 18세 미만이다. 경찰 규칙상 신고 당시 보호자로부터 이탈된 18세 이상은 '가출인'으로 분류된다. 가출인 발생 신고도 발생지 관할 경찰서가 즉시 현장 탐문·수색을 하도록 되어 있으므로 행방이 걱정되면 똑같이 112·182로 신고한다."},{"q":"보호자가 “우리 애가 가끔 그래요, 신고하지 마세요”라고 합니다.","a":"보호자가 직접 가출신고를 하도록 안내하고, 협조하지 않으면 학교가 학생 주소지 관할 경찰서에 가출신고를 할 수 있다(충북교육청 2026 매뉴얼). 학대가 의심되면 교직원은 아동학대 신고의무가 있다."},{"q":"친구 집에 있다는데 그 부모가 학교에 알리지 말래요.","a":"누구든지 정당한 사유 없이 실종아동등을 경찰에 신고하지 않고 보호할 수 없다(실종아동법 제7조, 위반 시 형사처벌). 보호자와 경찰에 알려 확인하게 한다."},{"q":"교사가 꼭 신고해야 하나요, 보호자가 해야 하나요?","a":"실종아동법 제6조는 직무 중 실종아동등임을 알게 된 신고의무자를 정하고 있고 '업무·고용 등으로 사실상 아동등을 보호·감독하는 사람'이 포함된다. 교원이 여기에 해당하는지에 대한 공식 해석은 확인하지 못했다. 신고 주체를 따지기보다 먼저 아는 사람이 112·182로 신고하는 것이 안전하다."},{"q":"가출해서 결석한 날은 어떻게 처리하나요?","a":"가출 등 고의로 결석한 경우는 미인정 결석이다. 연속되면 미인정결석 관리 절차(독촉·경고, 가정방문, 나이스 보고)를 그대로 따른다."}],"record":"나이스 출결에 미인정 결석 입력(가출). 결석이 이어지면 [학적]-[미인정결석학생관리]에 소재확인 여부('보호자에 의한 가출신고' 또는 소재미확인), 경찰수사의뢰 여부(공문/유선)를 입력하고, 발견·등교 시 3일 이내 복귀 보고. 학교는 시간대별 경과 기록을 별도로 보관한다.","deep":[{"title":"법에서 말하는 '실종'과 '가출'","body":["실종아동법의 '아동등'은 실종 당시 18세 미만 아동, 지적·자폐성·정신장애인, 치매환자다. 이들이 약취·유인·유기되거나, 사고를 당하거나, 가출하거나, 길을 잃는 등으로 보호자로부터 떨어지면 모두 '실종아동등'이다. 즉 18세 미만 학생의 가출도 실종아동등으로 신고·수색 대상이다.","경찰 규칙은 신고 당시 18세 이상으로 보호자에게서 이탈한 사람을 '가출인'으로 따로 부른다. 가출인도 신고하면 발생지 관할 경찰서가 탐문·수색하고 추적에 착수한다.","보호자가 찾는 경우는 '찾는실종아동등', 보호자를 모르는 채 경찰이 보호 중이면 '보호실종아동등', 신고 후 48시간이 지나도 못 찾으면 '장기실종아동등'이다."],"basis":"실종아동법 제2조; 실종아동등 및 가출인 업무처리 규칙 제2조"},{"title":"신고하면 경찰은 무엇을 하나","body":["신고는 182(실종·가출 특수번호, 경찰청 실종아동찾기센터 운영) 또는 112로 한다. 경찰청 실종아동찾기센터 누리집(안전Dream)으로 최근 사진을 첨부해 온라인 신고도 된다.","경찰은 지체 없이 수색·수사 여부를 정하고, 발생지 관할 경찰서장이 즉시 현장출동 경찰관을 지정해 탐문·수색한다. 신고자·목격자 조사, 최종 목격지·주거지 수색, 위치추적 등 통신수사, 유전자검사, 정보시스템 조회로 추적하며, 범죄가 의심되면 곧바로 수사에 들어간다. 범죄로 인한 경우가 아니면 통신사 등에 개인위치정보를 요청할 수 있고 요청받은 쪽은 정당한 사유가 없으면 따라야 한다.","수색 결과는 즉시 보호자에게 통보하고, 이후 1개월까지 15일에 1회, 그 뒤 분기별 1회 추적 상황을 알린다."],"basis":"실종아동법 제9조; 경찰청 규칙 제4조·제11조·제18조·제19조; 정부24 실종아동찾기센터 신고 서비스"},{"title":"학교에서 사라졌을 때 첫 30분","body":["최종 목격 시각·장소·옷차림을 적고, 학생 휴대전화와 보호자에게 연락한다. 보호자도 행방을 모르면 신고한다. 경찰은 최종 목격 장소(또는 추정 장소)를 '발생지'로 삼아 관할과 수색 범위를 정하므로, 학교가 적은 시각·장소 정보가 곧 수색의 출발점이다.","관리자에게 보고하고, 체험학습·수학여행 중이면 나머지 학생 인원과 안전을 확인하면서 현지 112에 신고한다.","교내 확인은 필요하지만 신고를 늦추는 이유가 되어서는 안 된다. 학교 안을 어디까지 찾아야 하는지에 대한 공식 기준은 확인하지 못했다."],"basis":"실종아동등 및 가출인 업무처리 규칙 제2조제7호"},{"title":"돌아온 뒤 — 원인을 찾고 다시 나가지 않게","body":["가출은 결과일 때가 많다. 가정 학대, 학교폭력, 교우 갈등, 자살 생각이 원인일 수 있으므로 비난 없이 듣고 해당 절차(아동학대 신고, 학교폭력 사안 처리, 자살위기 대응)로 연결한다.","결석은 미인정 결석으로 처리하고, 이어졌다면 미인정결석 관리에서 복귀 보고(3일 이내)를 한다. 가출 이력·학대 우려가 있으면 집중관리대상 지정을 검토한다.","학생에게 청소년전화 1388(24시간)과 Wee클래스를 알려 다음에 힘들 때 집을 나가기 전에 도움을 청할 길을 열어 둔다."],"basis":"충북교육청 2026 미인정결석 학생 관리 매뉴얼; 보건복지상담센터 109 안내"}],"tables":[{"title":"상황별 첫 대응","head":["상황","학교가 먼저 할 일","신고"],"rows":[["아침에 등교 안 함, 보호자도 모름","학생 본인 연락 시도, 보호자와 함께 행방 확인, 기록","행방 불명이면 112·182"],["수업 중 무단이탈","최종 목격 시각·장소 기록, 휴대전화·보호자 연락, 관리자 보고","연락 두절이면 112·182(자살 암시가 있었으면 즉시)"],["체험학습·수학여행 중 이탈","나머지 학생 인원·안전 확인, 인솔 책임자·학교 보고, 보호자 연락","현지 112(발생지 관할)"],["보호자가 가출 사실을 알림","보호자 가출신고 안내, 미인정결석 입력","보호자 비협조 시 학교가 관할 경찰서에 신고 가능"]],"note":"근거: 실종아동법 제2조·제6조, 경찰청 규칙 제2조, 충북교육청 2026 매뉴얼. 교내 수색 범위의 공식 기준은 확인 못 함."},{"title":"경찰 분류와 처리","head":["구분","정의","경찰 조치"],"rows":[["실종아동등","실종 당시 18세 미만 등이 가출·사고·유인 등으로 보호자에게서 이탈","즉시 탐문·수색, 위치정보 요청 가능"],["가출인","신고 당시 18세 이상으로 보호자에게서 이탈","발생 신고 시 즉시 탐문·수색, 추적"],["장기실종아동등","신고 후 48시간이 지나도 미발견","장기실종자 추적팀 전담 가능"],["발견 후","찾는실종아동등 발견","즉시 보호자 인계, 시스템 등록 해제"]],"note":"출처: 실종아동법 제2조·제9조, 실종아동등 및 가출인 업무처리 규칙(경찰청예규 제631호, 2024.9.27. 시행)."}],"sources":[{"title":"실종아동등의 보호 및 지원에 관한 법률(시행 2026.5.12.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/실종아동등의보호및지원에관한법률"},{"title":"실종아동등 및 가출인 업무처리 규칙(경찰청예규 제631호, 2024.9.27. 시행)","publisher":"경찰청(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/LSW/admRulInfoP.do?admRulSeq=2100000246722&chrClsCd=010201"},{"title":"실종 아동 찾기 센터 신고 서비스","publisher":"정부24(경찰청)","year":2026,"url":"https://www.gov.kr/portal/service/serviceInfo/PTR000051464"},{"title":"2026. 미인정결석 학생 관리 매뉴얼","publisher":"충청북도교육청","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/06/56EF10B2-EDA2-1CC0-B753-887F27A28444.pdf"},{"title":"2026학년도 미취(입)학·미인정결석 아동(학생) 관리 매뉴얼","publisher":"인천광역시교육청 학교생활교육과","year":2026,"url":"https://www.ice.go.kr/upload/ice/na/bbs_2094/2026/04/c5cb311dfe15982b6858d34aed35dd44.pdf"},{"title":"초·중등교육법 시행령(시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법시행령"},{"title":"자살예방상담전화 109·유관기관 안내","publisher":"보건복지부 보건복지상담센터","year":2026,"url":"https://www.129.go.kr/109"}],"verified":"2026-09-24","uncertain":["교원이 실종아동법 제6조제1항제6호 '업무·고용 등의 관계로 사실상 아동등을 보호·감독하는 사람'으로 신고의무자에 해당하는지에 대한 공식 해석은 확인하지 못했다.","학교 안에서 어디까지, 얼마 동안 찾은 뒤 신고해야 하는지에 대한 교육부·경찰청 공식 기준은 찾지 못했다.","학생 가출·실종의 교육(지원)청 보고 여부·서식·기한은 소속 교육청 지침에서 확인한다.","현장체험학습 중 이탈 대응의 교육부 「현장체험학습 운영 매뉴얼」 해당 부분은 확인하지 못했다.","경찰청 「실종아동등 및 가출인 업무처리 규칙」은 2026-09-24 국가법령정보센터 조회 기준 현행이 경찰청예규 제631호(2024.9.27. 시행)임을 확인했다. 이후 개정은 다시 확인 필요."],"related":["absence-unknown","field-trip-accident","suicide-risk"]},{"id":"teacher-rights","title":"교육활동 침해(교권 침해) 대응","aka":["교권침해","교육활동 침해","학생이 욕했어요","학생이 때렸어요","학부모 폭언","수업 방해","몰래 촬영","교권보호위원회","지역교권보호위원회","특별휴가","1395","분리조치","학부모 협박","명예훼손","성희롱 발언"],"category":"교원 보호","urgency":"당일","roles":["피해교원","목격한 교직원","교장","교감","교육활동 보호 업무 담당자","담임","교육지원청 교육활동보호 담당(지역교권보호위원회)","교육장"],"summary":"학생이나 보호자 등의 폭행·모욕·협박·성적 언동·무단 촬영·배포·반복 부당 민원은 행위 내용과 정도, 법정 요건에 따라 교원지위법상 교육활동 침해에 해당할 수 있다. 학교장은 사안을 알게 되면 피해교원 보호조치와 법령에 따른 분리조치를 진행하고, 사안은 교육지원청 지역교권보호위원회 심의와 교육장 조치로 이어질 수 있다. 조치에 불복하면 학생·보호자는 물론 '침해 아님' 결정을 받은 교원도 행정심판·행정소송을 낼 수 있다.","first":["침해행위를 멈추라고 말하고, 안 되면 주변에 도움을 청하거나 그 자리를 벗어난다","다쳤으면 응급처치·병원부터. 폭행 등 긴급하면 112에 신고해도 된다","교감·교장 또는 업무 담당자에게 알린다(구두·전화 가능). 학교 밖에서는 소속 시·도 지역번호+1395(시·도 교육활동보호센터)","가해자와 떨어져 있고 싶은지(분리 의사) 학교에 말한다","증거(녹음·문자·사진·목격자 이름)를 챙기고 경위를 적는다"],"steps":[{"stage":"알게 됨·신고","when":"발생 즉시","who":"피해교원","what":"현장 대응","detail":"침해 중단 요청 → 동료 등 주변에 도움 요청 또는 현장 이탈 → 부상 시 응급처치·병원. 범죄(폭행 등)면 112 신고 가능.","basis":"교육활동 보호 매뉴얼(2026) 37쪽"},{"stage":"알게 됨·신고","when":"발생 즉시","who":"피해교원·목격자","what":"학교(관리자·담당자)나 교육활동보호센터에 신고","detail":"보거나 알게 된 사람은 누구나 즉시 신고해야 한다. 신고는 구두·메일·전화 모두 가능. 학교 밖 창구는 시도 교육활동보호센터, 지역번호+1395, 교육(지원)청 담당자. 1395로 접수되면 시·도교육(지원)청이 피해교원의 관할 교육지원청과 소속 학교에 알리고 학교장이 이후 절차를 진행한다.","basis":"교원지위법 제28조; 매뉴얼 31·55쪽"},{"stage":"초기 대응","when":"알게 된 즉시","who":"학교장","what":"피해교원 보호조치","detail":"심리상담·조언, 치료·요양, 그 밖에 치유·교권 회복 조치. 조퇴·병가·특별휴가, 심리·법률상담, 공무상 병가 신청을 안내한다. 특별휴가는 위원회 개최 전이라도 학교장 판단으로 허가할 수 있고 진단서 등 증빙은 나중에 갖춰도 된다.","basis":"교원지위법 제20조제1항·제23조; 매뉴얼 37~38쪽"},{"stage":"초기 대응","when":"알게 된 즉시","who":"학교장","what":"가해자와 피해교원 분리","detail":"먼저 피해교원 의사를 확인(즉시 분리 의사 확인서, 서식3). 교원이 반대하거나 이미 특별휴가 등으로 떨어져 있으면 안 해도 된다. 심각성·지속성·고의성을 보고 기간을 정하되 휴일 포함 최대 7일을 넘지 않게 권장. 학교 안에 별도 공간을 마련하고, 분리된 학생에게는 별도 교육방법을 운영한다. 필요하면 피해교원 업무대행자를 정한다.","basis":"교원지위법 제20조제2항; 시행령 제17조; 매뉴얼 38·40쪽"},{"stage":"초기 대응","when":"즉시(폭행·성폭력 사안)","who":"학교장","what":"필요하면 긴급조치","detail":"학생이 상해·폭행죄나 성폭력범죄에 해당하는 침해를 했고 피해교원 보호가 급하면 학교장이 먼저 1호(학교 봉사), 3호(특별교육·심리치료), 4호(출석정지), 5호(학급교체)를 따로 또는 함께 부과할 수 있다. 4·5호 전에는 학생·보호자에게 의견 진술 기회를 준다. 4호 기간은 위원회 조치 결정 때까지로 정할 수 있다. 학생·보호자에게 통지하고, 거부·회피하면 초·중등교육법 제18조에 따라 징계할 수 있다.","basis":"교원지위법 제25조제9항~제12항(2026.2.19. 신설); 매뉴얼 39쪽"},{"stage":"초기 대응","when":"긴급조치 직후","who":"학교장","what":"지역교권보호위원회에 즉시 보고·추인 요청","detail":"긴급조치 보고서(서식2)를 낸다. 위원회는 추인, 일부추인, 추인하지 않음을 결정할 수 있다. 추인하지 않아도 이미 한 조치가 소급해 무효가 되지는 않는다. 추인받지 못한 출석정지 기간이나 위원회 전에 사안이 끝난 경우의 출석정지 기간은 출석으로 인정할 수 있다.","basis":"교원지위법 제25조제9항 후단; 매뉴얼 39~40쪽"},{"stage":"초기 대응","when":"당일","who":"학교(담임·담당자)","what":"관련 학생 보호자에게 연락","detail":"사안 개요·경위·정도를 객관적으로 짧게 알리고 절차·일정·제출 서류를 안내한다. 피해교원 전화번호 등 개인정보는 알려주지 않는다. 언론 대응 창구는 하나로 모은다.","basis":"매뉴얼 38쪽"},{"stage":"초기 대응","when":"사안 접수부터 24시간 이내","who":"학교장","what":"교육지원청에 사안 신고 보고","detail":"유선·구두 보고 또는 사안신고서(서식1) 제출. 사안신고서는 피해교원이 위원회 개최를 원하면 반드시 내며, 24시간 안에 어려우면 사안 발생보고서와 함께 낼 수 있다.","basis":"교원지위법 제20조제3항; 매뉴얼 32·38쪽"},{"stage":"조사·확인","when":"보고 후 5일 이내","who":"학교 업무담당자","what":"사안 파악","detail":"피해교원 면담(필요한 보호조치, 위원회 개최·분쟁조정 희망 여부), 관련 학생·보호자 면담과 의견서(서식4), 목격자 진술(서식5)·현장사진 등 증거 수집. 학생 면담은 학습권을 지키는 범위에서 하고 필요하면 녹음한다. 의견서를 내지 않으면 '의견 없음'으로 보고 심의가 진행될 수 있음을 미리 알린다.","basis":"매뉴얼 41~43쪽"},{"stage":"조사·확인","when":"사안 보고 후 5일 이내(주말·공휴일 제외)","who":"학교장","what":"사안 발생보고서 제출","detail":"사안 발생보고서(서식7)에 의견서(서식4)·참고인 진술서(서식5)를 붙여 공문으로 교육지원청에 낸다. 분쟁조정을 원하면 분쟁조정 신청서(서식6)도 함께.","basis":"매뉴얼 41쪽"},{"stage":"조사·확인","when":"보고서 접수 후","who":"교육지원청","what":"사안 조사와 조사보고서 작성","detail":"보고서 검토, 필요하면 추가 면담·현장 방문 조사, 쟁점 확인, 증거 추가 수집 후 사안 조사보고서(서식14) 작성. 장애학생은 특수교육 전문가를 참여시키고, 다문화 학생·보호자는 통역·번역 조사지를 쓸 수 있다. 중대 사안(4주 이상 진단 폭행, 성폭력 등)은 중대사안보고서(서식13)로 시도교육청→교육부까지 보고.","basis":"교원지위법 시행령 제18조; 매뉴얼 44~45쪽"},{"stage":"심의·결정","when":"희망 시(위원회 전)","who":"당사자·지역교권보호위원회","what":"분쟁조정(선택)","detail":"양쪽 모두 원할 때만 진행. 성립하면 합의서 3부 작성(민사상 화해계약 효력). 한쪽이 거부·고소·소송하면 개시 거부·중지, 개시 후 30일이 지나도 합의가 안 되면 종료하고 조치 심의로 넘어간다. 재조정을 원하면 시·도교권보호위원회에 2차 분쟁조정을 신청할 수 있다.","basis":"교원지위법 제18조제1항제2호·제2항제4호; 매뉴얼 62~65쪽"},{"stage":"심의·결정","when":"사안 발생보고서 접수 후 21일 이내(주말·공휴일 포함)","who":"교육장·위원장","what":"위원회 소집과 출석통지","detail":"교육장 요청, 재적위원 4분의 1 이상 요청, 피해교원 요청 등으로 위원장이 소집. 회의 10일 전까지 당사자에게 서면 출석통지(사안 요지 구체적으로). 출석이 어려우면 서면 의견서(서식15-1)를 낼 수 있다. 21일은 훈시규정이라 정당한 사유가 있으면 넘겨도 위법은 아니다.","basis":"시행령 제15조제4항; 매뉴얼 46쪽"},{"stage":"심의·결정","when":"위원회 당일","who":"지역교권보호위원회","what":"심의(진술 청취)","detail":"재적 과반 출석으로 열고 출석 과반 찬성으로 의결. 제척·기피·회피 확인 → 사안조사 보고 → 피해교원 진술·질의응답 → 관련 학생·보호자 진술(조치결정·불복절차 고지) → 필요시 전문가 의견. 학생·교사 모두 변호사를 대리인으로 선임해 출석시킬 수 있다. 회의는 비공개.","basis":"교원지위법 제30조제3항; 시행령 제15조제5항·제16조; 매뉴얼 47~49쪽"},{"stage":"심의·결정","when":"위원회 당일","who":"지역교권보호위원회","what":"침해 여부 판단과 조치 의결","detail":"통상인이 의심하지 않을 정도의 고도의 개연성이 있어야 침해 사실을 인정하고, 증거가 부족하면 '교육활동 침해 사안 아님'으로 끝낸다. 학생은 심각성·지속성·고의성(각 0~5점), 반성·선도가능성, 관계회복(각 0~3점)을 항목마다 출석 과반으로 정해 합산 점수로 조치를 고른다. 봉사 시간, 출석정지 일수, 특별교육 시간도 함께 정한다. 필요하면 피해교원 추가 보호조치를 권고한다.","basis":"교원지위법 제25조제2항·제26조제2항; 고시 별표; 매뉴얼 50~54쪽"},{"stage":"심의·결정","when":"요청받은 날부터 14일 이내","who":"교육장","what":"조치 처분과 통지","detail":"교육장이 조치하고 침해학생·보호자에게 조치결정 통지서(서식18-1~18-3)를 보낸다. 조치를 요청받은 사실은 학생 소속 학교장에게 통보한다. 전학이면 통보를 받은 학교장이 초·중학교는 교육장에게, 고등학교는 교육감에게 전학할 학교 배정을 지체 없이 요청하고, 교육장·교육감은 피해교원 보호에 충분한 거리를 고려해 배정한다.","basis":"교원지위법 제25조제7항·제8항·제26조제4항; 시행령 제22조제3항·제4항"},{"stage":"조치·이행","when":"조치 후","who":"학교장·교육장","what":"조치 이행과 부가조치","detail":"출석정지·학급교체·전학(4~6호)은 교육감이 정한 기관에서 특별교육·심리치료를 반드시 함께 받는다(전학은 먼저 시행). 1·2호에도 붙일 수 있다. 보호자도 함께 특별교육을 받아야 한다. 출석정지 중에는 원래 교실에 남아 수업을 들을 수 없다. 위원회 접수부터 이행 완료까지 원칙적으로 학적 변동을 제한한다.","basis":"교원지위법 제25조제3항~제5항; 매뉴얼 52~53쪽"},{"stage":"조치·이행","when":"조치 통보 후 90일","who":"학교장·교육장","what":"미이행 관리","detail":"90일 안에 끝내지 않으면 학교장이 미이행 명단을 교육장에게 공문 보고(서식12-1·12-2). 교육장은 21일 안에 30일 이내 이행을 서면 안내한다. 학생이 거부·회피하면 위원회는 4~7호 조치를 가중해 요청할 수 있다. 특별교육·심리치료를 정당한 사유 없이 받지 않은 보호자 등에게는 교육감이 300만원 이하 과태료를 부과한다.","basis":"교원지위법 제25조제8항·제35조; 매뉴얼 57~59쪽"},{"stage":"조치·이행","when":"필요 시","who":"피해교원·학교장","what":"보호조치 비용과 추가 회복 지원","detail":"치료·상담 비용은 침해 학생 보호자 등이 부담이 원칙이고, 빨리 치료받아야 하면 교육청이 먼저 내고 구상한다(신청서와 증빙을 교육감에게). 특별휴가 뒤 더 쉬어야 하면 학교장이 공무상 병가(6일 이내) 승인 가능. 원하면 시도 기준에 따라 전보 요청.","basis":"교원지위법 제20조제5항; 시행령 제19조; 매뉴얼 71~73쪽"},{"stage":"불복·구제","when":"처분을 안 날부터 90일, 있었던 날부터 180일 이내","who":"침해학생·보호자 / '침해 아님' 결정을 받은 교원","what":"행정심판 청구","detail":"교육장 조치(학생 조치·보호자 조치)에 대해 학생·보호자가, 위원회의 '교육활동 침해사안 아님' 결정에 대해 교원이 청구할 수 있다. 청구처는 해당 교육청 행정심판위원회. 국공립·사립 구분 없이 가능. 청구해도 조치는 멈추지 않으며, 멈추려면 행정심판위원회의 집행정지 결정이 필요하다.","basis":"교원지위법 제25조제14항; 행정심판법 제6조제3항·제27조·제30조; 매뉴얼 59~60쪽"},{"stage":"불복·구제","when":"처분을 안 날부터 90일, 있은 날부터 1년 이내","who":"침해학생·보호자(미성년자는 법정대리인) / 교원","what":"행정소송(취소소송)","detail":"행정심판을 거치지 않고 바로 낼 수 있다. 피고는 교육장. 행정심판을 거쳤으면 재결서 정본을 받은 날부터 90일. 소송을 내도 조치는 멈추지 않으며 법원의 집행정지 결정이 있어야 멈춘다.","basis":"행정소송법 제18조제1항·제20조·제23조; 매뉴얼 60~61쪽"},{"stage":"불복·구제","when":"범죄 행위일 때(선택)","who":"피해교원·교육감","what":"형사 고소·고발과 민사소송","detail":"피해교원이 직접 고소할 수 있다(모욕죄 등 친고죄는 본인 고소 필요). 교육감(관할청)은 형사처벌 규정에 해당한다고 판단하면 고발할 수 있다. 매뉴얼은 시·도교권보호위원회가 중대 사안에 대해 보고·요청을 받은 날부터 14일 이내 고발을 권고하는 방식을 예시로 든다. 14세 미만 학생은 교육감 고발 대상에서 빠지고, 만 10세 이상 만 19세 미만이면 학교장 통고제(소년부 통고)를 쓸 수 있다. 손해배상을 청구하는 민사소송도 가능. 경찰 불송치 결정에 대한 이의신청은 고발인은 할 수 없다(고소인 등만 가능).","basis":"교원지위법 제20조제4항; 소년법 제4조제3항; 형사소송법 제245조의7제1항; 매뉴얼 77~79쪽"},{"stage":"종결·사후","when":"조치 이후","who":"학교·교육지원청","what":"후속조치와 종결","detail":"이행 독려, 피해교원 심리치료 지원, 재발방지·추수지도, 정상적 교육활동 복귀 지원, 이의제기 시 불복절차 안내. 교육지원청은 결과보고서(서식19)로 시도교육청에 보고. 같은 사안으로 재심 성격의 위원회는 다시 열지 않는다.","basis":"매뉴얼 28·59쪽"},{"stage":"종결·사후","when":"피해교원이 위원회를 원하지 않을 때","who":"학교장","what":"위원회 없이 종결","detail":"학교장 자체해결 권한은 법에 없지만, 오인 신고이거나 피해교원이 위원회 개최를 원하지 않으면 종결할 수 있다. 관련자에게 신고 사실이 통보된 뒤라면 양측이 사안종결확인서(서식8)를 쓰고, 이후 같은 사안으로 위원회를 요청할 수 없다. 이 경우에도 교육지원청에 접수·서류 제출은 해야 하며, 학교장 판단으로 특별휴가를 예외적으로 허가할 수 있다.","basis":"매뉴얼 42·55·72쪽"}],"deadlines":[{"what":"피해교원 보호조치·분리조치","limit":"알게 된 즉시","basis":"교원지위법 제20조제1항·제2항"},{"what":"교육지원청 사안 신고 보고","limit":"사안 접수부터 24시간 이내","basis":"교육활동 보호 매뉴얼(2026) 32·38쪽"},{"what":"사안 발생보고서 제출","limit":"사안 보고 후 5일 이내(주말·공휴일 미포함)","basis":"매뉴얼 32·41쪽"},{"what":"지역교권보호위원회 개최","limit":"사안 발생보고서 접수 후 21일 이내(주말·공휴일 포함, 훈시규정)","basis":"매뉴얼 32·46쪽"},{"what":"당사자 출석통지","limit":"회의 10일 전까지","basis":"매뉴얼 46쪽(행정절차법 제21조제3항)"},{"what":"교육장의 조치","limit":"위원회 요청을 받은 날부터 14일 이내","basis":"교원지위법 제25조제7항·제26조제4항"},{"what":"분쟁조정 종료","limit":"개시 후 30일이 지나도 합의 안 되면 종료 가능","basis":"매뉴얼 63~65쪽"},{"what":"분리조치 기간(권장)","limit":"휴일 포함 최대 7일 이내","basis":"매뉴얼 40쪽"},{"what":"특별휴가","limit":"5일 범위(상해·폭행·성폭력은 5일 범위 추가). 사안 인지 즉시·연속 사용 원칙","basis":"교원휴가에 관한 예규 제8조; 매뉴얼 71쪽"},{"what":"조치 이행·미이행 보고","limit":"통보 후 90일 내 미완료 시 학교장 보고 → 교육장 21일 내 '30일 이내 이행' 안내","basis":"매뉴얼 57쪽"},{"what":"행정심판","limit":"처분이 있음을 안 날부터 90일, 있었던 날부터 180일","basis":"행정심판법 제27조"},{"what":"행정소송(취소소송)","limit":"안 날부터 90일, 있은 날부터 1년(행정심판을 거치면 재결서 정본 송달일부터 90일)","basis":"행정소송법 제20조"}],"dont":["피해교원에게 화해를 재촉하거나 사건을 축소·은폐하지 않는다 — 축소·은폐는 법으로 금지되고 징계 대상","피해교원 휴대전화 번호 등 개인정보나 상대방이 쓴 신고서·진술서를 다른 쪽에 넘기지 않는다","위원회 결정 전에 '가해 학생', '침해 학생'이라고 부르지 않는다 — '침해 관련 학생'으로","특별휴가를 한 달 뒤에 쓰거나 시간 단위로 쪼개 쓰지 않는다 — 인지 즉시·연속 사용이 원칙","법에 없는 조치(학생에게 서면사과 강제, '권고전학' 등)를 학교가 임의로 강요하지 않는다","피해교원 쪽이 준비되지 않았는데 학생·보호자의 사과를 일방적으로 받게 하지 않는다 — 피해교원을 더 힘들게 할 수 있다"],"contacts":[{"name":"교육활동보호 대표번호","tel":"소속 시·도 지역번호+1395","note":"업무시간 유·무선 모두. 시도 교육활동보호 창구로 바로 연결"},{"name":"시·도교육청 교육활동보호센터","tel":"","note":"시·도별 대표전화는 교육활동 보호 매뉴얼(2026) 75~76쪽 표(2026.1. 기준) 또는 소속 교육청 누리집에서 확인"},{"name":"경찰","tel":"112","note":"폭행 등 긴급상황"},{"name":"한국교육개발원 교육활동보호센터 누리집","tel":"","note":"forteacher.kedi.re.kr"}],"forms":["교육활동 침해 사안신고서 — 매뉴얼 서식1","긴급조치 보고서 — 서식2","즉시 분리 의사 확인서 — 서식3","의견서 — 서식4 / 참고인 진술서 — 서식5 / 분쟁조정 신청서 — 서식6","사안 발생보고서 — 서식7 / 사안종결확인서 — 서식8","조치 미이행 보고서 — 서식12-1·12-2","중대사안보고서 — 서식13 / 사안 조사 보고서 — 서식14","출석통지서 — 서식15, 서면의견서 — 서식15-1, 조치의결서 — 서식17, 조치결정 통지서 — 서식18-1~18-3, 결과보고서 — 서식19","합의서 — 서식20 / 분쟁조정 협의록 — 서식21"],"law":[{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제19조(교육활동 침해행위)","point":"학생·보호자 등이 교육활동 중인 교원에게 하는 공무방해·무고·상해·폭행·협박·명예훼손·모욕·업무방해·손괴, 성폭력범죄, 불법정보 유통, 그 밖의 형사처벌 대상 행위, 목적이 정당하지 않은 반복 민원, 법적 의무 아닌 일의 지속 강요 등"},{"name":"교육활동 침해 행위 및 조치 기준에 관한 고시","article":"제2조·별표","point":"성적 언동, 정당한 교육활동에 대한 반복적 부당 간섭, 정당한 생활지도 불응으로 인한 의도적 방해, 교원 영상·음성 무단 촬영·녹음·합성·배포 등도 침해행위. 별표는 학생 조치 점수 기준"},{"name":"교원지위법","article":"제20조(피해교원 보호조치·분리조치)","point":"알게 된 즉시 보호조치와 분리조치. 학교장은 지체 없이 관할청에 보고. 형사처벌 규정 해당 시 관할청 고발 가능. 비용은 침해 학생 보호자 등 부담 원칙"},{"name":"교원지위법","article":"제23조(특별휴가)","point":"피해교원은 교육부장관이 정하는 바에 따라 특별휴가를 쓸 수 있다"},{"name":"교원지위법","article":"제18조(교권보호위원회)","point":"시·도교권보호위원회(시행계획, 지역위 미조정 분쟁 조정 등), 교육지원청 지역교권보호위원회(침해학생·보호자 조치, 분쟁조정 등)"},{"name":"교원지위법","article":"제25조(침해학생 조치)","point":"7가지 조치, 의견 진술 기회, 요청 후 14일 내 교육장 조치, 거부 시 가중, 학교장 긴급조치(제9항~제12항, 2026.2.19. 신설), 이의는 행정심판"},{"name":"교원지위법","article":"제26조(보호자 등 조치)·제35조(과태료)","point":"서면사과·재발방지 서약, 특별교육·심리치료. 특별교육·심리치료 불이행 보호자 등은 300만원 이하 과태료"},{"name":"교원지위법","article":"제27조·제28조·제30조","point":"학교장의 축소·은폐 금지(시도 시 징계의결 요구), 신고의무와 신고자 불이익 금지, 위원회 비공개와 회의록 공개 신청"},{"name":"교원지위법 시행령","article":"제15조(지역교권보호위원회 구성·운영)","point":"10명 이상 50명 이하, 교원 위원은 정수의 2분의 1 초과 불가, 학부모·변호사·경찰·전문가 등. 임기 2년 1회 연임. 교육장·재적 4분의 1·피해교원 요청 시 소집. 재적 과반 출석, 출석 과반 찬성"}],"deep":[{"title":"처음 30분: 피해교원과 학교가 할 일","body":["피해교원은 침해를 멈추라고 말하고, 안 되면 도움을 청하거나 자리를 떠난다. 다쳤으면 치료가 먼저다. 신고는 말로 해도 된다.","학교장은 알게 된 즉시 두 가지를 해야 한다. 하나는 보호조치(상담·치료·특별휴가 안내), 다른 하나는 분리조치다. 분리는 피해교원이 원하지 않으면 하지 않는다. 폭행·성폭력처럼 급한 사안이면 학교장이 먼저 출석정지·학급교체 같은 긴급조치를 할 수 있고, 곧바로 지역교권보호위원회에 보고해 추인을 받는다."],"basis":"교원지위법 제20조·제25조제9항; 매뉴얼 37~40쪽"},{"title":"사안 조사는 이렇게 진행된다","body":["학교가 먼저 사안을 파악한다. 피해교원 면담(원하는 보호조치, 위원회·분쟁조정 희망 여부), 관련 학생·보호자 면담과 의견서, 목격자 진술서, 사진 등을 모아 보고 후 5일 안에 사안 발생보고서로 교육지원청에 낸다.","담당자는 침해 여부를 스스로 단정하거나, 진술을 강요하거나, 한쪽에만 관용·책임을 묻는 말을 하면 안 된다. 상대방이 쓴 신고서나 진술서를 다른 쪽에 넘기지 않는다.","교육지원청은 보고서를 검토하고 필요하면 추가 면담·현장 조사를 한 뒤 사안 조사보고서를 쓴다. 장애학생은 특수교육 전문가, 다문화 학생·보호자는 통역·번역 조사지로 진술을 돕는다."],"basis":"매뉴얼 41~45쪽"},{"title":"지역교권보호위원회 — 구성·출석·의견 진술","body":["교육지원청에 있고 10~50명으로 구성한다. 교원 위원은 정원의 절반을 넘을 수 없고 학부모, 변호사, 경찰, 교수 등 전문가가 함께 들어간다. 재적 과반이 출석해야 열리고 출석 과반 찬성으로 의결한다.","사안 발생보고서 접수 후 21일 안에 열도록 하고, 회의 10일 전까지 서면으로 출석을 통지한다. 못 오면 서면 의견서로 대신할 수 있다. 피해교원과 학생·보호자 모두 진술 기회를 받고, 변호사를 대리인으로 세울 수 있다. 교원 출석은 출장 처리, 학생 출석은 출석 인정이다.","회의는 비공개다. 다만 피해교원·침해학생·보호자가 회의록 열람·복사를 신청하면 개인정보(학생·가족 이름, 주민번호, 주소, 위원 이름 등)를 빼고 공개해야 한다. 위원이 당사자와 친족 관계 등이면 제척되고, 당사자는 기피 신청을 할 수 있다."],"basis":"교원지위법 제18조제2항·제30조; 시행령 제15조·제16조; 매뉴얼 46~49쪽"},{"title":"조치는 점수로 정한다","body":["침해행위의 심각성·지속성·고의성을 각각 0~5점, 학생의 반성 정도·선도가능성과 교원과의 관계회복 정도를 각각 0~3점으로 매긴다(반성·관계회복은 높을수록 점수가 낮다). 항목마다 출석위원 과반으로 정하고, 평균을 내면 안 된다.","학생이 장애가 있으면 1단계 감경, 피해교원이 임신 중이거나 장애가 있으면 1단계 가중을 출석 과반으로 정할 수 있다. 총점 4점 이하이거나 사안이 가벼우면 '조치 없음'도 가능하다.","전학·퇴학은 처음 일어난 침해로는 결정할 수 없고, 같은 학교에서 출석정지·학급교체를 받았던 학생이 다시 침해한 경우에만 가능하다. 다만 상해·폭행, 성폭력, 불법정보 유통(정보통신망법 제44조의7제1항제3호)은 처음이라도 가능하다."],"basis":"교육활동 침해 행위 및 조치 기준에 관한 고시 별표; 매뉴얼 51~54쪽"},{"title":"피해교원이 받을 수 있는 지원","body":["특별휴가 5일 범위(상해·폭행·성폭력은 5일 범위 추가). 쓰고도 더 쉬어야 하면 공무상 병가 6일 이내를 학교장이 승인할 수 있다. 위원회에서 침해가 아니라고 나오면 특별휴가는 병가·연가로 바뀐다.","치료·상담 비용은 침해 학생 보호자 부담이 원칙이지만 교육청이 먼저 내고 청구할 수 있다. 교육활동보호센터의 심리상담, 법률지원단 변호사 상담, 교원보호공제(표준약관: 상해치료·심리상담 300만원 한도, 긴급 경호, 민·형사 소송비용, 분쟁조정 — 표준약관은 최소 보장범위라 시·도마다 다를 수 있음)를 이용한다. 원하면 전보도 요청할 수 있다."],"basis":"교원지위법 제20조제5항·제21조·제22조·제23조; 매뉴얼 71~85쪽"},{"title":"결정에 불복하려면","body":["교육장의 조치가 부당하다고 보는 학생·보호자, 위원회가 '침해 아님'이라고 결정해 억울한 교원 모두 행정심판이나 행정소송을 낼 수 있다. 사립학교여도 교육장 처분이라 같은 절차다.","행정심판은 처분을 안 날부터 90일, 있었던 날부터 180일 안에 해당 교육청 행정심판위원회에 낸다. '안 날'은 교육장의 조치를 현실적으로 안 날로, 조치결정 통보서가 송달되기 전에는 다른 경로로 미리 알았어도 기간이 시작되지 않고, 합리적 이유 없이 통보서 수령을 거절하거나 받았다가 돌려주면 그때부터 센다. 행정소송은 행정심판 없이 바로 낼 수 있고, 안 날부터 90일·있은 날부터 1년 안에 교육장을 피고로 한다.","어느 쪽이든 청구만으로 조치가 멈추지 않는다. 멈추려면 행정심판위원회나 법원의 집행정지 결정을 따로 받아야 한다."],"basis":"교원지위법 제25조제14항; 행정심판법 제27조·제30조; 행정소송법 제18조·제20조·제23조; 매뉴얼 59~61쪽"}],"tables":[{"title":"침해학생 조치와 점수 기준","head":["호","조치","총점","출결 처리","비고"],"rows":[["-","조치 없음","0~4","-","학교 봉사에서 감경되면 조치 없음"],["1호","학교에서의 봉사","5~7","출석 인정 가능","학교장 긴급조치 가능"],["2호","사회봉사","8~10","출석 인정 가능",""],["3호","학내외 전문가 특별교육 또는 심리치료","점수 구간 없음(단독 또는 부가)","출석 인정 가능","학교장 긴급조치 가능"],["4호","출석정지","11~13","미인정 결석(출결 특기사항 사유 입력 안 함)","특별교육·심리치료 부가 의무, 긴급조치 가능"],["5호","학급교체","14~16","-","특별교육·심리치료 부가 의무, 긴급조치 가능(학적변동은 추인 후)"],["6호","전학","17~21","-","특별교육·심리치료보다 먼저 시행"],["7호","퇴학","17~21","-","의무교육 과정(초·중) 적용 불가"]],"note":"교육활동 침해 행위 및 조치 기준에 관한 고시 별표, 교육활동 보호 매뉴얼(2026) 51·56쪽. 6·7호는 원칙적으로 같은 학교 재학 중 4·5호를 받았던 학생의 재침해에만 가능(상해·폭행·성폭력·불법정보 유통은 예외)."},{"title":"보호자 등에 대한 조치","head":["호","조치","총점","불이행 시"],"rows":[["-","조치 없음","0~4","-"],["1호","서면사과 및 재발방지 서약","5~11","-"],["2호","교육감이 정하는 기관에서 특별교육 이수 또는 심리치료","12~21","정당한 사유 없이 안 받으면 300만원 이하 과태료"]],"note":"교원지위법 제26조·제35조; 매뉴얼 54·59쪽. 과태료 불복은 부과 통지를 받은 날부터 60일 이내 교육청에 서면 이의제기(질서위반행위규제법 제20조)."},{"title":"불복 절차 한눈에","head":["절차","누가","어디에","기간","조치가 멈추나"],"rows":[["행정심판","침해학생·보호자(조치), 교원('침해 아님' 결정)","해당 교육청 행정심판위원회","안 날부터 90일, 있었던 날부터 180일","안 멈춤 — 집행정지 결정 필요"],["행정소송(취소소송)","학생·보호자(미성년자는 법정대리인), 교원","법원(피고: 교육장)","안 날부터 90일, 있은 날부터 1년. 행정심판 거치면 재결서 송달일부터 90일","안 멈춤 — 법원 집행정지 결정 필요"],["2차 분쟁조정","분쟁 당사자","시·도교권보호위원회","지역위 분쟁조정 불성립 후","-"]],"note":"행정심판법 제27조·제30조, 행정소송법 제18조·제20조·제23조, 교육활동 보호 매뉴얼(2026) 59~65쪽."},{"title":"누가 언제 무엇을 내나(서식 흐름)","head":["시점","누가","무엇을","어디로"],"rows":[["발생 직후","피해교원","사안신고서(서식1), 즉시 분리 의사 확인서(서식3)","학교"],["24시간 이내","학교장","사안 신고 보고(유선·구두 또는 서식1)","교육지원청"],["긴급조치 시","학교장","긴급조치 보고서(서식2)","지역교권보호위원회"],["5일 이내","학교장","사안 발생보고서(서식7)+의견서(서식4)+참고인 진술서(서식5)","교육지원청"],["위원회 전","교육지원청","사안 조사보고서(서식14), 출석통지서(서식15)","위원회·당사자"],["위원회 요청을 받은 날부터 14일 이내","교육장","조치결정 통지서(서식18-1~18-3)","학생·보호자·학교장"],["90일 미이행 시","학교장","조치 미이행 보고서(서식12-1·12-2)","교육장"]],"note":"교육활동 보호 매뉴얼(2026) 32쪽 흐름도 기준."}],"faq":[{"q":"신고는 꼭 서면으로 해야 하나요?","a":"아니다. 구두로도 된다. 다만 지역교권보호위원회 개최를 원하면 피해교원이 사안신고서(서식1)를 작성해 내야 한다."},{"q":"위원회 열리기 전에 특별휴가를 쓸 수 있나요?","a":"쓸 수 있다. 학교장 판단으로 허가하고 진단서 등 증빙은 나중에 갖춘다. 다만 위원회·행정심판에서 침해가 아니라고 나오면 병가·연가로 정정된다."},{"q":"위원회를 안 열고 조용히 끝낼 수는 없나요?","a":"학교장 자체해결 권한은 법에 없다. 다만 오인 신고이거나 피해교원이 위원회 개최를 원하지 않으면 종결 처리할 수 있고, 양측에 통지된 경우 사안종결확인서(서식8)로 양측 의사를 확인한다. 그 뒤에는 같은 사안으로 위원회를 요청할 수 없다."},{"q":"위원회에 변호사나 가족이 같이 갈 수 있나요?","a":"변호사는 대리인으로 출석해 의견을 말할 수 있고 교육장은 특별한 사정이 없으면 거부하면 안 된다. 피해교원의 배우자 등 가족은 법적 근거가 없어 원칙적으로 동석할 수 없다."},{"q":"'침해 아님'으로 나왔어요. 교사도 다툴 수 있나요?","a":"있다. 교원은 '교육활동 침해사안 아님' 결정에 행정심판(안 날부터 90일)이나 행정소송(안 날부터 90일, 교육장 피고)을 낼 수 있다."},{"q":"침해 학생 조치가 생활기록부에 남나요?","a":"출석정지(4호)는 미인정 결석으로 처리하고, 「2026학년도 학교생활기록부 기재요령」에 따라 출결 특기사항에 사유를 입력하지 않는다(2026 교육활동 보호 매뉴얼도 같은 안내). 위원회 참석, 사회봉사·특별교육·심리치료, 학교 밖 분리조치로 인한 결석은 출석 인정이다. 학생부 종합지원포털 Q&A(2025.12.22.)는 교권보호위원회 조치로 부과된 학급교체는 학생부에 기재하지 않는다고 답했다. 교육부는 2026.1.22. 강화방안에서 중대한 침해 조치의 학생부 기재를 제외했고, 향후 국회 입법과정에서 반영 여부를 검토한다고 밝혔다."},{"q":"학부모가 교사를 몰래 녹음해 단체방에 퍼뜨렸어요.","a":"교육활동 중인 교원의 음성 등을 녹음해 무단 배포하는 행위는 고시 제2조제5호의 교육활동 침해행위다. 명예훼손 등 범죄에 해당하면 고소·고발도 가능하다."},{"q":"치료비는 누가 내나요?","a":"침해 학생의 보호자 등이 내는 것이 원칙이다. 빨리 치료받아야 하면 피해교원이나 학교장이 원할 때 교육청이 먼저 내고 보호자에게 청구(구상)한다."}],"record":"교육활동 침해 학생의 출석정지(교원지위법 제25조제2항제4호)는 미인정 결석이며, 2026학년도 학교생활기록부 기재요령에 따라 출결 특기사항에 사유를 입력하지 않는다. 기재요령은 위원회 참석, 사회봉사·특별교육·심리치료(부가조치 포함), 불가피하게 학교 밖에서 한 분리조치로 인한 결석을 출석 인정 결석으로 정한다(매뉴얼은 1~3호 조치도 출석 인정으로 안내). 학교장 긴급조치 출석정지를 위원회가 추인하지 않거나 위원회 전에 사안이 끝나면 그 기간을 출석으로 인정할 수 있다. 학교장 긴급조치 학급교체의 학적변동은 위원회 추인 뒤 반영하며 해당 학년도까지 유효. 위원회 접수부터 이행 완료까지 원칙적으로 학적 변동 제한. 학급교체 조치 자체는 학생부에 기재하지 않는다(학생부 종합지원포털 Q&A 2025.12.22.). 교육부는 2026.1.22. 강화방안에서 침해 조치의 학생부 기재를 제외하고 향후 국회 입법과정에서 반영 여부를 검토한다고 밝혔다.","sources":[{"title":"교육활동 보호 매뉴얼 2026년도 일부 개정 (수탁연구자료 CRM 2026-09, 발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://www.jne.go.kr/upload/thsupport/na/bbs_339/ntt_5170000/doc_57389173-2d62-4eb9-a118-4547e343a6ab1772a7724b93123.pdf"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 (시행 2026.2.19., 법률 제21350호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 시행령 (시행 2025.9.19.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법시행령"},{"title":"교육활동 침해 행위 및 조치 기준에 관한 고시 (교육부고시 제2024-20호, 시행 2024.8.30.)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육활동침해행위및조치기준에관한고시"},{"title":"행정심판법·행정소송법·질서위반행위규제법 (현행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/행정심판법"},{"title":"교권보호위원회의 조치에 따른 생활기록부 기재 방법 문의 (답변 2025.12.22.)","publisher":"학교생활기록부 종합지원포털·교육부/한국교육학술정보원","year":2025,"url":"https://star.moe.go.kr/web/contents/m30103.do?id=101335&schM=view"},{"title":"학교민원 대응 및 교육활동 보호 강화 방안 보도자료 (2026.1.22.)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105198&lev=0&m=020402&opType=N&s=moe&statusYN=W"},{"title":"2026학년도 학교생활기록부 기재요령(중학교) — 출결상황 특기사항","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/fileDown.do?fileSeq=4ad0d9bae480b48e1b9b3de0592f955b&m=0302&s=moe"}],"verified":"2026-09-24","uncertain":["학생부 종합지원포털 Q&A(2025.12.22.)는 장기결석 기간 이상이면 사유를 입력하라고 답했으나, 그 뒤 나온 2026학년도 학교생활기록부 기재요령과 2026 교육활동 보호 매뉴얼은 교육활동 침해 출석정지의 출결 특기사항에 사유를 입력하지 않는다고 정해 이를 따랐다.","24시간·5일·21일·7일·90일은 법률이 아니라 교육부·KEDI 매뉴얼의 처리 기준이다. 시·도교육청 자체 지침과 다를 수 있다(21일은 매뉴얼상 훈시규정)","교원휴가에 관한 예규 원문은 직접 열지 않았고 매뉴얼에 실린 제8조 인용(교육부 예규 제104호, 2026.2.27.)으로 확인했다","조치 점수표의 3호는 점수 구간이 없는 별도 조치이며, 1·2호와 병과하거나 4·5·6호에 부가할 수 있음을 2026 교육활동 보호 매뉴얼 표와 적용기준에서 재확인했다.","시·도별 교원보호공제 약관의 실제 보장 한도는 확인하지 못했다(표준약관 수치만 적음 — 소속 시·도 약관 확인 필요)"],"related":["malicious-complaint","teacher-abuse-accusation","student-photo-sns"]},{"id":"teacher-abuse-accusation","title":"교사가 아동학대로 신고당했을 때","aka":["아동학대 신고당함","정서학대 신고","교사 아동학대","학부모가 고소","경찰 조사 받아요","생활지도했는데 신고","교육감 의견서","직위해제","무고","교원 법률지원","교원보호공제","소송비용 지원","아동학대 피신고","소청심사"],"category":"교원 보호","urgency":"당일","roles":["신고된 교사","교장","교감","교육지원청 교육활동보호 담당","시도교육청(교육감 의견 제출)","시도교육청 교육활동보호센터·법률지원단"],"summary":"교원의 정당한 교육활동과 학생생활지도는 아동학대처벌법상 아동학대로 보지 않고, 초·중등교육법은 정당한 학생생활지도 등을 아동복지법 제17조제3호·제5호·제6호 금지행위로 보지 않는다고 규정하지만, 정당한 지도인지는 구체적 사실관계에 따라 판단된다. 신고되면 교육감이 법정 기한 안에 수사기관·지자체에 의견서를 내고, 경찰·검사·지자체는 이를 참고한다. 신고만으로 직위해제할 수 없으며, 징계 등 불리한 처분은 법정 청구기간에 따라 소청심사로 다툴 수 있다. 교사는 기록을 정리해 학교와 교육지원청 절차를 이용한다.","first":["그날 있었던 일을 시간 순서대로 바로 적는다(무엇을, 왜, 어떤 말로, 누가 봤는지)","교장·교감에게 알리고, 교육지원청 교육활동보호 담당 또는 소속 시·도 지역번호+1395로 연락해 교육감 의견 제출 절차를 요청한다","학부모나 해당 학생에게 직접 연락해 해명·사과·합의를 시도하지 않는다","교육청 법률지원단(변호사) 상담과 교원보호공제 소송비용 지원을 안내받는다"],"steps":[{"stage":"알게 됨·신고","when":"신고 사실을 안 때","who":"신고된 교사","what":"신고 경로 파악","detail":"보통 경찰(112) 또는 시군구 아동학대전담공무원에 신고되고, 조사·수사기관이 교육지원청에 교원 대상 신고 사안을 공유한다. 학교가 먼저 알게 되는 경우도, 경찰 출석 요구로 처음 아는 경우도 있다.","basis":"교육활동 보호 매뉴얼(2026) 82쪽"},{"stage":"초기 대응","when":"안 즉시","who":"신고된 교사","what":"사실관계 기록 정리","detail":"지도 당시 상황, 학생 행동, 교사가 한 말·행동과 그 근거(학칙·학급 규칙·생활지도 고시 조항), 목격 학생·교직원, 이전 상담·지도 기록, 보호자와 주고받은 문자·알림장 등을 모은다.","basis":"매뉴얼 78·83쪽"},{"stage":"초기 대응","when":"당일","who":"신고된 교사 → 학교장","what":"학교장 보고와 학교 조치","detail":"학교장은 교육(지원)청 아동학대·교원업무 담당과 협의해 교사 면담, 동선 구분, 수업 교체, 담임 교체 등을 할 수 있다. 피해 주장 아동 보호, 사안의 경중, 2차 피해 예방, 아동·보호자 의사, 다른 학생 학습권, 정당한 교육활동 여부를 종합해 판단한다.","basis":"교육부 아동학대 가이드북 4판 65쪽"},{"stage":"초기 대응","when":"당일~이튿날","who":"신고된 교사·학교","what":"교육지원청·교육활동보호센터 연락","detail":"소속 시·도 지역번호+1395나 시·도교육청 교육활동보호센터로 연락하면 교육감 의견 제출 제도 담당자, 법률상담, 심리상담으로 연결해 준다.","basis":"매뉴얼 73~76쪽"},{"stage":"초기 대응","when":"초기","who":"신고된 교사","what":"법률 상담","detail":"교육청 법률지원단(변호사 등)에서 법률 상담을 받는다. 정당한 교육활동과 관련된 분쟁이면 기관 차원의 법률 자문·법무 지원을 받을 수 있다.","basis":"교원지위법 제21조; 매뉴얼 83쪽"},{"stage":"조사·확인","when":"신고 내용을 모를 때","who":"신고된 교사","what":"신고 내용 확인","detail":"수사기관에 정보공개청구(open.go.kr)로 신고 사안을 확인할 수 있고, 관련 자료를 교육지원청에 내 교육활동 확인서 작성에 협조할 수 있다.","basis":"매뉴얼 82쪽 각주12"},{"stage":"조사·확인","when":"신고사항을 공유받은 날부터 3일 이내","who":"교육지원청","what":"사안 확인","detail":"학교와 교사를 통해 사실관계를 확인한다.","basis":"매뉴얼 82쪽"},{"stage":"조사·확인","when":"공유받은 날부터 5일 이내","who":"교육지원청","what":"'교육활동 확인서' 작성·상신","detail":"정당한 생활지도로 판단한 근거를 적어 교육청에 공문으로 올린다. 판단 기준은 초·중등교육법 제20조의2, 시행령 제40조의3, 생활지도 고시와 해설서, 학칙, 학급 규칙·교육주체 간 협약, 교원-보호자 사전 협의 사항이다.","basis":"매뉴얼 82~83쪽"},{"stage":"조사·확인","when":"안 날부터 7일 이내(부득이하면 7일 범위 1회 연장)","who":"교육감","what":"교육감 의견서를 지자체·수사기관에 서면 제출","detail":"경찰은 의견서를 사건기록에 붙이고 수사와 송치 의견에 참고해야 한다. 검사도 수사·결정 때 참고해야 한다. 지자체는 아동학대 사례 판단에 참고해야 한다.","basis":"교원지위법 제17조; 시행령 제11조; 아동학대처벌법 제11조의2제2항·제17조의3"},{"stage":"조사·확인","when":"지자체 조사","who":"아동학대전담공무원","what":"지자체 조사와 사례판단","detail":"아동 보호·사례관리 목적의 조사다. 관계인에게 출석·진술·자료제출을 요구할 수 있고, 조사 후 복지적 관점에서 아동학대 여부를 사례판단한다. 수사(처벌 목적)와는 별개다.","basis":"아동학대처벌법 제11조의2; 가이드북 4판 124~125쪽"},{"stage":"조사·확인","when":"경찰 수사","who":"신고된 교사","what":"피의자(또는 피신고자) 진술","detail":"교육지원청으로 통보된 사건은 경찰과 아동학대전담공무원이 조율해 같은 날 같은 장소에서 연달아 진술을 듣는 방식으로 부담을 줄일 수 있다. 변호사 조언을 받고, 정리한 기록을 바탕으로 사실대로 진술한다.","basis":"가이드북 4판 87쪽"},{"stage":"심의·결정","when":"수사 종결","who":"사법경찰관","what":"검사에게 사건 송치","detail":"아동학대처벌법은 사법경찰관이 아동학대범죄를 신속히 수사해 사건을 검사에게 송치하도록 정하고 있다. 이때 아동보호사건으로 처리하는 것이 적절한지 의견을 낼 수 있고, 교육감 의견서를 참고해야 한다. 이후 처분은 검사가 정한다.","basis":"아동학대처벌법 제24조·제17조의3제1항; 가이드북 4판 78·124쪽"},{"stage":"심의·결정","when":"송치 후","who":"검사","what":"검사 결정","detail":"불기소, 상담·치료·교육을 조건으로 한 조건부 기소유예, 보호처분이 적절하면 아동보호사건으로 가정법원 송치, 또는 기소(형사재판). 교육감 의견서를 참고해야 한다.","basis":"아동학대처벌법 제17조의3제2항·제26조·제27조; 가이드북 4판 124쪽"},{"stage":"조치·이행","when":"기소·송치된 경우","who":"법원","what":"형사재판 또는 보호처분","detail":"형사법원은 형벌을, 가정법원은 보호처분을 정한다. 형이나 치료감호를 선고할 때는 원칙적으로 학교 등 아동관련기관 취업제한명령을 함께 선고하지만, 재범 위험이 현저히 낮거나 특별한 사정이 있으면 선고하지 않는다. 취업제한명령이 없으면 벌금형만으로 직을 잃지는 않는다.","basis":"가이드북 4판 127쪽(아동복지법 제29조의3)"},{"stage":"조치·이행","when":"수사 중","who":"임용권자","what":"직위해제 제한","detail":"아동학대범죄로 신고된 것만으로는 정당한 사유 없이 직위해제할 수 없다. 교육공무원법상 수사 중 직위해제는 아동복지법 제17조 금지행위 등으로 비위 정도가 중대하고 정상적 업무수행을 기대하기 현저히 어려운 경우 등에 한한다. 기소되면(약식명령 청구 제외) 직위해제 사유가 될 수 있다.","basis":"교원지위법 제6조제3항; 교육공무원법 제44조의2제1항제3호·제4호"},{"stage":"조치·이행","when":"필요 시","who":"신고된 교사","what":"교원보호공제 청구","detail":"정당한 교육활동 관련 민·형사 소송비용, 손해배상금(고의·중과실 제외), 분쟁조정 서비스를 소속 시·도 학교안전공제회에 청구한다. 표준약관상 형사는 유죄 확정 시 지원 제외, 민사는 고의·중과실이 객관적으로 명백하면 제외. 청구권은 사유 발생일부터 3년.","basis":"교원지위법 제22조; 매뉴얼 84~85쪽; 학교민원 처리 매뉴얼(2026) 36쪽"},{"stage":"불복·구제","when":"징계·직위해제 등 처분을 안 날부터 30일 이내","who":"신고된 교사(변호사 대리 가능)","what":"교원소청심사 청구","detail":"징계처분과 그 밖에 의사에 반하는 불리한 처분(직위해제 포함)에 대해 교육부 교원소청심사위원회에 청구한다. 위원회는 접수 후 60일 안에 결정(30일 연장 가능). 처분권자는 결정서를 받은 날부터 30일 안에 결정 취지대로 구제조치를 해야 한다.","basis":"교원지위법 제7조·제9조·제10조"},{"stage":"불복·구제","when":"소청 결정서를 받은 날부터 30일 이내","who":"교원(사립은 학교법인 등도)","what":"행정소송","detail":"소청 결정에 불복하면 행정소송을 낸다. 이 기간이 지나면 결정이 확정된다.","basis":"교원지위법 제10조제4항·제5항"},{"stage":"불복·구제","when":"허위 신고·협박이 있을 때","who":"교사·학교장","what":"교육활동 침해로 신고, 형사 대응","detail":"무고, 협박, 명예훼손, 목적이 정당하지 않은 반복 민원은 교원지위법상 교육활동 침해행위다. 지역교권보호위원회 심의를 거쳐 교육장이 보호자 등에게 조치(서면사과·재발방지 서약, 특별교육·심리치료)를 할 수 있고, 무고 등은 교사가 고소할 수 있다.","basis":"교원지위법 제19조·제26조"},{"stage":"종결·사후","when":"사안 종결 후","who":"신고된 교사·학교장","what":"복귀와 회복","detail":"수업·담임 교체 등 임시 조치를 정리하고 정상 교육활동으로 복귀한다. 교육활동보호센터의 심리상담·치유 프로그램, 교원 정신건강 지원 사업을 이용한다.","basis":"교원지위법 제29조·제29조의2"}],"deadlines":[{"what":"교육지원청 사안 확인","limit":"신고사항을 공유받은 날부터 3일 이내","basis":"교육활동 보호 매뉴얼(2026) 82쪽"},{"what":"교육지원청 '교육활동 확인서' 상신","limit":"공유받은 날부터 5일 이내","basis":"매뉴얼 82쪽"},{"what":"교육감 의견서 서면 제출","limit":"조사·수사 사실을 안 날부터 7일 이내(부득이하면 7일 범위에서 1회 연장)","basis":"교원지위법 시행령 제11조"},{"what":"교원소청심사 청구","limit":"처분이 있었던 것을 안 날부터 30일 이내","basis":"교원지위법 제9조제1항"},{"what":"소청심사 결정","limit":"접수 후 60일 이내(30일 연장 가능)","basis":"교원지위법 제10조제1항"},{"what":"소청 결정에 대한 행정소송","limit":"결정서를 송달받은 날부터 30일 이내","basis":"교원지위법 제10조제4항"},{"what":"교원보호공제 공제금 청구","limit":"지급 사유 발생일부터 3년 이내","basis":"학교민원 처리 매뉴얼(2026) 36쪽"}],"dont":["학부모에게 직접 전화·문자로 해명하거나 사과문·합의서를 먼저 써 주지 않는다 — 나중에 인정 자료로 쓰일 수 있다. 분쟁조정은 지역교권보호위원회·공제 분쟁조정 서비스를 거친다","학생을 따로 불러 교원의 의도를 확인받으려 하지 않는다 — 진술에 영향을 줄 수 있다","반 학생들에게 사건을 설명하거나 목격 학생들에게 진술을 맞추라고 하지 않는다","기록 없이 기억만으로 조사를 받지 않는다 — 당일 기록과 근거 조항을 준비한다","혼자 버티지 않는다 — 학교장 보고와 교육지원청 절차에 올려야 교육감 의견서가 제때 나간다","학교가 보관하는 학생 자료를 개인적으로 빼내 수사기관에 내지 않는다 — 기관 자료는 수사기관의 적법한 요청이 있을 때 기관 명의로 낸다","소청심사 30일을 놓치지 않는다 — 징계·직위해제 통지를 받으면 바로 날짜를 적어 둔다"],"contacts":[{"name":"교육활동보호 대표번호","tel":"소속 시·도 지역번호+1395","note":"업무시간. 교육감 의견 제출 제도 안내·담당자 연계, 교원보호공제 안내"},{"name":"시·도교육청 교육활동보호센터","tel":"","note":"시·도별 대표전화는 교육활동 보호 매뉴얼(2026) 75~76쪽 표(2026.1. 기준) 또는 소속 교육청 누리집에서 확인"},{"name":"한국교육개발원 교육활동보호센터","tel":"","note":"forteacher.kedi.re.kr"},{"name":"정보공개 포털","tel":"","note":"open.go.kr — 수사기관에 신고 사안 정보공개청구"}],"forms":["당일 경위 기록(시간순, 교사 발언·행동과 근거 조항, 목격자)","학생 상담·생활지도 기록, 보호자와 주고받은 연락 기록, 학급 규칙","교육활동 확인서(교육지원청 작성 — 교사는 자료 제출로 협조)","정보공개청구서(수사기관 대상, open.go.kr)","교원보호공제 공제금 청구서(소속 시·도 학교안전공제회 서식)","소청심사 청구서(교원소청심사위원회)"],"law":[{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제2조제3호 단서","point":"「유아교육법」과 「초·중등교육법」에 따른 교원의 정당한 교육활동과 학생생활지도는 아동학대로 보지 않는다"},{"name":"초·중등교육법","article":"제20조의6(「아동복지법」의 적용 배제)","point":"정당한 학생생활지도, 방어·보호를 위한 제지, 개별학생교육지원, 스마트기기 사용·소지 제한은 아동복지법 제17조제3호·제5호·제6호(신체·정서학대, 방임) 금지행위로 보지 않는다"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제17조(아동학대 사안에 대한 교육감의 의견 제출)","point":"정당한 생활지도가 아동학대로 신고되어 조사·수사가 진행되면 교육감은 지자체·수사기관에 신속히 의견을 내야 한다"},{"name":"교원지위법 시행령","article":"제11조","point":"안 날부터 7일 이내 서면 제출, 부득이하면 7일 범위에서 1회 연장"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제11조의2제2항·제17조의3","point":"지자체는 교육감 의견을 사례 판단에, 경찰은 수사와 의견 제시에, 검사는 수사·결정에 참고해야 한다"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제6조제3항","point":"교원이 아동학대범죄로 신고된 경우 임용권자는 정당한 사유 없이 직위해제하면 안 된다"},{"name":"교육공무원법","article":"제44조의2(직위해제)","point":"기소된 자(약식명령 청구 제외), 아동복지법 제17조 금지행위 등으로 수사 중이며 비위가 중대하고 정상 업무를 기대하기 현저히 어려운 자 등에게 직위를 주지 않을 수 있다"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제9조·제10조(소청심사)","point":"불리한 처분을 안 날부터 30일 내 청구, 60일(+30일) 내 결정, 결정서 송달 후 30일 내 행정소송"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제21조(법률지원단)·제22조(교원보호공제사업)","point":"교육활동 관련 분쟁 시 변호사 등 법률 상담, 정당한 교육활동 관련 민·형사 소송비용과 손해배상금(고의·중과실 제외) 지원"}],"deep":[{"title":"교육감 의견서는 이렇게 나간다","body":["조사·수사기관이 교원 대상 아동학대 신고 사안을 교육지원청에 공유하면 절차가 시작된다. 교육지원청은 3일 안에 사안을 확인하고, 5일 안에 '교육활동 확인서'를 교육청에 올린다. 교육감은 공유받은 날부터 7일 안에(공휴일 제외, 부득이하면 7일 1회 연장) 서면 의견서를 낸다.","의견서의 핵심은 '정당한 교육활동·생활지도였는가'다. 판단 근거는 초·중등교육법 제20조의2, 시행령 제40조의3, 학생생활지도 고시와 해설서, 학칙, 학급 규칙과 교육주체 간 협약, 보호자와 사전에 협의한 내용이다. 그래서 교사가 모아 둔 학급 규칙, 사전 안내, 지도 기록이 곧 의견서의 재료가 된다.","신고 내용을 모르면 수사기관에 정보공개청구를 해서 확인하고, 자료를 교육지원청에 낼 수 있다."],"basis":"교원지위법 제17조; 시행령 제11조; 매뉴얼 82~83쪽"},{"title":"지자체 조사와 경찰 수사는 다르다","body":["아동학대전담공무원(지자체)의 조사는 아이 보호와 사례관리를 위한 것이고, 조사 뒤 복지적 관점에서 '아동학대 사례' 여부를 판단한다. 관계인은 정당한 사유 없으면 출석·진술·자료 제출에 따라야 한다.","경찰 수사는 범죄 혐의를 가려 처벌 여부를 정하기 위한 것이다. 경찰은 수사한 사건을 검사에게 송치하고(아동학대처벌법 제24조), 검사가 불기소, 조건부 기소유예, 아동보호사건 송치, 기소 중 하나를 정한다. 두 기관 모두 교육감 의견을 참고해야 한다.","교육지원청으로 통보된 사건은 두 기관이 조율해 같은 날 같은 곳에서 연달아 진술을 들어 교사의 부담을 줄일 수 있다."],"basis":"아동학대처벌법 제11조의2·제17조의3·제24조~제27조; 가이드북 4판 87·124~125쪽"},{"title":"직위해제와 징계, 그리고 소청심사","body":["신고만으로는 직위해제할 수 없다(교원지위법 제6조제3항). 교육공무원법상 수사 중 직위해제는 비위 정도가 중대하고 정상적 업무수행을 기대하기 현저히 어려운 경우 등에 한정되고, 기소(약식명령 청구 제외)되면 사유가 된다.","직위해제나 징계처분을 받으면 안 날부터 30일 안에 교원소청심사위원회에 소청심사를 청구한다. 변호사를 대리인으로 세울 수 있다. 위원회는 60일(30일 연장 가능) 안에 결정하고, 처분권자는 결정서를 받은 날부터 30일 안에 결정대로 구제조치를 해야 한다. 결정에 불복하면 결정서 송달일부터 30일 안에 행정소송을 낸다."],"basis":"교원지위법 제6조·제9조·제10조; 교육공무원법 제44조의2"},{"title":"돈 문제: 변호사 비용과 배상","body":["교육청 법률지원단에서 법률 상담을 받을 수 있다. 소송 비용은 교원보호공제로 청구한다. 표준약관 기준 형사 고소(고발) 대리 1건당 330만원(고소·고발 지원은 반복적·계속적 교육활동 침해행위를 배제하려는 목적인 경우에 한함), 수사단계 1인당 330만원, 수사단계를 포함한 형사소송 1인당 660만원이 한도이고, 형사는 유죄가 확정되면 지원하지 않는다.","교육활동으로 생긴 손해배상책임은 1사고당 2억5천만원(소송 전 합의 시 1억5천만원) 한도로 지원하되 고의·중과실은 제외한다. 표준약관은 최소 보장 범위라 시도마다 다를 수 있으니 소속 시·도 약관을 확인한다. 청구는 사유 발생일부터 3년 안에 한다."],"basis":"교원지위법 제21조·제22조; 교육활동 보호 매뉴얼(2026) 84~85쪽; 학교민원 처리 매뉴얼(2026) 36쪽"},{"title":"학교는 무엇을 해야 하나","body":["학교장은 교육(지원)청 담당자와 협의해 교사 면담, 동선 구분, 수업·담임 교체 등 필요한 조치를 한다. 이때 아이 보호와 함께 정당한 교육활동 여부, 다른 학생 학습권도 함께 본다.","학부모가 교사의 학대를 호소하거나 민원을 제기하는 것만으로 신고의무가 생긴다고 보기는 어렵고, 여러 정보를 종합해 아동학대가 의심되면 신고해야 한다(가이드북 Q&A). 학교가 보유한 학생 자료는 수사기관의 적법한 요청이 있을 때 기관 명의로 제출한다."],"basis":"가이드북 4판 65·121쪽; 매뉴얼 78쪽"}],"tables":[{"title":"교육감 의견 제출 일정","head":["기한","누가","무엇을"],"rows":[["신고 접수 후","조사·수사기관","교원 대상 신고사항을 교육지원청에 공유"],["공유받은 날부터 3일 이내","교육지원청","사안 확인(학교·교사)"],["공유받은 날부터 5일 이내","교육지원청","교육활동 확인서를 교육청에 상신"],["공유받은 날(안 날)부터 7일 이내","교육감","지자체·수사기관에 의견서 서면 제출(부득이하면 7일 1회 연장)"],["조사·수사 중","지자체·경찰·검사","의견서를 사례판단·수사·결정에 참고"]],"note":"교원지위법 시행령 제11조, 교육활동 보호 매뉴얼(2026) 82쪽. 매뉴얼은 7일을 공휴일 제외로 적고 있다."},{"title":"수사 결과별 의미","head":["결과","누가 정하나","교사에게 의미"],"rows":[["불기소","검사","재판에 넘기지 않음"],["조건부 기소유예","검사","상담·치료·교육을 조건으로 기소를 미룸"],["아동보호사건 송치","검사","가정법원에서 보호처분(형사처벌 아님)"],["기소","검사","형사재판. 직위해제 사유가 될 수 있음(약식명령 청구 제외)"],["형 선고","형사법원","원칙적으로 취업제한명령 함께 선고. 선고되지 않으면 벌금형만으로 직을 잃지는 않음"]],"note":"아동학대처벌법 제24조(경찰은 사건을 검사에게 송치)·제26조·제27조, 교육공무원법 제44조의2, 교육부 가이드북 4판 78·124·127쪽."},{"title":"교원이 쓸 수 있는 불복·구제 절차","head":["절차","대상","어디에","기간"],"rows":[["소청심사","징계, 직위해제 등 의사에 반하는 불리한 처분","교육부 교원소청심사위원회","처분을 안 날부터 30일(결정은 접수 후 60일, 30일 연장 가능)"],["행정소송","소청심사 결정","법원","결정서 송달일부터 30일"],["교육활동 침해 신고","무고·협박·명예훼손·반복 부당 민원","학교 → 지역교권보호위원회","발생 즉시 신고"],["행정심판·행정소송","지역교권보호위원회의 '침해 아님' 결정","교육청 행정심판위원회 / 법원","안 날부터 90일·있었던 날부터 180일(행정심판) / 안 날부터 90일·있은 날부터 1년(행정소송)"]],"note":"교원지위법 제9조·제10조·제19조·제28조, 행정심판법 제27조, 행정소송법 제20조, 교육활동 보호 매뉴얼(2026) 59~61·155쪽."}],"faq":[{"q":"교육감 의견서는 제가 신청해야 나가나요?","a":"조사·수사기관이 교원 대상 신고 사안을 교육지원청에 공유하면 교육지원청이 확인하고 교육감이 7일 안에 의견을 낸다. 공유를 기다리지 말고 학교장 보고와 교육지원청(1395) 연락을 먼저 해 두는 것이 좋다."},{"q":"신고된 내용을 몰라서 소명 자료를 준비할 수가 없어요.","a":"수사기관에 정보공개청구(open.go.kr)로 신고 사안을 확인할 수 있고, 자료를 교육지원청에 내 교육활동 확인서 작성에 협조할 수 있다."},{"q":"신고만으로 직위해제되나요?","a":"아니다. 교원지위법 제6조제3항은 정당한 사유 없는 직위해제를 금지한다. 교육공무원법상 직위해제는 기소되었거나, 비위가 중대하고 정상 업무를 기대하기 어려운 경우 등으로 한정된다. 직위해제를 받으면 30일 안에 소청심사를 청구할 수 있다."},{"q":"학부모가 교사의 학대를 주장하면 어떻게 해야 하나요?","a":"교육부 가이드북 Q&A는 학부모가 교사의 학대를 호소하거나 민원을 제기하는 것만으로 신고의무가 생긴다고 보기는 어렵고, 여러 정보를 종합해 아동학대가 의심되면 신고해야 한다고 안내한다. 신고의무자는 직무 중 아동학대범죄를 알게 되거나 의심이 있으면 시·도, 시·군·구 또는 수사기관에 즉시 신고해야 한다(아동학대처벌법 제10조제2항)."},{"q":"변호사 비용은 어떻게 하나요?","a":"교육청 법률지원단에서 법률 상담을 받고, 교원보호공제로 민·형사 소송비용을 청구할 수 있다. 표준약관은 형사사건 수사단계 1인당 330만원, 수사단계 포함 형사소송 1인당 660만원 등 한도를 두며 유죄 확정 시 지원하지 않는다. 시도별 약관이 다를 수 있다."},{"q":"벌금형을 받으면 교사를 그만둬야 하나요?","a":"법원이 취업제한명령을 함께 선고하지 않으면 그것만으로 직에서 물러나지는 않는다. 다만 미성년자 대상 성범죄 등은 당연퇴직 사유이고, 형사처벌과 별도로 징계를 받을 수 있다(교육부 가이드북 Q&A)."},{"q":"무혐의가 나왔어요. 신고한 학부모에게 대응할 수 있나요?","a":"허위 신고로 교사를 형사처분받게 할 목적이었다면 무고로 교육활동 침해행위에 해당할 수 있다. 지역교권보호위원회에 올리거나 고소를 검토할 수 있다. 다만 무고가 성립하는지는 수사기관이 판단한다."}],"record":"교사 개인 기록은 사실 중심으로 남긴다(날짜·시간·말 그대로). 학교가 보유한 학생 관련 공문서·시스템 자료는 수사기관의 적법한 자료제출 요구가 있어야 기관 명의로 낼 수 있다(교육활동 보호 매뉴얼 78쪽 취지).","sources":[{"title":"교육활동 보호 매뉴얼 2026년도 일부 개정 (수탁연구자료 CRM 2026-09, 발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://www.jne.go.kr/upload/thsupport/na/bbs_339/ntt_5170000/doc_57389173-2d62-4eb9-a118-4547e343a6ab1772a7724b93123.pdf"},{"title":"아동학대 예방 및 대처요령 교육부문 가이드북 4판 (발행 2024.12.)","publisher":"교육부","year":2024,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/AC1D0C24-4393-F719-8DFF-64E35865C917.pdf"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 (시행 2026.2.19.) 및 시행령 (시행 2025.9.19.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"아동학대범죄의 처벌 등에 관한 특례법 (시행 2026.8.4.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동학대범죄의처벌등에관한특례법"},{"title":"초·중등교육법 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"교육공무원법 (시행 2026.2.15.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교육공무원법"},{"title":"형사소송법 (현행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/형사소송법"}],"verified":"2026-09-24","uncertain":["시·도별 교원보호공제 약관의 실제 보장 한도는 확인하지 못했다. 표준약관(최소 보장 범위) 수치만 적었다","'학부모와 직접 접촉·개인 합의를 삼가라'는 공식 매뉴얼의 명시 문구가 아니라, 분쟁조정·교육감 의견 제출 절차를 거치라는 매뉴얼 취지에서 끌어낸 실무 권고다","지자체의 '아동학대 사례' 판단 결과에 교사가 이의를 제기하는 별도 절차가 있는지는 법령·매뉴얼에서 확인하지 못했다","시·도교육청별로 따로 운영하는 교원 대상 아동학대 신고 대응 세부 지침(담당 부서·서식)이 있을 수 있다(가이드북: 시도교육청별 세부 지침이 있으면 그에 따름) — 소속 교육청 기준 확인","아동학대범죄가 아닌 일반 형사 혐의로 수사되는 경우 경찰 불송치(형사소송법 제245조의5제2호)와 이의신청 절차가 적용되는지는 원문 확인 필요","국공립 교원이 소청심사 결정 뒤 원처분을 다투는 행정소송의 제소기간이 교원지위법 제10조제4항(결정서 송달 후 30일)인지 행정소송법 제20조에 따르는지는 원문(판례) 확인 필요 — 안전하게 30일 안에 준비할 것","사립학교 교원의 직위해제·징계 근거 조문(사립학교법)은 이번에 확인하지 않았다. 소청심사 절차(교원지위법 제9조)는 국공립·사립 모두 해당"],"related":["teacher-rights","student-guidance","malicious-complaint"]},{"id":"malicious-complaint","title":"악성(특이) 민원 대응","aka":["악성 민원","특이민원","학부모 민원","밤늦게 전화","개인 번호로 연락","카톡 민원","반복 민원","담임 교체 요구","폭언 전화","학교 찾아와요","민원대응팀","통화 녹음","면담 거절","국민신문고 반복","갑질 학부모"],"category":"교원 보호","urgency":"당일","roles":["민원을 받은 교사","교장","교감","행정실장","학교 민원대응팀","교육지원청 학교민원대응지원팀","지역교권보호위원회"],"summary":"교육부·한국교육개발원 2026 학교민원 처리 매뉴얼은 학교장 총괄, 공식 창구 단일화, 민원대응팀의 접수·분류·배분을 안내한다. 다만 학교에 민원대응팀을 두도록 한 초·중등교육법 개정 조항은 2026.10.29. 시행 예정이므로 기준일 현재는 시행 전이다. 폭언·폭행·스토킹·부당 반복 요구 등 특이민원은 안전을 확보하고 관리자에게 넘긴다. 학교가 감당하기 어려우면 교육(지원)청 지원을 요청하고, 교원 대상 행위가 교육활동 침해에 해당하면 별도 교권보호 절차를 진행한다.","first":["폭언·협박·성희롱이 시작되면 사유를 알리고 통화·면담을 끝낸다","혼자 상대하지 말고 교감·교장(민원대응팀)에게 즉시 보고해 넘긴다","개인 휴대전화·SNS로 온 민원에는 답하지 말고 학교 대표번호·공식 창구로 안내한다","통화·면담 내용, 문자, 날짜·시간을 기록하고 녹음 파일을 보관한다","위협이 있으면 112에 신고하고, 교육활동 침해면 소속 시·도 지역번호+1395·교육지원청에 신고한다"],"steps":[{"stage":"알게 됨·신고","when":"평소(학년 초)","who":"학교장·민원대응팀","what":"민원 창구 단일화·녹음 전화·민원상담실 준비와 안내","detail":"학교 대표번호·온라인 시스템을 공식 창구로 정하고(교직원 개인 연락처는 창구에 포함 불가) 연 1회 이상 학부모 총회·가정통신문·홈페이지로 안내한다. 녹음 고지와 상호 존중 당부가 담긴 통화연결음, 녹음 전화, CCTV·비상벨을 갖춘 민원상담실을 마련한다.","basis":"초·중등교육법 제30조의10제3항; 민원처리법 시행령 제4조제1항; 학교민원 처리 매뉴얼(2026) 9~10·28~30쪽"},{"stage":"알게 됨·신고","when":"민원 접수","who":"민원대응팀","what":"공식 창구 접수와 분류·배분","detail":"단순 질의는 민원대응팀이 바로 처리, 학생 상담은 담임, 사실 확인이 필요한 건 담당자 협조, 이해관계가 복잡하고 교육활동 침해 가능성이 큰 민원은 학교장 총괄. 대표번호로 온 전화를 담당 교사에게 바로 돌려 연결하지 않는다. 공식 창구 밖으로 온 민원은 창구를 안내한다.","basis":"매뉴얼 10·28쪽"},{"stage":"초기 대응","when":"상담·면담 요청","who":"민원대응팀·담당 교사","what":"사전 예약·지정 장소·업무시간","detail":"유선·방문 민원은 사전 예약 일정에만 진행. 전화는 학교 업무전화로, 방문은 민원상담실 등 지정 장소에서. 필요하면 민원대응팀이 동석한다. 수업 중 요청이 와도 교육활동이 끝난 뒤 처리한다(긴급하면 관리자가 먼저 처리).","basis":"매뉴얼 6·11쪽"},{"stage":"초기 대응","when":"예약 없이 찾아왔을 때","who":"민원대응팀","what":"우선 면담 또는 예약 안내","detail":"담당 교사가 수업 중이거나 없으면 민원대응팀이 먼저 면담한다. 특이민원이면 교장·교감이 면담하고 필요하면 담당자가 배석한다. 교실로 민원인을 들이는 것은 되도록 피한다.","basis":"매뉴얼 11·22쪽"},{"stage":"초기 대응","when":"응대 중 특이민원 발생","who":"민원을 받은 교직원","what":"즉시 응대 중단과 관리자 보고","detail":"폭언·폭력·스토킹·부당요구가 생기면 바로 멈추고 관리자(민원대응팀)에게 보고해 기관 차원으로 넘긴다. 감정적으로 맞대응하지 않고, 녹음·녹화 → 진정 요청과 법령 위반 경고 → 퇴거 요청·경찰 신고 순으로 대응한다. 전화·면담 종료 전에는 사유를 민원인에게 알린다.","basis":"민원처리법 시행령 제4조제1항제8호; 매뉴얼 11·19~20쪽"},{"stage":"초기 대응","when":"특이민원 발생 직후","who":"학교장","what":"피해 교직원 분리와 민원인 조치","detail":"피해 교직원을 공간적(대면 제한, 일시 출입 제한)·업무적(통화 제한, 대체 담당자 지정)으로 분리하고, 필요하면 휴게시간을 줄 수 있다. 피해가 크거나 반복되면 근무 위치 변경·업무 조정도 한다. 민원인에게는 출입 제한·퇴거 조치, 학교민원 창구 이용 제한을 하고, 불응하면 경찰에 신고한다.","basis":"민원처리법 시행령 제4조제1항제3호·제4호; 매뉴얼 20·23·35쪽"},{"stage":"초기 대응","when":"범죄 행위 현장","who":"피해 교직원·학교","what":"현행범 신고와 증거·증인 확보","detail":"피해 교직원은 수사기관에 현행범으로 신고할 수 있다. 학교는 현장 증거와 목격자를 확보하고 경위를 학교장에게 보고한다.","basis":"매뉴얼 19·23쪽"},{"stage":"조사·확인","when":"사안 정리","who":"피해 교직원·민원대응팀","what":"경위 기록과 증거 정리","detail":"통화·면담 녹음, 문자·메신저, 방문 일시, 요구 내용, 목격자를 정리한다. 녹음 파일은 기관 개인정보처리방침에 따라 보유기간을 정해 관리하고 목적 외로 쓰지 않는다.","basis":"매뉴얼 21·29쪽"},{"stage":"심의·결정","when":"같은 민원이 반복될 때","who":"학교장(민원대응팀)","what":"반복 민원 종결 처리","detail":"정당한 사유 없이 같은 내용을 3회 이상 반복하면 2회 이상 처리결과를 통지한 뒤 이후 민원은 종결할 수 있다. 권한 밖이거나 이행 불가능한 요구, 사생활 등 민원과 무관한 사항, 요지 불명, 교직원 개인 휴대전화·SNS로 제기한 민원, 인사행정 관련 사항 등도 거부·종결할 수 있다. 처리하지 않을 때는 사유를 통지한다.","basis":"민원처리법 제21조·제23조; 매뉴얼 6~7·12쪽"},{"stage":"심의·결정","when":"학교에서 해결이 어려울 때","who":"학교장","what":"교육(지원)청 지원 요청·이첩","detail":"3회 이상 같은 민원으로 종결했는데도 계속 요구하거나 위력을 쓰는 경우, 퇴거명령·민원 제한에 불응하고 계속 민원을 넣는 경우, 처벌 가능한 중대 위법, 분쟁조정·법률지원 뒤에도 해결이 안 되는 경우 등은 '특이민원 관련 지원 요청 보고서'로 학교민원대응지원팀에 지원 요청·이첩한다. 이첩 뒤에도 학교는 협조한다.","basis":"매뉴얼 12·23쪽"},{"stage":"심의·결정","when":"이첩 후","who":"교육(지원)청 학교민원대응지원팀","what":"처리 지원","detail":"학교 방문·유선 협의로 사안을 파악해 해결 방안을 협의하고, 필요하면 보호자·학생과 면담하며, 당사자가 원하면 변호사 등을 지원해 분쟁조정을 한다. 국민신문고 등으로 같은 민원이 계속 오면 교육(지원)청이 국민권익위원회 등에 이용 제한을 요청한다.","basis":"매뉴얼 13·22쪽"},{"stage":"심의·결정","when":"교원 대상 특이민원이 교육활동 침해에 해당할 때","who":"피해교원·학교장","what":"교육활동 침해로 신고 → 지역교권보호위원회","detail":"목적이 정당하지 않은 반복 민원, 법적 의무가 아닌 일의 지속 강요(사적 부탁, 고의·중과실 없는 사안에서 교사 개인에게 배상 요구 등), 정당한 교육활동에 대한 반복적 부당 간섭(근거 없는 담임 교체 반복 요구, 평가·과제·생활지도 과도 간섭), 성적 언동, 교원 음성·영상 무단 배포 등. 24시간 이내 교육지원청 보고 등 교육활동 침해 절차를 따른다.","basis":"교원지위법 제19조·제20조; 교육활동 침해 행위 및 조치 기준에 관한 고시 제2조; 매뉴얼 17~19쪽; 교육활동 보호 매뉴얼(2026) 38쪽"},{"stage":"조치·이행","when":"위원회 결정 후","who":"교육장","what":"보호자 등 조치","detail":"서면사과·재발방지 서약, 또는 교육감이 정하는 기관에서 특별교육·심리치료. 요청받은 날부터 14일 안에 조치한다. 특별교육·심리치료를 정당한 사유 없이 안 받으면 300만원 이하 과태료.","basis":"교원지위법 제26조·제35조"},{"stage":"조치·이행","when":"범죄에 해당할 때","who":"피해교직원·교육(지원)청","what":"고소·고발 등 법적 조치","detail":"피해 교직원은 직접 고소할 수 있고(친고죄는 본인 고소 필요), 교육감은 고발할 수 있다. 피해 교직원이 아니어도 학교장·동료가 고발할 수 있다. 법적 조치 여부는 교육(지원)청 기관장이 최종 결정하고(교육(지원)청 업무분장에 따라 달리 운영될 수 있음), 담당 부서가 고발인 조사 출석, 피해 교직원 인적사항 비공개·단독조사 요청, 증거 제출을 지원한다.","basis":"교원지위법 제20조제4항; 민원처리법 시행령 제4조제1항제5호의2·제5호의3·제6호; 매뉴얼 19·23~24쪽"},{"stage":"조치·이행","when":"피해 이후","who":"학교장·교육활동보호센터","what":"회복 지원","detail":"심리상담·치료 지원, 6일 이내 단순 안정이면 학교장이 공무상 병가 승인 가능. 교육활동 침해 피해는 교육활동보호센터 심리상담·치유 프로그램 연계. 교원보호공제로 분쟁·소송 비용을 청구하고, 교원이 위협을 받는 경우 보호서비스를 신청할 수 있다(공제금 청구권은 지급 사유 발생일부터 3년, 세부는 시·도 약관).","basis":"민원처리법 시행령 제4조제1항제5호; 교원지위법 제22조; 매뉴얼 35~36쪽"},{"stage":"불복·구제","when":"보호자 조치 처분을 안 날부터 90일 이내","who":"조치를 받은 보호자 등","what":"행정심판·행정소송","detail":"교육장 조치에 대해 교육청 행정심판위원회에 행정심판(안 날부터 90일, 있었던 날부터 180일) 또는 교육장을 피고로 행정소송(안 날부터 90일, 있은 날부터 1년)을 낼 수 있다. 청구해도 조치는 멈추지 않는다(집행정지 결정 필요).","basis":"행정심판법 제27조·제30조; 행정소송법 제20조·제23조; 교육활동 보호 매뉴얼(2026) 59~61쪽"},{"stage":"불복·구제","when":"위원회가 '침해 아님'으로 결정했을 때","who":"피해교원","what":"행정심판·행정소송","detail":"교원도 '교육활동 침해사안 아님' 결정에 같은 기간 안에 행정심판·행정소송을 낼 수 있다.","basis":"교육활동 보호 매뉴얼(2026) 59~60쪽"},{"stage":"불복·구제","when":"과태료 부과 통지를 받은 날부터 60일 이내","who":"과태료를 받은 보호자 등","what":"과태료 이의제기","detail":"교육청에 서면으로 이의제기하면 부과처분은 효력을 잃고, 교육청은 이의제기를 받은 날부터 14일 안에 관할 법원에 통보한다(이의제기를 철회했거나 이의가 이유 있어 과태료를 부과할 필요가 없다고 인정되면 통보하지 않음). 그 뒤는 법원 과태료 재판으로 정해진다.","basis":"질서위반행위규제법 제20조·제21조"},{"stage":"종결·사후","when":"민원인이 교사 징계 등을 요구할 때","who":"학교장","what":"정당한 응대에 대한 불이익 금지","detail":"특이민원 종료·분리, 권장시간 준수, 부당 요구 거절 같은 정당한 응대에 불만을 품고 징계 등을 요구해도 피해 교직원에게 불이익을 주면 안 된다. 인사상 조치를 검토할 때는 발생 경위를 충분히 고려해야 한다.","basis":"민원처리법 시행령 제4조제3항; 학교민원 처리 매뉴얼(2026) 35쪽"},{"stage":"종결·사후","when":"사안 종결 후","who":"학교","what":"재발 방지","detail":"보호자·외부인의 특이민원에는 일시적 출입·면담 제한, 예약 면담, 관리자 면담, 서면·온라인 창구 전환 등으로 피해 교직원과의 접촉을 막는다.","basis":"매뉴얼 22·37쪽"}],"deadlines":[{"what":"민원 처리 기한(예시안)","limit":"단순민원 즉시 / 복합민원 7일 이내 / 관리자 총괄 민원 14일(연장 가능)","basis":"학교민원 처리 매뉴얼(2026) 11쪽"},{"what":"질의민원 처리기간(법정)","limit":"법령 해석 요구 14일 이내, 제도·절차 등 7일 이내","basis":"민원처리법 시행령 제14조"},{"what":"상담·면담 권장 시간(예시)","limit":"20분 — 정당한 사유 없이 넘기면 종결 가능","basis":"매뉴얼 7쪽; 민원처리법 시행령 제4조제1항제7호·제8호"},{"what":"반복 민원 종결","limit":"같은 내용 3회 이상 반복 시 2회 이상 결과 통지 후 종결 가능","basis":"민원처리법 제23조"},{"what":"교육활동 침해로 신고 시 교육지원청 보고","limit":"사안 접수부터 24시간 이내","basis":"교육활동 보호 매뉴얼(2026) 38쪽"},{"what":"보호자 조치","limit":"위원회 요청을 받은 날부터 14일 이내","basis":"교원지위법 제26조제4항"},{"what":"행정심판 / 행정소송","limit":"안 날부터 90일(행정심판은 있었던 날부터 180일, 소송은 1년)","basis":"행정심판법 제27조; 행정소송법 제20조"},{"what":"과태료 이의제기","limit":"부과 통지를 받은 날부터 60일 이내","basis":"질서위반행위규제법 제20조"},{"what":"교원보호공제 공제금 청구","limit":"지급 사유 발생일부터 3년 이내","basis":"매뉴얼 36쪽"}],"dont":["개인 휴대전화 번호를 알려주거나, 밤·주말에 개인 번호·SNS로 온 민원에 답하지 않는다 — 공식 창구 외 민원은 거부·종결할 수 있다","폭언이 오가는데 혼자 끝까지 들어주지 않는다 — 사유를 알리고 종료한 뒤 관리자에게 넘긴다","감정적으로 맞받아치거나 개인 의견·훈계로 언쟁하지 않는다 — 규정에 따라 원칙대로","녹음 파일을 단체방·SNS에 올리거나 목적 외로 쓰지 않는다 — 개인정보로 관리","교실로 민원인을 들이는 것은 되도록 피한다 — 상담은 민원상담실, 교무실 또는 안전장비가 있는 개방된 공간에서","'내 반 일이니 내가 해결한다'며 보고 없이 사과·약속을 하지 않는다 — 학교민원 처리 책임자는 학교장","대표번호로 온 항의 전화를 담임에게 바로 돌려 주지 않는다 — 민원대응팀이 먼저 받고 필요하면 담당자가 나중에 회신"],"contacts":[{"name":"교육활동보호 대표번호","tel":"소속 시·도 지역번호+1395","note":"교육활동 침해 신고, 학교 민원 응대 매뉴얼 안내, 법률·심리 상담 연계"},{"name":"시·도교육청 교육활동보호센터","tel":"","note":"시·도별 대표전화는 교육활동 보호 매뉴얼(2026) 75~76쪽 표(2026.1. 기준) 또는 소속 교육청 누리집에서 확인"},{"name":"경찰","tel":"112","note":"폭행·흉기·퇴거 불응·스토킹 등"},{"name":"교육(지원)청 학교민원대응지원팀","tel":"","note":"관할 교육(지원)청에 문의. 옛 명칭 '통합민원팀'"}],"forms":["특이민원 관련 지원 요청 보고서 — 학교민원 처리 매뉴얼(2026) 부록","민원 응대 기록(일시·경로·내용·조치)과 녹음·녹화 파일","교육활동 침해 사안신고서 — 교육활동 보호 매뉴얼 서식1(교육활동 침해로 올릴 때)","학교 민원 창구·처리 절차 안내문(가정통신문·홈페이지 게시용)","민원상담실 녹음·녹화 사전 고지문"],"law":[{"name":"초·중등교육법","article":"제20조제1항(교직원의 임무)","point":"교장은 교무를 총괄하고 민원처리를 책임진다"},{"name":"초·중등교육법","article":"제30조의10(학교민원 처리 계획)","point":"교육부 학교민원 처리 계획, 교육감 지원계획(민원 처리 교직원 보호 포함), 학교장은 민원 처리 방법·절차를 학생·보호자에게 정기 안내"},{"name":"초·중등교육법","article":"제20조의3(교원 개인정보 보호)","point":"학교와 학교장은 교원의 전화번호 등 개인정보가 보호되도록 필요한 조치를 해야 한다"},{"name":"민원 처리에 관한 법률","article":"제4조·제5조","point":"기관장은 폭언·폭행·부당 반복 민원으로부터 담당자를 보호할 조치를 해야 하고, 담당자의 보호 요구를 이유로 불이익을 주면 안 된다. 민원인은 부당한 요구나 공무방해를 하면 안 된다"},{"name":"민원 처리에 관한 법률","article":"제21조·제23조","point":"사인 간 권리관계·사생활, 인사행정 사항 등은 처리하지 않을 수 있고(사유 통지), 같은 민원 3회 이상 반복 시 2회 이상 통지 후 종결 가능"},{"name":"민원 처리에 관한 법률 시행령","article":"제4조제1항·제3항","point":"안전장비·녹음전화, 퇴거·일시 출입 제한, 담당자 분리·업무 일시 중단, 치료·상담, 고발·고소 지원, 증거 제출 지원, 권장 통화·면담 시간, 폭언·권장시간 초과 시 사유 고지 후 종료. 인사상 불이익 검토 시 경위 고려"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제19조제2호·제26조","point":"목적이 정당하지 않은 반복 민원, 법적 의무가 아닌 일의 지속 강요는 교육활동 침해행위. 보호자 등에게 서면사과·재발방지 서약, 특별교육·심리치료 조치"},{"name":"초·중등교육법","article":"제18조의6(보호자의 의무)","point":"보호자는 교직원 인권 침해 금지, 생활지도 존중, 교원의 전문적 판단 존중·협력 의무"},{"name":"교원의 학생생활지도에 관한 고시","article":"제10조","point":"사전 합의 없는 상담, 직무 범위를 넘는 상담, 근무시간 외 상담은 거부할 수 있고, 폭언·협박 시 즉시 중단 가능"}],"deep":[{"title":"평소에 해 둘 것: 창구 하나, 녹음, 상담실","body":["학교는 대표번호와 온라인 시스템을 공식 민원 창구로 정하고 교직원 개인 번호는 창구에 넣지 않는다. 이 창구와 처리 절차를 1년에 한 번 이상 학부모 총회, 가정통신문, 홈페이지로 알린다.","학교 전화에는 녹음 사실과 상호 존중을 알리는 통화연결음을 걸고, 상담·민원 전화는 녹음되는 전화기로 받는 것이 원칙이다. 민원상담실에는 녹음·녹화 장치, CCTV, 비상벨을 두고 녹음 안내문을 붙인다. 상담실은 교무실 가까이 두어 급할 때 바로 도울 수 있게 한다."],"basis":"초·중등교육법 제30조의10; 민원처리법 시행령 제4조; 학교민원 처리 매뉴얼(2026) 9~10·28~30쪽"},{"title":"특이민원이란 무엇인가","body":["특이민원은 폭언·폭행 같은 위법 행위나 정당한 이유 없는 반복 민원처럼 공무방해가 따라오는 민원이다. 흔히 말하는 '악성 민원'과 비슷한 행정 용어다.","위법민원: 욕설·고성·반말 등 폭언, 모욕, 협박, 성희롱, 폭행, 기물 파손, 위험물 소지, 스토킹(원치 않는 반복 접근·연락), 신상공개(SNS에 교사 정보·명예훼손 게시). 부당민원: 위법·부당한 행위 강요, 처리가 끝났는데도 전화·면담을 끌거나 반복 요구.","이 가운데 교원을 상대로 한 것은 교원지위법상 교육활동 침해행위가 될 수 있다."],"basis":"매뉴얼 17~19쪽"},{"title":"그 자리에서: 멈추고, 넘기고, 막는다","body":["응대 중 폭언·폭력·스토킹·부당 요구가 생기면 즉시 멈추고 관리자에게 알린다. 전화나 면담을 끊을 때는 끊는 이유를 먼저 말한다. 녹음·녹화를 하고, 진정을 요청하고 법령 위반을 경고하며, 그래도 계속되면 퇴거를 요청하고 경찰에 신고한다.","녹음은 시작할 때 알리는 것이 원칙이지만, 폭언·폭행이 일어났거나 일어나려는 비상시에는 알리지 않고 해도 된다. 내가 참여한 대화를 녹음하는 것은 통신비밀보호법 위반이 아니다.","학교장은 피해 교직원을 즉시 떼어 놓고(대면·통화 제한, 대체 담당자), 민원인에게 출입 제한·퇴거·창구 이용 제한을 할 수 있다."],"basis":"민원처리법 시행령 제4조제1항; 매뉴얼 19~22·29쪽"},{"title":"학교를 넘어서: 이첩과 교권보호위원회","body":["학교가 감당하기 어려우면 학교장이 '특이민원 관련 지원 요청 보고서'를 써서 교육(지원)청 학교민원대응지원팀(옛 통합민원팀)에 지원을 요청하거나 이첩한다. 교육(지원)청은 학교를 방문하거나 보호자와 직접 면담하고, 원하면 변호사를 붙여 분쟁조정을 돕는다.","교사를 겨냥한 특이민원이 교육활동 침해에 해당하면 교육활동 침해 사안으로 신고한다. 지역교권보호위원회가 심의해 보호자에게 서면사과·재발방지 서약이나 특별교육·심리치료를 요청하고, 교육장이 14일 안에 조치한다. 특별교육을 안 받으면 300만원 이하 과태료다."],"basis":"교원지위법 제19조·제26조·제35조; 매뉴얼 12~13·17~19·23쪽"},{"title":"법적 조치와 불복","body":["범죄에 해당하면 피해 교직원이 직접 고소하거나 교육감이 고발한다. 교육(지원)청 기관장이 법적 조치 여부를 최종 결정하고, 담당 부서가 고발인 조사 출석, 피해 교직원 인적사항 비공개와 단독조사 요청, 증거 제출을 돕는다. 모욕죄 같은 친고죄는 피해자 본인이 고소해야 한다.","보호자는 교육장의 조치에 행정심판(안 날부터 90일)·행정소송을, 과태료에는 60일 안에 이의제기를 할 수 있다. 교원도 위원회의 '침해 아님' 결정에 행정심판·행정소송을 낼 수 있다."],"basis":"교원지위법 제20조제4항; 행정심판법 제27조; 행정소송법 제20조; 질서위반행위규제법 제20조; 매뉴얼 23~24쪽"}],"tables":[{"title":"거부·종결할 수 있는 민원","head":["상황","처리"],"rows":[["교직원 개인 휴대전화·SNS로 제기","거부 또는 종결, 공식 창구 안내"],["정당한 사유 없이 권장 시간(예: 20분) 초과","사유 고지 후 종결"],["욕설·협박·모욕·성희롱 등 폭언","시간과 관계없이 사유 고지 후 종료"],["합리적 답변 뒤에도 같은 내용 3회 이상 반복","2회 이상 처리결과 통지 후 종결"],["권한 밖이거나 이행 불가능한 요구","설명 후 종결 권고"],["교직원 사생활 등 교육활동과 무관한 사항","처리하지 않을 수 있음(사유 통지)"],["학교 소속 직원 인사행정에 관한 사항","처리하지 않을 수 있음(사유 통지)"],["행정심판·소송 등 불복 절차나 조정 절차 진행 중","처리하지 않을 수 있음(사유 통지)"]],"note":"민원처리법 제21조·제23조, 같은 법 시행령 제4조제1항제8호, 학교민원 처리 매뉴얼(2026) 6~7·12·22쪽."},{"title":"교육활동 침해에 해당하는 민원 예","head":["침해 유형","민원 예"],"rows":[["목적이 정당하지 않은 반복 민원","처리가 끝났는데도 교사를 괴롭히거나 특혜를 얻으려고 계속 전화·면담 요구"],["법적 의무가 아닌 일의 지속 강요","사적 부탁, 교사 고의·중과실이 없는 일에 교사 개인에게 손해배상 요구"],["정당한 교육활동에 대한 반복적 부당 간섭","사정이 없는데 담임 교체를 계속 요구, 수행평가·성적 산정·과제·생활지도에 지나친 간섭"],["성적 언동","성적인 내용이 담긴 문자 발송"],["무단 촬영·녹음·배포","교사 영상·음성이나 개인정보를 SNS·인터넷에 공개"]],"note":"교원지위법 제19조, 교육활동 침해 행위 및 조치 기준에 관한 고시 제2조, 학교민원 처리 매뉴얼(2026) 18~19쪽."},{"title":"특이민원 대응 4단계","head":["단계","내용","주관"],"rows":[["1단계 현장 처리","현행범 신고, 증거·증인 확보, 학교장 보고","학교"],["2단계 특이민원 보고","특이민원 관련 지원 요청 보고서 작성·제출","학교 → 교육(지원)청"],["3단계 법적 조치 결정","경위 보고, 기관장이 법적 조치 여부·방안 결정","교육(지원)청"],["4단계 법적 조치","담당 부서 중심으로 고소·고발 등 수사·재판 대응","교육(지원)청"]],"note":"학교민원 처리 매뉴얼(2026) 23쪽."}],"faq":[{"q":"학부모에게 개인 번호를 절대 알려주면 안 되나요?","a":"교직원 개인 연락처는 비공개가 원칙이다. 교사가 원하면 상담용으로 개인 전화를 쓸 수는 있지만, 보호자 개인전화 연락에 응답하지 않을 수 있고 공식 창구 외 민원은 거부·종결할 수 있다."},{"q":"통화를 녹음하려면 상대 동의가 필요한가요?","a":"매뉴얼은 통화연결음이나 면담 시작 때 녹음 사실을 알리고 처음부터 끝까지 녹음할 수 있다고 안내한다. 폭언·폭행이 생겼거나 생기려는 비상시에는 알리지 않고 녹음·녹화할 수 있다. 자신이 참여한 대화 녹음은 통신비밀보호법 위반이 아니다."},{"q":"같은 요구를 계속 반복합니다. 언제까지 답해야 하나요?","a":"같은 내용을 정당한 사유 없이 3회 이상 반복하면 2회 이상 처리결과를 알린 뒤 종결할 수 있다(민원처리법 제23조). 그 뒤에도 계속되거나 위력을 쓰면 교육(지원)청으로 이첩한다."},{"q":"악성 민원도 교권보호위원회에 올릴 수 있나요?","a":"교원을 상대로 한 특이민원이 교원지위법 제19조의 교육활동 침해행위(반복 부당 민원, 법적 의무 아닌 일 강요, 반복 부당 간섭 등)에 해당하면 교육활동 침해로 신고해 지역교권보호위원회 심의를 받을 수 있다."},{"q":"예약 없이 교실로 찾아왔어요.","a":"수업 중이면 응하지 않고 민원대응팀이 먼저 면담하거나 예약을 안내한다. 특이민원이면 교장·교감이 면담한다. 폭언·난동이면 퇴거를 요청하고 불응하면 경찰에 신고한다."},{"q":"학부모가 교사 징계를 요구하는 민원을 넣었습니다.","a":"정당하게 응대(종료·분리·권장시간 준수·부당 요구 거절)한 것을 이유로 한 징계 요구로 불이익을 줄 수 없다. 기관장은 인사상 불이익을 검토할 때 발생 경위를 충분히 고려해야 한다(민원처리법 시행령 제4조제3항)."},{"q":"보호자가 국민신문고로 교육청에 같은 민원을 계속 넣어요.","a":"학교가 정한 방법 외 온라인 민원은 국민신문고로 교육(지원)청에 접수된다. 비정상적으로 같은 민원을 반복해 업무를 심각하게 방해하면 교육(지원)청이 국민권익위원회 등에 이용 제한을 요청할 수 있다."}],"record":"민원 응대 녹음·녹화 파일은 기관 개인정보처리방침에 반영해 보유기간을 정하고 안전하게 관리한다. 교육활동 침해로 신고하면 교육활동 침해 사안 절차(24시간 내 교육지원청 보고 등)를 따른다.","sources":[{"title":"학교민원 처리 매뉴얼 (발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://buseo.sen.go.kr/buseo/bu12/user/bbs/BD_selectBbs.do?q_bbsSn=1266&q_bbsDocNo=20260310154650758"},{"title":"교육활동 보호 매뉴얼 2026년도 일부 개정 (발행 2026.2.)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://www.jne.go.kr/upload/thsupport/na/bbs_339/ntt_5170000/doc_57389173-2d62-4eb9-a118-4547e343a6ab1772a7724b93123.pdf"},{"title":"민원 처리에 관한 법률 및 시행령 (시행령 시행 2026.5.6.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/민원처리에관한법률시행령"},{"title":"초·중등교육법 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 (시행 2026.2.19.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"행정심판법·행정소송법·질서위반행위규제법 (현행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/행정심판법"}],"verified":"2026-09-24","uncertain":["20분 권장 시간, 처리 기한(즉시·7일·14일)은 매뉴얼의 '예시(안)'이다. 학교마다 정한 기준을 따른다","시·도교육청별 학교민원 처리 지원계획(초·중등교육법 제30조의10제2항)과 교육(지원)청 학교민원대응지원팀 연락처는 시·도마다 다르다 — 소속 교육청 기준 확인","기준일(2026.9.24.) 현재 시행 중인 초·중등교육법 제30조의10은 교육부의 학교민원 처리 계획, 교육감의 지원계획, 학교의 정기 안내 의무를 정하고 민원대응팀 설치 의무는 두지 않는다. 개정법(법률 제21580호, 2026.4.28. 공포) 제37조의 민원대응팀 설치 규정은 2026.10.29. 시행 예정이므로 그 전후를 구분해 안내한다. [현행 제30조의10](https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=283903&efYd=20260911)","2024.3. 교육부 '학교 민원 응대 안내자료'는 2026.2. 매뉴얼로 대체된 것으로 보고 이번에는 근거로 쓰지 않았다","학교민원 처리 매뉴얼(2026) 원문 PDF는 서울시교육청 게시판 첨부파일로 받았다(교육부 원게시 URL은 확인하지 못함)"],"related":["teacher-rights","teacher-abuse-accusation"]},{"id":"student-guidance","title":"수업 방해 등 문제행동 생활지도","aka":["수업 방해","떠드는 학생","말 안 들어요","휴대폰 압수","휴대전화 수거","스마트폰 사용","교실 밖으로 내보내기","분리 지도","개별학생교육지원","훈육","훈계","반성문","생활지도 고시","물리적 제지","보호자 상담 요청"],"category":"교원 보호","urgency":"당일","roles":["수업 교사","담임","교감","교장","생활지도(학생부) 담당"],"summary":"교원은 법령과 학칙에 따라 조언·상담·주의·훈육·훈계·보상으로 학생을 지도할 수 있고, 2026년 3월부터는 수업을 계속 방해하는 학생을 일시 분리해 '개별학생교육지원'을 할 수 있다. 체벌(도구·신체로 고통을 주는 방법)은 금지된다. 별도 공간의 개별학생교육지원과 긴급 제지는 각각 법령이 정한 보고·보호자 통지 절차를 따르며, 스마트기기 분리 보관의 구체 기준은 학칙을 확인한다. 계속 불응하면 보호자 인계(가정학습), 징계, 교육활동 침해 처리로 이어질 수 있고, 학생·보호자는 이의제기·재심·행정심판 등 해당 처분에 맞는 절차로 다툴 수 있다.","first":["먼저 말로 주의를 준다(무엇이 문제인지, 멈추라고). 주의 준 횟수를 기억해 둔다","2회 이상 주의에도 계속 방해하거나 고성·폭언으로 수업이 안 되면 교실 안 지정 자리 또는 교실 밖 안전한 공간으로 일시 분리(개별학생교육지원)한다","학생이 자신이나 남을 다치게 할 긴급 상황이면 즉시 제지하고 다른 교직원에게 도움을 청한다 — 고통을 주는 방법은 금지","교실 밖 별도 공간에서 지원했거나 휴대전화 등을 분리 보관했다면 일시·경위를 적어 학교장에게 보고한다","반복되면 보호자 상담을 요청하고, 계속 불응하면 학교장에게 징계나 교육활동 침해 처리를 요청한다"],"steps":[{"stage":"알게 됨·신고","when":"문제행동 발생","who":"수업 교사","what":"조언·주의","detail":"학생 행동의 위험성, 학칙 위반 가능성 등을 짚어 경고한다. 수업 중 스마트기기나 수업에 맞지 않는 물품을 쓰면 주의를 주어 사용을 제한할 수 있다. 주의를 줬는데도 학생이 무시해 인적·물적 피해가 생기면, 사전에 주의를 준 교원은 생활지도 책무를 다한 것으로 본다(고시 제11조제4항).","basis":"생활지도 고시 제9조·제11조"},{"stage":"초기 대응","when":"주의로 안 될 때","who":"수업 교사","what":"훈육(지시·말로 제지·과업 부여)","detail":"금지된 행동은 즉시 말로 멈추게 할 수 있다. 바람직한 행동을 위한 과업이나 지시를 할 수 있으나 인권을 존중하고 법령·학칙 범위 안에서 한다.","basis":"생활지도 고시 제12조제1항~제3항"},{"stage":"초기 대응","when":"수업 중 스마트기기 등을 계속 쓸 때","who":"수업 교사","what":"물품 분리 보관","detail":"2회 이상 주의에도 계속 쓰는 물품, 위험 물품, 학생에게 판매 금지 물품, 학칙으로 정한 스마트기기 등은 학칙에 따라 분리 보관할 수 있다. 보관 뒤 일시·경위를 학교장에게 보고하고, 학교장이 보호자에게 알린다. 반환 시점·방법은 학칙을 따른다.","basis":"초·중등교육법 제20조의5; 생활지도 고시 제12조제5항·제6항"},{"stage":"초기 대응","when":"위험 물품 소지가 의심될 때","who":"교원","what":"소지품 조사","detail":"자신·타인의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 줄 물품을 가졌다고 의심할 합리적 이유가 있을 때 필요한 범위에서만 조사한다.","basis":"생활지도 고시 제12조제4항"},{"stage":"초기 대응","when":"생명·신체 위해, 재산 중대 손해 우려가 있는 긴급 상황","who":"교원","what":"방어·보호를 위한 제지","detail":"피해 대상과 즉시 떼어 놓는 등 행동을 일시적으로 멈추게 하는 방법으로, 위험이 없어질 때까지 필요한 최소한만 한다. 다른 교직원에게 도움을 요청할 수 있다. 도구·신체로 고통을 주는 방법은 금지.","basis":"초·중등교육법 제20조의2제3항·제4항; 시행령 제40조의3제2항"},{"stage":"초기 대응","when":"제지 직후","who":"교원 → 학교장","what":"제지 보고와 보호자 통지","detail":"교원은 학교장에게 지체 없이 보고하고, 학교장은 보호자에게 신속히 알린다(해설서는 알릴 내용으로 일시와 구체적 상황을 든다).","basis":"초·중등교육법 제20조의2제5항; 해설서(2025) 55쪽"},{"stage":"초기 대응","when":"2회 이상 주의에도 반복하거나, 고성·폭언 등으로 수업을 심각하게 방해할 때","who":"수업 교사","what":"개별학생교육지원(일시 분리)","detail":"① 교실 안 지정된 자리 ② 교실 밖 학교 안 안전하고 쾌적한 공간 ③ 실외·학교 밖 수업이면 참여 학생과 떨어진 안전한 공간에서 상담이나 학습지원을 한다. 필요한 최소한으로 쓰고, 다시 수업에 참여할 수 있다고 판단되면 즉시 복귀시킨다. 장소·시간·학습지원 방법 등 세부는 학칙에 따른다.","basis":"초·중등교육법 제20조의4제1항; 시행령 제40조의4; 생활지도 고시 제19조제1항"},{"stage":"초기 대응","when":"별도 공간에서 지원한 뒤","who":"수업 교사 → 학교장","what":"보고와 보호자 통지","detail":"교원은 일시와 경위를 학교장에게 보고하고, 학교장은 보호자에게 알린다.","basis":"초·중등교육법 제20조의4제3항"},{"stage":"조사·확인","when":"문제행동이 이어질 때","who":"담임·교과 교사","what":"학생 상담과 보호자 상담 요청","detail":"상담은 수업시간 외가 원칙. 교원과 보호자는 서로 상담을 요청할 수 있고 명백한 사유가 없으면 응해야 한다. 일시·방법은 학교장이 정한 대로 미리 협의한다. 사전 합의 없는 상담, 직무 범위를 넘는 상담, 근무시간 외 상담은 거부할 수 있고, 폭언·협박 시 즉시 중단하고 교직원에게 도움을 요청할 수 있다. 상담 내용은 제3자에게 누설하지 않는다.","basis":"생활지도 고시 제10조"},{"stage":"조사·확인","when":"정서·행동 문제가 의심될 때","who":"학교장","what":"상담·치료 권고","detail":"학교장은 학교 구성원과 정신건강 전문가 의견을 들어 학생·보호자에게 상담을 권고할 수 있고, 상담 결과에 따라 치료 권고나 상담·학습지원을 할 수 있다. 보호자는 협조해야 한다.","basis":"초·중등교육법 제18조의5"},{"stage":"조치·이행","when":"개선이 없을 때","who":"교원","what":"훈계(성찰 과제 부여)","detail":"사유와 개선 방안을 함께 제시하고, 대안 행동, 성찰하는 글쓰기, 훼손한 시설·물품 원상복구(청소 포함) 과제를 줄 수 있다.","basis":"생활지도 고시 제13조"},{"stage":"조치·이행","when":"분리를 거부하거나 여러 번 해도 계속 방해할 때","who":"학교장","what":"보호자에게 학생 인계 요청 → 가정학습","detail":"학교장이 보호자에게 인계를 요청해 가정학습을 하게 할 수 있고, 가정학습 상황을 점검해야 한다. 이 기간은 출석으로 인정한다.","basis":"초·중등교육법 제20조의4제4항; 생활지도 고시 제19조제2항"},{"stage":"조치·이행","when":"인계 요청이 여러 번 반복될 때","who":"학교장 → 교육감","what":"교육감 지원 요청","detail":"방해의 지속성·심각성, 보호자의 인계 거부 고의성, 가정학습 상황 등을 종합해 교육감에게 지원을 요청할 수 있다. 교육감은 학교장과 협의해 치료·상담·학습지원 프로그램 지원대책을 마련해야 한다.","basis":"초·중등교육법 제20조의4제5항"},{"stage":"심의·결정","when":"지속적으로 불응할 때","who":"교원 → 학교장","what":"징계 요청","detail":"교원은 계속 불응하는 학생의 징계를 학교장에게 요청할 수 있다. 학교장은 학칙에 따라 징계하되, 학생·보호자에게 의견 진술 기회를 주는 등 적정한 절차를 거친다. 징계는 학교 봉사, 사회봉사, 특별교육이수, 출석정지(1회 10일·연간 30일 이내), 퇴학(의무교육 제외)이며, 경중에 따라 단계적으로 적용하고 보호자와 상담할 수 있다.","basis":"생활지도 고시 제16조제2항; 초·중등교육법 제18조; 시행령 제31조"},{"stage":"심의·결정","when":"학생·보호자가 의도적으로 교육활동을 방해할 때","who":"학교장","what":"교육활동 침해 처리","detail":"학생 또는 보호자가 정당한 생활지도·개별학생교육지원에 불응해 의도적으로 교육활동을 방해하면 교육활동 침해행위로 보고 지역교권보호위원회 절차에 올릴 수 있다(교육활동 침해 사안 참고).","basis":"생활지도 고시 제16조제1항; 교육활동 침해 행위 및 조치 기준에 관한 고시 제2조제4호"},{"stage":"불복·구제","when":"생활지도가 부당하다고 할 때","who":"학생·보호자 → 학교장","what":"이의제기","detail":"생활지도·개별학생교육지원이 부당하다고 판단하면 14일 이내 학교장에게 이의를 제기할 수 있고, 학교장은 14일 이내 답한다. 같은 내용을 정당한 사유 없이 반복하면 2회 이상 답한 뒤 거부할 수 있다.","basis":"생활지도 고시 제17조"},{"stage":"불복·구제","when":"퇴학 조치를 받은 날부터 15일 또는 안 날부터 10일 이내","who":"학생·보호자","what":"퇴학 재심 청구","detail":"교육감 소속 시·도학생징계조정위원회에 서면으로 재심을 청구한다. 위원회는 30일 안에 심사·결정해 통보한다. 결정에 이의가 있으면 통보받은 날부터 60일 안에 행정심판을 제기할 수 있다.","basis":"초·중등교육법 제18조의2·제18조의3; 시행령 제31조의2"},{"stage":"불복·구제","when":"행정심판: 안 날부터 90일·처분일부터 180일 / 행정소송: 안 날부터 90일·처분일부터 1년","who":"학생·보호자","what":"퇴학 외 징계에 대한 행정심판·행정소송","detail":"공립학교장의 징계처분은 행정심판(시·도 소속 행정청 처분 → 시·도지사(교육감 포함) 소속 행정심판위원회)이나 행정소송(안 날부터 90일, 있은 날부터 1년)으로 다툴 수 있다. 청구해도 징계는 멈추지 않고, 멈추려면 집행정지 결정이 필요하다.","basis":"행정심판법 제6조제3항·제27조·제30조; 행정소송법 제20조·제23조"},{"stage":"종결·사후","when":"지도 후","who":"담임·교과 교사","what":"기록과 학급 규칙 정비","detail":"분리·물품 보관·제지 보고 기록을 남긴다. 학급담임은 학생·학부모 의견을 들어 학칙 범위에서 학급생활규정을 정할 수 있고(특수교육대상자 학급은 보호자·특수교사 의견 반영 가능), 2025 해설서는 학년 초에 분리 공간과 분리 절차를 구성원과 협의해 체계적으로 지도하도록 안내한다.","basis":"생활지도 고시 제12조제7항; 해설서(2025) 57쪽"},{"stage":"종결·사후","when":"2026.8.31 기한 경과 — 현재 학칙 확인","who":"학교장","what":"학칙 정비 여부 확인","detail":"2026 개정 고시가 학칙에 맡긴 사항(스마트기기 사용·소지 제한 기준, 물품 분리보관, 개별학생교육지원 장소·시간·학습지원 방법 등)은 부칙상 학칙에 반영될 때까지 한시적으로 학교장이 정하는 바에 따라 시행할 수 있으나, 학교장은 2026년 8월 31일까지 학칙으로 정해야 했다. 기한이 지났으므로 현행 학칙에 반영됐는지 확인하고, 미반영이면 학교 절차로 정비한다.","basis":"생활지도 고시 부칙(제2026-3호) 제2조"}],"deadlines":[{"what":"방어·보호 제지 후 학교장 보고","limit":"지체 없이(학교장은 보호자에게 신속히 통지)","basis":"초·중등교육법 제20조의2제5항"},{"what":"학생·보호자의 생활지도 이의제기","limit":"14일 이내","basis":"생활지도 고시 제17조제1항"},{"what":"학교장의 이의제기 답변","limit":"14일 이내","basis":"생활지도 고시 제17조제2항"},{"what":"출석정지 징계 한도","limit":"1회 10일 이내, 연간 30일 이내","basis":"초·중등교육법 시행령 제31조제1항제4호"},{"what":"퇴학 재심 청구","limit":"퇴학 조치를 받은 날부터 15일 또는 안 날부터 10일 이내","basis":"초·중등교육법 제18조의2제1항"},{"what":"징계조정위원회 결정","limit":"재심청구를 받은 날부터 30일 이내","basis":"초·중등교육법 제18조의2제2항"},{"what":"재심 결정에 대한 행정심판","limit":"통보받은 날부터 60일 이내","basis":"초·중등교육법 제18조의2제3항"},{"what":"그 밖의 징계 행정심판","limit":"처분을 안 날부터 90일, 있었던 날부터 180일","basis":"행정심판법 제27조"},{"what":"2026 고시 위임사항 학칙 반영 기한","limit":"2026년 8월 31일(현재 경과 — 미반영 여부는 소속 학교 학칙 확인)","basis":"생활지도 고시 부칙(제2026-3호) 제2조"}],"dont":["도구나 신체를 이용해 학생 신체에 고통을 주는 방법을 쓰지 않는다 — 시행령 제40조의3이 생활지도와 제지 모두에서 명시적으로 금지","학생을 복도에 내보내고 혼자 방치하지 않는다 — 분리는 '상담·학습지원'이어야 하고 안전한 공간이어야 한다(무더위에 복도로 내보내 오래 방치한 교사가 방임 등으로 벌금형을 받은 판례가 해설서에 실려 있다: 대구지법 2018고단1137)","별도 공간으로 분리하거나 휴대전화를 분리 보관하고 보고를 빠뜨리지 않는다 — 학교장 보고, 보호자 통지까지가 절차다","학칙에 근거 없이 물품을 압수하거나 보관 기간을 마음대로 정하지 않는다","사전 약속 없이 근무시간 외에 개인 전화로 보호자 상담을 이어가지 않는다 — 거부할 수 있다","다른 학생들 앞에서 사생활을 들춰 조언하지 않는다 — 사생활에 관한 조언은 비공개가 원칙","교사가 혼자 '집에 보내겠다'고 정하지 않는다 — 보호자 인계·가정학습은 학교장이 요청하는 절차다"],"contacts":[{"name":"교육활동보호 대표번호","tel":"지역번호+1395","note":"소속 시·도교육청 교육활동보호센터로 연결. 지도 불응이 교육활동 침해로 번질 때"},{"name":"경찰","tel":"112","note":"흉기 등 긴급 위험 상황"}],"forms":["개별학생교육지원 기록(일시·경위·장소·지원 내용) — 학교장 보고용, 학교 서식","물품 분리보관 기록(일시·경위·물품·반환) — 학교장 보고용","방어·보호 제지 보고(일시·상황·조치)","가정학습 점검 기록(보호자 인계 시)","이의제기서·답변서(고시 제17조)","퇴학 재심청구서(청구인 이름·주소·연락처, 피청구인, 퇴학 안 날, 청구 취지·이유 — 시행령 제31조의2)","학교 생활규정(학칙)·학급생활규정"],"law":[{"name":"초·중등교육법","article":"제20조의2(학교의 장 및 교원의 학생생활지도)","point":"법령·학칙에 따라 학생 지도. 긴급 상황에서 방어·보호 제지 가능(최소한도, 도움 요청 가능, 학교장 보고·보호자 통지). 제3항~제6항은 2026.3.1. 학년도부터 시행"},{"name":"초·중등교육법","article":"제20조의4(개별학생교육지원)","point":"수업이 불가능할 정도로 방해하면 일시 분리해 개별 교육지원. 별도 공간 사용 시 학교장 보고·보호자 통지. 거부·지속 방해 시 보호자 인계 후 가정학습, 반복
