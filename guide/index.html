위생법","article":"제101조 제1항 제2호","point":"제86조 제1항 위반 시 1천만원 이하 과태료"},{"name":"식품위생법","article":"제88조 제2항 제2호","point":"조리·제공한 식품 매회 1인분을 144시간 이상 보관"},{"name":"식품위생법 시행규칙","article":"제95조 제1항","point":"보존식은 섭씨 영하 18도 이하로 보관"},{"name":"학교안전사고 예방 및 보상에 관한 법률 시행령","article":"제3조 제1호","point":"학교급식이나 가스 등에 의한 중독은 학교안전사고에 해당하는 질병"},{"name":"감염병의 예방 및 관리에 관한 법률 시행규칙","article":"제8조 제1항(법 제12조 제1항 제2호)","point":"학교의 관리인·경영자 또는 대표자는 장티푸스·세균성이질·장출혈성대장균감염증·A형간염 등이 발생하면 의사 진단을 요구하거나 관할 보건소장에게 신고"}],"faq":[{"q":"몇 명부터 신고하나요?","a":"집단급식소 운영자는 급식으로 인한 환자 또는 의심자를 한 명이라도 발견하면 식품위생법 제86조에 따라 관할 시·군·구에 지체 없이 보고해야 한다. 제6차 지침서는 동일 원인으로 추정되는 유사 증세가 2명 이상 동시에 발생한 학교 상황은 교육청과 시·군·구(보건소)에 즉시 보고하도록 안내한다. 두 기준을 혼동해 법정 보고를 미루면 안 된다."},{"q":"급식은 바로 중단해야 하나요?","a":"중단 여부는 원인 파악과 확산 방지를 위해 방역당국과 협의해 학교장이 결정한다. 중단하면 대체급식과 저소득층 급식 지원을 마련하고 가정에 안내한다."},{"q":"보존식은 얼마나 두나요?","a":"배식 직전 조리·제공한 음식을 종류별로 1인분씩 소독한 전용용기나 멸균봉투(일반 지퍼백 허용)에 담아 -18℃ 이하에서 144시간(6일) 이상 냉동 보관한다. 150g은 법정 최소량이 아니며, 분석 시료량을 고려해 가급적 그 이상 담는 것이 바람직하다. 포장 그대로 제공하는 가공완제품은 개봉하지 않은 상태로 보관한다."},{"q":"치료비는 누가 내나요?","a":"급식 등 학교장 관리 업무가 직접 원인인 중독은 학교안전사고로 학교안전공제 대상이다(시행령 제3조). 원인이 납품·위탁업체로 밝혀지면 계약과 민·형사 책임을 따진다."},{"q":"수학여행 중 식중독이면요?","a":"현장체험학습 중 학생이 식중독 의심 증세를 보이면 즉시 응급상태를 확인해 필요한 치료를 받고 학교장에게 보고한다. 급식·집단급식소에서 제공한 음식이 원인으로 의심되면 운영자의 식품위생법 제86조 보고 의무는 2명 이상 발생을 기다리는 규정이 아니다. 인솔자·학교의 교육청 보고 및 지역 대응 순서는 소속 교육청 최신 매뉴얼을 따른다."}],"deep":[{"title":"처음 두 시간 — 세는 법이 결과를 바꾼다","body":["제6차 지침서는 담임을 통한 1차 예비조사에서 손들기나 주말 단체문자 같은 부적절한 방법을 금지한다. 보건실 방문 학생은 평일 수준 및 증상을 비교하고, 추가 확인은 관계기관 협의에 따라 진행한다.","같은 원인으로 추정되는 유사 증세가 2명 이상 동시에 발생하면 학교는 교육청과 시·군·구(보건소)에 즉시 보고한다. 이 운영 기준과 별도로 식품위생법 제86조는 집단급식소에서 급식 관련 환자·의심자를 발견한 운영자에게 지체 없는 보고를 요구하므로 2명이 될 때까지 기다리지 않는다."],"basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 감시체계·표2; 식품위생법 제86조"},{"title":"역학조사 — 학교가 준비할 것","body":["학교는 보존식과 현장을 보존하고, 식단표·식재료 납품업체 자료를 준비한다. 보건당국이 시행하는 환자·대조군 설문과 검체 채취, 환경검체 수거에 협조한다.","학교가 손들기·단체문자로 자체 조사하지 않는다. 보건소가 요청하면 환자를 한 장소에 모아 채변·설문 역학조사에 협조한다(학교 감염병 매뉴얼 제3차 개정판 수인성 감염병 시나리오). 조사 방식과 학생 접촉은 관계기관 협의에 따른다.","발생 상황과 조사자료는 관계기관에 정확히 제공하고, 문의 대응은 방역당국과 조율한다."],"basis":"학교급식 위생관리 지침서 제6차 개정본 표2 1·4단계; 학교 감염병 예방·위기대응 매뉴얼 제3차 개정판 수인성 감염병 시나리오(보건소 역할)"},{"title":"급식 재개와 종결","body":["단순 식중독: 원인이 제거되고 재발 요인이 없다고 판단되면 급식실·기구 청소·소독, 조리기기 점검, 조리종사자 교육 후 재개하고 HACCP 관리를 강화한다.","세균성이질 등 수인성·식품매개 감염병: 학생 유행이 없고 위생 환경이 갖춰지고 조리종사자 보균검사가 안전하면 마지막 확진환자 발생 후 1주일 이후 재개할 수 있다.","재개는 보건당국과 협의해 학교(총괄대책반)가 결정하고 가정통신문을 보낸다. 역학조사 결과에 따라 업체 제재, 관리자 조치가 이어진다."],"basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 발생 후 조치사항·표2 6단계"}],"tables":[{"title":"식중독 의심 시 단계별 대응(교육부 지침서 제6차 표2)","head":["단계","핵심 할 일","주체"],"rows":[["평상시","교직원 연수, 병결·보건실 이용 모니터링, 모의훈련(권장)","영양교사·보건교사·담임"],["1 발생인지","보건실 관찰, 학교장 보고, 담임 1차 예비조사(손들기·주말 단체문자 금지), 대책회의","담임·보건교사→학교장"],["2 발생보고","같은 원인 추정 유증상자 2명 이상 동시 발생 시 교육청·시군구(보건소)에 즉시 보고; 법정 보고는 1명도 지체 없이","학교→관계기관"],["3 대책반 가동","대책반 업무, 급식 잠정 중단 결정(방역당국 협의), 대체급식","학교"],["4 원인·역학조사","보존식·환경검체 수거 준비, 현장 보존, 환자·대조군 조사 협의","학교·관계기관"],["5 조사 후 조치","급식실 대청소·소독","학교"],["6 모니터링","유증상 학생 관찰, 예방교육, 급식 재개(협의)","학교·관계기관"]],"note":"교육부 학교급식 위생관리 지침서 제6차 개정본(2026) 식중독 관리 및 표2를 요약. 지역별 보고 양식·후속 절차는 소속 교육청 현행 매뉴얼 확인"}],"record":"교육청·시·군·구(보건소)에 식중독 의심환자 발생 보고(유선으로 신속히, 이후 보고 양식·일일 현황 보고는 소속 교육청 지침), 보존식 기록지, 학교안전공제회 사고통지. 수인성 감염병으로 확인된 학생은 나이스 감염병 환자 등록·등교중지(출석인정).","sources":[{"title":"학교급식 위생관리 지침서 제6차 개정(2026.3.)","publisher":"교육부 학생건강정책과(인천광역시교육청 게시)","year":2026,"url":"https://www.ice.go.kr/upload/icefood/na/bbs_1447/2026/07/056d5da155094ac2a3b34ab0a3476a9c.pdf"},{"title":"서귀포시교육지원청 보도자료 «학교급식 영양(교)사 역량 강화 연수» — 제6차 개정 지침서 2026년 9월부터 적용 언급(2026.9.4.)","publisher":"제주특별자치도교육청(서귀포시교육지원청)","year":2026,"url":"https://www.jje.go.kr/board/view.jje?boardId=BBS_0000216&categoryCode1=support&dataSid=1479101&menuCd=DOM_000000201002000000&paging=ok&startPage=1"},{"title":"식품위생법·시행규칙","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/식품위생법"},{"title":"학교급식법 시행규칙 별표 4(학교급식의 위생·안전관리기준, 2021.1.29. 개정 — 현행)","publisher":"국가법령정보센터","year":2021,"url":"https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110201&flSeq=104210623"},{"title":"학교 감염병 예방·위기대응 매뉴얼 제3차 개정판","publisher":"교육부","year":2023,"url":"https://djcidc.or.kr/bbsDown/040201_new/2025032037952603893.pdf"},{"title":"학교안전사고 예방 및 보상에 관한 법률 시행령","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률시행령"},{"title":"2025학년도 초중고 수학여행·수련활동 등 현장체험학습 운영 매뉴얼","publisher":"인천광역시교육청","year":2025,"url":"https://www.ice.go.kr/upload/ice/na/bbs_2102/2025/03/cf637a079b8f0ae9345b79bb6310b459.pdf"}],"verified":"2026-09-24","uncertain":["시·도교육청별 학교급식 식중독 대응 매뉴얼(보고 양식·일일 보고 시각)은 소속 교육청 지침 확인 필요","식품위생법 제101조 과태료의 실제 부과액(시행령 별표)은 확인 못 함 — 법률상 상한 1천만원만 확인","학교장 개인에게 부과된 급식 관련 과태료를 학교배상책임공제로 지원하는지 여부는 옛 자료에만 있어 현행 확인 필요","지방식약청의 구체적 역할(원인식품 추적조사·신속검사 등)은 2021년 이후 원문 확인 필요 — 경남 매뉴얼에 있으나 2016년 지침서 기반 옛 자료","식중독 의심 학생의 응급 이송 기준(의식저하·탈수 등)은 원문 확인 필요","교내 방송·강당 소집으로 환자를 찾지 말라는 표현은 제6차 개정본(2026)에서 확인되지 않아 본문에서 뺐다(제6차는 손들기·(주말) 문자발송 금지만 명시)"],"related":["infectious-disease"]},{"id":"field-trip-accident","title":"현장체험학습·수학여행 중 사고·학생 이탈","aka":["수학여행 사고","체험학습 사고","수련회 다침","학생이 없어졌어요","학생 실종","인원 부족","버스 사고","숙소에서 다침","소풍 사고","현장학습 사고","인솔교사 책임","안전요원","보조인력","여행자보험","해외 수학여행 사고"],"category":"안전·보건","urgency":"즉시","roles":["인솔교사(담임)","현장 책임자(인솔 총괄)","보조인력·안전요원","학교장·교감","학교 비상대책위원회","행정실","교육지원청·교육청","여행사·가이드"],"summary":"현장체험학습·수학여행은 법상 ‘교육활동’이므로 그 중 사고는 학교안전사고이고 학교안전공제 대상이다. 현장에서는 ①구조 요청(119·112)과 응급처치 ②학교장에게 실시간 보고 ③학교장이 교육청에 즉시 보고 ④언론·학부모 창구 일원화 ⑤잔여 일정 판단 ⑥공제회 사고통지와 보상 안내 순으로 간다. 2025.6.21.부터 학교 밖 교육활동에 인솔교사를 돕는 보조인력을 둘 수 있고(제10조의4), 안전사고관리 지침에 따라 학생 안전조치의무를 다한 학교장·교직원·보조인력은 제10조제5항의 면책 대상이다. 민사 면책은 2025.12.2. 이후 사고에 적용된다.","first":["다친 학생이 있으면 현지 119(해외는 현지 구급·가이드)에 구조를 요청하고 응급처치, 다른 학생은 안전한 곳으로 모은다","학생이 안 보이면 즉시 인원 재확인 → 마지막 목격 위치·시각 확인 → 현장 관리자·가이드에 알리고 찾기 시작, 짧은 시간 안에 못 찾으면 112(해외는 현지 경찰·외교부 영사안전콜센터)","현장 책임자는 학교장(교감)에게 바로 전화로 상황과 피해 규모를 보고한다","병원 동행 교사와 상황 보고 담당을 정하고, 남은 학생 인솔 인원을 다시 나눈다","학부모·언론에는 개인적으로 설명하지 말고 학교(교육청) 창구로 모은다"],"steps":[{"stage":"알게 됨·신고","when":"사고 즉시","who":"현장 책임자·인솔교사","what":"현지 구조 요청과 응급처치","detail":"현지 경찰서·소방서·보건소·병원 등에 즉시 구조를 요청하고 응급구조기관 지시를 따른다. 사고 발생 시 119 신고(필요 시 112)와 긴급 구조·구호를 먼저 한 뒤 교육청에 보고한다.","basis":"인천광역시교육청 2025학년도 현장체험학습 운영 매뉴얼 07 사안 발생 시 대응 요령(교육부 현장체험학습 안내자료 2024.12. 기반)"},{"stage":"알게 됨·신고","when":"학생 이탈 인지 즉시","who":"인솔교사·보조인력","what":"이탈 학생 확인과 신고","detail":"인원을 다시 세고 짝·조원에게 마지막 목격 위치를 묻는다. 학생에게는 낙오하면 그 자리에서 전화하도록 사전 교육한다. 공항 등에서 실종 시 안내방송과 경찰 신고, 국외에서는 현지 가이드에게 즉시 연락한다. 실종 당시 18세 미만인 아동이 길을 잃는 등으로 보호자에게서 이탈하면 법상 ‘실종아동등’이다. 경찰(112)에 신고한다.","basis":"인천 2025 매뉴얼 국외 현장체험학습 안전 점검; 실종아동등의 보호 및 지원에 관한 법률 제2조·제6조"},{"stage":"초기 대응","when":"즉시","who":"현장 책임자","what":"학교장에게 실시간 보고","detail":"정확한 현장 상황과 피해 규모를 학교장에게 즉시 보고하고, 인솔교사 비상연락망으로 상황을 공유한다. 병원 동행 교사와 상황 보고자를 지정하고 인솔교사 업무를 다시 나눈다.","basis":"인천 2025 매뉴얼 07-가"},{"stage":"초기 대응","when":"즉시","who":"인솔교사(담임)","what":"학생 피해 파악과 돌봄","detail":"학생 피해 상황을 파악하고 상황에 따라 신속히 대피를 지도한다. 추가 피해가 예상되면 현장 책임자에게 즉시 보고한다. 응급환자는 응급처치 후 교사와 가이드가 함께 가까운 병원으로 이송하고, 담임은 병원에 머물며 상태를 파악해 학년부장·보호자에게 알린다.","basis":"인천 2025 매뉴얼 07-가, 부록 8 응급상황 대응 체계"},{"stage":"초기 대응","when":"사고 인지 즉시","who":"학교장·인솔교사","what":"교육청 즉시 보고","detail":"학교장과 인솔교사는 안전사고관리 지침에 따라 즉시 안전조치를 한 뒤 교육감(교육부장관)에게 즉시 보고해야 한다. 보고 방식은 시·도마다 다르다 — 인천시교육청 2025 매뉴얼 예시는 먼저 전화로 보고하고 사안보고서(6하원칙, 피해현황, 조치사항)를 뒤이어 보내게 한다.","basis":"학교안전법 제10조 제4항; 인천 2025 매뉴얼 07-2)"},{"stage":"초기 대응","when":"보고 직후","who":"학교장","what":"학교 비상대책위원회 소집","detail":"인천시교육청 2025 매뉴얼 예시: 교장(교감)·교무부장·학생부장·해당 학년 학부모 대표 등으로 비상대책위원회를 꾸려 수습 방안을 논의하고, 교육청과 협의해 언론 대응 창구를 한 곳으로 모으며, 학부모·교직원에게 사실 그대로 알림 문자를 보낸다. 구성·절차는 소속 교육청 매뉴얼로 확인한다.","basis":"인천 2025 매뉴얼 07-가"},{"stage":"조사·확인","when":"당일","who":"현장 책임자·학교","what":"잔여 일정 진행 여부 결정","detail":"현장총괄자가 나머지 학생의 일정 진행 여부를 학교(교장·교감)와 협의하고, 필요하면 학부모 의견을 모아 신속히 결정한다(인천시교육청 2025 매뉴얼 예시). 교육청의 시행 보류·취소 권고 등은 시·도마다 다르므로 소속 교육청 기준을 확인한다.","basis":"인천 2025 매뉴얼 07-가·부록 8"},{"stage":"조사·확인","when":"당일~귀교 후","who":"인솔교사·보조인력·목격자","what":"사고 경위 기록","detail":"발생 일시·장소·활동·경위·목격자·조치·이송 병원을 기록한다. 경찰·언론 관련 사항이 있으면 사안보고서에 함께 적는다. 이 기록이 공제 사고통지와 교원 면책 판단(지침에 따른 안전조치 이행 여부)의 근거가 된다.","basis":"인천 2025 매뉴얼 사안보고서(예시); 학교안전법 제10조 제5항"},{"stage":"조치·이행","when":"사고 후 지체 없이","who":"학교장(행정실)","what":"학교안전공제회 사고통지","detail":"수학여행 등 현장체험활동은 법상 교육활동이므로 학교안전공제로 보상된다. schoolsafe.or.kr에서 사고발생통지를 하고, 보호자에게 공제급여 청구 방법을 안내한다(세부는 ‘교내 안전사고’ 항목).","basis":"학교안전법 제2조 제4호 가목, 제41조의2, 제44조 제2항"},{"stage":"조치·이행","when":"사고 후","who":"학교·보호자","what":"여행자보험·업체 배상책임보험 확인","detail":"계획 단계에서 학생·인솔자 보험 가입과 업체의 영업배상책임보험 가입을 확인해 두어야 한다. 사고 후에는 여행사·숙박·수련시설·운송업체 보험 적용 여부를 확인한다. 공제급여와 같은 성질의 배상을 다른 법령에 따라 받으면 그 범위에서 공제급여는 지급되지 않고, 자동차손해배상보장법에 따른 배상을 받으면 공제급여가 지급되지 않는다.","basis":"인천 2025 매뉴얼 04 공통 준수사항·계약 구비서류; 학교안전법 제8조의2 제2항 제2호, 제43조 제1항 제3호, 제45조 제2항"},{"stage":"조치·이행","when":"사고 후","who":"학교장·교육청","what":"교사 보호 조치","detail":"사고 관련 수사·민원·소송이 예상되면 교육청 법률지원과 교원보호공제(교육활동으로 생긴 손해배상금 지원 — 고의·중과실은 제외, 정당한 교육활동 관련 민사·형사 소송비용 지원)를 신청한다. 교육부는 2026.5.28. 사고 초기부터 교육청 전담팀과 전담변호사를 지정해 법률상담부터 소송까지 지원하겠다고 발표했다.","basis":"교원지위법 제22조; 교육부 ‘현장체험학습 지원 방안’ 보도자료(2026.5.28.)"},{"stage":"불복·구제","when":"공제 결정에 불복 시","who":"공제급여 결정에 불복하는 사람(피해 학생·보호자 등)","what":"심사청구 → 재심사청구 → 재결 효력","detail":"공제급여 결정이 있음을 안 날부터 90일 안에 공제회의 학교안전공제보상심사위원회에 심사청구, 심사 결정서 정본이 송달된 날부터 90일 안에 공제중앙회의 학교안전공제보상재심사위원회에 재심사청구. 학교안전법 제64조는 재결서 정본 송달일부터 60일 안에 공제급여 관련 소송을 제기하지 않거나 그 소송을 취하하면 재결 내용과 같은 합의가 성립한다고 정한다.","basis":"학교안전법 제57조·제61조·제64조"},{"stage":"종결·사후","when":"귀교 후","who":"학교","what":"학생·교사 심리 지원과 평가","detail":"피해 학생·교직원과 그 가족의 상담·심리치료는 교육부장관과 교육감이 지원한다. 체험학습 종료 후 평가회에서 사고 원인과 안전대책을 점검해 다음 계획에 반영한다.","basis":"학교안전법 제10조의3; 인천 2025 매뉴얼 평가 및 환류"}],"deadlines":[{"what":"교육청 보고","limit":"즉시 안전조치 후 즉시(먼저 유선, 뒤이어 사안보고서)","basis":"학교안전법 제10조 제4항; 유선·서면 순서는 인천 2025 매뉴얼 07"},{"what":"공제회 사고통지","limit":"지체 없이","basis":"학교안전법 제44조 제2항"},{"what":"공제급여 청구권","limit":"3년 소멸시효","basis":"학교안전법 제65조"}],"dont":["인원 확인 없이 버스를 출발시키지 않는다 — 탑승·하차 때마다 인원을 센다","이탈 학생을 교사 혼자 오래 찾느라 신고를 늦추지 않는다","사고 현장에서 교사 개인 SNS·단톡으로 사진이나 추측을 올리지 않는다 — 언론·학부모 창구는 학교로 일원화","다친 학생을 가이드나 업체 직원에게만 맡겨 병원에 보내지 않는다 — 교사가 동행한다","‘일정은 계속해도 되겠지’ 하고 현장에서 혼자 결정하지 않는다 — 학교장과 협의"],"contacts":[{"name":"구급","tel":"119","note":"국내"},{"name":"경찰(실종·사건)","tel":"112","note":"국내, 학생 이탈 시"},{"name":"외교부 영사안전콜센터","tel":"02-3210-0404","note":"연중무휴 24시간. 해외 유료 +82-2-3210-0404. 해외 무료연결은 국가마다 번호가 다름(예: 현지국제전화코드+800-2100-0404) — www.0404.go.kr에서 확인"}],"forms":["사안보고서(인천시교육청 매뉴얼 예시 서식: 발생일시, 기본사항, 6하원칙 사안 개요, 언론·경찰 내용, 조치사항 및 향후계획) — 양식·보고 순서는 소속 교육청 기준","비상연락망(교육청·학교·교사·학생·학부모)과 체험지 병원·경찰서·소방서·보건소 연락처표 — 사전 작성","학교안전공제 사고발생통지·공제급여청구서","보조인력 채용 시 성범죄·아동학대 전력 조회 회신서, 자격 증빙"],"law":[{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제2조 제4호 가목","point":"학교장 관리·감독 아래 학교 안팎에서 하는 수련활동·수학여행 등 현장체험활동은 교육활동"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제8조의2","point":"학교장은 교육활동 안전대책을 점검·확인하고, 위탁 시 업체 인가·허가, 손해배상 보험 가입 여부, 인증 프로그램 여부 등을 확인"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제10조 제4항·제5항","point":"학교장·인솔교사 즉시 안전조치·즉시 보고. 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다하면 민사·형사 책임 없음(신설 2024.12.20., 개정 2025.12.2.; 민사는 2025.12.2. 이후 사고부터)"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제10조의4","point":"학교장은 학교 밖 교육활동에 사전 답사 등 준비 단계부터 인솔교사를 보조하는 인력을 배치할 수 있고, 교육감은 행정·재정 지원. 세부는 시·도 조례(2024.12.20. 신설, 2025.6.21. 시행)"},{"name":"실종아동등의 보호 및 지원에 관한 법률","article":"제2조, 제6조","point":"18세 미만이 길을 잃는 등으로 보호자에게서 이탈하면 실종아동등. 업무 관계로 사실상 아동을 보호·감독하는 사람 등은 알게 되면 경찰신고체계로 지체 없이 신고"}],"faq":[{"q":"수학여행 중 사고도 학교안전공제로 보상되나요?","a":"된다. 수학여행 등 현장체험활동은 학교안전법상 교육활동이고, 집합·해산 장소와 집 사이 합리적 경로의 왕복 시간도 교육활동 관련 시간이다(법 제2조 제4호, 시행령 제2조 제6호)."},{"q":"사고가 나면 인솔교사가 형사처벌을 받나요?","a":"현행법은 학교장·교직원·보조인력이 안전사고관리 지침에 따라 안전조치의무를 다한 경우 민사·형사 책임을 지지 않는다고 정한다(제10조 제5항). 민사 면책은 2025.12.2. 이후 사고부터 적용된다. 교육부는 2026.5.28. 면책 범위를 ‘고의·중과실이 아닌 경우’로 넓히는 개정을 추진한다고 발표했으나 아직 현행법은 아니다."},{"q":"보조인력·안전요원은 몇 명 둬야 하나요?","a":"법은 ‘필요한 경우 배치할 수 있다’(제10조의4 제1항)이고, 배치 기준·방법 등 세부 사항은 시·도 조례로 정한다(같은 조 제3항) — 시·도마다 다르므로 소속 교육청 기준을 확인한다. 인천 2025 매뉴얼은 인솔자 학급당 2명 권장, 숙박형 수학여행 중·대규모는 학생 50명당 안전요원 1명 등을 제시했다. 교육부는 2026.5.28. 보조인력 기준을 ‘학생 50명당 1명’에서 ‘학급당 1명’으로 늘리겠다고 발표했다. 시·도별 적용 기준은 소속 교육청의 해당 연도 매뉴얼로 확인한다."},{"q":"교육청에 바로 보고해야 하는 사고는 어디까지인가요?","a":"법은 교육활동 중 사고·위급상황을 즉시 보고하라고 한다(제10조 제4항). 인천 2025 매뉴얼은 사망·입원, 같은 장소 같은 활동 중 2명 이상 동시 부상으로 병원 치료, 종료 후에도 지속 치료, 동일 원인 유사 증세 2명 이상(식중독 의심), 법정 감염병 의심 진료를 즉시 보고 사안으로 든다. 시·도별 기준은 소속 교육청 매뉴얼로 확인한다."},{"q":"해외에서 학생이 없어지면 어디에 연락하나요?","a":"현지 가이드와 현지 경찰, 그리고 외교부 영사안전콜센터(연중무휴 24시간, 국내 02-3210-0404, 해외 유료 +82-2-3210-0404)에 연락한다. 해외 무료연결 번호는 국가마다 다르다(예: 일부 국가는 현지국제전화코드+800-2100-0404, 현지 일반·공중전화 이용) — 해외안전여행 누리집(www.0404.go.kr)에서 확인. 동시에 학교장에게 보고한다."}],"deep":[{"title":"사고 순간부터 수습까지, 누가 무엇을 하나(인천시교육청 매뉴얼 예시)","body":["현장 책임자: 구조 요청 → 학교장 실시간 보고 → 비상연락망으로 인솔교사 공유 → 병원 동행 교사·상황 보고자 지정.","인솔교사(담임): 학생 피해 파악·돌봄·대피, 추가 위험은 즉시 보고, 병원 동행 시 상태 파악 후 보호자 연락.","학교장: 교육지원청·교육청 즉시 유선 연락 → 비상대책위원회(교장·교감·교무부장·학생부장·학년 학부모 대표) → 언론 창구 일원화 → 잔여 일정 협의 → 학부모·교직원 알림 문자.","교육청: 원스톱 대응팀, 필요시 현장 파견, 사고수습대책본부, 언론 창구 일원화, 교무학사 지원."],"basis":"인천광역시교육청 2025학년도 현장체험학습 운영 매뉴얼 07"},{"title":"보조인력 제도 — 2025년에 새로 생긴 것","body":["2024.12.20. 개정 학교안전법(2025.6.21. 시행) 제10조의4로 학교장은 학교 밖 교육활동에 사전 답사 등 준비 단계부터 인솔교사를 보조하는 인력을 둘 수 있게 됐다. 교육감은 행정·재정 지원을 해야 한다.","보조인력의 배치 기준·방법 등 세부 사항은 시·도 조례로 정하도록 되어 있다(제10조의4 제3항). 보조인력의 범위·역할은 시·도마다 다르므로 소속 교육청의 조례·매뉴얼로 확인한다.","보조인력도 제10조 제5항 면책 대상에 포함된다. 업체가 채용한 인력이라도 학교에 노무를 제공하므로 성범죄·아동학대 전력 조회가 필요하다(인천 매뉴얼)."],"basis":"학교안전법 제10조의4·제10조 제5항; 인천 2025 매뉴얼 05"},{"title":"면책은 ‘지침대로 안전조치를 다한 경우’다","body":["현행 제10조 제5항의 면책 조건은 ‘제3항에 따른 안전사고관리 지침에 따라 학생에 대하여 안전조치의무를 다한 경우’다. 따라서 사전 답사, 사전 안전교육, 인원 점검, 임장지도, 사고 시 즉시 안전조치·보고를 했다는 기록이 중요하다.","민사 면책은 2025.12.2. 개정(법률 제21149호) 시행 이후 발생한 사고부터 적용된다(부칙 제2조).","교육부는 2026.5.28. ‘지침을 현저히 위반하는 등 고의·중과실이 있는 경우를 제외하고’ 민사·형사(형법 제268조 포함) 책임을 면제하는 제10조의5 신설안을 국회와 협의해 추진한다고 밝혔다. 법 통과 전까지는 현행 조문이 기준이다."],"basis":"학교안전법 제10조 제5항, 부칙(법률 제21149호) 제2조; 교육부 보도자료(2026.5.28.)"}],"tables":[{"title":"인천 2025 매뉴얼의 인솔자·안전요원 기준(참고)","head":["유형","규모","안전요원 배치"],"rows":[["1일형 현장체험학습","규모 무관","팀당 1명 권장"],["숙박형 수학여행(국내)","소규모(100명 미만)","팀당 1명"],["숙박형 수학여행(국내)","중·대규모(100명 이상)","학생 50명당 1명"],["국외 수학여행","규모 무관","학생 50명당 1명"],["수련활동","규모 무관","학생 50명당 1명"]],"note":"인천광역시교육청 2025학년도 매뉴얼(교육부 2024.12. 안내자료 기반). 인솔자는 학급당 2명 권장, 학교운영위원회 심의 시 1명 가능(1명이면 반드시 교원). 숙박형은 숙박업체별 야간 보조인력 1명 이상 추가. 시·도별 기준은 소속 교육청 매뉴얼 확인. 교육부는 2026.5.28. 보조인력을 학급당 1명으로 확대 발표."},{"title":"즉시 보고 사안(인천 2025 매뉴얼 예시)","head":["구분","기준"],"rows":[["인사 사고","사망·입원(인원 불문), 같은 장소·같은 활동 중 2명 이상 동시 부상으로 병원 치료, 종료 후에도 지속 치료, 기타 학교장 판단"],["식중독 의심","동일 원인 추정 유사 증세 2명 이상 동시 발생"],["감염병 의심","법정 감염병 임상증상 확인되어 병원 진료"]],"note":"보고 순서 예시: 초·중 학교→교육지원청→본청, 고 학교→본청. 먼저 유선 보고 후 사안보고서. 시·도별 보고 체계는 소속 교육청 지침으로 확인."}],"record":"사안보고서(인천 매뉴얼 예시: 유선 보고 후 서면)를 교육(지원)청에 내고, 학교안전공제회에 사고발생 통지. 시·도별 보고 방식과 사전 보고 기준은 소속 교육청 지침·조례로 확인한다.","sources":[{"title":"학교안전사고 예방 및 보상에 관한 법률(법률 제21149호)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률"},{"title":"2025학년도 초중고 수학여행·수련활동 등 현장체험학습 운영 매뉴얼","publisher":"인천광역시교육청","year":2025,"url":"https://www.ice.go.kr/upload/ice/na/bbs_2102/2025/03/cf637a079b8f0ae9345b79bb6310b459.pdf"},{"title":"안전한 환경 속 배움이 숨 쉬는 「현장체험학습 지원 방안」 발표(보도자료)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=106303&lev=0&searchType=null&statusYN=W&page=1&s=moe&m=020402&opType=N"},{"title":"실종아동등의 보호 및 지원에 관한 법률","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/실종아동등의보호및지원에관한법률"},{"title":"영사안전콜센터 이용안내","publisher":"외교부 해외안전여행","year":2026,"url":"https://www.0404.go.kr/bbs/contsPst/MST0000000000105/5/detail"}],"verified":"2026-09-24","uncertain":["시·도교육청별 2026학년도 현장체험학습 운영 매뉴얼의 안전요원 배치·즉시 보고 기준은 확인이 필요하다. 전국 공통 법령과 인천 2025 매뉴얼 예시를 구분해 적었다","교육부 ‘현장체험학습 안내자료(2024.12.)’ 원문은 직접 확인 못 함(인천 매뉴얼이 이를 바탕으로 했다고 밝힘)","교육부 2026.5.28. 지원방안(면책 확대 제10조의5 신설, 보조인력 학급당 1명, 전담변호사)의 법 개정·시행 여부와 시·도별 적용 시기는 원문 확인 필요 — 2026.9.24. 현행법은 제10조 제5항이다. (참고: 의안 제2218752호는 제10조의5가 아니라 제10조 제6항~제9항 신설(체험학습 위탁 기관 안전기준, 보호자·학생 공동책무) 안이며, 2026.9.16. 교육위원회에 상정된 단계다)","인솔교사가 실종아동법 제6조 제1항 제6호 신고의무자에 해당하는지는 법문상 명확하지 않음(신고 자체는 누구나 가능)","해외 현장체험학습 중 사고에 대한 학교안전공제 지급 범위(해외 의료비 등)는 확인 못 함","체험학습 중 사고 자체에 대한 생활기록부 기재 사항이 없다는 점은 원문 확인 필요","시·도 조례로 정하는 보조인력 배치 기준, 수학여행 사전 보고 기준, 교육감의 시행 보류·취소 권고 여부는 시·도마다 다름 — 소속 교육청 조례·매뉴얼 확인 필요"],"related":["safety-accident","runaway-missing","emergency-medical"]},{"id":"fire-earthquake","title":"화재·지진 발생 후 사안 처리","aka":["화재","불났어요","불이야","지진","흔들려요","대피","대피 후 인원 확인","운동장 대피","귀가 조치","조기 하교","임시휴업","보호자 인계","재난 보고","여진","화재경보"],"category":"안전·보건","urgency":"즉시","roles":["수업 중이던 교사","담임","대피유도반·인솔 교사","보건교사","교감","교장(학교안전책임관)","행정실"],"summary":"대피 자체는 훈련대로 하고, 이 문서는 대피 뒤의 '사안 처리'를 다룬다. 핵심은 ①대피 전·후 인원 확인과 못 나온 학생 파악 ②부상자 119·응급처치 ③교육청 보고 ④수업 계속·운동장 대기·귀가 중 결정 ⑤보호자에게 인계하며 알리기 ⑥상황일지와 공제 청구까지다. 귀가는 안전이 명확히 확보됐을 때만, 인계 절차를 지켜서 한다.","first":["대피 장소에서 반별 인원을 즉시 세고, 없는 학생 이름을 교감·본부에 보고한다","부상자는 응급처치하고 119에 알린다(갇힌 사람은 섣불리 구조하지 말고 의식만 확인)","학생을 건물 쪽으로 돌려보내지 않는다 — 여진·재발화 위험","불안해하는 학생 곁에 교사를 붙이고, 진행 상황을 짧게 알려 동요를 막는다","누가 언제 무엇을 결정·지시했는지 한 줄씩 기록을 시작한다"],"steps":[{"stage":"알게 됨·신고","when":"화재 발견 즉시","who":"최초 발견자","what":"'불이야' 외치고 비상벨(발신기)을 누르고, 안전한 곳에서 119 신고","detail":"학교 주소, 불의 진행 정도, 부상자 상황을 알린다. 119에 신고한 전화로는 다른 곳에 걸지 않는다(119가 다시 걸 수 있음).","basis":"학교현장 재난유형별 교육·훈련 매뉴얼(2024.12.) 2-2 화재"},{"stage":"알게 됨·신고","when":"지진 흔들림 중","who":"수업 중 교사","what":"머리 보호·책상 아래로 지시, 출입문 개방","detail":"크게 흔들리는 시간은 길어야 1~2분. 흔들림이 멈춘 뒤 약품·가스·전열기를 차단해 2차 화재를 막는다.","basis":"학교현장 재난유형별 교육·훈련 매뉴얼(2024.12.) 1-8 지진 2단계"},{"stage":"초기 대응","when":"화재경보 직후 / 흔들림 멈춘 뒤","who":"방송 담당·대피유도반","what":"방송·타종·메가폰으로 전교 대피 지시","detail":"지정된 대피경로로 운동장 등 넓은 곳으로. 화재 시 엘리베이터 금지, 연기 속에서는 자세를 낮추고 코·입을 막는다. 지진 대피 중 유리파편 주의.","basis":"같은 매뉴얼 1-8 지진, 2-2 화재"},{"stage":"초기 대응","when":"대피 장소 도착 즉시","who":"담임·인솔 교사","what":"대피 전·후 인원 확인, 대피 못 한 학생 확인","detail":"반별로 세어 없는 학생을 즉시 본부(교감)에 보고한다. 지정 대피 장소 도착 시 유관기관에 통보한다.","basis":"같은 매뉴얼 1-8 지진 2단계, 2-2 화재 2단계"},{"stage":"초기 대응","when":"대피 직후","who":"보건교사·교직원","what":"부상자 응급처치·구조대 인계","detail":"인명피해가 있으면 즉시 119 신고. 붕괴로 갇힌 경우 의식만 확인하고 섣부른 구조는 하지 않는다. 후송 시 담당 교사가 동행하고 병원·치료 상황을 교장에게 수시 보고.","basis":"같은 매뉴얼 1-8 지진 3단계·후속조치"},{"stage":"초기 대응","when":"소방대 도착 전","who":"교장·교직원","what":"초기 소화·방호 조치(화재)","detail":"화재 유형에 맞게 소화기·옥내소화전으로 초기 진압이 가능할 때만 한다. 교장은 소방대 도착까지 경보·대피 관련 조치를 지휘하고, 도착하면 현장지휘대를 지원한다.","basis":"같은 매뉴얼 2-2 화재 3단계"},{"stage":"조사·확인","when":"긴급대피 완료 후","who":"교장(부재 시 상위 직급 순)","what":"대책 회의 소집","detail":"학생 인원과 피해 학생 여부, 건물 손상, 재난 규모(지진은 규모·진앙을 기상청 누리집·안전디딤돌 앱으로 확인)를 파악해 초동 대처와 향후 대책을 정한다.","basis":"같은 매뉴얼 1-8 지진 3단계"},{"stage":"알게 됨·신고","when":"피해 파악 즉시","who":"교장·교감","what":"교육청(교육지원청)에 신속 보고","detail":"피해 내용, 현재 학교 조치, 향후 계획을 보고한다. 인명피해가 있으면 교육청·소방서 보고를 철저히. 피해가 심각하면 주민센터에도 신고.","basis":"같은 매뉴얼 1-8 지진 3단계, 2-2 화재 2단계"},{"stage":"심의·결정","when":"대책 회의","who":"교장","what":"수업 계속·운동장 대기·귀가 조치 결정","detail":"여진이 없거나 시설 점검으로 안전이 확인된 경우에만 정상 수업. 결정 근거는 행정안전부·기상청·교육청·지자체·언론 등의 상황 모니터링을 종합한다.","basis":"같은 매뉴얼 1-8 지진 3단계"},{"stage":"심의·결정","when":"지진 규모 확인 후","who":"교장","what":"규모별 학교 조치 기준 적용(권고)","detail":"진앙 반경 100km 이내 학교에 적용을 권장. 4.0 미만은 정상 운영·대피 여부 학교 판단(학생 대다수가 진동을 느꼈으면 운동장 등 임시대피 권장), 4.0~4.9는 교육활동 중지·대피 실시, 5.0 이상은 교육활동 중지·피해교 임시휴업·대피 및 귀가(명확한 안전 확보 후 인계 절차에 따라). 가능한 높은 단계로 대응하고, 진앙 근처 학교는 1단계라도 가급적 대피.","basis":"같은 매뉴얼 1-8 지진 '지진 규모별 학교 조치 기준'"},{"stage":"조치·이행","when":"결정 직후","who":"교장·교감","what":"임시휴업·수업 단축 시 교육청 즉시 보고","detail":"학교장은 비상재해 등 급박한 사정이 있으면 임시휴업할 수 있고, 지체 없이 관할청에 보고해야 한다. 관할청이 휴업을 명하면 지체 없이 휴업해야 한다.","basis":"초·중등교육법 시행령 제47조제2항·제3항, 초·중등교육법 제64조"},{"stage":"조치·이행","when":"귀가 결정 시","who":"담임·인솔 교사","what":"보호자 인계 절차에 따라 귀가","detail":"귀가는 명확한 안전 확보가 가능할 때만. 보호자 인계·연락(전화·문자·홈페이지)을 하고, 보호자와 연락이 안 되는 학생은 교내 안전구역 대기 또는 인솔 교사 직접 귀가 인솔 등을 미리 정한다. 인솔 교사는 끝까지 대기.","basis":"같은 매뉴얼 1-8 지진 3단계·후속조치, 2-2 화재 4단계"},{"stage":"조치·이행","when":"결정 직후","who":"교감·담당자","what":"보호자 안내","detail":"정상 수업 여부, 귀가 시각·방법, 돌봄교실·휴업대체프로그램 운영 여부를 알린다. 통신이 끊기면 학생을 운동장에 계속 대기시키고, 복구 후 SNS·홈페이지로 공지한다. 지진은 기상청 문자 수신 시(규모 3.0 이상) 보호자 문자 발송이 기준표에 있다.","basis":"같은 매뉴얼 '재난으로 인한 휴업', 1-8 지진"},{"stage":"조치·이행","when":"대피 이후 계속","who":"담임·상담교사","what":"불안 호소 학생 먼저 돌보기","detail":"진행 상황을 알려 동요를 막고, 불안을 호소하는 학생은 상담교사에게 인계한다. 필요하면 관할 교육청(교육지원청) Wee센터에 협조를 요청한다. 장애학생은 지원 인력을 붙여 정서적 안정을 돕는다.","basis":"같은 매뉴얼 1-8 지진 후속조치, '지진 규모별 학교 조치 기준' 장애학생 조치"},{"stage":"조치·이행","when":"재난 종료 시까지","who":"교직원","what":"학생 안전관리 지속·위험구역 통제","detail":"여진·재발화 대비, 위험구역 설정과 학생 출입 통제, 가스·상하수도·전기 등 2차 피해 시설 점검.","basis":"같은 매뉴얼 1-8 지진 4단계"},{"stage":"종결·사후","when":"상황 종료 후","who":"교감·담당자","what":"상황일지 작성·결과 보고","detail":"사고, 결정, 행동을 기록한 상황일지와 대응 결과·특이사항을 교육청에 보고한다.","basis":"같은 매뉴얼 1-8 지진 3~4단계"},{"stage":"종결·사후","when":"복구 단계","who":"교장·행정실","what":"응급 복구·수업 대책","detail":"피해시설 응급 복구, 원인 조사와 예방대책 수립, 복구 예산 협의. 화재로 수업이 어려우면 인근 학교 시설 이용·2부제 수업 등을 강구한다.","basis":"같은 매뉴얼 2-2 화재 4단계, 1-8 지진 4단계"},{"stage":"종결·사후","when":"피해 확인 후","who":"행정실","what":"시설 피해 재난복구비(공제급여) 신청","detail":"매뉴얼은 피해 내용 확인 후 한국교육시설안전원에 공제급여를 신청하도록 안내한다.","basis":"같은 매뉴얼 2-2 화재 4단계"},{"stage":"종결·사후","when":"학생·교직원이 다쳤을 때","who":"보호자(청구인)·학교","what":"학교안전공제회에 공제급여 청구","detail":"교육활동 중 사고로 다친 학생·교직원은 소속 시·도 학교안전공제회에 요양급여 등을 청구한다. 공제회는 청구일부터 14일 이내(조사 필요 시 14일 연장)에 지급 여부를 결정한다. 학교는 공제사업을 안내해야 한다. 받을 권리는 3년간 행사하지 않으면 소멸.","basis":"학교안전사고 예방 및 보상에 관한 법률 제41조, 제41조의2, 제65조"},{"stage":"불복·구제","when":"공제급여 결정에 불복할 때","who":"청구인(보호자 등)","what":"심사청구 → 재심사청구 → 재결 효력","detail":"결정이 있음을 안 날부터 90일 이내 시·도 공제회의 학교안전공제보상심사위원회에 심사청구(60일 이내 결정, 1회 1개월 연장). 그 결정에 불복하면 결정서 정본 송달일부터 90일 이내 공제중앙회 재심사위원회에 재심사청구. 학교안전법 제64조는 재결서 정본 송달일부터 60일 안에 공제급여 관련 소송을 제기하지 않거나 그 소송을 취하하면 재결 내용과 같은 합의가 성립한다고 정한다.","basis":"학교안전법 제57조, 제59조, 제61조, 제64조"}],"deadlines":[{"what":"임시휴업 시 관할청 보고","limit":"지체 없이(매뉴얼: 결정 즉시)","basis":"초·중등교육법 시행령 제47조제3항"},{"what":"공제회 공제급여 지급 여부 결정","limit":"청구받은 날부터 14일 이내(14일 연장 가능)","basis":"학교안전법 제41조제2항"},{"what":"공제급여 심사청구","limit":"결정이 있음을 안 날부터 90일 이내","basis":"학교안전법 제57조제2항"},{"what":"재심사청구","limit":"심사 결정서 정본 송달일부터 90일 이내","basis":"학교안전법 제61조제2항"},{"what":"재결 효력(기간 내 소송 미제기·취하 시 합의 간주)","limit":"재결서 정본 송달일부터 60일","basis":"학교안전법 제64조"},{"what":"공제급여 받을 권리","limit":"3년간 행사하지 않으면 소멸시효 완성","basis":"학교안전법 제65조"}],"dont":["인원 확인 없이 해산하거나 바로 귀가시키지 않는다","소지품·출석부를 가지러 학생이나 교사가 건물로 다시 들어가지 않는다","보호자 연락이 안 된 학생을 혼자 귀가시키지 않는다","여진·시설 점검 없이 '괜찮아 보인다'고 교실 수업을 재개하지 않는다","붕괴로 갇힌 사람을 교직원이 무리하게 끌어내지 않는다","화재 신고한 전화로 다른 곳에 연락하지 않는다"],"contacts":[{"name":"화재·구조·구급","tel":"119","note":""},{"name":"경찰","tel":"112","note":""}],"forms":["상황일지(사고·결정·행동 기록)","재난 피해 상황 보고(교육청 서식)","보호자 안내 문자·가정통신문(휴업·조기하교·돌봄 운영 안내)","학생 인계 확인 기록","학교안전공제 공제급여 청구서"],"law":[{"name":"초·중등교육법 시행령","article":"제47조(휴업일 등) 제2항·제3항","point":"비상재해 등 급박한 사정이 있으면 학교장이 임시휴업할 수 있고, 지체 없이 관할청에 보고"},{"name":"초·중등교육법","article":"제64조(휴업명령 및 휴교처분)","point":"관할청은 재해 등으로 정상수업이 불가능하면 휴업을 명할 수 있고, 학교장은 지체 없이 휴업"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제41조(공제급여의 청구 및 지급 등)","point":"공제회는 청구일부터 14일 이내 지급 여부 결정, 부지급 시 심사청구 절차 안내"},{"name":"학교안전사고 예방 및 보상에 관한 법률","article":"제57조·제61조·제64조","point":"심사청구(안 날부터 90일) → 재심사청구(송달일부터 90일) → 재결서 정본 송달일부터 60일 내 소송 미제기·취하 시 재결 내용과 같은 합의 간주"}],"faq":[{"q":"지진이 났는데 흔들림이 약했어요. 꼭 운동장으로 대피해야 하나요?","a":"매뉴얼의 규모별 기준(권고)은 4.0 미만이면 정상 운영이지만, 학생 대다수가 진동을 느꼈다면 운동장 등으로 임시대피를 권장합니다. 진앙 근처 학교는 1단계라도 가급적 대피하고, 가능한 높은 단계로 대응하라고 합니다."},{"q":"대피 후 바로 하교시켜도 되나요?","a":"귀가는 명확한 안전 확보가 가능할 때만, 학생 인계 절차를 지켜서 합니다. 보호자 연락이 안 되는 학생은 교내 안전구역 대기나 인솔 교사 직접 인솔 등을 미리 정해 두라고 매뉴얼은 안내합니다."},{"q":"임시휴업은 누가 결정하나요?","a":"학교장이 비상재해 등 급박한 사정이 있을 때 할 수 있고 지체 없이 관할청에 보고해야 합니다. 교육청이 휴업을 명하거나 등하교 시간 조정을 지시하면 따릅니다."},{"q":"통신이 끊겨 학부모에게 연락이 안 돼요.","a":"보호자 불안을 줄이기 위해 학생들을 운동장에 계속 대기시키고, 통신이 복구되면 SNS나 홈페이지로 공지하라고 매뉴얼은 안내합니다."},{"q":"대피하다 다친 학생 치료비는요?","a":"교육활동 중 사고는 소속 시·도 학교안전공제회에 공제급여를 청구합니다. 결정에 불복하면 안 날부터 90일 안에 심사청구, 이어 재심사청구를 할 수 있습니다."}],"record":"교육청(교육지원청) 피해 상황 보고, 임시휴업 시 관할청 보고, 상황일지 작성·보관.","deep":[{"title":"대피 뒤 첫 30분: 인원·부상·보고","body":["대피 전·후 인원 확인이 가장 먼저다. 없는 학생 이름이 나오면 구조대에 바로 알릴 수 있어야 한다.","부상자는 응급처치 뒤 구조대에 인계하고, 후송에는 교사가 동행해 교장에게 수시로 보고한다. 동시에 교장(부재 시 상위 직급 순)이 대책 회의를 열고 교육청에 피해 상황을 보고한다."],"basis":"학교현장 재난유형별 교육·훈련 매뉴얼(2024.12.) 1-8 지진·2-2 화재"},{"title":"수업을 계속할지, 돌려보낼지","body":["정상 수업은 여진이 없거나 시설 점검으로 안전이 확인된 경우에만 한다. 판단 근거는 기상청·행정안전부·교육청·지자체 발표를 종합한다.","귀가를 택하면 보호자 인계를 원칙으로 하고, 연락이 안 되는 학생의 대기 장소와 인솔자를 정한다. 휴업하더라도 가정 보호가 어려운 학생을 위해 돌봄교실·휴업대체프로그램 운영 여부를 함께 안내한다(단, 학교 안 안전을 보장하기 어렵거나 휴교 처분이면 미운영)."],"basis":"같은 매뉴얼 1-8 지진, '재난으로 인한 휴업'"},{"title":"지진 규모별 학교 조치 기준(권고)","body":["진앙 반경 100km 이내 교육청·학교에 적용을 권장하는 기준이다. 학교 위치와 여건에 따라 바꿀 수 있지만 가능한 높은 단계로 대응하라고 한다.","규모가 커질수록 근무 형태(전 교직원 근무·대응조직 소집), 상황반 설치(행정실), 교육활동 중지·임시휴업, 대피·귀가, 보호자 문자, 상황일지·보고가 단계적으로 강화된다."],"basis":"같은 매뉴얼 1-8 지진"},{"title":"끝난 뒤: 기록·복구·보상","body":["상황일지와 대응 결과를 보고하고, 피해시설 응급 복구와 원인 조사·예방대책을 세운다. 시설 피해는 한국교육시설안전원 공제급여, 사람 피해는 학교안전공제회 공제급여로 나뉜다.","공제급여 결정에 불복하면 시·도 공제회 심사위원회(안 날부터 90일) → 공제중앙회 재심사위원회(송달일부터 90일)를 거친다. 학교안전법 제64조는 재결서 정본 송달일부터 60일 안에 공제급여 관련 소송을 제기하지 않거나 취하하면 재결 내용과 같은 합의가 성립한다고 정한다."],"basis":"같은 매뉴얼 2-2 화재 4단계, 학교안전법 제41조·제57조·제61조·제64조"}],"tables":[{"title":"지진 규모별 학교 조치 기준(권고, 요약)","head":["구분","1단계","2단계","3단계"],"rows":[["지진 규모","4.0 미만(해역 5.0 미만)","4.0~4.9(해역 5.0~5.9) / 지역최대진도 Ⅴ","5.0 이상(해역 6.0 이상) / 지역최대진도 Ⅵ 이상"],["교육 활동","정상 운영","교육 활동 중지","교육 활동 중지·임시휴업(피해 발생교)"],["학생 안전 조치","대피 여부 학교 판단(학생 대다수가 진동을 느꼈으면 운동장 등 임시대피 권장)","대피 실시","대피 및 귀가 실시(반드시 명확한 안전 확보 후 학생 인계 절차에 따라)"],["상황반","미설치","설치(행정실) — 설치 여부는 학교장 판단","설치(행정실)·통신장비 준비"],["보호자 문자","기상청 문자 수신 시(규모 3.0 이상)","조치 사항 안내","조치 사항 안내"],["보고","상황일지 작성·상황 종료 후 특이사항 보고","상황일지 작성·상황 종료 후 특이사항 보고","상황일지 작성·상황 종료 후 특이사항 보고"]],"note":"학교현장 재난유형별 교육·훈련 매뉴얼(교육부·학교안전공제중앙회, 2024.12.) 74쪽. 진앙 반경 100km 이내 적용 권장, 권고사항."}],"sources":[{"title":"학교현장 재난유형별 교육·훈련 매뉴얼 (발행 2024.12.)","publisher":"교육부 교육안전정책과·학교안전공제중앙회","year":2024,"url":"https://www.data.go.kr/data/15114149/fileData.do"},{"title":"초·중등교육법 (시행 2026.9.11.) / 같은 법 시행령 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법시행령"},{"title":"학교안전사고 예방 및 보상에 관한 법률 (시행 2025.12.2.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교안전사고예방및보상에관한법률"}],"verified":"2026-09-24","uncertain":["재난 피해 보고 서식·보고 시한은 소속 시·도교육청 지침을 확인해야 한다. 확인한 교육부 매뉴얼에는 '신속 보고'로 안내되어 있다","매뉴얼 파일은 인천 갈월초 게시본(파일명 2025)으로 받아 읽었고, 판권면 발행일은 2024년 12월 — 교육부 게시 원본 PDF 주소는 공공데이터포털 목록만 확인","시설 피해 공제(한국교육시설안전원)의 청구 기한·불복 절차는 확인하지 못함","화재·지진 사안 자체에 대한 학교생활기록부 기재 사항이 없다는 점은 원문 확인 필요"],"related":["safety-accident","emergency-medical"]},{"id":"student-death","title":"학생 사망 후 학교 대응(사후개입)","aka":["학생 사망","학생 자살","친구가 죽었어요","부고","사후개입","애도교육","위기관리위원회","장례식 조문","사망 공지","모방 자살","베르테르 효과","언론 취재","SNS 소문","빈자리 정리","유가족"],"category":"학생 보호·위기","urgency":"즉시","roles":["교장(위기관리위원회 위원장)","교감","담임","학년부장","생활교육부장","전문상담(교)사","보건교사","교육정보부장(SNS)","행정실장","교육(지원)청 담당자"],"summary":"학생 자살 사망 뒤의 교육청 보고와 학교응급심리지원(PFA-S)을 중심으로 정리했다. 교육부 가이드북은 인지 당일 교육(지원)청 유선 보고와 교육청의 7일·15일 경위·사안 보고를 안내한다. 학교는 위기관리위원회를 열고 유가족과 공지 범위를 협의하며, 애도교육·선별검사·지속 지원으로 영향을 크게 받은 학생을 돕는다. 추수 점검은 사안에 따라 2개월·6개월·1년을 계획할 수 있다. 사고·질병 등 다른 원인의 사망 보고서·기한은 이 안내의 범위가 아니므로 소속 교육청 기준을 확인한다.","first":["교내에서 발생했다면 응급구명 조치와 119·112(학교전담경찰관) 신고, 현장 통제로 학생들이 보지 않게 하고 목격 학생을 분리·보호한다","관리자에게 보고하고 그날 바로 교육(지원)청에 유선 보고한다","학교위기관리위원회를 소집해 역할(유가족 소통·학생·학부모·교직원 지원·보고서·언론·지역연계)을 나눈다","공지 전에 유가족과 공지 여부·범위를 협의한다 — 원인은 말하지 않고, 사실을 거짓으로 바꾸지 않는다","형제자매, 가까운 친구, 목격·신고 학생 등 영향을 크게 받을 학생을 먼저 파악해 상담으로 잇는다"],"steps":[{"stage":"알게 됨·신고","when":"사건 직후(교내 발생 시)","who":"최초 발견자","what":"응급조치·신고·현장 통제","detail":"응급구명 조치를 하고 119, 학교전담경찰관(SPO) 또는 112에 신고한다. 학생들이 현장에 접근하거나 목격하지 않도록 장소를 통제하고, 목격자를 분리·보호한다(학생들만 있게 하지 말고 가능하면 성인 보호자와 함께). 보호자에게 즉시 연락한다.","basis":"학생 마음건강 지원 가이드북(2025) Q5(45~46쪽); 학교위기대응 안내서(2024) 11·15쪽"},{"stage":"알게 됨·신고","when":"인지 당일","who":"교장·교감","what":"교육(지원)청 유선 보고","detail":"학교는 인지 당일 교육(지원)청에 유선 보고하고, 학생자살사망사안보고서와 경위서를 제출한다. 서면 제출 시점은 소속 시·도교육청 지침을 확인한다. 시·도교육청은 사안 조사를 해 7일 이내 경위보고, 15일 이내 사안보고서를 교육부에 낸다. 안내서 업무분장 예시는 보고서를 담임·상담교사 등 평소 학생을 잘 아는 교직원이 서식 항목에 따라 나눠 작성하고 생활교육부장이 작성을 관리하도록 한다.","basis":"학생 마음건강 지원 가이드북(2025) Q5(46쪽); 학교위기대응 안내서(2024) 부록 1 업무분장 예시"},{"stage":"초기 대응","when":"사안 발생 직후","who":"교장(위원장)","what":"학교위기관리위원회 소집·역할 분담","detail":"학기 초 미리 구성해 둔 위원회를 소집한다. 위원장은 교장, 교육(지원)청 담당자가 참석해 자문한다. 유가족 소통·학생 지원·학부모 지원·교직원 지원·보고서 작성·지역사회 연계·언론 대응 담당자를 정하되, 복수로 지정해 공백을 막고 담임·상담·보건교사 한 사람에게 몰리지 않게 한다.","basis":"학교위기대응 안내서(2024) 11·15쪽, 부록 1"},{"stage":"조사·확인","when":"위원회 소집 뒤","who":"위원회","what":"정확한 사건 정보 수집","detail":"발생 장소·시간, 사건의 강도(부상·사망자 수, 장소 특징), 떠도는 소문·보도 내용을 확인한다. 학생·교직원에게 사건 경험을 확인할 때는 자세한 설명이나 세세한 묘사를 요구하는 '조사'를 하지 않는다(사실관계 규명은 위원회 역할 분담에 따라 담당자가 한다).","basis":"학교위기대응 안내서(2024) 11쪽·21쪽(실행자 주의 행동)·부록 1"},{"stage":"초기 대응","when":"사건 정보 수집 뒤, 공지 전","who":"위원회·교육(지원)청·전문기관","what":"1차 관계기관 대책회의","detail":"학교·교육(지원)청·Wee센터 등 학교위기개입 전문기관이 모여 학교 상황을 공유하고, 교직원·학생·학부모 공지 방법과 수준, 응급심리지원 일정·기관별 업무 분담, 장례식장 조문단 파견을 정한다.","basis":"학교위기대응 안내서(2024) 11쪽"},{"stage":"심의·결정","when":"공지 전","who":"유가족 소통 담당(교장·교감 등)","what":"유가족 협의","detail":"공지는 유족 동의를 원칙으로 하되 공지의 필요성(추모, 잘못된 소문으로부터 고인·유족 보호, 학교 대응 목적)을 충분히 설명한다. 자살·원인이 아니라 '사망이 있었다'는 최소한의 공지로 협의할 수 있다. 전학·유학 간 것으로 해 달라는 요청처럼 거짓 공지는 할 수 없음을 알린다. 유족이 끝내 반대하면 의사를 존중하되, 공지와 관계없이 학생 동향을 파악하고 필요한 지원은 한다. 형제자매 재학 여부, 장례 일정, 유가족이 학교에 바라는 점을 확인한다.","basis":"학교위기대응 안내서(2024) 12쪽·22쪽 Q1~Q4; 자살예방법 제21조"},{"stage":"조치·이행","when":"공지 당일","who":"교장·교감","what":"교직원 공지(임시 교무회의)","detail":"사건 공지와 학교의 공식 입장, 학생·학부모에게 공개할 내용, 주의 깊게 볼 학생의 트라우마 반응, 응급심리지원 일정, 역할 분담을 공유한다. 공지 순서는 교직원 → 학생 → 학부모다(어린 초등학생은 학부모 먼저 여부를 따로 정함).","basis":"학교위기대응 안내서(2024) 12~13쪽"},{"stage":"조치·이행","when":"공지 당일","who":"담임","what":"학생 공지(학급별)","detail":"전체 방송이 아니라 담임이 반별로, 학교가 정한 기본 내용을 일관되게 알린다. 정보는 최소화하고 학교의 대응 노력과 향후 계획 위주로 전한다. 원인은 말하지 않고 추측하지 않도록 설명하며, 자살이면 미화하는 표현을 쓰지 않는다. 소문을 무조건 부인하기보다 확인된 사실만 말하거나 '아직 정확히 파악된 정보가 없다'고 하고, 확인되지 않은 소문이 사람들에게 상처를 준다는 점, 반응은 사람마다 다르니 서로 비난하지 말 것, 힘들면 도움을 요청하라는 점을 전한다.","basis":"학교위기대응 안내서(2024) 13쪽, 부록 2 학생 대상 공지 예시"},{"stage":"조치·이행","when":"학생 공지와 같은 날","who":"학부모 지원 담당","what":"학부모 공지(가정통신문+문자)","detail":"학생 공지와 같은 날 서면과 휴대전화 문자로 함께 알린다. 자녀에게 나타날 수 있는 스트레스 반응과 가정에서 돕는 방법, 학교의 대처(학생 교육·심리검사 등), 문의 대표 연락처를 담고, 자살로 알려진 경우 추측을 자녀와 주고받지 말아 달라고 당부한다. 애도교육·상담에 대한 동의도 받는다.","basis":"학교위기대응 안내서(2024) 12쪽, 부록 3 가정통신문 예시"},{"stage":"조치·이행","when":"공지 직후","who":"담임(전문가 동참)","what":"학급별 애도교육·심리안정화","detail":"자살 사건 직후에는 생명존중교육보다 애도교육이 우선이다. 사전에 학생·보호자 동의를 받고, 동의하지 않은 학생은 분리한다. 학급별로 하되 전 학년 실시가 바람직하고 동아리·학원 등 집단은 소집단으로 한다. 담임이 주도하고 전문가가 함께 들어가 격해진 학생은 안정 장소로 인계한다. 복식호흡·나비포옹·착지법 같은 안정화 기법을 쓴다. 초등학생은 발달 수준을 고려해 애도교육을 상황에 맞게 고쳐 쓰고, 직접적인 학생 대상 개입보다 가정통신문·학부모 교육으로 가정에서 돕는 방법을 전하는 것이 바람직하다.","basis":"학교위기대응 안내서(2024) 13·17~18쪽, Q7; 학생 마음건강 지원 가이드북(2025) Q5(47쪽)"},{"stage":"조사·확인","when":"공지 후 첫 며칠","who":"상담(교)사·Wee센터","what":"고위기 학생 선별과 특별상담실","detail":"형제자매, 친했던 친구·이성친구, 정보를 먼저 알던 학생, 목격·신고 학생, 최근까지 함께 지낸 학생, 갈등·싸움이 있던 학생, 상담을 요청한 학생, 평소 우울·자살사고가 있던 학생을 우선 파악한다. 우울·사건충격(IES-R-K) 등 척도와 면담으로 선별해 즉각 상담하고 위험도에 따라 병원 등 외부기관에 연계한다. Wee클래스를 기반으로 특별상담실을 차리고, 이전부터 상담받던 학생은 집중 관리한다.","basis":"학교위기대응 안내서(2024) 13~14쪽, 부록 5; 단위학교 위기관리 가이드라인(서울시교육청)"},{"stage":"조치·이행","when":"장례 기간","who":"교장·담임","what":"조문·장례 참여 관리","detail":"조문·운구 참여를 원하는 학생은 보호자 동의를 받게 하고 교사가 인솔한다(어려우면 보호자 동행). 서울시교육청 가이드라인은 학사일정을 가급적 정상 운영하고, 화장·염 장면을 학생이 보지 않게 하라고 권장한다.","basis":"학교위기대응 안내서(2024) 12쪽; 단위학교 위기관리 가이드라인(서울시교육청)"},{"stage":"조치·이행","when":"사건 직후부터 계속","who":"교육정보부장·생활교육부장","what":"소문·SNS 모니터링","detail":"누리소통망(SNS)의 잘못된 소문, 비방·명예훼손 확산을 살피고 대응한다. 학생들이 사건 정보를 과하게 찾아보거나 퍼뜨리지 않게 안내하고, 학생은 확인되지 않은 소문이나 추가 위협을 알게 되면 담임에게 알리도록 한다. 자살동반자 모집·구체적 방법 제시 등 자살유발정보의 정보통신망 유통은 법으로 금지된다.","basis":"학교위기대응 안내서(2024) 9·16쪽, 부록 1; 자살예방법 제19조·제25조제3항"},{"stage":"조치·이행","when":"언론 접촉 시","who":"언론대응 담당(주로 교감·부장)","what":"언론 대응 일원화","detail":"언론 접촉은 자제하고 창구를 지정 담당자 1인으로 일원화한다. 발표 내용은 교육(지원)청·응급심리지원 기관과 협의하고, 기자에게 '자살보도 권고기준' 준수와 확인된 사실 위주 보도를 요청한다. 실명·자살 수단·정황·추정 원인은 공개하지 않는다(서울시교육청 가이드라인).","basis":"학교위기대응 안내서(2024) 16쪽; 단위학교 위기관리 가이드라인(서울시교육청); 자살예방법 제19조의2"},{"stage":"조치·이행","when":"필요 시","who":"교장·담임","what":"경찰 조사 요청 대응","detail":"경찰이 사망 학생 주변 친구 조사를 요청하면, 학생에게 응할 책임은 없으므로 학생·보호자 동의 없이 조사받지 않도록 하고, 보호자 동행을 경찰에 요청할 수 있음을 안내한다.","basis":"학교위기대응 안내서(2024) Q11"},{"stage":"조치·이행","when":"공지 3~4일 후","who":"담임","what":"빈자리와 유품 정리","detail":"감정이 가라앉을 무렵 학생들과 자리를 어떻게 할지 함께 정하고, 3~7일 후에는 정리한다고 약속해 둔다. 정리하는 날 추억을 나누고 묵념한 뒤 정리할 수 있다. 유품은 상자에 담아 장례가 끝난 뒤 유가족에게 전한다(학생과 마주치지 않는 시간 권장).","basis":"학교위기대응 안내서(2024) Q13; 단위학교 위기관리 가이드라인(서울시교육청) Q&A"},{"stage":"조치·이행","when":"선별검사 뒤","who":"위원회·전문기관","what":"2차 관계기관 대책회의","detail":"선별검사 결과를 논의하고 정신건강 위기로 선별된 학생·교직원의 지원 범위와 수준, 기관별 역할을 정한다. 필요하면 의료기관에 연계하고 학교는 학생의 정서·행동 관찰과 보호자 협력을 이어 간다.","basis":"학교위기대응 안내서(2024) 14쪽"},{"stage":"조치·이행","when":"계속","who":"교직원 지원 담당·동료","what":"교직원(담임) 심리지원","detail":"담임과 가까웠던 교사는 충격이 커도 스스로 신청하기 어려우므로 관리자·동료가 연계를 돕는다. 교육활동보호센터(옛 교원치유지원센터), 교직원 공제회 등에서 지원받을 수 있고 교육청에 따라 치료비 지원도 있다. 서울시교육청 가이드라인은 유가족과의 법적·행정적 논의를 가급적 위원장 또는 생활지도부장이 맡도록 권장한다.","basis":"학교위기대응 안내서(2024) Q15; 단위학교 위기관리 가이드라인(서울시교육청) Q&A; 교원지위법 부칙(법률 제19735호) 명칭 변경 경과조치"},{"stage":"종결·사후","when":"선별된 학생 심리지원 뒤","who":"위원회·전문기관","what":"3차 관계기관 대책회의·추수 계획","detail":"기관별 응급심리지원 결과를 논의하고 추후 지원 범위·기관을 정한다. 사건과 상황에 따라 2개월·6개월·1년 시점의 추수 심리평가 계획을 세운다(초기 개입 때 장기 추적의 필요성을 설명하고, 장기 추적 시점(6개월 혹은 1년 후)에 서면 동의를 얻는 것도 이후 소통에 도움이 된다).","basis":"학교위기대응 안내서(2024) 14쪽, Q14"},{"stage":"종결·사후","when":"장기","who":"상담교사·담임","what":"추모 방식·기일 대비","detail":"추모 기간은 가족·학교 관계자와 논의한다. 서울시교육청 가이드라인은 교내 운구행렬이나 공식 추모행사를 재학생 영향을 고려해 삼가도록 권장한다. 1주기 무렵 기일 반응이 나타날 수 있으니 미리 논의하고, 생일·기일·기념일 대응을 세운다. 기숙학교에서는 1~2년 이상 장기 트라우마 치료가 필요한 학생이 있을 수 있어 장기 추적 관찰을 권장하고, 목격 학생도 장기적 치유 개입이 필요하다.","basis":"학교위기대응 안내서(2024) 14·16쪽, Q8·Q12; 단위학교 위기관리 가이드라인(서울시교육청)"},{"stage":"종결·사후","when":"장기","who":"유가족 지원 담당","what":"유가족 지원 안내","detail":"지역 정신건강복지센터·자살예방센터를 안내하고, 한국생명존중희망재단 유가족 심리지원(자조모임, 치료비 지원 등)과 지역별 자살 유족 원스톱 서비스를 알려 준다. 같은 학교·인근 학교에 형제자매가 있으면 부모를 통해 정서 상태를 확인하고 상담을 권한다. 다른 학교의 친한 친구는 교육(지원)청을 통해 해당 학교에 알린다.","basis":"학교위기대응 안내서(2024) Q9·Q10·Q16"}],"deadlines":[{"what":"교육(지원)청 유선 보고","limit":"인지 당일","basis":"학생 마음건강 지원 가이드북(2025) Q5(45~46쪽)"},{"what":"학생자살사망사안보고서·경위서 제출(학교)","limit":"당일 유선보고 후 제출(서면 기한은 시도교육청 지침)","basis":"학생 마음건강 지원 가이드북(2025) Q5(45~46쪽)"},{"what":"시도교육청 → 교육부 경위보고","limit":"7일 이내","basis":"학생 마음건강 지원 가이드북(2025) Q5(45~46쪽)"},{"what":"시도교육청 → 교육부 사안보고서","limit":"15일 이내","basis":"학생 마음건강 지원 가이드북(2025) Q5(45~46쪽)"},{"what":"학생 공지와 학부모 공지","limit":"같은 날이 바람직","basis":"학교위기대응 안내서(2024) 12쪽"},{"what":"빈자리 정리","limit":"공지 3~4일 후 학생과 논의, 3~7일 후 정리","basis":"학교위기대응 안내서(2024) Q13"},{"what":"추수 심리평가","limit":"사건 후 2개월·6개월·1년(사안에 따라)","basis":"학교위기대응 안내서(2024) 14쪽"}],"dont":["자살을 교통사고·전학·유학으로 거짓 공지하기","전교 방송이나 강당 집합으로 한꺼번에 알리기 — 반응 통제와 위기학생 확인이 어렵다","사망 원인·방법·정황을 설명하거나 추측에 답하기, 자살을 미화하는 표현","“네 기분 알아”, “좋은 곳으로 갔을 거야”, “이 일에서 회복하려면 공부에 열중해야 해” 같은 섣부른 위로","목격 학생에게 장면을 자세히 말하게 하거나 목격자를 집단으로 한꺼번에 다루기","교내 공식 추모행사·운구행렬 추진, 교사 개인의 언론 인터뷰","담임 한 사람에게 보고서·유가족 응대·학생 상담을 몰아주기"],"contacts":[{"name":"응급·경찰","tel":"119 / 112","note":"교내 발생 시 응급구명·신고(학교전담경찰관 SPO)"},{"name":"자살예방상담전화","tel":"109","note":"24시간, 친구 사망 뒤 힘든 학생·교직원에게 안내"},{"name":"청소년전화","tel":"1388","note":"24시간"},{"name":"정신건강 상담전화","tel":"1577-0199","note":"24시간"},{"name":"학생정신건강지원센터(학생마음건강중앙지원단)","tel":"043-710-4074","note":"학교위기개입 컨설팅·애도교육 자료(smhrc.kr)"},{"name":"관할 교육(지원)청·Wee센터","tel":"지역별","note":"보고, 응급심리지원·특별상담실 인력"},{"name":"한국생명존중희망재단","tel":"누리집 kfsp.or.kr","note":"자살 유가족 심리지원"}],"forms":["학생자살사망사안보고서 및 경위서(교육청 서식)","학교위기관리위원회 조직·업무분장표(학교위기대응 안내서 2024 부록 1)","학생 대상 사안 공지 예시(부록 2) — 해당 학급용/다른 학급용","가정통신문 예시(부록 3)","학교위기관리위원회 진행 예시(부록 4)","선별검사 척도(CDI·사건충격척도 IES-R-K·자살관련 면담 기록지, 부록 5)","애도교육·상담 동의서, 조문 참여 보호자 동의(문자 확인 가능)"],"law":[{"name":"자살예방 및 생명존중문화 조성을 위한 법률","article":"제21조(명예 및 생활의 평온에 대한 배려)","point":"국가·지자체는 자살예방대책을 실시할 때 자살자·자살시도자와 가족 등의 명예와 생활의 평온을 부당하게 침해하지 않도록 하여야 한다 — 안내서는 유족이 반대하는데 학교가 임의로 자살 사실을 공지하는 것은 바람직하지 않다고 하면서도, 이 조항 위반 여부는 구체적 사안에서 학교 조치가 적정했는지에 따라 판단될 문제라 일률적으로 단정할 수 없다고 설명한다"},{"name":"자살예방 및 생명존중문화 조성을 위한 법률","article":"제19조(자살유발정보예방체계의 구축)·제25조제3항","point":"누구든지 정보통신망으로 자살유발정보(동반자 모집, 구체적 방법 등)를 유통해서는 안 되고, 위반하면 2년 이하 징역 또는 2천만원 이하 벌금"},{"name":"자살예방 및 생명존중문화 조성을 위한 법률","article":"제19조의2(자살보도 권고기준 준수 협조요청)","point":"보건복지부장관은 언론에 자살보도 권고기준 준수를 요청할 수 있고 언론은 이행에 노력"},{"name":"대한민국헌법","article":"제17조","point":"사생활의 비밀과 자유 — 유족 의사 존중의 근거로 안내서가 인용"}],"faq":[{"q":"아직 소식을 모르는 학생이 많은데 굳이 알려야 하나요?","a":"함께 지내던 학생의 사망을 알고 추모하려면 공지가 중요하다. 알리지 않으면 부재를 둘러싼 소문이 퍼져 고인과 유족에게 상처가 되고, 나중에 알게 되면 수습이 더 어렵다. 원인이 아니라 사망 사실에 대한 최소한의 공지로 유족과 협의한다. 결정이 어려우면 다른 학생들이 부재를 곧 알 수 있는지를 기준으로 판단하라고 권장하는 교육청도 있다(서울시교육청 가이드라인)."},{"q":"유가족이 공지를 원하지 않습니다.","a":"공지의 필요성과 방식을 충분히 설명하되, 끝내 반대하면 의사를 존중하는 것이 바람직하다. 다만 공지 여부와 관계없이 학생들 사이에 퍼진 내용과 분위기를 파악하고 영향받을 학생은 지원해야 한다."},{"q":"관리자가 공지를 반대합니다.","a":"공지하지 않으면 심리지원을 공식화할 수 없어 지원에 한계가 생길 수 있다. 공지할 때 어떤 우려가 있는지 함께 논의하고, 사실에 근거해 공지한 뒤 학생들 사이의 소문이 실제로 줄었다는 경험을 공유해 불안을 줄인다."},{"q":"시험·체험학습 기간이라 사후개입을 하기 어렵습니다.","a":"소문의 범위와 영향받을 위험 학생 여부를 확인하고 위기관리위원회·대책회의에서 상황에 맞게 우선순위를 정한다."},{"q":"'애도교육'이라는 말이 부담스러워 '생명존중교육'으로 바꿔도 되나요?","a":"생명존중교육은 예방 목적이고 애도교육은 일어난 상실에 대한 반응을 다룬다. 사건 직후에는 애도를 다루는 것이 더 효과적이다. 이름이 부담되면 '안정화교육'으로 진행하는 선택지도 있다(서울시교육청 가이드라인)."},{"q":"경찰이 친한 친구를 조사하겠다고 연락했습니다.","a":"안내서는 학생이 조사에 응해야 할 책임은 없으므로 학생·보호자 동의 없이는 경찰조사를 받지 않도록 하고, 보호자에게 상황을 설명해 학생·보호자가 판단하게 하라고 안내한다. 보호자 동행을 경찰에 요청할 수 있고, 부담되는 내용은 경찰에 이의를 제기할 수 있음을 미리 안내할 수 있다."},{"q":"초등학생이 숨졌습니다. 애도교육을 그대로 해도 되나요?","a":"초등학생은 죽음 개념과 애도 반응이 학년에 따라 다르고, 만 10세 정도에 일반적인 죽음 개념이 생긴다고 알려져 있어 이를 고려해야 한다. 위원회나 교육(지원)청에서 아동심리 전문가·소아정신과 전문의 자문을 받아 개입을 정하고, 안내서의 애도교육은 상황에 맞게 고쳐 쓴다. 직접 개입보다 가정통신문·학부모 교육으로 가정에서 돕는 방법을 전하는 것이 바람직하다."},{"q":"담임인 저도 너무 힘듭니다.","a":"학교 위기 때는 교사 자신의 몸과 마음을 먼저 챙기는 것이 중요하고, 교사들끼리도 서로 지지하고 돕는 것이 중요하다. 교육활동보호센터(옛 교원치유지원센터)·교직원 공제회 등에서 심리지원을 받을 수 있고 교육청에 따라 치료비 지원도 있다. 담임은 스스로 신청하기 어려울 수 있어 관리자·동료가 연계를 돕는다. 유가족과의 법적·행정적 논의는 가급적 위원장 또는 생활지도부장이 맡도록 권장하는 교육청도 있다(서울시교육청 가이드라인)."}],"record":"교육(지원)청 보고: 당일 유선보고 후 학생자살사망사안보고서·경위서 제출(시도교육청은 7일 이내 경위보고, 15일 이내 사안보고서를 교육부에 제출). 학교는 위원회 회의록, 공지문, 동의서, 선별검사·상담 기록을 보관한다. 사망 학생의 학적 처리(나이스)는 학교생활기록부 기재요령과 교육청 학적 담당 지침을 따른다.","deep":[{"title":"학교응급심리지원(PFA-S) 흐름 한눈에","body":["위기상황 발생 → 학교 내 대책회의(학교위기관리위원회) 소집 → 정확한 사건 정보 수집 → 1차 관계기관 대책회의(학교·교육지원청·전문기관) → 교직원·학생·학부모 사망 공지 → 교사 연수, 학급별 애도반응 돕기와 심리지원용 선별검사, 학부모 교육 → 2차 관계기관 대책회의 → 선별된 학생 심리지원 → 3차 관계기관 대책회의 → 장기 추가지원.","목적은 사건 전으로 완벽히 되돌리는 것이 아니라 구성원의 정서적 안정을 바탕으로 교육이라는 학교 본연의 기능을 다시 수행하게 하는 '학교 정상화'다. 5가지 필수 요소는 만남과 경청, 안전과 보호, 정보수집과 실제적 지원, 대처에 대한 교육과 정보제공, 사회적 지원과 연결이다.","이 흐름은 재난·자연재해·안전사고·학교 구성원의 자살 등 중대 위기 사건에 일반적으로 쓰는 절차이며, 사건과 상황에 맞게 조정한다."],"basis":"학교위기대응 안내서(2024) 8~11쪽; 학생 마음건강 지원 가이드북(2025) Q5(45~46쪽)"},{"title":"공지는 이렇게 쓴다","body":["순서: (확인된 사실 중심으로) 교사 → 학생 → 학부모 → (필요 시) 언론. 학생과 학부모 공지는 같은 날이 바람직하다.","학생용(부록 2 예시): 갑작스러운 소식을 전하게 된 사실, 선생님도 놀랐다는 감정, 사실대로 알리는 이유, 소문이 유가족과 친구에게 상처가 된다는 점, 누구 탓을 하지 말자는 당부, 장례식 참석은 부모님 허락 후 선생님께 알릴 것, 반응은 사람마다 다르다는 설명, 힘들면 도움을 요청하라는 안내. 사망 원인은 '밝혀지지 않았다'고 말하고, 공개할 정보는 유가족과 협의한 최소 범위로 정한다.","학부모용: 사망 사실, 선생님이 직접 알린 이유, 확인되지 않은 이야기를 자제해 달라는 부탁, 자녀와 충분히 대화해 달라는 당부, 장례 참석 허락 방법, 학교의 대책과 연락처."],"basis":"학교위기대응 안내서(2024) 12~13쪽, 부록 2·3"},{"title":"누구를 먼저 도와야 하나 — 고위기(취약) 학생","body":["사망 학생과 같은 학교·인접 학교의 형제자매, 친했던 친구·이성친구, 사안 정보를 먼저 알던 학생, 목격·신고 학생, 최근까지 함께 지낸 학생, 지속적으로 갈등·싸움이 있던 학생, 상담을 요청한 학생, 평소 우울·자살사고가 있던 학생이 우선 대상이다.","직접 목격한 학생은 개별 접근이 낫다. 집단 개입은 기억 왜곡이나 간접 트라우마를 키울 수 있다. 기억을 떠올리게 하는 자극 요소를 점검해 제거하고, 트라우마는 단기간에 해결되지 않으므로 장기 치유 개입을 계획한다.","모방자살(베르테르 효과)을 막기 위해 취약학생 사례를 집중 관리하고, 특별상담실은 Wee클래스에서 최소 2주 운영을 권장하는 교육청도 있다(서울)."],"basis":"학교위기대응 안내서(2024) 13·23~24쪽 Q8; 단위학교 위기관리 가이드라인(서울시교육청)"},{"title":"애도교육과 심리안정화","body":["애도는 가까운 사람이 사망했을 때 겪는 자연스러운 반응이고, 반응은 성격·상황·가족·환경에 따라 사람마다 다르다. 애도교육은 혼란스러운 감정·생각이 자연스럽다는 것을 알리고, 자신과 친구를 돕는 방법을 가르친다. 안내서는 일반적으로 슬픔, 부인, 죄책감, 분노, 수치심, 수용의 단계를 거친다고 설명한다.","사전에 학생·보호자 동의를 받고, 학급별로 담임이 주도하며 전문가가 함께 한다. 전 학년 실시가 바람직하다. 학생정신건강지원센터 애도교육 자료 'More than Sad'를 활용할 수 있다.","심리안정화 기법(복식호흡, 나비포옹, 착지법)은 10~15분, 시간이 없으면 조회·종례에 2~3분씩 꾸준히 해도 효과적이다."],"basis":"학교위기대응 안내서(2024) 17~19쪽"},{"title":"언론·SNS와 모방 방지","body":["언론 대응은 지정된 담당자 1인(주로 교감·부장)으로 일원화하고, 공식 입장은 교육(지원)청·전문기관과 미리 협의한다. 기자에게 자살보도 권고기준 준수와 확인된 사실 위주 보도를 요청하고, 체계적으로 대처하고 있다는 학교 입장을 알린다.","교육정보부장 등이 SNS의 비방·명예훼손·소문을 모니터링한다. 학생이 사건 정보를 과도하게 검색·공유하지 않도록 안내한다. 자살동반자 모집이나 구체적 방법 제시 등은 자살유발정보로 정보통신망 유통이 금지된다.","공식 추모행사나 교내 운구행렬은 재학생 파장을 고려해 삼가도록 권장되고(서울시교육청 가이드라인), 추모 기간과 방식은 유가족·학교 관계자와 논의해 정한다."],"basis":"학교위기대응 안내서(2024) 16쪽, 부록 1; 단위학교 위기관리 가이드라인(서울시교육청); 자살예방법 제19조·제19조의2"},{"title":"장기 추적과 종결","body":["트라우마는 수개월에서 수년까지 갈 수 있다. 겉으로 안정돼 보여도 영향을 많이 받은 학생 위주로 2개월·6개월·1년 시점에 재점검한다. 추수 평가로 힘들어하는 학생이 있으면 추가 도움이 필요하다는 신호로 본다.","1주기에는 기일 반응이 나타날 수 있으므로 미리 준비한다. 기숙학교는 학생들이 영향을 더 많이 받아 초기 적극 개입과 더 지속적인 추적 관찰이 필요하고, 1~2년 이상 장기 트라우마 치료가 필요한 학생이 있을 수 있다. 기숙사에서 발생했다면 룸메이트의 방 교체도 고려한다.","유가족에게는 정신건강복지센터·한국생명존중희망재단 유가족 지원을 안내한다."],"basis":"학교위기대응 안내서(2024) 14쪽, Q12·Q14·Q16"}],"tables":[{"title":"학교위기관리위원회 역할 분담(예시)","head":["담당","주요 업무"],"rows":[["위원장(교장·교감)","위원회 소집·운영, 대외 협조·언론 창구 단일화, 교육(지원)청 유선 보고, 유가족 협의, 유품 보관·전달(경찰 협조)"],["부위원장(교무부장)","학생 출결·가정학습 관리, 학부모 상담 창구, 유가족 협의 참여"],["생활교육부장","사실관계 규명·상황 통제, 교육청 사안보고서 작성 관리"],["생활안전부장","교내 안전 점검·순시, 경찰 협조, 장례 일정 진행(필요 시)"],["학년부장·담임","학년 통제(출결·애도교육·안전공제·상담 중재), 학부모와 긴밀한 소통"],["교육정보부장","홈페이지 관리, SNS 모니터링·대응(비방·명예훼손·소문)"],["상담교사","고위험군 선별·상담, 상담 핫라인, 외부 상담기관 연계, 해당 학생 상담 기록 정리, 특별상담실"],["보건교사","응급처치·의료기관 의뢰, 소방서·의료기관 연결, 건강 기록 정리"],["행정실장","예산·물품, 시설 점검(사안에 따라 참석)"]],"note":"출처: 학교위기대응 안내서(2024) 부록 1(부산·인천·제주 교육청 자료 기반 예시). 학교 상황에 맞게 조정하고 특정 교사에게 몰리지 않게 한다."},{"title":"시점별 할 일","head":["시점","할 일"],"rows":[["인지 당일(즉시)","응급조치·신고(교내), 교육(지원)청 유선보고, 위원회 소집, 사실 확인"],["초기(공지 전후)","1차 대책회의, 유가족 협의, 교직원→학생(학급별)→학부모 공지(학생·학부모는 같은 날이 바람직), 애도교육, 특별상담실"],["공지 후 며칠","선별검사·고위기 학생 상담, 조문 관리, SNS·언론 대응 / 시도교육청은 7일 이내 교육부에 경위보고"],["공지 3~4일 후 ~ 3~7일","빈자리 정리(학생과 협의), 유품은 장례 후 유가족 인계"],["선별검사 뒤","2차 대책회의, 선별 학생 심리지원·의료 연계 / 시도교육청은 15일 이내 교육부에 사안보고서"],["심리지원 뒤","3차 대책회의, 추후 지원 범위·기관 결정, 추수 평가 계획 수립"],["2개월·6개월·1년","추수 심리평가(사건·상황에 따라), 장기 지원, 1주기 기일 반응 대비"]],"note":"7일·15일은 시도교육청→교육부 보고 기한(학생 마음건강 지원 가이드북 2025, 46쪽). 1·2·3차 대책회의의 구체 일자는 안내서에 정해져 있지 않아 순서만 적었다. 사안에 따라 조정."},{"title":"학생에게 하면 안 되는 위로와 대신 할 일","head":["피할 말","대신"],"rows":[["“네가 어떤 기분인지 알아”","판단하거나 해석하지 말고 있는 그대로 들어 주기"],["“좋은 곳으로 갔을 거야” / “그 친구가 가야 할 때였어”","모르는 것은 모른다고 솔직히 답하기"],["“곧 기분이 나아질 거야” / “그냥 다른 이야기하자”","휴식해도 괜찮고, 즐기거나 웃는 것도 떠난 친구에게 무례한 일이 아니라고 알려 주기"],["“이 일에서 회복하려면 공부에 열중해야 해”","슬픔은 시간이 걸린다고 알리고 도움 요청 방법 안내"]],"note":"출처: 학교위기대응 안내서(2024) 20~21쪽."}],"sources":[{"title":"학교위기대응 안내서(PFA-S) 2024 일부 개정","publisher":"교육부·한국교육환경보호원 학생정신건강지원센터","year":2024,"url":"https://smhrc.kr/dataCenter/dataView?dataId=461"},{"title":"학생 마음건강 지원 가이드북","publisher":"교육부","year":2025,"url":"https://smhrc.kr/dataCenter/dataView?dataId=493"},{"title":"2026학년도 학교생활기록부 기재요령(초·중·고)","publisher":"교육부·17개 시도교육청","year":2026,"url":"https://star.moe.go.kr/web/contents/m21100.do"},{"title":"학교생활기록 작성 및 관리지침 별표 7(학적처리에 사용하는 용어)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/flDownload.do?bylClsCd=200201&flNm=%5B별표+7%5D+%ED%95%99%EC%A0%81%EC%B2%98%EB%A6%AC%EC%97%90+%EC%82%AC%EC%9A%A9%ED%95%98%EB%8A%94+%EC%9A%A9%EC%96%B4&flSeq=161765391"},{"title":"단위학교 위기관리 가이드라인","publisher":"서울특별시교육청","year":2021,"url":"https://www.schoolhealth.kr/web/sht/file/schoolFileDownload.do?lstnum1=4493&fileSeq=1"},{"title":"자살예방 및 생명존중문화 조성을 위한 법률(시행 2026.5.12.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/자살예방및생명존중문화조성을위한법률"},{"title":"자살예방상담전화 109 안내","publisher":"보건복지부 보건복지상담센터","year":2026,"url":"https://www.129.go.kr/109"},{"title":"청소년상담 1388 상담시간·연락 방법","publisher":"한국청소년상담복지개발원 청소년1388","year":2026,"url":"https://www.1388.go.kr/cco/YTOSP_SC_CCI_01"},{"title":"자살예방상담전화 유관기관 안내(정신건강상담전화 1577-0199 포함)","publisher":"보건복지부 보건복지상담센터","year":2026,"url":"https://www.129.go.kr/109"},{"title":"학생마음건강중앙지원단 대표 연락처","publisher":"한국교육환경보호원 학생마음건강중앙지원단","year":2026,"url":"https://www.smhrc.kr/dataCenter/dataView?dataId=538"}],"verified":"2026-09-24","uncertain":["학교가 교육(지원)청에 내는 학생자살사망사안보고서의 서면 제출 기한은 시도교육청마다 다르다. 서울시교육청 가이드라인은 즉시 유선·서면(요약) 보고, 5일 이내 사안보고서, 4주 이내 2차 보고로 정하고 있으나(서울시교육청 예시) 시·도마다 다르므로 소속 교육청 기준을 확인한다.","자살 외 사망(사고·질병)의 교육청 보고 서식·기한과 학교안전사고에 따른 공제 보상 절차는 이 파일에서 다루지 않았다(안전사고 사안 참조).","학교생활기록 작성 및 관리지침 별표 7은 고등학교에서 사망하면 '제적'(명예졸업에 해당하는 경우 제외), 명예졸업은 학칙에 따라 학교장이 인정한 경우로 정한다. 의무교육 단계(초·중)는 '면제'로 처리한다(인천시교육청 2026 매뉴얼: 면제 사유 '사망(명예졸업에 해당하는 사유 외)'). 명예졸업 인정 요건과 나이스 처리 세부는 학교생활기록부 기재요령 원문·학칙·교육청 학적 지침을 확인해야 한다.","자살보도 권고기준의 최신 판 번호·세부 항목은 원문을 확인하지 못했다.","관할 교육(지원)청의 위기개입 지원기관(Wee센터·응급심리지원팀)과 교육활동보호센터(옛 교원치유지원센터) 연락처는 시·도마다 다르다 — 소속 교육청 안내를 확인한다.","공지 순서·애도교육·경찰 조사 대응 등은 학교위기대응 안내서(2024) 기준이다. 경찰 참고인 조사에 대한 안내서 설명(학생은 응할 책임 없음)은 법원 증인소환 등 별도 법적 의무가 있는 경우까지 다루지 않는다."],"related":["suicide-risk"]},{"id":"privacy-leak","title":"개인정보 유출(오발송·단톡방 게시·USB 분실)","aka":["개인정보 유출","성적표 잘못 보냄","명렬표 잘못 보냄","문자 오발송","메일 잘못 보냄","단톡방에 학생 정보","학부모 단톡방 명단","USB 분실","노트북 분실","생기부 유출","상담기록 유출","엑셀 숨김시트","홈페이지 첨부파일 개인정보","개인정보 신고","72시간"],"category":"행정·정보","urgency":"당일","roles":["유출을 낸 교직원","담임","분야별책임자(유출 부서의 장)","학교 개인정보 보호담당자","개인정보 보호책임자","교감","교장"],"summary":"학생·보호자·교직원 등 개인정보의 당사자인 정보주체의 정보가 분실·도난·유출·위조·변조·훼손된 경우가 '유출등'에 해당할 수 있다. 일반 통지는 규모와 관계없이 정보주체에게 해야 하고 시행령상 원칙적 기한은 인지 후 72시간이다. 학교는 교육부 지침에 따른 내부 보고·신고 절차도 확인한다. 법정 기관 신고는 1천명 이상, 민감정보·고유식별정보, 외부 불법접근 유출 중 하나에 해당할 때 72시간 내 개인정보보호위원회 또는 KISA에 한다. 유출이 확정되지 않은 단계의 통지 요건도 별도로 확인한다.","first":["더 퍼지지 않게 막는다: 메일 회수, 단톡방 메시지 삭제, 게시물·첨부파일 내리기, 받은 사람에게 삭제 요청","받은 사람에게 삭제를 요청할 때 삭제 확인 증빙(삭제 전·후 목록 화면 등)도 함께 요청하고, 요청·회수 시각을 기록한다","무엇이(항목)·몇 명·언제·어떻게 나갔는지 메모한다","즉시 부서장·학교 개인정보 보호담당자·교감에게 알린다 — 72시간 시계는 '알게 된 때'부터 돈다","혼자 조용히 해결하지 않는다. 정보주체 통지, 교육부 행정 보고, 보호위원회·KISA 법정 신고는 기준이 서로 다르므로 담당자와 각각 판단한다"],"steps":[{"stage":"알게 됨·신고","when":"유출을 알게 된 즉시","who":"알게 된 교직원","what":"유출 사실 확인 및 시각 기록","detail":"잘못 보낸 문자·메일·단톡방 게시, 분실한 USB·노트북·출력물, 홈페이지 첨부파일 노출 등. '알게 된 시각'을 적어 둔다(통지·신고 72시간의 기준점).","basis":"개인정보 보호법 시행령 제39조·제40조"},{"stage":"초기 대응","when":"즉시","who":"유출을 낸 교직원","what":"확산 차단·회수·삭제","detail":"메일은 회수 기능으로 즉시 회수하고, 불가능하면 수신자에게 삭제를 요청하고, 가능하면 삭제됐음을 확인할 증빙(삭제 전·후 목록 화면)을 함께 요청한다. 받은 증빙에도 개인정보가 담길 수 있으니 보호담당자와 상의해 관리한다. 대용량 첨부 서버 파일도 삭제 요청한다. 게시판 첨부는 내리고 개인정보 부분을 삭제·마스킹해 필요하면 다시 게시한다.","basis":"개인정보 보호법 제34조제3항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 3.3·3.4"},{"stage":"초기 대응","when":"즉시","who":"유출을 낸 교직원","what":"관리자·보호담당자에게 보고","detail":"분야별책임자(유출 부서의 장)와 학교 개인정보 보호담당자, 교감·교장에게 알린다. 통지·신고는 개인 판단으로 미루지 않는다.","basis":"서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 1.4·1.5"},{"stage":"조사·확인","when":"당일","who":"분야별책임자·보호담당자","what":"유출 범위 확인","detail":"유출된 항목(이름·연락처·성적·주민등록번호·건강정보 등), 인원 수, 시점과 경위, 받은 사람, 회수·삭제 여부를 정리한다. 민감정보(건강 등)·고유식별정보(주민등록번호 등) 포함 여부와 1천명 이상인지, 해킹 등 외부 불법접근인지를 확인한다 — 신고처가 달라진다.","basis":"개인정보 보호법 시행령 제40조제1항"},{"stage":"조사·확인","when":"당일","who":"분야별책임자","what":"엑셀 등 파일 숨은 정보 점검","detail":"엑셀은 숨김 행·열·시트, 피벗테이블, OLE 개체 등으로 보이지 않는 개인정보가 같이 나갈 수 있다. 원본 파일 전체를 열어 실제로 나간 범위를 확인한다.","basis":"서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 3.4"},{"stage":"조치·이행","when":"알게 된 때부터 72시간 이내","who":"분야별책임자(유출 부서의 장)","what":"정보주체에게 통지","detail":"법 제34조제1항의 통지사항은 ①유출 항목 ②시점과 경위 ③정보주체가 할 수 있는 피해 최소화 방법 ④처리자의 대응조치와 피해구제 절차 ⑤피해 신고·상담 부서와 연락처 ⑥손해배상·법정손해배상·분쟁조정 등 법적 권리와 행사 방법 ⑦그 밖에 대통령령으로 정하는 사항이다. 개인정보위 2026.9. 안내서는 ③과 함께 비밀번호 변경, 2단계 인증, 해외 IP 로그인 제한 등 계정 보호방법을 안내할 수 있고, 정보주체가 유출 여부를 조회할 수 있는 절차를 마련할 수 있다고 안내한다. ⑦의 '대통령령으로 정하는 사항'은 현행 시행령에서 따로 정한 조문을 찾지 못했다. 항목·경위를 확인하지 못한 경우 시행령 제39조제2항에 따라 확인된 사실과 제3호부터 제6호까지 사항을 먼저 통지하고 추가 확인 즉시 보완한다.","basis":"개인정보 보호법 제34조제1항, 시행령 제39조제1항·제2항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 2.1"},{"stage":"조치·이행","when":"통지가 불가능할 때","who":"학교","what":"통지 갈음 게시","detail":"연락처를 모르는 등 정당한 사유가 있으면 통지 항목을 학교 홈페이지에 30일 이상 게시하는 것으로 갈음할 수 있다. 홈페이지가 없으면 보기 쉬운 장소에 30일 이상 게시.","basis":"개인정보 보호법 시행령 제39조제3항"},{"stage":"조치·이행","when":"교육부 지침상 72시간 이내 — 현행 교육청 절차 확인","who":"학교(분야별책임자·보호담당자)","what":"교육부 행정 보고(상급기관 경유, 2024 훈령 기준)","detail":"1명이라도 유출되면 유출 내용과 조치 결과를 72시간 내에 상급기관을 거쳐 교육부에 신고한다. 신고서는 교육부 개인정보 보호지침 별지 제5호서식, 교육부 개인정보보호 포털(privacy.moe.go.kr)로 제출. 포털·전자우편으로 할 시간이 없으면 전화로 먼저 신고하고 신고서를 나중에 낸다.","basis":"교육부 개인정보 보호지침 제13조제1항·제3항·제4항"},{"stage":"조치·이행","when":"72시간 이내(해당 시)","who":"학교","what":"개인정보보호위원회 또는 한국인터넷진흥원에 동시 신고","detail":"①1천명 이상 ②민감정보·고유식별정보 유출 ③외부 불법접근(해킹 등)에 의한 유출 중 하나라도 해당하면 교육부 신고와 동시에 보호위원회 또는 한국인터넷진흥원에도 신고한다(개인정보 포털 privacy.go.kr).","basis":"개인정보 보호법 제34조제4항, 시행령 제40조제1항·제3항, 교육부 개인정보 보호지침 제13조제1항 단서"},{"stage":"조치·이행","when":"신고 여부 판단 시","who":"학교","what":"신고 예외 검토","detail":"유출 경로가 확인되고 해당 개인정보를 회수·삭제하는 등으로 정보주체의 권익 침해 가능성이 현저히 낮아졌다면 신고하지 않을 수 있다. 다만 이 예외는 '신고'에 관한 것이다. 통지는 긴급조치(회수·삭제 등)가 필요한 동안 늦출 수 있을 뿐, 사유가 해소되면 즉시 알려야 한다.","basis":"개인정보 보호법 시행령 제40조제1항 단서, 제39조제1항제1호, 교육부 개인정보 보호지침 제13조제2항"},{"stage":"조치·이행","when":"신고 후 추가 확인 시","who":"학교","what":"추가 신고·추가 통지","detail":"처음 신고 때 항목·경위를 다 확인 못 했으면 확인된 내용부터 신고하고, 추가로 확인되는 내용은 확인 즉시 신고한다.","basis":"개인정보 보호법 시행령 제40조제2항, 교육부 개인정보 보호지침 제13조제5항"},{"stage":"초기 대응","when":"통지 직후","who":"분야별책임자","what":"민원 창구 단일화","detail":"전화·메일 등 한 가지 이상 창구를 정해 학부모 문의를 한곳에서 받는다. 다른 교직원이 문의를 받으면 그 창구로 연결한다. 비밀번호가 나갔으면 변경 방법을, 다량 유출이면 보이스피싱 등 2차 피해 예방을 함께 안내한다.","basis":"서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 2.3~2.5"},{"stage":"조사·확인","when":"신고 후","who":"학교(개인정보 보호책임자)","what":"원인 조사와 재발방지 계획","detail":"유출 원인을 조사하고 ①원인 보완·재발방지 조치계획 수립·이행 ②전 직원 사례 전파·재발방지 교육 ③그 밖에 필요한 조치를 한다. 사례 전파 때 유출자 등 또 다른 개인정보가 드러나지 않게 한다.","basis":"교육부 개인정보 보호지침 제14조제1항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 4.2"},{"stage":"조사·확인","when":"교육청이 필요하다고 볼 때","who":"교육감·교육부장관","what":"자료제출 요구·현장 조사","detail":"교육감·교육부장관은 신고를 받고 필요하면 자료 제출을 요구하거나 전문기관과 함께 조사할 수 있고, 학교는 특별한 사정이 없으면 따라야 한다. 조사는 익명처리 등으로 관련자 사생활 침해를 최소화한다.","basis":"교육부 개인정보 보호지침 제14조제2항·제3항"},{"stage":"조치·이행","when":"조치 완료 후","who":"학교","what":"조치확인서 제출·결과 보고","detail":"서울시교육청 매뉴얼은 조치 결과를 '개인정보 유출등 신고 조치확인서'로 작성해 제출하도록 안내한다. 이 서식과 제출 경로는 서울시 예시이므로 소속 교육청의 최신 공문을 확인한다.","basis":"교육부 개인정보 보호지침 제14조, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 2.2"},{"stage":"심의·결정","when":"위반 혐의가 있을 때","who":"개인정보보호위원회","what":"자료제출 요구·출입 검사","detail":"보호위원회는 법 위반 혐의를 알게 되거나 신고·민원을 받으면 관계 물품·서류 제출을 요구하고, 사무소에 출입해 검사할 수 있다. 자료를 숨기거나 거짓 제출하면 과태료·형사처벌 대상이다.","basis":"개인정보 보호법 제63조, 제73조제1항제4호·제5호, 제75조제2항제25호·제26호"},{"stage":"심의·결정","when":"조사 결과에 따라","who":"개인정보보호위원회","what":"시정조치·과징금·과태료·고발·징계권고·공표","detail":"보호위원회는 시정조치 명령(중앙행정기관·지자체 등은 권고), 과징금, 과태료, 수사기관 고발, 책임자 징계권고를 할 수 있고 그 내용을 공표할 수 있다. 정보주체에게 통지하지 않거나 보호위원회·한국인터넷진흥원에 신고하지 않으면(법 제34조제4항 신고) 3천만원 이하 과태료 대상이다.","basis":"개인정보 보호법 제64조, 제64조의2, 제65조, 제66조, 제75조제2항제17호·제18호"},{"stage":"심의·결정","when":"징계권고·자체 감사 시","who":"교육청(징계권자)","what":"관련 교직원 징계 검토","detail":"보호위원회가 징계를 권고하면 권고를 받은 사람은 이를 존중하고 그 결과를 보호위원회에 통보해야 한다. 교원 징계는 교육공무원 징계 절차에 따른다.","basis":"개인정보 보호법 제65조제2항"},{"stage":"불복·구제","when":"정보주체가 원할 때","who":"피해를 입은 정보주체(필요한 경우 법정대리인 등)","what":"개인정보 분쟁조정 신청","detail":"개인정보 분쟁조정위원회에 조정을 신청할 수 있다. 위원회는 신청일부터 60일 이내에 조정안을 작성하고, 조정안을 받은 날부터 15일 안에 수락 여부를 알리지 않으면 수락한 것으로 본다. 성립한 조정은 재판상 화해와 같은 효력. 같은 유형 피해가 여럿이면 집단분쟁조정도 있다. 학교는 통지를 받으면 특별한 사유가 없으면 조정에 응해야 한다.","basis":"개인정보 보호법 제43조, 제44조, 제47조, 제49조"},{"stage":"불복·구제","when":"정보주체가 원할 때","who":"피해를 입은 정보주체(필요한 경우 법정대리인 등)","what":"손해배상 청구","detail":"법 위반으로 손해를 입으면 손해배상을 청구할 수 있고, 처리자가 고의·과실 없음을 입증해야 한다. 고의·과실로 유출된 경우 손해액 증명 없이 300만원 이하 법정손해배상을 청구할 수도 있다. 고의·중과실 유출은 손해액의 5배 이내 배상.","basis":"개인정보 보호법 제39조, 제39조의2"},{"stage":"불복·구제","when":"처분을 받은 경우","who":"처분을 받은 기관","what":"보호위원회 처분에 대한 불복","detail":"과징금 등 행정처분에 대한 일반 불복은 행정심판(처분이 있음을 알게 된 날부터 90일, 처분이 있었던 날부터 180일)·행정소송(안 날부터 90일, 있은 날부터 1년)으로 한다. 과태료 불복 절차는 여기서 확인하지 못했다.","basis":"행정심판법 제27조, 행정소송법 제20조"},{"stage":"종결·사후","when":"사안 종료 후","who":"학교 전체","what":"재발방지 이행 점검","detail":"개인정보 파일 전송 전 수신자 재확인, 엑셀은 PDF로 변환해 게시, USB·출력물 관리, 단체 채팅방에 명단 올리지 않기 등 원인별 대책을 학교 내부관리계획에 반영하고 전 직원 교육을 한다.","basis":"교육부 개인정보 보호지침 제14조제1항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 4장"}],"deadlines":[{"what":"정보주체 통지","limit":"유출등을 알게 된 때부터 72시간 이내(긴급 회수·삭제 조치 중이거나 천재지변 등은 사유 해소 후 즉시)","basis":"개인정보 보호법 시행령 제39조제1항"},{"what":"교육부 행정 보고(상급기관 경유)","limit":"1명이라도 유출되면 알게 된 때부터 72시간 내 신고해야 함(교육부 지침) — 소속 교육청 보고 절차도 확인","basis":"교육부 개인정보 보호지침 제13조제1항(훈령 제476호, 2024.2.7.)"},{"what":"개인정보보호위원회·한국인터넷진흥원 신고","limit":"1천명 이상·민감정보·고유식별정보·외부 불법접근이면 72시간 이내, 교육부 신고와 동시에","basis":"개인정보 보호법 시행령 제40조제1항, 교육부 개인정보 보호지침 제13조제1항 단서"},{"what":"통지 갈음 홈페이지 게시","limit":"30일 이상","basis":"개인정보 보호법 시행령 제39조제3항"},{"what":"분쟁조정위원회 조정안 작성","limit":"신청받은 날부터 60일 이내(연장 가능)","basis":"개인정보 보호법 제44조"},{"what":"조정안 수락 여부 회신","limit":"조정안을 받은 날부터 15일(무응답이면 수락 간주)","basis":"개인정보 보호법 제47조제3항"}],"dont":["회수·삭제만 하고 통지·신고를 빼먹지 않는다 — 통지는 회수·삭제와 관계없이 해야 하고, 교육부 지침은 1명이라도 신고 대상이다(회수·삭제로 권익 침해 가능성이 현저히 낮아진 경우의 신고 예외도 혼자 판단하지 않는다)","72시간을 '근무일'로 세지 않는다 — 알게 된 시각부터 시간으로 센다","학급 단톡방·학부모 단톡방에 사과문과 함께 유출 내용을 다시 올리지 않는다 — 추가 유출이다","유출 결과를 전체 공지로 알리지 않는다 — 정보주체가 본인 것만 확인하게 한다","재발방지 사례 전파 때 유출자·피해자 이름을 쓰지 않는다","개인 폰·개인 메일로 수습 연락을 돌리지 않는다 — 창구를 하나로 정한다"],"contacts":[{"name":"교육부 개인정보보호 포털(유출 신고)","tel":"","note":"privacy.moe.go.kr 유출신고 메뉴"},{"name":"개인정보 포털(보호위원회·KISA 신고)","tel":"","note":"privacy.go.kr — 1천명 이상·민감·고유식별·해킹일 때"},{"name":"한국인터넷진흥원 사이버민원·상담센터","tel":"118","note":"국번 없이 118(개인정보위 2026.9. 안내서 문의처)"}],"forms":["개인정보 유출등 신고서(교육부 개인정보 보호지침 별지 제5호서식)","정보주체 유출등 통지문(서울시교육청 매뉴얼 붙임2 표준 통지문 예시 참고)","개인정보 유출등 신고 조치확인서(서울시교육청 매뉴얼 붙임4 예시 — 소속 교육청 서식 확인)","수신자 삭제 확인 증빙(삭제 전·후 목록 화면 — 서울시교육청 매뉴얼 3.3 예시)","원인 조사·재발방지 조치계획"],"law":[{"name":"개인정보 보호법","article":"제34조(개인정보 유출등의 통지ㆍ신고)","point":"알게 되면 지체 없이 정보주체에게 7개 항목 통지, 회수·삭제 등 피해 최소화 조치, 대통령령에 따라 보호위원회·전문기관 신고(2026.3.10. 개정, 2026.9.11. 시행)"},{"name":"개인정보 보호법 시행령","article":"제39조(개인정보 유출 등의 통지)","point":"서면등으로 72시간 이내 통지. 긴급조치 필요·천재지변은 해소 후 즉시. 연락처 모르면 홈페이지 30일 이상 게시로 갈음"},{"name":"개인정보 보호법 시행령","article":"제40조(개인정보 유출 등의 신고)","point":"1천명 이상·민감정보/고유식별정보·외부 불법접근이면 72시간 이내 보호위원회 또는 한국인터넷진흥원 신고. 회수·삭제로 침해 가능성이 현저히 낮아지면 신고하지 않을 수 있음"},{"name":"교육부 개인정보 보호지침(교육부훈령 제476호)","article":"제13조(개인정보 유출등의 신고)","point":"각급학교 포함 교육기관은 1명이라도 유출되면 72시간 내 상급기관 경유 교육부 신고, 요건 해당 시 보호위원회에 동시 신고"},{"name":"교육부 개인정보 보호지침","article":"제14조(개인정보의 유출등 조사)","point":"원인 조사, 재발방지 계획, 전 직원 사례 전파·교육. 교육감의 자료제출 요구·조사"},{"name":"개인정보 보호법","article":"제39조·제39조의2","point":"손해배상(입증책임 전환), 고의·과실 유출 시 300만원 이하 법정손해배상"},{"name":"개인정보 보호법","article":"제75조제2항제17호·제18호","point":"정보주체에게 통지하지 않거나 보호위원회·전문기관(한국인터넷진흥원)에 신고하지 않으면 3천만원 이하 과태료"},{"name":"개인정보 보호법 시행령","article":"제32조제2항제1호사목","point":"각급 학교의 개인정보 보호책임자는 해당 학교의 행정사무를 총괄하는 사람"}],"faq":[{"q":"성적표를 다른 학부모 한 명에게 잘못 보냈고, 그 학부모가 바로 지웠다고 합니다. 그래도 신고해야 하나요?","a":"통지는 해야 합니다. 신고는 교육부 지침상 1명이라도 대상이지만, 유출 경로가 확인되고 회수·삭제로 권익 침해 가능성이 현저히 낮아졌다면 신고하지 않을 수 있다는 예외가 시행령 제40조와 교육부 지침 제13조제2항에 있습니다. 판단은 혼자 하지 말고 보호책임자와 하고, 삭제 확인 증빙을 요청해 두세요."},{"q":"72시간은 주말·공휴일을 빼고 세나요?","a":"시행령은 '알게 되었을 때에는 72시간 이내'로만 정하고 있어 시간으로 셉니다. 통지는 회수·삭제 등 긴급한 조치가 필요한 경우나 천재지변 등 부득이한 사유가 있을 때(시행령 제39조제1항), 보호위원회 신고는 천재지변 등 부득이한 사유가 있을 때(시행령 제40조제1항) 사유 해소 후 즉시로 늦출 수 있습니다."},{"q":"학생 건강 정보(질병·장애)가 포함된 명단이 나갔어요.","a":"건강 정보는 민감정보입니다. 인원과 관계없이 교육부 신고와 동시에 개인정보보호위원회 또는 한국인터넷진흥원에도 72시간 이내 신고해야 합니다(시행령 제40조제1항제2호, 교육부 지침 제13조제1항제2호)."},{"q":"USB를 잃어버렸는데 누가 봤는지 모르겠어요.","a":"분실도 '유출등'에 포함됩니다(분실·도난·유출 등). 제3자가 볼 수 있는 상태가 되었는지, 암호화 여부를 확인하고 보고하세요. 서울시교육청 매뉴얼은 암호화된 정보가 유출돼도 유출에 해당한다고 안내합니다."},{"q":"통지문에 무엇을 적어야 하나요?","a":"법 제34조제1항의 통지사항은 ①유출 항목 ②시점과 경위 ③정보주체의 피해 최소화 방법 ④처리자의 대응조치·피해구제 절차 ⑤신고·상담 부서와 연락처 ⑥손해배상·법정손해배상·분쟁조정 등 법적 권리와 행사 방법 ⑦그 밖에 대통령령으로 정하는 사항입니다. 개인정보위 2026.9. 안내서는 계정 보호방법(비밀번호 변경 등)을 피해 최소화 방법과 함께 안내할 수 있고, 유출 여부 조회 절차를 마련할 수 있다고 안내합니다. 항목·경위를 확인하지 못한 경우 시행령 제39조제2항의 우선 통지를 적용합니다."},{"q":"교사 개인도 처벌받나요?","a":"과징금·시정조치는 개인정보처리자(기관)에 대한 것이고, 책임자에 대해서는 보호위원회가 징계를 권고할 수 있습니다(제64조의2, 제65조제2항). 업무상 알게 된 개인정보를 고의로 누설하거나 권한 없이 제공하면 5년 이하 징역 또는 5천만원 이하 벌금 대상입니다(제71조제9호). 개별 사안의 징계 수위는 이 자료로 단정할 수 없습니다."}],"record":"생활기록부 기재 사항 없음. 교육부 개인정보보호 포털에 유출등 신고서(별지 제5호서식) 제출, 상급기관(교육지원청·교육청) 보고 공문. 서울시교육청 매뉴얼은 유·초·중학교는 교육지원청을 거쳐 본청, 고등·특수학교는 본청에 보고하도록 안내한다. 이 보고 경로는 서울시 예시이므로 소속 교육청의 최신 공문을 확인한다.","deep":[{"title":"'유출등'은 어디까지인가","body":["법은 분실·도난·유출·위조·변조·훼손을 묶어 '유출등'이라고 부른다. 잘못 보낸 문자·메일, 단톡방에 올린 명단, 잃어버린 USB·출력물, 홈페이지 첨부파일 노출이 모두 들어간다.","표준 개인정보 보호지침(서울시교육청 매뉴얼 인용)은 개인정보가 처리자의 관리·통제권을 벗어나 제3자가 그 내용을 알 수 있는 상태에 이른 것을 유출로 본다. 암호화된 정보가 나가도 유출에 해당한다고 매뉴얼은 안내한다."],"basis":"개인정보 보호법 제23조제2항, 서울시교육청 유출등 사고 대응 매뉴얼(2025.3.) 1.3"},{"title":"통지와 신고는 다른 의무다","body":["통지는 정보주체에게 알리는 절차이고, 신고는 법정 요건에 해당할 때 감독기관 또는 전문기관에 알리는 절차다. 실제 유출 통지는 시행령상 72시간 이내가 원칙이며, 신고도 법정 기준에 해당하면 72시간 이내다. 교육부 내부 신고 절차는 교육부 지침을 별도로 확인한다.","회수·삭제로 침해 가능성이 현저히 낮아졌을 때의 '안 해도 되는' 예외는 신고에만 있다. 통지는 회수·삭제 같은 긴급조치가 필요한 동안만 늦출 수 있고, 사유가 해소되면 즉시 알려야 한다."],"basis":"개인정보 보호법 시행령 제39조·제40조"},{"title":"학교는 신고 문턱이 더 낮다","body":["일반 처리자는 1천명 이상·민감·고유식별·해킹일 때만 보호위원회 신고 대상이지만, 교육부 개인정보 보호지침은 각급학교를 포함한 교육기관에 '1명이라도' 유출되면 상급기관을 거쳐 교육부에 신고하도록 정한다.","위 세 가지 요건(1천명 이상, 민감·고유식별정보, 외부 불법접근) 중 하나에 해당하면 교육부와 보호위원회(또는 한국인터넷진흥원)에 동시에 신고한다. 시간이 없으면 전화로 먼저 신고하고 신고서를 나중에 낸다."],"basis":"교육부 개인정보 보호지침 제13조"},{"title":"2026년 9월 11일부터 바뀐 것","body":["개정 개인정보 보호법(2026.3.10. 공포)과 시행령(2026.9.10. 개정)이 2026.9.11. 시행됐다. 법 제34조제1항 통지사항은 7개로 정비됐으며, 제6호에 손해배상·법정손해배상·분쟁조정 등 정보주체의 법적 권리와 행사 방법, 제7호에 그 밖에 대통령령으로 정하는 사항이 들어간다. 개인정보위의 2026.9. 안내서는 피해 최소화 방법의 예로 비밀번호 변경 등 계정 보호조치를 들고, 유출 여부 조회 절차를 마련할 수 있다고 설명한다.","법 제34조제2항·시행령 제39조의2는 ①처리시스템 또는 처리 기기에 불법 접근이 발생하고 유출 의심 정황은 있으나 정보주체를 특정하기 어려운 경우, ②일부 개인정보가 위법하게 제3자에게 거래되는 등 실제 유출이 확인되어 다른 정보주체 정보도 유출됐을 수 있는 경우를 규정한다. 해당 사실을 안 때부터 72시간 이내 가능성 통지를 하고, 실제 유출이 확인되면 법 제34조제1항 통지로 갈음하며, 유출되지 않은 사실이 확인되면 그 사실을 즉시 알려야 한다. 연락처를 알 수 없는 등 정당한 사유가 있는 경우의 게시 갈음은 시행령 요건에 따른다.","개정된 제34조제1항·제4항은 2026.9.11. 이후 유출등을 알게 된 경우부터, 제34조제2항(가능성 통지)은 그 이후 유출등의 가능성을 알게 된 경우부터 적용된다(부칙 제2조)."],"basis":"개인정보 보호법 제34조, 부칙(법률 제21445호) 제2조, 시행령 제39조의2·제39조의3"},{"title":"사고 뒤에 오는 것: 조사·제재·배상","body":["교육청은 신고를 받고 자료 제출을 요구하거나 조사할 수 있다. 보호위원회는 자료제출 요구·출입검사 뒤 시정조치(중앙행정기관·지자체 등에는 권고), 과징금, 과태료, 고발, 징계권고를 할 수 있고 결과를 공표할 수 있다.","피해를 입은 정보주체는 분쟁조정(60일 내 조정안, 15일 무응답 시 수락 간주, 재판상 화해 효력)이나 손해배상 소송(법정손해배상 300만원 이하 포함)을 택할 수 있다."],"basis":"교육부 개인정보 보호지침 제14조, 개인정보 보호법 제39조~제39조의2, 제43조~제47조, 제63조~제66조, 제75조"}],"tables":[{"title":"통지·신고 한눈에","head":["구분","대상","기한","예외·유의"],"rows":[["정보주체 통지","유출등 관련 정보주체(개인정보 당사자)","알게 된 때부터 72시간 이내","긴급 회수·삭제 조치 중·천재지변은 사유 해소 후 즉시. 연락처 불명이면 홈페이지 30일 이상 게시"],["교육부 행정 보고","1명 이상 유출(상급기관 경유)","72시간 내(교육부 지침상 의무)","교육부 지침 기준. 법정 보호위·KISA 신고와 별개이며, 최신 교육청 절차 확인"],["보호위원회·KISA 신고","1천명 이상 / 민감·고유식별정보 / 외부 불법접근","72시간 이내, 교육부 신고와 동시","같은 예외 적용"],["유출 가능성 통지(2026.9.11. 시행)","불법접근 후 정보주체 특정이 곤란하거나, 일부 유출 확인으로 다른 정보주체 정보도 유출됐을 가능성이 있는 경우","72시간 이내","시행령 제39조의2·제39조의3"]],"note":"개인정보 보호법 제34조, 시행령 제39조·제39조의3·제40조, 교육부 개인정보 보호지침 제13조"},{"title":"사고 뒤 제재·구제 수단","head":["수단","누가","내용","근거"],"rows":[["과태료","보호위원회","통지 안 함·보호위원회(KISA) 신고 안 함: 3천만원 이하","제75조제2항제17호·제18호"],["과징금","보호위원회","유출 시 부과 가능(안전조치를 다한 경우 제외). 매출액 없으면 20억원 이하","제64조의2제1항제9호"],["시정조치·권고","보호위원회","침해 중지·처리 정지 등. 중앙행정기관·지자체 등은 권고","제64조"],["고발·징계권고","보호위원회","범죄 혐의 시 고발, 책임자 징계권고(결과 통보 의무)","제65조"],["분쟁조정","정보주체","60일 내 조정안, 15일 무응답 시 수락, 재판상 화해 효력","제43조~제47조"],["손해배상","정보주체","입증책임 전환, 법정손해배상 300만원 이하, 고의·중과실 5배 이내","제39조·제39조의2"]],"note":"공립학교(교육청 소속)에 과징금·시정명령이 실제 어떻게 적용되는지는 이 자료로 확인하지 못했다."}],"sources":[{"title":"개인정보 유출등 대응 안내서(2026.9.)","publisher":"개인정보보호위원회","year":2026,"url":"https://pipc.go.kr/np/cop/bbs/selectBoardArticle.do?bbsId=BS217&mCode=I030010000&nttId=12465"},{"title":"개인정보 보호법 (시행 2026.9.11., 법률 제21445호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/개인정보보호법"},{"title":"개인정보 보호법 시행령 (시행 2026.9.11., 대통령령 제36671호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/개인정보보호법시행령"},{"title":"교육부 개인정보 보호지침 (교육부훈령 제476호, 2024.2.7. 전부개정)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육부개인정보보호지침"},{"title":"서울특별시교육청 개인정보 유출등 사고 대응 매뉴얼 (2025.3.)","publisher":"서울특별시교육청","year":2025,"url":"https://www.sen.go.kr/component/file/ND_fileDownload.do?q_fileSn=2191162&q_fileId=fe114b27-eeb7-489c-97c4-1073715a30c5"},{"title":"교육분야 개인정보 유출등사고 대응 매뉴얼 개정본 (교육부 개인정보보호포털 참고자료, 2026.5.28. 게시)","publisher":"교육부 개인정보보호포털","year":2026,"url":"https://privacy.moe.go.kr/privacy/page.do?mnu_uid=93"},{"title":"행정심판법·행정소송법 (제소·청구 기간)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/행정심판법"}],"verified":"2026-09-24","uncertain":["교육부 개인정보보호 포털에 2026.5.28. 게시된 교육분야 대응 매뉴얼 본문은 공개 열람이 제한되어 직접 대조하지 못했다. 교육부 지침은 국가법령정보센터 현행본(훈령 제476호, 2024.2.7. 시행)으로 확인했다. 이 지침의 1명 이상 교육부 행정 보고 기준이 2026.9.11. 개정 법령 이후 교육청에서 어떻게 운영되는지는 직접 확인하지 못했으므로 현행 교육청 공문을 따른다.","학교급별 보고 경로·조치확인서 서식·담당 부서 전화번호는 소속 교육청 공문에서 확인한다","학교 개인정보 보호책임자가 교장인지 교감·행정실장인지 — 시행령은 '학교의 행정사무를 총괄하는 사람', 학교 개인정보 처리방침에서 확인","공립학교에 보호위원회 과징금·시정명령이 적용되는 구체 범위, 과태료 불복 절차","유출 교직원 징계 양정(교육공무원 징계기준 별표)은 원문 별표를 확인하지 못함","교육부 지침(훈령 제476호, 2024)은 2026.9.11. 시행된 법 개정 이후 개정 여부가 확인되지 않아 법정 유출 가능성 통지 상세절차의 근거로 사용하지 않는다. 가능성 통지는 현행 법·시행령 및 개인정보위 2026.9. 안내서를 기준으로 한다.","신고 예외(시행령 제40조제1항 단서·교육부 지침 제13조제2항)를 학교 안에서 누가 판단하는지(개인정보 보호책임자인지)는 원문 확인 필요","교육분야 개인정보 유출등사고 대응 매뉴얼 개정본(2026)의 발행 주체(교육부·한국교육학술정보원 공동 여부)는 원문 확인 필요 — 포털 게시일 2026-05-28만 확인","교사 개인 실수 유출에 대한 과태료 부과 대상(기관인지 개인인지)은 원문 확인 필요","삭제 확인 자료(화면 캡처 등)의 허용 형식·보관 위치·보존기간은 시도교육청 및 학교 개인정보 내부관리계획을 확인한다. 민감정보가 포함된 캡처를 개인 기기·일반 메신저로 주고받지 않는다."],"related":["student-photo-sns"]}],"contacts":[{"name":"경찰(범죄·긴급 신고)","tel":"112","hours":"24시간","for":"폭행·성범죄·아동학대 등 범죄와 긴급상황 신고, 학교폭력·사이버폭력 긴급상황","source":"교육부 2026년도 학교폭력 사안처리 가이드북(일부개정) 교외 신고방법; 교육부 교육활동 보호 매뉴얼(2026) 31쪽","group":"전국 공통"},{"name":"소방(화재·구조·구급)","tel":"119","hours":"24시간","for":"화재, 구조, 응급환자 이송","source":"교육부 학교현장 재난유형별 교육·훈련 매뉴얼(2024.12.) 119 신고 절차; 24시간은 소방기본법 시행규칙 제2조 제3항 «종합상황실은 24시간 운영체제를 유지하여야 한다»","group":"전국 공통"},{"name":"학교폭력 신고센터","tel":"117","hours":"24시간","for":"학교폭력 신고·상담(경찰청 운영). 신고 즉시 긴급구조·수사·법률상담·연계지원, 안전Dream 누리집으로도 신고","source":"교육부 2026년도 학교폭력 사안처리 가이드북 25~26쪽·28쪽; 경찰청 안전Dream(safe182.go.kr) «아동·여성·장애인 경찰지원센터: 182, 117». 문자 단축번호는 공식 안내가 일치하지 않아 제외.","group":"전국 공통"},{"name":"경찰청 실종아동찾기센터(안전Dream)","tel":"182","hours":"24시간 신고 접수·처리","for":"18세 미만 아동, 치매환자, 지적·자폐성·정신장애인 등의 실종·보호 신고(국번 없이 182, 유료)","source":"경찰청 안전Dream 공식 안내(m.safe182.go.kr/mob/intro/intro182.do, safe182.go.kr «국번없이 182(유료)»); 성범죄·가정폭력·학대 긴급신고는 112","group":"전국 공통"},{"name":"자살예방상담전화","tel":"109","hours":"24시간","for":"자살 위기 상담(2024.1.1.부터 자살예방 상담번호를 109로 통합). SNS 상담 '마들랜' 별도 운영","source":"보건복지부 보도자료 «분산된 자살예방 상담전화 1월 1일부터 109로 통합 운영»(2024.1.2.); 보건복지상담센터 129.go.kr/109 «24시간 자살예방상담전화 109»","group":"전국 공통"},{"name":"청소년상담 1388","tel":"1388","hours":"365일 24시간","for":"청소년 전화상담(심리·학교·가정·진로 상담 등)","source":"청소년1388 포털(1388.go.kr) «365일 24시간»; 한국청소년상담복지개발원 누리집(kyci   { k: 'family', name: '보호자·학생', re: /보호자|학부모|부모|학생|피해자 측|가해자 측|정보주체/ }
];
function laneOf(who){
  const w = String(who || '');
  // 여러 주체가 섞이면 앞에 적힌 쪽을 따른다
  let best = null, pos = 1e9;
  for (const L of LANES){ const m = w.match(L.re); if (m && m.index < pos){ pos = m.index; best = L.k; } }
  return best || 'teacher';
}
const PHASES = [
  { k: '알게 됨·신고', sub: '발견·신고·접수', re: /인지|발견|알게|신고|접수|최초|즉시 보고/ },
  { k: '초기 대응', sub: '보호·분리·응급', re: /분리|보호|응급|긴급|안정|119|격리|대피|귀가/ },
  { k: '조사·확인', sub: '조사·면담·수사', re: /조사|확인|면담|진술|증거|수사|역학/ },
  { k: '심의·결정', sub: '위원회·결정', re: /심의|위원회|결정|의결|자체해결|판정/ },
  { k: '조치·이행', sub: '조치·기록·지급', re: /이행|특별교육|기재|통보|지급|보상|조치/ },
  { k: '불복·구제', sub: '행정심판·소송', re: /행정심판|행정소송|집행정지|이의|재심|불복|청구/ },
  { k: '종결·사후', sub: '회복·삭제·관리', re: /종결|사후|삭제|졸업|관계회복|복귀|모니터링|추수|재발/ }
];
PHASES.forEach(p => { p.name = p.k; });
function phaseOf(s, prev){
  const want = String(s.stage || '').replace(/\s/g, '');
  let idx = PHASES.findIndex(p => p.k.replace(/\s/g, '') === want);
  if (idx < 0){
    const t = (s.what || '') + ' ' + (s.when || '');
    idx = PHASES.findIndex(p => p.re.test(t));
    if (idx < 0 || idx < prev) idx = prev;   // 모르면 앞 단계를 이어 간다
  }
  return idx;
}
function layoutSteps(c){
  let prev = 0;
  return (c.steps || []).map((s, i) => {
    const p = phaseOf(s, prev);
    prev = p;
    return { i, s, lane: s.lane || laneOf(s.who), phase: p };
  });
}

/* ---------- 검색 ---------- */
const norm = s => String(s || '').toLowerCase().replace(/\s+/g, '');
function prep(c){
  if (c._txt) return;
  const parts = [c.summary, (c.first||[]).join(' '), (c.steps||[]).map(s => [s.what, s.detail, s.who].join(' ')).join(' '),
    (c.dont||[]).join(' '), (c.faq||[]).map(f => f.q + ' ' + f.a).join(' '), (c.law||[]).map(l => l.name + l.article).join(' '), c.record];
  c._txt = norm(parts.join(' '));
  c._t = norm(c.title); c._aka = (c.aka||[]).map(norm);
}
function score(c, q){
  const words = q.split(/\s+/).filter(Boolean).map(norm);
  if (!words.length) return 1;
  prep(c);
  let s = 0;
  for (const w of words){
    if (c._t.includes(w)) s += 12;
    else if (c._aka.some(a => a.includes(w) || (a.length >= 2 && w.includes(a)))) s += 9;
    else if (c._txt.includes(w)) s += 3;
    else if (w.length >= 3 && (c._t + c._aka.join('')).includes(w.slice(0, 2))) s += 1;
    else return 0;
  }
  return s;
}
function snippet(c, q){
  const w = norm(q.split(/\s+/)[0] || '');
  if (!w || c._t.includes(w) || c._aka.some(a => a.includes(w))) return '';
  const pool = [...(c.first||[]), ...(c.steps||[]).map(s => s.what + (s.detail ? ' — ' + s.detail : '')), ...(c.faq||[]).map(f => 'Q. ' + f.q), ...(c.dont||[])];
  const hit = pool.find(t => norm(t).includes(w));
  return hit ? (hit.length > 80 ? hit.slice(0, 80) + '…' : hit) : '';
}

  const keys = ROLE_GROUPS[r] || [r];
  const all = [...(c.roles||[]), ...(c.steps||[]).map(s => s.who || '')].join(' ');
  return keys.some(k => all.includes(k));
}

}

/* ---------- 기한 계산 ---------- */
function parseLimit(t){
  const s = String(t || '');
  let m;
  if ((m = s.match(/(\d+)\s*시간/))) return { h: +m[1] };
  if ((m = s.match(/(\d+)\s*(영업일|근무일|평일)/))) return { bd: +m[1] };
  if ((m = s.match(/(\d+)\s*일\s*(이내|안|까지|내|전)/))) return { d: +m[1] };
  if ((m = s.match(/(\d+)\s*주\s*(이내|안|까지|내)/))) return { d: +m[1] * 7 };
  if (/즉시|지체 ?없이|바로|당장/.test(s)) return { now: true };
  if (/당일/.test(s)) return { today: true };
  return null;
}
const DOW = '일월화수목금토';
function fmt(d, withTime){
  const p = n => String(n).padStart(2, '0');
  return `${d.getMonth() + 1}월 ${d.getDate()}일(${DOW[d.getDay()]})` + (withTime ? ` ${p(d.getHours())}:${p(d.getMinutes())}` : '');
}
function dueText(lim, base){
  const L = parseLimit(lim);
  if (!L || !base) return '';
  if (L.now) return '<span style="color:var(--err)">바로</span>';
  if (L.today) return fmt(base) + ' 안';
  if (L.h) return fmt(new Date(base.getTime() + L.h * 3600e3), true) + '까지';
  if (L.d){ const d = new Date(base); d.setDate(d.getDate() + L.d); return fmt(d) + '까지<small>달력일 기준 · 첫날 셈법은 원문 확인</small>'; }
  if (L.bd){ const d = new Date(base); let n = L.bd; while (n > 0){ d.setDate(d.getDate() + 1); if (d.getDay() % 6) n--; } return fmt(d) + '까지<small>주말 뺌 · 공휴일은 따로 빼세요</small>'; }
  return '';
}

// 마우스 말풍선(마우스가 있는 기기만)
const canHover = window.matchMedia('(hover:hover) and (pointer:fine)').matches;
function showTip(el, s, i){
  if (!canHover) return;
  const t = document.getElementById('tip');
  const how = (s.how || []).slice(0, 4);
  t.innerHTML = `<b>S${String(i + 1).padStart(2, '0')} ${esc(s.what)}</b><div class="tw">${esc([s.when, s.who].filter(Boolean).join(' · '))}</div>${s.detail ? esc(s.detail) : ''}${how.length ? `<ol>${how.map(h => `<li>${esc(h)}</li>`).join('')}</ol>` : ''}<div class="more">눌러서 자세히 보기</div>`;
  const r = el.getBoundingClientRect();
  t.classList.add('on');
  const tw = t.offsetWidth, th = t.offsetHeight;
  let x = r.right + 10, y = r.top;
  if (x + tw > innerWidth - 8) x = r.left - tw - 10;
  if (x < 8) x = Math.min(innerWidth - tw - 8, Math.max(8, r.left));
  if (y + th > innerHeight - 8) y = Math.max(8, innerHeight - th - 8);
  t.style.left = x + 'px'; t.style.top = y + 'px';
}
function hideTip(){ const t = document.getElementById('tip'); if (t) t.classList.remove('on'); }
window.addEventListener('scroll', hideTip, { passive: true });
// 흐름도 화살표: 단계 번호 순서대로 잇는다
function drawArrows(){
  const flow = document.getElementById('flow'), svg = document.getElementById('arrows');
  if (!flow || !svg || !flowState || flow.offsetParent === null) return;
  const sc = document.getElementById('flowscroll');
  // 화면에 다 들어오면 머리 줄을 붙여 둔다(내려도 단계 이름이 보이게)
  sc.classList.remove('fit'); if (flow.scrollWidth <= sc.clientWidth + 1) sc.classList.add('fit');
  const fr = flow.getBoundingClientRect();
  const R = i => { const n = flow.querySelector(`.node[data-n="${i}"]`); if (!n) return null; const r = n.getBoundingClientRect(); return { l: r.left - fr.left, r: r.right - fr.left, t: r.top - fr.top, b: r.bottom - fr.top, cx: (r.left + r.right) / 2 - fr.left, cy: (r.top + r.bottom) / 2 - fr.top }; };
  svg.setAttribute('width', fr.width); svg.setAttribute('height', fr.height);
  svg.setAttribute('viewBox', `0 0 ${fr.width} ${fr.height}`);
  let d = '';
  const n = flowState.L.length;
  const cellL = i => { const nd = flow.querySelector(`.node[data-n="${i}"]`); return nd.parentElement.getBoundingClientRect().left - fr.left; };
  for (let i = 0; i < n - 1; i++){
    const a = R(i), b = R(i + 1); if (!a || !b) continue;
    const gx = cellL(i + 1) + 8;           // 다음 단계 칸의 왼쪽 여백
    if (cellL(i + 1) > cellL(i) + 2){      // 다음 칸(오른쪽)으로
      d += `M${a.r} ${a.cy} H${gx} V${b.cy} H${b.l - 5}`;
    } else {                               // 같은 열: 왼쪽 여백을 타고 위아래
      d += `M${a.l} ${a.cy} H${gx} V${b.cy} H${b.l - 5}`;
    }
  }
  svg.innerHTML = `<defs><marker id="ah" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 1 L8 5 L0 9z" fill="#8FA3BF"/></marker></defs>` +
    d.split('M').filter(Boolean).map(p => `<path d="M${p}" fill="none" stroke="#A9B8CC" stroke-width="1.4" stroke-linejoin="round" marker-end="url(#ah)"/>`).join('');
}
const redraw = () => { clearTimeout(drawArrows._t); drawArrows._t = setTimeout(drawArrows, 60); };
window.addEventListener('resize', redraw);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(redraw);
const flowRO = window.ResizeObserver ? new ResizeObserver(redraw) : null;

function stepExtra(s, lbl){
  let h = '';
  if (s.how && s.how.length) h += `${lbl ? '<div class="lbl2">하는 법</div>' : ''}<ol class="how">${s.how.map(x => `<li>${esc(x)}</li>`).join('')}</ol>`;
  if (s.check && s.check.length) h += `<div class="xrow ck"><b>놓치기 쉬움</b><span>${s.check.map(esc).join(' · ')}</span></div>`;
  if (s.form) h += `<div class="xrow"><b>서식</b><span>${esc(s.form)}</span></div>`;
  if (s.neis) h += `<div class="xrow"><b>나이스</b><span>${esc(s.neis)}</span></div>`;
  return h;
}

function ctRow(x){
  const tel = x.tel || '';
  const note = [x.for, x.hours, x.note].filter(Boolean).join(' · ');
  return `<div class="ct"><div><div class="nm">${esc(x.name)}</div>${note ? `<div class="nt">${esc(note)}</div>` : ''}</div>${isDialable(tel) ? `<a class="tel num" href="${telHref(tel)}">${esc(tel)}</a>` : (tel ? `<span class="nt">${esc(tel)}</span>` : '')}</div>`;
}
function copy(text, msg){
  const done = () => toast(msg);
  const fallback = () => { const t = document.createElement('textarea'); t.value = text; t.style.position = 'fixed'; t.style.opacity = '0'; document.body.appendChild(t); t.select(); try{ document.execCommand('copy'); }catch(e){} t.remove(); done(); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, fallback); else fallback();
}

function route(){
  const h = location.hash || '#/';
  hideTip(); document.getElementById('drawer').classList.remove('on'); document.getElementById('drawerbg').classList.remove('on');
  let nav = 'home';
  if (h.startsWith('#/c/')) { renderCase(decodeURIComponent(h.slice(4))); nav = ''; }
  else if (h === '#/contacts') { renderContacts(); nav = 'contacts'; }
  else if (h === '#/about') { renderAbout(); nav = 'about'; }
  else if (h === '#' || h.startsWith('#/')) { renderHome(); }
  else return; // #s-… 본문 안 이동
  document.querySelectorAll('[data-nav]').forEach(a => a.classList.toggle('on', a.dataset.nav === nav));
  const c = h.startsWith('#/c/') && BYID[decodeURIComponent(h.slice(4))];
  document.title = c ? c.title + ' · 학교 사안 처리 길잡이' : '학교 사안 처리 길잡이';
}
