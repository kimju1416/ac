되면 교육감 지원 요청(2026.3.1. 학년도부터 시행)"},{"name":"초·중등교육법","article":"제20조의5(교내 스마트기기 사용 제한)","point":"학생은 수업 중 휴대전화 등 스마트기기를 쓰면 안 된다. 예외는 장애·특수교육 보조기기, 교육 목적, 긴급상황 대응으로 학교장·교원이 허용한 경우. 교내 사용·소지를 제한할 수 있고 그 기준·방법·기기 유형은 학칙으로 정할 수 있다(2025.9.16. 공포, 2026.3.1. 시행)"},{"name":"초·중등교육법","article":"제20조의6(아동복지법 적용 배제)","point":"정당한 학생생활지도, 방어·보호를 위한 제지, 개별학생교육지원, 제20조의5제2항에 따른 교내 스마트기기 사용·소지 제한은 아동복지법 제17조제3호·제5호·제6호의 금지행위로 보지 않는다"},{"name":"초·중등교육법","article":"제18조·제18조의2(징계·퇴학 재심)","point":"학칙에 따른 징계, 의견 진술 기회 등 적정 절차, 의무교육 학생 퇴학 금지. 퇴학은 시·도학생징계조정위원회 재심 → 행정심판"},{"name":"초·중등교육법 시행령","article":"제40조의3(학생생활지도)","point":"학업·진로, 보건·안전, 인성·대인관계 등 분야에서 조언·상담·주의·훈육·훈계로 지도. 도구·신체로 고통을 주는 방법 금지"},{"name":"초·중등교육법 시행령","article":"제40조의4(개별학생교육지원의 적용 기준 및 방법)","point":"2회 이상 주의에도 반복·지속하거나 고성·폭언 등으로 심각하게 방해할 때. 교실 내 지정 공간, 교실 외 학교 내 공간, 실외 수업 시 분리 공간에서 상담·학습지원. 복귀 가능하면 즉시 복귀"},{"name":"초·중등교육법 시행령","article":"제31조(학생의 징계 등)","point":"학교 봉사, 사회봉사, 특별교육이수, 1회 10일·연간 30일 이내 출석정지, 퇴학. 경중에 따라 단계적 적용"},{"name":"교원의 학생생활지도에 관한 고시","article":"제2조·제9조~제19조","point":"조언·상담·주의·훈육·훈계·보상의 정의와 방식, 불응 시 조치, 이의제기, 개별학생교육지원(교육부고시 제2026-3호, 2026.3.1. 시행)"},{"name":"초·중등교육법","article":"제18조의6(보호자의 의무)","point":"보호자는 교원의 학생생활지도를 존중·지원하고 교육활동에 협력해야 한다"}],"deep":[{"title":"지도는 단계를 밟는다","body":["기본 순서는 조언·주의 → 훈육 → 훈계다. 주의를 줬는데도 바뀌지 않거나 수업에 지장이 있으면 훈육(지시, 말로 제지, 물품 분리보관 등)을 하고, 그래도 잘못을 인정하지 않으면 훈계(성찰 글쓰기, 원상복구 과제 등)를 한다.","2025 해설서는 훈육 전의 주의가 반드시 당일일 필요는 없고, 학칙상 금지 행동은 바로 말로 제지할 수 있으며, 생명·신체가 위험한 긴급 상황은 곧바로 제지할 수 있다고 안내한다.","칭찬·상 같은 보상도 법정 생활지도 방식이다."],"basis":"생활지도 고시 제11조~제14조; 해설서(2025) 55쪽"},{"title":"2026년부터 달라진 '분리': 개별학생교육지원","body":["예전 고시의 '교실 밖 분리' 조항은 2026년 3월 1일부터 법률(초·중등교육법 제20조의4)의 개별학생교육지원으로 바뀌었다. 조건은 두 가지 중 하나다. 수업 중 2회 이상 주의를 줬는데도 방해를 반복·지속하거나, 고성·폭언 등으로 수업을 심각하게 방해하는 경우.","방법은 교실 안 지정 자리, 교실 밖 학교 안의 안전하고 쾌적한 공간, 실외·학교 밖 수업이면 떨어진 안전한 공간에서 상담이나 학습지원을 하는 것이다. 수업에 다시 참여할 수 있다고 판단되면 바로 복귀시킨다. 별도 공간을 썼다면 교원은 학교장에게 일시·경위를 보고하고 학교장은 보호자에게 알린다.","거부하거나 여러 번 해도 소용없으면 학교장이 보호자에게 인계를 요청해 가정학습을 시킬 수 있고, 이때는 출석으로 인정한다. 인계 요청이 여러 번 반복되면 학교장은 교육감에게 지원을 요청할 수 있고, 교육감은 치료·상담·학습지원 대책을 마련해야 한다."],"basis":"초·중등교육법 제20조의4; 시행령 제40조의4; 생활지도 고시 제19조"},{"title":"휴대전화: 법으로 수업 중 사용 금지","body":["2026년 3월 1일부터 학생은 수업 중 휴대전화 등 스마트기기를 쓰면 안 된다. 예외는 장애·특수교육 보조기기, 교육 목적, 긴급 상황 대응으로 학교장·교원이 허용한 경우뿐이다.","학교장과 교원은 필요하면 수업 시간 외에도 교내 사용·소지를 제한할 수 있고, 그 기준·방법·기기 유형은 학칙으로 정할 수 있다. 수업 중 사용 시 주의를 주고, 2회 이상 주의에도 계속 쓰거나 학칙으로 정한 스마트기기에 해당하면 학칙에 따라 분리 보관할 수 있다. 보관했으면 학교장 보고, 학교장은 보호자 통지."],"basis":"초·중등교육법 제20조의5; 생활지도 고시 제11조제2항·제12조제5항·제6항"},{"title":"몸으로 막아야 할 때","body":["학생의 행동이 자신이나 다른 사람의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 끼칠 우려가 있는 긴급한 경우, 교원은 방어·보호를 위한 제지를 할 수 있다. 피해 대상과 즉시 떼어 놓는 등 행동을 잠시 멈추게 하는 방법이어야 하고, 위험이 사라질 때까지 필요한 최소한만 쓴다.","혼자 하지 않아도 된다. 다른 교직원에게 도움을 요청할 수 있다. 끝나면 학교장에게 지체 없이 보고하고, 학교장은 보호자에게 신속히 알린다. 이렇게 한 정당한 제지는 아동복지법 제17조제3호·제5호·제6호(신체적·정서적 학대, 방임)의 금지행위로 보지 않는다."],"basis":"초·중등교육법 제20조의2제3항~제5항·제20조의6; 시행령 제40조의3제2항"},{"title":"끝까지 가면: 징계와 불복","body":["지속적으로 지도에 불응하면 교원은 학교장에게 징계를 요청할 수 있다. 학교장은 학칙에 따라 징계하되 학생·보호자에게 의견 진술 기회를 주는 등 적정 절차를 거친다. 의도적으로 교육활동을 방해하면 교육활동 침해로 보고 지역교권보호위원회에 올릴 수도 있다.","학생·보호자는 생활지도가 부당하면 14일 안에 학교장에게 이의를 제기하고 학교장은 14일 안에 답한다. 퇴학은 받은 날부터 15일 또는 안 날부터 10일 안에 시·도학생징계조정위원회에 재심을 청구하고(30일 내 결정), 결정에 이의가 있으면 60일 안에 행정심판을 낸다. 그 밖의 징계는 일반 행정심판(안 날부터 90일)·행정소송으로 다툰다."],"basis":"생활지도 고시 제16조·제17조; 초·중등교육법 제18조·제18조의2; 행정심판법 제27조"}],"tables":[{"title":"생활지도 방식 한눈에","head":["방식","뜻","예","근거"],"rows":[["조언","말·글로 정보 제공·권고","사생활 조언은 비공개","고시 제2조제5호·제9조"],["상담","학생·보호자와 문제를 풀어 가는 소통","수업시간 외 원칙, 사전 협의","고시 제2조제6호·제10조"],["주의","위험성·위반 가능성을 지적해 경고","수업 중 스마트기기 사용 제한","고시 제2조제7호·제11조"],["훈육","지시·제지·소지품 조사·물품 분리보관으로 행동 중재","말로 제지, 과업 부여, 휴대전화 보관","고시 제2조제8호·제12조"],["훈계","문제행동을 지적해 잘잘못을 깨닫게 함","대안 행동, 성찰 글쓰기, 원상복구","고시 제2조제9호·제13조"],["보상","바람직한 행동에 동기 부여","칭찬, 상","고시 제2조제10호·제14조"],["개별학생교육지원","일시 분리해 개별 상담·학습지원","교실 내 지정 자리, 교실 밖 안전한 공간","법 제20조의4, 고시 제19조"]],"note":"교원의 학생생활지도에 관한 고시(교육부고시 제2026-3호)."},{"title":"개별학생교육지원 단계","head":["단계","요건","누가","보고·통지","출결"],"rows":[["1. 교실 안 지정 자리","2회 이상 주의에도 반복·지속, 또는 고성·폭언 등 심각한 방해","교원","-","별도 규정 없음"],["2. 교실 밖 학교 안 공간","같음","교원","교원 → 학교장 보고, 학교장 → 보호자 통지","별도 규정 없음"],["3. 보호자 인계·가정학습","개별학생교육지원 거부 또는 여러 번 해도 지속 방해","학교장","학교장이 가정학습 점검","출석 인정"],["4. 교육감 지원 요청","인계 요청이 여러 번 반복","학교장 → 교육감","교육감이 치료·상담·학습지원 대책","-"]],"note":"초·중등교육법 제20조의4, 시행령 제40조의4, 생활지도 고시 제19조. 장소·시간 세부는 학칙."},{"title":"징계 종류와 불복","head":["징계","한도·제한","불복 방법","기간"],"rows":[["학교 봉사·사회봉사·특별교육이수","경중에 따라 단계 적용","행정심판·행정소송(공립)","안 날부터 90일"],["출석정지","1회 10일, 연간 30일 이내","행정심판·행정소송(공립)","안 날부터 90일"],["퇴학","의무교육(초·중) 학생 불가","시·도학생징계조정위원회 재심 → 행정심판","받은 날부터 15일 또는 안 날부터 10일 / 재심 결정 통보 후 60일"]],"note":"초·중등교육법 제18조·제18조의2, 시행령 제31조, 행정심판법 제27조. 사립학교 징계의 불복 경로는 확인하지 못했다."}],"faq":[{"q":"예전처럼 '교실 밖 분리'를 해도 되나요?","a":"2026년 3월 1일부터 법률상 명칭은 '개별학생교육지원'이다. 요건에 해당하면 교실 안 지정 자리, 교실 밖 학교 안의 안전하고 쾌적한 공간, 실외·학교 밖 수업에서는 참여 학생과 떨어진 안전한 공간 중 법령·학칙에 맞는 방법으로 상담·학습지원을 할 수 있다. 교실 밖 별도 공간에서 지원한 경우에는 교원이 학교장에게 보고하고 학교장이 보호자에게 알린다."},{"q":"주의→훈육 순서를 꼭 지켜야 하나요?","a":"원칙은 조언·주의로 안 될 때 훈육이다. 해설서는 앞선 주의가 반드시 당일일 필요는 없고, 학칙상 금지 행동은 바로 말로 제지할 수 있으며, 생명·신체 위해 같은 긴급 상황은 곧바로 제지할 수 있다고 안내한다."},{"q":"휴대전화는 등교 때 일괄 수거해도 되나요?","a":"법은 학교장과 교원이 필요하면 교내 스마트기기 사용·소지를 제한할 수 있고, 기준·방법은 학칙으로 정할 수 있다고 한다. 학교 학칙(학생생활규정)에 정한 방식대로 한다."},{"q":"보호자에게 데려가라고 해도 되나요? 결석 처리되나요?","a":"개별학생교육지원을 거부하거나 여러 번 했는데도 계속 방해하면 학교장이 보호자에게 인계를 요청해 가정학습을 하게 할 수 있다. 이때는 출석으로 인정한다. 담임이 혼자 결정할 일은 아니고 학교장이 요청한다."},{"q":"학생을 붙잡아 말리면 아동학대로 신고당하지 않나요?","a":"긴급 상황에서 필요한 최소한의 방어·보호 제지는 법에 근거가 있고, 정당한 제지는 아동복지법 금지행위로 보지 않는다(제20조의6). 끝나면 곧바로 학교장에게 보고하고 학교장이 보호자에게 알린다."},{"q":"보호자가 수업 시간에 전화해 상담하자고 합니다.","a":"상담은 수업시간 외 활용이 원칙이다. 목적·일시·방법이 미리 합의되지 않은 상담, 근무시간 외 상담은 거부할 수 있다."},{"q":"보호자가 생활지도가 부당하다며 계속 항의합니다.","a":"학생·보호자는 14일 안에 학교장에게 이의를 제기할 수 있고 학교장은 14일 안에 답한다. 같은 내용을 정당한 사유 없이 반복하면 2회 이상 답한 뒤 답변을 거부할 수 있다. 반복 부당 간섭이 이어지면 교육활동 침해로 볼 수 있다."}],"record":"보호자에게 인계해 가정학습을 하게 한 기간은 출석으로 인정한다(고시 제19조제2항). 학교 안에서 하는 개별학생교육지원의 출결 처리는 법령·고시에 따로 정한 규정이 없다. 학교 징계로서 출석정지는 별도(시행령 제31조). 교원은 별도 공간 분리, 물품 분리보관, 방어·보호 제지 모두 일시·경위를 학교장에게 보고한다.","sources":[{"title":"교원의 학생생활지도에 관한 고시 (교육부고시 제2026-3호, 2026.2.20. 개정, 2026.3.1. 시행)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원의학생생활지도에관한고시"},{"title":"초·중등교육법 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"초·중등교육법 시행령 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법시행령"},{"title":"교원의 학생생활지도에 관한 고시 해설서 (2025년도 일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소","year":2025,"url":"https://www.jbe.go.kr/board/download.do?boardId=BBS_0000191&command=update&startPage=1&dataSid=773355&fileSid=630661"},{"title":"행정심판법·행정소송법 (현행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/행정심판법"}],"verified":"2026-09-24","uncertain":["해설서는 2025년판이라 2026.3.1. 개정 고시(개별학생교육지원 도입, 옛 교실 밖 분리 조항 삭제)가 반영되지 않았다. 2026년판 해설서는 찾지 못해 절차는 법·시행령·2026 고시 원문 기준으로 적었다. 주의 순서 FAQ와 방치 판례만 2025 해설서를 인용했다","휴대전화 보관 기간·반환 방법, 개별학생교육지원 장소·시간은 학칙마다 다르다. 소속 학교 생활규정을 확인해야 한다","'휴대전화 사용 제한 법제화'는 법률 공포일이 2025.9.16.(국회 통과는 그 전), 시행은 2026.3.1.이다. 요청서의 '2025.8'은 국회 의결 시점으로 보이나 원문으로 확인하지 못했다","학교 징계를 심의하는 교내 위원회 이름(선도위원회·생활교육위원회 등)과 절차는 학칙마다 달라 적지 않았다","퇴학 외 징계의 행정심판 청구처는 행정심판법 제6조제3항(시·도 소속 행정청)을 공립학교장에 적용한 해석이다. 사립학교 징계의 불복 경로(민사소송 등)는 확인하지 못했다","시·도교육청별 개별학생교육지원 운영 지침(공간·인력 지원)은 시·도마다 다를 수 있다. 소속 교육청 기준을 확인해야 한다(법 제20조의4제6항·제7항은 교육감의 경비·인력 지원과 매년 운영실태 조사만 정한다)"],"related":["teacher-rights","teacher-abuse-accusation"]},{"id":"student-photo-sns","title":"수업 몰래 촬영·녹음, SNS 게시, 교사 얼굴 합성","aka":["몰래 녹음","몰래 촬영","수업 녹음","수업 영상 SNS","틱톡에 선생님","인스타에 올림","유튜브에 올림","선생님 합성","교사 딥페이크","얼굴 합성","단톡방에 선생님 영상","음성권","초상권","녹음기 가방","불법촬영"],"category":"교원 보호","urgency":"당일","roles":["피해 교원","목격·인지 교직원","교육활동 보호 업무담당자","담임","교감","교장","교육지원청 교육활동 보호 담당"],"summary":"교육활동 중인 교원의 영상·화상·음성을 촬영·녹화·녹음·합성해 무단으로 배포하면 교육활동 침해행위다. 성적 합성물이나 신체 불법촬영은 성폭력범죄(교육활동 침해 중 범죄 유형)다. 증거를 먼저 남기고, 학교에 신고해 분리·보호조치를 받고, 삭제 요청과 지역교권보호위원회 심의, 필요하면 수사로 이어진다.","first":["지우라고 하기 전에 게시물 URL·계정명·게시 시각·조회수와 화면을 증거로 남긴다. 성적 촬영물·합성물은 다른 사람에게 전달·공유하지 않고, 삭제지원·수사용 자료 확보는 디지털성범죄피해자지원센터·경찰 안내를 따른다","교감·교장 또는 교육활동 보호 업무담당자에게 바로 신고한다(학교 밖이면 소속 시·도 교육활동보호센터의 지역번호+1395로 연락한다)","학교장은 교원이 반대하지 않으면 즉시 해당 학생과 분리해야 한다 — 분리되지 않았으면 요청한다","성적 합성·신체 촬영물이면 112 신고와 중앙디지털성범죄피해자지원센터(02-735-8994) 삭제지원을 함께 진행한다","학생 휴대전화를 빼앗아 직접 뒤지거나 지우게 하지 않는다 — 학교 절차로 넘긴다"],"steps":[{"stage":"알게 됨·신고","when":"알게 된 즉시","who":"피해 교원·목격 교직원","what":"증거 확보","detail":"게시물 URL, 계정, 게시·확산 시각, 조회수, 댓글, 공유된 단체채팅방 등 침해행위 관련 증거자료를 확보한다(화면 캡처 포함). 성적 촬영물·합성물이나 불법촬영물은 교직원 단톡방 등 다른 사람에게 전달·공유하지 않는다. 삭제지원 신청에는 URL이나 원본·화면 캡처본이 필요하고, 수사 증거가 될 수 있으므로 자료 확보·제출은 디지털성범죄피해자지원센터·수사기관 안내를 따른다. 목격자 확인은 학생에게 내용 확산이나 파일 공유를 요구하지 않는다. 삭제 요청은 정황 기록과 신고 이후 진행한다.","basis":"교육활동 보호 매뉴얼(2026 일부개정) 32쪽 초기 대응(증거자료·목격자 확보), 중앙디지털성범죄피해자지원센터 삭제지원 안내(경기도교육청 2026 학교 내 성희롱·성폭력 사안 처리 업무 안내서 17쪽)"},{"stage":"알게 됨·신고","when":"즉시","who":"알게 된 누구나","what":"학교 등 관계기관에 신고","detail":"교육활동 침해행위를 보거나 알게 된 사람은 학교 등에 즉시 신고해야 한다. 학교 안은 업무담당자·교감·교장(구두·메일·전화), 학교 밖은 시도 교육활동보호센터·교육(지원)청. 신고했다고 불이익을 주면 안 된다.","basis":"교원지위법 제28조"},{"stage":"초기 대응","when":"인지 즉시","who":"학교장","what":"피해교원 보호조치","detail":"심리상담·조언, 치료·요양 등 치유와 교권 회복에 필요한 조치를 즉시 한다. 조퇴·병가·특별휴가를 안내한다.","basis":"교원지위법 제20조제1항, 제23조, 교육활동 보호 매뉴얼(2026) 32쪽(조퇴·병가·특별휴가 안내)"},{"stage":"초기 대응","when":"인지 즉시","who":"학교장","what":"분리조치","detail":"교원이 반대하는 등 특별한 사유가 없으면 즉시 침해 관련 학생과 피해교원을 분리한다. 분리된 학생에게는 별도의 교육방법을 마련한다.","basis":"교원지위법 제20조제2항"},{"stage":"초기 대응","when":"인지 직후","who":"업무담당자·담임","what":"관련 학생 보호자 연락, 확산 차단 요청","detail":"관련 학생 보호자에게 연락하고 침해행위(추가 유포 등) 중단을 요청한다. 게시물 삭제 요청은 증거 확보 뒤에 한다. 언론 등 대응창구는 하나로 모은다.","basis":"교육활동 보호 매뉴얼(2026) 31~32쪽"},{"stage":"초기 대응","when":"게시물이 계속 남아 있을 때","who":"피해 교원(학교 지원)","what":"플랫폼에 삭제 요청","detail":"사생활 침해·명예훼손 등 권리가 침해되면 해당 정보통신서비스 제공자에게 침해 사실을 소명하고 삭제를 요청할 수 있다. 제공자는 지체 없이 삭제·임시조치 등을 해야 하고, 판단이 어렵거나 다툼이 예상되면 30일 이내 임시조치(접근 차단)를 할 수 있다.","basis":"정보통신망법 제44조의2"},{"stage":"초기 대응","when":"성적 합성물·불법촬영물인 경우","who":"피해 교원","what":"디지털성범죄 삭제지원 신청","detail":"성적 욕망·수치심을 유발하는 형태로 편집·합성한 영상물이나 신체 불법촬영물이 정보통신망에 유포돼 피해를 입었으면 국가·지자체가 삭제를 지원할 수 있다(중앙디지털성범죄피해자지원센터 02-735-8994). 본인 외에 배우자·직계친족·형제자매·지정 대리인도 요청할 수 있다. 수사기관이 요청한 경우 등은 요청 없이도 삭제지원하며 증거 자료는 보관된다.","basis":"성폭력방지 및 피해자보호 등에 관한 법률 제7조의3, 제7조의4"},{"stage":"알게 됨·신고","when":"성범죄·명예훼손 등 범죄 소지가 있을 때","who":"피해 교원·학교","what":"수사기관 신고·고소","detail":"범죄에 해당하면 경찰에 신고할 수 있다(긴급하면 112). 성적 허위영상물은 2024.10.16. 개정으로 반포 목적이 없어도 편집·합성만으로 처벌되고, 소지·저장·시청도 처벌된다. 모욕 등 친고죄는 피해자 본인이 고소해야 한다.","basis":"성폭력처벌법 제14조, 제14조의2, 교육활동 보호 매뉴얼(2026) 77쪽·97~98쪽"},{"stage":"초기 대응","when":"성폭력범죄 해당 + 긴급할 때","who":"학교장","what":"학교장 긴급조치","detail":"학생이 성폭력범죄에 해당하는 침해행위를 했고 피해교원 보호를 위해 긴급한 조치가 필요하면, 학교장이 먼저 학교 봉사·특별교육(심리치료)·출석정지·학급교체를 각각 또는 함께 부과할 수 있다. 지역교권보호위원회에 즉시 보고해 추인을 받는다. 출석정지 기간은 위원회 결정 때까지로 정할 수 있다. 출석정지·학급교체 전에는 의견진술 기회를 준다.","basis":"교원지위법 제25조제9항~제12항(2026.2.19. 시행)"},{"stage":"알게 됨·신고","when":"사안 접수 시부터 24시간 이내","who":"학교장","what":"교육지원청에 사안 신고 보고","detail":"학교장은 보호조치·분리조치를 한 경우 지체 없이 관할청에 침해행위 내용과 조치 결과를 보고해야 한다. 매뉴얼은 접수 시부터 24시간 이내 학교→교육지원청 보고를 안내한다. 축소·은폐는 금지되며, 시도하면 징계의결 요구 대상이다.","basis":"교원지위법 제20조제3항, 제27조, 교육활동 보호 매뉴얼(2026) 31~32쪽"},{"stage":"조사·확인","when":"접수 후","who":"업무담당자","what":"면담·의견서·목격자 진술 수집","detail":"피해교원과 관련 학생(보호자)을 분리해 면담하고 의견서·참고인 진술서·증거를 모은다. 조치 결정 전까지 '침해학생'이 아니라 '침해 관련 학생'으로 부른다. 성급한 화해 종용은 하지 않는다.","basis":"교육활동 보호 매뉴얼(2026) 28쪽·32쪽"},{"stage":"조사·확인","when":"사안 보고 후 5일 이내(주말·공휴일 미포함)","who":"학교","what":"사안 발생보고서 제출","detail":"학교가 교육지원청에 사안 발생보고서를 낸다.","basis":"교육활동 보호 매뉴얼(2026) 32쪽"},{"stage":"조사·확인","when":"중대사안일 때","who":"교육감","what":"교육부장관에 즉시 보고","detail":"성폭력범죄 행위, 정보통신망법 제44조의7제1항제3호(공포심·불안감 유발 정보 반복 도달) 불법정보 유통으로 교원이 4주 이상 정신건강의학과적 치료가 필요하다는 진단을 받은 경우 등은 중대사안으로 교육부에 즉시 보고된다.","basis":"교원지위법 제20조제3항, 같은 법 시행령 제18조"},{"stage":"조사·확인","when":"보고서 접수 후","who":"교육지원청","what":"사안 조사","detail":"피해교원·관련 학생(보호자) 자료 조사, 쟁점 확인, 침해행위 여부와 조치 필요성 확인, 조사보고서 작성.","basis":"교육활동 보호 매뉴얼(2026) 32쪽"},{"stage":"심의·결정","when":"사안발생보고서 접수 후 21일 이내(주말·공휴일 포함)","who":"지역교권보호위원회","what":"위원회 개최·심의","detail":"교육장 요청 등으로 소집하고 피해교원·관련자에게 출석을 통지한다. 당사자에게 진술 기회를 주며 서면 진술도 된다. 원하면 분쟁조정도 한다. 불가피하면 연기 가능. 회의는 비공개이고, 당사자가 신청하면 개인정보를 빼고 회의록을 공개한다.","basis":"교원지위법 제25조제6항, 제30조제3항, 교육활동 보호 매뉴얼(2026) 25쪽·32쪽"},{"stage":"심의·결정","when":"심의 결과","who":"지역교권보호위원회","what":"침해 여부 판단·조치 의결","detail":"학생에게는 ①학교 봉사 ②사회봉사 ③특별교육·심리치료 ④출석정지 ⑤학급교체 ⑥전학 ⑦퇴학(의무교육 과정 제외) 중에서 교육장에게 요청한다. 보호자 등이 침해했으면 서면사과·재발방지 서약, 특별교육·심리치료를 요청할 수 있다. 조치별 기준은 고시 별표를 따른다.","basis":"교원지위법 제25조제2항, 제26조제2항, 교육활동 침해 행위 및 조치 기준에 관한 고시 제3조"},{"stage":"조치·이행","when":"요청받은 날부터 14일 이내","who":"교육장","what":"조치 처분·통지","detail":"교육장은 요청받은 날부터 14일 이내에 조치하고 학생과 보호자에게 통지한다. 학교장은 이행에 협조한다. 매뉴얼은 심의결과 통지를 14일 이내(주말·공휴일 포함)로 안내한다.","basis":"교원지위법 제25조제7항·제8항, 제26조제4항"},{"stage":"조치·이행","when":"조치 후","who":"교육장·학교","what":"특별교육·심리치료와 보호자 동반","detail":"출석정지·학급교체·전학 조치 학생은 교육감이 정한 기관에서 특별교육·심리치료를 받아야 하고, 보호자도 함께 받아야 한다. 학생이 조치를 거부·회피하면 위원회가 4~7호로 가중 요청할 수 있다.","basis":"교원지위법 제25조제3항~제5항·제8항"},{"stage":"조치·이행","when":"치료가 필요할 때","who":"피해 교원·학교장","what":"보호조치 비용 청구","detail":"피해교원 보호조치 비용은 침해 학생 보호자 등이 부담한다. 신속한 치료를 위해 피해교원이나 학교장이 원하면 관할청이 먼저 부담하고 구상한다. 교육감에게 비용 부담 신청서와 증빙을 낸다.","basis":"교원지위법 제20조제5항, 교육활동 보호 매뉴얼(2026) 73쪽"},{"stage":"불복·구제","when":"조치에 이의가 있을 때","who":"침해 학생 또는 그 보호자","what":"행정심판 청구","detail":"교육장의 조치에 이의가 있으면 행정심판을 청구할 수 있다. 처분이 있음을 알게 된 날부터 90일 이내, 처분이 있었던 날부터 180일이 지나면 못 한다. 심판청구만으로 처분 집행이 멈추지 않으며, 중대한 손해를 막을 긴급한 필요가 있으면 위원회가 집행정지를 결정할 수 있다.","basis":"교원지위법 제25조제14항, 행정심판법 제27조, 제30조"},{"stage":"불복·구제","when":"행정소송을 택할 때","who":"침해 학생 또는 그 보호자","what":"취소소송","detail":"처분이 있음을 안 날부터 90일 이내, 처분이 있은 날부터 1년 안에 제기한다. 행정심판을 거친 경우 기간은 재결서 정본을 송달받은 날부터 센다.","basis":"행정소송법 제20조"},{"stage":"불복·구제","when":"형사처벌 대상이라고 판단될 때","who":"교육감(관할청)","what":"교육감 고발","detail":"보고받은 관할청은 형사처벌 규정에 해당한다고 판단하면 수사기관에 고발할 수 있다. 매뉴얼 예시: 시·도교권보호위원회가 중대사안 보고일 또는 피해교원 요청일부터 14일 이내 고발 권고, 친고죄는 고발 대상에서 제외.","basis":"교원지위법 제20조제4항, 교육활동 보호 매뉴얼(2026) 77쪽"},{"stage":"종결·사후","when":"조치 결정 후","who":"교육지원청·학교","what":"결과보고·재발방지·복귀 지원","detail":"결과를 시도교육청에 보고하고, 조치 이행을 독려하며 미이행을 보고한다. 피해교원 심리치료, 재발방지 교육과 추수지도, 교육활동보호센터의 복귀 지원 프로그램을 연계한다.","basis":"교육활동 보호 매뉴얼(2026) 32쪽·74쪽"}],"deadlines":[{"what":"학교→교육지원청 사안 신고 보고","limit":"사안 접수 시부터 24시간 이내","basis":"교원지위법 제20조제3항(지체 없이), 교육활동 보호 매뉴얼(2026)"},{"what":"사안 발생보고서 제출","limit":"사안 보고 후 5일 이내(주말·공휴일 미포함)","basis":"교육활동 보호 매뉴얼(2026)"},{"what":"지역교권보호위원회 개최","limit":"사안발생보고서 접수 후 21일 이내(주말·공휴일 포함, 불가피하면 연기)","basis":"교육활동 보호 매뉴얼(2026) 25쪽"},{"what":"교육장 조치","limit":"위원회 요청을 받은 날부터 14일 이내","basis":"교원지위법 제25조제7항, 제26조제4항"},{"what":"플랫폼 임시조치","limit":"30일 이내","basis":"정보통신망법 제44조의2제4항"},{"what":"행정심판 청구","limit":"처분이 있음을 안 날부터 90일, 있었던 날부터 180일","basis":"행정심판법 제27조"},{"what":"행정소송 제기","limit":"안 날부터 90일, 있은 날부터 1년","basis":"행정소송법 제20조"}],"dont":["증거를 남기기 전에 '당장 지워'부터 시키지 않는다","학생 휴대전화를 뺏어 사진첩·대화방을 교사가 뒤지지 않는다 — 고시가 허용하는 소지품 조사는 생명·신체·재산에 위해 우려가 있는 물품에 한정된다","피해 교원에게 '애들 장난이니 넘어가자'며 화해를 종용하거나 사안을 축소하지 않는다(축소·은폐 금지)","조치 결정 전에 '가해자'라고 공개적으로 부르거나 반 전체에 사안을 알리지 않는다","문제 영상을 교직원 단톡방에 그대로 돌려 보지 않는다 — 성적 합성물은 저장·시청도 처벌 대상이다","학생 녹음을 무조건 '통신비밀보호법 위반'이라고 단정하지 않는다 — 대화 당사자인 학생의 녹음은 다르게 본다"],"contacts":[{"name":"시·도 교육활동보호 대표번호","tel":"지역번호+1395","note":"교원이 소속 시·도 교육활동보호 지원 창구에 연결(운영 시간·서비스는 교육청에서 확인)"},{"name":"경찰","tel":"112","note":"긴급 범죄 신고"},{"name":"중앙디지털성범죄피해자지원센터","tel":"02-735-8994","note":"성적 합성물·불법촬영물 피해상담·삭제지원(365일, 온라인 d4u.stop.or.kr). 여성긴급전화 1366은 별도 번호로, 디지털 성폭력 등 피해자 긴급 상담·기관 연계"}],"forms":["교육활동 침해 사안 신고서(매뉴얼 서식1)","긴급조치 보고서(서식2)","즉시분리 의사확인서(서식3)","의견서(서식4)·참고인 진술서(서식5)","사안 발생 보고서(서식7)","보호조치 비용 부담 신청서","증거기록(게시 URL·계정·시각·화면 캡처 등; 성적 촬영물·합성물은 다른 사람에게 전달·공유하지 않음)"],"law":[{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제19조(교육활동 침해행위)","point":"학생·보호자 등이 교육활동 중인 교원에게 한 형법상 명예 관련 죄, 성폭력범죄, 정보통신망법상 불법정보 유통, 고시로 정한 부당 간섭 등"},{"name":"교육활동 침해 행위 및 조치 기준에 관한 고시(교육부고시 제2024-20호)","article":"제2조제5호","point":"교육활동 중인 교원의 영상·화상·음성 등을 촬영·녹화·녹음·합성하여 무단으로 배포하는 행위(원격수업 포함)"},{"name":"교원지위법","article":"제20조(피해교원 보호조치 등)","point":"즉시 보호조치·분리조치, 지체 없이 관할청 보고, 관할청 고발 가능, 비용은 침해 학생 보호자 부담 원칙"},{"name":"교원지위법","article":"제25조(침해학생 조치 등)","point":"지역교권보호위원회 1~7호 조치 요청, 교육장 14일 이내 조치, 학교장 긴급조치(성폭력·상해폭행, 2026.2.19. 신설), 행정심판 청구 가능"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조의2(허위영상물 등의 반포등)","point":"의사에 반해 성적 수치심 유발 형태로 편집·합성하면 7년 이하 징역 또는 5천만원 이하 벌금, 소지·저장·시청도 3년 이하 징역 또는 3천만원 이하 벌금(2024.10.16. 개정)"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조(카메라 등을 이용한 촬영)","point":"성적 수치심을 유발할 수 있는 신체를 의사에 반해 촬영하면 7년 이하 징역 또는 5천만원 이하 벌금"},{"name":"통신비밀보호법","article":"제14조·제4조·제16조","point":"공개되지 아니한 타인 간의 대화 녹음 금지, 위반 녹음은 재판·징계절차에서 증거 사용 불가, 1년 이상 10년 이하 징역과 5년 이하 자격정지(제16조제1항)"},{"name":"초·중등교육법","article":"제20조의5(교내 스마트기기의 사용 제한 등)","point":"학생은 수업 중 스마트기기를 사용해서는 안 됨(장애 보조기기·교육 목적·긴급 상황으로 학교장·교원이 허용한 경우 예외)"}],"faq":[{"q":"학생이 수업 중 제 말을 몰래 녹음했습니다. 통신비밀보호법 위반인가요?","a":"교육부 교육활동 보호 매뉴얼(2026)은 학생이 교사 발언의 상대방(대화 당사자)이므로 녹음 자체를 통신비밀보호법 위반 범죄라고 할 수는 없지만, 교원의 음성권 침해 문제가 생기고 이를 무단으로 게시·배포하면 교육활동 침해행위에 해당할 수 있다고 설명합니다. 수업 중 스마트기기 사용은 초·중등교육법 제20조의5로 원칙적으로 금지됩니다."},{"q":"학부모가 아이 가방에 녹음기를 넣어 수업을 녹음했어요.","a":"대법원 2024. 1. 11. 선고 2020도1538 판결은 초등학교 교실 수업 중 담임교사 발언이 교실 안 학생들에게만 공개된 것이어서 '공개되지 아니한 타인 간의 대화'에 해당하고, 대화 당사자가 아닌 부모의 녹음은 통신비밀보호법 제14조제1항 위반이므로 녹음파일의 증거능력이 부정된다고 보았습니다(원심 파기환송). 이 판결은 증거능력에 관한 것이며, 녹음한 부모의 형사책임을 판단한 것은 아닙니다."},{"q":"제 수업 영상을 짜깁기해 웃음거리로 올렸는데 성적인 내용은 없어요.","a":"고시 제2조제5호(촬영·녹화·녹음·합성 후 무단 배포)에 해당할 수 있습니다. 매뉴얼 예시에 수업 중 교사를 몰래 찍어 합성해 SNS에 올린 경우, 교육활동 중 영상을 게임 프로필 사진으로 쓴 경우가 있습니다. 비방할 목적으로 거짓 사실을 드러내 명예를 훼손한 게시물은 정보통신망법 제44조의7제1항제2호 불법정보 유통으로 볼 수도 있습니다(2026.7.6. 시행 개정으로 거짓 사실인 경우로 좁혀짐)."},{"q":"제 얼굴을 음란물에 합성했어요. 퍼뜨리지는 않았다고 합니다.","a":"2024.10.16. 시행 개정으로 반포 목적이 없어도 성적 수치심을 유발하는 형태로 편집·합성한 것만으로 처벌되고(7년 이하 징역 또는 5천만원 이하 벌금), 소지·저장·시청도 처벌됩니다. 성폭력범죄이므로 교육활동 침해행위이자 중대사안 보고 대상이며, 학교장 긴급조치도 가능합니다. 112 신고와 중앙디지털성범죄피해자지원센터(02-735-8994) 삭제지원을 함께 진행하세요."},{"q":"게시물을 올린 게 학생이 아니라 졸업생이나 다른 학교 학생이면요?","a":"교원지위법상 교육활동 침해행위의 주체는 '고등학교 이하 각급학교에 소속된 학생 또는 그 보호자 등'이고 대상은 '교육활동 중인 교원'입니다. 해당하지 않으면 교권보호위원회 조치 대상이 아닐 수 있어, 삭제 요청·수사·민사 등 일반 절차로 대응합니다. 구체 판단은 교육활동보호센터에 문의하세요."},{"q":"교권보호위원회 결정에 학생 측이 불복하면요?","a":"침해 학생이나 보호자는 교육장 조치에 대해 행정심판을 청구할 수 있습니다(제25조제14항). 기한은 처분을 안 날부터 90일, 처분이 있었던 날부터 180일입니다. 청구만으로는 조치가 멈추지 않고, 집행정지는 위원회가 따로 결정합니다."},{"q":"학생이 휴대전화를 내놓지 않아요.","a":"생활지도 고시는 수업 중 스마트기기 사용 시 주의를 주고, 2회 이상 주의에도 계속 사용하면 학칙에 따라 분리·보관할 수 있게 합니다(제11조제2항, 제12조제5항). 분리 보관하면 일시·경위를 학교장에게 보고하고 학교장이 보호자에게 알립니다(제12조제6항)."}],"record":"교육활동 침해 학생의 출석정지(교원지위법 제25조제2항제4호)는 미인정 결석이며, 2026학년도 학교생활기록부 기재요령에 따라 출결 특기사항에 사유를 입력하지 않는다. 중대한 교육활동 침해의 학생부 기재는 논의됐으나 교육부 2026.1.22. 강화방안에서는 제외됐고, 국회 입법과정에서 반영 여부를 검토할 계획이다(교육활동 침해 항목 참조). 보고는 학교→교육지원청(24시간 이내 신고 보고, 5일 이내 사안 발생보고서), 중대사안은 교육지원청→시도교육청→교육부.","deep":[{"title":"어떤 경우가 교육활동 침해인가","body":["고시 제2조제5호는 '교육활동 중인 교원의 영상·화상·음성 등을 촬영·녹화·녹음·합성하여 무단으로 배포하는 행위'를 침해행위로 정한다. 원격수업도 포함된다. 핵심은 '무단 배포'다.","매뉴얼 예시: 원격수업 중 교사 발언 일부만 녹음해 단체채팅방에 올린 경우, 수업하는 교사를 몰래 찍어 다른 사진과 합성해 SNS에 올린 경우, 교육활동 중 교사 영상을 게임 프로필 사진으로 쓴 경우.","'교육활동 중'이 아닌 교원에 대한 침해(예: 퇴근 후 사생활)는 교원지위법상 침해행위로 다루지 않고 일반 절차로 대응한다. 다만 매뉴얼은 퇴근 후라도 학생·보호자와 학생 관련 상담 중이었거나, SNS에서의 모욕·명예훼손이면 '교육활동 중'인 교원에 대한 행위로 볼 수 있다고 설명한다."],"basis":"교육활동 침해 행위 및 조치 기준에 관한 고시 제2조, 교육활동 보호 매뉴얼(2026) 4~5쪽·107쪽"},{"title":"녹음은 누가 했느냐가 갈림길","body":["통신비밀보호법이 금지하는 것은 '공개되지 아니한 타인 간의 대화'를 녹음하는 것이다. 대화에 원래 참여한 당사자의 녹음은 이 금지에 들어가지 않는다고 매뉴얼은 설명한다. 그래서 수업을 듣던 학생의 녹음은 범죄라고 하기 어렵고, 배포가 교육활동 침해로 문제된다.","반대로 대화에 참여하지 않은 부모가 녹음기를 넣어 녹음한 경우, 대법원은 교실 수업 발언이 일반 공중에게 공개된 것이 아니므로 '공개되지 아니한 타인 간의 대화'에 해당하고, 그 녹음파일은 증거능력이 없다고 판단했다(2024.1.11. 2020도1538)."],"basis":"통신비밀보호법 제14조·제4조, 대법원 2024. 1. 11. 선고 2020도1538 판결, 교육활동 보호 매뉴얼(2026) 107쪽"},{"title":"얼굴 합성: 일반 합성과 성적 합성은 다르다","body":["일반적인 우스개 합성·짜깁기 게시는 고시 제2조제5호 침해행위, 비방 목적으로 거짓 사실을 드러낸 명예훼손이면 정보통신망법 불법정보(제44조의7제1항제2호) 유통 유형으로 다뤄질 수 있다.","성적 욕망·수치심을 유발하는 형태의 합성은 성폭력처벌법 제14조의2 범죄다. 2024.10.16.부터 반포 목적이 없어도 처벌되고, 합성물을 소지·저장·시청한 학생도 처벌 대상이다. 성폭력범죄 침해행위는 중대사안 보고 대상이고 학교장 긴급조치가 가능하다."],"basis":"성폭력처벌법 제14조의2, 교원지위법 제25조제9항, 같은 법 시행령 제18조, 교육활동 보호 매뉴얼(2026) 97~98쪽, 정보통신망법 제44조의7제1항제2호"},{"title":"지우는 길은 세 갈래","body":["①학교 절차: 관련 학생·보호자에게 삭제와 추가 유포 중단을 요청하고 위원회 조치로 재발을 막는다. ②플랫폼: 정보통신망법 제44조의2에 따라 침해 사실을 소명해 삭제를 요청하면 제공자는 지체 없이 삭제·임시조치(최대 30일)를 한다. ③성적 합성·불법촬영물: 중앙디지털성범죄피해자지원센터(02-735-8994)에 삭제지원을 요청한다.","삭제지원 기관은 지원 과정에서 관련 자료를 확보·관리할 수 있다. 그래서 어느 길이든 삭제 요청 전에 게시 URL·계정·시각 등 증거부터 남긴다. 성적 촬영물·합성물은 다른 사람에게 돌리지 않고, 삭제지원·수사용 자료 확보는 지원센터·수사기관 안내를 따른다."],"basis":"정보통신망법 제44조의2, 성폭력방지법 제7조의3"},{"title":"위원회 결정 뒤: 이행·불복·고발","body":["교육장은 요청일부터 14일 이내 조치하고 학생·보호자에게 통지한다. 4~6호 학생은 특별교육·심리치료를 받아야 하고 보호자도 함께 받는다. 거부·회피하면 가중 조치가 요청될 수 있다.","학생 측은 행정심판(안 날부터 90일, 있었던 날부터 180일)이나 행정소송(안 날부터 90일, 있은 날부터 1년)으로 다툴 수 있다. 형사처벌 대상이면 교육감이 고발할 수 있고, 모욕 같은 친고죄는 교원 본인이 고소해야 한다."],"basis":"교원지위법 제20조제4항, 제25조, 행정심판법 제27조, 행정소송법 제20조"}],"tables":[{"title":"상황별로 적용되는 것","head":["상황","교육활동 침해","형사","먼저 할 일"],"rows":[["학생이 수업을 녹음해 SNS·단톡방에 올림","고시 제2조제5호(무단 배포)","대화 당사자 녹음은 통신비밀보호법 위반으로 보기 어려움(매뉴얼)","캡처·신고·삭제 요청"],["학생이 교사 영상을 짜깁기·합성해 조롱","고시 제2조제5호, 비방 목적 거짓 사실이면 불법정보 유통","명예훼손·모욕 검토(모욕은 친고죄)","캡처·신고·플랫폼 삭제 요청"],["교사 얼굴을 성적으로 합성","성폭력범죄 유형·중대사안","성폭력처벌법 제14조의2(제작·소지·시청 모두)","112·디지털성범죄피해자지원센터(02-735-8994), 학교장 긴급조치 검토"],["교사 신체를 몰래 촬영","성폭력범죄 유형·중대사안","성폭력처벌법 제14조","112·디지털성범죄피해자지원센터(02-735-8994), 분리조치"],["학부모가 녹음기를 넣어 수업 녹음","보호자 등의 부당 간섭 여부는 위원회 판단","통신비밀보호법 제14조(대법원 2020도1538: 증거능력 부정)","교육활동보호센터 상담"]],"note":"교육활동 보호 매뉴얼(2026 일부개정), 대법원 2024.1.11. 2020도1538 판례속보, 각 법령 원문 기준. 개별 사건의 범죄 성립은 수사기관·법원이 판단한다."},{"title":"침해 학생 조치(교원지위법 제25조제2항)","head":["호","조치","비고"],"rows":[["1호","학교에서의 봉사","학교장 긴급조치 가능(성폭력·상해폭행)"],["2호","사회봉사",""],["3호","학내외 전문가에 의한 특별교육 이수 또는 심리치료","학교장 긴급조치 가능"],["4호","출석정지","학교장 긴급조치 가능, 특별교육·심리치료 의무"],["5호","학급교체","학교장 긴급조치 가능, 특별교육·심리치료 의무"],["6호","전학","특별교육·심리치료보다 먼저 시행"],["7호","퇴학처분","의무교육 과정 학생에게는 적용 안 함"]],"note":"조치별 적용 기준은 교육활동 침해 행위 및 조치 기준에 관한 고시 별표. 보호자 등에게는 제26조(서면사과·재발방지 서약, 특별교육·심리치료)."}],"sources":[{"title":"교육활동 보호 매뉴얼 2026년도 일부 개정 (수탁연구자료 CRM 2026-09)","publisher":"교육부·한국교육개발원","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=327&boardSeq=105492&lev=0&m=0305&opType=N&page=1&s=moe&searchType=null&statusYN=W"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 (시행 2026.2.19., 법률 제21350호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"교육활동 침해 행위 및 조치 기준에 관한 고시 (교육부고시 제2024-20호)","publisher":"교육부(국가법령정보센터)","year":2024,"url":"https://www.law.go.kr/행정규칙/교육활동침해행위및조치기준에관한고시"},{"title":"피해아동의 부모가 초등학교 담임교사의 수업시간 중 발언을 몰래 녹음한 파일의 증거능력이 문제된 사건 [대법원 2024. 1. 11. 선고 2020도1538]","publisher":"대법원(법원도서관 판례속보)","year":2024,"url":"https://www.scourt.go.kr/portal/news/NewsViewAction.work?pageIndex=1&seqnum=9709&gubun=4&type=0"},{"title":"성폭력범죄의 처벌 등에 관한 특례법 (시행 2025.10.1.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/성폭력범죄의처벌등에관한특례법"},{"title":"통신비밀보호법 (시행 2025.8.1.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/통신비밀보호법"},{"title":"정보통신망 이용촉진 및 정보보호 등에 관한 법률 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률"},{"title":"성폭력방지 및 피해자보호 등에 관한 법률 (시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/성폭력방지및피해자보호등에관한법률"},{"title":"교원의 학생생활지도에 관한 고시 (교육부고시 제2026-3호, 시행 2026.3.1.)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원의학생생활지도에관한고시"},{"title":"학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026.2.1. 기준) — 디지털 성폭력 삭제지원 안내 참고","publisher":"경기도교육청","year":2026,"url":"https://www.goe.go.kr/resource/goe/na/bbs_2675/2026/03/bffe0d25-c24a-4f6d-ab15-572e551528b3.pdf"},{"title":"2026학년도 학교생활기록부 기재요령(중학교) — 출결상황 특기사항","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/fileDown.do?fileSeq=4ad0d9bae480b48e1b9b3de0592f955b&m=0302&s=moe"},{"title":"학교민원 대응 및 교육활동 보호 강화 방안 보도자료 (2026.1.22.)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=105198&lev=0&m=020402&opType=N&s=moe&statusYN=W"}],"verified":"2026-09-24","uncertain":["출석정지 외 조치의 학생부 처리 세부는 해당 학년도 학교생활기록부 기재요령과 소속 시·도교육청 안내를 확인해야 함","대화 당사자인 학생의 녹음이 통신비밀보호법 위반이 아니라는 설명은 교육부 매뉴얼 기준이며, 개별 사건의 음성권·초상권 민사책임 범위는 법원 판단","학부모가 제3자로 녹음한 경우의 형사처벌 여부(대법원 2020도1538은 증거능력 판결)","매뉴얼의 '24시간 이내 보고', '5일 이내 발생보고서', '21일 이내 위원회'는 법률 조문이 아닌 매뉴얼·운영규정 표준안 기준 — 소속 시·도교육청 운영규정 확인 필요","교사가 학생을 무단 촬영·게시한 경우(반대 방향)는 이 파일에서 다루지 않음 — 개인정보 보호법 수집·이용 동의 문제로 별도 확인 필요"],"related":["teacher-rights","cyber-deepfake","privacy-leak"]},{"id":"absence-unknown","title":"미인정 결석·장기결석·소재 불명","aka":["무단결석","미인정결석","장기결석","연락 두절","소재 불명","등교 안 해요","가정방문","출석 독촉","의무교육관리위원회","정원외 관리","취학 유예","취학 면제","예비소집 불참","미취학 아동","학업중단"],"category":"학생 보호·위기","urgency":"당일","roles":["담임","미인정결석 업무담당자","학적 담당자","교감","교장","의무교육관리위원회","교육지원청 취학관리 전담기구"],"summary":"정당한 사유 없는 결석은 첫날부터 학생 본인과 직접 연락해 소재·안전을 확인한다. 초·중학교는 2일 이상 무단결석이면 학교장이 보호자에게 출석을 독촉·경고하고, 가정방문(읍·면·동 동행·경찰 협조 요청 가능)과 내교 요청을 거쳐, 소재가 확인되지 않거나 학대가 의심되면 즉시 112에 신고하고 수사를 의뢰한다. 나이스 미인정결석 보고는 충북 2026 매뉴얼 기준 초·중 연속 10일, 고 연속 7일에 시작해(시도마다 기준이 다름) 복귀까지 매월 관리한다. 고등학생은 의무교육이 아니어서 절차와 기준이 다르다.","first":["결석 첫날, 보호자뿐 아니라 학생 본인과 직접 통화(영상통화)해 지금 어디서 안전한지 확인한다","통화가 안 되고 소재·안전이 불확실하면 첫날이라도 가정방문을 검토하고 업무담당자·관리자에게 알린다","소재가 끝내 확인되지 않거나 학대 징후가 보이면 망설이지 말고 112에 신고한다(공문은 사후에)","나이스 출결에 미인정 결석을 입력하고, 연락·방문 내용을 날짜·방법별로 기록해 둔다","가출이면 보호자가 직접 가출신고를 하도록 안내하고, 협조하지 않으면 학교가 관할 경찰서에 신고할 수 있다"],"steps":[{"stage":"알게 됨·신고","when":"결석 1~2일","who":"담임","what":"결석 사유·소재·안전 확인","detail":"유선으로 결석 사유를 확인하고 출석을 독려한다. 소재·안전은 학생 본인과 직접 통화(영상통화)로 확인하는 것이 원칙이다. 통화가 안 되면 이유를 확인하고 날짜·장소를 특정할 수 있는 사진 등 확인 자료를 받는다. 업무담당자에게 알리고 나이스 [학적]-[출결관리]에 미인정 결석을 입력한다.","basis":"충북교육청 2026 미인정결석 학생 관리 매뉴얼 4-1·4-2; 인천시교육청 2026 미취(입)학·미인정결석 관리 매뉴얼 Ⅲ"},{"stage":"알게 됨·신고","when":"소재·안전 미확인 또는 학대 징후","who":"담임·교장","what":"첫날이라도 가정방문·112 신고","detail":"소재·안전이 확인되지 않으면 1~2일 차에도 가정방문을 할 수 있다. 학생 소재·안전 확인이 불가능하거나 아동학대 징후가 있으면 즉시 112에 신고하고 수사를 의뢰한다. 교직원은 아동학대 신고의무자다.","basis":"충북교육청 2026 매뉴얼 기본방침; 아동학대범죄의 처벌 등에 관한 특례법 제10조"},{"stage":"초기 대응","when":"초·중: 정당한 사유 없이 계속 2일 이상 결석","who":"학교장(담임 실무)","what":"보호자에게 출석 독촉·경고","detail":"초·중학교장은 지체 없이 보호자(또는 고용자)에게 출석을 독촉하거나 의무교육을 방해하지 말라고 경고해야 한다. 입학·재취학·전학·편입학 기일 후 2일 이내에 오지 않은 경우, 고용자가 의무교육을 방해하는 경우도 같다. 독촉을 이행하지 않으면 초·중등교육법 제68조에 따라 100만원 이하 과태료가 부과될 수 있음을 안내한다.","basis":"초·중등교육법 시행령 제25조제1항; 초·중등교육법 제68조제1항; 인천시교육청 2026 매뉴얼 Ⅱ-다(과태료 안내)"},{"stage":"초기 대응","when":"고등학교: 정당한 사유 없이 계속 2일 이상 결석","who":"고등학교장(담임 실무)","what":"학생·보호자에게 결석 사유 확인","detail":"고등학교장은 지체 없이 학생과 보호자에게 결석 사유를 확인해야 한다. 고등학교는 의무교육이 아니므로 시행령 제25조의 독촉·경고·읍면동 통보 체계가 아니라 제92조의2가 적용된다.","basis":"초·중등교육법 시행령 제92조의2제1항"},{"stage":"조사·확인","when":"초·중 3~9일 / 고 3~6일(충북 2026 예시)","who":"담임(업무담당자·관련 부장 협조)","what":"가정방문","detail":"유선 독촉 후에도 출석하지 않고 소재·안전이 확인되지 않거나 직접 관찰이 필요하면 가정방문한다. 내부결재를 거치고 2인 이상 동행을 적극 권장한다. 학교장은 거주지 관할 읍·면·동장에게 동행을, 필요하면 관할 경찰서장에게 협조를 요청할 수 있고, 요청받은 기관은 특별한 사유가 없으면 적극 협조해야 한다. 교사 신변 위협이 우려되거나 학대 의심 사안이면 경찰 동행을 요청할 수 있다. 해외 출국이 행정정보로 확인되면 방문을 생략할 수 있으나 보고 명단에는 넣는다.","basis":"시행령 제25조제2항·제3항; 충북교육청 2026 매뉴얼 4-2·Q1; 인천시교육청 2026 매뉴얼"},{"stage":"조사·확인","when":"필요 시 언제든","who":"업무담당자","what":"행정정보 공동이용 조회","detail":"학교장은 취학 관리를 위해 행정정보 공동이용으로 주민등록전산정보와 출입국 사실증명·외국인등록 사실증명을 확인할 수 있다. 소재지 조사에는 사전동의가 필요 없다(정보주체 동의를 받을 수 있으면 받는 것이 원칙). 복수국적자가 외국 여권으로 드나든 경우와 외국인 출입국은 조회되지 않는다. 조회 권한은 미리 신청해 승인받아 둔다(충북 2026 예시: 3월 중 신청, 초·중은 교육지원청·고는 도교육청 승인 — 승인 기관은 시·도마다 다름).","basis":"시행령 제28조의2, 제92조의2제3항; 충북교육청 2026 매뉴얼 기본방침·7; 인천시교육청 2026 매뉴얼 Ⅰ-나"},{"stage":"조사·확인","when":"가정방문 후에도 결석","who":"담임·교장","what":"내교 요청과 면담","detail":"보호자에게 학생과 함께 학교에 와서 면담하도록 요청한다. 우선 유선으로 하고, 안 되면 가정통신문을 주소에 직접 전달하거나 내용증명 등기로 보낸다. 의무교육관리위원회를 열어 내교한 학생·보호자를 면담하고 출석을 독려할 수 있다.","basis":"시행령 제25조제2항; 충북교육청 2026 매뉴얼 4-2(내교 요청)"},{"stage":"초기 대응","when":"기초조사로도 소재 미확인·학대 의심","who":"교장","what":"경찰 수사 의뢰","detail":"유선연락·출입국 확인·거주지 확인·가정방문 등 기초조사를 하고도 소재 수사나 아동학대 의심 수사가 필요하면 기초조사 결과를 첨부해 공문(수사 의뢰 요청서)으로 관할 경찰서에 의뢰한다. 응급하면 112로 먼저 신고하고 공문은 사후에 보낸다. 의뢰 전 관할 경찰서 아동청소년 담당과 유선 협의를 한다. 아동학대가 의심되면 수사기관이나 시·군·구(아동학대전담공무원)에 즉시 신고하고 교육(지원)청에 현황을 보고한다. 해외출국·질병 등이 객관적으로 증빙되면 수사 의뢰를 지양한다.","basis":"충북교육청 2026 매뉴얼 4-2(경찰협조 요청)·4-4; 인천시교육청 2026 매뉴얼 Ⅲ-나; 아동학대범죄의 처벌 등에 관한 특례법 제10조제2항"},{"stage":"초기 대응","when":"초·중: 독촉·경고 후 3일이 지나거나 2회 이상 독촉에도 계속","who":"학교장","what":"읍·면·동장·교육장 통보","detail":"초등학교는 거주지 관할 읍·면·동장과 교육장에게, 중학교는 교육장에게 그 경과를 통보한다. 주소지와 실제 거주지가 다른 학생이 있으면 성명·주민등록번호를 통보한다. 통보를 받은 읍·면·동장·교육장은 지체 없이 다시 독촉·경고해야 하고 가정방문할 수 있으며, 교육장은 2회 이상에도 계속되면 교육감에게 보고한다.","basis":"시행령 제25조제4항, 제26조"},{"stage":"조치·이행","when":"초·중 연속 10일째 / 고 연속 7일째(충북 2026 예시 — 시·도마다 다름)","who":"담임 → 업무담당자","what":"나이스 미인정결석 최초 보고","detail":"담임이 나이스 [학적]-[미인정결석학생관리]에 등록(최초 미인정결석일자, 결석사유, 사유 확인일자, 소재확인 여부·일자, 장기 미인정결석일자, 경찰수사의뢰 여부)하고 대상학생보고 후 담당자에게 알린다. 담당자는 오류를 점검해 즉시(3일 이내) 보고한다. 토요일·공휴일·재량휴업일은 일수에서 뺀다. 1일이라도 소재 미확인·학대 징후로 경찰·전문기관에 신고했으면 곧바로 등록한다. 고등학교장은 7일 이상 결석 학생의 성명·경과를 교육감에게 통보해야 한다.","basis":"충북교육청 2026 매뉴얼 4-2·4-3; 시행령 제92조의2제2항"},{"stage":"심의·결정","when":"최초 보고 무렵","who":"교장(학생맞춤통합지원팀 등 협의)","what":"집중관리대상 지정","detail":"거주지·소재 불분명·연락 두절, 가정 사정으로 안전·학대 우려, 가정 내 학습, 자살 일반·우선 관심군, 아동학대 이력·징후가 있으면 집중관리대상이다(학대 징후·의심은 필수, 충북 2026 매뉴얼 예시). 내부결재 후 나이스에 'Y'로 등록하고 집중관리카드를 작성해 월 1회 누가기록·보고한다.","basis":"충북교육청 2026 매뉴얼 용어정의 6·4-4; 인천시교육청 2026 매뉴얼"},{"stage":"조치·이행","when":"최초 보고 이후 매월","who":"담임·업무담당자","what":"월별 정기보고","detail":"월 말일 기준 소재·안전을 확인하고 변경사항을 입력해 익월 초에 보고한다(충북: 익월 1일자, 담당자 5일까지 점검). 해외출국(출입국 확인), 미인가 대안교육시설(재학확인서), 질병치료(진단서)처럼 객관적으로 증빙되면 학기별 1회로 줄일 수 있다. 소재·안전은 확인됐어도 교외체험학습·질병 결석 등 다양한 유형의 결석이 7일 이상 반복·지속된 장기 미인정결석 학생은 가정방문 등 대면관찰을 한다.","basis":"충북교육청 2026 매뉴얼 4-1·4-2; 인천시교육청 2026 매뉴얼 Ⅲ"},{"stage":"조치·이행","when":"경찰에 수사 의뢰한 뒤","who":"담임·업무담당자·교장","what":"수사 의뢰 이후 관리","detail":"나이스 경찰수사의뢰 여부에 공문 의뢰는 '수사의뢰공문', 긴급 112는 '수사의뢰유선'으로 넣고, 유선 신고 뒤에는 반드시 공문을 보내고 수정 보고한다. 수사 중이면 '소재미확인'으로 둔다. 경찰 회신 공문을 받은 날이 소재확인일이다. 수사 의뢰한 학생이 발견되면 교장은 즉시 교육(지원)청에 유선·쪽지로 먼저 알리고 나이스를 수정 보고한다. 수사 의뢰를 했다고 학교의 월별 소재·안전 관리가 끝나는 것은 아니다.","basis":"충북교육청 2026 매뉴얼 4-2·4-4·Q8"},{"stage":"조치·이행","when":"학업중단 의사·징후가 보일 때","who":"담임·학업중단 담당","what":"학업중단 숙려제·대안교육 안내","detail":"학업중단 징후가 발견되거나 의사를 밝힌 학생에게 학교장은 학업중단에 대해 충분히 생각할 기회를 주어야 하며 그 기간을 출석으로 인정할 수 있다. 숙려 기간·출석인정 범위는 교육감이 정한다. 숙려제·대안교육 후에도 중단을 원하면 의무교육관리위원회에서 학적 처리를 협의한다.","basis":"초·중등교육법 제28조제7항·제8항; 충북교육청 2026 매뉴얼 3"},{"stage":"심의·결정","when":"보호자가 유예·면제를 신청하거나 신청할 수 없을 때","who":"의무교육관리위원회(위원장 교장)","what":"취학 의무 유예·면제 심의","detail":"보호자가 학교장에게 유예·면제를 신청하면 의무교육관리위원회 심의를 거쳐 학교장이 결정한다. 보호자가 행방불명 등으로 신청할 수 없으면 학교장이 사유를 확인한 뒤 심의를 거쳐 결정할 수 있다. 교육감이 정하는 질병이나 부득이한 사유가 있을 때만 결정한다. 등록 대안교육기관에 다니는 의무교육대상자는 취학 의무 유예를 신청할 수 있으며, 위원회 심의와 학교장 결정이 필요하다. 미등록 시설에 다닌다는 사실만으로 유예·출결 인정이 생기지는 않는다. 심의에는 특별한 사유가 없으면 학생이 출석한다(인천).","basis":"시행령 제25조의2, 제28조제1항~제4항; 인천시교육청 2026 매뉴얼 Ⅱ-라"},{"stage":"조치·이행","when":"유예·면제 결정 후","who":"학교장","what":"결정 통보","detail":"초등학교는 보호자·읍·면·동장·교육장에게, 중학교는 보호자·교육장에게 통보한다(보호자가 행방불명이면 보호자 통보는 생략 가능). 유예는 1년 이내이며 특별한 사유가 있으면 같은 절차로 다시 유예하거나 연장한다.","basis":"시행령 제28조제5항~제7항"},{"stage":"심의·결정","when":"수업일수 3분의 1 이상 장기결석","who":"학교장(의무교육관리위원회)","what":"정원 외 학적관리","detail":"초·중학교장은 입학 후 유예받은 학생, 정당한 사유 없이 해당 학년도 수업일수의 3분의 1 이상 장기결석한 학생, 출석 통보를 받고도 학년도 시작 후 계속 출석하지 않은 학생을 학칙에 따라 정원 외로 관리할 수 있다. 위원회가 정원 외 관리를 결정한 날이 미인정결석 관리의 복귀 날짜가 된다(비고: '출석일수 부족으로 인한 정원외 학적 관리').","basis":"시행령 제29조제1항; 충북교육청 2026 매뉴얼 3·Q12"},{"stage":"조치·이행","when":"학적 변동이나 출석이 생긴 날부터","who":"담임·업무담당자","what":"복귀 보고(3일 이내)","detail":"등교, 전출, 진급, 유예, 면제, 정원 외 관리, 자퇴·퇴학 등으로 미인정결석 관리가 끝나면 3일 이내 복귀 보고한다(소재·안전이 확인된 경우만). 학업중단(유예·면제·정원외·자퇴·퇴학·제적)이면 나이스 '취학관리전담기구보고'에 학적변동 3일 이내 등록하고 학교밖청소년지원센터 정보연계도 한다. 소재·안전 미확인 학생도 학년말(2월 말일까지) 전원 복귀 보고되도록 확인한다. 다시 연속 결석하면 신규 등록이 아니라 기존 학생을 수정해 보고한다.","basis":"충북교육청 2026 매뉴얼 4-2·Q11·Q13·Q20; 인천시교육청 2026 매뉴얼 Ⅳ"},{"stage":"종결·사후","when":"학업중단 이후","who":"업무담당자·교육(지원)청","what":"취학관리 전담기구의 소재·안전 관리","detail":"유예·정원 외 학적관리 학생은 월 1회, 면제·제적·자퇴·퇴학 학생은 학기별 2회 소재·안전을 확인하고 나이스로 보고한다(유예·정원외 매월 1일자, 면제 등 학기별 4.1.자·10.1.자, 인천 기준). 인천은 2026년부터 이 확인을 교육(지원)청이 수행한다. 만 18세에 이르면 내부결재로 관리를 끝낸다.","basis":"시행령 제27조의2; 인천시교육청 2026 매뉴얼 Ⅳ"},{"stage":"종결·사후","when":"다시 학교에 오려 할 때","who":"학교장","what":"재취학·학년 결정","detail":"학년도 시작(장기결석 정원외) 또는 유예 기간 종료 한 달 전까지 보호자에게 출석하도록 통보한다. 면제·유예자나 정원 외 학생이 다시 다니려 하면 조기진급·졸업·진학 평가위원회의 교과목별 이수인정평가 결과에 따라 학년을 정할 수 있다.","basis":"시행령 제25조제5항, 제29조제2항; 초·중등교육법 제14조제2항"},{"stage":"종결·사후","when":"복귀 후","who":"담임·Wee클래스","what":"학교 적응 지원","detail":"기초학력·진로, Wee클래스·Wee센터 심리지원, 학생맞춤통합지원·위기학생 안전망(경제적 지원), 학대 피해 학생은 등교학습·비밀전학 등 맞춤형 지원을 연계한다.","basis":"충북교육청 2026 매뉴얼 5·6"},{"stage":"조치·이행","when":"취학 의무 불이행이 계속될 때","who":"교육감","what":"과태료","detail":"취학 의무 이행을 독려받고도 이행하지 않은 보호자, 의무교육을 방해한 고용자 등에게 100만원 이하 과태료를 교육감이 부과·징수한다.","basis":"초·중등교육법 제68조"}],"deadlines":[{"what":"출석 독촉·경고(초·중)","limit":"정당한 사유 없이 계속 2일 이상 결석 시 지체 없이","basis":"시행령 제25조제1항제2호"},{"what":"결석 사유 확인(고)","limit":"정당한 사유 없이 계속 2일 이상 결석 시 지체 없이","basis":"시행령 제92조의2제1항"},{"what":"읍·면·동장(초)·교육장(초·중) 통보","limit":"독촉·경고 후 3일이 지나거나 2회 이상 독촉에도 계속될 때","basis":"시행령 제25조제4항"},{"what":"교육감 통보(고)","limit":"정당한 사유 없이 계속 7일 이상 결석, 제적·자퇴·퇴학 시","basis":"시행령 제92조의2제2항"},{"what":"나이스 미인정결석 최초 보고","limit":"충북 2026 예시: 초·중 연속 10일째, 고 연속 7일째 → 담당자 3일 이내 보고(시·도마다 다름)","basis":"충북교육청 2026 매뉴얼(연속 결석 보고 기준은 시도교육청 지침에 따라 탄력 운영)"},{"what":"정기 보고","limit":"매월(월말 기준 확인, 익월 초 보고). 증빙 가능 사유는 학기별 1회","basis":"충북·인천교육청 2026 매뉴얼"},{"what":"복귀 보고·취학관리전담기구 등록","limit":"변동 후 3일 이내","basis":"충북·인천교육청 2026 매뉴얼"},{"what":"정원 외 학생 출석 통보","limit":"유예 종료·학년도 시작 한 달 전까지","basis":"시행령 제25조제5항"},{"what":"취학 유예 기간","limit":"1년 이내(재유예·연장 가능)","basis":"시행령 제28조제6항"}],"dont":["보호자 말만 듣고 학생 본인의 소재·안전을 확인하지 않은 채 넘기기","소재 불명·학대 징후 상황에서 즉시 신고 대신 기다리거나 교내에서만 찾으며 112 신고를 미루기","혼자 가정방문하기 — 2인 이상, 필요하면 읍·면·동 공무원·경찰 동행","112 유선 신고만 하고 수사 의뢰 공문과 나이스 수정 보고를 빠뜨리기","복귀·학적변동 후 복귀 보고를 빼먹어 미인정결석이 과다 집계되게 하기","재결석한 학생을 새로 등록하기 — 기존 등록 학생을 수정해 보고한다"],"contacts":[{"name":"경찰(긴급·소재수사·아동학대 신고)","tel":"112","note":"소재 미확인·학대 의심 시 즉시, 공문은 사후"},{"name":"실종·가출 신고","tel":"182","note":"경찰청 실종아동찾기센터(보호자 가출신고 안내)"},{"name":"관할 교육지원청 취학관리 전담기구","tel":"지역별","note":"초·중은 교육지원청, 고는 시·도교육청 담당 부서"},{"name":"거주지 읍·면·동 행정복지센터","tel":"지역별","note":"가정방문 동행(사회복지전담공무원), 초등 미인정결석 통보"}],"forms":["미인정결석 학생 관리 점검표(충북 2026 [서식1])","집중관리대상자 개인별 관리카드([서식1-1])","내교통지서([서식2]) — 내용증명 등기 발송 가능","가정방문 점검표([서식3])","경찰 협조(수사 의뢰) 요청 공문·상황보고([서식4]·[서식5])","출·입국 기록 정보 제공 동의서([서식6]), 행정정보 공동이용 접근권한 신청([서식7])","취학의무 유예·면제 신청서(인천 2026 소정양식), 유예·면제 결정 통보(시행령 제28조제5항)","나이스: [학적]-[미인정결석학생관리], [학업중단]-[취학관리전담기구보고관리]"],"law":[{"name":"초·중등교육법","article":"제13조(취학 의무)","point":"보호자는 자녀를 초등학교·중학교에 입학시켜 졸업할 때까지 다니게 할 의무(의무교육은 초·중까지)"},{"name":"초·중등교육법","article":"제14조(취학 의무의 면제 등)","point":"질병·발육 상태 등 부득이한 사유로 취학이 불가능하면 면제·유예, 다시 취학할 때 학습능력을 평가한 후 학년을 정할 수 있음"},{"name":"초·중등교육법","article":"제68조(과태료)","point":"취학 의무 이행을 독려받고도 불이행, 의무교육 방해 등은 100만원 이하 과태료(교육감 부과)"},{"name":"초·중등교육법","article":"제28조제7항","point":"학업중단 위기 학생에게 충분히 생각할 기회(숙려) 부여, 그 기간 출석 인정 가능"},{"name":"초·중등교육법 시행령","article":"제25조(초·중학교장의 취학 독촉·경고 및 통보)","point":"2일 이상 무단결석 시 지체 없이 독촉·경고, 가정방문·내교 요청, 읍·면·동장 동행·경찰 협조 요청, 3일 경과·2회 독촉 후 통보, 정원외 학생 한 달 전 출석 통보"},{"name":"초·중등교육법 시행령","article":"제25조의2(의무교육관리위원회의 설치)","point":"초·중학교에 설치, 5~7명(위원장 교장), 경찰·사회복지전담공무원·아동보호기관 관계자 중 외부전문가 1명 이상. 전학 추천·유예·면제·관리 사항 심의"},{"name":"초·중등교육법 시행령","article":"제26조·제27조의2","point":"읍·면·동장·교육장의 독촉·경고·가정방문, 교육장→교육감 보고, 교육감·교육장 소속 취학관리 전담기구의 소재·안전 확인"},{"name":"초·중등교육법 시행령","article":"제28조(취학 의무의 면제·유예)·제28조의2(행정정보의 공동이용)","point":"보호자 신청 → 위원회 심의 → 학교장 결정(보호자가 행방불명 등으로 신청할 수 없으면 학교장이 사유 확인 후 위원회 심의를 거쳐 결정 가능), 유예 1년 이내. 주민등록·출입국 정보 확인 가능"},{"name":"초·중등교육법 시행령","article":"제29조(유예자의 학적관리 등)","point":"유예자, 수업일수 3분의 1 이상 장기결석자 등 정원 외 학적관리, 재취학 시 이수인정평가로 학년 결정"},{"name":"초·중등교육법 시행령","article":"제92조의2(고등학교 학생 등에 대한 취학 관리)","point":"고교: 2일 이상 무단결석 시 사유 확인, 7일 이상 결석·제적·자퇴·퇴학은 교육감에 통보"}],"faq":[{"q":"초등학교 입학 예비소집에 아이가 안 왔어요. 어떻게 하나요?","a":"예비소집은 아동이 보호자와 안전하게 지내는지 직접 확인하는 절차다(2026학년도는 2025.12.16.~2026.1.30. 대면 실시). 불참 아동은 학교와 지자체가 유선·영상통화, 행정정보 공동이용으로 출입국 확인, 거주지 방문 등으로 소재·안전을 확인하고, 확인이 어려우면 관할 경찰서에 즉시 수사를 의뢰한다. 결과는 교육장에게 보고한다. 2026학년도에는 취학대상 320,157명 중 124명(해외 118명, 국내 6명)이 2.24. 기준 수사 중이었다."},{"q":"보호자가 이미 경찰에 가출신고를 했답니다. 학교는 무엇을 하나요?","a":"신고 사실을 확인해 나이스 미인정결석 보고 시 소재확인 여부를 '보호자에 의한 가출신고'로 등록하고 비고에 확인 내용을 적는다. 이후에도 월별 관리를 계속한다."},{"q":"체험학습 승인 기간이 끝났는데 해외에서 안 돌아왔어요.","a":"승인 기간 마지막 날 다음날이 최초 결석일이고, 충북 2026 매뉴얼 기준 연속 10일(초·중)·7일(고)이면 미인정결석 관리 대상이다(시·도마다 기준이 다름). 행정정보 공동이용으로 출국 여부를 반드시 확인하고, 소재·안전이 확인되면 출석을 독려한다. 입국 후 소재가 확인되지 않으면 수사를 의뢰한다."},{"q":"결석과 출석을 반복해서 연속 10일이 안 돼요.","a":"이런 학생은 학대·장기결석 가능성이 커 집중관리카드 등 자체 관리가 권장된다. 충북 2026 매뉴얼은 연속 10일(초·중)·7일(고)이 되는 시점을 기준으로 그 연속 결석의 첫날을 최초 결석일로 입력한다. 비연속 결석 10일 이상은 학기별 현황 파악 때 제출한다."},{"q":"미인가 대안교육시설에 다니는 학생은요?","a":"먼저 시설이 「초·중등교육법」상 인가받은 대안학교인지, 「대안교육기관에 관한 법률」에 따라 등록된 기관인지, 미등록 시설인지 구분한다. 등록 대안교육기관에 다니는 의무교육 대상자는 보호자가 취학 중인 학교장에게 취학 의무 유예를 신청할 수 있지만, 의무교육관리위원회 심의와 학교장 결정이 필요하며 재학만으로 자동 유예되지는 않는다. 미등록 시설 이용만으로 유예나 출결 인정이 생기지는 않는다. 초·중 학생이 정당한 사유 없이 해당 학년도 수업일수의 3분의 1 이상 장기결석한 경우에도 정원 외 학적관리는 학칙에 따른 심의·결정 사항이지 자동 처리 기준이 아니다. 구체적 결석 산정과 절차는 소속 교육청 지침을 확인한다."},{"q":"보호자와 상의하고 결석했어요. 그래도 미인정인가요?","a":"가족 봉양, 가사 조력, 간호 등 부득이한 개인 사정으로 학교장이 인정하면 '기타 결석'으로 미인정결석이 아니다(학교생활기록부 기재요령). 반대로 태만·가출·출석 거부 등 고의 결석은 미인정이다."},{"q":"고등학생은 무엇이 다른가요?","a":"고교는 의무교육이 아니어서 시행령 제25조의 독촉·경고·읍면동 통보, 의무교육관리위원회의 유예·면제 체계가 아니라 제92조의2가 적용된다: 2일 이상 무단결석 시 사유 확인, 7일 이상 결석·제적·자퇴·퇴학 시 교육감 통보. 나이스 보고 기준은 연속 7일째(충북 기준)이며, 정당한 이유 없이 결석이 잦으면 학칙에 따라 퇴학 징계도 가능하다(의무교육 학생은 퇴학 불가). 학교밖청소년지원센터 정보연계는 고교는 동의가 필요하다(인천 매뉴얼)."}],"record":"나이스 [학적]-[출결관리]에 미인정 결석 입력(태만·가출·출석 거부 등 고의 결석, 학교생활기록 작성 및 관리지침 별표 8). 초·중 연속 10일·고 연속 7일(충북 2026 기준, 시·도마다 다름)에 [학적]-[미인정결석학생관리] 등록 → 담당자 [학업중단]-[미인정결석학생관리]에서 3일 이내 제출 → 매월 정기보고 → 복귀 3일 이내 보고. 학업중단(유예·면제·정원외·자퇴·퇴학·제적)은 [학업중단]-[취학관리전담기구보고관리]에 3일 이내 등록. 교육부에 제출된 자료는 수정이 어려우니 신중히 입력한다.","deep":[{"title":"시행령 제25조, 이렇게 읽는다(초·중)","body":["① 2일: 정당한 사유 없이 계속 2일 이상 결석하면 학교장은 '지체 없이' 보호자(고용자)에게 출석을 독촉하거나 의무교육 방해 금지를 경고한다. 입학·재취학·전학·편입학 기일 후 2일 이내 미등교도 같다.","② 독촉 수단: 필요하면 가정을 방문하거나 보호자를 학교로 부를 수 있다. 가정방문 때 거주지 읍·면·동장에게 동행을, 필요하면 경찰서장에게 협조를 요청할 수 있고, 요청받은 쪽은 특별한 사유가 없으면 적극 협조해야 한다.","③ 통보: 독촉·경고 후 3일이 지나거나 2회 이상 독촉해도 계속되면 초등은 읍·면·동장과 교육장에게, 중학교는 교육장에게 경과를 통보한다. 주소지와 실거주지가 다르면 성명·주민번호를 통보한다. 이후 읍·면·동장·교육장이 다시 독촉·경고·가정방문하고, 교육장은 2회 이상에도 계속되면 교육감에게 보고한다(제26조).","④ 정원 외 학생: 유예 기간이 끝날 때, 장기결석 학생은 학년도가 시작될 때 학교에 나올 수 있도록 한 달 전까지 보호자에게 통보한다."],"basis":"초·중등교육법 시행령 제25조·제26조(시행 2026.9.11.)"},{"title":"소재·안전 확인, 무엇으로 인정되나","body":["원칙은 학생 본인 확인이다. 전화·영상통화, 행정정보 공동이용(거주지·출입국), 내교 요청(내용증명 등기), 가정방문(2인 이상 권장, 지자체 공무원·경찰 동행 가능)을 단계와 상황에 따라 쓴다.","그 밖에 SNS 대화, 시간·장소를 확인할 수 있는 현재 사진, 이메일, 국내 친족 연락처 확보도 쓸 수 있다. 해외·가출로 통화가 안 되면 날짜·장소 등 특정 문구를 적은 사진을 받는다.","나이스 '소재여부 확인일자'는 직접 통화한 날, 가정방문으로 확인한 날, 내교 상담한 날, 경찰 회신 공문을 받은 날로 적는다."],"basis":"충북교육청 2026 미인정결석 학생 관리 매뉴얼 Q1·4-2"},{"title":"경찰 수사 의뢰 전과 후","body":["의뢰 전: 출입국·주민등록 거주지 확인과 가정방문 같은 기초조사는 학교와 지자체가 먼저 한다. 의뢰 공문에는 기초조사 결과를 넣고, 사전에 관할 경찰서 아동청소년 담당과 유선 협의한다. 응급이면 112 먼저, 공문은 나중이다.","의뢰 시점: 기초조사로도 소재가 확인되지 않거나 아동학대가 의심될 때. 해외출국·질병 등이 객관적으로 증빙되면 의뢰를 지양한다. 복수국적자가 외국 여권으로 출입국한 경우는 행정정보로 조회되지 않으므로 기초조사 뒤에도 확인이 안 되면 의뢰한다.","의뢰 후: 나이스에 공문/유선 구분, 의뢰일, 경찰서명을 넣고 수사 중이면 '소재미확인'으로 둔다. 발견되면 교장이 즉시 교육(지원)청에 먼저 알리고 수정 보고한다. 학교의 월별 소재·안전 관리는 복귀 보고 때까지 계속한다."],"basis":"충북교육청 2026 매뉴얼 4-2·4-4·Q8; 인천시교육청 2026 매뉴얼 Ⅱ"},{"title":"의무교육관리위원회와 유예·면제","body":["초·중학교마다 둔다. 교장을 위원장으로 5~7명이며, 관할 경찰서 경찰공무원, 읍·면·동 사회복지전담공무원, 지역 아동보호기관 관계자 중 외부전문가가 1명 이상 들어가야 한다. 구성·운영 세부는 학칙으로 정한다. 초등은 전학 추천, 초·중 모두 유예·면제 결정과 학교장이 요청한 취학 관리 사항을 심의한다.","유예·면제는 보호자가 학교장에게 신청하고, 위원회 심의를 거쳐 학교장이 결정한다. 보호자가 행방불명이면 학교장이 사유를 확인하고 심의를 거쳐 결정할 수 있다. 교육감이 정한 질병 등 부득이한 사유에 한한다. 유예는 1년 이내이고 다시 유예·연장할 때도 같은 절차다. 결정은 초등은 보호자·읍면동장·교육장, 중학교는 보호자·교육장에게 통보한다.","면제는 의무 자체를 면하는 것으로 이민·부모 해외 파견 등 정당한 해외 출국, 외국 국적·학령초과자의 학업중단 등에 쓰인다. 미인정 유학(부모와 함께 살지 않음, 정규학교 미재학, 6개월 미만)은 미인정결석이다."],"basis":"시행령 제25조의2·제28조; 충북·인천교육청 2026 매뉴얼 용어 정의"},{"title":"정원 외 학적관리와 복귀","body":["정당한 사유 없이 수업일수 3분의 1 이상 장기결석하면 학칙에 따라 정원 외로 학적을 관리할 수 있다. 위원회가 정원 외 관리를 결정한 날이 미인정결석 관리의 복귀일이고, 이후 취학관리전담기구 보고 대상으로 옮겨 정해진 주기로 소재·안전을 확인한다(인천: 월 1회, 충북: 연 2회 수정 보고).","학년도가 시작되기 한 달 전까지 보호자에게 출석하도록 통보한다. 다시 학교에 다니려 하면 조기진급·졸업·진학 평가위원회의 이수인정평가로 학년을 정할 수 있다(학력심의위원회가 정한 경우는 그에 따름).","학년말 진급·졸업 대상은 결석이 수업일수 3분의 1을 넘지 않으면 수료·졸업일을 기점으로 복귀 처리한다."],"basis":"시행령 제29조·제25조제5항; 충북교육청 2026 매뉴얼 용어 7·3·4-2(복귀 보고); 인천시교육청 2026 매뉴얼 Ⅳ"},{"title":"고등학생은 이렇게 다르다","body":["고등학교는 의무교육이 아니다. 시행령 제92조의2에 따라 2일 이상 무단결석하면 학생·보호자에게 결석 사유를 확인하고, 7일 이상 결석했거나 제적·자퇴·퇴학한 학생은 성명·경과를 교육감에게 통보한다. 행정정보 공동이용도 할 수 있다.","나이스 미인정결석 보고는 연속 7일째가 기준이다(충북). 인천은 학교급 구분 없이 '연속 7일, 연속 3일 이상 3회, 연간 누적 30일 초과'를 최초보고 기준으로 쓰는 등 시도마다 다르다.","자퇴·퇴학 전에는 학업중단 숙려제를 안내한다. 퇴학 징계는 의무교육 학생이 아닌 경우에만 가능하며 '정당한 이유 없이 결석이 잦은 자'가 사유로 규정돼 있다. 퇴학에 이의가 있으면 퇴학 조치를 받은 날부터 15일 이내 또는 안 날부터 10일 이내 시·도학생징계조정위원회에 재심을 청구할 수 있다."],"basis":"시행령 제92조의2·제31조제5항; 초·중등교육법 제18조의2; 충북·인천교육청 2026 매뉴얼"},{"title":"예비소집 불참 아동(초등 입학 전)","body":["읍·면·동장은 10월 31일까지 취학아동명부를 만들고, 12월 20일까지 보호자에게 취학통지를 하며 명부를 학교장에게 통보한다. 보호자 부재·주소 불명으로 통지를 못 하면 경찰서장에게 소재 확인 협조를 요청할 수 있다.","학교는 예비소집 참석을 1주일 전부터 독려하고 반드시 아동 동반을 안내한다. 불참 아동은 추가 예비소집, 보호자 연락·내교 요청·가정방문, 행정정보로 출국·전출 확인을 하고, 보호자가 소재·안전을 확인시켜 주지 않거나 학대 의심·소재 불명이면 관할 경찰서에 수사를 의뢰하고 교육장에게 보고한다.","입학일 이후에도 오지 않으면 미취학 아동으로 관리한다: 입학일~2일 독려(내용증명 독촉장), 3~9일 가정방문·내교 요청·수사 의뢰, 10일 이후 명단 정리·집중관리대상 선정·교육지원청과 읍면동 보고(인천 2026)."],"basis":"시행령 제15조·제17조; 교육부 보도자료(2026.2.26.); 인천시교육청 2026 매뉴얼 Ⅱ"}],"tables":[{"title":"결석 일수별 조치(초·중 vs 고)","head":["시점","초·중학교","고등학교","근거"],"rows":[["1~2일","사유 확인·본인 통화로 소재·안전 확인, 나이스 미인정 입력. 2일 이상 계속되면 지체 없이 보호자 독촉·경고","사유 확인·소재·안전 확인. 2일 이상 계속되면 지체 없이 학생·보호자에게 사유 확인","영 제25조①, 제92조의2①"],["3일~","초·중 3~9일(충북 2026 예시): 가정방문 → 내교 요청 → 경찰 협조(순서 변경 가능)","고 3~6일(충북 2026 예시): 미인정 결석 처리 지속, 출석 독려·소재·안전 확인","영 제25조②③; 충북 2026"],["독촉 후 3일·2회 독촉","초: 읍·면·동장+교육장 통보 / 중: 교육장 통보","해당 없음","영 제25조④"],["보고 시작","연속 10일째 나이스 최초 보고(담당자 3일 이내, 충북 예시)","연속 7일째 나이스 최초 보고(충북 예시), 7일 이상 결석은 교육감 통보(영 제92조의2)","충북 2026; 영 제92조의2②"],["이후","매월 소재·안전 확인·정기보고, 3분의 1 이상이면 정원 외 관리 검토","매월 정기보고, 숙려제 안내, 자퇴·퇴학 시 교육감 통보","영 제29조; 충북·인천 2026"],["언제든","소재 미확인·학대 징후 → 즉시 112·수사 의뢰","같음","충북 2026 기본방침"]],"note":"결석 일수에서 토요일·공휴일·재량휴업일 제외. 연속 결석 보고 기준은 시도교육청 지침에 따라 다를 수 있다(시·도별 기준은 소속 교육청에 확인)."},{"title":"학적·결석 용어","head":["용어","뜻","메모"],"rows":[["유예","질병 등 부득이한 사유로 취학 의무를 다음 학년도까지 보류(1년 이내)","정원 외 학적관리 가능, 등록 대안교육기관 재학은 유예 신청 가능(심의·학교장 결정 필요)"],["면제","취학·교육 의무를 면함","정당한 해외출국, 외국 국적·학령초과자의 학업중단 등"],["인정유학","부모와 함께 이민·해외 파견 등 정당한 해외 출국","초·중은 면제 처리"],["미인정유학","부모와 함께 살지 않음, 정규학교 미재학, 인정 사유여도 6개월 미만","미인정결석 처리"],["정원 외 학적관리","유예자·수업일수 3분의 1 이상 장기결석자 등을 학칙에 따라 정원 밖으로 관리","영 제29조"],["집중관리대상","소재 불분명·학대 우려·가정 내 학습·자살 관심군·학대 이력 등","관리카드 월 1회 누가기록"]],"note":"출처: 충북교육청 2026 미인정결석 학생 관리 매뉴얼 용어 정의, 인천시교육청 2026 매뉴얼."},{"title":"관리 대상별 소재·안전 확인·보고 주기","head":["대상","소재·안전 확인","나이스 보고"],"rows":[["미인정결석(최초 보고 후)","매월(월말 기준)","익월 1일자(충북: 담당자 5일까지)"],["미인정결석 중 증빙 가능(해외출국·대안교육시설·질병)","학기별 1회","학기별 1회"],["집중관리대상","월 1회 이상 + 관리카드","매월"],["유예·정원 외 학적관리","월 1회","익월 1일자"],["면제·제적·자퇴·퇴학","학기별 2회","학기별 1회(4.1.자, 10.1.자)"],["복귀(출석·학적변동)","확인된 경우만","3일 이내 복귀 보고"]],"note":"취학관리전담기구 주기는 인천시교육청 2026 매뉴얼 기준(2026년부터 확인은 교육(지원)청 수행). 만 18세 도달 시 관리 종료."}],"sources":[{"title":"초·중등교육법 시행령(시행 2026.9.11., 대통령령 제36645호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법시행령"},{"title":"초·중등교육법(시행 2026.9.11., 법률 제21424호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"2026. 미인정결석 학생 관리 매뉴얼","publisher":"충청북도교육청 인성시민과","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/06/56EF10B2-EDA2-1CC0-B753-887F27A28444.pdf"},{"title":"2026학년도 미취(입)학·미인정결석 아동(학생) 관리 매뉴얼","publisher":"인천광역시교육청 학교생활교육과","year":2026,"url":"https://www.ice.go.kr/upload/ice/na/bbs_2094/2026/04/c5cb311dfe15982b6858d34aed35dd44.pdf"},{"title":"2026학년도 전국 취학대상아동 소재 확인 실시(보도자료, 2026.2.26.)","publisher":"교육부·경찰청","year":2026,"url":"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156746240"},{"title":"대안교육기관에 관한 법률(시행 2025.7.22.) 제5조·제10조","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/lsInfoP.do?lsId=013984"},{"title":"대안교육기관에 관한 법률 시행령(시행 2025.7.22.) 제7조","publisher":"국가법령정보센터","year":2025,"url":"https://law.go.kr/lsLinkCommonInfo.do?lspttninfSeq=173527"},{"title":"초·중등교육법 시행령(시행 2026.9.11.) 제28조","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033325221"}],"verified":"2026-09-24","uncertain":["교육부 「의무교육단계 미취학·학업중단 학생 관리 매뉴얼」 원문(최신판)은 받지 못했다. 교육부 매뉴얼을 바탕으로 만든 충북·인천교육청 2026년판으로 대신했으며, 나이스 보고 기준·주기는 시도마다 차이가 있다(예: 최초보고 기준 충북 '초·중 연속 10일, 고 연속 7일' vs 인천 '학교급 구분 없이 연속 7일, 연속 3일 이상 3회, 연간 누적 30일 초과'; 취학관리전담기구 유예·정원외 학생 확인 주기 충북 연 2회 vs 인천 월 1회).","시·도교육청별 2026 미인정결석·미취학 관리 지침(보고 일자, 담당 부서, 서식 번호)은 소속 교육청에서 확인해야 한다.","의무교육관리위원회의 유예·면제·정원외 결정에 대한 보호자 불복 절차와 과태료(법 제68조) 부과에 대한 이의 절차는 원문으로 확인하지 못했다.","학교 자체 판단의 '첫날 가정방문', '2인 이상 동행'은 교육청 매뉴얼의 권장 사항이며 법정 의무는 아니다.","의무교육관리위원회 회의록 서식은 원문 확인 필요(충북·인천 매뉴얼에서 서식을 찾지 못함).","학교밖청소년지원센터 정보연계 동의 요건(초·중 학교장 판단 가능, 고 동의 필수)은 인천 매뉴얼 기준이며 법 조문은 확인하지 않았다. 정원 외 학적관리의 결석일 산정과 학교별 심의 절차는 학칙·시도 지침을 확인한다."],"related":["runaway-missing","child-abuse"]},{"id":"drugs-substance","title":"마약류·약물 오남용과 흡연·음주","aka":["마약","대마","필로폰","펜타닐 패치","ADHD약 거래","공부 잘하는 약","메틸페니데이트","다이어트약","식욕억제제","약 사고팔기","텔레그램 거래","전자담배","액상 담배","교내 흡연","음주","1342"],"category":"학생 보호·위기","urgency":"즉시","roles":["처음 알게 된 교직원","담임","보건교사","생활교육(학생부) 부장","전문상담(교)사","교감","교장"],"summary":"마약류(마약·향정신성의약품·대마)의 취급은 법에서 허용한 자격·업무 범위와 환자 본인의 적법한 처방·사용을 따라야 하며, 이를 벗어난 소지·매매·수수·제공 등은 범죄가 될 수 있다. 향정신성의약품을 미성년자에게 법정 예외 없이 매매·수수·조제·투약·제공하면 무기 또는 5년 이상 징역 등 중한 벌칙 대상이 될 수 있다(마약류관리법 제58조제1항제7호). 메틸페니데이트 계열 등 일부 ADHD 치료제, 일부 식욕억제제, 펜타닐 패치 등은 마약류로 관리되는 품목이 있으므로 성분·처방 여부를 확인한다. 과다복용이 의심되면 119가 먼저다. 물품은 학칙과 안전을 고려해 분리하고 관리자에게 보고하며, 보호자 통지와 경찰 신고는 해당 법령·학교 절차에 따라 진행한다. 학생에게 1342(24시간 무료·비밀보장) 상담과 치료보호를 안내하고, 흡연·음주·전자담배는 학칙에 따른 생활지도로 다룬다.","first":["의식 저하·호흡 이상·경련 등 과다복용이 의심되면 119에 신고하고 보건교사를 부른다 — 학생을 혼자 두지 않는다","약·패치·액상 등 물품은 학칙에 따라 분리 보관하고, 버리거나 맛보거나 돌려주지 않는다","교감·교장에게 보고하고 보호자에게 알린다(물품 분리보관 뒤 보호자 통지는 학교장 몫)","투약·거래 정황이 있으면 관리자와 함께 경찰(112) 신고 여부를 정한다 — 거래 경로(SNS)는 캡처로 남긴다","학생과 보호자에게 1342(24시간, 무료, 비밀보장) 상담을 안내한다"],"steps":[{"stage":"알게 됨·신고","when":"의심 신호를 봤을 때","who":"처음 알게 된 교직원","what":"신호 알아차리기","detail":"친구에게서 약을 받거나 팔았다는 제보, 처방약(ADHD 치료제·식욕억제제)을 모아 두거나 나눠 주는 모습, 패치·액상·알약 소지, SNS·텔레그램 거래 흔적 등을 가볍게 넘기지 않는다. 정부는 ADHD 치료제를 '공부 잘하는 약'으로 인식해 오남용·불법 유통이 늘었다고 보고 있고, 국정원·경찰 조사(2024.7~9)에서 텔레그램 등 SNS 37곳의 ADHD 치료제 거래방과, 본인 복용용으로 처방받은 약 일부를 불법 거래한 사례가 적발됐다.","basis":"'25년 마약류 관리 시행계획(2025.3.) 6쪽"},{"stage":"초기 대응","when":"과다복용 의심 시 즉시","who":"발견 교직원·보건교사","what":"119 신고와 응급처치","detail":"생명이 먼저다. 119에 신고하고 보건교사가 응급처치를 한다. 먹은 약의 포장·남은 약을 구급대에 전달할 수 있게 챙긴다."},{"stage":"초기 대응","when":"위험 물품 소지가 의심될 때","who":"교원","what":"소지품 조사","detail":"학생이 자신이나 타인의 생명·신체에 위해를 끼칠 우려가 있는 물품을 가졌다고 의심할 합리적 이유가 있으면 필요한 범위에서 소지품을 조사할 수 있다. 조사 중 신체 접촉이 생길 수 있으면 학생과 같은 성별 교직원의 도움을 받을 수 있다.","basis":"교원의 학생생활지도에 관한 고시 제12조제4항; 같은 고시 해설서(2025년도 일부개정) 63쪽"},{"stage":"초기 대응","when":"물품을 발견하면","who":"교원","what":"분리 보관","detail":"안전·건강에 위해를 줄 우려가 있는 물품, 법령상 학생에게 판매될 수 없는 물품(담배·주류 포함)은 학칙에 따라 분리·보관해 사용·소지를 제한할 수 있다. 마약류 의심 물품은 임의로 버리거나 시험해 보지 말고, 봉투에 담아 봉인·보관했다가 경찰 신고 때 넘기는 것이 안전하다.","basis":"교원의 학생생활지도에 관한 고시 제12조제5항제2호·제3호"},{"stage":"초기 대응","when":"당일","who":"교원 → 교장","what":"학교장 보고·보호자 통지","detail":"분리 보관 등 생활지도를 하면 교원은 일시·경위를 학교장에게 보고하고, 학교장은 그 사실을 보호자에게 알린다.","basis":"교원의 학생생활지도에 관한 고시 제12조제6항"},{"stage":"조사·확인","when":"보고 직후","who":"교장·교감·생활교육부장","what":"사실 확인과 신고 판단","detail":"어떤 물질인지, 본인 처방약인지, 누구에게서 받았고 누구에게 줬는지를 확인한다. 처방받아 투약·소지하는 것은 합법이지만, 마약류취급자가 아닌 사람이 마약·향정신성의약품을 남에게 팔거나(매매), 주거나(수수·제공), 처방 없이 소지·투약하면 불법이다. 국·공립학교 교원은 공무원으로서 직무 중 범죄가 있다고 생각되면 고발해야 하고, 누구든지 고발할 수 있다. 경찰 신고는 112 또는 관할 경찰서로 한다.","basis":"마약류 관리에 관한 법률 제3조·제4조제1항·제2항제1호; 형사소송법 제234조"},{"stage":"조사·확인","when":"거래가 확인될 때","who":"교장","what":"판매·권유자 위험성 알리기","detail":"미성년자에게 향정신성의약품을 매매·수수·제공하면 무기 또는 5년 이상 징역(제58조제1항제7호), 미성년자에게 대마를 수수·제공하면 2년 이상 유기징역(제58조의2), 타인에게 마약류 투약을 권유하면 2년 이하 징역 또는 2천만원 이하 벌금이며 미성년자 대상이면 2분의 1까지 가중된다(제63조). 금지행위 관련 정보를 남에게 알리는 것(SNS 판매 광고 등)도 금지된다. 학생끼리 ADHD 치료제를 나눠 주는 일도 여기에 걸릴 수 있다.","basis":"마약류 관리에 관한 법률 제3조제12호·제13호, 제58조제1항제7호, 제58조의2, 제63조"},{"stage":"조치·이행","when":"신고 뒤","who":"교장·담임","what":"수사 협조와 학생 보호","detail":"물품·캡처 등을 경찰에 넘기고, 경찰 조사는 보호자 동행 등 학생 보호 절차를 챙긴다. 공익적 목적(예방교육 등)이 아닌 한 사건 정보·거래 방법을 학생들에게 퍼뜨리지 않도록 한다.","basis":"마약류 관리에 관한 법률 제3조제12호 단서"},{"stage":"조치·이행","when":"당일~며칠 안","who":"보건교사·상담교사·담임","what":"상담·치료 연계(1342)","detail":"마약 고민이 있으면 1342로 24시간 전화 상담을 받을 수 있다. 수신자 부담(무료)이며 상담 내용과 개인정보는 비밀이 보장되고 외부 기관에 제공되지 않는다. 오남용 예방, 중독심리 상담, 치료병원 안내, 재활기관 연계를 한다. 한국마약퇴치운동본부가 운영한다. 우울·불안 등 함께 있는 어려움은 Wee클래스·Wee센터로 잇는다.","basis":"식품의약품안전처·정책브리핑 1342 안내(2024); '25년 마약류 관리 시행계획"},{"stage":"심의·결정","when":"중독이 의심될 때","who":"보건복지부장관·시·도지사(치료보호심사위원회)","what":"판별검사·치료보호","detail":"보건복지부장관 또는 시·도지사는 마약류 사용자에게 치료보호기관에서 중독 판별검사(1개월 이내)를 받게 하고, 중독자로 판명되면 치료보호(12개월 이내, 입원·통원)를 받게 할 수 있다. 치료보호심사위원회 심의를 거치며 비용은 국가·지방자치단체가 부담한다.","basis":"마약류 관리에 관한 법률 제2조제9호·제40조제7항~제11항"},{"stage":"조치·이행","when":"치료 후","who":"재활기관","what":"사회재활 연계","detail":"마약 특화 사회재활은 함께한걸음센터(전국 17개소), 알코올·도박 등이 함께 있으면 중독관리통합지원센터가 맡는다. 치료보호가 끝나면 본인 동의를 받아 재활기관에 연계한다. 가족을 위한 회복 지원 프로그램은 2025년 전국 함께한걸음센터로 확대하는 것이 정부 계획이다.","basis":"'25년 마약류 관리 시행계획(2025.3.) 16~17쪽; 마약류 관리에 관한 법률 제51조의2"},{"stage":"심의·결정","when":"수사 이후","who":"검찰·법원","what":"사법 처분","detail":"투약 사범은 치료·재활을 조건으로 한 조건부 기소유예(선도·치료·교육 유형, 2024.4.부터 '사법-치료-재활 연계모델')를 받을 수 있다. 법원이 투약 사범에게 유죄판결(선고유예 제외)을 선고하거나 약식명령을 고지하면 200시간 범위의 재범예방 수강명령 또는 재활교육 이수명령을 병과한다. 소년사건은 소년법 절차를 따른다.","basis":"'25년 마약류 관리 시행계획 7·17쪽; 마약류 관리에 관한 법률 제40조의2제2항"},{"stage":"심의·결정","when":"학교 차원","who":"학교장(선도·징계 절차)","what":"학칙에 따른 징계","detail":"학교장은 교육상 필요하면 학교 내 봉사, 사회봉사, 특별교육이수, 출석정지(1회 10일·연간 30일 이내), 퇴학처분 중 하나를 할 수 있다. 사유의 경중에 따라 단계적으로 적용하고 의견 진술 기회를 준다. 의무교육(초·중) 학생은 퇴학시킬 수 없다.","basis":"초·중등교육법 제18조; 시행령 제31조"},{"stage":"불복·구제","when":"퇴학 처분을 받았을 때(고교)","who":"학생·보호자","what":"재심 청구","detail":"퇴학 조치에 이의가 있으면 조치를 받은 날부터 15일 이내 또는 안 날부터 10일 이내에 시·도학생징계조정위원회에 서면으로 재심을 청구한다. 위원회는 30일 이내 심사·결정해 통보하고, 그 결정에 이의가 있으면 통보를 받은 날부터 60일 이내 행정심판을 제기할 수 있다.","basis":"초·중등교육법 제18조의2; 시행령 제31조의2"},{"stage":"종결·사후","when":"복귀 후","who":"담임·상담교사·보건교사","what":"재발 방지와 예방교육","detail":"교육부장관과 교육감은 학교장이 모든 학생에게 마약류 중독·오남용 예방교육을 체계적으로 실시하도록 해야 한다(보건교육·학교안전교육 등과 연계 가능). 학교 안전교육 고시에 따른 약물 오남용 예방교육 최소 시간은 유치원·초등 5시간, 중학교 6시간, 고등학교 7시간이며 교육부 교사용 지도서(중·고 2025, 유·초 2026)를 쓸 수 있다.","basis":"학교보건법 제9조의3; 교육부 보도자료(2026.3.25.)"},{"stage":"조치·이행","when":"(흡연·음주 트랙) 흡연·전자담배·음주를 발견했을 때","who":"교원","what":"학칙에 따른 생활지도","detail":"조언·주의·훈육(말로 제지)·훈계 순으로 지도하고, 담배·전자담배·주류는 법령상 학생에게 판매될 수 없는 물품으로 학칙에 따라 분리 보관할 수 있다(보관 후 학교장 보고, 보호자 통지). 반복되면 학칙에 따른 선도·징계로 넘긴다.","basis":"교원의 학생생활지도에 관한 고시 제12조·제13조; 초·중등교육법 시행령 제31조"},{"stage":"조치·이행","when":"교내·주변 흡연","who":"학교·지자체","what":"금연구역 관리","detail":"초·중·고 학교는 교사(校舍)와 운동장 등 모든 구역이 금연구역이며, 학교 경계선 30미터 이내 통행 구역도 시·군·구가 금연구역으로 지정한다. 금연구역에서 흡연하면 10만원 이하 과태료 대상이다(부과는 지자체).","basis":"국민건강증진법 제9조제4항제6호·제6항제3호, 제34조제3항"},{"stage":"조치·이행","when":"술·담배 구입 경로가 드러나면","who":"교장","what":"판매·대리구매자 신고 검토","detail":"누구든지 청소년(19세 미만, 19세가 되는 해 1월 1일을 맞은 사람 제외)에게 주류·담배 등 청소년유해약물을 판매·제공할 수 없고, 청소년 부탁을 받아 대신 사서 주는 것도 금지된다. 판매자는 나이와 본인 여부를 확인해야 한다. 경로가 확인되면 관할 경찰·지자체에 알린다.","basis":"청소년 보호법 제2조제1호·제4호, 제28조"}],"deadlines":[{"what":"과다복용 의심 신고","limit":"즉시(119)","basis":"생명 우선(일반 원칙)"},{"what":"물품 분리보관 뒤 학교장 보고·보호자 통지","limit":"지도한 뒤(고시에 기한 명시 없음 — 보고·통지는 의무)","basis":"생활지도 고시 제12조제6항"},{"what":"중독 판별검사 기간","limit":"1개월 이내","basis":"마약류 관리에 관한 법률 제40조제7항"},{"what":"치료보호 기간","limit":"12개월 이내","basis":"마약류 관리에 관한 법률 제40조제7항"},{"what":"퇴학 재심 청구(고교)","limit":"조치 받은 날부터 15일 이내 또는 안 날부터 10일 이내","basis":"초·중등교육법 제18조의2제1항"},{"what":"징계조정위원회 결정","limit":"청구 후 30일 이내","basis":"초·중등교육법 제18조의2제2항"},{"what":"재심 결정에 대한 행정심판","limit":"통보 받은 날부터 60일 이내","basis":"초·중등교육법 제18조의2제3항"},{"what":"출석정지 징계 한도","limit":"1회 10일 이내, 연간 30일 이내","basis":"초·중등교육법 시행령 제31조제1항제4호"}],"dont":["의심 약물을 직접 맛보거나 냄새를 맡거나 쓰레기통에 버리기","처방 사실만으로 학생 간 ADHD 치료제·체중감량약 나눔을 허용하거나 방치하기 — 처방은 타인에게 주는 근거가 아니다","과다복용 의심 학생을 보건실에 혼자 눕혀 두기","사건을 교실에서 공개하거나 거래 방법·구매 경로를 학생들 앞에서 자세히 말하기","처벌만 이야기하고 상담·치료 연결(1342)을 빠뜨리기","흡연 학생의 전자담배·라이터를 분리보관 후 기록·보고 없이 처리하기"],"contacts":[{"name":"응급","tel":"119","note":"과다복용·의식 저하"},{"name":"경찰","tel":"112","note":"마약류 투약·거래 신고"},{"name":"마약류 중독 상담(용기한걸음센터)","tel":"1342","note":"24시간, 수신자 부담 무료, 상담 내용·개인정보 비밀보장, 한국마약퇴치운동본부 운영"},{"name":"청소년전화","tel":"1388","note":"24시간"},{"name":"정신건강 상담전화","tel":"1577-0199","note":"24시간 정신건강 위기상담"},{"name":"관할 보건소·정신건강복지센터·중독관리통합지원센터","tel":"지역별","note":"금연·절주·중독 상담"}],"forms":["물품 분리보관 기록(일시·경위·물품·보관자·반환/인계) — 학교장 보고용","소지품 조사 기록(합리적 의심 사유·입회자·결과)","경찰 인계 물품 목록·SNS 캡처","보호자 통지 기록, 상담 연계(1342·Wee) 기록","선도·징계 절차 서류(의견진술 기회 부여, 결정 통보), 퇴학 시 재심 안내"],"law":[{"name":"마약류 관리에 관한 법률","article":"제3조(일반 행위의 금지)","point":"누구든지 법에 따르지 않은 마약류 사용 금지, 금지행위 정보를 알리거나 제시하는 행위(공익 목적 제외)와 타인에게 투약·흡연·섭취를 권유하는 행위 금지"},{"name":"마약류 관리에 관한 법률","article":"제4조(마약류취급자가 아닌 자의 마약류 취급 금지)","point":"마약·향정신성의약품 소지·사용·수수·매매·제공 등 금지. 다만 의료업자에게 처방·투약받아 소지하는 경우는 예외"},{"name":"마약류 관리에 관한 법률","article":"제58조제1항제7호·제58조의2·제63조","point":"미성년자에게 향정신성의약품 매매·수수·제공 → 무기 또는 5년 이상 징역. 미성년자에게 대마 수수·제공 → 2년 이상. 투약 권유 → 2년 이하 또는 2천만원 이하, 미성년자 대상 2분의 1까지 가중"},{"name":"마약류 관리에 관한 법률","article":"제40조(마약류 중독자의 치료보호)","point":"판별검사 1개월 이내, 치료보호 12개월 이내, 치료보호심사위원회 심의, 비용 국가·지자체 부담"},{"name":"학교보건법","article":"제9조의3(마약류 중독·오남용 예방교육)","point":"교육부장관·교육감은 학교장이 모든 학생에게 마약중독예방교육을 체계적으로 실시하도록 해야 함(2025.3.18. 신설)"},{"name":"형사소송법","article":"제234조(고발)","point":"누구든지 범죄가 있다고 생각되면 고발할 수 있고, 공무원은 직무 중 범죄가 있다고 생각되면 고발해야 한다"},{"name":"교원의 학생생활지도에 관한 고시","article":"제12조제4항~제6항","point":"합리적 의심 시 필요한 범위의 소지품 조사, 위해 물품·판매 금지 물품 분리보관, 학교장 보고·보호자 통지"},{"name":"국민건강증진법","article":"제9조제4항제6호·제34조제3항","point":"초·중·고 학교 전 구역 금연구역, 금연구역 흡연 10만원 이하 과태료"},{"name":"청소년 보호법","article":"제28조","point":"청소년에게 주류·담배·마약류 등 청소년유해약물 판매·제공·대리구매 금지"}],"faq":[{"q":"학생이 자기 ADHD약을 친구에게 몇 알 줬다고 합니다. 이것도 문제인가요?","a":"처방받은 본인이 소지·복용하는 것은 합법이지만, 마약류취급자가 아닌 사람이 향정신성의약품을 다른 사람에게 주거나(수수·제공) 파는 것(매매)은 금지된다. 더구나 받은 사람이 미성년자면 제58조제1항제7호(무기 또는 5년 이상 징역)에 해당할 수 있는 중대한 문제다. 관리자와 신고 여부를 정하고 보호자에게 알린다."},{"q":"학생이 스스로 상담받고 싶어 하는데 처벌이 두렵다고 해요.","a":"1342 상담은 24시간·무료이며 상담 내용과 개인정보가 비밀로 보장되고 외부 기관에 제공되지 않는다고 식약처가 안내하고 있다. 먼저 1342로 연결해 치료·재활 경로를 안내받게 한다."},{"q":"교사는 마약 사실을 알면 반드시 신고해야 하나요?","a":"형사소송법 제234조제2항은 공무원이 직무 중 범죄가 있다고 생각하면 고발해야 한다고 정하고 있어 국·공립학교 교원은 이에 해당한다. 사립학교 교원도 누구든지 고발할 수 있다(같은 조 제1항). 학교장 보고를 거쳐 학교 차원에서 판단하고, 교육청 지침이 있으면 따른다."},{"q":"교내에서 담배를 피우다 걸린 학생도 경찰에 알려야 하나요?","a":"흡연·음주는 학칙에 따른 생활지도와 선도·징계로 다룬다. 다만 학교는 전 구역 금연구역이라 지자체가 과태료(10만원 이하)를 부과할 수 있고, 학생에게 담배·술을 판 업소나 대신 사 준 사람은 청소년 보호법 위반이다."},{"q":"소지품 검사를 해도 되나요?","a":"자신·타인의 생명·신체에 위해를 끼치거나 재산에 중대한 손해를 줄 물품을 가졌다고 의심할 합리적 이유가 있을 때 필요한 범위에서만 할 수 있다(생활지도 고시 제12조제4항). 막연한 일제 검사가 아니라 이유와 범위를 기록한다."},{"q":"치료보호를 받으면 비용은 누가 내나요?","a":"마약류 관리법 제40조에 따라 판별검사와 치료보호 비용은 국가와 지방자치단체가 부담한다. 치료보호에는 2024.7.5.부터 건강보험이 적용되고 나머지는 예산으로 지원된다('25년 시행계획)."}],"record":"마약류 사안은 학교장 보고·보호자 통지 기록, 분리보관·경찰 인계 기록을 남긴다. 학교 징계를 하면 학칙과 학교생활기록부 기재요령에 따라 처리한다. 상담·치료 연계 내용은 민감정보로 관련 교사만 공유한다. 흡연·음주는 분리보관 등 생활지도 일시·경위를 학교장에게 보고(생활지도 고시 제12조제6항).","deep":[{"title":"무엇이 '마약류'인가 — 의료용도 포함","body":["법에서 마약류는 마약, 향정신성의약품, 대마다. 병원 처방약 중에는 펜타닐, 메틸페니데이트 등 마약류로 지정된 성분이 있다. ADHD 치료제·식욕억제제·항불안제라는 약효 분류만으로 마약류 여부를 단정할 수 없으므로 성분과 품목을 확인한다. 정부는 ADHD 치료제(메틸페니데이트) 처방량이 2022년보다 2024년에 58.4% 늘었고 '공부 잘하는 약'으로 인식돼 오남용·불법 유통이 늘었다고 보고 있다.","처방받은 본인이 복용·소지하는 것은 합법이다. 그러나 남에게 팔거나 주거나, 처방 없이 구하거나, 거래를 권유·광고하는 것은 모두 불법이다.","학생이 가진 알약·패치가 무엇인지 모르면 성분을 추측하지 말고 봉인 보관했다가 경찰·의료진에 넘기는 것이 안전하다."],"basis":"마약류 관리에 관한 법률 제2조·제3조·제4조; '25년 마약류 관리 시행계획 5·6쪽"},{"title":"신고와 치료는 함께 간다","body":["학교가 할 일은 두 갈래다. 하나는 범죄 대응 — 투약·거래가 의심되면 학교장 보고 뒤 경찰 신고(국·공립 교원은 직무상 고발 의무)와 증거 인계. 다른 하나는 건강 회복 — 1342 상담, 치료보호, 사회재활로 잇는 것이다.","정부는 치료보호기관을 확대하고(2024년 31곳, 권역별 치료보호기관 9곳), 24시간 상담 1342와 함께한걸음센터(17곳)를 운영한다. 치료보호에는 2024.7.5.부터 건강보험(약 70%)과 예산(약 30%)이 적용된다.","사법 절차에서도 치료·재활을 조건으로 한 조건부 기소유예와 '사법-치료-재활 연계모델'(2024.4.~)이 있고, 법원은 투약 사범에게 유죄판결(선고유예 제외) 시 200시간 범위의 수강·이수명령을 병과한다."],"basis":"'25년 마약류 관리 시행계획 7·16쪽; 마약류 관리에 관한 법률 제40조·제40조의2; 형사소송법 제234조"},{"title":"물품을 발견했을 때의 법적 근거","body":["생활지도 고시 제12조제4항: 생명·신체 위해나 재산의 중대한 손해를 끼칠 우려가 있는 물품을 가졌다고 의심할 합리적 이유가 있으면 필요한 범위에서 소지품을 조사할 수 있다.","같은 조 제5항: 학칙에 따라 안전·건강에 위해를 줄 우려가 있는 물품(2호), 관련 법령상 학생에게 판매될 수 없는 물품(3호) 등을 분리·보관해 사용·소지를 제한할 수 있다. 담배·술은 3호, 마약류 의심 물품은 2호로 볼 수 있다(호 구분은 해석).","같은 조 제6항: 교원은 지도의 일시·경위를 학교장에게 보고하고 학교장은 보호자에게 알린다. 마약류 의심 물품은 학생에게 돌려주지 말고 경찰 신고 때 넘기는 것이 안전하다."],"basis":"교원의 학생생활지도에 관한 고시(교육부고시 제2026-3호, 2026.3.1. 시행) 제12조"},{"title":"흡연·음주·전자담배는 학칙으로","body":["흡연·음주는 형사 사안이 아니라 학칙에 따른 생활지도 대상이다. 조언·주의·훈육·훈계를 거쳐, 반복되면 학교장이 학교 내 봉사·사회봉사·특별교육이수·출석정지(1회 10일·연간 30일 이내)·퇴학(고교만) 중에서 단계적으로 징계한다.","학교 전 구역은 금연구역이고 금연구역 흡연은 10만원 이하 과태료 대상이다. 학교 경계 30미터 이내 통행 구역도 지자체가 금연구역으로 지정한다.","학생에게 술·담배를 판 업소나 대리구매해 준 사람은 청소년 보호법 위반이므로 경로가 드러나면 관할 기관에 알린다."],"basis":"생활지도 고시 제11~13조; 초·중등교육법 시행령 제31조; 국민건강증진법 제9조·제34조; 청소년 보호법 제28조"},{"title":"징계 불복(퇴학)","body":["학교 징계 중 불복 절차가 법에 정해진 것은 퇴학이다. 학생 또는 보호자는 퇴학 조치를 받은 날부터 15일 이내 또는 안 날부터 10일 이내 시·도학생징계조정위원회에 서면으로 재심을 청구한다(청구인 이름·주소·연락처, 피청구인, 퇴학 조치를 안 날, 청구 취지·이유).","위원회는 30일 이내 심사·결정해 통보하고, 결정에 이의가 있으면 통보를 받은 날부터 60일 이내 행정심판을 제기할 수 있다. 위원회는 7명 이내, 회의는 비공개가 원칙이다.","의무교육(초·중) 학생은 퇴학 처분 자체를 할 수 없다."],"basis":"초·중등교육법 제18조·제18조의2; 시행령 제31조·제31조의2·제31조의3"}],"tables":[{"title":"물질별 학교 대응","head":["물질","법적 성격","학교 대응"],"rows":[["필로폰·대마 등 불법 마약류","소지·투약·매매 모두 범죄","봉인 보관, 교장 보고, 보호자 통지, 경찰 신고, 1342·치료 연계"],["마약류로 지정된 성분·품목(예: 펜타닐 패치, 메틸페니데이트 등; 식욕억제제는 성분별 확인)","본인 처방·복용은 합법, 남에게 매매·수수·제공은 범죄(미성년자 대상 중형)","처방 여부 확인, 거래 정황이면 신고, 오남용이면 의료·1342 연계"],["일반 의약품 과다복용","마약류 아님(오남용)","응급 시 119, 보건교사, 자살·자해 위험 확인"],["담배·전자담배·주류","청소년 판매 금지 물품, 학교 전 구역 금연구역","학칙 생활지도·분리보관, 반복 시 선도·징계, 판매자는 청소년 보호법 위반"]],"note":"근거: 마약류 관리에 관한 법률 제3·4·58·58의2조, 생활지도 고시 제12조, 국민건강증진법 제9조, 청소년 보호법 제28조. 담배사업법 제2조제1호(2026.4.24. 시행)는 '담배'를 연초나 니코틴을 원료의 전부 또는 일부로 하여 만든 것으로 정의한다."},{"title":"상담·치료·재활 기관","head":["기관","하는 일","비고"],"rows":[["1342(용기한걸음센터)","24시간 전화 상담, 오남용 예방·중독심리 상담, 치료병원·재활기관 안내","무료, 비밀보장, 한국마약퇴치운동본부"],["치료보호기관","중독 판별검사(1개월 이내), 치료보호(12개월 이내, 입원·통원)","비용 국가·지자체 부담, 건강보험 적용(2024.7.5.~)"],["함께한걸음센터","마약류 단일 중독·투약사범 사회재활, 가족 회복 프로그램","전국 17개소"],["중독관리통합지원센터","마약류와 알코올·도박 등 동반 중독 재활","60개소(2025년 기준; 최신 센터 수는 공식 누리집 확인)"],["Wee클래스·Wee센터","학교 적응·정서 상담","우울·불안 등 동반 문제"]],"note":"출처: '25년 마약류 관리 시행계획(2025.3.), 마약류 관리에 관한 법률 제40조, 식약처 1342 안내."},{"title":"학생에게 알려 줄 처벌 기준(요약)","head":["행위","조항","법정형"],"rows":[["미성년자에게 향정신성의약품 매매·수수·제공","제58조제1항제7호","무기 또는 5년 이상 징역"],["미성년자에게 대마 수수·제공","제58조의2제1항","2년 이상 유기징역"],["향정신성의약품(나·다목) 매매·수수·소지·투약","제60조제1항제2호","10년 이하 징역 또는 1억원 이하 벌금"],["타인에게 마약류 투약 유인·권유","제63조제1항제17호·제2항","2년 이하 징역 또는 2천만원 이하 벌금, 미성년자 대상 2분의 1까지 가중"]],"note":"마약류 관리에 관한 법률(시행 2026.8.27.). 약물이 향정신성의약품 가·나·다·라목 중 어디에 속하는지에 따라 적용 조항이 달라진다."}],"sources":[{"title":"마약류 관리에 관한 법률(시행 2026.8.27., 법률 제21691호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/마약류관리에관한법률"},{"title":"'25년 마약류 관리 시행계획","publisher":"마약류대책협의회(국무조정실 등 관계부처)","year":2025,"url":"https://www.kmcc.go.kr/download.do?fileSeq=60709"},{"title":"마약 고민, 언제 어디서나 '1342'로 전화하세요(정책뉴스)","publisher":"대한민국 정책브리핑(식품의약품안전처)","year":2024,"url":"https://www.korea.kr/news/policyNewsView.do?newsId=148929421"},{"title":"유치원부터 고등학교까지 마약류 포함 약물 오남용 예방교육 교사용 지도서 개발·배포(보도자료, 2026.3.25.)","publisher":"교육부","year":2026,"url":"https://www.korea.kr/briefing/pressReleaseView.do?newsId=156750801"},{"title":"학교보건법(시행 2025.10.1.) 제9조의3","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교보건법"},{"title":"교원의 학생생활지도에 관한 고시(교육부고시 제2026-3호)","publisher":"교육부(국가법령정보센터)","year":2026,"url":"https://www.law.go.kr/행정규칙/교원의학생생활지도에관한고시"},{"title":"형사소송법(시행 2026.7.1.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/형사소송법"},{"title":"국민건강증진법(시행 2026.4.30.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국민건강증진법"},{"title":"청소년 보호법(시행 2026.7.1.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/청소년보호법"},{"title":"담배사업법(시행 2026.4.24., 법률 제21216호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/담배사업법"},{"title":"초·중등교육법·시행령(시행 2026.9.11.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"마약류 중독 상담(1342 용기한걸음센터)","publisher":"식품의약품안전처 마약청정 대한민국","year":2026,"url":"https://nodrugzone.mfds.go.kr/home/kor/M928548033/consultation/index.do"},{"title":"정신건강 위기상담전화(1577-0199) 운영","publisher":"보건복지부","year":2025,"url":"https://www.mohw.go.kr/menu.es?mid=a10706040100"},{"title":"마약류 관리에 관한 법률 시행령 별표 4 (메틸페니데이트 등 향정신성의약품 목록, 개정 2025.8.12.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110201&flSeq=161066299"}],"verified":"2026-09-24","uncertain":["교육부의 '학교 마약류 사안 발생 시 대응 절차' 매뉴얼(교원용) 원문은 찾지 못했다. 2025·2026 교사용 지도서는 예방교육 자료이며, 교직원 원격연수(2026.4.~, 배움누리터)에 '학교 현장의 예방과 대응 방안'이 있다고만 확인했다. 시·도교육청별 대응 지침은 소속 교육청에서 확인해야 한다.","사립학교 교원의 고발 '의무' 여부와 교육청별 신고 지침은 확인하지 못했다(형사소송법상 공무원은 고발 의무, 누구든지 고발 가능).","메틸페니데이트는 현행 시행령 별표 4의 향정신성의약품(제2조제3호나목)으로 확인했다. 식욕억제제는 성분·품목별 지정 여부가 달라 일반 분류로 묶지 않고 성분 확인을 안내한다. 모든 품목의 구체 조항·벌칙은 개별 성분에 따라 달라질 수 있다.","생활지도 고시 제12조제5항의 물품별 호 구분(담배·술=3호, 마약류 의심 물품=2호)은 해석이며 원문 확인 필요.","'미성년 투약사범 치료보호 의무화'는 기본계획 과제로만 확인했고 법 개정·시행 여부는 확인하지 못했다.","담배사업법 개정(법률 제21216호, 2026.4.24. 시행)으로 니코틴 원료 제품도 '담배'가 됐다(개정 규정은 시행 후 반출·수입신고분부터 적용, 부칙 제2조). 니코틴이 없는 액상 제품의 청소년 판매 금지·금연구역 과태료 해당 여부는 원문 확인 필요.","마약 거래 신고 전용번호(검찰 등)는 원문 확인을 못 해 적지 않았다.","마약류 의심 물품을 학교가 봉인·보관해 경찰에 넘기는 구체 절차(보관 방법·인계 주체)는 교육부·경찰 공식 원문을 찾지 못했다. 생활지도 고시 제12조는 분리·보관과 학교장 보고·보호자 통지까지만 정한다."],"related":["emergency-medical","student-guidance"]},{"id":"infectious-disease","title":"감염병 의심·확진 학생","aka":["수두","독감","인플루엔자","결핵","노로바이러스","장염 여러 명","눈병","유행성 각결막염","수족구","볼거리","홍역","등교중지","출석인정 결석","전염병","열나요 기침"],"category":"안전·보건","urgency":"당일","roles":["담임","보건(담당)교사","교과 교사","학년부장","교감·학교장","행정실","상담교사","보호자","보건소","교육(지원)청"],"summary":"감염병이 의심되는 학생은 혼자 이동시키지 않고 상황에 맞게 관찰·진료를 연결한다. 등교중지와 출결은 학교보건법 및 학교생활기록 지침을 따르고, 학교장은 감염병에 걸렸거나 의심되는 학생·교직원을 즉시 교육감을 거쳐 교육부장관에게 보고한다(나이스 등록). 결핵·홍역·A형간염 등 법정 8종은 보건소 신고 대상이다. 교육부 학교 감염병 매뉴얼의 운영 예시에서는 같은 학급에 의심 환자가 2명 이상이면 유행의심 단계로 대응하지만, 유행 판정과 실제 조치는 감염병·역학조사·소속 교육청의 현행 지침에 따라 확인한다.","first":["증상 학생을 혼자 보건실에 보내지 말고 담임(담당) 교사가 2m 정도 거리를 두고 함께 이동한다(필요하면 둘 다 마스크)","보건(담당)교사에게 알리고, 감염이 우려되면 일시적 관찰실에서 보호자 올 때까지 관찰한다","보호자에게 연락해 의료기관 진료를 요청하고 ‘등교 중지 안내문’과 복귀 시 낼 서류(진료확인서·의사소견서·진단서 중 1)를 안내한다","교실 창문을 열어 환기하고 책상·손잡이 등 자주 만지는 곳을 소독제로 닦는다","반에서 같은 증상 결석·조퇴가 더 있는지 확인해 보건(담당)교사에게 알린다"],"steps":[{"stage":"알게 됨·신고","when":"수업 중 증상 발견","who":"발견 교사","what":"감염병 의심 여부 확인","detail":"감염병을 의심할 증상인지, 이미 진료를 받았는지 묻는다. 발열 호소 시 체온을 재서 확인한다. 응급상황이면 응급처치가 먼저다.","basis":"학교 감염병 예방·위기대응 매뉴얼 제3차 개정판 제3장 Ⅱ-2-나-2)"},{"stage":"알게 됨·신고","when":"등교 전 가정에서 발견","who":"담임","what":"미등교 학생 확인","detail":"보호자에게 진료 여부를 확인하고 안 받았으면 진료를 받게 하며, 출결 서류와 학교 홈페이지 서식 이용법을 안내한다. 감염병 증상으로 결석한 사실을 알면 즉시 보건(담당)교사에게 연락한다. 이미 진료받았으면 의사 소견대로 등교중지.","basis":"매뉴얼 제3차 개정판 제3장 Ⅱ-2-다"},{"stage":"초기 대응","when":"즉시","who":"담임(담당) 교사","what":"동행 이동","detail":"(의심)환자가 교내에서 혼자 이동하는 것은 원칙적으로 금지. 담임(담당)교사가 약 2m 거리를 두고 동행하고, 교사가 임신부 등 고위험군이면 다른 교사로 바꾼다.","basis":"매뉴얼 제3차 개정판 제3장 Ⅱ-2-나-1)"},{"stage":"초기 대응","when":"보호자 도착 전","who":"보건(담당)교사 판단, 담임 실시","what":"일시적 관찰실 운영","detail":"결핵·수두·유행성 각결막염·유행성이하선염·인플루엔자·성홍열·수족구·위장관계 감염증 증상이면 관찰 대상. 1층, 문을 닫을 수 있고 환기되는 곳, 교사-학생 2m 이상, 실외 창문 개방. 보건실은 바람직하지 않고 부득이하면 다른 침대와 2m 또는 가림막. 낙인 우려로 ‘격리’ 대신 ‘관찰’이라는 말을 쓴다. 사용 후 즉시 환기·소독.","basis":"매뉴얼 제3차 개정판 표3-5, 표3-6"},{"stage":"초기 대응","when":"관찰 중","who":"담임","what":"보호자 연락·귀가·진료 요청","detail":"보호자에게 의료기관 진료를 요청하고 ‘등교 중지 안내문’(부록 서식1)을 준다. 학교 복귀 시 출결 처리를 위해 진료확인서·의사소견서·진단서 중 1개를 내도록 안내한다.","basis":"매뉴얼 제3차 개정판 제3장 Ⅲ-1-다-1)"},{"stage":"조사·확인","when":"진료 결과 확인","who":"담임(보호자 통화), 보건(담당)교사","what":"등교중지 여부·기간 결정","detail":"확진이면 격리 기간(원칙적으로 의사 소견) 동안 등교중지, 등교중지가 필요한 감염병 의심이면 확진 여부 확인 때까지 등교중지, 등교중지 불필요 감염병이나 비감염성이면 복귀. 서류에 기간이 없고 병명만 있으면 보건(담당)교사가 첫 증상일 기준으로 표3-2·3-3의 등교중지 기간을 적용한다. 학교장은 등교중지를 명할 때 사유와 기간을 구체적으로 밝혀야 한다.","basis":"학교보건법 제8조 제1항; 같은 법 시행령 제22조; 매뉴얼 제3차 개정판 제3장 Ⅱ-2-나-4)·Ⅲ-1"},{"stage":"조치·이행","when":"등교중지 결정 시","who":"담임","what":"등교중지 생활수칙·학습 안내","detail":"기간 동안 학교뿐 아니라 학원·다중이용시설 출입 금지, 손씻기·가정 내 개인 물품 사용·마스크 등 위생수칙을 안내한다. e-학습터·학습꾸러미 등으로 학습을 지원하고 이행을 매일 점검한다.","basis":"매뉴얼 제3차 개정판 제3장 Ⅲ-1-다-3)·Ⅲ-2"},{"stage":"조치·이행","when":"확진·의심 확인 즉시","who":"담임(유행 시)·보건(담당)교사","what":"나이스 감염병 환자 등록·교육청 보고","detail":"나이스 [보건-감염병환자관리-감염병환자등록]에 발생인지일·병명·확진 여부·등교중지 여부 등을 입력한다. 학교장은 감염병에 걸렸거나 의심되는 학생·교직원이 있으면 즉시 교육감을 거쳐 교육부장관에게 보고해야 하며, 보고 사항은 감염병명·발병일·진단일, 소속, 조치 사항이다(나이스로 가능).","basis":"학교보건법 제14조의3 제5항; 같은 법 시행규칙 제10조의3 제4항·제5항; 매뉴얼 제3차 개정판 제3장 Ⅲ-3"},{"stage":"조치·이행","when":"해당 감염병 발생 시","who":"학교장(보건(담당)교사 실무)","what":"보건소 신고(8종)","detail":"결핵·홍역·콜레라·장티푸스·파라티푸스·세균성이질·장출혈성대장균감염증·A형간염이 발생하면 학교의 관리인·대표자는 의사의 진단을 요구하거나 관할 보건소장에게 신고해야 한다. 매뉴얼은 교육(지원)청 보고절차에 따라 나이스 전자결재로 교육(지원)청과 보건소에 보고하고, 어려우면 팩스·전화를 쓰도록 안내한다.","basis":"감염병예방법 제12조 제1항 제2호; 같은 법 시행규칙 제8조 제1항; 매뉴얼 제3차 개정판 제3장 Ⅱ-3-나-1)"},{"stage":"조사·확인","when":"(의심)환자 확인 후(대응 2단계)","who":"보건(담당)교사·발생감시팀","what":"추가 환자 능동감시","detail":"같은 층 학급, 이동수업을 함께 들은 학생, 수인성·식품매개 감염병이면 같은 음식을 먹은 학생을 대상으로 매일 1회 이상 증상을 확인한다(전체 발열 검사는 권장하지 않음). 담임은 결석·조퇴·지각 사유와 증상을 확인해 통보한다.","basis":"매뉴얼 제3차 개정판 표3-7~3-9"},{"stage":"심의·결정","when":"같은 학급 (의심)환자 2명 이상","who":"보건(담당)교사·학교장","what":"유행의심(대응 3단계) 판단·보고","detail":"동일 학급에 (의심)환자가 2명 이상이면 대응 3단계다. 유행 여부는 보건소 역학조사 결과를 따르는 것이 바람직하나, 학교는 선제적으로 유행의심 상황이면 3단계 활동을 한다. ‘유행의심 상황’을 나이스로 교육(지원)청에 보고하고, 이때부터 환자 등록은 신속성을 위해 담임이 한다.","basis":"매뉴얼 제3차 개정판 표3-10, 제3장 Ⅱ-4-나-1), 3단계 체크포인트"},{"stage":"조치·이행","when":"대응 3단계","who":"학교 감염병 관리조직","what":"유행 확산 차단","detail":"능동감시를 전체 학급으로 확대(담임 매일 1교시 후 학년부장 → 보건교사), 밀접접촉자 관리·최대 잠복기 동안 감시, 고위험군(만성질환·면역저하·임신부)은 감염 의심·접촉 시 즉시 진료 의뢰, 원하면 보호자와 상의해 역격리(등교 중지), 예방교육·가정통신문, 전체 소독. 교장·교감은 보건소 신고, 단축수업·행사 제한 검토.","basis":"매뉴얼 제3차 개정판 제3장 Ⅱ-4, 표3-11~3-16"},{"stage":"조사·확인","when":"보건소 역학조사 시","who":"학교 전체","what":"역학조사 협조","detail":"교육지원청은 관할 보건소 역학조사를 요청·협조한다. 학교는 학생·교직원 현황 등 자료를 준비한다. 확진자의 이름·이동경로 등 개인정보는 공개하지 않고 발생 현황만 알린다.","basis":"매뉴얼 제3차 개정판 제2장 시나리오 3단계, 제4장 Ⅱ-4"},{"stage":"심의·결정","when":"유행 확산 시","who":"학교장","what":"휴업 여부 결정","detail":"인플루엔자·수두·유행성이하선염·수족구병·유행성각결막염 등 빈발 감염병은 전파 차단 목적 휴업을 권장하지 않는다. 유행 확산으로 학교장이 자체 휴업이 필요하다고 판단하면 관할 보건소와 협의를 거쳐 할 수 있다.","basis":"매뉴얼 제3차 개정판 3단계 체크포인트, 제5장 Ⅰ"},{"stage":"조치·이행","when":"등교중지 기간 종료","who":"담임·보건(담당)교사","what":"등교 재개와 출결 처리","detail":"원칙적으로 의사·보건소 의견에 따른다. 증상이 사라지고 등교중지 기간이 끝나면 등교하고, 담임은 등교 당일 보건(담당)교사에게 알린다. 감염성이 없어졌다는 의사 확인서가 있으면 더 일찍, 증상이 남으면 서류로 연장 가능. 등교중지 기간은 출석인정 결석으로 처리하고, 진료 결과 감염병이 아니었어도 결과 확인까지의 기간은 출석으로 인정한다.","basis":"매뉴얼 제3차 개정판 제3장 Ⅲ-1-나·다-4)·5)"},{"stage":"종결·사후","when":"모든 환자 완치 + 최대 잠복기 동안 추가 없음","who":"보건(담당)교사·학교장","what":"유행 종료 판단·선언","detail":"역학조사를 했다면 방역당국 판단을 따른다. 발생 현황과 조치 결과를 학교장과 교육(지원)청에 보고하고, 학교장은 유행 대응 활동을 끝내고 예방단계로 돌아가도록 지시한다. 가정통신문·홈페이지 등으로 유행 종료를 알린다.","basis":"매뉴얼 제3차 개정판 표3-17·3-18"},{"stage":"종결·사후","when":"종료 후","who":"교무부장·담임·상담교사","what":"수업 보충과 심리 지원","detail":"수업 결손 학생 보충수업, 필요하면 상담교사·Wee센터 연계 심리 지원.","basis":"매뉴얼 제3차 개정판 표3-18"}],"deadlines":[{"what":"감염병 학생·교직원 교육감 경유 교육부 보고","limit":"즉시","basis":"학교보건법 제14조의3 제5항"},{"what":"결핵·홍역 등 8종 보건소 신고(학교장)","limit":"지체 없이(서면·구두·전보·전화·컴퓨터통신)","basis":"감염병예방법 제12조 제1항; 같은 법 시행규칙 제8조·제9조"},{"what":"(참고) 의사·의료기관의 신고","limit":"1급 즉시, 2·3급 24시간 이내, 4급 7일 이내","basis":"감염병예방법 제11조 제3항"},{"what":"유행 종료","limit":"모든 (의심)환자 완치 후 해당 감염병 최대 잠복기까지 추가 환자 없을 때","basis":"매뉴얼 제3차 개정판 표3-17"}],"dont":["열나는 학생을 혼자 보건실로 보내지 않는다","확진 학생의 이름·이동경로 등 개인정보를 학급·학부모에게 알리지 않는다 — 발생 현황만 안내","빈발 감염병(독감·수두 등)이라고 바로 휴업을 요구하거나 결정하지 않는다 — 보건소 협의","등교중지 학생을 무단결석·질병결석으로 처리하지 않는다 — 출석인정","임신 중이거나 고위험군 교사에게 관찰실 담당·동행을 맡기지 않는다","역학조사 전 증상 학생에게 약부터 먹이지 않는다(보건실 방문환자 역학조사 전 약물투여 금지 — 매뉴얼 A형간염 3단계 시나리오)"],"contacts":[{"name":"관할 보건소","tel":"","note":"8종 신고, 역학조사 — 학교 연간계획에 번호 기재"},{"name":"교육(지원)청 학생건강 담당","tel":"","note":"유행의심 보고"}],"forms":["감염병 등교 중지 안내문(매뉴얼 부록 서식1)","가정 내 건강관리 기록지(서식2, 복귀 시 출결 증빙용)","복귀 서류: 진료확인서·의사소견서·진단서 중 1개(부득이하면 처방전)","나이스 [보건-감염병환자관리-감염병환자등록], 에듀파인 기안(보건소 전자결재 연동)"],"law":[{"name":"학교보건법","article":"제8조(등교 중지)","point":"건강검사·의사 진단 결과 감염됐거나 의심·우려되는 학생·교직원을 학교장이 등교중지시킬 수 있음. 주의 이상 위기경보 시 교육부장관이 명할 수 있음"},{"name":"학교보건법 시행령","article":"제22조","point":"학교장은 감염병환자·의사환자·병원체보유자(의사가 감염 우려 없다고 진단한 사람 제외) 등에게 등교중지를 명할 수 있고, 명할 때는 사유와 기간을 구체적으로 밝혀야 하며 필요하면 단축·연장 가능"},{"name":"학교보건법","article":"제14조의3 제5항","point":"감염병에 걸렸거나 의심되는 학생·교직원이 있으면 학교장이 즉시 교육감을 거쳐 교육부장관에게 보고"},{"name":"학교보건법 시행규칙","article":"제10조의3 제4항·제5항","point":"보고 사항: 감염병명·발병일·진단일, 소속, 조치 사항. 서면(교육정보시스템 가능)"},{"name":"감염병의 예방 및 관리에 관한 법률","article":"제12조 제1항 제2호","point":"학교 관리인·대표자는 보건복지부령으로 정하는 감염병 발생 시 의사 진단 요구 또는 보건소장 신고"},{"name":"감염병의 예방 및 관리에 관한 법률 시행규칙","article":"제8조 제1항","point":"신고 대상 8종: 결핵, 홍역, 콜레라, 장티푸스, 파라티푸스, 세균성이질, 장출혈성대장균감염증, A형간염"},{"name":"감염병의 예방 및 관리에 관한 법률","article":"제2조","point":"결핵·수두·홍역·유행성이하선염·A형간염·성홍열은 제2급, 인플루엔자·수족구병·장관감염증은 제4급"}],"faq":[{"q":"수두면 며칠 쉬어야 하나요?","a":"매뉴얼 표3-2는 수두의 등교중지 기간을 ‘모든 수포에 가피(딱지)가 형성될 때까지’로 둔다. 원칙은 의사 소견이며, 기간은 휴일을 포함해 센다."},{"q":"독감(인플루엔자)도 등교중지인가요?","a":"매뉴얼은 유행 차단을 위한 등교중지는 의미가 없지만 환자 상태에 따라 실시하고, 방역당국의 ‘인플루엔자 관리 지침’이 있으면 그 기간을 우선 적용한다고 한다. 해당 연도 질병관리청 지침을 확인한다."},{"q":"진료했는데 감염병이 아니었어요. 쉰 날은 결석인가요?","a":"등교중지가 필요한 감염병이 의심돼 확인할 때까지 쉰 기간은, 진료 결과 감염병이 아니었어도 출석으로 인정한다(매뉴얼 제3장 Ⅲ-1-나)."},{"q":"결핵 학생이 나오면 반 전체가 검사하나요?","a":"매뉴얼 부록 결핵 항목은 신고된 학생(또는 그 학급 수업 교직원)의 호흡기 검체가 양성이거나, 음성이라도 흉부 X선에 공동이 있으면 해당 학급·교직원 대상 결핵·잠복결핵감염 검사를 하는 역학조사를 하고, 한 학교에서 6개월 이내 활동성 결핵환자가 2명 이상이면 학교 전원(교직원 포함) 검사를 한다고 안내한다. 실제 범위는 보건소가 정한다."},{"q":"결핵 학생은 언제 다시 등교하나요?","a":"매뉴얼은 효과적인 약을 포함한 항결핵제를 14일 이상 복용하고, 호흡기 증상이 없어지고, 객담 도말검사가 음성일 때 전염성 소실로 보며, 의사 소견서 등 근거를 반드시 확인·보관한 뒤 복귀하게 한다."},{"q":"노로바이러스 장염은요?","a":"매뉴얼 표3-3은 등교중지 기간을 ‘증상 소실 후 48시간까지’로 둔다. 여러 명이 같은 음식을 먹고 설사·구토하면 식중독 의심 절차도 함께 본다."}],"deep":[{"title":"대응 단계 — 1명일 때와 2명일 때가 다르다","body":["예방단계: 평소 감시·교육·계획.","대응 1단계: 유증상자를 발견해 의료기관 진료로 (의심)환자인지 확인. 감염병이 아니면 예방단계로, 맞으면 2단계로.","대응 2단계: 의료기관이 확인한 (의심)환자가 있고, 추가 환자와 유행의심 여부를 확인하는 단계. 일부 학급(같은 층, 이동수업 동료, 같은 음식)에 능동감시.","대응 3단계: 같은 학급에 (의심)환자 2명 이상 → 유행의심 보고, 전체 학급 능동감시, 학교 감염병 관리조직 가동.","복구단계: 모든 환자 완치 + 최대 잠복기까지 추가 환자 없음 → 유행 종료 선언·보고."],"basis":"학교 감염병 예방·위기대응 매뉴얼 제3차 개정판 제3장 Ⅱ(표3-4·3-7·3-10·3-17)"},{"title":"등교중지와 출석 인정","body":["근거는 학교보건법 제8조와 시행령 제22조, 학교생활기록 작성 및 관리지침이다. 확진이면 격리 기간(의사 소견) 동안, 의심이면 확진 여부 확인 때까지 등교중지다.","복귀할 때 진료확인서·의사소견서·진단서 중 1개를 받는다. 부득이하면 처방전도 인정하는데, 질병코드를 KOICD 질병분류센터 누리집에서 확인한다.","등교중지 기간에도 학원·PC방·노래방 등 다중이용시설 출입을 삼가도록 안내하고, 학습 결손은 e-학습터·학습꾸러미로 메운다."],"basis":"매뉴얼 제3차 개정판 제3장 Ⅲ, 부록 서식1"},{"title":"신고와 보고는 두 갈래다","body":["교육 계통 보고: 학교장이 감염병에 걸렸거나 의심되는 학생·교직원을 즉시 교육감 경유 교육부장관에게 보고(학교보건법 제14조의3). 실무는 나이스 감염병 환자 등록.","보건 계통 신고: 결핵·홍역·콜레라·장티푸스·파라티푸스·세균성이질·장출혈성대장균감염증·A형간염 8종은 학교 관리인·대표자가 보건소에 신고하거나 의사 진단을 요구(감염병예방법 제12조). 나이스 전자결재가 보건소와 연동돼 있다.","의사·의료기관도 별도로 신고한다(2·3급 24시간, 4급 7일 이내). 학교 신고는 이와 별개다."],"basis":"학교보건법 제14조의3; 감염병예방법 제11조·제12조; 같은 법 시행규칙 제8조; 매뉴얼 제3장 Ⅲ-3"},{"title":"결핵이 나왔을 때","body":["결핵은 2주 이상 기침이 이어지면 의심하고 검진을 받게 한다. 약제감수성 결핵은 치료 후 2주 정도 지나면 전염성이 거의 없어진다.","전염성 결핵 학생은 ‘업무종사 및 등교 일시 제한’을 하고, 전염성 소실(항결핵제 14일 이상, 증상 소실, 도말 음성)이 확인되면 해제 통지 후 복귀한다. 의사 소견서 등 근거를 보관한다.","접촉자 검진 범위는 보건소 역학조사로 정해진다. 매뉴얼 예시: 검체 양성 또는 공동이 있으면 해당 학급·교직원, 6개월 이내 활동성 2명 이상이면 학교 전원."],"basis":"매뉴얼 제3차 개정판 부록 Ⅲ 결핵"}],"tables":[{"title":"학교 빈발 감염병 등교중지 기간(매뉴얼 표3-2·3-3)","head":["감염병","주요 증상","등교중지(격리) 기간","잠복기"],"rows":[["결핵","발열, 피로, 식은땀, 체중감소","약물 치료 시작 후 2주까지","수년까지(50% 2년 이내)"],["수두","발진, 수포, 발열","모든 수포에 가피 형성까지","10~21일(평균 14~16일)"],["수족구병","발열, 손발·입안 수포","수포 발생 후 6일간 또는 가피 형성까지","3~7일"],["유행성이하선염","이하선 부종, 발열","증상 발생 후 5일까지","12~25일"],["인플루엔자","발열, 두통, 근육통, 기침","유행차단 목적 의미 없으나 상태에 따라 실시(방역당국 지침 우선)","1~4일(평균 2일)"],["급성출혈성결막염·유행성각결막염","충혈, 눈곱, 눈물","격리 없이 개인위생 권장","8~48시간 / 5~7일"],["노로바이러스","구토, 설사, 복통","증상 소실 후 48시간까지","24~48시간"],["성홍열","구진, 발열, 인후염","항생제 치료 시작 후 24시간까지","1~3일"],["홍역","발진, 발열, 기침, 코플릭 반점","발진 4일 후까지","7~21일"],["풍진","구진성 발진, 림프절 종창","발진 7일 후까지","12~23일"],["백일해","발작적 기침","항생제 투여 후 5일까지","7~20일"]],"note":"교육부 학교 감염병 예방·위기대응 매뉴얼 제3차 개정판(2023.12.). 질병관리청 환자 격리 기간 기반, 휴일 포함. 방역당국 별도 지침이 있으면 그것을 우선."},{"title":"누가 무엇을(대응 3단계 예시)","head":["담당","할 일"],"rows":[["담임","결석·조퇴 사유 확인, 매일 1교시 후 학년부장 보고, 진료 의뢰·등교중지, 나이스 등록, 가정통신문, 학급 소독·환기, 출결 처리"],["보건(담당)교사","유행의심 교육(지원)청 보고, 일일 현황 집계, 보건실 이용자 감시, 고위험군 관리, 예방교육 자료"],["행정실","소독·방역물품, 전체 방역, 역학조사 서류"],["교장·교감","보건소 신고, 관리조직 가동, 단축수업·휴업·행사 제한 검토"],["교육(지원)청","관내 능동감시, 보건소 역학조사 요청·협조, 휴업 등 행정조치 검토"]],"note":"매뉴얼 제3차 개정판 제2장 모의훈련 시나리오(인플루엔자·A형간염 3단계). 조직·역할은 예시로 학교 상황에 따라 조정 가능."}],"record":"나이스 [보건-감염병환자관리-감염병환자등록]에 등록(보건소 전자결재 연동). 등교중지 기간은 출석인정 결석(학교생활기록 작성 및 관리지침). 유행 종료 시 교육(지원)청 보고.","sources":[{"title":"학교 감염병 예방·위기대응 매뉴얼 제3차 개정판(초·중·고·특수학교용)","publisher":"교육부·한국교육환경보호원","year":2023,"url":"https://djcidc.or.kr/bbsDown/040201_new/2025032037952603893.pdf"},{"title":"2026-2027절기 인플루엔자 유행주의보 발령 및 예방수칙 안내","publisher":"질병관리청","year":2026,"url":"https://www.kdca.go.kr/kdca/2848/subview.do?enc=Zm5jdDF8QEB8JTJGYmJzJTJGa2RjYSUyRjQyJTJGMzEyNTkzJTJGYXJ0Y2xWaWV3LmRvJTNGcGFzc3dvcmQlM0QlMjZyZ3NCZ25kZVN0ciUzRCUyNmZpbmRPcG53cmQlM0QlMjZyZ3NFbmRkZVN0ciUzRCUyNmZpbmRUeXBlJTNEJTI2cGFnZSUzRDElMjY%3D"},{"title":"2026 법정감염병 진단·신고 기준","publisher":"질병관리청","year":2026,"url":"https://kdca.go.kr/bbs/kdca/55/307100/download.do"},{"title":"학교보건법·시행령·시행규칙","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교보건법"},{"title":"감염병의 예방 및 관리에 관한 법률·시행규칙","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/감염병의예방및관리에관한법률"},{"title":"학교생활기록 작성 및 관리지침 [시행 2026. 3. 1.] 교육부훈령 제555호","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/admRulLsInfoP.do?admRulSeq=2100000274694"},{"title":"경기도 학교 감염병 예방관리 실무 가이드북(교육부 매뉴얼 제3차 개정판 기반, 참고)","publisher":"경기도교육청 체육건강과","year":2024,"url":"https://www.goe.go.kr/resource/goe/na/bbs_2675/2025/09/33fc09db-47c7-4b13-a254-f0ebf8c4c1d7.pdf"}],"verified":"2026-09-24","uncertain":["질병관리청의 2026.9.11. 2026-2027절기 유행주의보 안내는 예방수칙·접종·진료 권고를 담지만 학생의 등교중지·복귀 기준을 정하지 않는다. 소속 교육청의 최신 학교 안내와 의료인 의견을 확인한다.","학교생활기록 작성 및 관리지침은 교육부훈령 제555호(2026.3.1. 시행)가 현행이다. 감염병 등교중지 학생의 출결 세부 처리는 현행 지침 별표 8과 2026학년도 학교생활기록부 기재요령 및 소속 학교 학업성적관리규정으로 확인한다. 2023 매뉴얼 부록의 훈령 제393호 인용은 구판이므로 근거로 쓰지 않는다.","시·도교육청별 자체 감염병 매뉴얼·보고 양식은 소속 교육청에서 확인한다","2023 매뉴얼 표3-1의 법정감염병 분류표는 2023.9.29. 기준이다. 2026 법정감염병 진단·신고 기준과 2026.6.24. 시행 현행법을 우선 대조했으며, 환자 등급별 학교·의료기관 신고 절차 및 학교에서 적용할 등교·복귀 판단은 질병별 최신 국가 지침과 소속 교육청 기준으로 확인한다.","결핵 접촉자 검진 기준은 매뉴얼 부록 요약이며, 현행 국가결핵관리지침 원문은 확인 못 함","«반 전체 손들기·방송으로 증상자를 찾지 않는다»는 표현은 학교 감염병 매뉴얼 제3차 개정판에서 확인되지 않아 본문에서 뺐다(매뉴얼은 설문·발열 측정 등으로 매일 1회 이상 능동감시, 전체 학생 발열 검사는 권장하지 않고 스스로 열이 있다고 한 학생 선별 검사 권고)"],"related":["food-poisoning"]},{"id":"food-poisoning","title":"식중독 의심(설사·구토 학생 여럿)","aka":["식중독","급식 먹고 배탈","설사 여러 명","구토 여러 명","집단 장염","노로바이러스","보존식","급식 중단","역학조사","배 아픈 학생 많아요","급식 사고","물 먹고 설사","수학여행 식중독"],"category":"안전·보건","urgency":"즉시","roles":["담임","보건(담당)교사","영양(교)사","교감·학교장","행정실","교육(지원)청","시·군·구(보건소·위생부서)"],"summary":"집단급식소 설치·운영자가 급식으로 인한 식중독 환자 또는 의심 증세가 있는 사람을 발견하면 식품위생법 제86조에 따라 관할 시·군·구에 지체 없이 보고해야 한다. 법정 보고는 1명도 가능하며 ‘2명 이상’을 기다릴 수 없다. 제6차 학교급식 위생관리 지침서는 동일 원인으로 추정되는 유사 증세가 2명 이상 동시에 발생한 경우 교육청과 시·군·구(보건소)에 즉시 보고하도록 한 학교 대응 기준도 제시한다. 보존식·현장을 임의로 폐기·소독하지 말고 역학조사에 협조한다.","first":["증상 학생을 보건실로 보내 상태를 보고, 병원 치료가 필요하면 이송(환자이송반)","보건(담당)교사·학교장에게 즉시 보고 — 1명이라도 식중독 의심이면 인원 기준을 기다리지 않고 보고","보존식을 절대 버리거나 옮기지 말고, 정수기·조리도구도 소독·청소하지 않는다(영양교사에게 알림)","반 전체 손들기나 (주말) 단체문자로 환자를 찾지 않는다 — 담임이 개별로 파악","역학조사반 도착 전까지 증상 학생 귀가를 잠시 보류할지 보건소와 협의(응급 학생은 즉시 이송)"],"steps":[{"stage":"알게 됨·신고","when":"평소·발생 당일","who":"담임·보건(담당)교사","what":"집단 환자 감시로 이상 징후 포착","detail":"담임교사는 매일 결석·조퇴·지각 학생 수와 사유를 살펴 평소와 다른 양상을 모니터링하고, 보건(담당)교사는 담임 결과와 보건실 이용자 수·주요 증상을 함께 비교한다. 제6차 지침서는 통상 원인 식품 섭취 후 30분~40시간 안에 위장 증상이 다수에게 나타날 수 있다고 설명한다.","basis":"학교급식 위생관리 지침서 제6차 개정본(2026) 식중독 감시체계"},{"stage":"알게 됨·신고","when":"의심 즉시","who":"담임·보건(담당)교사","what":"학교장에게 먼저 보고","detail":"보건실 방문 학생을 관찰하고 평일 수준과 비교해 이상하면 학교장 등에게 먼저 상황을 보고한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 표2 1단계"},{"stage":"조사·확인","when":"보고 직후","who":"담임","what":"1차 예비조사(유증상자 파악)","detail":"병결 학생과 원인·유증상자를 파악하되 손들기나 주말 단체문자 등 부적절한 방법으로 조사하지 않는다. 최초 발병 일시와 급식 여부를 기록하고 실제 환자가 아닌 학생이 환자로 집계되지 않도록 주의한다. 2차 확인조사는 관계기관 협의에 따라 진행한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 표2 1단계"},{"stage":"심의·결정","when":"즉시","who":"학교장 주재","what":"긴급 대책회의 — 확산 여부와 대응 범위 판단","detail":"학교장 주재 대책회의를 열어 관계기관과 초동 대응을 협의한다. 제6차 지침서는 동일 원인으로 추정되는 설사 등 유사 증세 환자가 2명 이상 동시에 발생하면 교육청과 시·군·구(보건소)에 즉시 보고하도록 한다. 이는 학교 대응의 집단 발생 감시 기준이며, 식품위생법 제86조상 집단급식소 운영자의 법정 보고는 1명의 환자·의심자를 발견한 경우에도 지체 없이 해야 한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 감시체계·표2; 식품위생법 제86조"},{"stage":"알게 됨·신고","when":"인지 즉시","who":"학교장","what":"교육청·시·군·구(보건소) 신고","detail":"집단급식소 설치·운영자는 급식으로 인한 식중독 환자 또는 의심 증세가 있는 사람을 발견하면 식품위생법 제86조에 따라 관할 시장·군수·구청장에게 지체 없이 보고한다. 법정 보고 요건에 2명 이상이라는 최소 인원은 없다. 지방자치단체의 후속 통보·원인조사와 교육청 추가 보고는 현행 절차 및 지역 지침을 따른다.","basis":"학교급식 위생관리 지침서 제6차 개정본 표2 2단계; 식품위생법 제86조 제1항 제2호, 제101조 제1항 제2호"},{"stage":"초기 대응","when":"신고 후","who":"학교장","what":"식중독 대책반 가동","detail":"총괄대책반, 환자파악반, 환자이송반, 역학조사협력반, 학사대책반, 행·재정지원반을 가동해 지휘·환자 현황 파악·이송·역학조사 협조·학사운영·행정 및 예산 지원을 맡긴다.","basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 대책반 구성"},{"stage":"초기 대응","when":"즉시","who":"영양(교)사·행정실","what":"현장 보존","detail":"보존식을 훼손·폐기하지 않고 먹는 물을 소독하지 않는다. 보건소 가검물 수거 뒤에 폐기·소독한다. 보존식을 넘길 때는 수거증을 받는다. 교육청은 보존식을 임의 폐기하거나 바꿔 역학조사에 지장을 준 담당자·관리자를 문책한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 발생 대응·원인제공자 조치; 식품위생법 제88조 제2항 제10호; 수거증: 학교 감염병 예방·위기대응 매뉴얼 제3차 개정판 A형간염 모의훈련 시나리오(영양(교)사 «보존식 인계 시 수거증을 받고 인계»)"},{"stage":"심의·결정","when":"당일","who":"학교장","what":"급식 잠정 중단 여부 결정","detail":"급식 중단 여부(원인 파악·확산 방지)는 방역당국과 협의해 학교장이 결정한다. 도시락 지참 등 대체급식, 저소득층 자녀 급식 지원을 마련하고 가정통신문으로 경과·학사일정·대체급식을 안내한다. 정수기 사용 중단도 검토한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 표2 3단계; 정수기 사용 중단 검토는 학교 감염병 예방·위기대응 매뉴얼 제3차 개정판 수인성 감염병 시나리오"},{"stage":"조사·확인","when":"발생 당일~","who":"원인·역학조사반(보건소·시군구 위생·감염부서) / 학교 협조","what":"원인·역학조사 협조","detail":"관계기관의 원인·역학조사에 협조하고 보존식·조리도구·음용수 등 환경검체 수거를 준비한다. 식단표와 식재료 납품업체 자료를 제공하고, 환자·대조군 설문과 사례 적용 타당성을 협의한다. 환자 규모·증상 등 필요한 사항을 협의체와 조정한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 표2 4단계"},{"stage":"조치·이행","when":"매일","who":"담임·보건(담당)교사","what":"추가 환자 파악과 보고","detail":"잠복기가 긴 질환도 있으므로 매일 신환자를 추가 기록한다. 가정통신문으로 발생 사실을 알리고 가정에서 증상이 나면 보건소나 협력 의료기관 진료를 받게 한다. 손 씻기·물 끓여 먹기 교육을 강화한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 발생 대응"},{"stage":"조치·이행","when":"사고 후 지체 없이","who":"학교장(행정실)","what":"학교안전공제회 사고통지","detail":"학교급식 등 학교장 관리·감독 업무가 직접 원인인 중독은 학교안전사고(시행령 제3조 제1호)이므로 공제회에 통지하고 보호자에게 치료비 청구를 안내한다.","basis":"학교안전법 제2조 제6호, 제44조 제2항; 같은 법 시행령 제3조"},{"stage":"조치·이행","when":"조사 후","who":"학교","what":"급식실 대청소·소독","detail":"가검물 수거가 끝난 뒤 급식시설·기구를 대청소하고 살균·소독한다. 유증상 학생은 보건실 방문 학생 위주로 계속 관찰한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 표2 5·6단계"},{"stage":"심의·결정","when":"원인 제거 후","who":"학교장(보건당국 협의)","what":"급식 재개","detail":"단순 식중독은 원인이 제거돼 재발 요인이 없으면 청소·소독, 조리기기 점검, 조리종사자 교육 후 재개. 세균성이질 등 수인성·식품매개 감염병이면 유행이 없고 조리종사자 보균검사가 안전할 때 마지막 확진환자 발생 1주일 이후 재개할 수 있다.","basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 발생 후 조치사항"},{"stage":"종결·사후","when":"역학조사 결과 후","who":"학교장·교육청","what":"원인제공자 조치와 재발 방지","detail":"업체가 공급한 식재료로 발생했으면 계약서에 명시한 대로 계약 해지와 민·형사 책임을 묻는다. 교육청은 보건당국의 역학조사 결과를 통보받아 교육청 홈페이지에 게재할 수 있다. 평소 식중독 모의훈련(권장)으로 대책반 대응체계를 점검한다.","basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 대책반 구성·발생 후 조치사항"}],"deadlines":[{"what":"교육청·시군구(보건소) 신고","limit":"급식 관련 식중독 환자 또는 의심자를 발견하면 지체 없이 관할 시·군·구 보고(법 제86조); 교육청 보고 방식은 시·도 지침 확인","basis":"학교급식 위생관리 지침서 제6차 개정본(2026) 식중독 감시체계·표2; 식품위생법 제86조(지체 없이)"},{"what":"보존식 보관","limit":"매회 1인분, -18℃ 이하 144시간 이상","basis":"식품위생법 제88조 제2항 제2호; 같은 법 시행규칙 제95조 제1항"},{"what":"수인성 감염병 확인 시 급식 재개","limit":"마지막 확진환자 발생 1주일 이후(요건 충족 시)","basis":"학교급식 위생관리 지침서 제6차 개정본 식중독 발생 후 조치사항(최종 재개 시점은 보건당국 역학조사 결과 등에 따라 조정될 수 있음)"},{"what":"학교안전공제 사고통지","limit":"지체 없이","basis":"학교안전법 제44조 제2항"}],"dont":["반별 손들기나 (주말) 단체문자로 환자를 세지 않는다 — 가짜 환자가 집계된다","보존식을 버리거나 다른 것으로 바꾸지 않는다 — 문책 대상","역학조사 가검물 수거 전에 먹는 물(정수기)·조리도구를 소독하지 않는다","언론·학부모 문의에 교사가 추정 원인을 말하지 않는다 — 방역당국 문의로 안내","‘두 명이 될 때까지’ 신고를 미루지 않는다 — 식품위생법 제86조는 2명 기준을 두지 않는다"],"contacts":[{"name":"관할 보건소·시군구 위생부서","tel":"","note":"평소 모의훈련 때 담당자·연락처 변경 여부 확인"},{"name":"교육(지원)청 급식 담당","tel":"","note":"유선 즉시 보고"}],"forms":["학교급식 식중독 의심환자 발생 보고(교육청 양식)","유증상자 명단(최초 발병일시, 급식 여부, 증상, 형제자매)","보존식 기록지(날짜·시간·채취자, 냉동고 온도), 보존식 수거증","역학조사 준비자료: 식단표, 급식 인원, 납품업체, 조리종사자 현황, 학교 도면, 음용수 현황","가정통신문(발생 사실, 진료 안내, 대체급식)"],"law":[{"name":"식품위생법","article":"제86조 제1항","point":"집단급식소에서 제공한 식품으로 식중독 환자·의심자를 발견한 집단급식소 설치·운영자는 지체 없이 시장·군수·구청장에게 보고"},{"name":"식품
