"학교폭력을 본 사람·알게 된 사람은 학교 등 관계 기관에 즉시 신고하고, 신고받은 기관은 관련 학생 보호자와 소속 학교장에게 통보한다. 예비·음모를 알게 된 교원은 학교장에게 보고하고 해당 학부모에게 알려야 한다. 신고자 불이익 금지"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제14조(전담기구)","point":"교감·전문상담교사·보건교사·책임교사·학부모(3분의 1 이상), 인지 시 사실 확인과 자체해결 부의 여부 심의, 실태조사·예방프로그램, 피해 측은 실태조사 요구 가능"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제15조(예방교육)","point":"학생 대상 학기별 1회 이상, 교직원·학부모 대상 학기별 1회 이상"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제11조의2(조사·상담)","point":"교육감·교육장이 학교폭력 조사·상담자(전담조사관) 위촉, 현장조사·문서열람·출석·진술·자료제출 요청, 결과는 학교장·보호자에게 통보"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제13조의2(자체해결)","point":"경미 사안 4요건 모두 충족 + 피해 측이 심의위원회를 원하지 않을 때, 피해 측 서면 확인과 전담기구 서면 확인·심의 필요, 관계회복 프로그램 권유"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제12조·제13조(심의위원회)","point":"교육지원청 설치, 10명 이상 50명 이내(학부모 3분의 1 이상), 소집 사유, 회의록 작성·보존, 관련자 통지, 피해 측 요청 시 의사·심리학자 등 전문가 의견 청취 의무(제13조제5항). 장애학생 관련 전문가 의견은 제16조의2제2항"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제16조(피해학생의 보호)","point":"보호조치 제1~4호·제6호, 인지 시 가해자(교사 포함) 분리, 교육장 7일 이내 조치, 결석 출석 인정 가능, 성적 평가 때 불이익이 없도록 노력, 비용은 가해학생 보호자 부담(공제회 선지급·구상 가능)"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제17조(가해학생에 대한 조치)","point":"제1호 서면사과~제9호 퇴학(의무교육 과정 퇴학 불가), 보복 시 가중, 부가 특별교육, 긴급조치·추인, 의견진술 기회, 교육장 14일 이내, 보호자 특별교육, 재전학 금지, 거부 시 추가 조치"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제17조의2~제17조의5(불복)","point":"행정심판·행정소송, 집행정지 전 피해 측 의견 청취, 인용 시 분리 요청권, 가해 측 소송 1심 90일·2·3심 각 60일 안 선고"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제18조(분쟁조정)","point":"심의위원회(또는 교육감) 조정, 1개월 이내"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제19조(학교의 장의 의무)","point":"조치 이행 협조, 축소·은폐 금지, 발생·자체해결·조치 결과를 교육감에게 보고"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제21조·제22조·제23조","point":"비밀누설 금지(1년 이하 징역 또는 1천만원 이하 벌금), 회의 비공개·회의록 열람 복사, 보호자 특별교육 불응 과태료 300만원 이하"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제11조의4(업무 담당자 지원 및 면책)","point":"책임교사 수업 조정 등 지원, 법률지원단 상담·법률서비스, 법령·학칙을 지킨 정당한 사건처리·생활지도는 민·형사 책임 없음"},{"name":"학교폭력예방 및 대책에 관한 법률 시행령","article":"제14조·제16조·제17조·제17조의2·제19조·제20조·제21조·제22조·제26조·제33조","point":"심의위원 자격·의결 정족수, 전담기구 학부모 위촉, 예방교육 기준, 분리 예외, 조치 기준, 전학 배정, 우선 출석정지 사유, 미이행 조사, 제척·기피, 비밀의 범위"},{"name":"학교폭력 가해학생 조치별 적용 세부기준 고시","article":"제2조·제3조, 별표","point":"판정 점수에 따른 조치 기준, 장애학생 관련 특수교육 전문가 의견·장애인식개선 교육"},{"name":"초·중등교육법 시행규칙","article":"제21조·제22조","point":"가해학생 조치 학생부 기재(제1~3호 조건부 기재유보), 졸업 후 삭제 시기"},{"name":"행정심판법","article":"제23조·제27조·제28조·제30조·제45조","point":"청구서 제출처, 안 날 90일·있은 날 180일, 서면 청구, 집행정지, 재결 60일(30일 연장)"},{"name":"행정소송법","article":"제18조·제20조·제23조","point":"행정심판 없이 바로 소송 가능, 안 날 90일·있은 날 1년, 법원 집행정지"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제34조제2항","point":"학교의 장과 종사자는 직무상 아동·청소년대상 성범죄를 알게 되면 즉시 수사기관 신고"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제15조의2(학교폭력예방의 날 지정·운영)","point":"매년 5월 네 번째 월요일을 학교폭력예방의 날로 하고 그날부터 1주간을 예방주간으로 한다. 국가·지방자치단체는 취지에 맞는 행사·교육·홍보 실시에 노력한다(2026.6.2. 신설, 부칙에 따라 2027.1.1. 시행 예정)."},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제16조의2제2항(장애학생의 보호)","point":"피해학생 또는 가해학생이 장애학생이면 심의위는 특수교육 전문가 또는 장애인 전문가의 의견을 들을 수 있다. 장애학생 본인 또는 보호자가 요청하면 반드시 전문가를 출석시키거나 서면 등으로 의견을 청취한다(2026.6.2. 시행 개정)."},{"name":"민법","article":"제750조(불법행위의 내용)","point":"고의 또는 과실에 의한 위법행위로 손해가 발생한 경우의 일반 배상책임 근거. 학교폭력 사안에서 교사 개인의 책임 유무를 이 조문만으로 단정할 수 없다"},{"name":"국가배상법","article":"제2조(배상책임)","point":"공무원이 직무 집행 중 고의·과실로 법령을 위반해 손해를 입힌 경우 국가·지방자치단체의 배상책임을 정한다. 공무원 개인에 대한 책임·구상 여부는 법령과 구체적 사실관계를 따로 판단한다"}],"faq":[{"q":"피해 학생이나 부모가 '일 크게 만들지 말아 달라'고 하면 신고·접수를 안 해도 되나요?","a":"안 됩니다. 학교폭력을 알게 된 사람은 학교 등 관계 기관에 즉시 신고해야 하고, 학교가 접수하면 사실 여부를 확인하고 보호자에게 접수 사실 등을 통보하는 절차를 진행합니다(제20조제1항·제2항, 제14조제4항). 제20조제4항의 교원 보고·학부모 통지 의무는 예비·음모를 알게 된 경우에 관한 조항입니다. 학교장 자체해결은 법정 4요건을 모두 충족하고 피해학생 및 보호자가 심의위원회를 원하지 않을 때만 가능합니다."},{"q":"학교폭력인지 애매한 친구 사이 다툼도 다 접수해야 하나요?","a":"신고된 것은 사소해도 접수합니다(접수대장은 은폐 여부 판단 자료). 조사 결과 학교폭력이 아니면 전담기구 회의로 확인하고 '학교폭력 아닌 사안의 종결 보고서'(양식 3-6)로 교육지원청에 보고합니다. 신고 전 단계의 학교폭력에 이르지 않은 갈등은 생활지도(조정·관계 개선) 대상입니다."},{"q":"분리할 때 가해 관련 학생을 다른 반에 보내도 되나요?","a":"안 됩니다. 분리는 학급교체가 아니므로 학교 안 별도 공간을 쓰고 학습 자료나 원격수업을 제공합니다. 별도 공간이 없어 가정이나 위(Wee)센터 등에서 분리하면 출석인정 결석으로 처리할 수 있습니다. 반·학년이 달라도 분리 의사를 확인하고 쉬는 시간·점심·이동 동선을 분리합니다."},{"q":"피해 학생이 여러 번 연달아 신고해요. 매번 분리하나요?","a":"같은 피해학생이 같은 가해학생을 분리 이전 사안으로 연속 신고하면 최초 1회만 분리합니다. 분리 이후 새로운 사안이 생겨 신고하면 다시 분리할 수 있습니다. 한 학생이 학급·학년 다수를 신고하면 상황을 고려해 피해학생을 분리해 보호할 수 있습니다."},{"q":"가해 관련 학생이 체험학습 중이거나 다른 학교 학생이면요?","a":"관련 학생 학교가 다르면 분리하지 않아도 됩니다(위탁교육시설에서 함께 교육받으면 분리). 학교장 허가 교외체험학습 중이면 이미 실질적으로 분리된 것으로 보고, 분리 결정 일수보다 체험학습 일수가 적으면 남은 일수만큼 분리합니다."},{"q":"학교장 자체해결 4요건이 뭔가요? 진단서는 어떻게 보나요?","a":"①2주 이상 신체·정신 치료 진단서 없음 ②재산 피해 없음·즉시 복구·복구 약속(치료비 포함) ③지속적이지 않음 ④신고·진술·자료제공에 대한 보복(정보통신망 포함) 아님. 전담기구 심의일 전에 진단서를 내지 않으면 ①을 충족한 것으로 보지만, 한 번 낸 진단서를 회수해도 충족하지 않은 것으로 보니 미리 안내합니다. 재산 피해 복구 약속은 가해 측 보호자가 복구를 확인해 주고 피해 측 보호자가 인정한 경우입니다."},{"q":"자체해결 동의서는 언제, 어떻게 받나요?","a":"피해학생과 보호자가 전담기구(또는 면담 과정에서 조사관을 통해)에 제출할 수 있습니다. 받기 전에 ①동의서를 내도 전담기구 심의에서 요건에 맞지 않으면 자체해결이 안 되고 ②자체해결 뒤에는 복구 약속 불이행이나 새 사실 확인 때만 심의위원회를 요청할 수 있다는 점을 반드시 충분히 설명합니다. 강요는 금지입니다."},{"q":"피해 측이 심의위원회를 요청했다가 취소하고 싶다고 해요.","a":"4요건을 모두 충족했는데 부동의로 요청된 경우라면, 심의위원회 의결 전까지 피해 측이 학교에 서면으로 취소 의사를 밝히면 학교장이 요청을 취소할 수 있고 자체해결로 봅니다(별도 자체해결 심의·보고 생략). 학교는 '심의위원회 개최 요구 취소 요청서'(양식 3-5)를 붙여 교육지원청에 보고합니다."},{"q":"조사관이 오면 담임은 무엇을 하나요? 같이 앉아 있어야 하나요?","a":"담임을 포함한 교원은 조사에 적극 협조해야 하고, 조사관이 요청하면 면담·자료 제출에 응합니다. 동석 여부는 학생의 심리 상태·나이·성별·사안 성격과 조사관 요청을 보고 학교장이 정합니다. 학생 확인서 원본은 학교가 보관하고 사본만 줍니다."},{"q":"확인서를 학생에게 어떻게 받나요?","a":"관련 학생을 따로따로, 가능하면 수업시간 외에 받습니다. 피해·가해·목격 사실을 육하원칙으로 자세히 쓰게 하고, 무엇을 써야 할지 모르면 세심하게 도와줄 수 있습니다. 진술이 엇갈려도 추궁하거나 대답을 강요하지 말고 객관적 증거를 확인합니다. 이주배경 학생은 번역된 조사지를 쓰거나 모국어 작성을 허용할 수 있고, 모국어로 쓴 것은 번역해 활용합니다."},{"q":"사이버폭력 증거는 어떻게 남기나요?","a":"욕설·협박 문자에는 어떤 응답도 하지 않게 하고, 게시판·안티카페·단톡방의 공개 비방은 그 자체로 저장(캡처)해 두도록 안내합니다. 증거는 이메일·채팅·게시판·SNS 캡처·문자·사진·동영상·음성 파일로 모읍니다. 증거 확보 후 피해 측은 서비스 제공자에게 삭제·임시조치를 요청할 수 있습니다(정보통신망법 제44조의2). 성적인 사진·영상은 교사가 받아 보관하지 말고 수사기관·디지털성범죄피해자지원센터로 연계합니다."},{"q":"심의위원회에 담임이 불려 가나요? 회의록은 볼 수 있나요?","a":"심의위원회는 필요하면 관련 교원을 출석시키거나 서면·(영상)통화·사전면담으로 의견을 들을 수 있고 학교는 협조해야 합니다. 회의는 비공개지만 피해·가해학생이나 보호자가 회의록 열람·복사를 신청하면 개인정보를 빼고 공개해야 합니다(제21조제3항)."},{"q":"조치 결정이 오면 생기부는 언제 입력하나요?","a":"조치결정 통보 공문을 받는 즉시 '학교폭력 조치상황 관리'란에 입력합니다. 제1~3호는 조건부 기재유보라 입력하지 않고 관리대장에 적되, 이행 기간 안에 이행하지 않거나 같은 학교급에서 다른 사안으로 조치를 받으면 기재합니다. 행정심판·소송이 들어와도 먼저 입력하고 결과에 따라 수정합니다."},{"q":"출석정지 기간 출결은 어떻게 하나요?","a":"심의위원회 결정 제6호 출석정지는 미인정결석입니다. 학교장 긴급조치 출석정지도 미인정결석이지만, 심의위원회가 추인하지 않거나 학교장이 자체해결하면 출석으로 인정할 수 있습니다. 제3~5호 관련 결석은 학교장이 인정하면 출석으로 셉니다. 출석정지 기간에는 위클래스 상담·자율학습 등 교육적 조치를 합니다."},{"q":"보호자가 특별교육을 안 받아요.","a":"학교장은 3개월 안에 이수하도록 안내하고, 3개월이 지나면 다음 날 명단을 교육감에게 통보합니다. 교육감이 1개월 안 이수를 서면 안내하고, 그래도 불응하면 과태료 300만원을 부과 예고합니다. 예고 후 14일 안에 이수증이나 타당한 의견을 내면 부과하지 않거나 다시 판단합니다. 과태료를 내도 이수 의무는 남습니다."},{"q":"가해학생 조치는 생활기록부에 언제까지 남나요?","a":"2024.3.1. 이후 신고 사안은 제1~3호 졸업과 동시, 제4·5호 졸업일부터 2년 후, 제6·7호 졸업일부터 4년 후, 제8호 졸업일부터 4년 후 삭제, 제9호는 삭제하지 않습니다. 제4~7호는 졸업 직전 전담기구 심의로 졸업과 동시에 삭제할 수 있습니다(다른 사안 조치 없음 + 조치결정일부터 졸업학년도 2월 말까지 6개월 경과)."},{"q":"조치에 불복하려면 어디에, 언제까지 해야 하나요?","a":"행정심판은 처분이 있음을 안 날부터 90일(처분이 있은 날부터 180일) 안에 해당 시·도교육청 행정심판위원회에, 행정소송은 안 날부터 90일(처분이 있은 날부터 1년) 안에 교육장을 피고로 법원에 제기합니다. 행정심판 없이 바로 소송해도 됩니다. 가이드북은 '처분이 있음을 알게 된 날'을 교육장의 조치가 있음을 현실적으로 안 날로 보고, 조치결정 통보서가 송달되기 전에는 다른 경로로 미리 알았어도 청구기간이 진행되지 않으며, 합리적 이유 없이 통보서 수령을 거절하거나 받았다가 반환하면 그때부터 진행된다고 안내합니다. 학교는 청구를 받는 곳이 아닙니다."},{"q":"가해 측이 집행정지를 받았어요. 피해학생은 어떻게 보호하나요?","a":"피해학생과 보호자는 학교장에게 분리를 요청할 수 있고(양식 4-5, 조치결정 통보서 첨부), 학교장은 전담기구 심의를 거쳐 집행정지 기간 동안 분리해야 합니다. 이 분리는 가해학생 학습권을 고려해 별도 공간이 아니라 자리 배치 변경·동선 분리·생활지도 계획 등으로 합니다."},{"q":"학부모가 이미 경찰에 고소했으면 학교 절차는 멈추나요?","a":"아닙니다. 경찰 신고(형사)와 학교폭력 절차(교육·선도)는 별개입니다. 사실 확인이 어려운 수사 중 사건은 심의위원회가 기한 안에 열어 조치결정을 유보할 수 있습니다. 피해 측이 고소·민사소송을 내면 분쟁조정은 거부·중지될 수 있습니다."},{"q":"교사가 가해자로 지목되면 어떻게 되나요?","a":"학교폭력예방법은 분리 대상 가해자에 교사를 포함하므로 학교장은 인지 즉시 분리합니다. 가해자가 학생이 아닌 사안은 학교장 자체해결 대상이 아니며, 피해학생 보호를 위해 심의위원회 개최를 요청합니다(피해 측이 보호조치를 원하지 않으면 미개최 동의서 양식 3-7). 청소년성보호법상 아동·청소년대상 성범죄 신고 요건에 해당하면 수사기관에 즉시 신고해야 합니다. 그 밖의 범죄 의심과 피해 보호 절차는 사안별 법령·교육청 지침을 따릅니다. 한편 법령·학칙에 따른 정당한 사건처리·생활지도를 한 교원은 민·형사 책임을 지지 않고, 소송·고소를 당하면 교육청 법률지원단의 상담 등 지원을 받을 수 있습니다."},{"q":"사안처리 중 교사가 민사 책임을 지게 되나요?","a":"가이드북(참고1)은 교사가 학생의 가해행위에 항상 책임지는 것이 아니라, 교육활동과 밀접한 생활관계에서 일어났고 교사가 폭력 발생을 알았거나 알 수 있었던(예견가능성) 경우에 한해 책임지며, 그래도 상황에 맞는 예방조치 등 방지 노력을 충분히 했다면 책임지지 않는다고 설명합니다. 국·공립은 교사에게 경과실만 있으면 교사 개인이 아니라 지방자치단체가 배상하고, 고의·중과실이면 교사도 함께 책임집니다. 사립은 학교법인이 배상책임을 지고, 교사에게 고의 또는 과실이 있으면 교사도 함께 책임집니다. 구체적 판단은 법원이 하므로 인지·보고·분리·보호 조치 기록을 남기고 교육청 법률지원단에 문의합니다."},{"q":"기숙사에서 일어나면 무엇이 다른가요?","a":"학교폭력법상 분리 원칙은 기숙사 생활에도 적용되지만, 방·층·식사·샤워·여가시간 동선 등 구체 방법은 즉시 안전을 확보하면서 피해학생 의견과 학습·생활 여건을 고려해 정합니다. 2026 가이드북은 침실·동선 분리와 또래 지원 등을 실무 예시로 제시합니다. 이를 전국 모든 기숙사에 동일하게 적용되는 별도 법정 조치로 보지 말고, 소속 교육청·학교의 기숙사 규정도 확인합니다."},{"q":"학폭 조치가 대학 입시에도 반영되나요?","a":"2026학년도 대입부터 학교폭력 조치사항을 모든 전형에서 필수 반영하도록 정해졌고, 세부 반영방법은 대학별로 다릅니다. 2027학년도 등 특정 연도에 지원하는 학생은 그 학년도 대학입학전형기본사항과 해당 대학의 최신 시행계획·모집요강을 확인해야 합니다. 조치별 감점·지원자격 제한 등을 전국 공통으로 단정하지 않습니다."}],"deep":[{"title":"연간 업무와 학교폭력 책임교사의 역할","body":["전담기구 구성: 학교장이 교감·책임교사·전문상담교사·보건교사·학부모로 구성하고 학부모는 3분의 1 이상(예: 6명이면 2명 이상, 8명이면 3명 이상)이다. 학부모는 학교운영위원회 추천을 받아 위촉한다. 가이드북 예시 일정은 2월 운영위 추천·내부결재, 3월 위촉장 수여, 임기 1년(3.1.~다음 해 2.말)이며 자녀가 졸업하면 자격을 잃는다.","예방교육: 학생은 학기별 1회 이상(연 2회 이상), 학급 단위가 원칙이며 교과·창체와 연계해 11차시 이상 운영을 안내한다. 교직원·학부모도 학기별 1회 이상이며, 교직원 교육은 관련 법령·대응 요령·예방프로그램 운영, 학부모 교육은 징후 판별·대응 요령·가정 인성교육을 담는다. 교장·교감 교육은 교육감이 연 1회 이상 한다.","신학기: 학교문화 책임규약을 안내(가정통신문·서명·캠페인)하고, 전담조사관 조사 협조를 미리 알린다. 신고함·비밀게시판·담임 메일 등 신고 창구를 마련하고, 취약시간(점심·쉬는 시간·방과후) 순회지도 계획을 세운다.","실태조사: 교육감은 연 2회 이상 실태조사를 하고 완료 후 120일 안에 결과를 공표한다. 전담기구도 학교 실태조사를 하고, 피해 측은 전담기구에 실태조사를 요구할 수 있다. 학급 설문은 시험 대형으로 앉혀 서로 못 보게 하고 반으로 접어 교사가 직접 걷는다.","학년말: 가해학생 조치사항 삭제 대상자 확정·졸업 직전 삭제 심의, 졸업식 이후~2월 말 나이스 삭제, 조사관 자료관리대장 폐기, 조건부 기재유보 관리대장 정리.","책임교사는 전담기구 구성원으로서 신고 접수·대장 관리, 보호자 통보, 초기 사실확인(최초 확인서), 교육지원청 48시간 보고, 조사관 조사 준비·자료 관리, 전담기구 회의 준비와 보고서 작성, 심의위원회 요청 공문, 조치 이행 관리, 관리대장 관리, 삭제 심의 준비를 맡는다. 현장에서는 상황을 지시하고 주변 학생 질서를 유지하며 진행 상황을 육하원칙으로 기록한다.","학교장은 책임교사 활동을 지원하기 위해 수업시간을 조정하는 등 필요한 조치를 해야 한다. 사안처리가 어려우면 교육지원청 학교폭력 컨설팅단(고경력 책임교사 등)을 요청할 수 있고, 질의는 교육지원청 → 시·도교육청 순으로 한다."],"basis":"학교폭력예방법 제11조제8항·제14조·제15조, 시행령 제16조·제17조, 가이드북 PART 1·전담기구 구성 예시, 제11조의4제1항"},{"title":"신고 접수 실무","body":["경로: 구두(피해·목격 학생, 보호자), 교사 상담, 신고함, 설문, 이메일, 학교·학급 SNS 비공개 채팅, 홈페이지 비밀게시판, 학교 공동휴대전화, 117(전화·문자 #0117·안전Dream), 112, 학교전담경찰관, 기관 통보, 언론 보도. 신고자가 익명을 원하면 익명으로 처리하고, 성폭력 사안은 접수대장에 익명으로 기재해 보관한다.","접수하면 사안번호를 매겨 접수대장에 적고, 학교장 보고·담임 통보, 최초 학생 확인서, 학교의 보호자 통보, 분리 의사 확인, 제2호, 48시간 보고를 이어서 한다. 교원 개인의 법 제20조제4항상 학부모 통지 의무는 예비·음모를 알게 된 경우에 해당한다. 다른 학교 학생이 관련되면 그 학교에 비공개 공문으로 알린다.","신고한 학생은 칭찬하고 불안하지 않게 지지하며 비밀을 끝까지 지킨다. 책임교사와 담임은 신고 학생과 연락처를 공유해 비상시에 대비한다. 보호자가 신고하면 '더 관심을 가지고 조사해 해결하겠다'고 안심시키고 진행 상황을 중간중간 설명한다.","방과 후에 피해 측 연락을 받으면 안전을 확인하고, 필요 시 병원 진료, 상대방 정보와 피해 사진 등 증거 확보를 안내한다. 긴급하면 경찰 신고가 가능함을 알리고, 다음 날 전담기구에 알려 절차를 시작한다."],"basis":"학교폭력예방법 제20조, 가이드북 신고 및 접수·방과 후 대응 요령"},{"title":"분리 실무: 장소·기간·학습권","body":["'인지'는 피해학생 학교에 신고·접수된 사안을 학교장이 보고받아 안 날이다. 24시간 안에 피해학생 분리 의사를 확인하고, 대상·기간(1~7일)·공간을 정한다. 기간은 분리 시행 당일부터 세고 토·공휴일도 포함한다. 긴급조치(제5·6·7호 등)로 분리되면 그때 끝난다.","분리는 징계가 아니다. 학교 안 별도 공간을 마련하고 교육자료·원격수업으로 학습권을 보장한다. 다른 반으로 보내는 것은 학급교체라서 안 된다. 별도 공간이 없어 가정이나 위센터 등에서 하면 '기타 부득이한 사유로 학교장 허가를 받아 결석하는 경우'로 출석인정 결석 처리할 수 있다.","예외: 피해학생 반대, 교육활동 중이 아님, 4요건 모두 충족한 경미 사안(다만 분리 기간 중 요건 불충족이 확인되면 남은 기간 안에서 분리 가능), 긴급조치로 이미 분리됨. 관련 학생 학교가 다르면 분리 불필요(위탁교육시설에서 함께면 분리).","반·학년이 달라도 분리 의사를 확인하고, 원하면 수업은 각자 반에서 하되 쉬는 시간·점심·이동 동선 분리와 생활지도 계획을 세운다. 방과후학교 등 정규 외 프로그램도 같다. 쌍방이 서로 분리를 요청하면 상호 분리한다."],"basis":"학교폭력예방법 제16조제1항, 시행령 제17조의2, 양식 1-2, 가이드북 분리 절차·유의사항"},{"title":"긴급조치 실무","body":["피해학생: 긴급보호를 요청하면 자체해결이나 심의위원회 요청 전에 제1호(심리상담)·제2호(일시보호)·제3호(치료)·제6호(특별보호 프로그램 등)를 할 수 있고(재량), 하면 심의위원회에 즉시 보고한다.","가해학생: 제17조제4항 제2호는 인지 즉시 의무(기재 대상 아님). 제5항은 학교장이 긴급하다고 인정하면 제1·3·5·6·7호를 우선 부과할 수 있고, 부과하면 심의위원회에 즉시 보고해 추인을 받는다. 제6항은 피해 측 요청 시 전담기구 심의를 거쳐 제6·7호를 할 수 있고, 추인 필요. 요청 이후라도 의결 전까지, 조치결정이 유보된 경우에도 의결 전까지 할 수 있다.","우선 출석정지·학급교체 사유: 2명 이상 고의·지속 폭력, 전치 2주 이상 상해, 보복 목적 폭력, 긴급 보호 필요, 피해 측 분리 요청. 반드시 해당 학생·보호자 의견을 들어야 하며(듣지 않으려 한 경우 예외), 출석정지 기간은 심의위원회 의결일까지로 정할 수 있다. 출석정지 중에는 위클래스 상담·자율학습 등 교육적 조치를 한다.","학교장이 긴급조치를 하면(내부결재) 가해학생·보호자에게 통지하고, 거부·회피하면 초·중등교육법 제18조로 징계한다(징계 중 출석정지는 1회 10일 이내, 연간 30일 이내). 심의위원회는 '일부 추인'·'추인하지 않음'을 할 수 있고, 추인되면 심의위원회 조치가 되어 생기부에 기재한다."],"basis":"학교폭력예방법 제16조제1항, 제17조제4항~제7항·제10항, 시행령 제21조, 초·중등교육법 시행령 제31조, 양식 2-3"},{"title":"전담조사관이 올 때 학교가 준비할 것","body":["준비물: 독립된 면담 공간, 관련 학생별 분리 조사 시간표(수업시간 외 우선), 학생 확인서 사본·스캔본(암호 설정), CCTV 열람 준비, 민감 정보(성 관련, 장애, 이주배경, 위기학생) 사전 공유, 학부모 면담 장소.","진행: 조사관은 조사관증을 달고 오며, 학교 방문 전 일정·장소를 협의한다. 관련 학생·보호자 면담, 추가 학생 확인서, 목격자(학생·담임) 면담을 하고 필요하면 관련 교사와 면담한다. 조사관은 자체해결 동의서를 받으면 학교에 전달할 수 있다.","유의: 조사관은 학생을 직접 훈계하지 않고, 학교폭력 여부나 조치 수준을 예견해 말하지 않는다. 학교도 조사관과 언쟁하지 말고 문제가 있으면 교육지원청 담당자에게 연락한다. 자료는 자료관리대장에 기록하고 사안 종료 후 조사관이 학교에서 폐기·서명한다."],"basis":"가이드북 조사관 사안조사 시 학교의 역할·협조사항·유의사항, 양식 2-7"},{"title":"확인서 받는 법과 면담 요령","body":["피해 학생 면담: 판단·충고 없이 경청하고 '많이 힘들었겠구나', '선생님에게 이야기하는 건 고자질이 아니야'처럼 지지한다. 몸과 마음 상태, 필요한 도움, 보복 걱정을 묻고, 학교가 책임지고 보호할 것과 절차를 설명한다. 대질하지 않는다.","가해 관련 학생 면담: 낙인찍지 않고 입장을 끝까지 듣는다(쌍방 사안이거나 뒤바뀔 수 있음). 폭력을 쓰게 된 상황을 탐색하되, 폭력은 용인되지 않음을 알려 준다. 사과 의사가 있으면 피해 측이 받아들일 준비가 됐을 때 진심 어린 사과를 해야 함을 안내한다.","목격 학생: 충격을 확인해 위로하고 비밀 보장을 충분히 안내해 보복 걱정을 덜어 준다.","확인서: 육하원칙(언제·어디서·누가·무엇을·어떻게·왜)으로 피해·가해·목격 사실을 상세히 쓰게 한다. 질문 예: '그날 어떤 일이 있었는지 처음부터 말해 줄래?', '언제, 어디서였어?', '누가 있었어?', '그 친구가 한 말을 그대로 말해 줄 수 있어?', '전에도 비슷한 일이 있었니?'. 진위는 면담과 정황의 일치, 양측 상호 인정, 진술의 일관성, 목격자, 정황증거로 판단한다.","정보 수집 항목: 피해학생(학년·성별·교우관계·장애·평소 생활), 가해학생(수·동기·다른 피해자), 폭력 유형·형태(집단·일대일), 지속기간, 장소, 원인, 치료비, 진단서. 힘의 불균형(체격뿐 아니라 언어·관계)을 꼭 살핀다."],"basis":"가이드북 학생 상담 시 유의사항·면담 조사·정보 수집·정황 파악"},{"title":"증거 보존(사이버 포함)","body":["현장: 증거물을 섞거나 없애지 않고, 응급조치 내용을 빠짐없이 기록한다. CCTV는 조사관·전담기구 요청에 따라 열람 협조한다. 신체 피해는 진단서·소견서로 증명한다.","사이버·언어폭력: 욕설·협박 문자에는 응답하지 않게 하고, 게시판·단톡방·안티카페의 비방은 그 자체로 저장·캡처한다. 증거는 이메일, 채팅, 게시판, SNS 캡처, 문자, 사진, 동영상, 음성 파일로 모은다. 증거 확보 후 피해 측은 정보통신서비스 제공자에게 삭제·차단을 요청할 수 있다.","면담 녹음은 음성권 문제가 있으니 학생·보호자 동의를 먼저 받는다. 학교에서 대처한 내용을 문서로 남겨야 이후 분쟁을 예방할 수 있다. 성적 촬영물은 교사가 받거나 보관하지 않고 수사기관·삭제지원기관으로 넘긴다(딥페이크 항목 참조)."],"basis":"가이드북 신체폭력·언어폭력·사이버폭력 대응, 사실 확인, 면담 조사"},{"title":"전담기구 회의 운영법","body":["학교장 요청으로 소집하며 비공개다. 교감이 총괄하고 부득이하면 책임교사가 대행한다. 구성원 과반수 참석, 과반수 찬성으로 의결한다.","안건: 학교장 자체해결 부의 여부, 긴급조치(제17조제6항) 여부, 집행정지에 따른 분리, 졸업 전 조치사항 삭제, 학교폭력 아닌 사안 확인.","자체해결 심의 순서: ①사안조사 내용 보고 ②4요건 각각 O/X 판단(보편적 기준으로 지속성 판단, 재산 피해는 치료비 포함) ③피해 측 동의서 제출 여부 확인 ④결정사항 기록 → 양식 3-1로 학교장 보고. 전담기구는 심의위원회가 아니어서 법정 회의록 의무는 없다.","피해학생 1명·가해학생 여럿이면 가해학생 모두에 대해 동의해야 자체해결이 되고, 피해학생이 여럿이면 피해학생별로 판단한다. 소속 학교가 다르면 피해학생 학교 전담기구가 먼저 심의·결정하고 가해학생 학교는 그 결정을 따라 심의한다."],"basis":"학교폭력예방법 제13조의2·제14조, 가이드북 전담기구 심의·학교장 자체해결"},{"title":"자체해결 요건 판단법과 동의서 받는 법","body":["①진단서: 전담기구 심의일 전까지 2주 이상 진단서를 내지 않았으면 충족. 한 번 제출했다가 회수해도 불충족이니 미리 안내. ②재산 피해: 심의일 전에 복구됐거나 가해 측 보호자가 복구를 확인해 주고 피해 측 보호자가 인정한 경우(심의위원회 개최 전 복구도 전담기구 심의로 충족 인정 가능). ③지속성: 피해 학생 진술이 없어도 전담기구가 보편적 기준으로 판단. ④보복: 조치받은 사안이나 조사 중인 사안에서 신고·진술·자료제공한 학생에게 폭력을 쓰면 보복.","동의서(양식 3-2)는 피해학생과 보호자가 함께 서명한다. 받기 전 두 가지를 반드시 설명한다: 요건이 안 되면 동의서를 내도 자체해결이 안 된다, 자체해결 뒤에는 복구 약속 불이행이나 새 사실이 확인될 때만 심의위원회를 요청할 수 있다. 자체해결을 권유·강요하지 않는다.","요건은 충족하지만 피해 측이 동의하지 않으면 심의위원회로 가며, 학교장은 관계회복 프로그램을 권유할 수 있다. 가해자가 학생이 아니면 자체해결 대상이 아니다."],"basis":"학교폭력예방법 제13조의2, 가이드북 학교장 자체해결 사안·절차, 양식 3-2"},{"title":"심의위원회 요청 공문과 자료 준비","body":["공문(양식 2-6): 수신 ○○교육지원청, 제목 '학교폭력대책심의위원회 개최 요청', 관련 근거(학교폭력예방법 제13조제2항), 피해·가해 학생의 학교·학년반·이름·학교 사안번호·학생선수 여부·비고(예: 성폭력 피해로 비실명 처리 요청).","붙임: 피해·가해학생 확인서, 보호자 확인서, 목격학생 확인서, 사안조사 보고서, 긴급조치 보고서, 전담기구 심의결과 보고서, 보호자 개인정보(우편번호·주소·보호자명·관계·휴대폰), 학생선수 확인 서류(학교장 확인서·선수등록증명서·학생선수 확인서 중 1개 이상, 선수가 아니면 불필요), 기타.","학생선수 사안은 학생선수 담당자 협조 결재를 받는다. 보호자 개인정보 수집에는 별도 동의가 필요 없다. 공문 보안에 각별히 유의한다. 교육지원청은 사례회의로 조사의 완결성을 검토하고 보완조사나 중대사안 수사의뢰를 정할 수 있다."],"basis":"양식 2-5·2-6, 가이드북 심의위원회 절차에 따른 학교의 역할"},{"title":"심의위원회 구성과 심의 당일 학교가 할 일","body":["심의위원회는 교육지원청의 법정위원회로 10명 이상 50명 이내, 전체의 3분의 1 이상은 관할 학교 학부모(가이드북은 심의(소)위원회 학부모 위원을 35% 이내로 제한, 규모상 불가피하면 예외), 학교전담경찰관은 반드시 위촉한다. 위원 임기는 2년, 재적 과반수 출석·출석 과반수 찬성으로 의결한다. 위원이 관련 학생의 보호자·친족이거나 친분이 있으면 제척되고, 당사자는 서면 소명으로 기피 신청을 할 수 있으며 위원 스스로 회피할 수 있다. 회의는 비공개이며 회의록 열람·복사를 신청하면 개인정보를 뺀 뒤 공개한다. 수사 중·성폭력 등으로 사실 확인이 어려우면 조치결정을 유보할 수 있고, 유보 사실과 사유는 서면 통보한다.","학생 출석은 학교장 허가 결석(출석인정)으로 처리하고 학습권 침해를 줄인다. 교육지원청은 대기실을 분리하므로 이동 동선도 겹치지 않게 돕는다.","심의위원회가 요청하면 관리자·책임교사·담임·학생보호인력 등이 출석해 의견을 말하거나, 서면·(영상)통화·사전면담으로 협조한다. 의견은 확인된 사실 중심으로 말하고 조치 수준에 대한 개인 의견은 삼간다. 피해학생 또는 가해학생이 장애학생인 경우에는 제16조의2제2항에 따른 전문가 의견 청취 절차를 따르고, 장애학생 본인이나 보호자의 요청이 있으면 반드시 청취한다.","피해학생 또는 보호자가 요청하면 심의위원회는 소아청소년과·정신건강의학과 의사, 심리학자 등 전문가 의견을 반드시 들어야 한다(제13조제5항). 피해학생 또는 가해학생이 장애학생이면 특수교육 전문가·장애인 전문가 의견은 장애학생 본인 또는 보호자가 요청한 때 반드시 청취해야 한다."],"basis":"가이드북 심의방식·심의위원회 요청에 따른 관련 교원의 출석, 시행령 제14조제8항·제26조, 학교폭력예방법 제12조·제13조·제21조, 시행령 제14조"},{"title":"조치 결정 통보 후 학교가 할 일","body":["교육장은 조치 결정 뒤 학교에 공문으로 통보하고, 학교장은 이행에 협조해야 한다. 학교는 ①생기부 즉시 입력(또는 조건부 기재유보 대장 기록) ②조치별 이행 계획(기간·기관·지도교사) ③피해학생 보호조치 이행 ④보호자 특별교육 안내 ⑤이행 결과 교육(지원)청 보고를 한다.","피해학생·보호자에게는 피해학생 전담지원기관 정보, 치료비 공제회 청구 방법, 전출·진학 시 정보 제공 동의 제도를 안내한다. 가해학생에게는 제2호 접촉 금지 범위(기간을 정하지 않았으면 해당 학교급 졸업까지)를 다시 설명한다.","양측에 불복 제도(행정심판·행정소송)가 있다는 것을 안내하되, 학교가 청구를 받는 곳이 아니며 청구만으로 조치가 멈추지 않는다는 점을 알린다."],"basis":"학교폭력예방법 제19조, 가이드북 조치결정 이후의 절차·접촉 등 금지의 범위"},{"title":"조치별 이행 관리","body":["제1호 서면사과·제2호 접촉 금지·제3호 교내봉사: 이행 기간이 정해져 있다. 교내봉사는 캠페인·행사 도우미·환경정화 등 교육적 봉사로, 시간을 명확히 하고 지도교사를 정한다.","제4호 사회봉사: 지역 행정·공공기관·사회복지기관과 업무 협조하고 확인 자료로 실제 이행을 확인한다. 제5호와 부가 특별교육: 교육감이 정한 기관(대안교육기관 포함)에서 이수하며 시간은 심의위원회가 정한다(재발 여부 고려해 늘릴 수 있음). 제3~5호와 부가 조치는 시간 단위로 결정되고 관련 결석은 학교장이 인정하면 출석이다.","제6호 출석정지: 출석일수에 넣지 않는 미인정결석. 다음 학년도까지 이어지면 당해 학년도 특기사항에 받은 일수를 적고 다음 학년도는 공란, 상급학교 진학 시 잔여 일수 안내·이행 협조 공문을 보낸다.","제7호 학급교체: 같은 학교 다른 반으로 옮기며 비밀 누설에 유의한다. 제8호 전학: 통보받은 학교장은 즉시(7일 이내) 배정을 요청하고, 교육감·교육장은 피해학생 보호에 충분한 거리를 고려한다. 전학 간 학생은 피해학생 학교로 다시 전학 올 수 없고, 상급학교 진학 때도 서로 다른 학교에 배정(피해학생 우선). 제9호 퇴학: 의무교육 과정엔 적용하지 않으며 교육감은 대안학교 입학 등 대책을 마련한다.","여러 조치가 함께 나오면 교육장은 전학을 먼저 시행할 수 있다. 신고부터 이행 완료까지 가해학생 신청에 의한 학적변동은 원칙적으로 제한된다."],"basis":"학교폭력예방법 제17조, 시행령 제20조·제23조, 가이드북 가해학생 교육·선도 조치"},{"title":"생활기록부 기재 실무","body":["시점: 조치결정 통보 공문을 받는 즉시. 조치결정일자는 교육장 결정일(교육지원청 내부결재일). 영역: 2024.3.1.부터 '학교폭력 조치상황 관리'란 일원화(2026.3.1. 기준 초1~3과 중·고 전 학년, 초4~6은 연차적으로 적용되기 전까지 종전처럼 행동특성 및 종합의견·출결상황 특기사항·인적·학적사항 특기사항에 분산).","조건부 기재유보(제1~3호): 이행 기간 안에 이행하고 같은 학교급(초등은 조치일부터 3년 안)에서 다른 사안으로 조치를 받지 않으면 적지 않는다. 기간 안에 이행하지 않으면 기재하고 뒤에 이행해도 유지. 다른 사안으로 조치를 받으면 이전에 적지 않은 조치까지 함께 적는다(학년도가 다르면 추가 조치된 학년도에 병기, 결정일은 각각). 대장에 적고 이행하지 않으면 취소선을 긋는다.","기재하지 않는 것: 피해학생 보호조치, 제17조제4항 긴급 제2호, 부가 특별교육·심리치료 이수 사실. 기재하는 것: 추인된 긴급조치(제1·3·5·6·7호), 동시에 부과된 조치 모두, 미이행에 따른 추가 조치(결정일은 원조치 일자).","변동: 행정심판·소송이 제기돼도 기재 후 결과에 따라 조치사항만 수정(결정일자 유지). 전출·자퇴는 조치사항 먼저 입력 후 학적 처리. 유예생은 당해 학년도면 학적반영 취소 후 입력, 이전 학년이면 정정대장. 진학 직전 사안이 진학 후 결정되면 심의 요청 학교급 학생부에 기재(결정일은 졸업학년도 2월 말일)하고, 이미 삭제 심의로 지웠던 기록도 함께 다시 기재한다.","문구와 세부 입력 방법은 교육부 해당 학년도 「학교생활기록부 기재요령」을 따른다."],"basis":"초·중등교육법 시행규칙 제21조, 학교생활기록 작성 및 관리지침 제16조의2, 가이드북 PART 4 3장, 양식 4-2"},{"title":"보호자 특별교육이 이수되지 않을 때","body":["대상: 가해학생이 제5호(조치로서의 특별교육)나 부가 특별교육을 받으면 보호자도 받아야 한다. 이수시간: 제2·3호 관련 4시간 이내, 제4~8호 관련 5시간 이상. 교육감이 지정한 기관(학부모지원센터, 위센터, 청소년꿈키움센터, 청소년상담복지센터 등)에서 받고, 주말·야간 과정 개설이 권장된다.","흐름: 교육장이 조치 후 14일 이내 서면 통보 → 학교장이 3개월 안 이수 안내 → 3개월 되는 날까지 불응하면 다음 날 학교장이 명단을 교육감에게 통보 → 교육감이 14일 이내 '1개월 안 이수, 미이수 시 과태료' 서면 안내 → 1개월 되는 날까지 불응하면 다음 날 과태료 부과 예고 → 14일 안에 이수증을 내면 부과 안 함, 의견을 내면 재검토, 아무것도 안 내면 부과·징수.","과태료는 300만원(사소한 부주의 등 사유가 있으면 2분의 1 범위에서 감경 가능). 부과 후 이의는 60일 이내 교육청에 하고, 교육청이 법원에 통보해 과태료 재판을 한다. 과태료와 무관하게 이수 의무는 남는다."],"basis":"학교폭력예방법 제17조제13항, 제23조, 시행령 제35조·별표, 가이드북 가해학생 및 보호자 특별교육"},{"title":"행정심판·행정소송이 들어왔을 때 학교가 할 일","body":["청구 경로 안내: 행정심판은 처분청(교육장)이나 시·도교육청 행정심판위원회에 서면 또는 www.simpan.go.kr로, 행정소송은 교육장을 피고로 법원에. 기간은 행정심판 안 날 90일·있은 날 180일, 행정소송 안 날 90일·있은 날 1년. 학교는 청구를 받는 곳이 아니다.","통지와 자료: 행정심판위원회는 피해 측과 양쪽 학교에 청구 사실과 심판참가 방법을, 교육장은 소송 제기 사실과 소송참가 방법을 문서로 알린다. 학교는 교육청·교육지원청이 요청하는 사안 자료를 제출하고, 조치 이행과 생기부 기재는 그대로 진행한다.","집행정지: 행정심판위원회·법원은 결정 전 피해 측 의견을 반드시 듣는다(포기 등 예외). 피해 측은 가해 측을 내보낸 뒤 진술하거나 서면으로 낼 수 있다. 교육감·교육장이 신청 사실과 결과를 피해 측과 양쪽 학교에 통지하면 기록하고, 인용되면 피해 측 분리 요청을 받아 전담기구 심의로 분리 방법을 정한다(별도 공간 아님, 집행정지 기간 동안). 이행 기간 중인 제1~3호는 기재 보류.","결과 반영: 재결·판결로 조치가 변경·취소되면 조치사항만 수정하고 결정일자는 유지한다. 가해 측이 불복하면 제로센터가 피해학생 법률자문·소송 지원을 연계할 수 있다."],"basis":"학교폭력예방법 제17조의2~제17조의5, 행정심판법 제23조·제27조·제30조·제45조, 행정소송법 제18조·제20조·제23조, 가이드북 PART 4 4장"},{"title":"관계회복 프로그램 운영","body":["대상은 해당 사안의 관련 학생(피해·가해)이며 일반 학생 대상 프로그램이 아니다. 사안처리 전 과정에서 운영할 수 있지만 양측 동의가 있어야 하고 한쪽이 중단을 원하면 멈춘다. 참여해도 사안처리는 그대로 진행되며, 회복되면 심의위원회 '화해 정도'에 반영될 수 있다(자체해결로 반드시 끝나는 것은 아님).","역할 예시: 교장 총괄, 교감 운영관리·외부연계·안내와 동의 확인, 담임 진행·사후관리, 책임교사 사안 공유·진행, 상담교사 심리정서 개입. 교육지원청 관계개선 지원단(예비중재 → 본중재 → 사후관리)을 요청할 수 있다.","방법: 사전 개별면담으로 각자의 욕구와 상태를 확인 → 준비되면 대면 소통. 확인 사항: 피해 측이 사과를 받을 준비가 됐는지, 가해 측이 잘못을 충분히 인정하고 미안함을 전할 준비가 됐는지, 재발 방지 노력, 사과 방법·시간·장소에 피해 측 입장을 배려했는지. 준비 없이 무리하면 관계가 더 나빠질 수 있다."],"basis":"학교폭력예방법 제13조의2제3항, 시행령 제14조의3, 가이드북 관계회복"},{"title":"졸업 전 삭제 심의 운영","body":["대상 조치: 2023.3.1. 이후 신고 사안은 제4~7호(2023.2.28. 이전 신고 사안은 제4·5·6·8호). 졸업예정자만 심의하고 기존 졸업자는 제외한다.","요건: 재학 기간 중 서로 다른 사안 2건 이상으로 조치를 받지 않았을 것, 조치결정일(교육지원청 내부결재일)부터 졸업학년도 2월 말까지 6개월이 지났을 것. 반성과 긍정적 행동변화를 확인자료로 객관적·엄격하게 심의한다.","확인자료: 담임 의견서(반성·관계회복 노력), 조치 이행 확인서(증빙 첨부, 책임교사), 부가 특별교육·심리치료 이수확인서(학생, 필수), 보호자 특별교육 이수확인서, 가해학생 자기의견서, 행정심판·소송 진행 여부, 피해학생의 삭제동의 확인서.","처리: 전담기구가 삭제 대상 명단을 학교장에게 보고하고 학업성적관리위원회에 통보(회의록·내부결재) → 위원회가 확인·확정하고 삭제 담당자 지정 → 담당자가 나이스에서 삭제·결과 보고 → 학교장 결재. 제1~3호도 졸업과 동시 삭제 대상으로 함께 확정한다."],"basis":"초·중등교육법 시행규칙 제22조, 학교생활기록 작성 및 관리지침 제18조, 가이드북 참고2"},{"title":"교사 보호: 면책·법률지원·교사가 지목될 때","body":["면책: 학교장과 교원이 관계 법령과 학칙을 지켜 한 정당한 학교폭력 사건처리나 생활지도는 민사·형사 책임을 지지 않는다. 교육부장관·교육감은 법률지원단을 통해 학교폭력 관련 상담과, 민사소송·형사 고소·고발을 당한 경우 법률서비스를 제공할 수 있다.","민사 책임의 범위: 교사는 교육활동과 밀접한 관계에서 폭력을 예견할 수 있었고 방지 노력을 다하지 않은 경우에만 책임을 지며, 국·공립은 경과실이면 지방자치단체가 배상한다. 그래서 대처 내용을 문서로 남긴다.","교사가 가해자로 지목되면: 학교장은 인지 즉시 교사와 피해학생을 분리한다(학교폭력예방법상 가해자에 교사 포함). 가해자가 학생이 아니므로 자체해결 대상이 아니고, 피해학생 보호조치를 위해 심의위원회를 요청하거나 피해 측이 원하지 않으면 미개최 동의서로 보고한다. 청소년성보호법상 법정 신고 대상 범죄이면 수사기관에 즉시 신고하고, 그 밖의 성희롱·성폭력은 별도 법령·교육청 절차(성폭력 항목)를 따른다.","보호자와의 관계: 보호자에게 교사·상대 학부모에 대한 폭언, 확인되지 않은 사실의 SNS 유포를 하지 말라고 미리 안내한다."],"basis":"학교폭력예방법 제11조의4, 제16조제1항, 가이드북 참고1·가해자가 학생이 아닌 사안의 처리·보호자 유의사항 안내"},{"title":"자주 하는 실수 모음","body":["신고를 받고도 '일단 지켜보자'며 접수하지 않음 → 사소해도 접수. 분리한다며 다른 반으로 보냄 → 별도 공간. 분리 기간에 주말을 빼고 계산함 → 포함. SPO 상담을 신고로 착각함 → 112·117에 신고 의사를 밝혀 신고(SPO를 통한 '상담'은 신고로 볼 수 없음).","피해·가해 학생을 불러 화해시킴, 학급 앞에서 훈계함, 다른 학생 앞에서 사실 확인함. 보호자에게 '이 정도면 ○호 나올 것 같다'고 예단함. 상대방 연락처를 알려줌.","자체해결을 권유·강요함, 동의서만 받고 요건 심의를 빠뜨림, 진단서 회수의 효과를 안내하지 않음. 가해학생이 여럿인데 일부에게만 동의받고 자체해결함.","48시간 보고·14일 기한을 놓침, 공문 비공개 설정을 빠뜨림, 사안번호를 서류마다 다르게 씀. 확인서 원본을 조사관에게 넘김.","조치 통보 뒤 생기부 입력을 미룸, 제2호 긴급조치를 생기부에 적음, 피해학생 보호조치를 적음, 불복했다고 입력하지 않음, 결정일자를 바꿈. 제1~3호 이행 기간을 확인하지 않아 유보 조건을 놓침.","졸업 직전 삭제 심의에서 6개월 요건이나 다른 사안 여부를 확인하지 않음, 기존 졸업자를 심의함."],"basis":"2026 학교폭력 사안처리 가이드북 전반"}],"tables":[{"title":"연간 업무 달력","head":["시기","할 일","근거"],"rows":[["2월","학교운영위원회에 전담기구 학부모 위원 추천 요청, 전담기구 구성 내부결재(예시)","시행령 제16조, 가이드북 전담기구 구성 예시"],["3월","전담기구 위촉장 수여, 학교문화 책임규약 안내(가정통신문·서명·캠페인), 조사관 조사 협조 안내, 신고 창구 안내","가이드북 사전 예방활동"],["1학기 중","학생 예방교육 1회 이상(학급 단위), 교직원·학부모 예방교육 각 1회 이상, 취약시간 순회지도","학교폭력예방법 제15조, 시행령 제17조"],["2학기 중","학생·교직원·학부모 예방교육 각 1회 이상","학교폭력예방법 제15조"],["교육감이 정한 시기","교육감 실태조사(연 2회 이상) 참여, 학교 자체 설문","학교폭력예방법 제11조제8항, 제14조제5항"],["연중","사안 접수·처리, 집중보호·관찰 학생 생활지도, 조치 이행 관리","가이드북"],["학년말","가해학생 조치사항 삭제 대상자 확정, 졸업 직전 전담기구 삭제 심의, 학업성적관리위원회 통보","가이드북 참고2"],["졸업식 이후 ~ 2월 말","나이스 학생부 조치사항 삭제(졸업생 학적반영 이전), 조건부 기재유보 관리대장 폐기(졸업학년도 2월 말)","가이드북, 양식 4-2"],["학년도 말","전담조사관 자료관리대장 폐기","양식 2-7"],["2027년부터 매년 5월 네 번째 월요일부터 1주","학교폭력예방의 날 및 예방주간. 국가·지자체는 취지에 맞는 행사·교육·홍보 실시에 노력한다(학교의 별도 의무행사로 단정하지 않음).","학교폭력예방법 제15조의2 (2026.6.2. 신설, 2027.1.1. 시행 예정)"]],"note":"월별 배치는 가이드북 예시 일정과 법정 주기를 합친 것. 실태조사 시기와 예방교육 날짜는 교육청·학교 계획에 따른다."},{"title":"사안처리 기한 한눈표(기산점 포함)","head":["단계","기한","언제부터 세나","근거"],"rows":[["학교 접수·내부 보고 및 보호자 통보","즉시","인지·접수 때","가이드북 절차, 법 제20조제1항·제2항(예비·음모는 제4항)"],["아동·청소년대상 성범죄 법정 신고(요건 해당 시)","즉시","직무상 알게 된 때","청소년성보호법 제34조"],["분리 결정","24시간 이내","학교장이 신고·접수 사안을 보고받아 안 날","법 제16조, 가이드북"],["분리 기간","1~7일(초일·토·공휴일 포함)","분리방법 결정 시점","가이드북, 양식 1-2"],["가해학생 제2호","지체 없이","인지","법 제17조제4항"],["교육(지원)청 보고","48시간 이내","인지","가이드북"],["조사·전담기구 심의·자체해결 결정 또는 심의위원회 요청","14일 이내(+7일)","신고·접수 등 인지","가이드북"],["심의위원회 개최","21일 이내(+7일)","요청 공문 접수 시점","가이드북"],["교육장 조치","가해 14일 / 피해 7일","심의위원회 조치 요청", 정대리인이 대리). 피고: 교육장","법원","안 날 90일, 있은 날 1년. 행정심판을 거쳤으면 재결서 정본 송달일부터","법원 집행정지 결정 필요. 행정심판 없이 바로 가능. 가해 측 소송은 1심 90일, 2·3심 각 60일 안에 선고"],["집행정지","불복한 쪽","행정심판위원회 또는 법원","행정심판은 청구와 동시 또는 의결 전까지","인용 시 조치 집행 정지, 결정 전 피해 측 의견 청취 의무, 인용 시 피해 측 분리 요청권, 1~3호 기재 보류"],["분쟁조정","피해·가해학생 또는 보호자 누구든","심의위원회(다른 교육지원청이면 교육감)","신청 후 5일 안 개시, 1개월 이내","손해배상 합의 조정. 고소·소송 제기 시 거부·중지 가능. 조치를 대신하지 않음"],["재심","-","-","-","같은 사안의 재심 성격 심의위원회는 열지 않음"]],"note":"학교폭력예방법 제17조의2~제17조의5·제18조, 행정심판법 제23조·제27조·제30조·제45조, 행정소송법 제18조·제20조·제23조, 2026 가이드북 불복절차."},{"title":"생기부 기재·삭제표","head":["구분","기재","삭제","비고"],"rows":[["제1·2·3호","조건부 기재유보(미이행·같은 학교급 재조치 시 기재)","졸업과 동시(졸업식 이후~2월 말)","관련 긍정적 행동변화 기재도 함께 삭제"],["제4·5호","기재","졸업일부터 2년 후","졸업 직전 전담기구 심의로 졸업과 동시 삭제 가능"],["제6·7호","기재","졸업일부터 4년 후","졸업 직전 심의로 졸업과 동시 삭제 가능"],["제8호","기재","졸업일부터 4년 후","심의 삭제 불가"],["제9호","기재","삭제 안 함","-"],["긴급 제2호(제17조제4항)","기재 안 함","-","추인 대상 아님"],["추인된 긴급조치(1·3·5·6·7호)","기재","해당 호 기준","심의위원회 조치가 됨"],["피해학생 보호조치, 부가 특별교육","기재 안 함","-","-"],["2023.3.1.~2024.2.29. 신고 사안","종전 방식","제6·7호 졸업 2년 후(심의 가능), 제8호 졸업 2년 후","초4~6 표 참조"],["2023.2.28. 이전 신고 사안","종전 방식","제6호 졸업 2년 후(심의 가능), 제7호 졸업과 동시, 제8호 졸업 2년 후(심의 가능)","심의 대상은 제4·5·6·8호"]],"note":"초·중등교육법 시행규칙 제21조·제22조, 학교생활기록 작성 및 관리지침 제16조의2·제18조, 2026 가이드북. 학업중단자는 학적 유지 가정으로 삭제 시기를 정하고 심의 삭제 불가."},{"title":"역할별 할 일","head":["역할","초기","조사·심의","조치 이후"],"rows":[["담임","학교 내부 보고·초기 학생 안정·귀가 지도, 보호자 상담 협조, 병원 이송 동승","조사 협조(면담·자료), 보호자 상담, 심의위원회 요청 시 의견","생기부 입력, 조치 이행 지도, 피해학생 학습·적응 지원, 삭제 심의용 담임 의견서"],["책임교사","접수대장·최초 확인서·보호자 통보·48시간 보고, 현장 지시와 기록","조사관 조사 준비·자료관리대장, 전담기구 회의 준비·보고서, 심의위원회 요청 공문","관리대장 관리, 이행 확인서, 미이행 보고, 삭제 심의 준비"],["교감","상황 파악·지시, 분리 공간·학습 지원 마련","전담기구 총괄, 자체해결 요건 심의","관계회복 운영관리·외부연계, 삭제 심의 총괄"],["교장","분리·제2호·긴급조치 결정, 수사기관 신고","조사 주체 결정, 자체해결 결정, 심의위원회 요청","조치 이행 협조·결과 보고, 관계회복 총괄, 축소·은폐 금지"],["전문상담교사","피해학생 심리 안정, 가해학생 초기 상담","심리·정서 상태 파악, 전담기구 참여","보호조치 상담, 관계회복 진행, 외부 기관 연계"],["보건교사","응급조치, 119·병원 이송 동승, 병원에서 상태 설명","전담기구 참여, 치료 기록 제공","치료 관련 보호조치 지원"]],"note":"2026 가이드북 신체폭력 응급조치 역할 분담·전담기구 구성·관계회복 역할 예시를 합친 것."}],"record":"심의위원회 조치결정 통보 공문을 받는 즉시 학교생활기록부 '학교폭력 조치상황 관리'란에 가해학생 조치를 입력한다(2026.3.1. 기준 초1~3학년과 중·고 전 학년은 이 란으로 일원화, 초4~6은 종전처럼 분산). 제1~3호는 조건부 기재유보이며 관리대장(양식 4-2)으로 관리하고, 이행 기간 안에 이행하지 않으면 기재한 뒤 나중에 이행해도 유지한다. 제17조제4항 제2호 긴급조치, 피해학생 보호조치, 부가 특별교육은 기재하지 않고, 추인된 긴급조치(제1·3·5·6·7호)는 기재한다. 조치결정일자는 교육지원청 내부결재일. 행정심판·소송이 제기돼도 먼저 입력하고, 변경·취소되면 조치사항만 수정(결정일자 유지). 전출·자퇴 전 입력 후 학적 처리, 관리대장(양식 4-1)은 전입교로 송부. 긴급 출석정지는 미인정결석이나 추인되지 않거나 자체해결되면 출석 인정 가능. 졸업 전 삭제는 전담기구 심의 → 학업성적관리위원회 확인 → 졸업식 이후~2월 말 나이스 삭제. 세부 문구는 해당 학년도 학교생활기록부 기재요령을 따른다.","sources":[{"title":"2026년도 학교폭력 사안처리 가이드북(일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소(충청북도교육청 게시본)","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/9CA0E6C1-EBB5-5E10-9586-5F16C1E16D8A.pdf"},{"title":"학교폭력예방 및 대책에 관한 법률 [시행 2026. 6. 2.] 법률 제21723호","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교폭력예방및대책에관한법률"},{"title":"학교폭력예방 및 대책에 관한 법률 시행령 [시행 2026. 1. 2.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교폭력예방및대책에관한법률시행령"},{"title":"형법 [시행 2026. 9. 13.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/형법"},{"title":"소년법 [시행 2021. 4. 21.]","publisher":"국가법령정보센터","year":2021,"url":"https://www.law.go.kr/법령/소년법"},{"title":"2026학년도 대학입학전형기본사항 발표","publisher":"교육부 보도자료","year":2023,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=294&boardSeq=96229&lev=0&m=020402&opType=N&s=moe&statusYN=W"},{"title":"2026학년도 대학입학전형기본사항 발표","publisher":"한국대학교육협의회","year":2023,"url":"https://www.kcue.or.kr/news/sub02/sub01.php?at=view&idx=24138"},{"title":"2027학년도 대학입학전형기본사항 (개정본, 2026.7.31. 개정 안내)","publisher":"한국대학교육협의회","year":2026,"url":"https://www.kcue.or.kr/news/sub02/sub01.php?at=view&idx=2764313"},{"title":"2026년 학교폭력 사안처리 가이드북 안내 (2026.2.27. 게시)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=316&boardSeq=105456&lev=0&m=030214&opType=N"},{"title":"민법 제750조(불법행위의 내용)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/lsSideInfoP.do?docCls=jo&joBrNo=00&joNo=0750&lsiSeq=284415&urlMode=lsScJoRltInfoR"},{"title":"국가배상법 제2조(배상책임)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1026745463"},{"title":"아동·청소년의 성보호에 관한 법률(시행 2026.5.12.) 제2조·제34조·제67조","publisher":"국가법령정보센터","year":2026,"url":"https://law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033133717"}],"verified":"2026-09-24","uncertain":["가이드북 원문은 교육부 누리집이 아니라 충청북도교육청 게시본(2026년도 일부개정판)으로 확인함. 교육청별 제로센터 연락처, 보고·조사관 배정 운영 방식, 미이행 보고 방법은 소속 교육청 지침에서 확인한다","교육부의 2026 가이드북은 2026.2.27. 게시본이다. 2026.6.2. 개정(법률 제21723호)으로 제16조의2제2항 단서(장애학생 측 요청 시 전문가 의견 청취 의무)는 공포일부터 시행 중이고, 제15조의2 학교폭력예방의 날·주간은 부칙 제1조 단서에 따라 2027.1.1. 시행이다(law.go.kr 현행 원문으로 확인). 교육부가 이 개정 후 별도 보충 가이드·운영 서식을 배포했는지는 이번 확인 범위에서 찾지 못했다.","117 문자 신고 번호는 2026 교육부 가이드북 26쪽이 '#0117', 경기도교육청 2026 안내서가 '#1017'로 서로 다름. 가이드북 값을 적음","교육(지원)청 보고 48시간·14일(+7일)·심의위원회 21일(+7일)·미이행 3개월 등은 법률 조문이 아니라 가이드북 운영 기준임","나이스(NEIS) 메뉴 경로는 가이드북에 없어 적지 않음(영역명 '학교폭력 조치상황 관리'와 삭제 시점만 원문 확인). 조치별 입력 문구는 해당 학년도 학교생활기록부 기재요령을 확인해야 함","연간 달력의 월 배치(2·3월)는 가이드북 예시 일정이며, 실태조사 시행 월은 교육감이 정해 원문에 없음","행정소송의 관할 법원(행정법원·지방법원 행정부)은 원문에서 '법원'으로만 확인해 구체적으로 적지 않음","민사 손해배상 청구 기간(소멸시효)은 원문에서 확인하지 못해 적지 않음","대입 반영의 구체적 방법(감점·지원자격 제한 등)은 대학마다 달라 적지 않음","초4~6학년의 일원화 적용 시기는 연도별로 달라지므로(2027~2029년 순차) 해당 학년도 학생부 기재요령을 확인해야 함"],"related":["cyber-deepfake","sexual-violence","student-guidance"]},{"id":"sexual-violence","title":"학생 대상 성폭력·성희롱","aka":["성폭력","성추행","성희롱","몸을 만졌어요","강제로 만졌어요","성적인 말","교사 성희롱","선생님이 만졌어요","성고충","성범죄 신고의무","해바라기센터","1366","스쿨미투"],"category":"학생 보호·위기","urgency":"즉시","roles":["처음 알게 된 교직원","담임","성고충상담원","학교폭력 책임교사","보건교사","전문상담교사","학교장·교감","교육지원청(학교폭력 제로센터·성희롱 성폭력 사안 담당·감사)","임용권자(교육청)"],"summary":"학생(19세 미만)이 피해자인 성범죄(강간·추행·불법촬영 등 아동·청소년대상 성범죄)는 가해자가 학생이든 교직원이든 학교장과 교직원이 직무상 알게 된 즉시 수사기관에 신고해야 하며, 피해자·보호자 의사나 고소 여부와 관계없다(청소년성보호법 제34조제2항). 2026 학교폭력 사안처리 가이드북도 성범죄 관련 사안은 예외 없이 즉시 신고하도록 한다. 범죄에 이르지 않는 성희롱은 이 신고 의무 대상이 아니고 학교폭력·성희롱 사안 절차로 처리한다. 학생 간 사안은 학교폭력 절차(분리 → 보고 → 조사 → 심의위원회 → 조치 → 생기부 → 불복)로, 교직원이 가해한 사안은 즉시 분리·교육(지원)청 보고·성평등가족부 통보(피해자의 명시적 반대가 없을 때) → 사안 조사·고충심의(주체는 시·도마다 다름) → 감사·징계·직위해제 검토 → 재발방지대책으로 이어진다. 전 과정에서 피해 학생의 신원과 사생활을 비밀로 하고 2차 피해를 막는다.","first":["피해 학생의 안전을 먼저 확보한다. 학교폭력 사안으로 인지했다면 법령상 예외가 없는 한 가해자(학생·교직원)와 분리한다","학교장에게 보고하고 성범죄이면 112 또는 117에 즉시 신고한다(피해자·보호자가 원하지 않아도. 117에는 신고 의사를 분명히, SPO 상담은 신고가 아니다)","응급처치가 필요하면 먼저 하고, 증거가 없어지지 않도록 몸을 씻지 말고 가능한 한 빨리 병·의원(해바라기센터)으로 가도록 안내한다. 현장·CCTV를 보존한다","피해 학생을 캐묻지 말고, 책임을 피해 학생에게 돌리지 않는 태도로 안정과 지원을 안내한다","사실을 아는 사람을 최소로 줄이고 관련자에게 비밀유지를 고지한다"],"steps":[{"stage":"알게 됨·신고","when":"인지 즉시","who":"알게 된 교직원","what":"피해 학생 안정·안전 확보, 학교장(관리자)에게 보고","detail":"상담 중·학교폭력 신고 접수 등 직무상 알게 된 경우 모두 해당. 판단·추궁 없이 들어 주고 구체 내용을 반복해서 묻지 않는다(수사 진술 오염 방지). 호기심 질문, 당시 대처에 대한 판단·충고를 하지 않는다.","basis":"청소년성보호법 제34조제2항, 경기도교육청 업무 안내서 상담 시 유의사항"},{"stage":"알게 됨·신고","when":"인지 즉시","who":"학교장·교직원","what":"수사기관 신고","detail":"피해자가 19세 미만(청소년성보호법 제2조제1호)이고 직무상 알게 된 사실이 아동·청소년대상 성범죄(제2조제2호 — 강간·추행, 불법촬영 등 성폭력처벌법 제3조~제15조의 죄 포함)이면 학교의 장과 종사자는 즉시 수사기관에 신고해야 하며, 피해자·보호자 의사나 고소 여부와 관계없다(미신고·거짓신고 300만원 이하 과태료). 2026 학교폭력 가이드북도 성범죄 관련 사안은 예외 없이 즉시 112·117에 신고하도록 하고, 117에는 신고 의사를 명확히 밝히며 SPO를 통한 '상담'은 신고로 볼 수 없다고 안내한다. 경기도교육청 안내서는 긴급하지 않으면 117 또는 관할 경찰서 여성청소년과로 '아동·청소년 대상 성범죄 신고서'를 공문 발송하도록 안내하고, 피해자가 먼저 신고했어도 신고 의무가 남으며, 수사가 개시될 정도로 이미 진행 중이면 제외된다고 안내한다. 교직원 가해 등 아동학대범죄에도 해당하면 아동학대처벌법상 신고 의무(제10조제2항)도 함께 적용된다.","basis":"청소년성보호법 제2조·제34조제2항·제67조제4항, 아동학대처벌법 제10조제2항, 2026 학교폭력 가이드북 16·33·37쪽, 경기도교육청 업무 안내서 29쪽"},{"stage":"초기 대응","when":"인지 즉시","who":"보건교사·담임","what":"응급조치·의료 연계와 증거 보존","detail":"증거가 사라지지 않도록 가능한 한 빨리 의료기관으로 이송하고, 씻지 말고 병·의원(해바라기센터)에 가도록 안내. 보건실 치료 기록 보관, 교내 현장이면 물품 보관·현장 보존, CCTV 확보 후 수사기관에 넘긴다.","basis":"학교폭력 가이드북(성폭력 초기대응), 학교 내 성희롱·성폭력 사안 대응 업무 가이드"},{"stage":"초기 대응","when":"인지 즉시","who":"학교장","what":"가해자와 피해 학생 분리","detail":"학교폭력예방법의 가해자에는 '교사'가 포함된다. 가해 학생은 분리(24시간 안 결정, 최대 7일)·제2호 조치·필요 시 긴급조치. 가해 교직원은 수업 배제, 업무 배제·변경, (임시) 담임 교체, 근무 장소 변경, 동선 분리, 연가 승인 등으로 즉시 분리(복무규정 범위 안).","basis":"학교폭력예방법 제16조제1항, 제17조제4항·제5항"},{"stage":"초기 대응","when":"인지 즉시","who":"학교장·성고충상담원","what":"비밀유지·접촉금지 고지","detail":"업무 담당자와 관련자(목격자·피신고인 포함)에게 비밀유지를 고지하고 서약서를 받는다. 학교장과 관련 교원 외에는 알지 못하게 한다. 사적 접촉·보복·신고 사실 유포는 2차 피해로 조사되며 추가 징계사유·명예훼손이 될 수 있음을 알린다.","basis":"학교폭력예방법 제21조, 성폭력처벌법 제24조, 청소년성보호법 제31조, 성폭력방지법 제5조의4제3항"},{"stage":"초기 대응","when":"인지 후 48시간 이내(2026 학교폭력 가이드북 기준)","who":"책임교사·성고충 업무담당자","what":"교육(지원)청 보고","detail":"학생 간 사안은 학교폭력 사안접수 보고서(양식 1-3)를 인지 후 48시간 이내에 제출한다(가이드북 기준, 법률 조문은 아님). 성폭력 사안 등 긴급·중대 사안은 유선으로 별도 보고한다. 교직원 가해 사안은 경기도교육청 안내서 기준으로 학교폭력 사안접수 보고서와 성희롱·성폭력 사건 발생사실 통보서(가해자 소속기관 제출, 학생 피해 시 인지 후 48시간 이내)를 함께 낸다 — 통보서 양식·제출처는 소속 교육청 기준 확인. 신상은 익명 처리할 수 있다.","basis":"가이드북(양식 1-3), 경기도교육청 업무 안내서"},{"stage":"초기 대응","when":"보고와 함께","who":"학교장","what":"성평등가족부 사건 발생사실 통보(기관 내 성폭력)","detail":"피해자의 명시적 반대가 없으면 지체 없이 통보(성평등가족부 지정 서식).","basis":"성폭력방지법 제5조의4제1항"},{"stage":"초기 대응","when":"초기부터","who":"전문상담교사·담임","what":"피해 학생 심리·의료·법률 지원 연계","detail":"위(Wee)클래스·위센터, 해바라기센터, 성폭력상담소, 1366, 대한법률구조공단(132). 등교가 어려우면 전문기관 상담을 연계하고 학습 결손을 점검한다. 학교폭력 피해학생 보호조치 때문에 결석한 경우 학교폭력예방법 제16조제4항에 따라 학교장이 인정하면 출석일수에 산입할 수 있다. 별도로 성폭력 피해 학생은 성폭력방지법 제7조제2항에 따라 치료·심리상담 등 일상 복귀 조치에 필요한 결석을 학교장이 인정하는 경우 출석일수에 산입할 수 있다. 필요한 경우 학교장은 성폭력 피해 관련 전문가 의견을 들을 수 있다.","basis":"학교폭력예방법 제16조제4항; 성폭력방지법 제7조제2항·같은 법 시행령 제4조제3항"},{"stage":"조사·확인","when":"학생 간 사안","who":"전담조사관 또는 전담기구","what":"학교폭력 절차로 사안조사","detail":"성 사안은 비밀유지·신변보호·2차 피해 방지에 특히 유의. 필요하면 심의위원회 위원장 심의를 거쳐 학교장 명의로 전문기관에 실태조사 의뢰 가능. 조사 결과는 학교폭력제로센터 사례회의(제로센터장·장학사·전담조사관·학교전담경찰관·외부 전문가 등 참여)에서 검토된다.","basis":"학교폭력예방법 제14조제8항, 가이드북"},{"stage":"조사·확인","when":"교직원 가해 사안","who":"학교(피해 학생)·교육(지원)청(가해 교직원)","what":"사실확인 분담","detail":"(경기도교육청 예시 — 조사 주체는 시·도마다 다르니 소속 교육청 기준 확인) 피해 학생 조사는 원칙적으로 학교폭력 전담기구(또는 전담조사관)가 하고, 가해 교직원 조사는 교육지원청의 성희롱·성폭력 사안 담당 조사위원이 한다. 학교는 사안 조사·고충심의 의뢰 공문(신고 및 사실확인 신청서, 민감정보처리 동의서, 비밀유지 서약서 첨부)을 교육지원청에 보낸다.","basis":"경기도교육청 업무 안내서, 학교 내 성희롱·성폭력 사안 대응 업무 가이드"},{"stage":"조사·확인","when":"경기 기준: 공문 접수 후 20일 이내","who":"조사위원(외부 전문가)","what":"교직원 사안 사실확인(조사) — 경기도교육청 예시","detail":"피해자 → 참고인 → 피신고인 순, 대면 문답 원칙(부득이하면 서면·전화·이메일, 자필 서명). 경기 안내서는 정당한 이유나 절차 없이 2회 이상 출석을 거부하면 진술 및 자기 방어권을 포기한 것으로 간주한다고 정한다. 피신고인에게는 진술거부권·보복 금지를 안내. 피해자는 신뢰관계인 동석 가능. 문답서와 증빙은 당사자끼리 열람하지 않게 한다. 조사 완료는 공문 접수 후 20일(근무일) 이내, 필요하면 10일 연장(경기도교육청 기준 — 기한·방식은 시·도마다 다를 수 있음).","basis":"경기도교육청 업무 안내서 조사 단계"},{"stage":"조사·확인","when":"수사 진행 중","who":"학교·보호자","what":"수사 협조와 피해 학생 권리 안내","detail":"19세 미만 피해자는 진술과 조사 과정이 영상녹화되고(피해자·법정대리인이 원치 않으면 제외), 신뢰관계인 동석, 진술조력인 참여, 피해자 변호사 선임을 할 수 있다. 수사와 학교 절차는 별개로 진행된다.","basis":"성폭력처벌법 제27조·제30조·제34조·제36조"},{"stage":"심의·결정","when":"학생 간 사안","who":"교육지원청 학교폭력대책심의위원회","what":"심의위원회 개최(요청 접수 후 21일 이내)와 조치 결정","detail":"대면 원칙, 대기실 분리, 양측 의견진술. 성폭력 사안은 관련 분야 전문가를 회의에 참석시켜 의견을 들을 수 있다(가이드북). 또 피해학생 측이 요청하면 소아청소년과 의사·정신건강의학과 의사·심리학자 등 아동심리 관련 전문가의 의견을 반드시 들어야 한다(법 제13조제5항). 수사 중으로 사실 확인이 어려우면 조치결정을 유보할 수 있다. 가해학생 조치 제1~9호, 피해학생 보호조치 결정, 교육장이 서면 통보.","basis":"학교폭력예방법 제13조·제16조·제17조, 가이드북"},{"stage":"심의·결정","when":"교직원 가해 사안","who":"학교폭력대책심의위원회","what":"피해학생 보호조치 심의","detail":"가해자가 학생이 아니므로 학교장 자체해결 대상이 아니고, 심의위원회는 피해학생 보호조치만 심의한다(피해 측이 보호조치를 원하지 않으면 미개최 동의서로 요청하지 않을 수 있음).","basis":"가이드북 가해자가 학생이 아닌 사안의 처리, 양식 3-7"},{"stage":"심의·결정","when":"조사 종료 후 신속히","who":"성희롱·성폭력 고충심의위원회(경기는 교육지원청에 둠 — 설치 기관은 시·도마다 다름)","what":"성희롱·성폭력 해당 여부 판단과 권고","detail":"비공개·대면 원칙, 재적 과반수 출석·출석 과반수 찬성. 피해자·피신고인은 출석해 진술하거나 서면으로 낼 수 있고, 피해자는 신뢰관계인·법률대리인 동석 가능. 출석 시간·동선 분리, 위원 제척·기피·회피. 심의: 행위별 해당 여부(2차 피해 포함), 피해자 보호·2차 피해 방지 조치 권고, 재발 방지 권고. 수사 중이어도 개최하는 것이 적절하다. 결과는 당사자에게 등기우편, 학교에 공문으로 통보(경기도교육청 기준).","basis":"경기도교육청 업무 안내서 심의 단계"},{"stage":"조치·이행","when":"심의결과 해당 시","who":"교육지원청 감사부서·임용권자","what":"감사 요청과 징계","detail":"고충심의 결과 성희롱·성폭력에 해당하면 감사 요청 공문을 보내고, 결과는 징계 요구 근거로 참고된다. 수사기관이 수사 중이면 수사개시 통보를 받은 날부터 징계 절차를 진행하지 않을 수 있다. 성폭력범죄·아동청소년대상 성범죄·성희롱의 징계 시효는 10년.","basis":"경기도교육청 업무 안내서, 국가공무원법 제83조·제83조의2"},{"stage":"조치·이행","when":"교직원이 수사 대상이 된 경우","who":"임용권자(교육청)","what":"직위해제 검토","detail":"성범죄 등 비위로 수사기관에서 조사·수사 중이고 비위가 중대해 정상 업무를 기대하기 현저히 어려우면 직위를 부여하지 않을 수 있다. 학교는 수사 개시 사실을 교육지원청에 신속히 보고한다.","basis":"국가공무원법 제73조의3제1항제6호"},{"stage":"조치·이행","when":"학생 간 조치 통보 뒤","who":"담임·학교","what":"가해학생 조치 이행·생기부 기재","detail":"'학교폭력 조치상황 관리'란 기재(제1~3호 조건부 기재유보), 부가 특별교육·보호자 특별교육 관리, 3개월 미이행 시 보고. 피해학생 보호조치는 기재하지 않는다.","basis":"초·중등교육법 시행규칙 제21조, 학교폭력예방법 제17조"},{"stage":"조치·이행","when":"모든 단계","who":"학교장·담임·성고충상담원","what":"피해 학생 보호조치 이행과 2차 피해 모니터링","detail":"피해자 보호 조치는 피해자 의사에 반해 시행하지 않는다. 모니터링 목적·방법을 미리 안내하고 일정 기간 후 피해자 의사를 반영해 종결.","basis":"성폭력방지법 제5조의4제2항, 경기도교육청 업무 안내서"},{"stage":"불복·구제","when":"학생 간 조치에 이의","who":"피해·가해학생과 보호자","what":"행정심판·행정소송·집행정지","detail":"행정심판: 안 날 90일·있은 날 180일 안에 소속 시·도교육청 행정심판위원회. 행정소송: 안 날 90일·있은 날 1년 안에 교육장을 피고로. 효력을 멈추려면 집행정지 결정 필요, 결정 전 피해 측 의견 청취 의무, 인용 시 피해 측 분리 요청권.","basis":"학교폭력예방법 제17조의2~제17조의4, 행정심판법 제27조, 행정소송법 제20조"},{"stage":"불복·구제","when":"교직원 사안","who":"당사자","what":"고충심의 결과에는 불복 절차 없음, 징계는 소청심사","detail":"경기도교육청 안내서는 고충심의위원회 결과가 행정처분이 아니어서 이의 제기·재심 절차가 없다고 안내한다(고충심의위원회는 성평등가족부 예방지침에 따른 비법정 기구). 성희롱·성폭력 불인정 시 피해자는 후속 상담, 국가인권위원회 진정, 민사소송, 고소·고발을 할 수 있다. 징계를 받은 교원은 처분을 안 날부터 30일 이내 교원소청심사위원회에 소청심사를 청구할 수 있다(결정 60일, 30일 연장 가능).","basis":"경기도교육청 업무 안내서, 교원지위법 제9조·제10조"},{"stage":"종결·사후","when":"사실을 안 날부터 3개월 이내","who":"학교장","what":"재발방지대책 수립·제출(기관 내 성폭력)","detail":"사건 처리 경과·조치, 예방조치·예방교육 개선, 2차 피해 방지, 그 밖의 재발방지 사항. 피해자 의사, 고충심의 개최 여부, 해당 판단과 관계없이 제출(발생사실 미통보 시에도). 중앙행정기관의 장·시·도지사·시장·군수·구청장·교육감에 의한 사건은 1개월 이내(같은 법 시행령 제2조의3제2항). 제출처: 법률상 성평등가족부장관(경기도교육청 예시는 교육지원청·교육청에도 함께 제출 — 소속 교육청 기준 확인).","basis":"성폭력방지법 제5조의4제1항, 같은 법 시행령 제2조의3제2항, 경기도교육청 업무 안내서"},{"stage":"종결·사후","when":"종결 뒤","who":"학교","what":"문서 보안 관리와 교육","detail":"고충상담일지·진술서 등은 잠금장치가 있는 곳에 별도 보관하고 임의 폐기하지 않는다(경기도교육청 기준 보존기간 10년). 증거자료(USB 등)는 피해자에게 반환. 학생·교직원 성인지 감수성·2차 피해 예방 교육.","basis":"경기도교육청 업무 안내서 종결 단계"},{"stage":"종결·사후","when":"졸업 직전(학생 간)","who":"전담기구","what":"가해학생 조치사항 삭제 심의","detail":"제1~3호 졸업과 동시, 제4~7호 요건 충족 시 졸업 직전 심의로 삭제 가능, 제8호 졸업 4년 후, 제9호 삭제 안 됨.","basis":"초·중등교육법 시행규칙 제22조"}],"deadlines":[{"what":"수사기관 신고","limit":"직무상 알게 된 즉시","basis":"청소년성보호법 제34조제2항"},{"what":"가해자(교사 포함)와 피해학생 분리","limit":"인지 즉시(학생 가해는 24시간 이내 방법 결정, 최대 7일)","basis":"학교폭력예방법 제16조제1항, 가이드북"},{"what":"교육(지원)청 보고","limit":"인지 후 48시간 이내(긴급·중대 사안은 유선 별도 보고) — 2026 학교폭력 가이드북 기준","basis":"가이드북, 경기도교육청 업무 안내서"},{"what":"성평등가족부 발생사실 통보","limit":"지체 없이(피해자의 명시적 반대가 없을 때)","basis":"성폭력방지법 제5조의4제1항"},{"what":"학교폭력 심의위원회 개최(학생 간)","limit":"요청 접수 후 21일 이내(+7일)","basis":"가이드북"},{"what":"교직원 사안 사실확인(조사)","limit":"경기도교육청 예시: 공문 접수 후 20일(근무일) 이내, 10일 연장 가능(시·도마다 다를 수 있음)","basis":"경기도교육청 업무 안내서"},{"what":"재발방지대책 제출","limit":"사실을 안 날부터 3개월 이내(교육감 등 시행령 제2조의3제2항의 기관장에 의한 사건은 1개월)","basis":"성폭력방지법 제5조의4제1항"},{"what":"행정심판 / 행정소송(학교폭력 조치)","limit":"안 날 90일·있은 날 180일 / 안 날 90일·있은 날 1년","basis":"행정심판법 제27조, 행정소송법 제20조"},{"what":"교원 징계 소청심사","limit":"처분을 안 날부터 30일 이내","basis":"교원지위법 제9조"}],"dont":["피해 학생이나 보호자가 원하지 않는다고 신고를 미루거나 SPO 상담으로 대신하지 않는다","사실 확인한다며 피해 학생에게 같은 내용을 반복해서 묻거나 가해자와 대질시키지 않는다","교직원 가해 사안을 학교 안에서 조용히 사과·합의로 끝내려 하지 않는다","피해 학생 이름·반·사진 등 신원을 알 수 있는 정보를 교직원 메신저·회의·학급에 공유하지 않는다","'왜 그 자리에 갔어?' '장난이었을 거야'처럼 피해자를 탓하거나 가해자를 두둔하는 말을 하지 않는다","가해 교직원을 피해 학생과 같은 수업·공간에 그대로 두지 않는다","고충상담일지·진술서를 공용 폴더나 일반 서류함에 두지 않는다"],"contacts":[{"name":"경찰 긴급신고","tel":"112","note":"긴급 상황"},{"name":"학교폭력 신고센터","tel":"117","note":"24시간. 가이드북은 112와 함께 성범죄 수사기관 신고처로 안내(신고 의사를 분명히 밝힌다)"},{"name":"여성긴급전화","tel":"1366","note":"24시간 365일, 해바라기센터·성폭력상담소 연계"},{"name":"청소년 상담","tel":"1388","note":"24시간"},{"name":"대한법률구조공단","tel":"132","note":"무료 법률상담"},{"name":"관할 경찰서 여성청소년과","tel":"","note":"긴급하지 않은 경우 신고서 공문 발송처(경기도교육청 안내서 기준)"},{"name":"관할 교육지원청 학교폭력·성고충 담당","tel":"","note":"48시간 이내 보고, 중대 사안 유선 보고"},{"name":"온라인 행정심판","tel":"","note":"www.simpan.go.kr (학교폭력 조치 불복)"}],"forms":["학교폭력 신고 접수 대장(학교폭력 가이드북 양식 1-1)","가해자와 피해학생 분리 의사 확인서(양식 1-2)","학교폭력 사안 접수 보고서(양식 1-3)","학교폭력대책심의위원회 미개최 동의서(가해자가 학생이 아닌 경우, 양식 3-7)","아동·청소년 대상 성범죄 신고서(경찰서 공문 신고용)","성희롱·성폭력 사건 발생사실 통보서(성평등가족부 지정 서식)","성희롱·성폭력 신고 및 사실확인(조사) 신청서","민감정보처리 동의서","비밀유지 서약서","성희롱·성폭력 고충상담일지","성희롱·성폭력 사건 재발방지대책 보고서(성평등가족부 지정 서식)"],"law":[{"name":"아동·청소년의 성보호에 관한 법률","article":"제34조제2항(아동·청소년대상 성범죄의 신고)","point":"초·중등학교 등 기관의 장과 종사자는 직무상 아동·청소년대상 성범죄 발생 사실을 알게 된 때 즉시 수사기관에 신고해야 함"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제67조제4항제1호(과태료)","point":"직무상 알고도 신고하지 않거나 거짓으로 신고하면 300만원 이하 과태료"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제31조(비밀누설 금지)","point":"누구든지 피해 아동·청소년을 특정할 수 있는 정보를 인쇄물·방송·정보통신망으로 공개 금지, 위반 시 7년 이하 징역 또는 5천만원 이하 벌금"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제24조(피해자의 신원과 사생활 비밀 누설 금지)","point":"수사·재판 관여 공무원의 피해자 인적사항·사생활 누설 금지, 누구든지 동의 없이 피해자 특정 정보 공개 금지"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제21조·제27조·제30조·제34조·제36조","point":"미성년 피해 공소시효는 성년이 된 날부터 진행(13세 미만·장애인 대상 강간·강제추행 등은 공소시효 없음), 피해자 변호사, 19세 미만 진술 영상녹화, 신뢰관계인 동석, 진술조력인"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조제2항, 제63조제1항제2호","point":"직무상 아동학대범죄를 알거나 의심되면 즉시 신고, 정당한 사유 없이 미신고 시 1천만원 이하 과태료"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제2조제1호, 제16조제1항","point":"성폭력은 학교폭력에 포함, 학교장은 인지 시 가해자(교사 포함)와 피해학생을 지체 없이 분리"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제17조의2~제17조의4","point":"학교폭력 조치에 대한 행정심판·행정소송·집행정지"},{"name":"성폭력방지 및 피해자보호 등에 관한 법률","article":"제5조의4(성폭력 사건 발생 시 조치)","point":"기관 내 성폭력 발생 시 피해자 반대가 없으면 성평등가족부에 지체 없이 통보, 3개월(교육감 등 대통령령으로 정한 기관장 사건 1개월) 안에 재발방지대책 제출, 피해자 보호 조치(피해자의 명시적 의사에 반하면 안 됨), 사건처리 관여자 비밀누설 금지"},{"name":"국가공무원법","article":"제73조의3제1항제6호(직위해제)","point":"성범죄 등 비위로 감사원·수사기관에서 조사·수사 중이며 비위가 중대해 정상 업무를 기대하기 현저히 어려운 사람은 직위해제 가능"},{"name":"국가공무원법","article":"제83조·제83조의2","point":"수사 중인 사건은 수사개시 통보일부터 징계 절차를 진행하지 않을 수 있음, 성폭력·성희롱 징계 시효 10년"},{"name":"교원의 지위 향상 및 교육활동 보호를 위한 특별법","article":"제9조·제10조","point":"징계처분에 대한 소청심사는 안 날부터 30일 이내, 심사위원회는 60일 이내 결정(30일 연장 가능)"}],"faq":[{"q":"피해 학생이 '절대 경찰에 알리지 말아 달라'고 부탁했어요.","a":"학교장과 교직원은 직무상 알게 된 아동·청소년(19세 미만) 대상 성범죄를 피해자 의사와 관계없이 즉시 신고해야 합니다(청소년성보호법 제34조제2항, 미신고·거짓신고 300만원 이하 과태료). 2026 학교폭력 가이드북도 피해학생 측 의사와 관계없이 반드시 신고하되, 신고 의무의 당위성을 설명하고 신고 과정에서 피해학생 측 의사를 수사기관에 충분히 전하라고 안내합니다. 범죄에 이르지 않는 성희롱은 이 신고 의무 대상이 아닙니다. 경찰 조사에서는 영상녹화로 반복 진술을 줄이고 신뢰관계인 동석·진술조력인·변호사 선임이 가능하다고 안내하면 도움이 됩니다."},{"q":"SPO(학교전담경찰관)에게 이야기했으면 신고한 것 아닌가요?","a":"아닙니다. 2026 학교폭력 가이드북은 학교전담경찰관(SPO)을 통한 '상담'은 신고로 볼 수 없다고 합니다. 112나 117에 신고 의사를 분명히 밝혀 신고해야 합니다. 가이드북은 117도 112와 함께 수사기관 신고처로 안내합니다(경기도교육청 안내서는 긴급하지 않으면 관할 경찰서 여성청소년과에 신고서를 공문으로 보내는 방법도 안내)."},{"q":"학생끼리 성희롱(성적인 말·장난)도 학교폭력으로 처리하나요?","a":"학생 간 성적 언동이 학교폭력 정의에 해당하면 학교폭력 사안처리 절차를 따릅니다. 형사상 범죄 해당 여부와 청소년성보호법상 법정 즉시 신고 의무는 구체적 행위와 피해자 연령에 따라 확인하고, 해당하는 경우 수사기관 신고 절차를 함께 진행합니다."},{"q":"가해자가 교사예요. 학교폭력대책심의위원회에서 처리하나요?","a":"학교장은 지체 없이 분리하고(학교폭력예방법 제16조제1항의 분리 대상 가해자에 교사 포함), 성범죄이면 수사기관에 신고합니다. 가해자가 학생이 아니므로 학교폭력대책심의위원회는 피해학생 보호조치만 다루고(피해 측이 원하지 않으면 미개최 동의서로 개최를 요청하지 않을 수 있음), 가해 교직원은 교육청의 성희롱·성폭력 조사와 고충심의, 감사·징계로 처리됩니다. 수사 중이라는 이유만으로 자동 직위해제되지는 않고, 성범죄 등 비위로 수사 중이며 비위가 중대해 정상 업무를 기대하기 현저히 어려우면 직위해제될 수 있습니다(국가공무원법 제73조의3제1항제6호)."},{"q":"성고충심의 결과가 마음에 들지 않으면 다툴 수 있나요?","a":"경기도교육청 안내서는 고충심의위원회 결과가 행정처분이 아니어서 이의 제기·재심 절차가 없다고 안내합니다(다른 시·도는 소속 교육청 기준 확인). 성희롱·성폭력이 인정되지 않았다면 피해자는 후속 상담, 국가인권위원회 진정, 민사소송, 고소·고발을 할 수 있습니다. 징계를 받은 교원은 30일 안에 교원소청심사위원회에 소청을 낼 수 있습니다."},{"q":"교직원끼리 공유해야 대응할 수 있지 않나요? 어디까지 알려도 되나요?","a":"학교장과 사안 처리에 필요한 관련 교원 외에는 알지 못하도록 하는 것이 원칙입니다. 학교폭력 업무 관련자의 비밀 누설은 1년 이하 징역 또는 1천만원 이하 벌금(학교폭력예방법 제22조), 피해 학생을 특정할 수 있는 정보 공개는 청소년성보호법 제31조로 처벌될 수 있고, 기관 내 사건처리 관여자는 피해자 의사에 반해 비밀을 누설할 수 없습니다(성폭력방지법 제5조의4제3항)."},{"q":"몇 년 지난 일을 이제 말했어요. 그래도 신고하나요?","a":"네. 아동·청소년대상 성범죄 사실을 직무상 알게 된 때 즉시 신고합니다. 미성년자 피해 성폭력범죄의 공소시효는 피해자가 성년이 된 날부터 진행하고, 13세 미만이나 신체적·정신적 장애가 있는 사람에 대한 강간·강제추행 등은 공소시효를 적용하지 않습니다(성폭력처벌법 제21조). 교직원 가해라면 성폭력범죄·아동청소년대상 성범죄·성희롱의 징계 시효는 10년입니다(국가공무원법 제83조의2)."}],"deep":[{"title":"신고 의무는 누구에게, 어떻게","body":["초·중등학교(위탁 교육기관 포함) 등 법에 열거된 기관의 장과 종사자는 직무상 아동·청소년(19세 미만) 대상 성범죄 발생 사실을 알게 되면 즉시 수사기관에 신고해야 한다. 미신고 또는 거짓 신고 과태료는 300만원 이하이다.","피해자·보호자의 반대나 고소 여부와 관계없다. 2026 학교폭력 가이드북은 117에 신고할 때 신고 의사를 명확히 밝히고, SPO를 통한 '상담'은 신고로 볼 수 없다고 안내한다. 경기도교육청 안내서는 피해자나 보호자가 먼저 신고했어도 의무가 남고 수사가 개시될 정도로 이미 진행 중이면 예외라고 하며, 긴급하지 않으면 117이나 관할 경찰서 여성청소년과로 신고서를 공문 발송하도록 안내한다.","교직원이 학생에게 한 성적 행위는 아동학대(성학대)에도 해당할 수 있어, 이 경우 아동학대처벌법상 신고 의무(미신고 1천만원 이하 과태료)가 함께 적용된다."],"basis":"청소년성보호법 제34조·제67조, 아동학대처벌법 제10조·제63조, 경기도교육청 업무 안내서 수사기관 신고 의무"},{"title":"가해자가 학생이면: 학교폭력 절차","body":["학생 간 행위가 학교폭력 정의에 해당하는 사안은 학교폭력 절차를 적용한다: 접수·사안에 맞는 보호자 통보 → 분리(24시간 안 결정, 최대 7일)와 제2호 → 교육(지원)청 보고(인지 후 48시간, 가이드북 기준) → 전담조사관 조사 → 전담기구 심의 → 심의위원회(요청 후 21일) → 조치 결정(1~9호)·피해 보호조치 → 생기부 → 불복(행정심판 90일/180일, 행정소송 90일/1년, 집행정지). 성희롱·성폭력이라는 이유만으로 모든 행위가 자동으로 학교폭력에 해당하는 것은 아니다.","심의위원회는 성폭력 사안에서 관련 분야 전문가를 회의에 참석시켜 의견을 들을 수 있고, 수사 중으로 사실 확인이 어려우면 기한 안에 열어 조치결정을 유보할 수 있다.","성 사안 조사·심의는 비밀유지·신변보호·2차 피해 방지를 특히 신경 쓴다. 성폭력 등 특수 사안의 실태조사는 심의위원회 위원장 심의를 거쳐 학교장 명의로 전문기관에 의뢰할 수 있다."],"basis":"학교폭력예방법 제13조의2·제14조·제16조·제17조, 2026 학교폭력 사안처리 가이드북"},{"title":"가해자가 교직원이면: 조사와 고충심의","body":["(경기도교육청 안내서 예시 — 조사·심의 주체와 절차는 시·도마다 다르니 소속 교육청 기준 확인) 학교는 상담·신고 접수(고충상담창구), 수사기관 신고, 즉시 분리, 비밀유지 고지, 발생사실 통보서 제출(교육지원청·교육청, 피해자 반대가 없으면 성평등가족부), 사안 조사·고충심의 의뢰 공문 순으로 처리한다. 피해 학생 쪽 사실확인은 학교폭력 전담기구(또는 전담조사관)가, 가해 교직원 조사는 교육지원청 조사위원(외부 전문가)이 한다.","경기 기준으로 조사는 공문 접수 후 20일(근무일) 안에 마치고 필요하면 10일 연장한다. 피해자 → 참고인 → 피신고인 순, 대면 원칙이며 자필 서명한 문답서로 남긴다. 피신고인에게는 진술거부권과 보복·접촉 금지를 알린다. 경기 안내서는 당사자가 정당한 이유나 절차 없이 2회 이상 출석을 거부하면 진술 및 자기 방어권을 포기한 것으로 간주한다.","고충심의위원회는 성희롱·성폭력 해당 여부(2차 피해 포함), 피해자 보호·2차 피해 방지 조치, 재발방지를 권고한다. 비공개·대면, 재적 과반수 출석·출석 과반수 찬성, 당사자는 출석 진술하거나 서면 제출, 피해자는 신뢰관계인·법률대리인 동석이 가능하다. 경기도교육청은 위원장 포함 7명 이상, 외부 전문가 2명 이상, 특정 성별 10분의 6 초과 금지로 구성한다. 경기 안내서는 결과가 행정처분이 아니어서 이의 제기·재심 절차가 없다고 안내한다. 조사·심의 주체와 기한은 시·도마다 다를 수 있다."],"basis":"경기도교육청 학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026) 접수·조사·심의 단계"},{"title":"가해 교직원의 신분 조치: 분리, 직위해제, 징계","body":["학생 피해 사안은 신고 접수와 동시에 가해 교직원을 즉시 분리한다(수업 배제, 업무 배제·변경, 담임 교체, 근무 장소 변경 등). 교직원끼리의 사안과 달리 피신고인 동의가 필요하지 않다.","성범죄 등 비위로 수사기관에서 조사·수사 중이고 비위가 중대해 정상 업무가 현저히 어려우면 임용권자가 직위해제할 수 있다. 고충심의에서 성희롱·성폭력에 해당하면 감사 요청으로 징계 절차가 시작된다. 수사 중인 사건은 수사개시 통보일부터 징계 절차를 멈출 수 있고, 수사기관은 수사 시작·종료 때 10일 안에 소속 기관장에게 통보한다. 성폭력·성희롱 징계 시효는 10년이다.","징계를 받은 교원은 처분을 안 날부터 30일 안에 교원소청심사위원회에 소청심사를 청구할 수 있고, 위원회는 60일(30일 연장 가능) 안에 결정한다."],"basis":"학교폭력예방법 제16조제1항, 국가공무원법 제73조의3·제83조·제83조의2, 교원지위법 제9조·제10조, 경기도교육청 업무 안내서 Q&A"},{"title":"수사·재판 중 피해 학생 보호","body":["19세 미만 피해자의 진술과 조사 과정은 영상녹화해 보존하며, 조사 전에 녹화 사실과 증거 사용 가능성을 설명한다. 피해자나 법정대리인(가해자 쪽이 아닌)이 원치 않으면 녹화하지 않는다. 신뢰관계인 동석, 의사소통을 돕는 진술조력인 참여를 요청할 수 있고, 피해자·법정대리인은 변호사를 선임해 조사 참여·의견 진술·기록 열람을 받을 수 있다.","미성년자 피해 성폭력의 공소시효는 성년이 된 날부터 진행한다. 13세 미만이나 장애가 있는 사람에 대한 강간·강제추행 등은 공소시효가 없다.","학교는 수사와 별개로 분리·보호·학습 지원을 계속한다. 학교폭력 피해학생의 보호조치에 필요한 결석은 학교폭력예방법 제16조제4항에 따라 학교장이 인정하면 출석일수에 산입할 수 있다. 성폭력 피해 학생도 성폭력방지법 제7조제2항에 따라 치료·심리상담 등 일상 복귀를 위한 조치에 필요한 결석을 학교장이 인정하면 출석일수에 포함할 수 있으며, 필요한 경우 학교장은 관련 전문가의 의견을 들을 수 있다(같은 법 시행령 제4조제3항). 학교장은 학교폭력법상 피해학생 보호조치로 성적평가 등에서 불이익을 주지 않도록 노력해야 한다(제16조제5항). 상담·치료 비용은 가해 측 부담이 원칙이며 학교안전공제회 선지급 후 구상할 수 있다(학생 간 학교폭력 사안)."],"basis":"성폭력처벌법 제21조·제27조·제30조·제34조·제36조, 학교폭력예방법 제16조"},{"title":"종결: 재발방지대책과 기록 관리","body":["기관 내 성폭력은 사실을 안 날부터 3개월 안에 재발방지대책(처리 경과·조치, 예방조치·교육 개선, 2차 피해 방지, 기타)을 성평등가족부에 낸다(경기도교육청 예시는 교육지원청·교육청에도 제출). 중앙행정기관의 장·시·도지사·시장·군수·구청장·교육감에 의한 사건은 1개월 안이다(시행령 제2조의3제2항). 피해자 반대로 발생사실을 통보하지 않았어도 제출한다. 경기 안내서는 피해자와 행위자 소속이 다르면 행위자 소속기관이 낸다고 안내한다.","재발방지의 핵심은 조직문화 개선이다. 피해자 보호 조치(공간 분리·부서 전환·심리상담 연계)는 피해자 의사에 반해 하지 않고, 2차 피해 모니터링은 종결 뒤에도 일정 기간 이어간다. 행위자 재발방지 교육과 학생·교직원 성인지 교육을 한다.","상담일지·진술서 등은 법적 증빙이 될 수 있어 잠금장치가 있는 곳에 별도로 두고 임의로 폐기하지 않는다(경기도교육청 기준 보존기간 10년). 증거자료(USB 등)는 피해자에게 돌려준다."],"basis":"성폭력방지법 제5조의4, 같은 법 시행령 제2조의3, 경기도교육청 업무 안내서 종결 단계"}],"tables":[{"title":"가해자 유형별 처리 경로","head":["단계","학생 → 학생","교직원 → 학생"],"rows":[["신고","수사기관 즉시 신고(성범죄, 112·117), 학교폭력 접수","수사기관 즉시 신고(성범죄), 학교폭력 접수, 필요 시 아동학대 신고"],["분리","24시간 안 결정·최대 7일, 제2호 조치, 긴급조치","지체 없이(수업·업무 배제, 담임 교체 등)"],["보고","학교폭력 사안접수 보고(48시간, 가이드북)","학교폭력 사안접수 보고 + 성희롱·성폭력 사건 발생사실 통보서, 성평등가족부 통보(반대 없을 때)"],["조사","전담조사관 또는 전담기구","피해 학생: 전담기구·조사관 / 가해 교직원: 교육(지원)청 조사위원(경기 예시 20일+10일)"],["심의","학교폭력대책심의위원회(가해 조치 1~9호 + 피해 보호조치)","학교폭력 심의위원회(피해 보호조치만) + 성희롱·성폭력 고충심의위원회(해당 여부·권고)"],["조치","교육장 조치, 생기부 기재","감사·징계, 직위해제 가능"],["불복","행정심판(90일/180일)·행정소송(90일/1년)·집행정지","고충심의 결과는 이의·재심 절차 없음(경기 안내서), 징계는 소청심사(30일)"],["종결","졸업 시 생기부 삭제 심의, 관계회복","재발방지대책 3개월(교육감 등 기관장 사건 1개월), 문서 10년 보관(경기 기준)"]],"note":"2026 학교폭력 사안처리 가이드북, 경기도교육청 업무 안내서(2026), 성폭력방지법 제5조의4, 국가공무원법, 교원지위법. 교직원 사안의 조사·고충심의 주체·기한은 경기도교육청 예시이며 시·도마다 다르니 소속 교육청 기준을 확인한다."},{"title":"신고·보고·통보 한눈표","head":["무엇을","어디에","언제","근거"],"rows":[["수사기관 신고","112·117 또는 관할 경찰서 여성청소년과","알게 된 즉시","청소년성보호법 제34조"],["아동학대 신고(교직원 가해 등)","시·도, 시·군·구 또는 수사기관","즉시","아동학대처벌법 제10조"],["학교폭력 사안접수 보고","교육(지원)청","인지 후 48시간 이내(가이드북)","가이드북"],["성희롱·성폭력 사건 발생사실 통보서","교육지원청·교육청","학생 피해 시 48시간 이내(경기 예시)","경기도교육청 업무 안내서"],["발생사실 통보","성평등가족부(성폭력방지과)","지체 없이(피해자 반대 없을 때)","성폭력방지법 제5조의4"],["재발방지대책","성평등가족부(경기 예시: 교육지원청·교육청에도 제출)","안 날부터 3개월(교육감 등 기관장 사건 1개월)","성폭력방지법 제5조의4"]],"note":"48시간 보고는 법 조문이 아닌 2026 학교폭력 사안처리 가이드북(교육부) 기준, 발생사실 통보서 48시간은 경기도교육청 안내서 기준."},{"title":"불복·이의 방법 비교","head":["대상","누가","어디에","기간","비고"],"rows":[["학교폭력 조치(교육장 처분) - 행정심판","피해 측·가해 측","소속 시·도교육청 행정심판위원회","안 날 90일, 있은 날 180일","집행정지 결정 필요, 결정 전 피해 측 의견 청취"],["학교폭력 조치 - 행정소송","원고 학생(법정대리인), 피고 교육장","법원","안 날 90일, 있은 날 1년","행정심판 없이 가능"],["성희롱·성폭력 고충심의 결과","-","-","-","경기 안내서: 행정처분이 아니라 이의·재심 절차 없음. 인권위 진정·민사·고소 가능"],["교원 징계처분","징계받은 교원","교원소청심사위원회","안 날부터 30일","결정 60일(30일 연장)"]],"note":"학교폭력예방법 제17조의2~제17조의4, 행정심판법 제27조, 행정소송법 제20조, 교원지위법 제9조·제10조, 경기도교육청 업무 안내서."}],"record":"학생 간 사안은 학교폭력 심의위원회 조치결정 후 가해학생 조치를 학교생활기록부 '학교폭력 조치상황 관리'란에 기재한다(제1~3호 조건부 기재유보, 학교폭력 사안 항목 참조). 피해 학생 관련 내용은 학생부에 적지 않는다. 교육(지원)청 사안접수 보고는 인지 후 48시간 이내다(2026 학교폭력 가이드북 기준). 경기도교육청 절차에서는 교직원 가해 사안의 학교폭력 사안접수 보고서와 성희롱·성폭력 사건 발생사실 통보서 제출을 함께 안내한다. 보고 문서의 피해자 신상은 익명 처리하고 공문은 비공개로 한다. 기관 내 성폭력은 피해자의 명시적 반대가 없으면 성평등가족부에 지체 없이 통보하고, 안 날부터 3개월 이내에 재발방지대책을 제출한다. 다만 중앙행정기관장·지방자치단체장·교육감 등 대통령령으로 정하는 기관장 등에 의한 사건은 1개월 이내에 제출한다. 상담일지·진술서는 잠금장치가 있는 곳에 별도 보관한다.","sources":[{"title":"학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026.2.1. 기준, 2025.9.1. 이후 접수 사안 적용)","publisher":"경기도교육청(교육부·한국여성정책연구원 2025 「학교 내 성희롱·성폭력 사안 대응 업무 안내서」 참고)","year":2026,"url":"https://www.goe.go.kr/resource/goe/na/bbs_2675/2026/03/bffe0d25-c24a-4f6d-ab15-572e551528b3.pdf"},{"title":"학교 내 성희롱·성폭력 사안 대응 업무 가이드(교육부 2023 가이드 기반 경기 보완판)","publisher":"경기도교육청","year":2025,"url":"https://www.goe.go.kr/resource/old/BBSMSTR_000000030138/BBS_202502281013489530.pdf"},{"title":"2026년도 학교폭력 사안처리 가이드북(일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소(충청북도교육청 게시본)","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/9CA0E6C1-EBB5-5E10-9586-5F16C1E16D8A.pdf"},{"title":"아동·청소년의 성보호에 관한 법률 [시행 2026. 5. 12.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동ㆍ청소년의성보호에관한법률"},{"title":"성폭력범죄의 처벌 등에 관한 특례법 [시행 2025. 10. 1.]","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/성폭력범죄의처벌등에관한특례법"},{"title":"성폭력방지 및 피해자보호 등에 관한 법률 [시행 2026. 9. 11.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/성폭력방지및피해자보호등에관한법률"},{"title":"국가공무원법 [시행 2026. 6. 2.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/국가공무원법"},{"title":"아동학대범죄의 처벌 등에 관한 특례법 [시행 2026. 8. 4.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동학대범죄의처벌등에관한특례법"},{"title":"교원의 지위 향상 및 교육활동 보호를 위한 특별법 [시행 2026. 2. 19.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/교원의지위향상및교육활동보호를위한특별법"},{"title":"성폭력방지 및 피해자보호 등에 관한 법률(2026.7.1. 시행본)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/lsInfoP.do?lsiSeq=285899"},{"title":"성폭력방지 및 피해자보호 등에 관한 법률 시행령(2026.7.1. 시행본)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/lsInfoP.do?ancYnChk=0&chrClsCd=010202&efYd=20260701&lsiSeq=286845&urlMode=lsInfoP"}],"verified":"2026-09-24","uncertain":["교육부·한국여성정책연구원 2025 「학교 내 성희롱·성폭력 사안 대응 업무 안내서」 원문 PDF는 찾지 못해, 이를 참고한 경기도교육청 2026 안내서로 확인함","경기도교육청은 2025.9.1.부터 성고충심의위원회를 교육지원청으로 이관함. 조사 20일(+10일), 고충심의위원회 구성(7명 이상·외부 2명·성별 10분의 6), 문서 보존 10년, '불복 절차 없음'은 경기도교육청 기준이며 다른 시·도교육청의 조사·심의 주체와 기준은 소속 교육청 안내서로 확인해야 함","직위해제·징계 조문은 국공립 교원 기준(국가공무원법). 사립학교 교직원은 사립학교법·정관에 따르며 확인 못 함","경기도교육청 안내서는 재발방지대책 미제출 시 성폭력방지법 제38조 과태료 가능성을 적었으나, 현행 제38조 조문에서 해당 규정을 확인하지 못해 적지 않음","해바라기센터는 지역마다 번호가 달라 적지 않음(1366으로 연계 가능)","교육(지원)청 보고 '48시간 이내'는 법률 조문이 아니라 2026 학교폭력 사안처리 가이드북(교육부) 운영 기준임","해바라기센터 증거채취 안내 페이지(sunflowercenter.or.kr/sub/medical/kit.php)는 2026-09-24 접속 시 내용이 열리지 않아 출처에서 뺌 — 초기 의료 연계는 2026 학교폭력 가이드북 33~34쪽 기준으로 적음"],"related":["school-violence","cyber-deepfake","child-abuse"]},{"id":"cyber-deepfake","title":"사이버폭력·불법촬영·딥페이크","aka":["딥페이크","합성사진","지인능욕","불법촬영","몰카","몰래 찍었어요","사진 유포","단톡방 성희롱","단톡방 괴롭힘","사이버폭력","영상 퍼졌어요","유포 협박","몸캠","성착취물","허위영상물"],"category":"학생 간 사안","urgency":"즉시","roles":["처음 알게 된 교직원","담임","학교폭력 책임교사","전문상담교사","학교장·교감","교육지원청 학교폭력 제로센터·전담조사관","교육지원청 학교폭력대책심의위원회"],"summary":"학생 얼굴·몸을 성적으로 합성한 딥페이크, 성적 수치심을 줄 수 있는 신체를 의사에 반해 찍은 사진·영상, 그 유포·협박·소지·시청은 성폭력처벌법·청소년성보호법상 범죄이면서 학교폭력(사이버폭력)이다. 2026 학교폭력 사안처리 가이드북은 성범죄 관련 사안을 알게 되면 예외 없이, 피해학생 측 의사와 관계없이 즉시 수사기관(112·117)에 신고하도록 하고, 피해자가 19세 미만이면 청소년성보호법 제34조제2항의 법정 신고의무이기도 하다. 가해자가 학생이면 학교폭력 절차(분리 → 보고 → 조사 → 심의위원회 → 조치 → 생기부 → 불복)를 수사와 따로 밟는다. 교사는 영상물을 직접 받거나 보관·전달하지 말고, 증거는 피해 학생·보호자 쪽 원본·URL·캡처로 확보해 경찰과 삭제지원기관에 넘기게 한다.","first":["피해 학생을 안정시키고, 피해 책임을 학생에게 돌리지 않는 태도로 지지한다","학교장에게 보고하고 112 또는 117에 즉시 신고한다(피해 학생·보호자 의사와 관계없이. 117에는 신고 의사를 분명히 밝히고, SPO 상담은 신고로 보지 않는다)","교사는 영상·사진 파일을 받거나 저장·전달하지 않는다. 주소(URL)·계정·대화방 이름·시각 등 비시각적 정황만 기록한다","피해 학생·보호자에게는 원본·URL·캡처·협박 대화를 지우지 말고 보존하게 한다(교사가 대신 받아 두지 않는다. 교사에게 이미 파일이 왔다면 더 열거나 옮기지 말고 수사기관에 처리 방법을 묻는다)","가해 관련 학생과 분리하고, 소문 확산을 막는다(피해자 특정 금지)"],"steps":[{"stage":"알게 됨·신고","when":"인지 즉시","who":"알게 된 교직원","what":"피해 학생을 개별로 만나 안정시키고 학교장·책임교사에게 보고","detail":"궁금한 점을 캐묻지 않는다. 진술이 오염돼 증거 가치가 떨어질 수 있으니 상황만 정리해 전문가에게 넘긴다. 제3자를 통해 알았으면 제보자에게 고맙다고 하고 다른 사람에게 말하지 않도록 당부한다. 학생이 부모에게 알리기를 두려워하면 부모와 함께 대응해야 하는 이유를 설명해 설득한다. 사안을 접수하면 관련 학생 보호자에게 통보한다(다음 단계).","basis":"교육부 디지털 성폭력 SOS 가이드(교사용), 2026 학교폭력 사안처리 가이드북(접수·보호자 통보)"},{"stage":"알게 됨·신고","when":"인지 즉시","who":"학교장(또는 알게 된 교직원)","what":"수사기관 신고","detail":"2026 학교폭력 사안처리 가이드북은 성범죄 관련 사안을 인지하면 예외 없이 즉시 수사기관(112·117)에 신고하고, 피해학생 측 의사와 관계없이 반드시 신고하되 신고 과정에서 피해학생 측 의사를 수사기관에 충분히 전하도록 한다. 법적으로도 피해자가 19세 미만이면 불법촬영·반포(성폭력처벌법 제14조), 허위영상물(제14조의2), 촬영물·편집물 이용 협박·강요(제14조의3), 성착취물 제작·배포·소지(청소년성보호법 제11조) 등은 모두 '아동·청소년대상 성범죄'(청소년성보호법 제2조제2호)여서, 학교의 장과 교직원이 직무상 알게 되면 즉시 신고할 의무가 있다(제34조제2항, 미신고·거짓신고 300만원 이하 과태료). 117에 신고할 때는 신고 의사를 명확하게 밝힌다. 학교전담경찰관(SPO)을 통한 '상담'은 신고로 볼 수 없다. 가해자를 모르거나 학교 밖 사람이어도 신고한다.","basis":"청소년성보호법 제2조제2호, 제34조제2항, 제67조제4항, 2026 학교폭력 사안처리 가이드북 16·33·37쪽(성범죄 즉시 신고)"},{"stage":"알게 됨·신고","when":"신고와 함께","who":"책임교사","what":"학교폭력 사안 접수(신고접수대장)와 보호자 통보","detail":"가해자가 학생이면 사이버폭력으로 학교폭력 절차가 함께 진행된다. 접수에 필요한 최소한의 초기 사실확인과 학생 확인서는 2026 가이드북 절차에 따라 진행하되, 세부 내용을 반복해 캐묻거나 작성을 강요하지 않는다. 즉시 안전·분리·신고에 필요한 내용만 확인하고 상세 조사는 전담조사관·수사기관에 맡긴다. 영상물은 확인서에 첨부하게 하지 않는 것이 안전하다. 접수 사실은 관련 학생 보호자에게 즉시 통보하고 통보 일자·방법을 기록한다(성폭력 사안은 신고접수대장에 익명으로 기재·보관). 다른 학교 학생이 관련되면 그 학교에 공문(비공개)으로 알린다.","basis":"학교폭력예방법 제2조제1호의3, 제20조, 가이드북 양식 1-1·2-1"},{"stage":"초기 대응","when":"인지 후 24시간 이내","who":"학교장","what":"가해 관련 학생 분리와 제2호(접촉·협박·보복 금지) 조치","detail":"분리는 피해학생 의사를 확인해 최대 7일, 학교 안 별도 공간. 제2호는 온라인·휴대전화 연락도 금지한다. 여러 학생이 가담했으면 각각 확인한다.","basis":"학교폭력예방법 제16조제1항, 제17조제4항, 양식 1-2"},{"stage":"초기 대응","when":"인지 후 48시간 이내","who":"책임교사","what":"교육(지원)청 사안접수 보고","detail":"성폭력·중대 사안이므로 유선으로 별도 보고한다. 공문은 비공개로 하고 피해자 인적사항은 최소화하며, 영상·캡처는 첨부하지 않는 것이 안전하다.","basis":"가이드북, 양식 1-3"},{"stage":"초기 대응","when":"필요 시(의결 전까지)","who":"학교장","what":"긴급조치","detail":"피해학생 긴급보호 요청 시 심리상담·일시보호·치료·그 밖의 보호. 가해학생은 긴급하다고 인정되면 제1·3·5·6·7호를 우선 부과, 피해 측 요청 시 전담기구 심의 후 제6·7호. 보복 목적 폭력·피해 측 분리 요청 등은 우선 출석정지·학급교체 사유다. 심의위원회에 즉시 보고하고, 가해학생 조치는 추인을 받는다.","basis":"학교폭력예방법 제16조제1항, 제17조제5항·제6항, 시행령 제21조"},{"stage":"초기 대응","when":"초기","who":"담임·전문상담교사(보호자와 함께)","what":"증거 보존 안내","detail":"교사는 피해물 사진·영상을 요청·수신·저장·전달하지 않는다. 증거는 피해 학생(보호자)이 보존한다: 원본 사진·영상은 지우지 않고 가지고 있어야 신고와 삭제가 원활하고, 원본이 없으면 내려받은 사본이라도 두며 관련 자료는 캡처한다(캡처본은 모니터링·삭제지원에 한계가 있지만 참고자료·증거로 제출 가능). 유포된 사이트 주소(URL)를 저장하고, 협박 대화는 카카오톡·텔레그램 '대화 내보내기' 또는 캡처로 남긴다. 캡처 후에도 가능하면 대화방을 나가지 않고 알림만 끈다. 모르는 사람 메시지는 캡처 후 차단하고, 출처 모를 링크·텔레그램 방에는 들어가지 않는다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"},{"stage":"초기 대응","when":"초기","who":"보호자·피해 학생(학교는 연계)","what":"삭제·차단 지원 신청","detail":"중앙디지털성범죄피해자지원센터(02-735-8994, d4u.stop.or.kr)는 피해자 본인·가족·위임 대리인의 신청을 받는다. 학교는 피해물 파일을 수집하거나 대신 전송하지 말고 피해자·보호자가 센터에 직접 문의해 안전한 자료 제출 방법을 확인하도록 연계한다. 게시 URL은 확보할 수 있으면 전달한다. 원본 또는 URL 등 센터가 안내하는 자료로 삭제·차단·유포 모니터링·채증 지원을 받을 수 있다. 방송미디어통신심의위원회(1377, ARS 3번)도 신고·접속차단을 지원한다. 경찰이 영상물을 이미 확보했으면 따로 첨부하지 않아도 된다. 아동·청소년성착취물은 교육감·교육장이 피해 측 요청 없이도 삭제 지원을 요청할 수 있고, 비용은 가해학생 측이 부담한다.","basis":"성폭력방지법 제7조의3, 학교폭력예방법 제16조의4"},{"stage":"초기 대응","when":"초기","who":"전문상담교사·담임","what":"심리·의료·법률 지원 연계","detail":"위(Wee)클래스·위센터 상담, 1366·1388, 소속 지역 디지털성범죄 피해자 지원기관, 대한법률구조공단(132) 등으로 연계한다. 지역 지원기관의 담당·연락처는 중앙디지털성범죄피해자지원센터나 소속 교육청을 통해 확인한다. 부모에게 알리기를 원치 않으면 부모와 함께 대응해야 하는 이유를 설득하되, 그래도 반대하면 미성년 피해자도 법정대리인 동의 없이 피해 신고·상담이 가능함을 안내한다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"},{"stage":"초기 대응","when":"소문이 퍼진 경우","who":"담임·학교","what":"전체 학생 대상 2차 피해 예방 교육","detail":"피해자가 특정되지 않게 한다. 영상을 보거나 갖고 있거나 다시 보내는 것도 범죄임을 알리고, 받은 파일은 퍼뜨리지 말고 신고하도록 지도한다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용), 성폭력처벌법 제14조제4항·제14조의2제4항"},{"stage":"조사·확인","when":"접수 보고 뒤","who":"학교폭력 전담조사관(또는 전담기구)","what":"학교폭력 사안조사","detail":"학교가 영상물 자체를 수집·열람하지 않는 것이 안전하며, 유포 경위·URL·일시·대화방·가담 범위·협박 여부 등 정황과 진술로 조사한다. 사이버폭력은 명의도용, 폭력성·음란성, 유포 정도, 사이버성폭력 여부를 중점 확인한다. 성 사안은 비밀유지·신변보호·2차 피해 방지에 특히 유의한다.","basis":"가이드북 사안조사 유의사항·중점 파악 요소"},{"stage":"조사·확인","when":"수사 진행 중","who":"학교","what":"수사 협조와 학교 절차 병행","detail":"경찰 조사 때 19세 미만 피해자는 진술이 영상녹화되고, 신뢰관계인 동석·진술조력인·피해자 변호사 선임을 요청할 수 있으며 가명 조사·신변보호도 가능하다고 안내한다. 수사와 학교폭력 절차는 별개로 진행된다.","basis":"성폭력처벌법 제27조·제30조·제34조·제36조, 교육부 SOS 가이드"},{"stage":"조사·확인","when":"조사 완료","who":"조사관(또는 전담기구)","what":"사안조사 보고서 작성, 제로센터 사례회의","detail":"성폭력·언론보도 등 중대 사안은 사례회의에 SPO·외부 전문가가 참석할 수 있고, 중대사안 신고 여부와 보완조사 여부를 정할 수 있다.","basis":"양식 2-4, 가이드북 사례회의"},{"stage":"심의·결정","when":"인지 후 14일 이내","who":"전담기구·학교장","what":"자체해결 여부 심의 → 대부분 심의위원회 개최 요청","detail":"자체해결은 4요건(2주 이상 진단서 없음, 재산 피해 없음, 지속적이지 않음, 보복 아님) 모두 충족 + 피해 측 동의 때만 가능하다. 유포·협박이 이어지거나 보복이면 요건을 충족하지 않는다. 요건이 안 되면 교육지원청에 심의위원회 개최를 요청한다.","basis":"학교폭력예방법 제13조의2, 양식 3-1·3-4"},{"stage":"심의·결정","when":"요청 접수 후 21일 이내","who":"교육지원청 심의위원회","what":"심의위원회 개최와 의견진술","detail":"대면 원칙, 피·가해 측 대기실 분리. 양측 의견진술 기회를 주고, 성폭력·사이버폭력 사안은 관련 분야 전문가를 참석시켜 의견을 들을 수 있다(가이드북). 또 피해학생 측이 요청하면 소아청소년과 의사·정신건강의학과 의사·심리학자 등 아동심리 관련 전문가의 의견을 반드시 들어야 한다(법 제13조제5항). 경찰 수사 중이라 사실 확인이 어려우면 기한 안에 열고 조치결정을 유보할 수 있다.","basis":"학교폭력예방법 제13조제5항, 가이드북 심의방식·심의기간"},{"stage":"심의·결정","when":"심의 의결","who":"심의위원회·교육장","what":"조치 결정과 통보","detail":"판정 점수(심각성·지속성·고의성·반성·화해)로 조치를 정하고, 피해학생이나 신고·고발 학생에 대한 협박·보복이면 제6~9호를 병과·가중할 수 있다. 피해학생에게는 심리상담·치료 등 보호조치, 필요하면 삭제 지원 연계. 교육장은 가해 조치 14일, 피해 보호조치 7일 안에 하고 서면 통보한다.","basis":"학교폭력예방법 제16조·제17조, 가해학생 조치별 적용 세부기준 고시"},{"stage":"조치·이행","when":"통보 접수 즉시","who":"담임·학교","what":"생활기록부 기재와 조치 이행 지도","detail":"'학교폭력 조치상황 관리'란에 입력, 제1~3호는 조건부 기재유보. 부가 특별교육과 보호자 특별교육(불응 시 300만원 이하 과태료) 이수를 관리한다. 통보 후 3개월 안에 미이행하면 명단 보고, 제2호(접촉 금지) 위반은 새 사안으로 접수.","basis":"초·중등교육법 시행규칙 제21조, 학교폭력예방법 제17조제13항·제15항, 제23조"},{"stage":"조치·이행","when":"조치 이행과 함께","who":"담임·상담교사","what":"가해 학생 재발 방지 교육·상담과 비밀 유지","detail":"장난·호기심이었어도 범죄임을 분명히 알게 한다. 가해 학생 보호자에게는 학생보다 먼저 상담하고, 관련 내용이 다른 학생에게 퍼지지 않게 한다. 처분을 다 이수하면 과거 잘못을 계속 지적하지 않는다.","basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"},{"stage":"불복·구제","when":"조치를 안 날부터 90일 안","who":"피해·가해학생과 보호자","what":"행정심판·행정소송·집행정지","detail":"행정심판은 안 날 90일·있은 날 180일 안에 관할 시·도교육청 행정심판위원회에, 행정소송은 안 날 90일·있은 날 1년 안에 교육장을 피고로 법원에 제기할 수 있다. 조치를 멈추려면 집행정지 결정이 필요하고, 결정 전 피해 측 의견을 들어야 한다. 인용되면 피해 측은 분리를 요청할 수 있다.","basis":"학교폭력예방법 제17조의2~제17조의4, 행정심판법 제27조, 행정소송법 제20조"},{"stage":"불복·구제","when":"필요 시","who":"피해 측","what":"손해배상·분쟁조정, 법률지원","detail":"분쟁조정은 심의위원회에 신청(5일 안 개시, 1개월 이내)하되 고소·민사소송을 내면 중지될 수 있다. 가해 측이 불복하면 제로센터를 통해 피해학생 법률자문·소송 지원을 연계할 수 있다.","basis":"학교폭력예방법 제18조, 시행령 제27조·제28조, 가이드북"},{"stage":"종결·사후","when":"종결 뒤","who":"담임·상담교사·보호자","what":"재유포 모니터링과 피해 회복 지원","detail":"디지털성범죄피해자지원센터 모니터링을 이어가고, 재유포나 2차 피해가 있으면 다시 신고한다. 관계회복은 피해 측이 원하고 준비됐을 때만 한다.","basis":"교육부 SOS 가이드, 경기도교육청 업무 안내서"},{"stage":"종결·사후","when":"졸업 직전","who":"전담기구","what":"생기부 조치사항 삭제 심의","detail":"제1~3호는 졸업과 동시 삭제, 제4~7호는 요건(다른 사안 조치 없음, 조치결정일부터 졸업학년도 2월 말까지 6개월 경과)을 갖추면 졸업 직전 심의로 삭제 가능, 제8호는 졸업 4년 후, 제9호는 삭제 안 됨.","basis":"초·중등교육법 시행규칙 제22조, 학교생활기록 작성 및 관리지침 제18조"}],"deadlines":[{"what":"수사기관 신고(학생 피해 성범죄)","limit":"알게 된 즉시","basis":"청소년성보호법 제34조제2항"},{"what":"가해자-피해학생 분리","limit":"인지 후 24시간 이내 결정, 최대 7일","basis":"학교폭력예방법 제16조제1항, 가이드북"},{"what":"교육(지원)청 사안접수 보고","limit":"인지 후 48시간 이내(성폭력 등 중대 사안은 유선으로 별도 보고)","basis":"가이드북(양식 1-3)"},{"what":"자체해결 결정 또는 심의위원회 요청","limit":"인지 후 14일 이내(+7일)","basis":"가이드북"},{"what":"심의위원회 개최","limit":"요청 접수 후 21일 이내(+7일)","basis":"가이드북"},{"what":"교육장 조치","limit":"가해 14일, 피해 보호조치 7일 이내","basis":"학교폭력예방법 제17조제9항, 제16조제3항"},{"what":"행정심판 / 행정소송","limit":"안 날 90일·있은 날 180일 / 안 날 90일·있은 날 1년","basis":"행정심판법 제27조, 행정소송법 제20조"},{"what":"삭제지원","limit":"영상물 원본이나 URL이 있으면 3년간 지원(연장 가능)","basis":"경기도교육청 학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026)"}],"dont":["교사 휴대폰으로 영상·사진을 받거나 내려받아 보관하지 않는다(소지·저장·시청도 처벌 대상)","확인하려고 동료·관리자·보호자에게 영상을 전달하거나 보여주지 않는다(제공·전시도 '반포등'에 해당)","피해 학생에게 '왜 그런 사진을 찍었어/보냈어?'처럼 탓하거나 '보여주면 피해인지 알려줄게'처럼 피해물을 보여 달라고 하지 않는다","증거를 확보하기 전에 먼저 삭제부터 하라고 하지 않는다","피해자 신원이 드러나는 방식으로 학급 전체에 공지하거나 캡처를 돌리지 않는다","출처 모를 링크나 텔레그램 방에 들어가 직접 찾아보지 않는다","보고 공문·조사 기록에 영상 파일이나 캡처 이미지를 첨부하지 않는다"],"contacts":[{"name":"경찰 긴급신고","tel":"112","note":"사이버범죄 신고시스템 ecrm.police.go.kr"},{"name":"학교폭력 신고센터","tel":"117","note":"24시간, 디지털 성폭력 지원기관 연결"},{"name":"디지털성범죄피해자지원센터(중앙)","tel":"02-735-8994","note":"365일, 삭제지원·유포 모니터링, 온라인 d4u.stop.or.kr"},{"name":"방송미디어통신심의위원회 디지털성범죄 신고","tel":"1377","note":"ARS 3번, 신고·삭제·접속차단"},{"name":"여성긴급전화","tel":"1366","note":"24시간 365일"},{"name":"청소년 상담","tel":"1388","note":"24시간 365일"},{"name":"대한법률구조공단","tel":"132","note":"무료 법률상담"},{"name":"온라인 행정심판","tel":"","note":"www.simpan.go.kr"}],"forms":["학교폭력 신고 접수 대장(가이드북 양식 1-1)","가해자와 피해학생 분리 의사 확인서(양식 1-2)","학교폭력 사안 접수 보고서(양식 1-3)","학생 작성 확인서(양식 2-1)","(피해·가해학생) 긴급조치 보고서(양식 2-3)","학교폭력 사안조사 보고서(양식 2-4)","학교폭력대책심의위원회 개최 요청서(양식 3-4)","집행정지 결정에 따른 분리 요청서(양식 4-5)","디지털성범죄피해자지원센터 삭제지원 신청서(피해자 본인 확인 서류 포함)"],"law":[{"name":"학교폭력예방 및 대책에 관한 법률","article":"제2조제1호의3(사이버폭력)","point":"정보통신망을 이용한 따돌림, 학생의 얼굴·신체·음성을 성적으로 편집·합성한 딥페이크 영상 등의 제작·반포 등을 사이버폭력으로 정의"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제16조의4(사이버폭력의 피해자 지원)","point":"국가가 유포된 촬영물등 삭제를 지원, 피해학생·보호자·대리인이 요청. 아동·청소년성착취물은 교육감·교육장이 요청 없이도 삭제지원 요청 가능. 비용은 가해학생·보호자 부담"},{"name":"학교폭력예방 및 대책에 관한 법률","article":"제17조의2~제17조의4","point":"조치에 대한 행정심판·행정소송, 집행정지 전 피해 측 의견 청취, 인용 시 분리 요청권"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조(카메라 등을 이용한 촬영)","point":"의사에 반한 촬영·반포 7년 이하 징역 또는 5천만원 이하 벌금, 영리 목적 정보통신망 반포 3년 이상 유기징역, 소지·구입·저장·시청 3년 이하 징역 또는 3천만원 이하 벌금"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조의2(허위영상물 등의 반포등)","point":"2024.10.16. 개정: 반포 목적 없이 편집·합성만 해도 7년 이하 징역 또는 5천만원 이하 벌금, 소지·구입·저장·시청 3년 이하 징역 또는 3천만원 이하 벌금(제4항 신설)"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제14조의3(촬영물과 편집물 등을 이용한 협박·강요)","point":"협박 1년 이상 유기징역, 강요 3년 이상 유기징역"},{"name":"성폭력범죄의 처벌 등에 관한 특례법","article":"제21조·제30조·제34조·제36조","point":"미성년자 피해 성폭력의 공소시효는 성년이 된 날부터 진행, 19세 미만 피해자 진술 영상녹화, 신뢰관계인 동석, 진술조력인"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제11조(아동·청소년성착취물의 제작·배포 등)","point":"제작 무기 또는 5년 이상, 배포·제공 3년 이상 유기징역, 구입·소지·시청 1년 이상 유기징역(제5항)"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제11조의2(성착취물을 이용한 협박·강요)","point":"2024.10.16. 신설: 협박 3년 이상, 강요 5년 이상 유기징역"},{"name":"아동·청소년의 성보호에 관한 법률","article":"제34조제2항, 제67조제4항","point":"학교의 장과 종사자는 직무상 알게 된 아동·청소년대상 성범죄를 즉시 수사기관에 신고, 미신고·거짓신고 시 300만원 이하 과태료"},{"name":"성폭력방지 및 피해자보호 등에 관한 법률","article":"제7조의3","point":"불법촬영물·허위영상물·성착취물과 피해자 신상정보 삭제 지원, 피해자·가족·대리인 요청, 성착취물은 요청 없이도 삭제 지원, 비용은 행위자 부담"},{"name":"정보통신망 이용촉진 및 정보보호 등에 관한 법률","article":"제44조의2(정보의 삭제요청 등)","point":"권리 침해 정보는 서비스 제공자에게 삭제 요청 가능, 침해 판단이 어렵거나 다툼이 예상되면 사업자가 30일 이내 임시조치를 할 수 있음"},{"name":"형법·소년법","article":"형법 제9조, 소년법 제4조","point":"14세 미만은 형벌 대상이 아니지만 10세 이상 14세 미만의 형벌법령 저촉 행위는 소년부 보호사건"}],"faq":[{"q":"증거로 남겨야 하니 교사가 영상을 받아서 저장해 두면 안 되나요?","a":"하지 않는 것이 안전합니다. 현행법은 불법촬영물·허위영상물의 소지·구입·저장·시청(성폭력처벌법 제14조제4항, 제14조의2제4항)과 아동·청소년성착취물의 소지·시청(청소년성보호법 제11조제5항)을 처벌하고, 증거 보관에 대한 교사 예외 규정은 없습니다. 교육부 SOS 가이드도 증거는 피해 학생·보호자가 원본을 지우지 않고 보관하고 URL·캡처·대화 내보내기로 확보해 경찰과 삭제지원기관에 넘기도록 안내합니다. 교사는 게시 위치·시간·대화방 이름 같은 정황만 기록하세요."},{"q":"피해 학생이 '경찰은 싫다, 부모님께도 알리지 말아 달라'고 해요.","a":"학교의 장과 종사자의 법정 즉시 신고 의무는 피해자가 청소년성보호법상 아동·청소년이고, 직무상 알게 된 사실이 같은 법이 정한 아동·청소년대상 성범죄인 경우에 적용됩니다(제34조제2항). 피해자가 19세 미만이면 불법촬영·딥페이크(허위영상물)·유포·협박은 모두 이 범위(성폭력처벌법 제3조~제15조의 죄 등)에 들어갑니다. 2026 가이드북도 피해학생 측 의사와 관계없이 반드시 신고하도록 하고, 신고 의무의 당위성을 피해학생 측에 설명하며 신고 과정에서 피해학생 측 의사를 수사기관에 충분히 전하라고 안내합니다. 부모에게 알리는 것이 왜 필요한지도 설득합니다. 미신고·거짓신고는 300만원 이하 과태료입니다(제67조제4항)."},{"q":"딥페이크를 만든 학생이 '올리지 않고 혼자만 갖고 있었다'고 해요.","a":"2024.10.16. 개정으로 반포 목적이 없어도 의사에 반해 성적으로 편집·합성하면 7년 이하 징역 또는 5천만원 이하 벌금이고, 소지·저장·시청만 해도 3년 이하 징역 또는 3천만원 이하 벌금입니다(성폭력처벌법 제14조의2). 학교폭력예방법상 사이버폭력에도 해당합니다."},{"q":"가해 학생이 중1(만 13세)이면 처벌이 안 되나요?","a":"14세가 되지 않은 사람은 형벌을 받지 않지만(형법 제9조), 10세 이상 14세 미만이 형벌 법령에 저촉되는 행위를 하면 소년부 보호사건으로 심리됩니다(소년법 제4조). 학교폭력 절차(심의위원회 조치, 생기부 기재)는 나이와 관계없이 그대로 진행됩니다."},{"q":"삭제는 누가 신청하나요? 학교가 대신 할 수 있나요?","a":"디지털성범죄피해자지원센터 삭제지원은 피해자 본인, 가족(배우자·직계친족·형제자매), 피해자가 지정한 대리인이 원본이나 URL을 붙여 신청합니다. 학교는 연계와 안내를 돕고, 교육감·교육장은 아동·청소년성착취물에 대해 피해 측 요청 없이도 국가에 삭제 지원을 요청할 수 있습니다(학교폭력예방법 제16조의4제3항)."},{"q":"경찰 수사 결과가 나올 때까지 심의위원회를 미루나요?","a":"기한(요청 후 21일, 7일 연장)은 지켜서 열고, 수사 중이라 사실 확인이 어렵다면 심의위원회가 조치결정을 유보하는 의결을 할 수 있습니다. 유보 사실과 사유는 양측에 서면 통보하고, 추가조사 후 다시 열어 결정합니다. 그동안에도 학교장의 분리·긴급조치와 피해 보호는 계속됩니다."},{"q":"다른 학생들이 영상을 돌려 봤다고 해요. 그 학생들도 문제가 되나요?","a":"다시 보내거나 보여주는 것은 반포(유포)에, 받아서 갖고 있거나 보는 것은 소지·시청에 해당할 수 있어 처벌 대상입니다. 가담 정도에 따라 학교폭력 관련 학생으로 조사될 수도 있습니다. 피해자가 특정되지 않게 전체 학생에게 2차 피해 예방 교육을 하고, 받은 파일은 퍼뜨리지 말고 신고하도록 지도합니다."}],"deep":[{"title":"증거는 이렇게 남긴다(교사는 영상을 만지지 않는다)","body":["증거의 주인은 피해 학생과 보호자다. 사진·영상 원본은 지우지 않고 가지고 있어야 신고와 삭제가 원활하다. 원본이 없으면 내려받은 사본이라도 남기고, 관련 자료는 모두 캡처한다. 캡처본은 모니터링·삭제 지원에는 한계가 있지만 참고자료와 증거로 쓸 수 있다.","협박 대화는 카카오톡·텔레그램 '대화 내보내기'로 저장하고, 기능이 없으면 화면 캡처한다. 캡처 뒤에도 가능하면 방을 나가지 않고 알림만 끈다. 유포된 사이트 주소(URL)를 저장한다. 모르는 사람의 메시지는 캡처 후 차단하고, 출처 모를 링크나 텔레그램 방은 누르지 않는다.","교사는 게시 위치·시간·계정·대화방 이름·가담 학생 등 피해물이 포함되지 않은 정황만 기록한다. 학생·보호자에게 영상 파일을 보내 달라고 요구하거나 이를 수신·시청·보관·전달하지 않는다. 조사기록·공문에 피해물을 첨부하지 말고, 증거 제출 방식은 수사기관과 소속 교육청의 보안 절차를 따른다."],"basis":"교육부 디지털 성폭력 SOS 가이드(교사용), 성폭력처벌법 제14조·제14조의2, 청소년성보호법 제11조"},{"title":"삭제·차단 지원은 이렇게 받는다","body":["디지털성범죄피해자지원센터(중앙, 02-735-8994, d4u.stop.or.kr)는 365일 피해상담, 긴급삭제(유포 후), 유포현황 모니터링(유포 전·불확실), 수사과정 모니터링, 증거 작성, 의료·심리·법률 지원 연계를 한다. 피해자 본인, 가족, 위임 대리인이 원본이나 URL을 붙여 신청한다(피해자 본인 확인 필요).","경찰이 수사 중 영상물을 확보했으면 따로 첨부하지 않아도 된다. 아동·청소년성착취물은 국가와 지방자치단체가 요청 없이도 삭제를 지원하고, 교육감·교육장도 피해 측 요청 없이 삭제 지원을 요청할 수 있다. 삭제 비용은 가해 행위자(학교폭력의 경우 가해학생·보호자)가 부담하고 국가가 낸 비용은 구상한다.","방송미디어통신심의위원회(1377, ARS 3번)는 신고·심의 후 접속차단과 사업자 삭제 시정을 한다. 일반 사이버폭력 게시물(명예훼손·사생활 침해)은 피해자가 서비스 제공자에게 삭제를 요청할 수 있고, 권리 침해 판단이 어렵거나 다툼이 예상되면 사업자가 30일 이내의 임시조치(접근 임시 차단)를 할 수 있다."],"basis":"성폭력방지법 제7조의3, 학교폭력예방법 제16조의4, 정보통신망법 제44조의2, 교육부 SOS 가이드, 경기도교육청 업무 안내서"},{"title":"수사와 학교폭력 절차는 따로, 동시에 간다","body":["학교의 수사기관 신고와 학교폭력 사안처리는 별개다. 수사가 진행돼도 학교는 분리·제2호·긴급조치와 조사, 심의위원회 요청을 계속한다. 심의위원회는 기한 안에 열되 사실 확인이 어려우면 조치결정을 유보할 수 있다.","경찰 조사에서 19세 미만 피해자의 진술과 조사 과정은 영상녹화되고(피해자·법정대리인이 원치 않으면 제외), 신뢰관계인 동석, 진술조력인 참여, 피해자 변호사 선임, 가명 조사, 신변보호를 요청할 수 있다. 경찰 신고 시 피해 영상물은 철저히 보안이 유지된다(SOS 가이드).","미성년자가 피해자인 성폭력범죄의 공소시효는 피해자가 성년이 된 날부터 진행한다. 가해자가 14세 미만이면 형벌은 받지 않지만 10세 이상이면 소년부 보호사건이 될 수 있다."],"basis":"성폭력처벌법 제21조·제27조·제30조·제34조·제36조, 형법 제9조, 소년법 제4조, 가이드북, 경기도교육청 업무 안내서"},{"title":"학교폭력 조치와 생활기록부, 불복","body":["심의위원회는 심각성·지속성·고의성·반성·화해 점수로 조치를 정하며, 피해학생이나 신고학생에 대한 협박·보복이면 제6~9호를 병과하거나 가중할 수 있다. 제2~4호·제6~8호에는 부가 특별교육이 붙고 보호자도 특별교육을 받아야 한다(불응 시 300만원 이하 과태료).","조치는 '학교폭력 조치상황 관리'란에 기재되고(제1~3호는 조건부 기재유보), 삭제는 제1~3호 졸업과 동시, 제4·5호 졸업 2년 후, 제6·7호 졸업 4년 후(제4~7호는 졸업 직전 전담기구 심의로 졸업과 동시 삭제 가능), 제8호 졸업 4년 후, 제9호 삭제 불가다(2024.3.1. 이후 신고 사안 기준). 2026학년도 대입부터 학교폭력 조치사항은 학생부(교과/종합)·수능·논술·실기/실적 위주전형에 필수 반영되며, 반영 방법은 대학이 정해 안내한다.","피해·가해 측 모두 행정심판(안 날 90일·있은 날 180일, 교육청 행정심판위원회)과 행정소송(안 날 90일·있은 날 1년, 피고 교육장)을 낼 수 있고, 효력을 멈추려면 집행정지 결정이 필요하다. 집행정지 전 피해 측 의견 청취가 의무이고, 인용되면 피해 측이 분리를 요청할 수 있다. 자세한 내용은 학교폭력 항목을 따른다."],"basis":"학교폭력예방법 제17조·제17조의2~제17조의4·제23조, 초·중등교육법 시행규칙 제22조, 가해학생 조치별 적용 세부기준 고시, 한국대학교육협의회 2026학년도 대학입학전형기본사항 보도자료(2023.8.30.)"},{"title":"2차 피해를 막는 말과 행동","body":["피해자를 탓하거나 비난하지 않고 안전과 지원을 우선한다. 피해물 파일을 보여 달라고 요구하지 않으며, 사실 확인과 증거 수집은 수사기관 등 담당 기관의 절차를 따른다."],"basis":"교육부 디지털 성폭력 SOS 가이드(교사용)"}],"tables":[{"title":"행위별 처벌(2024.10.16. 개정 반영)","head":["행위","대상","법정형","근거"],"rows":[["의사에 반한 신체 촬영","누구나","7년 이하 징역 또는 5천만원 이하 벌금","성폭력처벌법 제14조제1항"],["촬영물 반포·판매·제공·전시(동의 촬영물의 사후 유포 포함)","누구나","7년 이하 징역 또는 5천만원 이하 벌금","성폭력처벌법 제14조제2항"],["불법촬영물 소지·구입·저장·시청","누구나","3년 이하 징역 또는 3천만원 이하 벌금","성폭력처벌법 제14조제4항"],["딥페이크(허위영상물) 편집·합성","누구나","7년 이하 징역 또는 5천만원 이하 벌금(반포 목적 요건 없음)","성폭력처벌법 제14조의2제1항"],["허위영상물 반포등","누구나","7년 이하 징역 또는 5천만원 이하 벌금","성폭력처벌법 제14조의2제2항"],["허위영상물 소지·구입·저장·시청","누구나","3년 이하 징역 또는 3천만원 이하 벌금","성폭력처벌법 제14조의2제4항"],["촬영물·편집물 이용 협박 / 강요","누구나","1년 이상 유기징역 / 3년 이상 유기징역","성폭력처벌법 제14조의3"],["아동·청소년성착취물 제작","아동·청소년","무기 또는 5년 이상 징역","청소년성보호법 제11조제1항"],["성착취물 배포·제공","아동·청소년","3년 이상 유기징역","청소년성보호법 제11조제3항"],["성착취물 구입·소지·시청","아동·청소년","1년 이상 유기징역","청소년성보호법 제11조제5항"],["성착취물 이용 협박 / 강요","아동·청소년","3년 이상 / 5년 이상 유기징역","청소년성보호법 제11조의2"]],"note":"국가법령정보센터 현행 조문(성폭력처벌법 시행 2025.10.1., 청소년성보호법 시행 2026.5.12.). 딥페이크가 아동·청소년성착취물에 해당하는지는 수사기관·법원이 판단한다."},{"title":"신고·삭제 기관 비교","head":["기관","전화·누리집","하는 일","누가 신청"],"rows":[["경찰","112, ecrm.police.go.kr","수사, 가해자 특정, 영상물 확보, 신변보호","학교(신고 의무), 피해자·보호자"],["학교폭력 신고센터","117","신고 접수, 디지털 성폭력 지원기관 연결(학생 사안은 117 신고도 수사기관 신고로 볼 수 있음 — 신고 의사를 명확히 밝힘)","누구나"],["디지털성범죄피해자지원센터","02-735-8994, d4u.stop.or.kr","삭제지원, 유포 모니터링, 채증, 수사·법률·의료 연계","피해자 본인·가족·위임 대리인(원본 또는 URL)"],["방송미디어통신심의위원회","1377(ARS 3번)","디지털성범죄 신고, 심의 후 접속차단·삭제 시정","피해자 등"],["소속 지역 디지털성범죄 피해자 지원기관","지역별 연락처 확인","피해상담, 삭제지원 연계, 수사기관·법원 동행","피해자"],["교육감·교육장","관할 교육청","아동·청소년성착취물 삭제지원 요청(피해 측 요청 없이도)","직권"]],"note":"교육부 디지털 성폭력 SOS 가이드(2025.1.), 경기도교육청 업무 안내서(2026), 학교폭력예방법 제16조의4. 경기도교육청 2026 안내서는 방송미디어통신심의위원회 상담 1377(ARS 3번)을 안내한다."},{"title":"불복 방법 요약","head":["구분","누가","어디에","기간","효력 정지"],"rows":[["행정심판","피해 측(보호조치·가해조치), 가해 측(가해조치)","관할 시·도교육청 행정심판위원회, 서면 또는 www.simpan.go.kr","안 날 90일, 있은 날 180일","위원회 집행정지 결정 필요"],["행정소송","원고 학생(법정대리인), 피고 교육장","법원","안 날 90일, 있은 날 1년","법원 집행정지 결정 필요"],["분쟁조정","피해·가해 측 누구든","심의위원회(또는 교육감)","5일 안 개시, 1개월 이내","-"]],"note":"학교폭력예방법 제17조의2~제17조의4·제18조, 행정심판법 제27조·제30조, 행정소송법 제20조·제23조."}],"record":"가해자가 학생이면 학교폭력 절차에 따라 심의위원회 조치결정 후 가해학생 조치사항을 학교생활기록부 '학교폭력 조치상황 관리'란에 기재한다(제1~3호 조건부 기재유보, 피해학생 보호조치·부가 특별교육은 기재 안 함, 세부는 학교폭력 사안 항목). 교육(지원)청 사안접수 보고는 48시간 이내, 성 사안은 유선으로 별도 보고한다. 보고 공문·조사 기록에 영상물 파일이나 캡처 이미지는 첨부하지 않는 것이 안전하고, 피해자 신상정보는 최소화하며 공문은 비공개로 설정한다.","sources":[{"title":"디지털 성폭력 SOS 가이드(교사용)","publisher":"교육부 양성평등정책담당관","year":2025,"url":"https://www.moe.go.kr/boardCnts/viewRenew.do?boardID=316&boardSeq=103235&lev=0&searchType=null&statusYN=W&page=1&s=moe&m=0302&opType=N"},{"title":"2026년도 학교폭력 사안처리 가이드북(일부개정)","publisher":"교육부·이화여자대학교 학교폭력예방연구소(충청북도교육청 게시본)","year":2026,"url":"https://www.cbe.go.kr/upload/dept-21/na/bbs_1661/2026/03/9CA0E6C1-EBB5-5E10-9586-5F16C1E16D8A.pdf"},{"title":"학교 내 성희롱·성폭력 사안 처리 업무 안내서(2026.2.1. 기준, 디지털 성폭력의 대응과 지원)","publisher":"경기도교육청","year":2026,"url":"https://www.goe.go.kr/resource/goe/na/bbs_2675/2026/03/bffe0d25-c24a-4f6d-ab15-572e551528b3.pdf"},{"title":"성폭력범죄의 처벌 등에 관한 특례법 [시행 2025. 10. 1.]","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/성폭력범죄의처벌등에관한특례법"},{"title":"아동·청소년의 성보호에 관한 법률 [시행 2026. 5. 12.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동ㆍ청소년의성보호에관한법률"},{"title":"성폭력방지 및 피해자보호 등에 관한 법률 [시행 2026. 9. 11.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/성폭력방지및피해자보호등에관한법률"},{"title":"학교폭력예방 및 대책에 관한 법률 [시행 2026. 6. 2.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/학교폭력예방및대책에관한법률"},{"title":"정보통신망 이용촉진 및 정보보호 등에 관한 법률 [시행 2026. 9. 11.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/정보통신망이용촉진및정보보호등에관한법률"},{"title":"형법 [시행 2026. 9. 13.], 소년법 [시행 2021. 4. 21.]","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/소년법"},{"title":"학교 허위합성물(딥페이크) 대응 긴급 브리핑","publisher":"교육부(대한민국 정책브리핑)","year":2024,"url":"https://www.korea.kr/briefing/policyBriefingView.do?newsId=156647740"},{"title":"2026학년도 대학입학전형기본사항 발표(보도자료)","publisher":"한국대학교육협의회","year":2023,"url":"https://www.kcue.or.kr/news/sub02/sub01.php?at=view&idx=24138"},{"title":"중앙디지털성범죄피해자지원센터 자주 묻는 질문(삭제지원 기간)","publisher":"중앙디지털성범죄피해자지원센터","year":2026,"url":"https://d4u.stop.or.kr/faq/questions"}],"verified":"2026-09-24","uncertain":["교사의 피해물 수신·보관 금지와 보고서 첨부 금지는 피해자 보호를 위한 안전 절차로 안내한다. 구체적인 증거 제출·보존 방식은 수사기관과 소속 교육청의 지침을 따르며, 불법촬영물·성착취물 해당 여부와 개별 소지 행위의 법적 평가는 수사기관·법원이 판단한다.","지역별 디지털성범죄 피해자 지원기관의 지정·연락처는 바뀔 수 있으므로 중앙 지원기관 또는 소속 교육청에서 확인한다","교육청별 딥페이크 사안 보고 서식·담당 부서는 소속 교육청 지침에서 확인한다","학교 딥페이크 사안에서 특정 영상이 '아동·청소년성착취물'인지 '허위영상물'인지는 수사기관·법원 판단 사항이라 교사용 안내에서 단정하지 않음","교육부 SOS 가이드는 2024년 12월 인쇄·2025년 1월 발행(게시 2025.4.)임","피해자지원센터는 신청 시 원본 또는 URL 등 자료를 안내하지만, 학교 교직원이 성착취물 파일을 직접 수집·열람·전송하라는 뜻은 아니다. 피해자·보호자가 센터·수사기관에 직접 안전한 제출 방법을 확인하도록 한다.","보호자가 가해 관련자이거나 보호자 통보가 학생 안전을 위협할 우려가 있을 때의 통보 대상·시점 조정은 가이드북·SOS 가이드에서 해당 문장을 찾지 못함 — 원문 확인 필요(소속 교육청·수사기관과 협의)"],"quickFacts":[],"related":["school-violence","sexual-violence","student-photo-sns"]},{"id":"safety-accident","title":"교내 안전사고(부상)","aka":["체육시간 부상","다쳤어요","넘어졌어요","골절","머리 부딪힘","뼈 부러짐","발목 접질림","쓰러졌어요","학교안전공제","안전공제회 청구","치료비 청구","사고통지","공제급여","학교에서 다침","치아 부러짐"],"category":"안전·보건","urgency":"즉시","roles":["최초 발견 교사(수업 교사)","보건교사","담임","교감","학교장","행정실(공제 담당)","보호자"],"summary":"수업·쉬는 시간·등하교·체험학습 등 교육활동 중 학생이 다치면 ‘학교안전사고’다(학교안전법 제2조). 순서는 ①생명 확인·119·응급처치 ②보호자 연락·병원 ③기록·학교장 보고 ④학교안전공제회 사고통지(학교장, 지체 없이) ⑤보호자에게 공제 청구 안내 ⑥보호자 청구(3년 시효) ⑦공제회 결정(14일) ⑧불복 시 심사청구(90일)→재심사청구(90일)→소송. 안전사고관리 지침에 따라 학생 안전조치 의무를 다한 경우 학교장·교직원·보조인력은 제10조제5항의 면책 대상이다. 민사 면책은 2025.12.2. 이후 사고에 적용된다.","first":["다친 학생 곁을 떠나지 말고 의식·호흡부터 본다 — 반응 없고 숨이 이상하면 즉시 119, 가슴압박, AED","머리·목·허리를 다쳤거나 의식이 흐리면 일으키거나 옮기지 말고 119를 부른다","주변 교사·학생에게 보건교사 호출과 119 신고를 이름 찍어 나눠 맡긴다","응급처치가 끝나면 담임을 통해 보호자에게 바로 알리고, 병원 이송 시 교직원이 동행한다","사고 시각·장소·경위·목격자·조치를 바로 메모해 둔다(사고통지·공제 청구의 기초)"],"steps":[{"stage":"알게 됨·신고","when":"사고 즉시","who":"최초 발견 교직원","what":"현장 안전 확인 → 반응·호흡 확인(Check)","detail":"교직원은 ①의식을 잃고 쓰러짐 ②깨워도 반응 없음 ③호흡이 없거나 헐떡이는 호흡, 3가지로 심장정지 여부를 본다. 두부·척추 손상 등 외상으로 의식이 계속 없으면 즉시 119 대상이다.","basis":"교육부 학교 응급상황 대응 가이드라인(2025) 제1장 표1-1, 제2장 Ⅲ"},{"stage":"알게 됨·신고","when":"사고 즉시","who":"최초 발견 교직원·주변 교직원","what":"119 신고와 보건교사 호출(Call)","detail":"심장정지·응급증상(의식장애, 구토·의식장애 동반 두부손상, 개방성·다발성 골절, 대퇴부·척추 골절, 지혈 안 되는 출혈 등)이면 119. 해당하지 않으면 보건교사에게 연락해 보건실 처치 또는 보호자 연락 후 병원 진료 안내. 주변 교직원에게 도움을 청한다.","basis":"학교 응급상황 대응 가이드라인(2025) 표1-2·표1-5; 응급의료법 시행규칙 별표1"},{"stage":"초기 대응","when":"119 도착 전","who":"최초 발견 교직원·보건교사","what":"응급처치(Care)","detail":"심장정지면 가슴압박(분당 100~120회, 가슴 아래쪽 절반)과 AED. 골절·염좌는 움직이지 않게 하고(Rest) 이동 전에 부목으로 고정, 변형된 팔다리는 되돌리려 하지 말고 그대로 고정. 머리·척추 손상 의심자는 머리 기울임-턱 들기 기도유지법을 쓰지 않는다. 출혈은 직접 압박.","basis":"학교 응급상황 대응 가이드라인(2025) 제2장 Ⅰ·Ⅲ·Ⅵ·ⅩⅠ"},{"stage":"초기 대응","when":"응급처치 직후","who":"담임(부재 시 이송담당 교직원)","what":"보호자 연락, 교감 보고","detail":"초기 대응이 끝나면 담임에게 상황을 알리고, 교감·학교장에게 보고하며, 보호자에게 연락한다. 응급처치로 끝나면 담임이 보호자에게 경위를 설명하고 학생을 인계한다.","basis":"학교 응급상황 대응 가이드라인(2025) 그림1-1 설명"},{"stage":"초기 대응","when":"이송 시","who":"담임 또는 이송담당 교직원","what":"병원 동행, 보호자 인계까지 보호","detail":"119 구급대가 오면 담임이나 이송담당 교직원이 동행한다. 119 이송이 불가해 학교 차량으로 옮기면 의료기관 정보를 보호자에게 알린다. 지속 관찰이 필요한 환자를 학교 차로 옮길 때 보건교사는 운전자에서 뺀다. 교감은 보건교사·담임의 공백 수업·보건실에 대체 교사를 배치한다.","basis":"학교 응급상황 대응 가이드라인(2025) 표1-4, 그림1-4 주"},{"stage":"초기 대응","when":"당일","who":"학교장·인솔교사","what":"교육청 보고","detail":"학교장과 인솔교사는 교육활동 중 사고·위급상황에 대해 안전사고관리 지침에 따라 즉시 안전조치를 한 뒤 교육부장관 또는 교육감에게 즉시 보고해야 한다. 구체 보고 기준·양식은 시·도마다 다르므로 소속 교육청 공문을 따른다.","basis":"학교안전법 제10조 제4항"},{"stage":"조사·확인","when":"당일~다음 날","who":"수업 교사·목격 교직원·보건교사","what":"사고 기록 남기기","detail":"일시·장소·활동 내용·경위(6하원칙)·목격자·응급처치 내용·이송 병원을 적는다. 보건교사는 응급환자 기록지/보건일지, 이송·사고 기록지를 작성한다. 사고경위서·목격자확인서 등 참고 양식은 해당 시·도 학교안전공제회 누리집 서식자료를 확인한다.","basis":"학교 응급상황 대응 가이드라인(2025) 표1-4"},{"stage":"조치·이행","when":"사고 후 지체 없이","who":"학교장(공제가입자) — 실무는 행정실·담당자","what":"학교안전공제회에 사고발생 통지","detail":"학교안전사고보상지원시스템(www.schoolsafe.or.kr)에 학교 ID로 로그인 → 사고통지서에 사고 일시·장소·경위 등 필수 항목을 입력(신고인은 학교장) → 학교장 승인(학교장 계정 온라인 승인, 또는 학교에서 학교장 오프라인 승인) → 통보 버튼을 눌러야 공제회로 전송된다. 공제회 담당자가 확인해 ‘접수’해야 그 사고로 공제급여 청구서를 작성할 수 있다. 통지하지 않거나 거짓 통지 시 50만원 이하 과태료.","basis":"학교안전법 제44조 제2항·제72조 제2항 제2호; 같은 법 시행규칙 제5조의2(별지 제2호서식); 학교안전사고보상지원시스템 학교 사용자 매뉴얼·학교장 매뉴얼(2025.3.)"},{"stage":"조치·이행","when":"사고 발생 시","who":"학교장(공제가입자)","what":"보호자에게 학교안전공제 안내","detail":"공제급여 청구 방법·처리 절차·지급 방법 등을 피공제자(미성년 학생이면 보호자에게도) 안내해야 한다. 방법은 서면 교부, 우편·전자우편, 전화·팩스, 휴대전화 문자 등 중 하나.","basis":"학교안전법 제41조의2(2025.7.22. 시행); 같은 법 시행령 제20조의3"},{"stage":"조치·이행","when":"치료 중·치료 후","who":"보호자(청구인)","what":"공제급여 청구","detail":"보호자가 PC·스마트폰에서 휴대폰(모바일) 인증으로 schoolsafe.or.kr에 로그인해 자녀의 학교안전사고를 조회하고, 청구서를 입력한 뒤 진료비 내역서·진단서 등 증빙자료를 올려 등록한다. 서식은 공제급여청구서(시행규칙 별지 제1호서식)이고, 청구 이유를 증명하는 자료(진료비 영수증 등)를 붙인다. 청구서는 학교(공제가입자) 또는 공제회에 낼 수 있고, 학교가 받으면 지체 없이 공제회로 보낸다.","basis":"학교안전법 제41조 제1항; 같은 법 시행규칙 제3조; 학교안전사고보상지원시스템 학부모 사용자 매뉴얼(2025.3.)"},{"stage":"심의·결정","when":"청구받은 날부터 14일 이내","who":"학교안전공제회","what":"지급 여부 결정","detail":"조사 필요 등 정당한 사유가 있으면 14일 연장할 수 있고, 연장 시 처음 기간이 끝나기 전 사유를 청구인에게 통지한다. 공제회는 사고 장소 방문 조사, 진료기록 열람을 할 수 있고, 학교·보호자는 정당한 사유 없이 조사를 방해하거나 자료 제출을 거부하면 안 된다.","basis":"학교안전법 제41조 제2항·제3항, 제42조"},{"stage":"조치·이행","when":"지급 결정 후","who":"학교안전공제회","what":"지급(필요하면 먼저 지급)","detail":"지급 결정 시 지체 없이 지급. 청구인이 신청하거나 공제회가 필요하다고 보면 결정 전에도 전부 또는 일부를 먼저 줄 수 있다. 공제회는 지급 결정 사실을 학교(공제가입자)와 청구인에게 알려야 한다(통보 방식은 공제회마다 다를 수 있음).","basis":"학교안전법 제41조 제4항; 시행규칙 제3조 제4항"},{"stage":"심의·결정","when":"부지급·일부 지급 결정 시","who":"학교안전공제회","what":"이유 통지와 불복 안내","detail":"전부·일부를 지급하지 않기로 하면 공제가입자(학교)와 청구인에게 지체 없이 이유를 알리고, 심사청구를 할 수 있다는 사실과 절차·기간을 알려야 한다.","basis":"학교안전법 제41조 제5항"},{"stage":"불복·구제","when":"결정이 있음을 안 날부터 90일 이내","who":"공제급여 결정에 불복하는 자(보호자 등)","what":"심사청구","detail":"청구처는 해당 공제회의 학교안전공제보상심사위원회. 천재지변 등 불가항력 기간은 빼고 센다. 심사위원회는 청구받은 날부터 60일 이내 결정(부득이하면 한 차례 1개월 이내 연장). 출석·의견진술, 증거 제출, 전문가 감정을 신청할 수 있다.","basis":"학교안전법 제57조, 제58조, 제59조"},{"stage":"불복·구제","when":"심사 결정서 정본이 송달된 날부터 90일 이내","who":"심사 결정에 불복하는 자","what":"재심사청구","detail":"청구처는 학교안전공제중앙회에 둔 학교안전공제보상재심사위원회. 결정 기간 규정은 심사와 같다(60일, 1회 1개월 연장). 이 기간 안에 재심사청구나 소송을 하지 않거나 취하하면, 공제회와 청구인 사이에 심사 결정과 같은 합의가 성립한 것으로 본다.","basis":"학교안전법 제60조, 제61조, 제62조, 제63조"},{"stage":"불복·구제","when":"재결서 정본 송달일부터 60일(기간 내 소송 미제기·취하 시 합의 간주)","who":"재결에 불복하는 자","what":"재결 효력 — 기간 내 소송하지 않으면 합의 간주","detail":"학교안전법 제64조는 재결서 정본을 송달받은 날부터 60일 안에 공제급여와 관련된 소송을 제기하지 않거나 제기한 소송을 취하하면 재결 내용과 같은 합의가 성립한 것으로 본다고 정한다. 이를 모든 경우에 적용되는 일반적인 소송 제소기간으로 단정하지 않는다. 법문은 ‘공제급여와 관련된 소송’이라고만 정하고 소송 유형은 구체적으로 밝히지 않는다.","basis":"학교안전법 제64조"},{"stage":"불복·구제","when":"공제와 별도로","who":"피해 학생 보호자","what":"손해배상 청구(민원·소송)가 올 때","detail":"공제급여를 받은 금액 범위 안에서는 국가·지자체·학교장·피공제자(교직원 포함)의 배상 책임이 면제된다. 판결로 공제가입자·피공제자가 줄 배상액이 확정되면 그 금액은 공제급여로 보아 공제회가 부담한다. 개인 교사에게 직접 청구가 오면 혼자 대응하지 말고 학교장·교육청(법률지원)에 알리고 교원보호공제(소송비용·배상금 지원)를 신청한다.","basis":"학교안전법 제35조 제2항, 제45조 제1항; 교원지위법 제22조"},{"stage":"종결·사후","when":"치료 종결 후","who":"보호자·공제회","what":"장해·간병 등 추가 급여, 종결","detail":"요양을 마친 뒤에도 장해가 남으면 장해급여, 치료 후에도 의학적으로 상시·수시 간병이 필요하면 간병급여를 청구한다. 요양급여는 학교안전사고로 입은 부상·질병의 치료 비용이므로 사고와 관계없는 치료는 대상이 아니다.","basis":"학교안전법 제36조 제1항·제2항, 제37조, 제38조"},{"stage":"종결·사후","when":"3년간 행사하지 않으면(기산점은 민법에 따름)","who":"보호자(수급권자)","what":"청구권 소멸시효","detail":"공제급여를 받을 권리는 3년간 행사하지 않으면 시효로 소멸한다. 피공제자의 사망, 졸업·퇴학 등 신분관계가 바뀌어도 권리는 사라지지 않는다. 늦게 나타난 후유증이 있으면 이 기간 안에 청구하도록 안내한다.","basis":"학교안전법 제65조, 제47조 제1항"},{"stage":"종결·사후","when":"사고 수습 후","who":"학교장·교감·보건교사","what":"재발 방지와 심리 지원","detail":"시설 하자 점검·개선, 응급상황 관리체계 점검, 교직원 심폐소생술 교육(매년, 실습 2시간 포함 최소 3시간). 피해 학생·가족의 상담·심리치료는 교육부장관·교육감이 지원하
