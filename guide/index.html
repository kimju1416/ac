<script>
const DATA = {"updated":"2026-09-24","cases":[{"id":"emergency-medical","title":"학생 응급상황(의식 없음·경련·아나필락시스·저혈당·천식)","aka":["쓰러졌어요","의식이 없어요","숨을 안 쉬어요","심정지","심폐소생술","CPR","AED","제세동기","경련","발작","뇌전증","알레르기 쇼크","아나필락시스","에피펜","저혈당","1형 당뇨","천식 발작","목에 걸렸어요","하임리히"],"category":"안전·보건","urgency":"즉시","roles":["최초 발견 교직원","인근 교직원(2인 이상)","보건교사(부재 시 업무대행자)","담임","이송담당 교직원","교감","학교장","행정실"],"summary":"교육부 「학교 응급상황 대응 가이드라인」(2025.4.)은 모든 교직원이 3C(Check 상황판단 → Call 119·보건교사 → Care 응급처치)로 대응하도록 한다. 의식이 없고 호흡이 없거나 헐떡이면 즉시 119, 가슴압박, AED. 학교장이 사전에 학부모 동의와 처방 의사 자문을 받으면 보건교사가 아나필락시스·1형 당뇨 저혈당 쇼크로 생명이 위급한 학생에게 투약 등 응급처치를 할 수 있고(학교보건법 제15조의2), 일반 교직원의 투약 권한을 직접 정한 조문은 확인되지 않았으며, 생명이 위급한 응급환자에게 한 응급처치는 고의 또는 중대한 과실이 없는 경우 응급의료법 제5조의2의 면책 대상이 될 수 있다(구체 적용은 사안별 판단).","first":["어깨를 두드리며 반응 확인 → 반응 없고 숨이 없거나 헐떡이면 ‘119 신고, AED 가져와’를 사람 지목해 지시","119 상담원 안내(스피커폰)에 따라 가슴 한가운데 아래쪽을 분당 100~120회 세게 누른다","AED가 오면 전원 켜고 음성 안내대로 패드 부착, 분석·충격 때는 모두 떨어진다","경련이면 억지로 붙잡거나 입에 아무것도 넣지 말고, 주변 물건 치우고 옆으로 눕히고 시작 시각을 잰다","보건교사를 부르고, 담임은 보호자에 연락, 교감은 대체 인력 배치"],"steps":[{"stage":"알게 됨·신고","when":"발견 즉시","who":"최초 발견 교직원","what":"Check — 현장 안전, 의식·호흡 확인","detail":"교직원은 ①의식을 잃고 쓰러짐 ②깨워도 반응 없음 ③호흡이 없거나 매우 느리고 가끔 헐떡임, 3가지로 심장정지를 판단한다(보건교사는 맥박까지 4가지). 호흡 확인은 5~10초 이내.","basis":"교육부 학교 응급상황 대응 가이드라인(2025) 표1-1, 제2장 Ⅰ"},{"stage":"알게 됨·신고","when":"즉시","who":"최초 발견자·인근 교직원","what":"Call — 119 신고, AED 요청, 보건교사 호출","detail":"심장정지·응급상황이면 최초 발견자가 먼저 119에 신고하고 AED를 요청한다. 전화 도움 심폐소생술은 스피커폰으로 상담원 지시를 따른다. 인근 교직원(2인 이상)에게 도움을 청한다.","basis":"가이드라인(2025) 표1-4·표1-5, 제1장 Ⅲ-2"},{"stage":"초기 대응","when":"심장정지 시","who":"최초 발견자·인근 교직원","what":"가슴압박과 AED","detail":"위치 가슴뼈 아래쪽 절반, 속도 분당 100~120회, 매번 완전히 이완. 만 8세 이상은 약 5cm(6cm 넘지 않게), 만 1~8세 미만은 가슴 두께의 1/3 이상 또는 4~5cm, 1세 미만 영아는 1/3 이상 또는 약 4cm. 최신 2025 한국 심폐소생술 가이드라인은 영아 압박에 구조자 수와 관계없이 양손 감싼 두 엄지 방법을 권고한다. AED: 전원 → 패드(오른쪽 빗장뼈 아래, 왼쪽 젖꼭지 아래 중간겨드랑이선) → 분석·충격 때 모두 물러남 → 충격 직후 바로 압박 재개. 2분마다 교대.","basis":"가이드라인(2025) 제2장 Ⅰ-2; 2025년 한국 심폐소생술 가이드라인(질병관리청, 2026.1.) 제6장 소아 기본소생술"},{"stage":"초기 대응","when":"목에 걸렸을 때","who":"발견 교직원","what":"기도폐쇄 응급처치","detail":"기침·소리를 낼 수 있으면 기침을 계속하게 한다. 말·기침·숨을 못 쉬면 다른 사람에게 119 신고를 부탁하고 즉시 처치한다. 성인과 만 1세 이상 소아는 등을 5회 두드린 뒤 효과가 없으면 복부 밀어내기를 5회 반복한다. 1세 미만 영아는 복부 밀어내기를 하지 말고 등 두드리기 5회와 가슴 밀어내기 5회를 번갈아 한다. 의식을 잃으면 바닥에 눕혀 즉시 심폐소생술을 시작하고, 입안에 보이는 이물만 제거한다.","basis":"가이드라인(2025) 제2장 Ⅱ; 2025년 한국 심폐소생술 가이드라인(질병관리청, 2026.1.) 제3장·제6장"},{"stage":"초기 대응","when":"경련 시","who":"발견 교직원","what":"경련(발작) 응급처치","detail":"바닥에 조심히 눕히고 위험한 물건을 치우고 머리 밑에 수건·옷. 목 주위 옷을 풀고 옆으로 눕힌다. 시작 시각과 양상을 관찰(가능하면 영상). 누르거나 팔다리를 붙잡지 말고 입에 손가락·물건을 넣지 않는다. 발작이 반복되거나 의식 회복 없이 5분 이상 지속되면 뇌전증 중첩증(뇌전증 지속상태)으로 보고 즉시 병원 응급실로 간다. 깨어날 때까지 혼자 두지 않는다.","basis":"가이드라인(2025) 제2장 Ⅸ"},{"stage":"초기 대응","when":"아나필락시스 의심 시","who":"발견 교직원·보건교사","what":"아나필락시스 긴급 처치","detail":"전신 두드러기·입술·얼굴 부종, 쌕쌕거림·심한 호흡곤란, 쓰러질 것 같음·실신이면 편평한 곳에 눕히고 119, 원인물질 제거, 에피네프린 자가주사기가 있으면 허벅지 바깥쪽에 수직으로 ‘딸깍’ 소리 나게 눌러 약 10초 유지, 다리를 올린 쇼크자세. 주사 후에도 2차 반응이 올 수 있어 반드시 병원으로 이송한다.","basis":"가이드라인(2025) 제2장 Ⅴ(3)-(2)"},{"stage":"초기 대응","when":"천식 발작 시","who":"발견 교직원·보건교사","what":"천식 응급처치","detail":"의자에 앉혀 안정, 옷 단추를 풀고 학생의 증상완화제(기관지확장제)를 처방대로 흡입. 첫 흡입 뒤 20분 지켜보고 호전 없으면 두 번째·세 번째 흡입(각 처방대로), 3회 흡입 후에도 안 되면 119(이송 중 4회까지 흡입 가능). 증상완화제가 없으면 바로 119.","basis":"가이드라인(2025) 제2장 Ⅴ(3)-(1)"},{"stage":"초기 대응","when":"저혈당 의심 시","who":"발견 교직원·보건교사","what":"저혈당 응급처치","detail":"식은땀·손떨림·이상행동 등이면 혈당 측정. 의식 있고 삼킬 수 있으면 단순당 15g(주스 1/2컵, 사탕 3알, 요구르트 1병, 설탕 1숟가락 등) → 15분 후 재측정, 70mg/dl 미만이면 다시 15g → 호전 없으면 병원 이송. 의식이 없으면 입으로 아무것도 주지 않고 119. 필요하면 학생이 가진 글루카곤을 주사하는데, 가이드라인은 이를 보건교사(간호사 면허 보조인력 포함)가 사전 학부모 동의·처방 의사 자문을 받아 투여할 수 있는 것으로 안내한다.","basis":"가이드라인(2025) 제2장 Ⅷ"},{"stage":"초기 대응","when":"보건교사 도착 후","who":"보건교사","what":"응급처치 인계·수행","detail":"보건교사가 상황별 응급처치를 하고 교직원은 지시에 따라 돕는다. 119 도착 시 구급대원에게 처치와 상황을 인계하고 교감에게 보고한다. 학교 차량 이송 중 처치가 필요하면 보건교사가 동행(운전은 하지 않음).","basis":"가이드라인(2025) 표1-4·표1-5, 제1장 Ⅲ-3(보건교사는 운전자에서 제외)"},{"stage":"초기 대응","when":"처치와 동시에","who":"담임·교감","what":"보호자 연락과 인력 공백 메우기","detail":"담임은 보호자에게 연락하고 교감에게 보고, 병원 이송 시 동행해 보호자 인계까지 보호한다. 교감은 보건실·학급에 대체 교사를 배치하고 행정지원을 요청한다. 학교장은 응급상황 관리체계를 가동한다.","basis":"가이드라인(2025) 표1-5"},{"stage":"조사·확인","when":"당일","who":"보건교사·목격 교직원","what":"기록","detail":"응급환자 기록지/보건일지, 응급환자 이송 및 사고 기록지에 발생·발견 시각, 주 증상·의식상태, 응급처치 내용, 이송 시각·차량·이송자 등을 남긴다.","basis":"가이드라인(2025) 표1-4, 부록 서식 6(응급환자 이송 및 사고 기록)"},{"stage":"조치·이행","when":"사후","who":"행정실","what":"공제 통지·치료비 청구 처리","detail":"교육활동 중 발생해 치료가 필요하면 학교안전공제회에 사고통지하고 공제급여 청구를 지원한다(교내 안전사고 항목 참고). 이송 동행 교직원 출장 처리.","basis":"가이드라인(2025) 표1-4; 학교안전법 제44조 제2항"},{"stage":"종결·사후","when":"사후·학년 초","who":"보건교사·학교장","what":"재발 대비","detail":"해당 학생 응급처치 계획 점검(학부모 동의·처방 의사 자문, 약 보관), 담임과 학생 대상 응급처치 요령 교육(매 학기 초), AED 매월 점검, 교직원 심폐소생술 교육(매년, 실습 2시간 포함 3시간 이상), 보건교사 부재 시 업무대행자 지정.","basis":"학교보건법 제9조의2 제2항·제15조의2; 같은 법 시행규칙 제10조; 가이드라인(2025) 제1장 Ⅱ·부록"}],"deadlines":[{"what":"119 신고·가슴압박","limit":"심장정지 판단 즉시(뇌는 4~5분 내 심장박동이 돌아오지 않으면 영구 손상 가능)","basis":"학교 응급상황 대응 가이드라인(2025) 제2장 Ⅰ"},{"what":"경련 지속 시 응급실","limit":"발작이 반복되거나 의식 회복 없이 5분 이상 지속될 때 즉시","basis":"가이드라인(2025) 제2장 Ⅸ"},{"what":"교직원 응급처치 교육","limit":"매년, 실습 2시간 포함 최소 3시간","basis":"학교보건법 제9조의2 제2항; 같은 법 시행규칙 제10조(별표9); 가이드라인(2025) 표1-3"},{"what":"AED 점검","limit":"매월 1회","basis":"가이드라인(2025) 부록 서식(AED 자체 점검 체크리스트 매월 1회). 응급의료법 제47조의2 제3항(매월 1회 이상 점검·시군구 통보)은 같은 조 제1항 의무설치 대상에 적용"}],"dont":["‘괜찮아질 거야’ 하며 팔다리를 주무르거나 보건실로 옮기느라 시간을 끌지 않는다 — 5분 지체로 교사 책임이 인정된 판례(대법원 2008다5417)","경련하는 학생을 붙잡거나 입에 손가락·수건·숟가락을 넣지 않는다","의식이 없는 저혈당 학생에게 사탕·주스를 입에 넣지 않는다","에피네프린 주사 후 증상이 좋아졌다고 병원 이송을 생략하지 않는다","AED를 잠가 두지 않는다","머리·척추 외상이 의심되는 학생에게 머리 젖히기(머리 기울임-턱 들기)를 하지 않는다"],"contacts":[{"name":"구급","tel":"119","note":"전화 도움 심폐소생술 — 스피커폰으로 지시 따르기"}],"forms":["학생 건강조사 및 응급이송 동의서 — 학년 초(가이드라인 부록 서식 2)","응급환자 기록지/보건일지, 응급환자 이송 및 사고 기록지","학교 응급상황 대응계획(조직도, 대응반 역할, 대리자, 인근 병원, 관심 학생 현황)","AED 관리대장(월 점검)","투약 대상 학생: 학부모 동의서, 처방 의사 자문 기록"],"law":[{"name":"학교보건법","article":"제15조의2 제1항·제2항","point":"학교장은 사전에 학부모 동의와 처방 의사 자문을 받아 보건교사(순회 보건교사)가 1형 당뇨 저혈당 쇼크·아나필락시스 쇼크로 생명이 위급한 학생에게 투약 등 응급처치를 하게 할 수 있고, 의료법 제27조 제1항 미적용. 고의·중과실 없으면 민사책임·상해 형사책임 없음, 사망 형사책임은 감경하거나 면제할 수 있음(제2항)"},{"name":"학교보건법","article":"제15조의2 제3항; 시행규칙 제11조","point":"질병·장애로 특별 관리가 필요한 학생을 위해 보조인력을 둘 수 있고, 보조인력은 보건교사 지시로 투약 등 응급처치를 보조"},{"name":"응급의료에 관한 법률","article":"제5조의2","point":"생명이 위급한 응급환자에게 한 응급처치로 생긴 손해·사상에 고의·중과실이 없으면 민사책임과 상해 형사책임을 지지 않고 사망 형사책임은 감면"},{"name":"학교보건법","article":"제9조의2","point":"학교장은 매년 교직원 대상 심폐소생술 등 응급처치 교육 실시(시행규칙 제10조: 결과는 다음 학년도 시작 30일 전까지 교육감 제출)"},{"name":"학교보건법 시행령","article":"제23조 제4항 제3호 타목","point":"간호사 면허를 가진 보건교사의 직무에 응급을 요하는 자에 대한 응급처치와 그에 따른 의약품 투여 포함"}],"faq":[{"q":"보건교사가 아닌 담임이 에피네프린 자가주사기를 놓아도 되나요?","a":"학교보건법 제15조의2가 투약 권한과 면책을 명시한 대상은 보건교사(순회 보건교사)다. 일반 교사가 놓는 것을 명시적으로 허용한 조문은 확인되지 않는다. 다만 교육부 가이드라인은 자격·면허와 관계없이 생명이 위급한 환자에게 한 응급처치는 응급의료법 제5조의2 적용을 받을 수 있다고 안내하고, 아나필락시스 처치로 ‘에피네프린 자가주사가 있는 경우 허벅지에 근육주사’를 제시한다."},{"q":"심폐소생술을 하다 갈비뼈가 부러지면 책임지나요?","a":"응급의료법 제5조의2는 생명이 위급한 응급환자에게 한 응급처치로 생긴 손해·사상에 고의·중과실이 없으면 민사책임과 상해 형사책임을 지지 않는다고 정한다. 판례는 반대로 응급조치를 하지 않고 지체한 교사의 책임을 인정했다(대법원 2008다5417)."},{"q":"보건교사가 출장 중이면요?","a":"학교장은 보건교사 부재에 대비해 업무대행자를 지정해야 한다. 가이드라인 예시는 간호사 면허 보조인력이 간단한 응급처치를 하고, 없으면 교무실 등에 구급함을 두고 교직원이 의약외품만 써서 처치한다. 응급상황이면 누구든 119 신고와 심폐소생술·AED가 먼저다."},{"q":"2025년 심폐소생술 가이드라인에서 달라진 게 있나요?","a":"질병관리청·대한심폐소생협회가 2025.12.9. 공개한 주요 개정사항은 가슴압박 때 주로 쓰는(편한) 손을 아래에 두도록 제안, 익수 심장정지는 교육받은 구조자가 인공호흡부터 시작하도록 권고, 실습·피드백 장치 교육 강조 등이다. 학교 가이드라인(2025.4.)은 2020년판을 인용한다."},{"q":"구급차를 부를지 애매하면요?","a":"가이드라인의 응급상황 판단기준(의식장애, 두부손상+구토·의식장애, 급성 호흡곤란, 쇼크, 얼굴 부종 동반 알레르기, 소아 경련성 장애 등)에 해당하면 119다. 판단이 어려우면 119에 도움을 요청한다."}],"deep":[{"title":"3C — 누구든 이 순서로","body":["Check: 현장 안전, 의식·호흡(교직원 3가지, 보건교사 4가지) 확인.","Call: 119 신고와 AED 요청, 보건교사 연락, 주변 교직원 도움 요청.","Care: 심장정지면 가슴압박·AED, 아니면 보건교사 도착까지 현장 관리·초기 상황 설명·지시에 따른 지원.","초기 대응 후 담임에게 알리고, 교감·학교장 보고, 보호자 연락. 119가 오면 담임 또는 이송담당 교직원이 동행."],"basis":"학교 응급상황 대응 가이드라인(2025) 제1장 Ⅱ·Ⅲ"},{"title":"투약은 누가, 어떤 준비로","body":["학교보건법 제15조의2: 학교장이 학부모 동의와 처방 의사 자문을 사전에 받아 두면, 보건교사가 아나필락시스 쇼크·1형 당뇨 저혈당 쇼크로 생명이 위급한 학생에게 에피네프린·글루카곤 등을 투약할 수 있고 의료법 무면허 조항이 적용되지 않는다. 고의·중과실이 없으면 민사·상해 형사책임이 없고, 사망 형사책임은 감경하거나 면제할 수 있다(응급의료법 제5조의2는 «감면한다»).","가이드라인은 간호사 면허를 가진 보조인력도 같은 방식으로 투여할 수 있다고 안내한다(학교보건법 시행규칙 제11조 보조인력의 투약 보조).","그래서 학년 초에 해당 학생을 파악하고, 동의서·자문을 받고, 매 학기 초 담임과 학생에게 응급처치 요령을 교육한다."],"basis":"학교보건법 제15조의2; 같은 법 시행규칙 제11조; 가이드라인(2025) 제2장 Ⅴ·Ⅷ NOTICE"},{"title":"판례가 말하는 교사의 의무","body":["대법원 2008.5.8. 선고 2008다5417: 체육 시간 체력검사 팔굽혀펴기 중 의식을 잃고 쓰러진 학생에게 체육교사가 응급조치 등 필요한 조치를 하지 않은 채 5분가량 지체해 상태가 악화된 사안에서, 교사의 보호·감독의무 소홀을 인정.","대법원 2013.9.13. 선고 2013다37722: 합숙훈련 중 급성심장사 사안에서 응급구호체계 미비와 심폐소생술 미실시를 들어 학교의 보호·감독의무 위반을 인정.","인천지법 2006.11.23. 선고 2005가합15938: 보건교사가 심장마사지·인공호흡·119 신고 등 적절한 조치를 한 경우 과실을 부정."],"basis":"학교 응급상황 대응 가이드라인(2025) 부록 Ⅲ 주요 판례"}],"tables":[{"title":"상황별 119 기준과 첫 처치","head":["상황","119 부를 때","첫 처치","하지 말 것"],"rows":[["심장정지","반응 없음 + 무호흡·헐떡임","가슴압박 100~120회/분, AED","지체, 주무르기"],["기도폐쇄","말·기침 못 함, 청색증","성인·만 1세 이상 소아: 등 두드리기 5회 후 복부 밀어내기 5회 반복. 1세 미만 영아: 등 두드리기 5회와 가슴 밀어내기 5회 반복(복부 밀어내기 금지)","입안 손가락 훑기(보이는 이물만 제거), 1세 미만 영아에게 복부 밀어내기"],["경련","소아 경련성 장애는 표1-2의 응급증상이라 119 신고 대상(«소아 경련»은 공휴일·야간 등 의료서비스를 받기 어려울 때 8세 이하에게 나타나면 응급에 준하는 증상). 반복되거나 의식 회복 없이 5분 이상이면 즉시 응급실","눕히고 물건 치우기, 옆으로, 시간 재기","붙잡기, 입에 물건 넣기"],["아나필락시스","호흡곤란·부종 악화·실신","눕히기, 에피네프린 자가주사, 다리 올리기, 이송","주사 후 이송 생략"],["천식","증상완화제 3회 후 무반응, 약 없음","앉혀 안정, 증상완화제 흡입","—"],["저혈당","70mg/dl 미만·식은땀·떨림·의식변화·경련 등 응급상황에서 처치로 호전 안 될 때(의식 없으면 즉시)","의식 있으면 단순당 15g, 15분 후 재측정","의식 없는데 입으로 먹이기"],["고혈당","180mg/dl 이상+깊고 빠른 호흡·구토·의식변화","인슐린 자가주사 확인, 옆으로 눕히기","의식 없는데 먹이기"]],"note":"교육부 학교 응급상황 대응 가이드라인(2025.4.25.)과 질병관리청 2025 한국 심폐소생술 가이드라인(2026.1.29. 공개·2026.2.9. 정오표) 기준. 학교 가이드의 일반 소아 수치를 유지하면서 2025 최신 영아 압박·기도폐쇄 방법을 보완했다."}],"record":"보건교사 응급환자 기록지·보건일지, 이송 및 사고 기록지. 교육활동 중 치료가 필요하면 학교안전공제 사고통지. 교직원 응급처치 교육 결과는 다음 학년도 시작 30일 전까지 교육감 제출(학교보건법 시행규칙 제10조).","sources":[{"title":"학교 응급상황 대응 가이드라인","publisher":"교육부","year":2025,"url":"https://www.gne.go.kr/user/bbs/BD_selectBbs.do?q_bbsSn=1464&q_bbsDocNo=20250428094553090"},{"title":"학교보건법·시행령·시행규칙","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교보건법"},{"title":"응급의료에 관한 법률","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/응급의료에관한법률"},{"title":"급성심장정지 환자 생존율 9.2% 역대 최고(2025년 한국 심폐소생술 가이드라인 주요 개정사항, 보도자료)","publisher":"질병관리청","year":2025,"url":"https://www.kdca.go.kr/bbs/kdca/42/240821/download.do"},{"title":"2025년 한국 심폐소생술 가이드라인 및 1차 정오표","publisher":"질병관리청","year":2026,"url":"https://www.kdca.go.kr/bbs/kdca/49/309908/artclView.do"}],"verified":"2026-09-24","uncertain":["일반 교사(보건교사 아님)의 에피네프린 자가주사기 투여를 직접 허용하는 법 조문은 확인되지 않음 — 응급의료법 제5조의2 면책 적용 여부는 사안별 판단","학교가 응급의료법 제47조의2의 AED 의무 설치 대상인지(시행령 다중이용시설 범위)는 확인 못 함","시·도교육청별 응급상황 매뉴얼·보고 기준은 소속 교육청 지침 확인 필요","천식 발작 때 ‘눕히기’를 금지 사항으로 적은 문장은 가이드라인에서 찾지 못함(가이드라인은 ‘의자에 앉혀 안정’만 제시) — 원문 확인 필요","에피네프린·글루카곤 보관 위치를 담임·관련 교사와 공유하라는 문장은 가이드라인 본문에서 찾지 못함(서식에 ‘약품보관 장소’ 칸만 있음) — 원문 확인 필요"],"related":["safety-accident","suicide-risk"]},{"id":"suicide-risk","title":"학생 자살·자해 위기","aka":["죽고 싶대요","자살 암시","자해 흔적","손목 상처","유서 같은 메모","SNS 자살 글","극단적 선택","자살 시도","우선관리군","관심군","정서행동검사 자살문항","109","Wee클래스 연계","보호자가 치료 거부"],"category":"학생 보호·위기","urgency":"즉시","roles":["처음 알게 된 교직원","담임","전문상담(교)사","보건교사","생활교육(학생부) 부장","교감","교장","학교 내 위기관리위원회(생명존중위원회 등)"],"summary":"학생이 죽음을 말하거나 자해 흔적이 보이면 직접 차분히 묻고, 위험에 맞춰 혼자 두지 않으며 보호자·전문기관에 연결한다. 생명·신체 안전이 걸리면 학생이 비밀을 원해도 비밀보장의 예외다. 보호자가 학대 의심자라면 신고 내용을 미리 알리지 않는다. 2026년 3월 1일부터 시행된 초·중등교육법 제18조의5에 따라, 상담·치료 권고를 3회 이상(생명·신체에 중대한 위해 우려가 있으면 1회 이상) 받고도 정당한 사유 없이 따르지 않고 학교생활에 현저한 어려움이 있으면 정신건강의학과 전문의 1명 이상을 포함한 전문가 3명 이상의 의견과 위원회 심의를 거쳐 긴급지원을 할 수 있다. 긴급지원은 필요한 최소 범위로 하고 끝난 뒤 즉시 보호자에게 통지한다.","first":["지금 다쳤거나 약·도구를 썼거나 투신 등 임박한 위험이면 119(생명·신체 위급)·112에 먼저 신고한다","응급 수준이 의심되면 학생을 혼자 두지 않고 안전조치를 한다","자살 생각·계획·수단·시기를 직접적이고 차분하게 확인한다. 직접 물어보는 일 자체가 위험을 높인다고 보지 않는다","관리자와 상담 담당자에게 공유한다. 중간위험 이상이면 보호자에게 연락하고, 응급이면 즉각 알린다(보호자가 학대 의심자라면 신고 내용을 미리 알리지 않는다)","전문상담교사·Wee클래스로 인계하고, 위험도에 따라 Wee센터·정신건강복지센터·병원으로 연계한다. 학생에게는 109(24시간)를 알려 준다"],"steps":[{"stage":"알게 됨·신고","when":"신호를 본 순간","who":"처음 알게 된 교직원","what":"자살 신호를 가볍게 넘기지 않기","detail":"직접 신호(약·끈·칼을 모아 숨김, 소중한 물건을 나눠 줌, 일기·노트·메모에 죽음 표현, 죽음 관련 말을 흘림, “안녕”, “내가 사라지면…”)와 간접 신호(식사·수면 변화, 외모에 무관심, 성격의 급변, 기운 없음, 칭찬 거부)를 알아차리면 곧바로 대응한다. 청소년 자살은 충동적이고 모방(피암시성) 경향이 강하다.","basis":"2025 학생정서·행동특성검사 및 관리 매뉴얼 부록 '소아청소년 자살에 대한 전반적인 이해' 200·204쪽"},{"stage":"알게 됨·신고","when":"응급 상황이면 즉시","who":"최초 발견자","what":"응급 조치·119/112 신고","detail":"이미 약을 먹었거나 다쳤거나 투신 위험이 있는 등 생명이 급하면 응급처치와 함께 119, 학교전담경찰관(SPO) 또는 112에 신고한다. 즉각적 의료 처치가 필요한지 판단이 어려우면 보건교사와 의논한다.","basis":"학생 마음건강 지원 가이드북(2025) Q5; 단위학교 위기관리 가이드라인(서울시교육청) 자해 사안 대응 절차"},{"stage":"초기 대응","when":"즉시","who":"최초 발견자·담임","what":"혼자 두지 않고 안전 확보","detail":"응급 수준(최근 계획·실행 의도가 있음)이 의심되면 학생을 혼자 두지 말고 안전조치를 한다. 교사부터 마음을 가라앉히고 차분한 태도를 보인다.","basis":"학교위기대응 안내서(2024) 부록 자살관련 면담 기록지 '응급 상황 → 학생을 혼자 두지 않고, 안전조치'; 단위학교 위기관리 가이드라인 자해 Q&A(차분한 태도)"},{"stage":"조사·확인","when":"안정된 뒤 곧바로","who":"담임·전문상담(교)사","what":"직접 묻고 위험도 가리기","detail":"① 죽고 싶거나 죽는 게 낫겠다고 생각했는지 ② 자살을 생각 중인지 ③ 최근 방법을 계획했는지 ④ 최근 6개월 사이 그 계획을 실행해야겠다고 생각했는지 ⑤ 실제 행동을 해 본 적 있는지 ⑥ 무엇이 그렇게 힘든지를 묻는다. 자살사고를 찬찬히 묻는 것은 자살행동으로 이어지지 않고 오히려 보호가 된다. 위험도 판정과 조치는 아래 '위험 수준별 조치' 표를 따른다.","basis":"학교위기대응 안내서(2024) 부록 '자살관련 면담 기록지'; 2025 정서·행동특성검사 매뉴얼 부록(평가)"},{"stage":"초기 대응","when":"당일","who":"담임·상담교사","what":"관리자 보고와 기록","detail":"학교 관리자에게 발생·초기대응 내용을 보고하고, 보고 여부와 내용을 구체적으로 기록해 둔다. 필요하면 학교 내 위기관리위원회(생명존중위원회 등)를 연다.","basis":"단위학교 위기관리 가이드라인(서울시교육청) 자해 사안 '관리자 보고'"},{"stage":"초기 대응","when":"당일","who":"담임(관리자 보고와 함께)","what":"보호자에게 알리고 면담","detail":"중간위험 이상이면 보호자에게 연락하고, 응급 상황이면 즉각 알린다. 학생이 비밀을 원해도 생명·신체 안전이 걸리면 비밀보장의 예외임을 미리 알려 두고, 반복·심각한 자해에는 '절대 비밀로 하겠다'는 약속을 하지 않는다. 보호자에게는 있는 그대로 전하되 자책하지 않도록 정서적으로 배려하고, 해결에 보호자 협조가 필수임을 알린다. 보호자가 학대 의심자라면 신고 내용을 미리 알리지 않는다.","basis":"학교위기대응 안내서(2024) 부록 위험 단계별 조치; 단위학교 위기관리 가이드라인 자해 Q&A; 교육부 아동학대 예방 및 대처요령 가이드북(4판, 2024) 신고 시 주의사항"},{"stage":"조치·이행","when":"당일~며칠 안","who":"전문상담(교)사·업무담당자","what":"위험도별 연계","detail":"낮은 위험: 교내 상담 인력이 계속 관찰·상담. 중간위험: 보호자 연락 + Wee센터·정신건강복지센터·자살예방센터 등 교육청 지정 전문기관 의뢰. 높은위험: 보호자 연락 + 자살예방센터 또는 전문병원 진료 권유. 응급: 혼자 두지 않고 안전조치, 부모에게 즉각 알리고 전문병원 진료 적극 권유. 외부기관 의뢰는 원칙적으로 보호자 동의 후 진행하되, 생명·신체에 급박한 위험이 있으면 119·112 등 응급 절차를 우선하고, 보호자가 학대 의심자이면 신고 내용을 미리 알리지 않는다.","basis":"학교위기대응 안내서(2024) 부록; 단위학교 위기관리 가이드라인(보호자 동의 후 의뢰); 교육부 아동학대 예방 및 대처요령 가이드북(4판, 2024) 신고 시 주의사항"},{"stage":"조치·이행","when":"정서·행동특성검사 결과가 나왔을 때","who":"검사 담당교사·담임","what":"자살문항 응답·우선관리군 즉각 조치","detail":"중·고등학생 자살 위험도 문항 점수 합이 기준 이상이거나 면담에서 자살위험이 확인되면 정서·행동 총점과 관계없이 우선관리군이다. 자살위험 시 보호자에게 즉시 알리고 전문기관에 즉각 의뢰한다. 초등학생은 자살 문항이 따로 없지만 면담 중 자살위험이 확인되면 우선관리군에 준해 조치한다. 관심군을 정상군으로 바꾸려면 재검사·상담 결과 등을 근거로 협의체 회의에서 결정하고 내부결재를 거친다.","basis":"2026년 학생정서·행동특성검사 및 관리 매뉴얼 4·20·33·85쪽"},{"stage":"조치·이행","when":"보호자가 상담·치료를 거부할 때","who":"교장(위원회)","what":"상담 권고 → 치료 권고(법적 절차)","detail":"학교장은 외부 전문가 의견을 듣고 학교 내 관련 위원회 심의를 거쳐 학생·보호자에게 상담을 권고하고, 상담 결과를 반영해 치료 권고·학교 내 방문상담·기관 연계·학습지원을 할 수 있다. 보호자는 협조할 의무가 있다. 거부 기록('보호자 미동의')을 구체적으로 남긴다.","basis":"초·중등교육법 제18조의5제1항~제3항; 시행령 제31조의5; 단위학교 위기관리 가이드라인"},{"stage":"심의·결정","when":"권고를 반복해도 이행하지 않을 때","who":"교장·교육장·교육감","what":"긴급지원(상담·치료를 받게 함)","detail":"상담 권고 또는 치료 권고를 3회 이상 받고도 정당한 사유 없이 이행하지 않고, 정서·행동 문제로 학교생활에 현저한 어려움이 있어 긴급 지원이 필요한 학생에게 상담·치료를 받게 할 수 있다. 생명·신체에 중대한 위해 우려가 있으면 권고 1회 이상으로 충분하다. 정신건강의학과 전문의 1명 이상을 포함한 전문가 3명 이상의 의견 청취와 위원회 심의가 필요하다.","basis":"초·중등교육법 제18조의5제4항; 시행령 제31조의6제1항·제2항"},{"stage":"조치·이행","when":"긴급지원 뒤","who":"교장·교육장·교육감","what":"최소 범위 실시·보호자 통지","detail":"긴급지원은 문제 해결에 필요한 최소한의 범위로 하고, 실시 내용과 결과를 지원이 끝난 후 즉시 보호자에게 통지한다. 세부 사항은 교육감이 정한다.","basis":"시행령 제31조의6제3항·제4항"},{"stage":"조치·이행","when":"필요 시","who":"업무담당자","what":"정신건강전문가 학교지원(긴급지원) 요청","detail":"보호자가 자녀 상태를 인정하지 않거나 치료 여력이 없어 치료가 안 되는 시급·심각한 사례는 교육지원청 정신건강전문가 학교지원센터(긴급지원팀)에 요청할 수 있다. 공문·학교지원센터 문서24·이메일·사례관리시스템으로 신청하며 방법은 관할 교육청에 문의한다.","basis":"학생 마음건강 지원 가이드북(2025) Q1 '정신건강전문가 학교지원'"},{"stage":"조치·이행","when":"필요 시","who":"업무담당자","what":"치료비 지원 연결","detail":"학생 마음바우처(정신건강 위기학생 진료·치료비 지원) 우선순위 1순위는 자살을 시도한 초·중·고 재학(휴학 포함) 학생이다. 지원 금액·한도·서류는 시도교육청 공문을 확인한다. 보건복지부 전국민 마음투자 지원사업(전문 심리상담 총 8회 바우처)도 안내할 수 있다(문의 129).","basis":"학생 마음건강 지원 가이드북(2025) Q4"},{"stage":"조치·이행","when":"아동학대가 의심되면","who":"교직원","what":"아동학대 신고 검토","detail":"치료가 꼭 필요한데도 보호자가 계속 거부해 의료적 방임 등 아동학대범죄가 의심되면, 교직원은 시·도, 시·군·구 또는 수사기관에 즉시 신고해야 한다. 학대(의심)행위자인 보호자에게 신고 내용을 미리 알리지 않는다.","basis":"아동학대범죄의 처벌 등에 관한 특례법 제10조제2항; 교육부 아동학대 예방 및 대처요령 가이드북(4판, 2024) 신고 시 주의사항"},{"stage":"종결·사후","when":"연계 이후 계속","who":"담임·상담교사","what":"학교 내 지속관리","detail":"관심군은 전문기관에 의뢰했더라도 학교에서 계속 관리한다. 우선관리군은 월 1회, 일반관리군은 분기별 1회 면담으로 정서·행동 특성을 확인한다. 자살위험군은 협의체 또는 학교 내 위기관리위원회(유사 위원회와 통합 가능)에서 개입·지원 방법을 정한다. 면담·평가는 위험도가 줄 때까지 자주 반복한다.","basis":"2026년 학생정서·행동특성검사 및 관리 매뉴얼 4·34·35쪽; 2025 같은 매뉴얼 부록 201쪽"},{"stage":"종결·사후","when":"자해·시도 뒤 복귀","who":"담임·상담교사","what":"재발 관찰","detail":"외부 연계를 하지 않기로 했더라도 더 이상 자해가 보이지 않을 때까지 시간을 두고 확인한다. 말로만 묻지 말고 학생 동의를 받아 이전 부위를 살핀다(동의하지 않으면 강요하지 않는다). 과거 자살시도는 높은위험 요인이므로 관리한다.","basis":"단위학교 위기관리 가이드라인(서울시교육청) 자해 Q&A; 학교위기대응 안내서(2024) 부록"},{"stage":"종결·사후","when":"학년·학교가 바뀔 때","who":"전·현 담임","what":"관리 공백 막기(인수인계)","detail":"진급 시 전년도 담임이 새 담임에게 오프라인 자료로 인계한다. 전출 시 전입교는 학부모 동의를 얻어 원적교에 공문으로 자료를 요청한다. 검사결과·상담내용은 생활기록부·건강기록부에 적지 않고, 서면 검사지는 용도가 끝나면 파쇄하며 관련 교사만 공유한다.","basis":"2025 학생정서·행동특성검사 및 관리 매뉴얼 16쪽; 2026 같은 매뉴얼 4·11·19쪽"},{"stage":"종결·사후","when":"연중","who":"학교","what":"예방교육","detail":"생명존중 및 자살예방 교육(사회정서교육)은 연간 6차시 기준이며 학년도 시작 전에 계획해 학기 중 실시한다. 학교의 장은 자살예방 교육을 실시해야 한다(결과 제출은 생략 가능).","basis":"학생 마음건강 지원 가이드북(2025) Q2; 자살예방법 제17조제1항"}],"deadlines":[{"what":"생명이 급한 상황 신고","limit":"즉시(119·112)","basis":"학생 마음건강 지원 가이드북(2025) Q5"},{"what":"자살위험 학생(우선관리군) 전문기관·병의원 의뢰","limit":"자살위험 확인 즉시(정서·행동 총점과 관계없이)","basis":"2026년 학생정서·행동특성검사 및 관리 매뉴얼 4·33쪽"},{"what":"우선관리 학생 학교상담","limit":"월 1회(면담)","basis":"2026년 학생정서·행동특성검사 및 관리 매뉴얼 5·35쪽"},{"what":"일반관리군 학교상담","limit":"분기별 1회(면담)","basis":"2026년 학생정서·행동특성검사 및 관리 매뉴얼 5·35쪽"},{"what":"보호자 동의 없이 정신건강 상태 검사를 한 경우 통보","limit":"지체 없이","basis":"학교보건법 제7조제6항"},{"what":"긴급지원 요건","limit":"상담·치료 권고 3회 이상 불이행(생명·신체 중대 위해 우려 시 1회 이상)","basis":"시행령 제31조의6제1항"},{"what":"긴급지원 결과 보호자 통지","limit":"지원이 끝난 후 즉시","basis":"시행령 제31조의6제3항"}],"dont":["자살 언급을 관심 끌기 등으로 치부하거나 위험 신호를 가볍게 여기기","비밀을 지키겠다고 약속해 안전에 필요한 지원을 보류하기","위험이 높은데 학생을 혼자 교실·상담실에 두거나 혼자 귀가시키기","교실·복도에서 공개적으로 캐묻거나 검사 결과·상담 내용을 노출하기","상처 사진을 찍어 돌리기","혼자 끌어안기 — 담임 한 명이 전담하지 말고 관리자·상담교사·Wee와 함께 한다"],"contacts":[{"name":"응급(구급)","tel":"119","note":"이미 다쳤거나 약물을 먹었거나 임박한 위험"},{"name":"경찰","tel":"112","note":"투신 위험·행방 모름 등 긴급 구조"},{"name":"자살예방상담전화","tel":"109","note":"24시간, 2024.1.1.부터 자살예방상담 통합 번호, 상담 내용 비밀 보장(위급 시 다른 기관에 도움 요청 가능). SNS 상담 '마들랜'도 있음"},{"name":"청소년전화","tel":"1388","note":"24시간 청소년 상담·사이버 상담"},{"name":"정신건강 상담전화","tel":"1577-0199","note":"24시간 정신건강 상담"},{"name":"보건복지상담센터","tel":"129","note":"전국민 마음투자 지원사업 문의"},{"name":"학생정신건강지원센터(학생마음건강중앙지원단)","tel":"043-710-4074","note":"대표번호, 학교 위기 자문·자료(smhrc.kr)"},{"name":"관할 Wee센터·정신건강복지센터","tel":"지역별","note":"교육지원청이 지정·안내한 기관 목록을 학기 초에 확보"}],"forms":["자살관련 면담 기록지(학교위기대응 안내서 2024 부록)","전문기관 의뢰서 및 동의서 양식(2026 정서·행동특성검사 매뉴얼 부록 113쪽)","전문기관 종결 보고서 양식(학교회신용)(같은 매뉴얼 117쪽)","학생 관리일지·상담일지(검사 관련 자료는 용도 소멸 즉시 파쇄)","보호자 미동의 기록, 상담·치료 권고 기록(위원회 심의 결과)","자살시도 사안 보고(서식·시기는 시도교육청 계획에 따름)"],"law":[{"name":"초·중등교육법","article":"제18조의5(학생의 정서·행동 지원 등)","point":"학교장은 전문가 의견을 들어 상담 권고, 상담 결과를 반영해 치료 권고·지원 가능. 보호자 협조 의무. 지속 권고에도 정당한 사유 없이 불이행하면 긴급지원(상담·치료를 받게 함) 가능. 2026학년도부터 시행"},{"name":"초·중등교육법 시행령","article":"제31조의5(상담 권고 등)","point":"외부 전문가(의사·정신건강전문요원·청소년상담사·임상심리사·전문상담교사 등) 의견 청취와 학교 내 위원회 심의 후 상담 권고. 반복 권고 시 생략 가능"},{"name":"초·중등교육법 시행령","article":"제31조의6(학생의 정서·행동 긴급지원)","point":"권고 3회 이상 불이행(생명·신체 중대 위해 우려 시 1회) + 정신건강의학과 전문의 1명 포함 전문가 3명 이상 의견 + 위원회 심의. 최소 범위, 끝난 뒤 즉시 보호자 통지"},{"name":"학교보건법","article":"제7조제6항","point":"정신건강 상태 검사는 필요하면 학부모 동의 없이 실시 가능, 이 경우 지체 없이 학부모에게 통보"},{"name":"학교보건법","article":"제11조제2항(치료 및 예방조치 등)","point":"정신건강 상태 검사 결과 필요하면 교육·상담·관리·전문상담기관 또는 의료기관 연계 등 조치"},{"name":"학교보건법","article":"제18조의2(비밀누설금지 등)","point":"건강검사 관련 업무로 알게 된 비밀을 누설하거나 목적 외로 이용 금지(위반 시 제19조 벌칙)"},{"name":"자살예방 및 생명존중문화 조성을 위한 법률","article":"제17조(자살예방 상담·교육)","point":"학교의 장은 자살예방 교육 실시(결과 제출은 생략 가능)"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조제2항","point":"교직원 등은 직무상 아동학대범죄를 알게 되거나 의심이 있으면 신고 의무(의료적 방임 포함 검토)"}],"faq":[{"q":"학생이 부모님께는 절대 말하지 말라고 합니다. 그래도 알려야 하나요?","a":"자해·자살처럼 생명·신체 안전에 직결되는 일은 전문가 도움을 받는 것이 원칙이고, 위험하면 비밀로 할 수 없음을 미리 분명히 알려 두어야 한다(비밀보장의 예외). 중간위험 이상이면 보호자에게 연락하고, 응급이면 즉각 알린다. 보호자가 학대 의심자라면 신고 내용을 미리 알리지 않는다."},{"q":"죽고 싶냐고 직접 물으면 오히려 부추기는 것 아닌가요?","a":"아니다. 절망적인 학생에게 자살사고를 찬찬히 묻는 것은 자살 행동으로 이어지지 않으며 오히려 보호할 수 있다고 교육부 매뉴얼이 밝히고 있다."},{"q":"보호자가 “우리 애 멀쩡하다”며 병원·상담을 거부합니다.","a":"2026년 3월 1일부터 학교장은 외부 전문가 의견과 위원회 심의를 거쳐 상담·치료를 권고할 수 있고, 3회 이상(생명·신체 중대 위해 우려 시 1회 이상) 권고에도 정당한 사유 없이 따르지 않으면 정신건강의학과 전문의 포함 전문가 3명 이상 의견과 심의를 거쳐 긴급지원(상담·치료를 받게 함)을 할 수 있다. 교육지원청 정신건강전문가 학교지원센터 긴급지원도 요청할 수 있다. 치료 거부가 의료적 방임 등 아동학대로 의심되면 교직원은 신고의무에 따라 신고하고, 학대 의심 보호자에게 신고 내용을 미리 알리지 않는다."},{"q":"자해와 자살시도는 어떻게 다른가요? 자해면 덜 급한가요?","a":"자해(비자살성 자해)는 죽을 의도 없이 심리적 고통을 줄이려는 행동이고 자살시도는 죽으려는 목적이 있다. 하지만 상처가 심하거나, 자살 의도가 있거나, 우울·불안 등이 함께 있으면 하나만 해당해도 외부 전문기관에 연계한다. 상처가 가벼워 보여도 고통이 작다는 뜻이 아니다."},{"q":"정서·행동특성검사에서 자살문항에 응답한 학생이 면담에선 장난이었다고 합니다.","a":"관심군은 면담 소견을 반영해 최종 확정한다. 정상군으로 바꾸려면 재검사·별도 심리검사 결과와 상담 내용 등을 근거로 협의체 회의에서 결정하고 내부결재를 거친다(2026 매뉴얼 20·23쪽)."},{"q":"검사 결과나 자살위기 사실을 생활기록부에 적나요?","a":"적지 않는다. 검사결과와 상담내용은 학교생활기록부·건강기록부에 기재하지 않고, 관련 교사만 공유하며 서면 검사지는 용도가 끝나면 파쇄한다."},{"q":"치료비가 걱정이라는 가정에는 무엇을 안내하나요?","a":"Wee센터·청소년상담복지센터·정신건강복지센터는 별도 비용 부담 없이 상담과 심층평가를 받을 수 있다(2026 매뉴얼 33쪽). 병원 진료·치료비는 시·도교육청의 학생 마음바우처(지원 금액·서류·우선순위는 시·도 계획에 따름, 가이드북상 1순위는 자살을 시도한 학생)를, 심리상담은 보건복지부 전국민 마음투자 지원사업(총 8회, 문의 129)을 안내한다."}],"record":"정서·행동특성검사 결과와 상담 내용은 학교생활기록부·건강기록부에 기재하지 않는다(서면 검사지는 용도 소멸 즉시 파쇄, 관련 교사만 공유). 학교는 관리일지·상담일지, 보고·보호자 연락·보호자 미동의 기록을 구체적으로 남긴다. 관심군의 전문기관 조치현황은 매뉴얼이 정한 방법으로 확인·관리한다. 자살시도 사안의 교육청 보고체계는 시도교육청 계획을 따른다.","deep":[{"title":"위험도는 이렇게 가린다","body":["교육부·학생정신건강지원센터의 면담 기록지는 다섯 가지를 묻는다. ① 죽고 싶다거나 죽는 게 낫겠다고 생각한 적이 있는지 ② 자살을 생각하고 있는지 ③ 최근 어떻게 죽을지 계획을 세운 적이 있는지 ④ 최근(6개월간) 그 계획을 실행해야겠다고 생각한 적이 있는지 ⑤ 죽으려고 행동을 해 본 적이 있는지. 여기에 무엇이 그렇게 힘든지를 묻는다.","③이나 ④ 중 하나라도 '예'면 응급 상황이다. ⑤만 '예'(③④ 아니오)면 과거 시도가 있으므로 높은위험, ①②가 모두 '예'이고 나머지가 '아니오'면 중간위험, 모두 '아니오'이거나 ①만 '예'면 위험성 없음 또는 낮은 위험이다.","선별 점수에만 의존하지 말고 면담을 함께 한다. 위험이 높거나 예측이 어려우면 응급 입원을 고려해야 한다는 것이 매뉴얼의 설명이다."],"basis":"학교위기대응 안내서(2024) 부록 '자살관련 면담 기록지'; 2025 정서·행동특성검사 매뉴얼 부록 201쪽"},{"title":"비밀보장의 예외 — 처음부터 말해 둔다","body":["학생은 자해·자살 생각을 털어놓으며 비밀을 요구하곤 한다. 교사는 학생이 실망해 다시 오지 않을까 두려워 비밀에 부치기 쉽지만, 생명과 신체 안전에 직결되는 사안은 알리고 전문가 도움을 받는 것이 원칙이다.","상태가 심각하지 않아 잠시 비밀로 할 때도 주의 깊게 관찰하고, 조금이라도 위험하면 더는 비밀로 할 수 없다는 점과, 필요하면 외부에 알리고 도움을 요청할 수 있다는 비밀보장의 예외 원칙을 미리 안내한다. 반복·심각한 자해에는 '절대 비밀' 약속을 하지 않는다.","반대로 검사결과·상담내용 같은 정보는 관련 교사만 공유하고, 건강검사 업무로 알게 된 비밀을 누설하면 처벌 대상이다(학교보건법 제18조의2·제19조). '보호자·전문기관에 알리는 것'과 '다른 사람에게 퍼뜨리는 것'은 다르다."],"basis":"단위학교 위기관리 가이드라인(서울시교육청) 자해 Q&A; 학교보건법 제18조의2"},{"title":"보호자가 거부할 때 — 2026학년도부터 달라진 절차","body":["2025년 4월 초·중등교육법에 제18조의5가 새로 생겨 2026학년도부터 시행된다. 학교장은 외부 전문가(의사, 정신건강전문요원, 청소년상담사, 임상심리사, 전문상담교사 등, 해당 학교 소속이 아닌 사람) 의견을 듣고 학교 내 위원회 심의를 거쳐 학생·보호자에게 상담을 권고한다. 상담 결과에 따라 치료 권고, 전문가 학교 방문 상담, 기관 연계, 학습지원을 할 수 있다. 보호자에게는 협조 의무가 있다.","상담 권고나 치료 권고를 3회 이상 받고도 정당한 사유 없이 따르지 않고 학교생활에 현저한 어려움이 있어 긴급한 학생에게는 교육감·교육장·학교장이 상담·치료를 받도록 할 수 있다(긴급지원). 생명·신체에 중대한 위해가 우려되면 권고 1회 이상이면 된다. 정신건강의학과 전문의 1명 이상을 포함한 전문가 3명 이상의 의견과 위원회 심의가 필요하며, 최소 범위로 하고 끝난 뒤 즉시 보호자에게 알린다.","세부 절차는 교육감이 정하므로 소속 시·도교육청 지침을 확인한다. 이 절차와 별개로 교육지원청 정신건강전문가 학교지원센터 긴급지원을 요청할 수 있고, 의료적 방임 등 아동학대가 의심되면 신고의무에 따라 신고한다."],"basis":"초·중등교육법 제18조의5·부칙(법률 제20862호); 시행령 제31조의5·제31조의6"},{"title":"정서·행동특성검사 관심군 후속 관리","body":["검사는 매년 4월 초1·초4·중1·고1(특수·각종학교 해당 학년)이 대상이고, 2024년부터는 모든 학년이 수시로 쓸 수 있는 마음EASY검사가 있다. 진단이 아닌 선별검사다.","중·고 학생은 자살 위험도 문항(AMPQ-Ⅲ-Ⅰ 53·57·58·59·63번, 63번 '예'는 3점) 합이 중1 남 5점·여 6점, 고1 남·여 4점 이상이면 우선관리군이다. 교사 평정(AMPQ-Ⅲ-T) 자살·자해 문항(7번) 2점 이상도 우선관리다. 초등은 자살 문항이 없으나 면담에서 자살위험이 확인되면 우선관리군에 준한다.","학교는 학교 내 관리체계 총괄(부장교사 이상)을 의무로 지정하고 학교장이 협의체를 구성한다. 자살위험군은 협의체 또는 위기관리위원회에서 개입·지원 방법을 정하고, 우선관리군은 월 1회, 일반관리군은 분기별 1회 면담한다. 결과는 서면(우편)으로 개별 통보하고, 필요하면 사전에 유선 안내한다. 전문기관 미연계 시 사유(학부모(학생) 거부, 출결문제, 기타)를 분류해 둔다."],"basis":"2026년 학생정서·행동특성검사 및 관리 매뉴얼 4~5·11~12·20·33~35·84~85쪽; 학생 마음건강 지원 가이드북(2025) Q3"},{"title":"자해를 발견했을 때 학교 흐름(서울시교육청 가이드라인 예시)","body":["최초 발견자는 즉각 의료 처치가 필요하면 보건실에 연락(필요 시 119)하고, 필요하지 않으면 자해 업무 담당자에게 인계한다. 보건실은 처치와 보호자 연락을, 담당자는 상황을 평가해 학교 대응 범위를 정한다.","상처가 심각함, 자살 의도가 있음, 우울·불안·충동조절 문제 같은 정서적 공존질환이 있음 — 셋 중 하나라도 있으면 외부 전문기관에 연계하고, 모두 아니면 학교 내 상담을 한다. 상처는 학생 동의를 받고 보되 계속 거부하면 강요하지 않는다.","관리자 보고와 보호자 안내·면담을 하고, 외부 의뢰는 보호자 동의 후 진행한다. 동의하지 않으면 '보호자 미동의'를 구체적으로 기록한다."],"basis":"단위학교 위기관리 가이드라인(서울시교육청) Ⅲ 자해행동 사안 개입"},{"title":"연계 뒤 복귀와 장기 관리","body":["자살시도로 병원에 간 청소년은 주요우울증·약물 남용·과거 시도·강한 자살 의지·치명적 시도·가정 내 학대·보호 능력 부족 등이 있으면 입원 치료가 권고된다. 학교는 의료기관·전문기관의 판단과 종결보고서(학교회신용)를 받아 학교 내 관리 계획에 반영한다.","복귀 후에는 위험도가 줄 때까지 면담·평가를 자주 반복하고, 담임·상담교사가 정기 면담(우선관리군 월 1회)을 이어 간다. 자해 학생은 자해가 더 보이지 않을 때까지 학생 동의하에 확인한다.","진급·전학으로 관리가 끊기지 않게 인수인계하고(전입교는 학부모 동의 후 원적교에 공문 요청), 기록은 생활기록부가 아닌 별도 관리일지로 둔다."],"basis":"2025 정서·행동특성검사 매뉴얼 부록 201·203쪽; 2026 같은 매뉴얼 35쪽; 단위학교 위기관리 가이드라인"}],"tables":[{"title":"위험 수준별 조치(면담 기록지 기준)","head":["위험 수준","판정 기준(문항 응답)","학교 조치"],"rows":[["없음·낮은 위험","모두 '아니오', 또는 ①(죽고 싶다는 생각)만 '예'","교내 상담 인력의 지속적 관찰과 상담"],["중간위험","①② 모두 '예', 나머지 '아니오'(계획·의도·시도 없음)","학부모 연락, 자살예방센터·Wee센터·정신건강복지센터 등 교육청 지정 전문기관 의뢰"],["높은위험","⑤(과거 행동)가 '예'이고 ③④는 '아니오'","학부모 연락, 자살예방센터 또는 전문병원 진료 권유"],["응급 상황","③(최근 계획) 또는 ④(6개월 내 실행 의도) 중 하나라도 '예'","학생을 혼자 두지 않고 안전조치, 부모에게 즉각 알림, 자살예방센터·전문병원 진료 적극 권유(생명 위급 시 119)"]],"note":"출처: 학교위기대응 안내서(교육부·한국교육환경보호원 학생정신건강지원센터, 2024 개정) 부록 자살관련 면담 기록지. 점수보다 면담이 우선."},{"title":"정서·행동특성검사 우선관리군(자살위험 포함) 기준","head":["대상","자살 관련 문항 합 기준","조치"],"rows":[["중1(AMPQ-Ⅲ-Ⅰ)","남 5점 이상 / 여 6점 이상","우선관리 — 전문기관 우선의뢰 및 학교 내 관리"],["고1(AMPQ-Ⅲ-Ⅰ)","남 4점 이상 / 여 4점 이상","우선관리 — 전문기관 우선의뢰 및 학교 내 관리"],["교사용(AMPQ-Ⅲ-T)","문항 7(자살 및 자해) 2점 이상","우선관리(자살위기)"],["초1·초4(CPSQ-Ⅱ-Ⅰ)","자살 문항 없음","면담에서 자살생각 확인 시 우선관리군에 준해 조치"]],"note":"자살 위험도 문항: AMPQ-Ⅲ-Ⅰ 53·57·58·59·63번(63번 '예'는 3점). 교사용은 7번 문항 2점 이상. 면담에서 자살위험이 확인되면 총점과 관계없이 우선관리군. 출처: 2026년 학생정서·행동특성검사 및 관리 매뉴얼 20·84~85쪽."},{"title":"보호자가 거부할 때 쓸 수 있는 단계","head":["단계","요건","절차","근거"],"rows":[["상담 권고","검사 결과·생활지도 결과 필요하다고 판단","외부 전문가 의견 + 학교 내 위원회 심의(반복 권고 시 생략 가능), 상담 방법 안내","법 제18조의5①, 영 제31조의5"],["치료 권고·지원","상담 결과 반영","위원회 심의 후 치료 권고, 방문 상담, 기관 연계, 학습지원","법 제18조의5②, 영 제31조의5④"],["긴급지원","권고 3회 이상 불이행(생명·신체 중대 위해 우려 시 1회 이상) + 학교생활 현저한 어려움","전문의 1명 포함 전문가 3명 이상 의견 + 위원회 심의, 최소 범위, 종료 후 즉시 보호자 통지","법 제18조의5④, 영 제31조의6"],["정신건강전문가 학교지원(긴급)","보호자가 인정 안 함·치료 여력 없음 + 시급·심각","교육지원청에 공문·문서24 등으로 신청","학생 마음건강 지원 가이드북(2025) Q1"]],"note":"법 제18조의5와 시행령 제31조의5·제31조의6은 2026.3.1.부터 시행. 세부 사항은 교육감이 정하므로 소속 시·도교육청 지침 확인."}],"sources":[{"title":"학생 마음건강 지원 가이드북","publisher":"교육부","year":2025,"url":"https://smhrc.kr/dataCenter/dataView?dataId=493"},{"title":"2025년 학생정서·행동특성검사 및 관리 매뉴얼(자살 신호 이해 참고)","publisher":"교육부·학생마음건강중앙지원단","year":2025,"url":"https://www.smhrc.kr/dataCenter/dataView?dataId=470"},{"title":"2026년 학생정서·행동특성검사 및 관리 매뉴얼","publisher":"교육부·학생마음건강중앙지원단","year":2026,"url":"https://www.smhrc.kr/dataCenter/dataView?dataId=536"},{"title":"위(Wee) 프로젝트 지원 체계","publisher":"교육부 위(Wee) 프로젝트","year":2026,"url":"https://wee.go.kr/board?bbsId=BOARD00009&menuId=MENU002060200000000"},{"title":"학교위기대응 안내서(PFA-S) 2024 일부 개정","publisher":"교육부·한국교육환경보호원 학생정신건강지원센터","year":2024,"url":"https://smhrc.kr/dataCenter/dataView?dataId=461"},{"title":"단위학교 위기관리 가이드라인","publisher":"서울특별시교육청","year":2021,"url":"https://www.schoolhealth.kr/web/sht/file/schoolFileDownload.do?lstnum1=4493&fileSeq=1"},{"title":"초·중등교육법(시행 2026.9.11.) 제18조의5","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법"},{"title":"초·중등교육법 시행령(시행 2026.9.11.) 제31조의5·제31조의6","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/초·중등교육법시행령"},{"title":"학교보건법(시행 2025.10.1.)","publisher":"국가법령정보센터","year":2025,"url":"https://www.law.go.kr/법령/학교보건법"},{"title":"자살예방 및 생명존중문화 조성을 위한 법률(시행 2026.5.12.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/자살예방및생명존중문화조성을위한법률"},{"title":"자살예방상담전화 109 안내","publisher":"보건복지부 보건복지상담센터","year":2026,"url":"https://www.129.go.kr/109"},{"title":"분산된 자살예방 상담전화 1월 1일부터 '109'로 통합 운영(보도자료)","publisher":"보건복지부","year":2024,"url":"https://www.mohw.go.kr/board.es?mid=a10503010100&bid=0027&act=view&list_no=1479607"},{"title":"아동학대 예방 및 대처요령 교육부문 가이드북(4판, 2024.12.)","publisher":"교육부 (경기도교육청 자료실 게시)","year":2024,"url":"https://www.goe.go.kr/goe/na/ntt/selectNttInfo.do?mi=10961&nttSn=1054503"}],"verified":"2026-09-24","uncertain":["교육부 「학생 자살위기 대응 매뉴얼」 단독 최신판 원문은 찾지 못했다. 「2026년 학생정서·행동특성검사 및 관리 매뉴얼」과 「학생 마음건강 지원 가이드북」(2025), 「학교위기대응 안내서」(2024)를 함께 확인했다.","시·도교육청별 자체 자살위기 대응 매뉴얼과 관할 Wee센터·정신건강복지센터 연락처는 지역마다 다르다. 학기 초 소속 교육(지원)청 안내 목록을 확보해 쓴다.","자살'시도' 사안의 교육청 보고 서식·기한은 시도교육청 계획에 따른다(가이드북 Q5). 소속 교육청 기준을 확인한다.","긴급지원의 세부 절차(교육감 고시 전문가 범위 등)는 교육감이 정하므로 시·도마다 다를 수 있다 — 소속 교육청 기준을 확인한다.","'단위학교 위기관리 가이드라인'은 서울시교육청 자료(학생정신건강지원센터 참고문헌상 2021)로, 비밀보장 예외·자해 대응 흐름 설명에만 썼다.","학생정신건강지원센터 대표번호는 누리집 하단(043-710-4074) 기준이며, 2024 안내서에 적힌 옛 번호(02-6959-4638)와 다르다.","2026년 나이스 학생정서·행동특성검사 사용자 설명서가 별도 게시되어 있으나, 화면별 입력 방법은 이 검수에서 대조하지 않았다.","2026 정서·행동특성검사 매뉴얼에는 2025판의 '우선관리군 위기대응팀 운영 의무화', '월 1회 이상' 같은 문구가 없고 '위기관리위원회 등에서 개입 결정', '월 1회 면담'으로 바뀌어 2026판 기준으로 적었다.","'단위학교 위기관리 가이드라인'(서울, 2021)은 치료 거부 보호자에게 아동학대 신고의무를 서면 고지할 수 있다고 하나, 교육부 아동학대 가이드북(2024)은 학대 의심자에게 신고 내용을 미리 알리지 말라고 해 서면 고지 안내는 뺐다.","\"자살 방법을 자세히 묻지 말라\"는 원문 근거를 찾지 못했고, 면담 기록지·가이드라인은 계획·방법을 직접 묻도록 해 dont에서 뺐다."],"related":["student-death","child-abuse","emergency-medical"]},{"id":"child-abuse","title":"아동학대 의심 신고 (가정 내 학대·방임)","aka":["아동학대","학대 의심","방임","멍 자국","맞고 와요","집에 가기 싫대요","밥을 못 먹어요","가정폭력","112 신고","아동학대전담공무원","신고의무자","보호자가 때려요","씻지 않고 와요","연락 두절","비밀전학"],"category":"학생 보호·위기","urgency":"즉시","roles":["알게 된 교직원(담임·교과·상담·보건교사 등)","교감","교장","아동학대 업무 담당자","Wee클래스(상담교사)"],"summary":"교원은 아동학대처벌법상 신고의무자라서 직무 중 아동학대범죄를 알게 되거나 의심이 있으면 관할 시·도·시·군·구 또는 수사기관에 즉시 신고해야 한다. 아동학대 신고전화는 112다. 확신이 들 때까지 기다리지 말 것, 보호자에게 먼저 묻지 말 것, 아이에게 캐묻지 말 것이 핵심이다. 신고 뒤에는 경찰·지자체가 조사와 보호조치를 하고, 학교는 조사 협조, 비밀 유지, 출결·전학 지원, 재학대 관찰을 맡는다.","first":["아이가 지금 위험한지부터 본다. 다쳤거나 집에 보내면 위험하면 학교 안에서 안전하게 보호한다","112 또는 관할 시·도·시·군·구나 수사기관에 바로 신고한다. 아동학대 신고전화는 112다. 학교(학교장) 명의로도 신고할 수 있다","학교장에게 보고한다. 보고만 하고 끝내면 신고로 인정되지 않는다","학대 의심 보호자에게 신고 사실이나 조사 계획을 미리 알리거나 직접 추궁하지 않는다","본 것·들은 것을 아이 말 그대로, 날짜·시간과 함께 적어 둔다"],"steps":[{"stage":"알게 됨·신고","when":"징후를 알아챈 즉시","who":"알게 된 교직원","what":"학대 의심 징후 확인","detail":"교육부 가이드북 4판은 다음을 «신고해야 하는 경우»로 제시한다: 폭력·유기 정황, 보호자가 정당한 이유 없이 아동 면담을 거절, 소재 불명, 출석 확인이 안 되거나 이유 없이 2일 이상 연락 두절, 보호자 연락·영상통화·가정방문으로도 의심이 해소되지 않음, 아이가 학대를 직접 말함, 가정폭력 사안 등. 이는 실무상 징후 예시이며, 각각이 법률에 열거된 별도의 신고 요건이라는 뜻은 아니다. 법정 신고의무는 직무 중 아동학대범죄를 알게 되거나 의심이 생겼을 때 발생한다.","basis":"아동학대처벌법 제10조제2항제20호; 교육부 가이드북 4판 62쪽"},{"stage":"알게 됨·신고","when":"즉시","who":"알게 된 교직원","what":"아이의 안전 확보","detail":"심각한 위해가 우려되면 경찰·아동학대전담공무원이 올 때까지 학교에서 안전하게 보호한다. 성학대가 의심되면 증거 확보를 위해 몸을 씻기거나 옷을 갈아입히지 않는다. 가이드북은 가능한 한 증거 사진·동영상 등을 확보하라고 안내한다. 눈에 보인 상처와 아이가 자발적으로 말한 내용을 사실대로 기록한다.","basis":"가이드북 4판 58·63쪽"},{"stage":"알게 됨·신고","when":"즉시","who":"알게 된 교직원(또는 학교장 명의)","what":"112 또는 관할 시·도·시·군·구·수사기관에 신고","detail":"학교명, 아이의 현재 상태(안전·응급 여부, 심신 상태, 가정 상황), 인적사항, 의심되는 사람(몰라도 신고 가능), 형제자매 등 다른 아동 유무를 말한다. 경찰·전담공무원 동행출동을 부탁하고, 조사 시간·장소·출입 동선 등 비밀 보장 요청을 할 수 있다. 회신 번호는 학교 대표번호를 줘도 된다.","basis":"아동학대처벌법 제10조제2항; 가이드북 4판 61~62쪽"},{"stage":"초기 대응","when":"신고 직후","who":"신고자","what":"학교장 보고","detail":"관계자 최소 인원 외에는 아이·신고자 정보를 공유하지 않는다.","basis":"가이드북 4판 58쪽"},{"stage":"초기 대응","when":"신고 직후","who":"학교장(업무 담당자)","what":"교육(지원)청 사안보고","detail":"공문은 비공개(6호)·목록 비공개·열람 불가, 열람 제한 기간 설정 안 함. 신고자 이름을 쓰거나 추정할 수 있게 쓰지 않는다. 가이드북 \u003c서식2>(사안보고 공문), \u003c서식3>(사안보고서).","basis":"가이드북 4판 64쪽"},{"stage":"초기 대응","when":"즉시","who":"신고받은 기관","what":"조사·수사 착수와 현장 출동","detail":"신고의무자 신고가 있으면 시·도, 시·군·구, 수사기관은 정당한 사유가 없으면 즉시 조사·수사에 착수한다. 경찰과 아동학대전담공무원은 지체 없이 현장에 출동한다.","basis":"아동학대처벌법 제10조제4항·제11조제1항"},{"stage":"조사·확인","when":"현장 출동·조사 때","who":"학교","what":"조사 협조","detail":"아이가 편하게 말할 수 있는 독립 공간을 내준다(사전에 장소·시간 협의). 다른 학생 눈에 띄지 않게 한다. 담임·상담교사는 필수 면담 대상이다. 아이가 원하면 담임·상담교사가 동석할 수 있으나 진술에 끼어들면 안 된다. 조사자는 학대행위자와 분리된 곳에서 조사해야 한다.","basis":"아동학대처벌법 제11조제5항·제11조의2제1항; 가이드북 4판 58·70·124쪽"},{"stage":"조사·확인","when":"재학대 위험이 급박할 때","who":"경찰·아동학대전담공무원","what":"응급조치","detail":"학대 현장에 출동했거나 발견한 경우, 또는 현장 밖에서 피해가 확인되고 재학대 위험이 급박·현저하면 경찰·아동학대전담공무원이 즉시 응급조치를 한다. 학대 행위 제지, 행위자 격리, 보호시설·의료기관·연고자 인도가 포함된다. 제12조제1항제2호부터 제5호까지의 조치는 72시간을 넘을 수 없다. 토요일·공휴일 포함 및 피해아동 보호상 필요가 인정되면 48시간 범위에서 연장할 수 있고, 제15조제2항에 따른 검사 청구 시 법원의 임시조치 결정 때까지 기간이 연장된다.","basis":"아동학대처벌법 제12조"},{"stage":"조사·확인","when":"재발 우려가 크고 급할 때","who":"사법경찰관 → 검사 → 법원","what":"긴급임시조치·임시조치","detail":"경찰의 긴급임시조치, 법원의 임시조치로 행위자 퇴거 등 격리, 접근금지, 친권 행사 제한·정지, 상담·교육 위탁, 의료기관·요양시설 위탁, 유치장·구치소 유치 등을 한다.","basis":"아동학대처벌법 제13조·제19조; 가이드북 4판 71쪽"},{"stage":"조사·확인","when":"조사 뒤","who":"지자체(아동학대전담공무원)","what":"아동학대 사례판단과 결과 공유","detail":"지자체는 복지적 관점에서 아동학대 여부를 판단한다. 교육(지원)청은 사례판단 결과를 학교장과 공유하고 피해아동 지원 방안(교육복지 등)을 마련한다.","basis":"가이드북 4판 70·124쪽"},{"stage":"심의·결정","when":"수사 종결","who":"경찰 → 검사","what":"송치와 검사 결정","detail":"경찰이 사건을 검사에게 송치하면, 검사는 불기소, 조건부 기소유예(상담·치료·교육 조건), 아동보호사건 송치(가정법원 보호처분), 기소(형사재판) 중에서 정한다.","basis":"아동학대처벌법 제24조·제26조·제27조; 가이드북 4판 124쪽"},{"stage":"심의·결정","when":"필요 시","who":"가정법원(청구: 피해아동·법정대리인·검사·변호사·시도지사·시군구청장)","what":"피해아동보호명령","detail":"행위자 퇴거·격리, 접근·전기통신 접근 제한, 보호시설 위탁, 치료·상담 위탁, 연고자 가정위탁, 친권·후견인 권한 제한·정지 등. 아동보호전문기관장은 시도지사·시군구청장에게 청구를 요청할 수 있다.","basis":"아동학대처벌법 제47조"},{"stage":"불복·구제","when":"피해아동보호명령·임시보호명령 결정에 불복할 때","who":"법정 항고권자(사안·결정 종류별 상이)","what":"항고·재항고","detail":"피해아동보호명령(연장 포함), 그 취소·종류 변경, 임시보호명령 및 그 취소·종류 변경 결정에 법령 위반, 중대한 사실오인 또는 현저한 부당성이 있으면 법정 항고권자가 항고할 수 있다. 항고장은 결정을 한 원심 법원에 제출하며, 결정 고지를 받은 날부터 7일 이내다. 항고심은 가정법원 본원합의부(가정법원이 없는 지역은 지방법원 본원합의부)가 담당하고, 항고·재항고는 원결정의 집행을 정지하지 않는다. 보호명령 청구가 기각된 경우 항고권자는 피해아동·법정대리인·검사·변호사·시도지사·시군구청장으로 별도 규정된다. 이 절차는 해당 보호명령 결정에 대한 것이며 형사재판·학교 징계 등 다른 결정의 불복기간을 뜻하지 않는다. 아동보호전문기관장은 시도지사 또는 시군구청장에게 항고를 요청할 수 있다.","basis":"아동학대처벌법 제57조; 가정폭력처벌법 제49조제3항·제50조·제53조"},{"stage":"조치·이행","when":"보호조치가 내려지면","who":"학교장·담임","what":"출결·학적 처리","detail":"「2026학년도 학교생활기록부 기재요령」에 따르면, 아동학대·가정폭력 예방을 위해 지방자치단체가 법에 따라 분리보호한 학생은 위탁학생으로 등록·관리하고 보호기관의 출결을 인정한다. 평가에 참여하지 못한 경우 인정점은 시·도교육청 학업성적관리지침과 학교 규정에 따른다. 피해학생의 전학·취학 지원과 가해자(친권자 포함)에 대한 비밀처리도 2026 기재요령을 따른다. 다만 신고 후 친족 집에 머무는 등 이 기준의 ‘지자체 분리보호’에 해당하지 않는 결석의 인정 여부는 자동으로 정해지지 않으므로 소속 교육청에 확인한다.","basis":"2026학년도 학교생활기록부 기재요령(초·중·고), 아동학대처벌법 제35조제3항; 2024 가이드북 71·126쪽"},{"stage":"조치·이행","when":"계속","who":"모든 교직원","what":"비밀 유지","detail":"피해아동의 취학·진학·전학 사실은 아동학대행위자인 친권자를 포함해 누구에게든지 정당한 사유 없이 누설해서는 안 된다. 보호자의 문의에도 법정 비밀유지 의무와 아동 안전을 우선 고려한다. 언론 대응 창구는 관리자로 한정한다.","basis":"아동학대처벌법 제35조제3항; 가이드북 4판 64·126쪽"},{"stage":"조치·이행","when":"조사 이후","who":"담임·상담교사","what":"아이를 평소처럼 대하고 경과 관찰","detail":"학대 사실을 알고 있다는 이유로 아이를 불필요하게 특별 취급하거나 소문을 만들지 않되, 안전·학습·상담 필요를 계속 살핀다. 심리 상담은 Wee클래스·Wee센터·보건교사·외부 전문기관으로 연계한다. 필요하면 아동보호전문기관과 상황을 공유하고, 지자체 통합사례회의에 참석한다.","basis":"가이드북 4판 63·71·91쪽"},{"stage":"조치·이행","when":"재학대가 의심되면","who":"알게 된 교직원","what":"다시 112 신고","detail":"재학대 발생 시 즉시 112에 신고하고, 변동 사항은 교육(지원)청에 수시 보고한다.","basis":"가이드북 4판 58·71쪽"},{"stage":"조치·이행","when":"신고 후 보호자 항의·협박이 오면","who":"학교장","what":"신고한 교원 보호","detail":"누구든지 신고자의 인적사항이나 신고자임을 미루어 알 수 있는 사실을 다른 사람에게 알려주거나 공개해서는 안 된다. 보호자 등이 신고자를 특정해 물어도 알려주지 않는다. 학교장은 신고로 생긴 민원에 민원처리 책임자로서 대처하고 신고 교원을 보호하도록 노력해야 한다. 보복 우려가 있으면 신고한 교원(또는 법정대리인·친족)이 「특정범죄신고자 등 보호법」에 따라 재판장·검사 또는 주거지·현재지 관할 경찰서장에게 신변안전조치를 신청할 수 있다. 협박 등은 교육활동 침해 절차에 따른 보호를 검토한다.","basis":"아동학대처벌법 제10조제3항·제10조의2·제10조의3; 특정범죄신고자 등 보호법 제13조제3항; 교원지위법 제19조·제20조; 가이드북 4판 67~68쪽"},{"stage":"불복·구제","when":"친권자의 친권 남용·현저한 비행·아동학대 등 중대한 사유가 있을 때","who":"학교장","what":"친권상실 등 선고 청구 요청","detail":"학교장은 시도지사·시군구청장·검사에게 가정법원에 친권상실·일시정지·일부제한 등 선고를 청구하도록 요청할 수 있다. 요청받은 기관은 30일 안에 청구 여부와 이유를 서면으로 알려야 하고, 결과에 이의가 있으면 학교장은 통보받은 날부터 30일 안에 직접 가정법원에 청구할 수 있다.","basis":"아동복지법 제18조제2항~제5항"},{"stage":"불복·구제","when":"미신고로 과태료를 받았을 때","who":"과태료를 받은 교직원","what":"과태료 이의제기","detail":"과태료 부과 통지를 받은 날부터 60일 안에 부과한 행정청에 서면으로 이의제기할 수 있다. 이의제기하면 부과처분은 효력을 잃고, 행정청은 이의제기를 받은 날부터 14일 안에 관할 법원에 통보한다(이의제기를 철회했거나 이의가 이유 있어 과태료를 부과할 필요가 없다고 인정되면 통보하지 않는다). 그 뒤는 법원 과태료 재판으로 정해진다.","basis":"아동학대처벌법 제63조; 질서위반행위규제법 제20조·제21조"},{"stage":"종결·사후","when":"사례관리 기간","who":"아동보호전문기관·학교","what":"사례관리와 종결","detail":"아동보호전문기관이 피해아동 상담·의료지원·심리치료와 행위자 보호처분 이행을 관리한다. 학교는 아이의 심리와 재학대 여부를 세심히 관찰하고, 변동 사항이 생기면 교육(지원)청에 보고한다. 사망 등 중대 사건이면 다른 학생 트라우마 상담도 고려한다.","basis":"가이드북 4판 63·71쪽"},{"stage":"종결·사후","when":"매년","who":"학교장","what":"신고의무자 교육 실시·결과 제출","detail":"학교 소속 아동학대 신고의무자에게 매년 1시간 이상 교육을 실시하고 결과를 관계 중앙행정기관에 제출한다. 교육에는 신고의무 관련 법령, 발견 시 신고 방법, 피해아동 보호 절차를 포함하며 집합·시청각·인터넷 강의로 할 수 있다. 신고의무자 교육과 공공부문 예방교육은 근거 법령과 대상이 다르므로, 실적 등록 경로와 인정 콘텐츠의 세부 기준은 현행 아동권리보장원·교육청 안내를 확인한다.","basis":"아동복지법 제26조제3항; 아동복지법 시행령 제26조제1항·제3항·제5항; 아동권리보장원 아동복지통합서비스 사이버교육센터 실적등록 안내"}],"deadlines":[{"what":"수사기관·시군구 신고","limit":"직무 중 알게 되거나 의심이 든 즉시","basis":"아동학대처벌법 제10조제2항"},{"what":"신고받은 기관의 조사·수사 착수","limit":"정당한 사유 없으면 즉시","basis":"아동학대처벌법 제10조제4항"},{"what":"응급조치(격리·인도)","limit":"제12조제1항제2호~제5호 조치 72시간 이내(토요일·공휴일 포함 + 보호상 필요 인정 시 48시간 범위 연장; 검사 청구 시 법원 결정 때까지)","basis":"아동학대처벌법 제12조제3항"},{"what":"친권상실 선고 청구 요청에 대한 기관 답변","limit":"요청받은 날부터 30일 이내","basis":"아동복지법 제18조제4항"},{"what":"학교장의 직접 가정법원 청구","limit":"처리결과를 통보받은 날부터 30일 이내","basis":"아동복지법 제18조제5항"},{"what":"과태료 이의제기","limit":"부과 통지를 받은 날부터 60일 이내","basis":"질서위반행위규제법 제20조"},{"what":"피해아동보호명령 등 법정 결정 항고","limit":"결정을 고지받은 날부터 7일 이내(해당 보호명령·임시보호명령 결정에 한함)","basis":"아동학대처벌법 제57조제4항; 가정폭력처벌법 제49조제3항"}],"dont":["학대 의심 보호자에게 먼저 확인·추궁해 아동을 압박하거나 신고·조사 계획을 알리기","학교장·교육청에 보고하거나 아동보호전문기관에 상담만 하고 끝내지 않는다 — 수사기관·시군구에 신고한 게 아니면 신고로 인정되지 않는다","아동에게 유도·반복 질문으로 사건을 캐묻거나 교직원이 직접 학대 여부를 판단하기","학대 여부를 학교가 확정할 때까지 신고를 미루지 않는다 — 직무 중 알게 되거나 의심이 생기면 법정 신고처에 즉시 신고한다","신고한 사람이 누구인지 동료·보호자에게 말하거나 공문에 드러나게 쓰지 않는다 — 형사처벌 대상","경찰을 기다리며 아이 손을 잡고 복도에 서 있지 않는다 — 다른 학생에게 피해 사실이 노출된다","언론 인터뷰에 혼자 응하지 않는다 — 창구는 관리자로 한정"],"contacts":[{"name":"아동학대 신고전화","tel":"112","note":"관할 시·도, 시·군·구 또는 수사기관에도 신고할 수 있다."},{"name":"보건복지상담센터","tel":"129","note":"제도·절차 문의용 상담 전화(신고는 112·시군구)"},{"name":"장애인권익옹호기관","tel":"1644-8295","note":"장애아동 학대 의심 시 신고처(수사기관 112도 가능)"}],"forms":["2024 교육부 가이드북 예시 서식(2): 사안보고 공문","2024 교육부 가이드북 예시 서식(3): 아동학대 사안보고서","2024 교육부 가이드북 예시 서식(4·5): 출결인정 협조 요청·내부결재 기안문 (현행 서식은 교육청 확인)","2024 교육부 가이드북 예시 서식(6·8·9): 등교학습 신청·지원 요청 (현행 서식은 교육청 확인)","2024 교육부 가이드북 예시 서식(7): 학교 의견 제출서","2024 교육부 가이드북 예시 서식(11~15): 비밀전학 관련 (현행 서식·절차는 교육청 확인)","2024 교육부 가이드북 예시 서식(1): 신고의무자 교육 결과보고서 (현행 실적 제출 방법은 확인)","관찰·면담 기록(날짜·시간·아이가 한 말 그대로·본 상처 위치와 모양)"],"law":[{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조제2항제20호(신고의무)","point":"초·중등학교의 장과 그 종사자는 직무 중 아동학대범죄를 알게 되거나 의심이 있으면 시·도, 시·군·구 또는 수사기관에 즉시 신고해야 한다"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조제3항·제62조제2항(신고인 비밀)","point":"누구든지 신고인의 인적사항 또는 신고인임을 미루어 알 수 있는 사실을 다른 사람에게 알려주거나 공개·보도해서는 안 된다. 위반하면 3년 이하 징역 또는 3천만원 이하 벌금(제62조제2항)."},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조의2(불이익조치 금지)·제62조의2","point":"신고를 이유로 한 불이익조치는 금지된다. 파면·해임·해고 등 신분상실 조치는 2년 이하 징역 또는 2천만원 이하 벌금, 법에 열거된 그 밖의 인사·근무상 불이익조치는 1년 이하 징역 또는 1천만원 이하 벌금 대상이다."},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제10조의3(신고자 보호조치)","point":"특정범죄신고자 등 보호법 제7조~제13조 준용(인적사항 기재 생략, 신변안전조치 등)"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제63조제1항제2호(과태료)","point":"정당한 사유 없이 신고하지 않은 신고의무자에게 1천만원 이하 과태료. 기관이 아니라 사람 단위로 부과"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제11조·제11조의2(현장출동·조사)","point":"경찰·전담공무원 즉시 현장출동, 학대행위자와 분리된 곳에서 조사. 관계인은 정당한 사유 없으면 출석·진술·자료제출 요구에 따라야 한다"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제12조·제13조·제19조·제47조","point":"응급조치(72시간), 긴급임시조치, 임시조치, 피해아동보호명령"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제35조(비밀엄수)","point":"학교 교직원은 피해아동의 취학·진학·전학 사실을 학대행위자인 친권자를 포함하여 정당한 사유 없이 누설해서는 안 된다."},{"name":"아동복지법","article":"제18조제2항~제5항","point":"학교장은 친권상실 등 선고 청구를 요청할 수 있고, 처리 결과에 이의가 있으면 30일 내 직접 가정법원에 청구할 수 있다"},{"name":"아동복지법","article":"제26조제3항(신고의무자 교육)","point":"신고의무자가 소속된 기관의 장은 소속 신고의무자에게 신고의무 교육을 실시하고 결과를 제출해야 한다"},{"name":"아동학대범죄의 처벌 등에 관한 특례법","article":"제57조(항고와 재항고)","point":"피해아동보호명령 및 임시보호명령 관련 법정 결정의 항고권자·사유를 정한다. 항고 기간·제출·집행 효력은 같은 조 제4항에서 준용하는 가정폭력처벌법 제49조제3항·제50조~제53조에 따른다"},{"name":"가정폭력범죄의 처벌 등에 관한 특례법","article":"제49조제3항·제50조·제53조(항고기간·제출·집행)","point":"항고는 결정 고지일부터 7일 안에 하고 원심 법원에 항고장을 제출한다. 항고·재항고는 결정의 집행을 정지하지 않는다"}],"deep":[{"title":"아이와 이야기할 때","body":["교사는 조사관이 아니다. 목적은 아이가 지금 안전한지 확인하고 곁에 있다는 걸 알려주는 것이다. 면담 전에 동의를 구하고, 부드러운 표정과 편한 말투로 일상적인 이야기부터 시작한다.","사건을 캐묻거나 학대 여부를 유도하는 질문을 하지 않는다. 반복 질문은 아이에게 부담을 주고 나중 조사에 영향을 줄 수 있다. 아이가 자발적으로 말한 내용은 그대로 기록하고 신고한다.","민감한 내용이나 전문 상담은 Wee클래스·Wee센터, 외부 전문기관으로 넘긴다."],"basis":"가이드북 4판 63·91~95쪽"},{"title":"신고 뒤 경찰과 지자체가 하는 일","body":["신고를 받으면 경찰과 아동학대전담공무원이 지체 없이 현장에 출동한다. 재학대 위험이 급박하면 응급조치(행위자 격리, 아이를 보호시설·병원·연고자에게 인도)를 한다. 이 가운데 제12조제1항제2호부터 제5호까지의 조치에는 72시간 제한이 적용되고, 토요일·공휴일 포함 및 보호상 필요 인정 등 법정 요건을 충족하면 48시간 범위에서 연장할 수 있다. 검사가 법원에 임시조치를 청구하면 법원 결정 때까지 기간이 연장된다. 그 뒤 경찰의 긴급임시조치나 법원의 임시조치로 이어질 수 있다.","지자체는 복지적 관점에서 아동학대 여부를 판단하고 사례관리를 한다. 경찰은 수사해 검사에게 송치하고, 검사는 불기소, 조건부 기소유예, 가정법원 아동보호사건 송치, 기소 중에서 정한다. 가정법원은 피해아동보호명령으로 접근금지·보호위탁·친권 제한 등을 할 수 있다."],"basis":"아동학대처벌법 제11조~제13조·제19조·제24조~제27조·제47조"},{"title":"학교에 남는 일: 출결·전학·비밀","body":["「2026학년도 학교생활기록부 기재요령」에 따르면, 아동학대·가정폭력 예방을 위해 지방자치단체가 법에 따라 분리보호한 학생은 위탁학생으로 등록·관리하고 보호기관의 출결을 인정한다. 평가에 참여하지 못한 경우 인정점은 시·도교육청 학업성적관리지침과 학교 규정에 따른다. 피해학생의 전학·취학 지원과 가해자(친권자 포함)에 대한 비밀처리도 2026 기재요령을 따른다. 다만 신고 후 친족 집에 머무는 등 이 기준의 ‘지자체 분리보호’에 해당하지 않는 결석의 인정 여부는 자동으로 정해지지 않으므로 소속 교육청에 확인한다.","2026학년도 학교생활기록부 기재요령은 피해학생의 주소지 외 취학 지원, 주소 이전 없는 전학 신청 시 객관적 자료를 통한 전입·편입 허가, 가해자(친권자 포함)에 대한 학교·거주지·연락처 비밀처리도 규정한다. 보호기관 이용과 별개로 친족 집에 머무는 사례 등 요령의 적용 범위가 불명확하면 소속 시·도교육청에 확인한다."],"basis":"교육부 2026학년도 학교생활기록부 기재요령(초등 46·149쪽, 중등·고등 해당 절·참고자료); 아동학대처벌법 제35조제3항; 2024 가이드북 71·126쪽"},{"title":"신고한 교사는 이렇게 보호된다","body":["누구든지 신고인의 인적사항이나 신고인임을 미루어 알 수 있는 사실을 다른 사람에게 알려주거나 공개·보도할 수 없고, 어기면 3년 이하 징역 또는 3천만원 이하 벌금이다. 학교는 보호자가 신고자를 특정해 물어도 밝히지 않고, 신고자도 자신이 신고했다고 밝힐 필요가 없다. 사건 기록과 사안보고서에서도 신고자를 추정할 수 있게 쓰지 않는다.","보복 우려가 있으면 신고자(법정대리인·친족 포함)가 「특정범죄신고자 등 보호법」에 따라 재판장·검사 또는 주거지·현재지 관할 경찰서장에게 신변안전조치를 신청할 수 있다. 보호자가 신고를 이유로 교사를 협박하면 교육활동 침해 절차에 따른 보호를 검토한다."],"basis":"아동학대처벌법 제10조제3항·제10조의3·제62조제2항; 특정범죄신고자 등 보호법 제13조; 가이드북 4판 66~68·122~123쪽"},{"title":"끝까지: 친권 문제와 과태료","body":["친권자의 친권 남용·현저한 비행·아동학대 등 중대한 사유가 있으면 학교장은 시도지사·시군구청장·검사에게 가정법원에 친권상실 등을 청구해 달라고 요청할 수 있다. 요청받은 기관은 30일 안에 결과를 서면으로 알려야 하고, 학교장은 그 결과에 이의가 있으면 30일 안에 직접 가정법원에 청구할 수 있다.","신고의무자가 정당한 사유 없이 신고하지 않으면 1천만원 이하 과태료를 사람 단위로 받는다. 과태료에 불복하면 부과 통지를 받은 날부터 60일 안에 서면으로 이의제기한다."],"basis":"아동복지법 제18조; 아동학대처벌법 제63조; 질서위반행위규제법 제20조"},{"title":"피해아동보호명령 등에 대한 항고","body":["피해아동보호명령(연장 포함)과 그 취소·종류 변경, 임시보호명령과 그 취소·종류 변경 결정에 법령 위반·중대한 사실오인·현저한 부당성이 있으면 법정 항고권자가 항고할 수 있다. 보호명령 청구가 기각된 때의 항고권자는 별도로 정해져 있으므로 같은 범위로 보면 안 된다.","항고장은 원심 법원에 제출하고 결정 고지를 받은 날부터 7일 이내에 항고해야 한다. 항고는 원결정의 집행을 정지하지 않는다. 구체적인 당사자·대리 및 재항고 가능성은 사건 종류와 결정문에 따라 달라질 수 있어 법원·변호사와 확인한다."],"basis":"아동학대처벌법 제57조; 가정폭력처벌법 제49조제3항·제50조·제52조·제53조"}],"tables":[{"title":"신고로 인정되는 것과 안 되는 것","head":["상황","신고 인정","이유"],"rows":[["112 또는 시·도·시·군·구·수사기관에 신고","인정","법정 신고처는 시·도·시·군·구 또는 수사기관이다. 교육부 가이드북은 신고 전화로 112(경찰)와 시군구 긴급전화(아동학대전담공무원)를 안내한다. 다만 112에 전화했더라도 불성실하거나 허위로 제보한 경우는 신고로 인정되지 않는다(가이드북 64쪽)."],["학교장 또는 교육(지원)청에 보고만 함","불인정","신고처가 아님"],["아동보호전문기관에 문의·상담만 함","불인정","신고처가 아님"],["상담교사에게만 알리고 끝남","불인정","신고가 이뤄지지 않음"]],"note":"교육부 가이드북 4판 61·64·121쪽."},{"title":"아이를 떼어 놓는 조치들","head":["조치","누가","기간·절차"],"rows":[["응급조치(격리·인도)","경찰·아동학대전담공무원","제12조제1항제2호~제5호 조치만 72시간 이내. 그 기간에 토요일·공휴일이 포함되고 아동 보호상 필요가 인정되면 48시간 범위에서 연장 가능. 검사가 제15조제2항에 따라 임시조치를 청구한 경우 법원 결정 때까지 연장."],["긴급임시조치","사법경찰관","법원 임시조치를 받을 수 없을 만큼 급할 때"],["임시조치","경찰 신청 → 검사 청구 → 판사 결정","퇴거·격리, 접근금지, 친권 제한·정지, 상담·교육 위탁, 의료·요양시설 위탁, 유치장·구치소 유치"],["피해아동보호명령","가정법원(피해아동·법정대리인·검사·변호사·시도지사·시군구청장 청구)","퇴거·접근금지, 보호·치료·상담 위탁, 가정위탁, 친권·후견 제한 등(병과 가능)"],["일시보호·보호조치","시도지사·시군구청장","재학대 우려 시 일시보호시설·쉼터, 사례결정위원회 심의 후 가정위탁·시설 입소 등"]],"note":"아동학대처벌법 제12조·제13조·제19조·제47조, 교육부 가이드북 4판 71쪽."}],"faq":[{"q":"확실하지 않은데 신고해도 되나요? 아니면 틀리면 어떡하죠?","a":"법은 '알게 된 경우나 그 의심이 있는 경우' 즉시 신고하라고 정한다. 학대 판단은 아동학대전담공무원·경찰이 한다. 교사는 의심만으로 신고하면 된다."},{"q":"학교장이나 교육청에 보고했으면 신고한 건가요?","a":"아니다. 학교장·교육청에 보고하거나 아동보호전문기관에 단순 문의·상담한 것만으로 법정 신고가 접수됐다고 단정하지 않는다. 신고의무자는 시·도, 시·군·구 또는 수사기관에 즉시 신고하고, 다른 기관에 상담한 경우에는 법정 신고처에 실제로 신고가 전달·접수됐는지 확인한다."},{"q":"보호자에게 먼저 사정을 물어봐도 되나요?","a":"학대행위자가 보호자일 수 있으므로 신고 내용을 보호자에게 미리 알리지 않는다. 미리 알리면 아동학대 증거가 조작·은폐될 수 있다(가이드북 63쪽)."},{"q":"학생이 신고를 취소해 달라고 해요.","a":"교육부 가이드북 Q&A는 아동학대 신고의 철회는 불가능하며, 신고가 접수되면 피해아동·신고자의 의사와 무관하게 현장출동·조사 등 사안처리가 진행된다고 안내한다. 교사에게 신고의무가 있다는 점과 신고로 아동 보호·가족 지원이 가능하다는 점을 설명한다."},{"q":"퇴근 후 이웃집 아이 학대를 봤어요. 이것도 신고의무인가요?","a":"신고의무는 직무를 수행하면서 알게 된 경우에 생긴다. 직무와 무관하게 본 것은 신고할 수 있지만(누구든지 신고 가능) 의무는 아니다."},{"q":"경찰이 참고인으로 출석하라는데 꼭 가야 하나요?","a":"일반적인 경찰의 참고인 출석 요청은 강제로 출석시키는 절차가 아니며, 부담되면 담당 수사관과 협의해 진술서 제출·방문조사·전화조사 가능 여부를 물을 수 있다. 다만 법원의 증인소환 등 별도의 법적 근거가 있는 요구는 다르다. 아동학대전담공무원이 아동학대처벌법 제11조의2에 따라 출석·진술·자료 제출을 요구한 경우에는 정당한 사유가 없으면 따라야 한다."},{"q":"신고했다가 보호자가 찾아와 누가 신고했냐고 따집니다.","a":"학대(의심)행위자 등이 신고자를 특정해 물어도 학교는 신고자가 누구인지 알려주지 않고, 신고한 교사도 자신이 신고했다고 밝힐 필요가 없다. 신고자를 알려주거나 추정할 수 있게 하면 3년 이하 징역 또는 3천만원 이하 벌금 대상이다. 신변 위협이 있으면 신고자가 관할 경찰서장 등에게 신변안전조치를 신청할 수 있다."}],"record":"2026학년도 학교생활기록부 기재요령에 따라, 법에 따라 지자체가 가정폭력·아동학대 예방을 위해 분리보호하는 학생은 위탁학생으로 등록·관리하고 기관 출결을 인정한다. 재적교 평가 미응시 인정점은 시·도교육청 지침과 학교 학업성적관리규정에 따른다. 피해학생 취학·전학 지원 및 비밀처리도 2026 기재요령을 기준으로 처리한다. 지자체 분리보호에 해당하지 않는 개별 결석의 출결 인정 여부는 해당 교육청에 확인한다. 가이드북 4판의 서식은 2024 자료의 예시이므로 현행 서식 여부를 확인한 뒤 사용한다. 신고의무자 교육은 매년 1시간 이상 등 법정 요건을 지킨다.","sources":[{"title":"아동학대범죄의 처벌 등에 관한 특례법 (시행 2026.8.4., 법률 제21321호)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동학대범죄의처벌등에관한특례법"},{"title":"아동복지법 (시행 2026.9.15.)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/아동복지법"},{"title":"아동학대 예방 및 대처요령 교육부문 가이드북(4판, 발행 2024.12., 경기도교육청 자료실 2025.1.3. 게시)","publisher":"교육부 (경기도교육청 자료실 게시)","year":2024,"url":"https://www.goe.go.kr/goe/na/ntt/selectNttInfo.do?mi=10961&nttSn=1054503"},{"title":"질서위반행위규제법 (현행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/법령/질서위반행위규제법"},{"title":"아동학대처벌법 시행령 별표 2 과태료 부과기준 (2026.2.10. 개정·2.12. 시행)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/flDownload.do?bylClsCd=110201&flSeq=161428063&gubun="},{"title":"아동복지통합서비스 사이버교육센터 신고의무자 교육 과정 목록","publisher":"아동권리보장원","year":2026,"url":"https://edu.ncrc.or.kr/course/active/master/list.do"},{"title":"2026 학교주도형 종합감사 운영 매뉴얼 (아동학대 예방·지원 강화)","publisher":"경기도교육청","year":2026,"url":"https://www.goe.go.kr/resource/goe/na/bbs_1995/2026/01/79ca3a39-41ea-420e-a760-f1dd9f5e23fc.pdf"},{"title":"아동복지법 시행령 제26조(신고의무자 교육)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/lsInfoP.do?ancYnChk=0&chrClsCd=010202&efYd=20260804&lsiSeq=288363&urlMode=lsInfoP"},{"title":"아동학대처벌법 제63조(신고의무 위반 과태료)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?lsJoLnkSeq=1032075859"},{"title":"특정범죄신고자 등 보호법 제13조(신변안전조치)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/lsLinkCommonInfo.do?chrClsCd=010202&lsJoLnkSeq=1033213423"},{"title":"아동학대처벌법 제10조(아동학대범죄 신고의무와 절차)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1033152649"},{"title":"장애인학대 신고·상담 안내 (1644-8295)","publisher":"보건복지부","year":2026,"url":"https://mohw.go.kr/gallery.es?act=view&bid=0003&list_no=380178&mid=a10606030000&tag="},{"title":"2026년 경기도교육청 학교안전관리 종합계획 (자료 목록의 가이드북 제·개정일 2024.12. 표기)","publisher":"경기도교육청","year":2026,"url":"https://www.goe.go.kr/resource/goe/na/bbs_2530/2026/02/561b05a6-d5f0-47a0-88f0-d21d390cd65c.pdf"},{"title":"2026 학교생활기록부 기재요령 (초등학교)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/fileDown.do?fileSeq=20b6e362275e20aefc61857e4af63872&m=0302&s=moe"},{"title":"2026 학교생활기록부 기재요령 (중학교)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/fileDown.do?fileSeq=4ad0d9bae480b48e1b9b3de0592f955b&m=0302&s=moe"},{"title":"2026 학교생활기록부 기재요령 (고등학교)","publisher":"교육부","year":2026,"url":"https://www.moe.go.kr/boardCnts/fileDown.do?fileSeq=6668402ed462e43bd1ff70123359bf50&m=0302&s=moe"},{"title":"아동학대 피해학생 출결상황 처리 문제 (기재 문의 Q&A; 2025.9.2. 답변)","publisher":"학교생활기록부 종합지원포털(KERIS)","year":2025,"url":"https://star.moe.go.kr/web/contents/m30103.do?id=92871&schM=view"},{"title":"아동학대범죄의 처벌 등에 관한 특례법 제57조(항고와 재항고)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/lsLinkCommonInfo.do?lsJoLnkSeq=1010791973"},{"title":"가정폭력범죄의 처벌 등에 관한 특례법 제49조~제53조(항고·재항고)","publisher":"국가법령정보센터","year":2026,"url":"https://www.law.go.kr/LSW/lsLawLinkInfo.do?chrClsCd=010202&lsId=001132&lsJoLnkSeq=1000792574&print=print"}],"verified":"2026-09-24","uncertain":["공식 경기도교육청 자료실은 해당 가이드북을 2025.1.3. 게시했고, 2026 학교안전관리 종합계획 자료 목록은 2024.12. 개정 자료로 적고 있다. 이번 검색에서 더 최신판은 찾지 못했으나, 전국 모든 교육청·교육부 공지에서 후속판이 없다고 확정할 수는 없다.","교육(지원)청 사안보고 기한(몇 시간 이내 등)은 가이드북에 숫자로 나와 있지 않다. 시·도마다 다를 수 있으니 소속 시·도교육청 지침을 확인한다","신고의무자 교육의 법정 최소 요건은 매년 1시간 이상이며 교육 내용은 법령·신고방법·피해아동 보호절차다. 추가 대상 범위, 해당 연도 인정 콘텐츠 및 실적 제출 경로는 관계 중앙행정기관·교육청 안내를 확인한다.","2024 가이드북의 비밀전학 서식·연령별 동의 설명은 원문에서 확인했으나, 2026년 전국 공통 최신 운영 절차인지 확인하지 못했다. 소속 교육청·교육지원청의 현행 절차를 확인한다.","2025.9.2. 학생부 종합지원센터 Q&A의 사례는 신고 뒤 친족과 거주한 학생으로, 2026 기재요령의 지자체 분리보호 사례와 다를 수 있다. 지자체의 공식 분리보호 조치가 아닌 친족 거주·개별 심리불안 등 모든 결석 사유에 위탁학생 출결기준이나 출석인정이 자동 적용된다고 볼 수 없다. 사실관계에 맞는 시·도교육청 현행 지침을 확인한다.","학대 의심자가 아닌 다른 보호자에게 알릴지, 학교가 증거 사진을 어느 범위까지 찍을지(특히 성학대 의심 시 신체 촬영)는 가이드북에 구체 기준이 없다. 신고 시 경찰·아동학대전담공무원과 상의한다."],"related":["sexual-violence","absence-unknown","suicide-risk"]},{"id":"school-violence","title":"학교폭력 인지·신고·사안처리","aka":["학폭","학교폭력","때렸어요","맞았어요","괴롭힘","왕따","따돌림","욕했어요","돈 뺏겼어요","학폭 신고","117","분리 조치","학교장 자체해결","심의위원회","학폭 생기부","행정심판"],"category":"학생 간 사안","urgency":"즉시","roles":["처음 알게 된 교직원","담임","학교폭력 책임교사","전담기구(교감 총괄)","보건교사","전문상담교사","학교장","교육지원청 학교폭력 제로센터·전담조사관","교육지원청 학교폭력대책심의위원회"],"summary":"학교 안팎에서 학생을 대상으로 한 상해·폭행·따돌림·사이버폭력·성폭력 등으로 신체·정신·재산상 피해를 수반하는 행위가 학교폭력이다(학교폭력예방법 제2조). 알게 된 교직원은 사소해 보여도 즉시 학교장(책임교사)에게 알리고, 학교는 접수대장 기록 → 보호자 통보·분리·제2호 조치 → 48시간 내 교육(지원)청 보고 → 전담조사관 또는 전담기구 조사 → 전담기구 심의(학교장 자체해결 여부, 인지 후 14일 안) → 교육지원청 심의위원회(요청 후 21일 안) → 교육장 조치 결정·통보 → 조치 이행·생기부 기재 → (불복 시) 행정심판·행정소송·집행정지 → 졸업 시 삭제 순으로 처리한다(기한은 2026 가이드북 기준). 심의위원회 의결 전까지 '가해학생·피해학생'으로 단정하지 않고, 축소·은폐하거나 화해를 서두르지 않는다.","first":["다친 학생이 있으면 보건실 응급처치, 위급하면 119부터 부른다","관련 학생들을 떼어 놓고, 피해 학생을 안정시킨다(대질·한자리 화해 금지)","학교장(책임교사)에게 바로 알리고 신고접수대장에 기록되게 한다","신고를 접수한 학교·기관은 관련 학생 보호자와 소속 학교장에게 통보한다. 학교는 접수 사실과 안전조치를 안내하되, 교원의 제20조제4항상 별도 보고·통지 의무는 예비·음모를 알게 된 경우에 적용된다","성범죄가 섞여 있으면 피해자 의사와 관계없이 112 또는 117에 즉시 신고한다(가이드북: 성범죄 관련 사안은 예외 없이 신고, SPO 상담은 신고가 아님)"],"steps":[{"stage":"알게 됨·신고","when":"1. 감지·인지 즉시","who":"알게 된 교직원(담임·교과·목격 교사)","what":"학교장(책임교사)에게 보고하고, 학교는 접수·안전조치와 보호자 통보를 진행한다","how":["학교폭력인지 판단하지 말고 들은 그대로 책임교사에게 먼저 알린다(구두 후 메모)","책임교사를 통해 학교장에게 보고되게 한다(학교 내부 보고 절차)","학교가 접수한 뒤 관련 학생 보호자에게 접수 사실과 안전조치를 안내한다. 예비·음모를 알게 된 교원은 제20조제4항에 따라 학교장에게 보고하고 해당 학부모에게 알려야 한다","다른 학생 앞에서 피·가해 사실을 묻지 않고, 개별로 조용히 확인한다","진술이 엇갈려도 추궁·강요하지 말고 증거(메시지·CCTV 등)를 확인한다"],"check":["사소해 보여도 신고한 것은 모두 접수(접수대장은 은폐 여부 판단 자료)","신고한 학생을 노출하지 않는다"],"detail":"교사가 학교폭력을 알고 있다는 사실을 가해 쪽에 성급히 드러내면 다른 학생을 더 괴롭힐 수 있다. 학급 임원 등에게 교실 분위기를 자연스럽게 물어보는 방식이 권장된다.","basis":"학교폭력예방법 제20조제1항·제2항·제4항, 제14조제4항, 2026 가이드북 신고·사실확인 절차"},{"stage":"알게 됨·신고","when":"1. 인지 즉시(아동·청소년 대상 성범죄가 의심되는 경우)","who":"학교장·알게 된 교직원","what":"경찰(112) 또는 학교폭력 신고센터(117)에 신고","how":["직무상 아동·청소년(19세 미만)대상 성범죄(청소년성보호법 제2조제2호 — 강간·추행·불법촬영 등)를 알게 되면 즉시 신고해야 한다. 가이드북은 성범죄 관련 사안은 예외 없이, 피해학생 측 의사와 관계없이 반드시 신고하도록 한다","가이드북은 수사기관 신고처로 112 또는 117을 안내한다. 117에 전화할 때는 신고 의사를 명확히 밝힌다('신고합니다')","학교전담경찰관(SPO)과 이야기한 것만으로는 신고가 아니다","신고 일시를 사안접수 보고서에 적는다","피해 학생 측에는 신고 의무를 설명하고, 신고 때 피해 측 의사를 수사기관에 전한다"],"form":"양식 1-3 학교폭력사안 접수보고서(성범죄 신고 일시 기재란)","basis":"청소년성보호법 제34조제2항, 가이드북"},{"stage":"알게 됨·신고","when":"2. 신고 접수 즉시","who":"책임교사(전담기구)","what":"신고접수대장 기록, 학교장 보고·담임 통보, 보호자 통보","how":["사안번호를 매긴다(예: 2026-1). 이 번호를 모든 서류에 똑같이 쓴다","접수일시·신고자(또는 신고기관)·신고내용·보호자 통보일과 방법·분리 여부를 대장에 적는다","학교장에게 보고하고 담임에게 알린다","관련 학생 보호자 모두에게 접수 사실을 통보하고 통보 일자·방법을 기록한다","다른 학교 학생이 관련되면 그 학교에 통보(공문은 '비공개' 설정)"],"form":"양식 1-1 학교폭력 신고 접수 대장","check":["성폭력 사안은 접수대장에 익명으로 기재해 보관(신고자가 원하면 익명 처리)","117센터·경찰 통보도 접수 대상"],"basis":"가이드북 신고 및 접수 절차, 학교폭력예방법 제20조제2항"},{"stage":"초기 대응","when":"2. 인지 즉시","who":"현장 교직원·보건교사·전문상담교사","what":"안전조치와 현장 증거 보존","how":["위급(골절·기도막힘 등)하면 움직이지 말고 119, 가벼우면 보건실, 심하면 병원 이송(담임 또는 보건교사 동승)","가해 관련 학생은 분리해 진정시키고 판단 없이 입장을 짧게 듣는다","목격 학생은 안전한 곳에서 진정시키고 언급 자제를 당부한다","현장의 증거물은 섞거나 버리지 말고 보관, 응급조치 내용은 모두 기록","교감이 상황을 파악·지시하고 책임교사가 육하원칙으로 기록한다"],"check":["보건실 치료 기록 보관","보호자에게 피해 상태와 이송 병원 안내"],"basis":"가이드북 유형별 초기대응 요령(신체폭력)"},{"stage":"초기 대응","when":"3. 인지 후 24시간 이내","who":"학교장(전담기구·소속교원 협의)","what":"가해자(교사 포함)와 피해학생 분리","how":["피해 학생에게 분리를 원하는지 확인서로 받는다","자체해결 4요건에 모두 해당하는 경미 사안인지 확인한다(해당하면 분리하지 않을 수 있음)","분리 대상·기간(1~7일)·공간을 정한다(학교장이 협의 없이도 결정 가능)","가해 관련 학생·보호자에게 전화 등으로 통보한다","분리 전 관련 학생들에게 취지·기간·출결·이후 절차를 설명한다","분리 기간 동안 교육자료·원격수업 등 학습 지원을 한다"],"form":"양식 1-2 가해자와 피해학생 분리 의사 확인서","check":["분리 시행 당일도 기간에 들어가고 토·공휴일도 센다","다른 반으로 보내는 것은 불가(학급교체 아님)","쌍방이 서로 분리를 요청하면 상호 분리"],"basis":"학교폭력예방법 제16조제1항, 시행령 제17조의2, 가이드북 분리 절차"},{"stage":"초기 대응","when":"3. 인지 즉시(지체 없이)","who":"학교장","what":"가해학생에게 제2호(접촉·협박·보복행위 금지) 조치","how":["분리 여부와 관계없이 지체 없이 한다","의도적 접촉(대면·전화·메신저·SNS·친구를 통한 전달) 금지임을 가해 관련 학생에게 설명","보호자에게 통보하고 통보 사실을 기록","위반하면 새 학교폭력 사안으로 접수됨을 알린다"],"form":"양식 1-3 접수보고서의 '가해학생 제2호 조치 시행' 칸","check":["이 제2호는 생활기록부 기재 대상이 아님","교육활동 중 의도하지 않은 접촉까지 막는 것은 아님"],"basis":"학교폭력예방법 제17조제4항·제10항"},{"stage":"초기 대응","when":"4. 인지 후 48시간 이내","who":"책임교사","what":"교육(지원)청에 사안접수 보고","how":["접수보고서에 사안 유형(중요도 순), 인지 경로, 제2호 시행일, 분리 여부(미시행이면 예외 사유), 사실확인 내용(육하원칙 요약)을 적는다","조사관 배정 요청 또는 학교 자체조사를 표시한다","학생 조사 가능 시간(예: 위클래스 분리 중인 기간)과 요청 사항(예: 여성 조사관·상담전문가 조사관)을 적는다","경찰신고·고소·소송 여부, 장애·이주배경 여부를 적는다","불가피하면 유·무선으로 먼저 보고하고 공문을 보낸다. 성폭력 등 중대 사안은 전화로 별도 보고"],"form":"양식 1-3 학교폭력사안 접수보고서, 양식 2-1 최초 학생 작성 확인서","check":["공문 비공개 설정","사안번호 통일"],"basis":"가이드북 신고 및 접수 절차, 양식 1-3 참고"},{"stage":"초기 대응","when":"5. 필요 시(심의위원회 의결 전까지)","who":"학교장(제6항은 전담기구 심의)","what":"피해·가해학생 긴급조치","how":["피해 학생이 긴급보호를 요청하면 제1호 심리상담, 제2호 일시보호, 제3호 치료, 제6호 그 밖의 보호를 할 수 있고(재량), 하면 심의위원회에 즉시 보고","가해 학생은 긴급하다고 인정되면 제1·3·5·6·7호를 우선 부과할 수 있다(제17조제5항)","피해 측이 요청하면 전담기구 심의를 거쳐 제6호 출석정지·제7호 학급교체를 할 수 있다(제17조제6항)","출석정지·학급교체 전에는 해당 학생·보호자 의견을 반드시 듣는다(제6항은 전담기구 심의 전에)","긴급조치 보고서를 쓰고 가해학생·보호자에게 통지, 심의위원회에 즉시 보고해 추인을 받는다"],"form":"양식 2-3 (피해·가해학생) 긴급조치 보고서","check":["긴급 출석정지는 미인정결석, 추인되지 않거나 자체해결되면 출석 인정 가능","긴급 학급교체의 학적 변동은 추인 뒤 반영, 해당 학년도까지 유효","거부·회피하면 초·중등교육법 제18조로 징계"],"basis":"학교폭력예방법 제16조제1항, 제17조제5항~제7항·제10항, 시행령 제21조"},{"stage":"초기 대응","when":"5. 초기 보호자 상담","who":"담임·책임교사","what":"피해·가해 측 보호자 상담과 절차 안내","how":["피해 측: 공감하며 끝까지 듣고, 자녀 상태와 원하는 해결 방향을 묻는다","가해 측: 신고 내용을 객관적으로 전하고, 부인하면 논쟁하지 말고 '확인하겠다'고 한다","사안처리 절차(분리·조사·자체해결·심의위원회·불복·생기부) 안내문을 주고 확인 서명을 받는다","보호자 확인서(인지 경위·자녀 상태·요구사항·관계회복 참여 의사)를 받는다","상대 학생을 직접 훈계하거나 다른 학생에게 묻지 말라고 안내"],"form":"양식 2-2 보호자 확인서(학교폭력 사안처리 절차 안내 포함)","check":["조치 수준이나 결과를 예단해 말하지 않는다","상대방 주소·전화번호를 동의 없이 알려주지 않는다"],"basis":"가이드북 보호자 상담 시 유의사항·사안처리 안내(예시)"},{"stage":"조사·확인","when":"6. 접수 보고 뒤","who":"학교장","what":"조사 주체 결정: 전담조사관 배정 요청 또는 전담기구 자체조사","how":["접수보고서에서 조사관 배정 요청을 표시하면 교육지원청 제로센터가 배정(사안에 따라 1인 또는 2인 이상)","사안 특성·피해학생 보호·관계 개선 가능성을 보아 학교 자체조사가 적합하면 전담기구가 조사","조사관 방문 일정·장소를 미리 협의"],"basis":"학교폭력예방법 제11조의2제4항, 제14조제4항, 가이드북"},{"stage":"조사·확인","when":"7. 조사 기간","who":"책임교사·담임·학교장","what":"조사관 조사 준비와 협조","how":["독립된 면담 공간(상담실 등)과 관련 학생을 따로 조사할 시간·공간 확보(수업시간 외, 부득이하면 학교장 허가)","성 관련·장애·이주배경·위기학생 등 민감 정보를 조사관에게 미리 공유","학생 확인서 원본은 학교가 관리하고 사본·스캔본만 제공(암호·보안문서)","자료 제공 때마다 조사관 자료관리대장에 적고, 사안 종료 후 조사관이 학교에 와서 폐기·서명","CCTV 열람 요청, 교사 출석·진술·자료 요청에 전담기구를 통해 협조","교원 동석 여부는 학생 상태·나이·성별·사안 성격·조사관 요청을 보고 학교장이 판단","조사관의 학부모 면담 요청 시 면담실 제공, 조사관증 착용 안내"],"form":"양식 2-7 학교폭력 전담조사관 자료관리대장","check":["조사관과 언쟁하지 않는다","자료관리대장은 학년도 말에 폐기"],"basis":"가이드북 조사관 사안조사 시 학교의 역할·협조사항"},{"stage":"조사·확인","when":"7. 조사 기간","who":"전담조사관(또는 전담기구)","what":"면담·확인서·증거 수집","how":["피해·가해 관련 학생과 보호자 면담, 추가 학생 확인서","목격 학생·담임 면담, 필요 시 학급 설문(실명 노출 주의)","증거: 이메일·채팅·게시판·SNS 캡처·문자·사진·동영상·녹음, 진단서·소견서","장애학생은 특수교육 전문가, 이주배경학생은 통역·담당교사 참여","면담 녹취는 사전에 학생·보호자 동의","학생이 불안정하면 조사를 멈추고 안정시킨다"],"form":"양식 2-1 학생 작성 확인서(전담조사관 추가 작성), 양식 2-2 보호자 확인서","check":["신고 학생에게 증거 수집 책임을 떠넘기지 않는다","다른 학교 학생이 관련되면 학교별로 조사하고 결과 공유"],"basis":"가이드북 사안조사 절차 및 방법"},{"stage":"조사·확인","when":"8. 조사 완료","who":"조사관(또는 전담기구)·제로센터","what":"사안조사 보고서 작성과 사례회의","how":["보고서에 사안 개요(육하원칙)·경위·분리 여부·자체해결 요건에 대한 조사관 의견·쟁점별 양측 주장과 근거자료를 적는다","시행령 제19조 판단요소(심각성·지속성·고의성·반성·화해·선도가능성·장애 여부)별로 확인된 사실을 적는다(점수를 매기는 것이 아님)","가해학생 재발 현황, 특이사항(성 관련, 치료비 분쟁, 언론보도, 경찰신고·법률대리인)을 적는다","조사관은 전담기구와 제로센터에, 전담기구는 학교장에게 보고","제로센터 사례회의가 보완조사를 결정하면 협조한다"],"form":"양식 2-4 학교폭력 사안조사 보고서(1차/보완)","check":["학생선수인 가해 관련 학생은 표시하고 학생선수 확인 서류 준비","피해 관련 학생 신고 내용이 빠지지 않게"],"basis":"가이드북 사안조사 보고서 작성, 양식 2-4 참고"},{"stage":"심의·결정","when":"9. 인지 후 14일 이내","who":"전담기구","what":"학교장 자체해결 부의 여부 심의","how":["학교장 요청으로 비공개 회의를 연다(교감 총괄, 부재 시 책임교사 대행)","4요건을 하나씩 O/X로 판단한다","피해 학생·보호자의 자체해결 동의서(심의위원회 미개최 요구 의사) 제출 여부 확인","구성원 과반수 참석·과반수 찬성으로 결정","심의결과 보고서를 작성해 학교장에게 보고"],"form":"양식 3-1 학교폭력 전담기구 심의결과 보고서, 양식 3-2 학교장 자체해결 동의서","check":["14일 안에 조사·심의·결정(또는 심의위원회 요청)까지 마친다. 학교장이 7일 이내 연장 가능","피해학생 1명·가해학생 여러 명이면 가해학생 모두에 동의해야 자체해결","전담기구는 법정 회의록 작성 의무가 없지만 보고서는 남긴다"],"basis":"학교폭력예방법 제13조의2, 가이드북 전담기구 심의"},{"stage":"심의·결정","when":"10-가. 자체해결 결정","who":"학교장·책임교사","what":"자체해결 결재·교육(지원)청 보고·보호자 통보","how":["사안조사 보고서·전담기구 심의결과 보고서·동의서를 첨부해 내부 결재","자체해결 결과 보고서를 교육(지원)청에 보고","관련 학생 보호자에게 서면·전화·문자 등으로 통보","필요하면 가해 학생 생활지도·상담·캠페인 활동과 관계회복 프로그램 운영","우선 출석정지를 했었다면 직권 취소하고 결석을 출석으로 인정할 수 있다"],"form":"양식 3-3 학교장 자체해결 결과 보고서","check":["자체해결 뒤에는 복구 약속 불이행·새 사실 확인 때만 심의위원회 요청 가능(양식 3-4)"],"basis":"학교폭력예방법 제13조의2, 가이드북 학교장 자체해결 절차"},{"stage":"심의·결정","when":"10-나. 자체해결이 안 되는 경우","who":"학교장·책임교사","what":"교육지원청에 심의위원회 개최 요청 공문","how":["공문 제목 예: '○○교육지원청 학교폭력대책심의위원회 개최 요청'","피해·가해 학생의 학교·학년반·이름·사안번호·학생선수 여부를 적는다","붙임: 학생 확인서, 보호자 확인서, 목격학생 확인서, 사안조사 보고서, 긴급조치 보고서, 전담기구 심의결과 보고서, 보호자 개인정보, 학생선수 확인 서류(해당 시), 기타","학생선수 사안은 학생선수 담당자 협조 결재","보안에 각별히 유의(비공개)"],"form":"양식 2-6 심의위원회 개최 요구 공문, 양식 2-5 피해·가해학생 보호자 개인정보","check":["보호자 개인정보 수집에는 별도 동의가 필요 없음","성폭력 피해는 비실명 처리 요청 가능"],"basis":"가이드북 심의위원회 개최 요청, 양식 2-6"},{"stage":"심의·결정","when":"10-다. 학교폭력이 아닌 것으로 확인된 경우","who":"전담기구·학교장","what":"학교폭력 아닌 사안의 종결","how":["전담기구 회의로 오인신고 등 학교폭력이 아님을 확인","종결 보고서를 첨부해 교육지원청에 보고","피해 측이 심의위원회를 요청하면 반드시 요청해 처리"],"form":"양식 3-6 학교폭력 아닌 사안의 종결 보고서","basis":"가이드북 학교폭력이 아닌 사안의 종결처리"},{"stage":"심의·결정","when":"11. 요청 접수 후 21일 이내","who":"교육지원청 심의위원회(학교는 협조)","what":"심의위원회 개최 준비와 당일 협조","how":["교육지원청이 회의 일시·장소·안건을 관련 학생·보호자에게 통지","학생 출석은 학교장 허가 결석(출석인정)으로 처리할 수 있음","심의위원회가 요청하면 관리자·책임교사·담임이 출석하거나 서면·(영상)통화·사전면담으로 의견 제출","사례회의에서 보완조사가 결정되면 협조"],"check":["21일은 요청 공문 접수 시점부터, 뚜렷한 사유가 있으면 7일 이내 연장","수사 중·성폭력 등은 기한 안에 열고 조치결정을 유보할 수 있음"],"basis":"학교폭력예방법 제13조제4항, 시행령 제14조제8항, 가이드북 심의기간·심의방식"},{"stage":"심의·결정","when":"12. 심의 당일","who":"심의위원회","what":"의견진술·전문가 의견·의결","how":["피·가해 측 대기실 분리, 대면 원칙(요청이나 도서지역 등은 전화·화상·서면)","양측 학생·보호자에게 의견진술 기회","피해학생 또는 보호자가 요청하면 소아청소년과·정신건강의학과 의사, 심리학자 등 전문가 의견을 반드시 청취(제13조제5항)","피해학생 또는 가해학생이 장애학생이면 특수교육 전문가 또는 장애인 전문가 의견을 청취할 수 있다. 그 장애학생 본인 또는 보호자가 요청하면 반드시 전문가를 참석시키거나 서면 등으로 의견을 청취한다(학교폭력예방법 제16조의2제2항, 2026.6.2. 시행).","위원 제척·기피(당사자는 서면 소명으로 기피 신청)","재적 과반수 출석·출석 과반수 찬성으로 학교폭력 여부와 조치 의결"],"basis":"학교폭력예방법 제13조제5항, 제16조의2제2항, 제17조제8항, 시행령 제14조·제26조"},{"stage":"심의·결정","when":"13. 조치 결정·통보","who":"교육장","what":"피해·가해 측과 학교에 서면 통보","how":["교육장은 가해 조치 요청 후 14일 이내, 피해 보호조치 요청 후 7일 이내(보호자 동의) 조치","피해·가해 측에 서면으로 조치와 근거·이유를 통보(가해학생이 여럿이면 학생별로)","학교에는 공문으로 통보","조치결정 유보 시 사실과 사유를 서면 통보"],"check":["조치결정일 = 교육지원청 내부결재일","통보서를 받은 날부터 불복 기간이 흐른다"],"basis":"학교폭력예방법 제16조제3항, 제17조제9항, 행정절차법 제23조·제24조, 가이드북"},{"stage":"조치·이행","when":"14. 통보 공문 접수 즉시","who":"담임(입력)·책임교사(관리대장)","what":"학교생활기록부 기재와 관리대장 정리","how":["'학교폭력 조치상황 관리'란에 조치사항과 조치결정일(교육지원청 내부결재일)을 입력","제1~3호는 조건부 기재유보: 입력하지 않고 조건부 기재유보 관리대장에 적는다","제4~9호, 추인된 긴급조치(제1·3·5·6·7호)는 입력","책임교사는 가해학생 조치사항 관리대장에 졸업예정일·삭제 시기를 적는다","학적변동(전출·자퇴) 전에는 조치사항을 먼저 입력하고 학적 처리"],"form":"양식 4-1 가해학생 조치사항 관리대장, 양식 4-2 조건부 기재유보 관리대장","neis":"학교생활세부사항기록부(학교생활기록부Ⅱ) '학교폭력 조치상황 관리'란(2026.3.1. 기준 초1~3, 중·고 전 학년). 조치결정 통보 공문 접수 즉시 입력","check":["피해학생 보호조치·부가 특별교육은 기재하지 않음","행정심판·소송이 들어와도 먼저 입력, 변경되면 조치사항만 수정(결정일자 유지)"],"basis":"초·중등교육법 시행규칙 제21조, 학교생활기록 작성 및 관리지침 제16조의2, 가이드북"},{"stage":"조치·이행","when":"15. 조치 이행 기간","who":"학교장·책임교사·담임","what":"조치별 이행 지도","how":["제1~3호는 심의위원회가 정한 이행 기간을 확인하고 기간 안에 이행하도록 지도","제3호 교내봉사는 봉사 시간을 명확히 하고 지도교사 지정","제4호 사회봉사·제5호 특별교육·부가 특별교육은 교육감 지정 기관과 연계, 이수 확인서 수령","제6호 출석정지 기간은 미인정결석, 그동안 적절한 교육 방법 마련","제7호 학급교체는 비밀 유출에 유의해 반 배정","제8호 전학 통보를 받으면 즉시(7일 이내) 교육감·교육장에게 전학 학교 배정 요청","이행 후 결과를 교육(지원)청에 보고"],"check":["원칙적으로 학기 중 이행","입원·소년원 등 객관적 사유면 학교장이 이행 기간 변경 요청 가능","신고부터 이행 완료까지 가해학생 신청에 의한 학적변동 원칙적 제한"],"basis":"학교폭력예방법 제17조, 제19조, 시행령 제20조, 가이드북 가해학생 교육·선도 조치"},{"stage":"조치·이행","when":"15. 피해학생 보호조치 이행","who":"담임·전문상담교사·학교장","what":"보호조치 이행과 지원 안내","how":["결정된 보호조치(심리상담·일시보호·치료·학급교체 등)를 이행","보호조치에 필요한 결석은 학교장이 인정하면 출석으로 계산(진단서·소견서 요청 가능)","성적 평가에서 불이익이 없게 하고 결석 시 가정학습 지원","치료비는 학교안전공제회 청구 가능함을 안내(학교장 또는 보호자가 직접 청구 가능)","피해학생 전담지원기관 정보를 안내"],"basis":"학교폭력예방법 제16조, 시행령 제18조"},{"stage":"조치·이행","when":"16. 보호자 특별교육","who":"교육장·학교장·교육감","what":"가해학생 보호자 특별교육 이수 관리","how":["교육장이 조치 후 14일 이내 보호자에게 서면 통보","학교장은 3개월 안에 이수하도록 시간·장소 안내","3개월 되는 날까지 불응하면 다음 날 학교장이 명단을 교육감에게 통보","교육감이 14일 이내 '1개월 안 이수, 미이수 시 과태료' 서면 안내","그래도 불응하면 과태료 300만원 부과 예고 → 14일 안에 이수증·의견서 제출이 없으면 부과(이의는 60일 이내)"],"check":["과태료를 내도 이수 의무는 남는다","대면이 원칙, 타 시·도 거주 등 교육청이 인정하면 온라인 가능"],"basis":"학교폭력예방법 제17조제13항, 제23조, 시행령 제35조, 가이드북"},{"stage":"조치·이행","when":"17. 조치 미이행 시","who":"학교장·교육장(심의위원회)","what":"미이행 보고와 추가 조치","how":["통보받은 날부터 3개월 안에 이행하지 않으면 미이행 명단을 교육장(심의위원회)에게 보고","제2호 위반은 새 학교폭력 사안으로 접수","제3~9호 미이행은 교육장이 보고받은 뒤 21일 이내 '1개월 안 이행, 미이행 시 추가 조치' 서면 안내","계속 거부·기피하면 심의위원회가 추가 조치를 요청","제1~3호를 이행 기간 안에 이행하지 않으면 생기부에 기재(뒤에 이행해도 유지)"],"check":["미이행 학생이 전출·진학하면 전입교에 이행 협조 요청","피해 측은 조치 지연·미이행을 교육감에게 신고할 수 있다"],"basis":"학교폭력예방법 제17조제15항·제16항, 시행령 제22조, 가이드북 조치 미이행"},{"stage":"불복·구제","when":"18. 불복이 들어왔을 때","who":"피해·가해 측(청구), 학교(협조)","what":"행정심판·행정소송 대응","how":["청구는 학교가 아니라 교육청 행정심판위원회·법원에 한다는 것을 안내(행정심판: www.simpan.go.kr 가능)","행정심판위원회·교육장이 청구·소송 사실과 심판·소송참가 방법을 통지하면 기록해 둔다","교육청·교육지원청이 요청하는 사안 자료를 제출한다","조치 이행과 생기부 기재는 집행정지 결정이 없는 한 그대로 진행"],"check":["청구만으로 조치 효력은 멈추지 않는다","같은 사안의 재심 성격 심의위원회는 없다"],"basis":"학교폭력예방법 제17조의2·제17조의3, 행정심판법 제27조, 행정소송법 제20조"},{"stage":"불복·구제","when":"18. 집행정지 결정 시","who":"학교장·전담기구","what":"집행정지 통지 확인과 피해 측 분리 요청 처리","how":["교육감·교육장이 집행정지 신청·결과를 피해 측과 양쪽 학교에 통지","인용되면 피해 측이 분리 요청서를 내면(조치결정 통보서 첨부) 전담기구 심의로 분리 방법 결정","분리는 별도 공간이 아니라 자리 배치 변경·동선 분리·생활지도 계획 등으로","피·가해 측에 전화 등으로 통보, 집행정지 기간 동안 유지","이행 기간 중인 제1~3호는 생기부 기재를 보류, 본안 기각 시 남은 이행 기간 내 이행 여부로 기재 결정"],"form":"양식 4-5 집행정지 결정에 따른 분리 요청서","basis":"학교폭력예방법 제17조의4, 가이드북"},{"stage":"불복·구제","when":"19. 결과 반영","who":"담임·책임교사","what":"재결·판결로 조치가 변경·취소된 경우 수정","how":["변경·취소 통보를 받으면 생기부 조치사항을 수정(조치결정일자는 그대로)","관리대장도 함께 수정","미이행에 따른 추가 조치는 원조치 일자로 입력"],"neis":"학교폭력 조치상황 관리란 수정(결정일자 변경하지 않음)","basis":"가이드북 학교폭력 조치사항 기록 시 유의사항"},{"stage":"불복·구제","when":"필요 시","who":"피해·가해 측","what":"분쟁조정 안내","how":["손해배상 합의 등 분쟁이 있으면 분쟁조정 신청서를 심의위원회(다른 교육지원청이면 교육감)에 낼 수 있음을 안내","신청 후 5일 이내 시작, 1개월 이내","고소·고발·민사소송을 내면 거부·중지될 수 있음"],"form":"양식 5-1 분쟁조정 신청서","basis":"학교폭력예방법 제18조, 시행령 제25조~제29조"},{"stage":"종결·사후","when":"20. 전출·진학 시","who":"책임교사","what":"관리대장 송부와 피해학생 정보 제공","how":["가해학생이 전출하면 조치사항 관리대장·조건부 기재유보 관리대장을 전입교로 송부","미이행 조치가 있으면 전입교·상급학교에 이행 협조 요청","피해학생이 요청하면 정보 제공 동의서를 받아 정보카드를 전입교·상급학교에 공문 발송(동의서는 학교 보관)","출석정지가 다음 학년도·상급학교로 이어지면 잔여 일수 안내·이행 협조 공문"],"form":"양식 4-1, 4-2, 4-3 피해학생 정보 제공 동의서, 4-4 피해학생 정보카드","basis":"가이드북 전출·진학 시 피해학생 정보 제공, 제6호 이행이 다음 학년도로 이어지는 경우"},{"stage":"종결·사후","when":"21. 학년말·졸업 직전","who":"전담기구·학업성적관리위원회·담임","what":"생기부 조치사항 삭제 심의와 삭제","how":["학년말에 삭제 대상자(제1~3호 졸업예정자, 졸업 직전 심의로 삭제 확정자, 보존기간이 끝나는 졸업자)를 확정","제4~7호 심의: 담임 의견서, 조치 이행 확인서, 부가 특별교육 이수확인서(학생·보호자), 가해학생 자기의견서, 불복 진행 여부, 피해학생 삭제동의 확인서를 확인해 엄격히 심의","요건: 재학 중 2건 이상 사안으로 조치받지 않음 + 조치결정일부터 졸업학년도 2월 말까지 6개월 경과","명단을 학교장 보고·학업성적관리위원회 통보(회의록·내부결재)","학업성적관리위원회가 확인·확정하고 삭제 담당자(졸업예정자는 담임 등) 지정 → 삭제 → 결과 보고"],"neis":"졸업식 이후부터 2월 말(교육정보시스템 졸업생 학적반영 이전) 사이에 나이스 학생부의 조치사항 삭제. 관련 '긍정적 행동변화' 기재사항도 함께 삭제","check":["기존 졸업자는 심의 대상 아님(졸업예정자만)","학업중단자는 심의 삭제 불가","제8호는 심의 대상 아님"],"basis":"초·중등교육법 시행규칙 제22조, 학교생활기록 작성 및 관리지침 제18조, 가이드북 참고2"},{"stage":"종결·사후","when":"22. 전 과정·종결 뒤","who":"담임·책임교사·전문상담교사","what":"관계회복과 사후 관리","how":["피해 측 의사를 먼저 확인하고 양측 동의가 있을 때만 진행","사전 개별면담으로 준비 정도 확인 → 준비됐을 때 대면","교육지원청 관계개선 지원단 지원 요청 가능","피해학생 적응, 가해학생 재발 방지, 주변 학생 교육을 이어간다"],"basis":"학교폭력예방법 제13조의2제3항, 시행령 제14조의3, 가이드북 관계회복"},{"stage":"종결·사후","when":"학년도 말","who":"책임교사","what":"서류 정리·폐기","how":["조사관 자료관리대장은 학년도 말에 폐기","조건부 기재유보 관리대장은 졸업학년도 2월 말에 폐기","가해학생 조치사항 관리대장은 졸업 후 4년 보존"],"basis":"양식 2-7·4-1·4-2 참고"}],"deadlines":[{"what":"교직원 인지 사안의 학교 내부 보고 및 학교의 보호자 통보","limit":"인지·접수 즉시(가이드북 절차)","basis":"가이드북 신고·접수 절차, 법 제20조제1항·제2항. 제20조제4항의 교원 별도 보고·통지는 예비·음모 인지 시"},{"what":"아동·청소년대상 성범죄 법정 신고(요건 해당 시)","limit":"알게 된 즉시","basis":"청소년성보호법 제34조제2항"},{"what":"가해자-피해학생 분리","limit":"인지(학교장이 보고받아 안 날) 후 24시간 이내 결정, 최대 7일(시행 당일·주말·공휴일 포함)","basis":"학교폭력예방법 제16조제1항, 가이드북"},{"what":"가해학생 제2호 조치","limit":"인지 후 지체 없이","basis":"학교폭력예방법 제17조제4항"},{"what":"교육(지원)청 사안접수 보고","limit":"인지 후 48시간 이내","basis":"가이드북(양식 1-3)"},{"what":"조사·전담기구 심의·자체해결 결정 또는 심의위원회 요청","limit":"신고·접수 등 인지 후 14일 이내(학교장 7일 이내 연장 가능)","basis":"가이드북"},{"what":"심의위원회 개최","limit":"요청 공문 접수 후 21일 이내 원칙(7일 이내 연장)","basis":"가이드북 심의기간"},{"what":"교육장 조치","limit":"가해학생 조치 요청 후 14일 이내, 피해학생 보호조치 요청 후 7일 이내","basis":"학교폭력예방법 제17조제9항, 제16조제3항"},{"what":"전학 학교 배정 요청","limit":"전학 조치 통보 받은 즉시(7일 이내)","basis":"시행령 제20조제1항, 가이드북"},{"what":"조치 미이행 명단 보고","limit":"조치 통보 받은 날부터 3개월 안에 미이행 시","basis":"가이드북"},{"what":"보호자 특별교육","limit":"통보 후 3개월 → 교육감 재안내 후 1개월 → 과태료 예고 후 14일","basis":"학교폭력예방법 제23조, 가이드북"},{"what":"행정심판 청구","limit":"처분을 안 날부터 90일, 처분이 있은 날부터 180일 이내","basis":"행정심판법 제27조"},{"what":"행정소송 제기","limit":"처분을 안 날부터 90일, 처분이 있은 날부터 1년 이내","basis":"행정소송법 제20조"},{"what":"분쟁조정","limit":"신청 후 5일 이내 개시
