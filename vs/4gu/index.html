<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>4구 — 1:1 오락실</title>
<meta name="description" content="한국식 4구 당구를 3D로. 내 공으로 빨간 공 두 개를 맞혀 먼저 10점! 친구와 서버 없이 바로, 컴퓨터(쉬움·보통·어려움)와도 대결.">
<meta property="og:title" content="4구 — 1:1 오락실">
<meta property="og:description" content="빨간 공 두 개를 맞혀 먼저 10점. 방 번호 4자리로 친구와 바로 한 판.">
<meta property="og:image" content="https://kimju.kr/vs/common/og.jpg?v=2">
<meta name="theme-color" content="#2361C4">
<link rel="stylesheet" href="../common/vs.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}</script>
</head>
<body>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../common/vs.js"></script>
<script type="module">
// ================= 4구 (한국 4구) — 규칙만 여기, 나머지는 공용 당구 엔진 =================
import { start } from '../billiards/billiards.js';
const L = 2.54, W = 1.27, R = 0.03075;        // 중대 내부 2.54×1.27m, 공 지름 61.5mm
const WHITE = 0, YELLOW = 1, RED = [2, 3];
const COL = ['#F4F1E8', '#F2C230'];
const target = () => window.__blFast ? 2 : 10;   // 시험용 스위치(기본 10점)
const who = (H, s) => s === H.me ? '나' : (H.cpu ? '컴퓨터' : '상대');

const RULE = {
  id: '4gu', title: '4구', sub: '빨간 공 두 개를 맞혀 먼저 10점',
  ft: 3, cpuFt: 2,
  levels: [{ k: 'easy', name: '쉬움', desc: '자주 빗나가요' }, { k: 'normal', name: '보통', desc: '곧잘 맞혀요' }, { k: 'hard', name: '어려움', desc: '쿠션·회전까지' }],
  table: { L, W, R, pockets: false, cloth: '#1D5FB8', feltImg: '/vs/common/bl-felt-blue.jpg' },
  // 점 없는 민무늬 공(회전은 광택 반사와 굴림으로 보인다)
  balls: [{ c: COL[0] }, { c: COL[1] }, { c: '#C8161D' }, { c: '#C8161D' }],
  rules: `<ul><li>공은 네 개예요. <b>흰 공</b>과 <b>노란 공</b>이 각자의 수구이고, 빨간 공 두 개를 맞혀요. 판마다 먼저 치는 사람이 <b>흰 공</b>이에요.</li>
<li>내 공으로 <b>빨간 공 두 개를 모두</b> 맞히면 <b>1점</b>, 한 번 더 칩니다.</li>
<li>빨간 공을 하나만 맞히면 <b>빗나감</b>. 감점 없이 차례가 넘어가요.</li>
<li>빨간 공을 <b>하나도 못 맞히면 공타</b>예요. <b>1점 빠지고</b>(0점 아래로는 안 내려가요) 차례가 넘어가요.</li>
<li>내 공이 <b>상대 공</b>을 맞히면 <b>파울</b>이에요. 빨간 공 둘을 맞혀도 파울이고, <b>1점 빠지고</b>(0점 아래로는 안 내려가요) 차례가 넘어가요. 공이 당구대 밖으로 튀어 나가도 파울이에요.</li>
<li>먼저 <b>10점</b>을 내면 그 판을 이겨요.</li>
<li>한 번에 <b>40초</b> 안에 쳐요. 넘기면 감점 없이 차례가 넘어가요.</li>
<li>처음 배치: 빨간 공은 위아래 스팟에, 먼저 치는 흰 공은 아래 빨간 공 옆 한 포인트, 노란 공은 위 빨간 공 뒤 한 포인트에 놓여요.</li></ul>`,
  controls: `<ul><li><b>조준</b>: 폰은 당구대 아무 곳이나 끌면 큐가 수구 둘레로 돌아요. 오른쪽 아래 <b>◀ ▶</b>로 조금씩 맞춰요. PC는 마우스가 가리키는 쪽을 겨누고 <kbd>←</kbd><kbd>→</kbd>로 조금씩.</li>
<li><b>힘</b>: 폰은 오른쪽 <b>힘 막대</b>를 아래로 끌었다 놓으면 쳐요. PC는 당구대를 누른 채 <b>뒤로 끌었다 놓거나</b>, <kbd>스페이스</kbd>를 누르고 있다 떼요. 조금만 끌고 놓으면 안 쳐요.</li>
<li><b>당점</b>: 왼쪽 아래 <b>수구 그림</b>을 누르고 큰 원에서 칠 곳을 골라요. 위를 치면 맞힌 뒤 앞으로 따라가고(밀어치기), 아래를 치면 뒤로 당겨지고(끌어치기), 옆을 치면 쿠션에서 꺾여요.</li>
<li><b>흰 선</b>은 수구가 처음 맞을 곳, <b>노란 선</b>은 맞은 공이 갈 방향이에요. <b>조준 시점</b> 단추로 수구 뒤에서 보거나 전체를 봐요.</li></ul>`,
  // 처음 배치(x: 긴 쪽, 헤드 쪽이 -)
  newGame(ctx, B, H){
    const first = ctx.first;
    const home = [[-L / 4, W / 4], [3 * L / 8, 0], [L / 4, 0], [-L / 4, 0]];   // 흰(선공)·노랑·빨강(풋 스팟)·빨강(헤드 스팟)
    home.forEach(([x, z], i) => { Object.assign(B[i], { x, z, st: 0 }); });
    const cue = [0, 0]; cue[first] = WHITE; cue[1 - first] = YELLOW;
    return { turn: first, n: 0, sc: [0, 0], cue, home };
  },
  cueIdx: gs => gs.cue[gs.turn],
  targets: () => RED,
  // 판정(양쪽이 같은 기록으로 부른다)
  judge(gs, lg, B, H){
    const me = gs.turn, op = 1 - me, oc = gs.cue[op];
    gs.n++;
    const outs = lg.out || [];
    let foul = null;
    if (outs.length) foul = '공이 당구대 밖으로 나감';
    else if (lg.hits.indexOf(oc) >= 0) foul = '상대 공을 맞힘';
    // 밖으로 나간 공은 처음 자리(차 있으면 가까운 빈자리)에 놓는다
    for (const i of outs) H.respot(B, i, gs.home[i][0], gs.home[i][1]);
    if (foul){
      gs.sc[me] = Math.max(0, gs.sc[me] - 1); gs.turn = op;
      return { foul: true, call: { big: '파울 -1', small: foul } };
    }
    if (lg.hits.indexOf(RED[0]) >= 0 && lg.hits.indexOf(RED[1]) >= 0){
      gs.sc[me]++;
      if (gs.sc[me] >= target()) return { over: me, call: { big: '득점!', small: who(H, me) + ' ' + gs.sc[me] + '점 · 승리', hot: 1 }, clap: 1 };
      return { call: { big: '득점!', small: who(H, me) + ' ' + gs.sc[me] + '점 · 한 번 더', hot: 1 }, clap: 1 };
    }
    const one = lg.hits.indexOf(RED[0]) >= 0 || lg.hits.indexOf(RED[1]) >= 0;
    gs.turn = op;
    if (!one){
      // 공타: 빨간 공을 하나도 못 맞힘 → -1점(0점 아래로는 안 내려감)
      gs.sc[me] = Math.max(0, gs.sc[me] - 1);
      return { foul: true, call: { big: '공타 -1', small: '빨간 공을 하나도 못 맞힘' } };
    }
    return { one, call: { big: '빗나감', small: '빨간 공 하나만 맞힘' } };
  },
  timeout(gs){ gs.n++; gs.turn = 1 - gs.turn; return { call: { big: '시간 초과', small: '차례가 넘어가요' } }; },
  turnText(gs, me, o){
    const w = gs.turn === me ? '<span class="me">내 차례</span>' : `<span class="op">${o.cpu ? '컴퓨터' : '상대'} 차례</span>`;
    return w + ' · ' + gs.sc[me] + ':' + gs.sc[1 - me];
  },
  hud(gs, me, names){
    const row = (s, nm) => `<div class="blRow${gs.turn === s ? ' blNow' : ''}"><span class="blDot" style="background:${COL[gs.cue[s]]}"></span><span class="blNm">${nm.replace(/[<>&"']/g, '')}</span><span class="blSc">${gs.sc[s]}</span></div>`;
    return row(me, names[0] || '나') + row(1 - me, names[1] || '상대') + `<div class="blRow" style="height:18px"><span class="blTag" style="margin-left:0">${target()}점 먼저</span></div>`;
  },
  // 메뉴 그림: 흰 공이 빨간 공 둘을 차례로 맞히는 반복
  drawArt(x, w, h, t){
    const tw = Math.min(w * 0.92, h * 2.4), th = tw / 2.2, ox = (w - tw) / 2, oy = (h - th) / 2, rb = Math.max(4, th * 0.07);
    x.fillStyle = '#5A2E16'; x.beginPath(); x.roundRect ? x.roundRect(ox - 8, oy - 8, tw + 16, th + 16, 8) : x.rect(ox - 8, oy - 8, tw + 16, th + 16); x.fill();
    x.fillStyle = '#1D5FB8'; x.fillRect(ox, oy, tw, th);
    x.fillStyle = 'rgba(244,238,220,.8)'; for (let i = 1; i < 8; i++){ x.beginPath(); x.arc(ox + tw * i / 8, oy - 4, 1.6, 0, 7); x.arc(ox + tw * i / 8, oy + th + 4, 1.6, 0, 7); x.fill(); }
    const P = 2600, u = (t % P) / P;
    const A = [ox + tw * 0.12, oy + th * 0.72], R1 = [ox + tw * 0.5, oy + th * 0.5], R2 = [ox + tw * 0.83, oy + th * 0.28];
    const H1 = [R1[0] - rb * 1.7, R1[1] + rb * 1.0];
    let c;
    if (u < 0.35){ const k = u / 0.35; c = [lerp(A[0], H1[0], k), lerp(A[1], H1[1], k)]; }
    else if (u < 0.7){ const k = (u - 0.35) / 0.35; c = [lerp(H1[0], R2[0] - rb * 2, k), lerp(H1[1], R2[1] + rb * 0.4, k)]; }
    else c = [R2[0] - rb * 2, R2[1] + rb * 0.4];
    const r1 = u > 0.35 ? Math.min(1, (u - 0.35) / 0.4) : 0, r2 = u > 0.7 ? Math.min(1, (u - 0.7) / 0.3) : 0;
    const ball = (px, py, col) => { x.fillStyle = 'rgba(0,0,0,.3)'; x.beginPath(); x.ellipse(px + rb * 0.25, py + rb * 0.35, rb, rb * 0.8, 0, 0, 7); x.fill(); const g = x.createRadialGradient(px - rb * 0.35, py - rb * 0.4, rb * 0.1, px, py, rb); g.addColorStop(0, '#fff'); g.addColorStop(0.35, col); g.addColorStop(1, 'rgba(0,0,0,.55)'); x.fillStyle = col; x.beginPath(); x.arc(px, py, rb, 0, 7); x.fill(); x.fillStyle = g; x.globalAlpha = 0.55; x.fill(); x.globalAlpha = 1; };
    ball(R1[0] + r1 * tw * 0.06, R1[1] - r1 * th * 0.18, '#C8161D');
    ball(R2[0] + r2 * tw * 0.05, R2[1] - r2 * th * 0.08, '#C8161D');
    ball(ox + tw * 0.3, oy + th * 0.25, '#F2C230');
    ball(c[0], c[1], '#F4F1E8');
    for (const [k0, px, py] of [[0.35, H1[0] + rb, H1[1] - rb * 0.5], [0.7, R2[0] - rb, R2[1]]]){
      if (u >= k0 && u < k0 + 0.1){ const a = 1 - (u - k0) / 0.1; x.strokeStyle = `rgba(255,236,160,${a})`; x.lineWidth = 2; x.beginPath(); x.arc(px, py, rb * (1.3 + (1 - a) * 1.5), 0, 7); x.stroke(); }
    }
  },
};
const lerp = (a, b, k) => a + (b - a) * k;
start(RULE);
</script>
</body>
</html>
