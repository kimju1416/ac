/* 3D 캔버스는 경기 화면 전체(위·아래 공용 막대 뒤까지)에 깐다. #vsGame(fixed) 안에서 z-index:-1이라

  background:radial-gradient(circle,#243058 0,#161E3C 62%,#0E1430 100%);border:2px solid #3A4A80;box-shadow:inset 0 4px 12px rgba(0,0,0,.6),0 3px 0 rgba(0,0,0,.3)}

<body>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="../common/vs.js"></script>
<script type="module">
// ================= 말랑 테니스 (3D) =================
// 한 라운드 = 테니스 한 게임. 좌표는 미터: x = 코트 가로, z = 코트 길이(네트가 z=0), y = 위.
// 자리 0은 z>0 쪽 절반, 자리 1은 z<0 쪽 절반. 각 기기 카메라는 늘 자기 선수 뒤에서 본다.
// 친구 대전은 방장 권위: 방장이 공·선수·점수를 모두 계산하고, 손님은 입력만 보내고 상태를 받아 그린다.
import * as THREE from 'three';
const VS = window.VS;
const $ = id => document.getElementById(id);

// ---------- 규격(정식 코트) ----------
const HL = 11.885, HW = 4.115, DW = 5.485, SV = 6.40;       // 반 길이, 단식 반폭, 복식 반폭, 서비스 라인(네트에서)
const NET_C = 0.914, NET_P = 1.07, POST = 6.40;            // 네트 중앙·기둥 높이, 기둥 위치(복식 라인 밖 0.914m)
const BR = 0.034, BALL_R = 0.075;                          // 판정용 공 반지름, 그림용 공 반지름(잘 보이게 조금 크게)
const GRAV = 9.81, K_DRAG = 0.016;                         // 중력, 공기 저항 계수
const RUN = 6.2, AUTO = 2.4;                               // 달리기 속도, 준비 자세 뒤 자동 위치 잡기 속도(m/s)
const DT = 1 / 120;                                        // 물리 한 걸음
const WALL_Z = HL + 6.4, WALL_X = DW + 4.2;                // 광고판 벽
const sgnOf = s => s === 0 ? 1 : -1;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, k) => a + (b - a) * k;
const gauss = () => { let u = 0; while (!u) u = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * Math.random()); };
const easeOut = u => 1 - Math.pow(1 - clamp(u, 0, 1), 3);
const netH = x => NET_C + (NET_P - NET_C) * Math.min(1, Math.abs(x) / POST);
// 라인에 걸치면 인: 라인은 코트 치수 안쪽에 있으니 공 중심이 치수 + 반지름 안이면 닿은 것
const inCourt = (x, z) => Math.abs(x) <= HW + BR && Math.abs(z) <= HL + BR;
// 서브 박스: 서버의 대각선. 듀스 코트(오른쪽)에서 치면 받는 쪽 절반의 서버 기준 왼쪽 박스
function inBox(x, z, server, deuce){
  const ss = sgnOf(server), zr = -z * ss;                  // 받는 쪽 절반으로 잰 네트부터의 거리
  if (zr < -BR || zr > SV + BR) return false;
  const u = x * ss;                                        // 서버 기준 오른쪽이 +
  return deuce ? (u >= -HW - BR && u <= 0.025 + BR) : (u >= -0.025 - BR && u <= HW + BR);
}

// ---------- 점수 ----------
const PN = ['0', '15', '30', '40'];
class Score {
  constructor(){ this.p = [0, 0]; this.done = -1; }
  add(w){
    const p = this.p, l = 1 - w; p[w]++;
    if (p[w] >= 4 && p[w] - p[l] >= 2){ this.done = w; return { k: 'game', w }; }
    if (p[w] >= 3 && p[l] >= 3){
      if (p[w] === p[l]){ const n = p[w] - 3; p[0] -= n; p[1] -= n; return { k: 'deuce' }; }   // 듀스는 40-40으로 되돌려 센다(홀짝은 그대로)
      return { k: 'adv', w: p[w] > p[l] ? w : l };
    }
    return { k: 'pt', w };
  }
  // 서버 점수를 먼저 부른다(테니스 관례)
  text(server){
    const a = this.p[server], b = this.p[1 - server];
    if (a >= 3 && b >= 3) return a === b ? 'DEUCE' : a > b ? 'AD - 40' : '40 - AD';
    return PN[Math.min(a, 3)] + ' - ' + PN[Math.min(b, 3)];
  }
}

// ---------- 공 물리 ----------
function stepBall(b, dt){
  const k = K_DRAG * Math.hypot(b.vx, b.vy, b.vz);
  b.vx -= k * b.vx * dt; b.vz -= k * b.vz * dt; b.vy -= (b.g + k * b.vy) * dt;
  b.x += b.vx * dt; b.y += b.vy * dt; b.z += b.vz * dt;
}
function bounceBall(b){
  b.rollT = 0; b.y = BR; b.vy = -b.vy * b.ey; b.vx *= b.eh; b.vz *= b.eh;
  b.g = GRAV; b.ey = 0.68; b.eh = 0.72;                    // 튄 뒤엔 회전이 풀린다
  if (b.vy < 0.45){ b.vy = 0; b.roll = true; }
}
// 첫 바운드까지 따라가 본다 → [착지 x, 착지 z, 시간, 네트 지날 때 높이, 그때 x]
function simLand(x, y, z, vx, vy, vz, g){
  const b = { x, y, z, vx, vy, vz, g }; let t = 0, yn = 99, xn = 0;
  for (let i = 0; i < 700; i++){
    const x0 = b.x, y0 = b.y, z0 = b.z; stepBall(b, DT); t += DT;
    if (yn === 99 && z0 * b.z <= 0 && z0 !== b.z){ const f = z0 / (z0 - b.z); yn = y0 + (b.y - y0) * f; xn = x0 + (b.x - x0) * f; }
    if (b.y <= BR && b.vy < 0) return [b.x, b.z, t, yn, xn];
  }
  return [b.x, b.z, t, yn, xn];
}
// 목표 지점(tx,tz)에 약 T초 만에 떨어지는 초속을 찾는다. 공기 저항 때문에 겨냥점을 몇 번 고쳐 맞춘다.
// 네트 위 여유(clr)가 모자라면 T를 늘려(더 느리고 높게) 다시 푼다. clr이 음수면 일부러 네트에 걸리는 공.
function solve(from, tx, tz, T, g, clr){
  let v = [0, 0, 0];
  for (let tries = 0; tries < 36; tries++){
    let ax = tx, az = tz, r = null;
    for (let it = 0; it < 6; it++){
      v = [(ax - from.x) / T, (BR - from.y + 0.5 * g * T * T) / T, (az - from.z) / T];
      r = simLand(from.x, from.y, from.z, v[0], v[1], v[2], g);
      const ex = tx - r[0], ez = tz - r[1];
      if (Math.abs(ex) + Math.abs(ez) < 0.02) break;
      ax += ex; az += ez;
    }
    if (r[3] === 99 || r[3] >= netH(r[4]) + BR + clr) return v;
    T *= 1.05;
  }
  return v;
}
// 공 궤적 미리보기(네트는 무시): 컴퓨터와 «준비 자세 뒤 자동 위치 잡기»가 같이 쓴다
function predict(b, T = 2.4){
  const s = { x: b.x, y: b.y, z: b.z, vx: b.vx, vy: b.vy, vz: b.vz, g: b.g, ey: b.ey, eh: b.eh, roll: false }, out = [];
  let bn = b.bn | 0;
  for (let t = DT * 2; t <= T; t += DT * 2){
    stepBall(s, DT); stepBall(s, DT);
    if (s.y <= BR && s.vy < 0){ bounceBall(s); bn++; }
    out.push({ t, x: s.x, y: s.y, z: s.z, bn });
    if (bn >= 2 || s.roll) break;
  }
  return out;
}
// 칠 자리 고르기: 내 쪽에서 규칙상 칠 수 있고(한 번 튄 뒤, 또는 발리) 편한 높이인 첫 지점
function chooseContact(p, sm, spd, serveBall, volley){
  let any = null, fb = null, fbv = 1e9;
  for (const k of sm){
    if (k.z * p.sgn < 0.4) continue;
    if (!(k.bn === 1 || (k.bn === 0 && volley && !serveBall))) continue;
    if (k.y < 0.25 || k.y > 2.0) continue;
    const fx = k.x - p.sgn * 0.72, bx = k.x + p.sgn * 0.72;          // 포핸드 자리 / 백핸드 자리
    const sx = Math.abs(fx - p.x) <= Math.abs(bx - p.x) ? fx : bx, sz = k.z + p.sgn * 0.3;
    const need = Math.hypot(sx - p.x, sz - p.z) / spd;
    const c = { sx, sz, t: k.t, y: k.y };
    if (need <= k.t){ if (k.y >= 0.45 && k.y <= 1.35) return c; if (!any) any = c; }
    else if (need - k.t < fbv){ fbv = need - k.t; fb = c; }
  }
  return any || fb;
}

// ---------- 선수 ----------
const SWINGS = { fh: 0.34, bh: 0.34, lf: 0.4, lb: 0.4, srv: 0.42, wh: 0.45, whb: 0.45 };
const swinging = p => SWINGS[p.anim] !== undefined && p.at < 0.3;
function mkP(s){ return { s, sgn: sgnOf(s), x: 0, z: sgnOf(s) * (HL + 0.5), vx: 0, vz: 0, tx: 0, tz: 0, armed: null, cT0: 0, cT1: -1, anim: '', at: 9, missed: false, auto: null, autoAt: -9 }; }
const NOC = () => ({ mx: 0, mz: 0, ax: 0, az: 0, press: [], release: [] });
// 이동: 레버는 늘 같은 속도(원작식). 준비 자세(버튼 누름) 뒤엔 레버가 조준이 되고, 몸은 자동으로 칠 자리로 간다.
function movePlayer(p, c, dt, ph, isServer, tossed, deuce){
  let dx = 0, dz = 0, spd = RUN;
  if (ph === 'play' || ph === 'serve'){
    if (swinging(p)){ /* 스윙 중엔 멈춤 */ }
    else if (p.armed){ if (p.auto){ dx = p.auto.x - p.x; dz = p.auto.z - p.z; const d = Math.hypot(dx, dz); if (d < 0.04) dx = dz = 0; else { const m = Math.min(1, d / 0.25) / d; dx *= m; dz *= m; } spd = AUTO; } }
    else { dx = c.mx; dz = c.mz; const m = Math.hypot(dx, dz); if (m > 1){ dx /= m; dz /= m; } }
    if (ph === 'serve' && isServer){ dz = 0; if (tossed) dx = 0; }
  }
  const k = Math.min(1, dt * 16);
  p.vx += (dx * spd - p.vx) * k; p.vz += (dz * spd - p.vz) * k;
  p.x = clamp(p.x + p.vx * dt, -WALL_X + 0.6, WALL_X - 0.6);
  p.z = clamp((p.z + p.vz * dt) * p.sgn, 0.7, WALL_Z - 0.8) * p.sgn;
  if (ph === 'serve' && isServer){ const side = deuce ? 1 : -1, u = clamp(p.x * p.sgn * side, 0.15, 3.9); p.x = u * side * p.sgn; }
}
// 공이 치는 범위에 들어왔을 때 타점의 질(0~1): 옆 거리·높이·늦음
function quality(ad, y, f, run, pace){
  const ql = 1 - Math.pow(clamp(Math.abs(ad - 0.72) / 0.9, 0, 1), 1.6);
  const qh = y < 0.4 ? 0.35 + 0.65 * (y - 0.08) / 0.32 : y > 1.4 ? 1 - 0.6 * (y - 1.4) : 1;
  const qf = f >= 0 ? 1 : 1 + f / 0.45 * 0.6;
  const qr = 1 - 0.45 * clamp(run / RUN, 0, 1);              // 뛰면서 치면 흔들린다
  const qp = 1 - 0.35 * clamp((pace - 14) / 16, 0, 1);       // 빠른 공은 받기 어렵다
  return clamp(ql * qh * qf * qr * qp, 0.12, 1);
}

// ---------- 경기(규칙 엔진) — 그림과 무관, 방장·컴퓨터 모드에서만 돈다 ----------
class Match {
  constructor(first){
    Object.assign(this, { server: first, sc: new Score(), t: 0, pt: 0, phase: 'pre', faults: 0, over: -1, hitstop: 0, kmh: 0, ev: [], deadDur: 0, keepF: false, C: [NOC(), NOC()] });
    this.ball = { x: 0, y: -5, z: 0, vx: 0, vy: 0, vz: 0, g: GRAV, eh: 0.72, ey: 0.68, vis: false, toss: false, auto: false, serve: false, net: false, blocked: false, roll: false, hitter: -1, bn: 0, nh: 0 };
    this.P = [mkP(0), mkP(1)];
    this.setup(true);
  }
  deuce(){ return (this.sc.p[0] + this.sc.p[1]) % 2 === 0; }      // 합계 짝수 = 듀스 코트(오른쪽)
  spot(s){
    const sg = sgnOf(s), d = this.deuce() ? 1 : -1;
    return s === this.server ? { x: sg * d * 0.9, z: sg * (HL + 0.35) } : { x: sg * d * 2.9, z: sg * (HL + 0.7) };
  }
  setup(snap){
    const b = this.ball; Object.assign(b, { vis: false, toss: false, serve: false, roll: false, y: -5, vx: 0, vy: 0, vz: 0 });
    for (const p of this.P){ const sp = this.spot(p.s); p.tx = sp.x; p.tz = sp.z; if (snap){ p.x = sp.x; p.z = sp.z; } p.armed = null; p.missed = false; p.auto = null; }
    if (!this.keepF) this.faults = 0;
    this.keepF = false; this.phase = 'pre'; this.pt = 0;
  }
  push(...e){ this.ev.push(e); }
  canHit(p){ const b = this.ball; return this.phase === 'play' && b.vis && !b.toss && b.hitter !== p.s && !b.serve && b.bn <= 1 && b.z * p.sgn > 0; }
  incoming(p){ const b = this.ball; return this.phase === 'play' && b.vis && b.hitter !== p.s; }
  applyCtrl(p, c){
    const b = this.ball;
    for (const k of c.press){

// ---------- 컴퓨터 ----------
// 사람과 같은 달리기 속도·같은 치기 규칙(버튼 누름 → 범위에 들어오면 스윙). 순간이동 없음.
const LV = {
  easy:   { react: 0.36, perr: 0.55, pw: [0.25, 0.5], late: 0.13, wide: 0.1, lob: 0.12, volley: false, srvErr: 0.22, rush: 0, sAim: 0.3 },
  normal: { react: 0.22, perr: 0.25, pw: [0.35, 0.65], late: 0.05, wide: 0.05, lob: 0.3, volley: false, srvErr: 0.14, rush: 0.06, sAim: 0.7 },
  hard:   { react: 0.12, perr: 0.08, pw: [0.5, 0.8], late: 0, wide: 0.02, lob: 0.55, volley: true, srvErr: 0.08, rush: 0.3, sAim: 1 },
  // 시험용 봇(내 선수를 대신 움직일 때만): 세게·구석으로 쳐서 포인트가 빨리 난다
  bot:    { react: 0.2, perr: 0.2, pw: [0.85, 1.0], late: 0.03, wide: 0.25, lob: 0.1, volley: false, srvErr: 0.12, rush: 0.05, sAim: 1 },

// W: {t, phase, server, ball, P} — 방장은 경기 엔진을, 손님은 받은 상태를 그대로 넣는다
function aiCtrl(W, s, lvK, mem){
  const L = LV[lvK] || LV.normal, p = W.P[s], o = W.P[1 - s], b = W.ball, t = W.t, sg = p.sgn, c = NOC();
  const goTo = (x, z, tol) => { const dx = x - p.x, dz = z - p.z, d = Math.hypot(dx, dz); if (d > tol){ const m = Math.min(1, d / 0.35) / d; c.mx = dx * m; c.mz = dz * m; } };

    else {
      if (!mem.hitAt){
        mem.hitAt = t + Math.max(0.05, b.vy / GRAV + gauss() * L.srvErr);
        const r = Math.random(); mem.sax = (r < 0.4 ? -1 : r < 0.8 ? 1 : 0) * L.sAim * (0.7 + Math.random() * 0.3); mem.saz = Math.random() * 0.6 - 0.2;
      }

  }

      else if (lvK === 'hard'){ mem.ax = open * (0.5 + Math.random() * 0.35); mem.az = 0.15 + Math.random() * 0.45; if (Math.random() < 0.12){ mem.az = -0.75; mem.ax = open * 0.85; } }   // 구석·짧은 각도를 섞되 여유를 둔다

// ---------- 소리(직접 합성) ----------
let NZ = null;

  else if (k === 'net'){ nz(0.24, 'lowpass', 420, 0.8, 0.8); os(0.18, 110, 55, 0.45); }
  else if (k === 'toss'){ nz(0.2, 'bandpass', 500, 1.1, 0.07, 0, 1300); }
  else if (k === 'wh'){ nz(0.26, 'bandpass', 450, 1.3, 0.2, 0, 1900); }

      s.connect(fl); fl.connect(g); g.connect(out); s.start(t, Math.random()); s.stop(t + dur + 0.05);
    }

}

function tryTex(url, cb){ TL.load(url, tx => { tx.colorSpace = THREE.SRGBColorSpace; tx.anisotropy = 4; cb(tx); }, undefined, () => {}); }
function canvasTex(w, h, draw){ const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h); const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t; }
// 위쪽 frac만큼 서서히 투명해지는 알파 질감(판 윗선을 하늘로 녹인다)
function fadeTex(frac){

}
function clayTex(){

    x.fillStyle = '#C9683E'; x.fillRect(0, 0, w, h);
    for (let i = 0; i < 2600; i++){ const v = Math.random(); x.fillStyle = v < 0.5 ? `rgba(150,70,35,${0.12 + Math.random() * 0.2})` : `rgba(235,150,105,${0.1 + Math.random() * 0.18})`; x.fillRect(Math.random() * w, Math.random() * h, 1 + Math.random() * 2, 1 + Math.random() * 2); }
  });
}
function crowdTexGen(){
  return canvasTex(512, 256, (x, w, h) => {
    x.fillStyle = '#5C6B8A'; x.fillRect(0, 0, w, h);
    const cols = ['#F2434B', '#2E7CF0', '#F7C22B', '#23B45B', '#FF8FB1', '#FF9A3C', '#7BD3F7', '#FFFFFF'];
    for (let r = 0; r < 8; r++){
      x.fillStyle = 'rgba(0,0,0,.25)'; x.fillRect(0, r * 32 + 28, w, 4);
      for (let i = 0; i < 18; i++){ const cx = i * 28.4 + 14 + (r % 2) * 7, cy = r * 32 + 18; x.fillStyle = cols[(Math.random() * cols.length) | 0]; x.beginPath(); x.ellipse(cx, cy, 11, 12, 0, 0, 7); x.fill(); x.fillStyle = '#1F1A2E'; x.fillRect(cx - 4, cy - 3, 2, 3); x.fillRect(cx + 2, cy - 3, 2, 3); }
    }
  });
}
// 광고판: 가상 문구만(실제 상표 없음)

}

    const pu = new THREE.Mesh(GEO.pupil, MAT.black); pu.position.set(0, -0.01, 0.045); pu.scale.set(1, 1.3, 0.6); e.add(pu);

    const ck = new THREE.Mesh(GEO.cheek, MAT.cheek); ck.position.set(sx * 0.31, 0.58, 0.41); ck.scale.set(1, 0.6, 0.35); ck.rotation.y = sx * 0.55; body.add(ck);

    const th = new THREE.Mesh(GEO.throat, MAT.frame); th.rotation.z = Math.PI / 2; th.position.x = -0.27; racket.add(th);
    const fr = new THREE.Mesh(GEO.frame, MAT.frame); fr.position.x = -0.5; fr.scale.set(1.28, 1, 1); fr.castShadow = true; racket.add(fr);
    const st = new THREE.Mesh(GEO.strings, MAT.strings); st.position.x = -0.5; st.scale.set(1.28, 1, 1); racket.add(st);
  }
  const armL = new THREE.Group(); armL.position.set(0.46, 0.6, 0.04); body.add(armL);
  const rollL = new THREE.Group(); armL.add(rollL);
  const aL = new THREE.Mesh(GEO.arm, limbMat); aL.rotation.z = Math.PI / 2; aL.position.x = 0.1; aL.castShadow = true; rollL.add(aL);
  const feet = [];

}

// ---------- 말랑이 동작 ----------
function poseM(M, P, dt, now, V, crowdT){

  const yawT = base - look * 0.6;

  // 몸: 달리면 앞으로 기울며 찌그러지고, 서 있으면 통통
  M.ph += dt * (sp > 0.5 ? sp * 2.3 : 0);
  const hop = sp > 0.5 ? Math.abs(Math.sin(M.ph)) * 0.09 : Math.abs(Math.sin(now * 0.0036 + M.seat)) * 0.035;
  let sy = 1 + (hop - 0.04) * 0.9, lean = 0.22 * Math.min(1, sp / RUN), tiltX = 0, extraY = hop, twist = 0;
  const cy = Math.cos(M.yaw), syw = Math.sin(M.yaw);
  const lx = P.vx * cy - P.vz * syw, lz = P.vx * syw + P.vz * cy;
  let rx = sp > 0.1 ? lz / sp * lean : 0, rz = sp > 0.1 ? -lx / sp * lean : 0;
  for (let i = 0; i < 2; i++){ const f = M.feet[i]; f.position.z = 0.05 + (sp > 0.5 ? Math.sin(M.ph + i * Math.PI) * 0.14 : 0); f.position.y = 0.06 + (sp > 0.5 ? Math.max(0, Math.sin(M.ph + i * Math.PI)) * 0.06 : 0); }
  // 팔·라켓 목표 자세
  let th = 0.55, ps = 0.55, psL = -0.9, direct = false, roll = 0, eyeY = 1;
  const fhSide = b.vis ? (b.x - P.x) * sg >= 0 : true;
  const sw = (a0, a1, p0, p1, dur) => { const u = easeOut(at / dur); th = lerp(a0, a1, u); ps = lerp(p0, p1, u); direct = true; return u; };
  if (an === 'fh' && at < 0.34){ sw(-0.8, 2.3, 0.35, -0.5, 0.34); twist = lerp(-0.35, 0.45, easeOut(at / 0.34)); }
  else if (an === 'bh' && at < 0.34){ sw(3.9, 0.9, 0.35, -0.6, 0.34); twist = lerp(0.4, -0.4, easeOut(at / 0.34)); psL = -0.2; }
  else if (an === 'lf' && at < 0.4){ sw(-0.5, 1.8, 0.85, -1.4, 0.4); twist = lerp(-0.25, 0.3, easeOut(at / 0.4)); }
  else if (an === 'lb' && at < 0.4){ sw(3.7, 1.3, 0.85, -1.4, 0.4); twist = lerp(0.3, -0.3, easeOut(at / 0.4)); }
  else if (an === 'wh' && at < 0.45){ sw(-1.0, 2.0, 0.3, -0.2, 0.45); }
  else if (an === 'whb' && at < 0.45){ sw(3.9, 1.2, 0.3, -0.2, 0.45); }
  else if (an === 'toss'){ th = Math.PI / 2 - 0.25; ps = lerp(0.6, -2.5, easeOut(at / 0.5)); psL = lerp(-0.9, 1.5, easeOut(at / 0.25)); direct = true; roll = Math.PI / 2; sy *= lerp(1, 0.93, easeOut(at / 0.5)); }
  else if (an === 'srv' && at < 0.42){ th = Math.PI / 2 - 0.25; const u = easeOut(at / 0.42); ps = lerp(-2.4, 1.1, u); psL = lerp(1.2, -0.8, u); roll = Math.PI / 2; direct = true; sy *= at < 0.12 ? 1.12 : lerp(1.12, 1, (at - 0.12) / 0.3); }
  else if (an === 'joy' && at < 1.7){ const k = 1 - at / 1.7; extraY = Math.abs(Math.sin(at * 8)) * 0.34 * k; th = 0.9; ps = -1.9; psL = 1.6; sy = 1 + Math.sin(at * 16) * 0.06 * k; }
  else if (an === 'sad' && at < 1.9){ const k = Math.min(1, at / 0.25); sy = lerp(1, 0.82, k); tiltX = 0.35 * k; th = 0.3; ps = 1.25; psL = -1.25; eyeY = 0.35; extraY = 0; rx *= 0.3; rz *= 0.3; }
  else if (P.armed){ if (fhSide){ th = -1.35; ps = 0.25; } else { th = 3.95; ps = 0.25; psL = -0.3; } sy *= 0.93; }
  if (direct){ M.th = th; M.ps = ps; M.psL = psL; }

  M.armR.rotation.y = M.th; M.rollR.rotation.z = M.ps; M.rollL.rotation.z = M.psL;
  if (M.racket) M.racket.rotation.x = roll;
  M.body.position.y = extraY;
  M.body.scale.set(1 / Math.sqrt(sy), sy, 1 / Math.sqrt(sy));
  M.body.rotation.set(rx + tiltX, twist, rz);

function poseExtra(M, now, i, cheer){

// 가까운 선수 발끝~먼 선수 머리까지 들어가도록 기울기와 화각을 맞춘다(위 점수판·아래 폰 버튼 자리는 비운다).
const PAD_H = 136;

function fitCamera(){
  if (!cam) return;

  // 캔버스는 화면 전체라, 위·아래 공용 막대 높이(offT·offB)에 점수판·폰 버튼 자리를 더해 비운다

  const pts = [[-4.7, 0, HL + 0.7], [4.7, 0, HL + 0.7], [-3.2, 0, HL + 1.0], [3.2, 0, HL + 1.0], [-1.6, 1.4, HL + 1.0], [1.6, 1.4, HL + 1.0], [-5.1, 0, -HL], [5.1, 0, -HL], [-1.6, 1.6, -HL - 1.6], [1.6, 1.6, -HL - 1.6], [0, 1.7, -HL - 1.2]];

// 먼 끝 배경판: 화면 위 끝(가운데)이 판 위치에서 닿는 높이를 구해, 그림 속 관중과 하늘이 그 안에 다 들어오게 크기를 맞춘다.

  go(){ if (!st) return; st.running = true; acc = 0; if (st.host) st.m.pt = 0; },
  onNet(d){
    if (!st || !d || typeof d !== 'object') return;
    const now = performance.now();
    if (st.host){ if (d.k === 'in') hostIn(d, now); return; }
    if (d.k === 'st') applySnap(d, now);
    else if (d.k === 'ev' && Array.isArray(d.l)){
      for (const e of d.l.slice(0, 40)){
        if (!Array.isArray(e)) continue;
        if (e[0] === 'hit' && e[1] === st.mySeat){ st.gv.P[st.mySeat].armed = null; }
        fx(e, now);
      }
    }
  },
  stop(){ if (st) st.stopped = true; joyReset(); for (const k in keys) keys[k] = false; },
  lost(){ return false; },    // 방장 권위라 손님이 결과를 다시 보낼 일이 없다
  resize(){
    if (!renderer || !stage) return;
    const gm = $('vsGame'), gr = gm.getBoundingClientRect(), sr = stage.getBoundingClientRect();
    W = Math.max(200, gm.clientWidth || innerWidth); H = Math.max(200, gm.clientHeight || innerHeight);
    offT = Math.max(0, sr.top - gr.top); offB = Math.max(0, gr.bottom - sr.bottom);
    if (!sr.height){ offT = 58; offB = 56; }                     // 아직 안 보일 때 대강값
    renderer.setSize(W, H, false);
    fitCamera();
  },
  drawArt(x, w, h, t){ drawArt(x, w, h, t); },
};

// ---------- 메뉴 그림: 공이 튀어 라켓에 맞고 돌아가는 반복 ----------
function drawArt(x, w, h, t){
  const T = 1700, u = (t % T) / T, gy = h - 10, r = clamp(h * 0.075, 5, 11);
  x.fillStyle = '#C8683F'; x.fillRect(w * 0.08, gy, w * 0.84, 8);
  x.fillStyle = '#F4EFE6'; x.fillRect(w * 0.08, gy, w * 0.84, 2);
  const nh = h * 0.3; x.fillStyle = 'rgba(28,35,64,.8)'; for (let i = 0; i < 5; i++) x.fillRect(w * 0.42 - 1, gy - nh + i * nh / 5, 2, nh / 5 - 1);
  x.fillStyle = '#F4EFE6'; x.fillRect(w * 0.42 - 5, gy - nh - 2, 10, 3);
  // 라켓: 오른쪽 손잡이를 축으로 뒤로 뺐다가 휘두름
  const px = w * 0.84, py = h * 0.78, L = h * 0.34, R = h * 0.16;
  const ang = u < 0.52 ? 0.95 : u < 0.64 ? lerp(0.95, -0.55, easeOut((u - 0.52) / 0.12)) : u < 0.82 ? lerp(-0.55, -1.2, (u - 0.64) / 0.18) : lerp(-1.2, 0.95, (u - 0.82) / 0.18);
  const hx0 = px + L * Math.sin(-0.55) * 1, hy0 = py - L * Math.cos(-0.55) - R * 0.2;   // 맞는 순간 라켓 면 가운데
  const A = [w * 0.12, h * 0.12], B = [w * 0.6, gy - r], Cc = [hx0 - R * 0.3, hy0], D = [w * 0.08, h * 0.06];
  let bx, by;
  if (u < 0.4){ const k = u / 0.4; bx = lerp(A[0], B[0], k); by = A[1] + (B[1] - A[1]) * k * k; }
  else if (u < 0.6){ const k = (u - 0.4) / 0.2; bx = lerp(B[0], Cc[0], k); by = B[1] - (B[1] - Cc[1]) * (1 - (1 - k) * (1 - k)); }
  else { const k = (u - 0.6) / 0.4; bx = lerp(Cc[0], D[0], k); by = lerp(Cc[1], D[1], k) - Math.sin(k * Math.PI) * h * 0.3; }
  // 그림자
  const hgt = clamp((gy - by) / h, 0, 1);
  x.fillStyle = `rgba(60,25,10,${0.35 - hgt * 0.2})`; x.beginPath(); x.ellipse(bx, gy + 3, r * (1.1 - hgt * 0.4), r * 0.3, 0, 0, 7); x.fill();
  // 라켓
  x.save(); x.translate(px, py); x.rotate(ang);
  x.strokeStyle = '#1C2340'; x.lineWidth = Math.max(4, h * 0.035); x.lineCap = 'round'; x.beginPath(); x.moveTo(0, 0); x.lineTo(0, -L * 0.55); x.stroke();
  x.save(); x.translate(0, -L - R * 0.2 + R * 0.2); x.beginPath(); x.ellipse(0, 0, R * 0.78, R, 0, 0, 7); x.fillStyle = 'rgba(255,255,255,.14)'; x.fill();
  x.save(); x.clip(); x.strokeStyle = 'rgba(255,255,255,.7)'; x.lineWidth = 1; for (let i = -R; i <= R; i += R / 4.5){ x.beginPath(); x.moveTo(i, -R); x.lineTo(i, R); x.stroke(); x.beginPath(); x.moveTo(-R, i); x.lineTo(R, i); x.stroke(); } x.restore();
  x.strokeStyle = '#E05A1E'; x.lineWidth = Math.max(3, h * 0.03); x.beginPath(); x.ellipse(0, 0, R * 0.78, R, 0, 0, 7); x.stroke(); x.restore();
  x.restore();
  // 공
  x.fillStyle = '#DDF33C'; x.beginPath(); x.arc(bx, by, r, 0, 7); x.fill();
  x.strokeStyle = 'rgba(255,255,255,.9)'; x.lineWidth = Math.max(1.2, r * 0.16);
  x.beginPath(); x.arc(bx - r * 0.95, by, r * 0.75, -0.9, 0.9); x.stroke(); x.beginPath(); x.arc(bx + r * 0.95, by, r * 0.75, Math.PI - 0.9, Math.PI + 0.9); x.stroke();
  if (u > 0.58 && u < 0.72){ const k = (u - 0.58) / 0.14; x.strokeStyle = `rgba(255,255,255,${1 - k})`; x.lineWidth = 3; x.beginPath(); x.arc(Cc[0], Cc[1], r * (1.2 + k * 2.4), 0, 7); x.stroke(); }
}

// ---------- 시험용(기본 동작은 그대로) ----------
// __tnBot(): 부르면 약 0.7초 동안 내 선수를 컴퓨터 두뇌로 움직인다(시험 스크립트가 0.1초마다 부름)
window.__tnBot = () => { if (!st) return 'none'; st.botT = performance.now(); return st.host ? st.m.phase : st.gv.phase; };
window.__tnTest = { Score, Match, inBox, inCourt, netH, solve, simLand, predict, NOC, aiCtrl, HL, HW, SV, BR, DT };
window.__tnInfo = () => st ? { phase: (st.host ? st.m : st.gv).phase, sc: (st.host ? st.m.sc.p : st.gv.sc.p).slice(), fps: window.__tnFps, pr: PR, W, H, fov: cam && +cam.fov.toFixed(1), cam: camBase, rtt: st.rtt } : null;

VS.init(G);
</script>
