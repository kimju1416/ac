function makeSlide(d,type,scale){
  const isPPT=type==='ppt';
  const bw=isPPT?360:196,bh=isPPT?202:261;
  const W=Math.round(bw*scale),H=Math.round(bh*scale);
  return `<div style="position:relative;width:${W}px;height:${H}px;overflow:hidden;border-radius:${Math.round(6*scale)}px;flex-shrink:0">${d.render(W,H,scale)}</div>`;
}
function buildGallery(designs,type,cid){
  const el=document.getElementById(cid);
  const isPPT=type==='ppt';
  const BW=isPPT?360:196, BH=isPPT?202:261;
  const ratio=(BH/BW*100).toFixed(3);
  const vw=window.innerWidth;
  let cols;
  if(isPPT){
    if(vw<480)cols='repeat(2,1fr)';
    else if(vw<768)cols='repeat(3,1fr)';
    else cols='repeat(auto-fill,minmax(260px,1fr))';
  }else{
    if(vw<480)cols='repeat(3,1fr)';
    else if(vw<768)cols='repeat(4,1fr)';
    else cols='repeat(auto-fill,minmax(160px,1fr))';
  }
  el.style.gridTemplateColumns=cols;
  el.innerHTML='';
  designs.forEach(d=>{
    const it=document.createElement('div');
    it.className='gi';
    // padding-top trick: maintains aspect ratio, inner slide scales via transform
    it.innerHTML=`<div class="pw" style="position:relative;overflow:hidden;width:100%;padding-top:${ratio}%;background:#fff"><div class="svw" style="position:absolute;top:0;left:0;width:${BW}px;height:${BH}px;transform-origin:top left">${d.render(BW,BH,1)}</div><div class="dn" style="z-index:3">${String(d.id).padStart(2,'0')}</div></div><div class="ii"><div class="nm">${d.name}</div><div class="tg">${d.tag}</div></div>`;
    it.onclick=()=>{
      const sc=isPPT?1.9:1.65;
      document.getElementById('mplabel').textContent='레이아웃 프롬프트';
      document.getElementById('mpr').innerHTML=makeSlide(d,type,sc);
      document.getElementById('mnm').textContent=d.name;
      document.getElementById('mtg').textContent=d.tag;
      document.getElementById('mmt').textContent=`#${d.id} · ${isPPT?'웹슬라이드':'카드뉴스'} 디자인`;
      const pm=isPPT?PP:CP;
      document.getElementById('mprompt').textContent=pm[d.id]||d.name+' — '+d.tag;
      const cb=document.getElementById('mcopy');cb.textContent='복사';cb.style.background='rgba(255,255,255,.08)';cb.style.color='rgba(255,255,255,.6)';
      document.getElementById('ovl').classList.add('on');
    };
    el.appendChild(it);
  });
  // scale each thumbnail to fit container width
  function applyScales(){
    el.querySelectorAll('.pw').forEach(pw=>{
      const w=pw.offsetWidth;
      if(w>0){const svw=pw.querySelector('.svw');if(svw)svw.style.transform=`scale(${w/BW})`;}
    });
  }
  requestAnimationFrame(()=>setTimeout(applyScales,30));
  window.addEventListener('resize',()=>{
    const vw=window.innerWidth;
    if(isPPT){
      if(vw<480)el.style.gridTemplateColumns='repeat(2,1fr)';
      else if(vw<768)el.style.gridTemplateColumns='repeat(3,1fr)';
      else el.style.gridTemplateColumns='repeat(auto-fill,minmax(260px,1fr))';
    }else{
      if(vw<480)el.style.gridTemplateColumns='repeat(3,1fr)';
      else if(vw<768)el.style.gridTemplateColumns='repeat(4,1fr)';
      else el.style.gridTemplateColumns='repeat(auto-fill,minmax(160px,1fr))';
    }
    applyScales();
  });
}
document.getElementById('mcl').onclick=()=>document.getElementById('ovl').classList.remove('on');

document.querySelectorAll('.tb').forEach(b=>b.onclick=()=>{

  document.querySelectorAll('.tc').forEach(x=>x.classList.remove('on'));

function selectAll(el){
  const r=document.createRange();r.selectNodeContents(el);
  const s=window.getSelection();s.removeAllRanges();s.addRange(r);
}
function copyPrompt(){
  const t=document.getElementById('mprompt').textContent;
  const b=document.getElementById('mcopy');
  function ok(){
    b.textContent='✅ 복사됨!';b.style.background='#0a2a0a';b.style.color='#4ade80';b.style.borderColor='#4ade80';
    setTimeout(()=>{b.textContent='📋 복사';b.style.background='#222';b.style.color='#aaa';b.style.borderColor='#333';},2500);
  }
  function fallback(){
    const el=document.createElement('textarea');
    el.value=t;el.style.cssText='position:fixed;left:-9999px;top:0;opacity:0';
    document.body.appendChild(el);el.focus();el.select();
    try{document.execCommand('copy');ok();}catch(e){
      b.textContent='⚠ 직접 선택하세요';b.style.color='#facc15';
      setTimeout(()=>{b.textContent='📋 복사';b.style.color='#aaa';},3000);
    }
    document.body.removeChild(el);
  }
  if(navigator.clipboard&&window.isSecureContext){
    navigator.clipboard.writeText(t).then(ok).catch(fallback);
  } else {
    fallback();
  }
}

function fText(){const v=document.getElementById('ftxt').value.trim();return v||'디자인 갤러리';}
let fontsReady=false,fCat='all';
function loadFonts(){
  if(fontsReady)return;fontsReady=true;
  const gp=FONTS.filter(f=>f.goog).map(f=>'family='+f.goog).join('&');
  const gl=document.createElement('link');gl.rel='stylesheet';
  gl.href='https://fonts.googleapis.com/css2?'+gp+'&display=swap';
  document.head.appendChild(gl);
  FONTS.filter(f=>f.plink).forEach(f=>{
    const l=document.createElement('link');l.rel='stylesheet';l.href=f.plink;document.head.appendChild(l);
  });
  const st=document.createElement('style');
  st.textContent=FONTS.filter(f=>f.face).map(f=>f.face).join('\n');
  document.head.appendChild(st);
  buildFonts();
}
function buildFonts(){
  const el=document.getElementById('fg');
  el.innerHTML='';
  const txt=fText();
  FONTS.forEach(f=>{
    const it=document.createElement('div');
    it.className='gi fi';it.dataset.cat=f.cat;
    it.innerHTML=`<div class="fpw"><div class="fprev" style="font-family:${f.fam};font-weight:${f.w}"></div><div class="dn">${String(f.id).padStart(2,'0')}</div></div><div class="ii"><div class="nm">${f.name}<span class="fe">${f.eng}</span></div><div class="tg">${f.tag}</div></div>`;
    it.querySelector('.fprev').textContent=txt;
    it.onclick=()=>openFontModal(f);
    el.appendChild(it);
  });
  applyFontFilter();
}
function applyFontFilter(){
  document.querySelectorAll('#fg .fi').forEach(e=>{
    e.style.display=(fCat==='all'||e.dataset.cat===fCat)?'':'none';
  });
}
function fontCode(f){
  const use='font-family:'+f.fam+';'+(f.w&&f.w!==400?' font-weight:'+f.w+';':'');
  if(f.goog)return'<link href="https://fonts.googleapis.com/css2?family='+f.goog+'&display=swap" rel="stylesheet">\n\n/* CSS */\n'+use;
  if(f.plink)return'<link href="'+f.plink+'" rel="stylesheet">\n\n/* CSS */\n'+use;
  return'<style>\n'+f.face+'\n</style>\n\n/* CSS */\n'+use;
}
function openFontModal(f){
  document.getElementById('mplabel').textContent='웹폰트 사용 코드 — HTML <head>에 붙여넣기';
  const mp=document.getElementById('mpr');
  mp.innerHTML=`<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px;padding:24px 16px;width:100%"><div class="fmain" style="font-family:${f.fam};font-weight:${f.w};font-size:42px;color:#141414;text-align:center;line-height:1.35;word-break:keep-all;overflow-wrap:break-word;max-width:100%"></div><div style="font-family:${f.fam};font-weight:${f.w};font-size:16px;color:#777;margin-top:16px;text-align:center;line-height:1.7;word-break:keep-all">가나다라마바사 아자차카타파하<br>1234567890 ABCDEFG abcdefg</div></div>`;
  mp.querySelector('.fmain').textContent=fText();
  document.getElementById('mnm').textContent=f.name+' ('+f.eng+')';
  document.getElementById('mtg').textContent=f.tag;
  document.getElementById('mmt').textContent='#'+String(f.id).padStart(2,'0')+' · 글씨체 · 제공: '+(f.src||'Google Fonts');
  document.getElementById('mprompt').textContent=fontCode(f);
  const cb=document.getElementById('mcopy');cb.textContent='복사';cb.style.background='rgba(255,255,255,.08)';cb.style.color='rgba(255,255,255,.6)';
  document.getElementById('ovl').classList.add('on');
}
document.getElementById('ftxt').addEventListener('input',()=>{
  if(!fontsReady)return;
  const t=fText();
  document.querySelectorAll('#fg .fprev').forEach(e=>e.textContent=t);
});
document.getElementById('fsize').addEventListener('input',e=>{
  document.getElementById('fg').style.setProperty('--fs',e.target.value+'px');
  document.getElementById('fszv').textContent=e.target.value+'px';
});
document.querySelectorAll('.fchip').forEach(c=>c.onclick=()=>{
  document.querySelectorAll('.fchip').forEach(x=>x.classList.remove('on'));
  c.classList.add('on');fCat=c.dataset.c;applyFontFilter();
});
